<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="ptc-no-sw" content="1">
    <title>IT Support Center - Powertech</title>
    <link rel="manifest" href="app-manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="uploads/logos/powertech_app_icon.png" type="image/png">
    <link rel="apple-touch-icon" href="uploads/logos/powertech_app_icon.png">
    <script src="js/favicon-version.js"></script>
    <link rel="stylesheet" href="css/fonts/inter-kanit-local.css">
    <link rel="stylesheet" href="css/vendor/fontawesome.min.css"/>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/enterprise-theme.css?v=20261021">
    <link rel="stylesheet" href="css/index.css?v=20261022e">
    <link rel="stylesheet" href="css/ptc-unified-global.css?v=20260529">
    <script>(function(){const t=localStorage.getItem('theme')||'light';if(t==='dark')document.documentElement.classList.add('dark','dark-theme');})();</script>
</head>
<body class="index-page-root">
<div id="sidebar-overlay" onclick="closeSidebar()"></div>
<nav class="ptc-nav">
    <button class="ptc-hamburger" onclick="toggleSidebar()" title="เมนู" aria-label="เปิดเมนู">
        <i class="fa fa-bars"></i>
    </button>
    <div class="ptc-nav-brand">
        <img id="navLogoImg" class="index-nav-logo" src="uploads/logos/pta_logo.png" onerror="this.style.display='none';document.getElementById('navLogoIcon').style.display='flex'">
        <div class="ptc-nav-icon nav-logo-fallback-hidden" id="navLogoIcon"><i class="fa fa-headset"></i></div>
        <div class="ptc-nav-title" id="companyTitle">Powertech IT</div>
    </div>
    <div class="nav-search-wrap">
        <div class="nav-search">
            <i class="fa fa-search nav-search-icon"></i>
            <input type="text" class="nav-search-input" id="searchInput" placeholder="ค้นหาบริการ...">
            <span class="nav-search-kbd" id="searchShortcutHint">Ctrl+K</span>
        </div>
    </div>
    <div class="nav-right-actions">
        <button class="nav-back notif-trigger" id="notifBtn" onclick="openNotifModal()" title="การแจ้งเตือน" aria-label="การแจ้งเตือน">
            <i class="fa fa-bell"></i>
            <span id="notifBadge" class="notification-badge hidden">0</span>
        </button>
        <div class="nav-user-chip" id="navUserChip" onclick="toggleUserDropdown(event)" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
            <div class="nav-user-avatar" id="navUserAvatar">U</div>
            <div class="nav-user-info">
                <div class="nav-user-name" id="navUserName">User</div>
                <div class="nav-user-role" id="navUserRole">พนักงาน</div>
            </div>
            <i class="fa fa-chevron-down nav-user-chevron" id="navUserChevron"></i>
        </div>
        <div class="nav-user-dropdown" id="navUserDropdown">
            <button class="nav-ud-item" onclick="toggleDark();closeUserDropdown()">
                <i class="fa fa-moon" id="themeIcon"></i><span>สลับธีม</span>
            </button>
            <div class="nav-ud-divider"></div>
            <button class="nav-ud-item nav-ud-logout" onclick="handleLogout()">
                <i class="fa fa-sign-out-alt"></i><span>ออกจากระบบ</span>
            </button>
        </div>
    </div>
</nav>
<div class="ptc-app-shell">
    <aside class="ptc-sidebar" id="sidebar-left">
        <nav class="sidebar-nav-stack">
            <!-- จัดใหม่ 23 ต.ค. 2026: ของพนักงานทุกคน (ของฉัน / ช่วยเหลือ) · เจ้าหน้าที่เห็นทางเข้าระบบจัดการช่องเดียว (เลิก IT Portal ที่ซ้ำ) -->
            <a href="index.html" class="snav snav-item active" aria-current="page"><span class="snav-icon" style="--icon-bg:#dbeafe;--icon-color:#2563eb"><i class="fa fa-home"></i></span><span class="snav-label">หน้าแรก</span></a>
            <p class="index-sidebar-mgmt-label">ของฉัน</p>
            <a href="request.html?tab=tickets" class="snav snav-item"><span class="snav-icon" style="--icon-bg:#fee2e2;--icon-color:#dc2626"><i class="fa fa-screwdriver-wrench"></i></span><span class="snav-label">งานแจ้งซ่อมของฉัน</span><span class="snav-badge hidden" id="myTicketBadge"></span></a>
            <a href="loan.html?tab=mine" class="snav snav-item"><span class="snav-icon" style="--icon-bg:#ffedd5;--icon-color:#ea580c"><i class="fa fa-rotate"></i></span><span class="snav-label">ประวัติยืมอุปกรณ์</span></a>
            <a href="stock_request.html?tab=mine" class="snav snav-item"><span class="snav-icon" style="--icon-bg:#dbeafe;--icon-color:#2563eb"><i class="fa fa-boxes-stacked"></i></span><span class="snav-label">ประวัติเบิกของ</span></a>
            <p class="index-sidebar-mgmt-label">ช่วยเหลือ</p>
            <a href="kb.html" class="snav snav-item"><span class="snav-icon" style="--icon-bg:#e0f2fe;--icon-color:#0284c7"><i class="fa fa-book-open"></i></span><span class="snav-label">คลังความรู้ / วิธีแก้ปัญหา</span></a>
            <a href="docs/help.html" class="snav snav-item"><span class="snav-icon" style="--icon-bg:#d1fae5;--icon-color:#059669"><i class="fa fa-circle-question"></i></span><span class="snav-label">คู่มือการใช้งาน</span></a>

            <hr class="snav-divider index-sidebar-mgmt-divider hidden" id="sidebarMgmtDivider">
            <p class="index-sidebar-mgmt-label hidden" id="sidebarMgmtLabel">สำหรับเจ้าหน้าที่</p>
            <a href="admin.html" class="snav snav-item index-sidebar-mgmt-link index-admin-link-hidden" id="adminLink"><span class="snav-icon" style="--icon-bg:#ede9fe;--icon-color:#7c3aed"><i class="fa fa-gauge-high"></i></span><span class="snav-label">ระบบจัดการ</span><span class="snav-badge hidden" id="mgmtBadge"></span></a>
        </nav>
    </aside>
    <main class="ptc-main-scroll" id="main-scroll">
        <div class="main-content-pad home2">
            <div class="welcome-row">
                <div>
                    <div class="welcome-title" id="welcomeText">สวัสดี 👋</div>
                    <div class="welcome-date" id="dateText"></div>
                </div>
            </div>
            <div class="h2-msearch"><i class="fa fa-search"></i><input type="search" id="mSearchInput" placeholder="ค้นหาบริการ..." aria-label="ค้นหาบริการ"></div>

            <!-- ปุ่มลัดงานที่ทำบ่อย (ซ่อนปุ่มที่ระบบปลายทางปิดอยู่) -->
            <div class="h2-quick" id="quickRow"></div>

            <div class="h2-cols">
                <section>
                    <div class="h2-sec">บริการทั้งหมด</div>
                    <div class="h2-groups" id="appGrid"></div>
                    <div class="h2-nores" id="noResult" style="display:none">ไม่พบบริการที่ค้นหา</div>
                </section>
                <aside class="h2-side">
                    <div class="h2-panel" id="my-status-content">
                        <div class="status-card-loading"><i class="fas fa-spinner fa-spin"></i></div>
                    </div>
                </aside>
            </div>
        </div>
    </main>
</div>

<div id="notifModal" class="ptc-modal index-notif-modal-hidden">
    <div class="ptc-modal-overlay" onclick="closeNotifModal()"></div>
    <div class="ptc-modal-dialog notif-dialog">
        <div class="ptc-modal-header">
            <div class="notif-title">การแจ้งเตือน</div>
            <button onclick="closeNotifModal()" class="notif-close-btn"><i class="fa fa-times"></i></button>
        </div>
        <div class="ptc-modal-body notif-list-wrap" id="notifList"></div>
    </div>
</div>


<script src="js/index-home.js?v=20261023c" defer></script>
</body>
</html>
