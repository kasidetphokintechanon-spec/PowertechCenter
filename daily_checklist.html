<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Routine Checklist - Powertech System</title>
    <link rel="manifest" href="app-manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="uploads/logos/pta_logo.png">
    <script src="js/pwa.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                fontFamily: { sans: ['Kanit', 'sans-serif'] },
                extend: {
                    colors: {
                        pt4: '#dc2626',
                        pta: '#16a34a',
                        pte: '#0ea5e9'
                    }
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; margin: 0; padding-bottom: 80px; }
        .glass-nav { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(148,163,184,0.2); }
        .company-tab { padding: 8px 18px; border-radius: 999px; border: 1px solid transparent; font-size: 0.9rem; cursor: pointer; background: #e2e8f0; color: #475569; }
        .company-tab.active.pta { background: #16a34a; color: #fff; border-color: #16a34a; }
        .company-tab.active.pt4 { background: #dc2626; color: #fff; border-color: #dc2626; }
        .company-tab.active.pte { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
        .card { background: #fff; border-radius: 16px; padding: 16px 16px 12px 16px; box-shadow: 0 2px 10px rgba(15,23,42,0.06); border: 1px solid #e2e8f0; display: flex; gap: 12px; align-items: flex-start; }
        .card.done { border-color: #22c55e; background: #ecfdf3; }
        .card-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; background: #e2e8f0; color: #475569; }
        .card-title { font-size: 1rem; font-weight: 600; color: #0f172a; }
        .card-desc { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
        .status-pill { font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
        .status-pill.pending { background: #fee2e2; color: #b91c1c; }
        .status-pill.done { background: #dcfce7; color: #15803d; }
        .btn-check { padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-check.primary { background: #0f172a; color: #fff; }
        .btn-check.outline { background: transparent; color: #0f172a; border: 1px solid #cbd5f5; }
        .badge-date { font-size: 0.8rem; color: #64748b; }
        .report-row { border-bottom: 1px dashed #e2e8f0; padding: 8px 0; font-size: 0.9rem; }
        .report-row:last-child { border-bottom: none; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 999px; box-shadow: 0 10px 20px rgba(15,23,42,0.4); opacity: 0; transition: 0.3s; z-index: 3000; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.error { background: #b91c1c; }
        #toast.success { background: #16a34a; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(248,250,252,0.85); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .spinner { width: 32px; height: 32px; border-radius: 999px; border: 4px solid #e2e8f0; border-top-color: #0f172a; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tab-button { padding: 8px 16px; border-radius: 999px; font-size: 0.85rem; border: none; cursor: pointer; background: #e2e8f0; color: #475569; }
        .tab-button.active { background: #0f172a; color: #fff; }
    </style>
    <style>
        /* === PTC Design System supplements for daily_checklist.html === */

        /* Focus ring */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--ptc-primary, #2563eb) !important;
            box-shadow: 0 0 0 3px var(--ptc-primary-ring, rgba(37,99,235,.15)) !important;
        }

        /* Checklist card hover */
        .card { transition: box-shadow .2s ease, transform .15s ease; }
        .card:hover { box-shadow: var(--ptc-shadow-md, 0 4px 12px rgba(0,0,0,.08)); transform: translateY(-1px); }

        /* Better done state */
        .card.done { border-color: var(--ptc-success, #059669); background: var(--ptc-success-bg, #ecfdf5); }

        h1, h2, h3, h4 { letter-spacing: -0.01em; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--ptc-border, #cbd5e1); border-radius: 3px; }
    </style>
</head>
<body class="ptc-normalize">
    <div id="loading" class="loading-overlay" style="display:none;"><div class="spinner"></div></div>
    <div id="toast"></div>

    <nav class="glass-nav sticky top-0 z-40 px-4 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-100 flex items-center justify-center text-slate-600 hover:bg-slate-200">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <div class="text-sm text-slate-400">Daily Routine</div>
                <div class="text-base font-semibold text-slate-800">IT Daily Checklist</div>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <input id="datePicker" type="date" class="border border-slate-200 text-sm rounded-lg px-2 py-1.5 text-slate-700" />
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 pt-4 pb-10">
        <section class="mb-4 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <button class="company-tab pta active" data-company="PTA">PTA</button>
                <button class="company-tab pte" data-company="PTE">PTE</button>
                <button class="company-tab pt4" data-company="PT4">PT4</button>
            </div>
            <div class="flex items-center gap-3 text-xs text-slate-500">
                <div class="flex items-center gap-2">
                    <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> ตรวจแล้ว</span>
                    <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> ยังไม่ตรวจ</span>
                </div>
                <div class="flex items-center gap-1">
                    <span class="text-slate-500">ตึก:</span>
                    <select id="buildingFilter" class="border border-slate-200 text-xs rounded-lg px-2 py-1 text-slate-700 bg-white min-w-[90px]">
                        <option value="">ทั้งหมด</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="mb-6 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <button id="tabToday" class="tab-button active" data-view="today">เช็คลิสต์วันนี้</button>
                <button id="tabReport" class="tab-button" data-view="report">สถิติย้อนหลัง</button>
            </div>
            <button id="btnManageTemplates" class="text-xs px-3 py-1.5 rounded-full border border-slate-300 text-slate-600 hover:bg-slate-50">
                <i class="fas fa-sliders-h mr-1"></i> จัดการรายการเช็คลิสต์
            </button>
        </section>

        <section id="todaySection">
            <div id="checklistContainer" class="flex flex-col gap-3"></div>
            <div id="emptyState" class="text-center text-slate-400 text-sm mt-6" style="display:none;">
                ยังไม่มีรายการเช็คลิสต์สำหรับบริษัทนี้
            </div>
        </section>

        <section id="reportSection" style="display:none;">
            <div class="card mb-4">
                <div class="flex flex-col gap-3 w-full">
                    <div class="flex flex-wrap gap-3 items-end justify-between">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-slate-500">ช่วงวันที่</label>
                            <div class="flex items-center gap-2">
                                <input id="reportStart" type="date" class="border border-slate-200 text-xs rounded-lg px-2 py-1 text-slate-700" />
                                <span class="text-xs text-slate-400">ถึง</span>
                                <input id="reportEnd" type="date" class="border border-slate-200 text-xs rounded-lg px-2 py-1 text-slate-700" />
                            </div>
                        </div>
                        <button id="btnLoadReport" class="btn-check primary text-xs">
                            <i class="fas fa-chart-line"></i><span>โหลดรายงาน</span>
                        </button>
                    </div>
                    <div id="reportSummary" class="mt-2 text-xs text-slate-500"></div>
                </div>
            </div>
            <div id="reportList" class="card flex-col gap-1"></div>
        </section>
    </main>

    <div id="templateModal" class="fixed inset-0 bg-black/40 flex items-center justify-center z-50" style="display:none;">
        <div class="bg-white rounded-2xl w-full max-w-xl max-h-[90vh] overflow-hidden flex flex-col">
            <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                <div>
                    <div class="text-sm font-semibold text-slate-800">จัดการรายการเช็คลิสต์</div>
                    <div class="text-xs text-slate-500">กำหนดรายการประจำวันสำหรับแต่ละบริษัท</div>
                </div>
                <button id="btnCloseTemplateModal" class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500">
                    <i class="fas fa-times text-xs"></i>
                </button>
            </div>
            <div class="px-4 py-2 border-b border-slate-100 flex items-center gap-2 text-xs">
                <select id="templateCompany" class="border border-slate-200 rounded-lg px-2 py-1 text-xs text-slate-700">
                    <option value="PTA">PTA</option>
                    <option value="PTE">PTE</option>
                    <option value="PT4">PT4</option>
                    <option value="">ใช้ร่วมกันทุกบริษัท</option>
                </select>
                <button id="btnNewTemplate" class="btn-check primary text-xs">
                    <i class="fas fa-plus"></i><span>เพิ่มรายการ</span>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto px-4 py-3">
                <div id="templateList" class="flex flex-col gap-2 text-xs"></div>
            </div>
            <div class="px-4 py-2 text-right text-[10px] text-slate-400 border-t border-slate-100">
                รายการที่ปิดใช้งานจะไม่แสดงในเช็คลิสต์รายวัน
            </div>
        </div>
    </div>

    <script>
        let currentCompany = 'PTA';
        let currentDate = new Date().toISOString().slice(0, 10);
        let templatesCache = [];
        let currentBuilding = '';

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = '';
            toast.className = '';
            toast.id = 'toast';
            toast.classList.add(type === 'error' ? 'error' : 'success');
            toast.classList.add('show');
            toast.insertAdjacentHTML('beforeend', '<span>' + message + '</span>');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2200);
        }

        function setLoading(show) {
            document.getElementById('loading').style.display = show ? 'flex' : 'none';
        }

        async function loadChecklist() {
            setLoading(true);
            try {
                const res = await fetch(`api.php?action=daily_checklist_get&company=${encodeURIComponent(currentCompany)}&date=${encodeURIComponent(currentDate)}&v=${Date.now()}`);
                const data = await res.json();
                if (data.status !== 'success') {
                    showToast(data.message || 'ไม่สามารถโหลดเช็คลิสต์ได้', 'error');
                    return;
                }
                renderChecklist(data.items || []);
            } catch (e) {
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            } finally {
                setLoading(false);
            }
        }

        function renderChecklist(items) {
            const container = document.getElementById('checklistContainer');
            const empty = document.getElementById('emptyState');
            container.innerHTML = '';
            const buildingSelect = document.getElementById('buildingFilter');

            const buildings = Array.from(new Set(items.map(i => i.category).filter(Boolean))).sort();
            buildingSelect.innerHTML = '<option value="">ทั้งหมด</option>';
            buildings.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                buildingSelect.appendChild(opt);
            });
            if (!currentBuilding) {
                buildingSelect.value = '';
            } else if (buildings.includes(currentBuilding)) {
                buildingSelect.value = currentBuilding;
            } else {
                currentBuilding = '';
                buildingSelect.value = '';
            }

            let displayItems = items;
            if (currentBuilding) {
                displayItems = items.filter(i => i.category === currentBuilding);
            }

            if (!displayItems.length) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            displayItems.forEach(item => {
                const done = item.status === 'done';
                const card = document.createElement('div');
                card.className = 'card' + (done ? ' done' : '');
                const iconWrap = document.createElement('div');
                iconWrap.className = 'mt-1';
                iconWrap.innerHTML = done
                    ? '<div class="w-7 h-7 rounded-full bg-emerald-500 flex items-center justify-center text-white"><i class="fas fa-check"></i></div>'
                    : '<div class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center text-slate-500"><i class="fas fa-circle-notch"></i></div>';
                const content = document.createElement('div');
                content.className = 'flex-1 min-w-0';
                const topRow = document.createElement('div');
                topRow.className = 'flex items-start justify-between gap-2';
                const left = document.createElement('div');
                left.className = 'min-w-0';
                const title = document.createElement('div');
                title.className = 'card-title';
                title.textContent = item.title;
                left.appendChild(title);
                if (item.description) {
                    const desc = document.createElement('div');
                    desc.className = 'card-desc';
                    desc.textContent = item.description;
                    left.appendChild(desc);
                }
                if (item.category) {
                    const badge = document.createElement('span');
                    badge.className = 'card-badge';
                    badge.textContent = item.category;
                    left.appendChild(badge);
                }
                const right = document.createElement('div');
                right.className = 'flex flex-col items-end gap-2';
                const pill = document.createElement('div');
                pill.className = 'status-pill ' + (done ? 'done' : 'pending');
                pill.innerHTML = done
                    ? '<i class="fas fa-check-circle"></i><span>ตรวจแล้ว</span>'
                    : '<i class="fas fa-clock"></i><span>ยังไม่ตรวจ</span>';
                right.appendChild(pill);
                const btn = document.createElement('button');
                btn.className = 'btn-check ' + (done ? 'outline' : 'primary');
                btn.innerHTML = done
                    ? '<i class="fas fa-undo"></i><span>ยกเลิก</span>'
                    : '<i class="fas fa-check"></i><span>ตรวจแล้ว</span>';
                btn.onclick = () => toggleChecklist(item.id, !done);
                right.appendChild(btn);
                topRow.appendChild(left);
                topRow.appendChild(right);
                content.appendChild(topRow);
                if (done && item.checked_at) {
                    const meta = document.createElement('div');
                    meta.className = 'mt-2 text-[11px] text-slate-500 text-right';
                    const by = item.checked_by ? item.checked_by : '';
                    meta.textContent = 'ตรวจโดย ' + by + ' เมื่อ ' + item.checked_at;
                    content.appendChild(meta);
                }
                card.appendChild(iconWrap);
                card.appendChild(content);
                container.appendChild(card);
            });
        }

        async function toggleChecklist(itemId, done) {
            setLoading(true);
            try {
                const payload = {
                    item_id: itemId,
                    date: currentDate,
                    company: currentCompany,
                    done: done
                };
                const res = await fetch('api.php?action=daily_checklist_toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: 'data=' + encodeURIComponent(JSON.stringify(payload))
                });
                const data = await res.json();
                if (data.status !== 'success') {
                    showToast(data.message || 'ไม่สามารถอัปเดตสถานะได้', 'error');
                    return;
                }
                showToast(done ? 'บันทึกว่า “ตรวจแล้ว”' : 'ยกเลิกการตรวจแล้ว', 'success');
                loadChecklist();
            } catch (e) {
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            } finally {
                setLoading(false);
            }
        }

        async function loadTemplates() {
            try {
                const res = await fetch(`api.php?action=daily_checklist_templates_get&company=${encodeURIComponent(document.getElementById('templateCompany').value)}&v=${Date.now()}`);
                const data = await res.json();
                if (data.status === 'success') {
                    templatesCache = data.items || [];
                    renderTemplateList();
                } else {
                    showToast(data.message || 'ไม่สามารถโหลดรายการเช็คลิสต์ได้', 'error');
                }
            } catch (e) {
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            }
        }

        function renderTemplateList() {
            const list = document.getElementById('templateList');
            list.innerHTML = '';
            if (!templatesCache.length) {
                list.innerHTML = '<div class="text-center text-slate-400 py-4">ยังไม่มีรายการ</div>';
                return;
            }
            templatesCache.forEach(item => {
                const row = document.createElement('div');
                row.className = 'flex items-center justify-between gap-2 border border-slate-200 rounded-lg px-2 py-1.5';
                const left = document.createElement('div');
                left.className = 'flex-1 min-w-0';
                const title = document.createElement('div');
                title.className = 'font-medium text-slate-800 truncate';
                title.textContent = item.title;
                left.appendChild(title);
                if (item.category) {
                    const cat = document.createElement('div');
                    cat.className = 'text-[11px] text-slate-500';
                    cat.textContent = item.category;
                    left.appendChild(cat);
                }
                const right = document.createElement('div');
                right.className = 'flex items-center gap-1';
                const toggle = document.createElement('button');
                toggle.className = 'px-2 py-1 rounded-full text-[10px] ' + (item.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500');
                toggle.textContent = item.is_active ? 'ใช้งาน' : 'ปิด';
                toggle.onclick = () => saveTemplate({ ...item, is_active: item.is_active ? 0 : 1 });
                const edit = document.createElement('button');
                edit.className = 'w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-500';
                edit.innerHTML = '<i class="fas fa-pen text-[10px]"></i>';
                edit.onclick = () => openTemplateEditor(item);
                const del = document.createElement('button');
                del.className = 'w-6 h-6 rounded-full bg-rose-50 flex items-center justify-center text-rose-500';
                del.innerHTML = '<i class="fas fa-trash text-[10px]"></i>';
                del.onclick = () => deleteTemplate(item.id);
                right.appendChild(toggle);
                right.appendChild(edit);
                right.appendChild(del);
                row.appendChild(left);
                row.appendChild(right);
                list.appendChild(row);
            });
        }

        function openTemplateEditor(item) {
            Swal.fire({
                title: item && item.id ? 'แก้ไขรายการเช็คลิสต์' : 'เพิ่มรายการเช็คลิสต์',
                html: `
                    <div class="flex flex-col gap-2 text-left text-sm">
                        <label>ชื่อรายการ</label>
                        <input id="tplTitle" class="swal2-input" style="margin:0;" value="${item ? (item.title || '') : ''}">
                        <label>หมวดหมู่</label>
                        <input id="tplCategory" class="swal2-input" style="margin:0;" value="${item ? (item.category || '') : ''}">
                        <label>รายละเอียด</label>
                        <textarea id="tplDesc" class="swal2-textarea" style="margin:0;min-height:60px;">${item ? (item.description || '') : ''}</textarea>
                        <label>ลำดับแสดง</label>
                        <input id="tplSort" type="number" class="swal2-input" style="margin:0;" value="${item ? (item.sort_order || 0) : 0}">
                    </div>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    const title = document.getElementById('tplTitle').value.trim();
                    if (!title) {
                        Swal.showValidationMessage('กรุณาระบุชื่อรายการ');
                        return false;
                    }
                    return {
                        id: item ? item.id : 0,
                        title,
                        category: document.getElementById('tplCategory').value.trim(),
                        description: document.getElementById('tplDesc').value.trim(),
                        sort_order: parseInt(document.getElementById('tplSort').value || '0', 10)
                    };
                }
            }).then(result => {
                if (result.isConfirmed && result.value) {
                    const company = document.getElementById('templateCompany').value;
                    const payload = {
                        id: result.value.id,
                        company,
                        title: result.value.title,
                        category: result.value.category,
                        description: result.value.description,
                        sort_order: result.value.sort_order,
                        is_active: 1
                    };
                    saveTemplate(payload);
                }
            });
        }

        async function saveTemplate(payload) {
            try {
                const res = await fetch('api.php?action=daily_checklist_templates_save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: 'data=' + encodeURIComponent(JSON.stringify(payload))
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast('บันทึกรายการเช็คลิสต์แล้ว', 'success');
                    loadTemplates();
                    loadChecklist();
                } else {
                    showToast(data.message || 'ไม่สามารถบันทึกรายการได้', 'error');
                }
            } catch (e) {
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            }
        }

        async function deleteTemplate(id) {
            const conf = await Swal.fire({
                title: 'ยืนยันการลบ?',
                text: 'รายการนี้จะถูกปิดการใช้งานจากเช็คลิสต์รายวัน',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ยืนยัน',
                cancelButtonText: 'ยกเลิก'
            });
            if (!conf.isConfirmed) return;
            try {
                const form = new URLSearchParams();
                form.append('id', String(id));
                const res = await fetch('api.php?action=daily_checklist_templates_delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
                    body: form.toString()
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showToast('ปิดการใช้งานรายการแล้ว', 'success');
                    loadTemplates();
                    loadChecklist();
                } else {
                    showToast(data.message || 'ไม่สามารถลบรายการได้', 'error');
                }
            } catch (e) {
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            }
        }

        async function loadReport() {
            setLoading(true);
            try {
                const start = document.getElementById('reportStart').value || currentDate.slice(0, 7) + '-01';
                const end = document.getElementById('reportEnd').value || currentDate;
                const res = await fetch(`api.php?action=daily_checklist_report&company=${encodeURIComponent(currentCompany)}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}&v=${Date.now()}`);
                const data = await res.json();
                if (data.status !== 'success') {
                    showToast(data.message || 'ไม่สามารถโหลดรายงานได้', 'error');
                    return;
                }
                renderReport(data.summary || [], start, end);
            } catch (e) {
                showToast('เกิดข้อผิดพลาดในการเชื่อมต่อ', 'error');
            } finally {
                setLoading(false);
            }
        }

        function renderReport(summary, start, end) {
            const list = document.getElementById('reportList');
            const info = document.getElementById('reportSummary');
            list.innerHTML = '';
            if (!summary.length) {
                list.innerHTML = '<div class="text-center text-slate-400 text-sm py-4">ยังไม่มีข้อมูลในช่วงที่เลือก</div>';
                info.textContent = '';
                return;
            }
            let totalDays = summary.length;
            let daysFull = 0;
            let totalPercent = 0;
            summary.forEach(row => {
                totalPercent += row.percent;
                if (row.total_items > 0 && row.checked_items >= row.total_items) {
                    daysFull += 1;
                }
                const div = document.createElement('div');
                div.className = 'report-row flex items-center justify-between gap-2';
                const left = document.createElement('div');
                left.className = 'text-xs text-slate-700';
                left.textContent = row.date;
                const right = document.createElement('div');
                right.className = 'flex items-center gap-2 text-xs';
                const barWrap = document.createElement('div');
                barWrap.className = 'w-32 h-2 rounded-full bg-slate-100 overflow-hidden';
                const barInner = document.createElement('div');
                barInner.className = 'h-full rounded-full bg-emerald-500';
                barInner.style.width = row.percent + '%';
                barWrap.appendChild(barInner);
                const text = document.createElement('div');
                text.className = 'text-slate-600';
                text.textContent = row.checked_items + '/' + row.total_items + ' (' + row.percent + '%)';
                right.appendChild(barWrap);
                right.appendChild(text);
                div.appendChild(left);
                div.appendChild(right);
                list.appendChild(div);
            });
            const avg = totalPercent / totalDays;
            info.textContent = `ช่วง ${start} ถึง ${end} รวม ${totalDays} วัน: เช็คครบทุกข้อ ${daysFull} วัน, ค่าเฉลี่ย ${avg.toFixed(1)}%`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('datePicker');
            dateInput.value = currentDate;
            document.querySelectorAll('.company-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.company-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCompany = btn.getAttribute('data-company');
                    loadChecklist();
                });
            });
            dateInput.addEventListener('change', () => {
                currentDate = dateInput.value || currentDate;
                loadChecklist();
            });
            const buildingSelect = document.getElementById('buildingFilter');
            buildingSelect.addEventListener('change', () => {
                currentBuilding = buildingSelect.value || '';
                loadChecklist();
            });
            document.getElementById('tabToday').addEventListener('click', () => {
                document.getElementById('tabToday').classList.add('active');
                document.getElementById('tabReport').classList.remove('active');
                document.getElementById('todaySection').style.display = '';
                document.getElementById('reportSection').style.display = 'none';
            });
            document.getElementById('tabReport').addEventListener('click', () => {
                document.getElementById('tabReport').classList.add('active');
                document.getElementById('tabToday').classList.remove('active');
                document.getElementById('todaySection').style.display = 'none';
                document.getElementById('reportSection').style.display = '';
                loadReport();
            });
            document.getElementById('btnManageTemplates').addEventListener('click', () => {
                document.getElementById('templateModal').style.display = 'flex';
                loadTemplates();
            });
        });
    </script>
</body>
</html>
