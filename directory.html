<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory - Contact List</title>
    <meta name="description" content="ค้นหาข้อมูลพนักงาน เบอร์โทรศัพท์ และอีเมลภายในองค์กร">

    <link rel="manifest" href="directory-manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="pwa-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="uploads/logos/directory_app_icon.png">
    <script src="js/pwa.js" defer></script>

    <link rel="stylesheet" href="directory_New/public/xampp/styles.css?v=20260318-lastupdated">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <span class="logo-text">Directory</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="สลับธีม">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>

            <!-- Search -->
            <div class="search-container">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="ค้นหาพนักงาน...">
                <kbd class="search-shortcut" id="searchShortcutKey">⌘K</kbd>
            </div>

            <!-- Stats -->
            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-value" id="totalCount">0</span>
                    <span class="stat-label">ทั้งหมด</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="filteredCount">0</span>
                    <span class="stat-label">แสดง</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="favoriteCount">0</span>
                    <span class="stat-label">ปักหมุด</span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="sidebar-nav">
                <div class="nav-section" id="categorySection">
                    <div class="nav-section-title">หมวดหมู่</div>
                    <button class="nav-item" id="managementNavItem" data-category-key="management" data-filter="management" style="display:none;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="7" width="18" height="14" rx="2"></rect>
                            <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
                            <path d="M3 13h18"></path>
                        </svg>
                        <span id="managementNavLabel" data-category-label="management">ระดับ Management</span>
                        <span class="nav-badge" id="managementBadge">0</span>
                    </button>
                    <button class="nav-item active" id="allNavItem" data-category-key="all" data-filter="all">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span data-category-label="all">พนักงานทั้งหมด</span>
                        <span class="nav-badge" id="allBadge">0</span>
                    </button>
                    <button class="nav-item" id="inactiveNavItem" data-category-key="inactive" data-filter="inactive">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                            <path d="M8 8h8M8 12h8M8 16h5"></path>
                        </svg>
                        <span data-category-label="inactive">พนักงาน Inactive</span>
                        <span class="nav-badge" id="inactiveBadge">0</span>
                    </button>
                    <button class="nav-item" id="favoritesNavItem" data-category-key="favorites" data-filter="favorites">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        <span data-category-label="favorites">ปักหมุด</span>
                        <span class="nav-badge" id="favBadge">0</span>
                    </button>
                    <button class="nav-item" id="executivesNavItem" data-category-key="executives" data-filter="executives">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="m2 4 3 9h14l3-9-6 4-4-4-4 4-6-4"></path>
                            <path d="M5 13v7h14v-7"></path>
                        </svg>
                        <span data-category-label="executives">ผู้บริหาร</span>
                        <span class="nav-badge" id="execBadge">0</span>
                    </button>
                </div>

                <div class="nav-section-title" style="margin-top: 12px;">บริษัท</div>
                <div id="companyList"></div>

                <div class="nav-section-title" style="margin-top: 12px;">แผนก</div>
                <div id="departmentList"></div>
            </nav>

            <div class="sidebar-footer">
                <p>Version 2.0</p>
                <p>macOS Style UI</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mobile Header -->
            <header class="mobile-header">
                <button class="menu-toggle" id="menuToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1 class="mobile-title">Directory</h1>
                <button class="theme-toggle-mobile" id="themeToggleMobile">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </header>

            <!-- Employee List -->
            <section class="employee-list-section">
                <div class="list-header">
                    <div class="list-header-meta">
                        <h2 class="list-title" id="listTitle">พนักงานทั้งหมด</h2>
                        <div class="list-updated-at" id="lastUpdatedStamp">อัปเดตล่าสุด -</div>
                    </div>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="list" title="List view">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                        <button class="view-btn" data-view="grid" title="Grid view">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                        <button class="view-btn" type="button" data-action="excel" onclick="exportDirectoryExcel()" title="Export to Excel">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16v16H4z"></path>
                                <path d="m9 9 6 6m0-6-6 6"></path>
                            </svg>
                        </button>
                        <button class="view-btn" type="button" data-action="pdf" onclick="exportDirectoryPdf()" title="Export to PDF">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 2h9l5 5v15H6z"></path>
                                <path d="M14 2v6h6"></path>
                                <path d="M9 17h6"></path>
                            </svg>
                        </button>
                        <button class="view-btn" type="button" data-action="link" onclick="copyDirectoryLink()" title="คัดลอกลิงก์สำหรับ HR">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M10 13a5 5 0 0 0 7.54.54l1.83-1.83a4 4 0 0 0-5.66-5.66l-1.25 1.25"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54L4.63 12.29a4 4 0 0 0 5.66 5.66l1.25-1.25"></path>
                            </svg>
                        </button>
                        <button class="view-btn" type="button" id="installAppBtn" title="ติดตั้งแอป Contact List" style="display:none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="9" cy="8" r="3"></circle>
                                <path d="M3 20v-1a6 6 0 0 1 6-6h0a6 6 0 0 1 6 6v1"></path>
                                <path d="M19 8v6"></path>
                                <path d="M22 11h-6"></path>
                            </svg>
                        </button>
                        <button class="view-btn" type="button" data-action="refresh" onclick="forceRefreshDirectory()" title="รีโหลดเวอร์ชันล่าสุด">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M23 4v6h-6"></path>
                                <path d="M1 20v-6h6"></path>
                                <path d="M3.51 9a9 9 0 0 1 14.13-3.36L23 10"></path>
                                <path d="M20.49 15a9 9 0 0 1-14.13 3.36L1 14"></path>
                            </svg>
                        </button>
                        <button class="view-btn" type="button" id="categorySettingsBtn" title="ตั้งค่าหมวดหมู่" style="display:none;" onclick="openCategorySettings()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="3"></circle>
                                <path d="M19.4 15a7.97 7.97 0 0 0 .1-6l2-1-2-3-2.3 1a8 8 0 0 0-5.2-3L11 1H13l-1 2a8 8 0 0 0-5.2 3L4.5 5l-2 3 2 1a7.97 7.97 0 0 0 .1 6l-2 1 2 3 2.3-1a8 8 0 0 0 5.2 3l1 2h-2l1-2a8 8 0 0 0 5.2-3l2.3 1 2-3-2-1z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="employee-list" id="employeeList"></div>
            </section>

            <!-- Employee Detail -->
            <section class="employee-detail" id="employeeDetail">
                <div class="detail-placeholder">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <p>เลือกพนักงานเพื่อดูรายละเอียด</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script>
        (function () {
            const el = document.getElementById('searchShortcutKey');
            if (!el) return;
            const platform = navigator.platform || '';
            const isApple = /Mac|iPhone|iPad|iPod/i.test(platform);
            el.textContent = isApple ? '⌘K' : 'Ctrl K';
        })();
    </script>
    <script src="directory_New/public/xampp/directory.js?v=20260319-category-nav"></script>
</body>
</html>
