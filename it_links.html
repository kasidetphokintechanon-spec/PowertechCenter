<style>
/* Alias the shared PTC tokens (design-system.css) so this page matches every
   other page's palette — including dark mode, since html.dark redefines
   --ptc-* at the root and these just point at them. */
:root {
  --bg: var(--ptc-bg);
  --surface: var(--ptc-surface);
  --border: var(--ptc-border);
  --text: var(--ptc-text);
  --text-2: var(--ptc-text-muted);
  --text-faint: var(--ptc-text-faint);
  --blue: var(--ptc-primary);
  --blue-dark: var(--ptc-primary-dark);
  --blue-bg: var(--ptc-primary-light);
  --danger: var(--ptc-danger);
  --danger-bg: var(--ptc-danger-bg);
  --success: var(--ptc-success);
  --warning: var(--ptc-warning);
  --hover-bg: var(--ptc-surface-3);
}
html.dark { --hover-bg: #1e293b; }

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter','IBM Plex Sans Thai',sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .15s, color .15s; }

/* ── HEADER ── uses shared .ptc-nav (enterprise-theme.css) — see markup below */
.header-actions { display: flex; gap: 8px; align-items: center; }
.topbar-clock { font-size: 13px; color: var(--text-2); }

/* ── TABS ── */
.tabs-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
}
.tab {
  padding: 12px 18px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  user-select: none;
}
.tab:hover { color: var(--text); background: var(--hover-bg); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }

/* ── BODY ── */
.body { padding: 24px 28px; max-width: 1400px; }

/* ── STATUS BAR ── */
.status-bar {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.stat-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-2);
}
.stat-chip .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.stat-chip .dot.green { background: var(--success); }
.stat-chip .dot.red { background: var(--danger); }
.stat-chip .dot.yellow { background: var(--warning); }
.stat-chip strong { color: var(--text); }

/* ── SECTION ── */
.section { margin-bottom: 28px; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 12px;
}
.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ── CARDS GRID ── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
}

/* ── DEVICE CARD ── */
.device-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--ptc-radius-md, 8px);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
  transition: box-shadow 0.15s, border-color 0.15s;
  position: relative;
}
.device-card:hover { box-shadow: var(--ptc-shadow-md); border-color: var(--blue); }
.device-card.no-url { cursor: default; }
.device-card.no-url:hover { box-shadow: none; border-color: var(--border); }

.card-icon {
  width: 40px; height: 40px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.card-body { flex: 1; min-width: 0; }
.card-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-ip { font-size: 11px; color: var(--text-2); margin-top: 2px; font-family: monospace; }

.status-dot {
  width: 9px; height: 9px; border-radius: 50%;
  flex-shrink: 0; background: var(--border);
  transition: background 0.3s;
}
.status-dot.online { background: var(--success); box-shadow: 0 0 0 2px rgba(16,185,129,0.2); }
.status-dot.offline { background: var(--danger); }
.status-dot.checking { background: var(--warning); animation: pulse-dot 1.2s infinite; }
@keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

.card-edit-btn {
  position: absolute; top: 8px; right: 8px;
  background: none; border: none;
  color: var(--text-faint); cursor: pointer; font-size: 11px;
  padding: 4px; border-radius: 4px;
  opacity: 0; transition: opacity 0.15s;
}
.device-card:hover .card-edit-btn { opacity: 1; }
.card-edit-btn:hover { color: var(--blue); background: var(--blue-bg); }

/* ── ADD CARD ── */
.add-card {
  background: var(--surface);
  border: 2px dashed var(--border);
  border-radius: var(--ptc-radius-md, 8px);
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-faint);
  transition: all 0.15s;
  min-height: 74px;
}
.add-card:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 6px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  border: none; transition: all 0.15s; white-space: nowrap;
  font-family: inherit;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-default { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-default:hover { background: var(--hover-bg); border-color: var(--ptc-border-strong); }
.btn-danger { background: var(--surface); color: var(--danger); border: 1px solid var(--border); }
.btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── MODAL ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(6,10,18,0.6);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.15s;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface);
  border-radius: var(--ptc-radius-lg, 12px);
  width: 90%; max-width: 480px;
  box-shadow: var(--ptc-shadow-xl);
  transform: scale(0.97); transition: transform 0.15s;
  max-height: 90vh; overflow-y: auto;
}
.modal-overlay.active .modal { transform: scale(1); }
.modal-header {
  padding: 20px 24px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.modal-header h3 { font-size: 16px; font-weight: 700; color: var(--text); }
.modal-close { background: none; border: none; color: var(--text-2); cursor: pointer; font-size: 18px; padding: 4px; border-radius: 4px; }
.modal-close:hover { background: var(--hover-bg); color: var(--text); }
.modal-body { padding: 16px 24px; }
.modal-footer { padding: 12px 24px 20px; display: flex; justify-content: flex-end; gap: 8px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.field input, .field select {
  width: 100%; padding: 8px 10px;
  border: 2px solid var(--border); border-radius: 6px;
  font-size: 14px; color: var(--text); background: var(--surface);
  font-family: inherit; outline: none;
  transition: border-color 0.15s;
}
.field input:focus, .field select:focus { border-color: var(--blue); }

/* Icon picker */
.icon-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.icon-opt {
  width: 36px; height: 36px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer;
  border: 2px solid var(--border); background: var(--hover-bg); color: var(--text-2);
  transition: all 0.15s;
}
.icon-opt:hover { border-color: var(--blue); background: var(--blue-bg); }
.icon-opt.active { border-color: var(--blue); background: var(--blue); color: #fff; }

/* Color picker — swatches are the user's own colour choice for the device tag,
   deliberately NOT tied to the page theme. */
.color-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.color-opt {
  width: 28px; height: 28px; border-radius: 6px;
  cursor: pointer; border: 2px solid transparent;
  transition: all 0.15s;
}
.color-opt:hover, .color-opt.active { border-color: var(--text); transform: scale(1.15); }

/* Section add-group strip */
.add-section-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 6px;
  font-size: 12px; color: var(--text-2); cursor: pointer;
  background: none; border: 1px dashed var(--border);
  transition: all 0.15s; font-family: inherit;
}
.add-section-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }

/* Tab page */
.tab-page { display: none; }
.tab-page.active { display: block; }

/* Add company tab */
.tab-add {
  padding: 12px 14px;
  font-size: 14px; color: var(--text-faint); cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.15s;
}
.tab-add:hover { color: var(--blue); }

/* Refresh spinning */
.fa-spin { animation: fa-spin 0.8s linear infinite; }
@keyframes fa-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Responsive */
@media (max-width: 600px) {
  .body { padding: 16px; }
  .tabs-bar { padding: 0 16px; }
}

/* ══════════════════════════════════════════════════════════════
   TV MODE — wall-monitor view (deliberately separate dark theme;
   this only ever runs on an office TV, never as a normal browser tab)
   ══════════════════════════════════════════════════════════════ */
#tv-view {
  --tv-bg:#0e1219; --tv-panel:#151b25; --tv-panel-2:#111621;
  --tv-hair:#232c3d; --tv-accent:#d9954a;
  --tv-ok:#34d399; --tv-ok-glow:rgba(52,211,153,.55);
  --tv-warn:#fbbf24; --tv-warn-glow:rgba(251,191,36,.55);
  --tv-crit:#f0475a; --tv-crit-glow:rgba(240,71,90,.6);
  --tv-text:#eef1f6; --tv-text-dim:#8a93a6; --tv-text-faint:#4d5566;
  --tv-mono: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, 'Roboto Mono', monospace;
  position: fixed; inset: 0; z-index: 1000; display: none;
  background:
    radial-gradient(ellipse 1400px 700px at 20% -10%, rgba(217,149,74,.05), transparent 60%),
    radial-gradient(ellipse 1200px 800px at 100% 110%, rgba(52,211,153,.04), transparent 60%),
    var(--tv-bg);
  color: var(--tv-text); font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}
#tv-view.active { display: block; }
#tv-view .tv-grid-overlay {
  position:absolute; inset:0; pointer-events:none; z-index:0;
  background-image:
    linear-gradient(var(--tv-hair) 1px, transparent 1px),
    linear-gradient(90deg, var(--tv-hair) 1px, transparent 1px);
  background-size:56px 56px; opacity:.28;
  mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, black 40%, transparent 95%);
}
#tv-view .tv-scanlines {
  position:absolute; inset:0; pointer-events:none; z-index:1;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.10) 3px, rgba(0,0,0,0) 4px);
  opacity:.35; mix-blend-mode:multiply;
}
.tv-wall { position:relative; z-index:2; max-width:1680px; margin:0 auto; height:100vh;
  padding: clamp(16px,2.2vw,32px) clamp(16px,2.4vw,40px) clamp(16px,2.4vw,32px);
  display:flex; flex-direction:column; gap:clamp(12px,1.6vw,20px); }

.tv-exit { position:absolute; top:14px; right:14px; z-index:20;
  background:var(--tv-panel); border:1px solid var(--tv-hair); color:var(--tv-text-dim);
  width:32px; height:32px; border-radius:7px; cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; opacity:.35; transition:opacity .15s; }
.tv-exit:hover { opacity:1; color:var(--tv-text); }

.tv-head { display:flex; align-items:center; gap:clamp(16px,2vw,28px);
  padding-bottom:clamp(12px,1.6vw,18px); border-bottom:1px solid var(--tv-hair); flex-shrink:0; }
.tv-brand { display:flex; align-items:center; gap:14px; flex-shrink:0; }
.tv-brand-mark { width:40px; height:40px; border-radius:6px;
  background:linear-gradient(155deg, var(--tv-accent), #8a5a26);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset, 0 6px 18px rgba(217,149,74,.25); flex-shrink:0; }
.tv-brand-mark i { color:var(--tv-bg); font-size:17px; }
.tv-brand-1 { font-family:var(--tv-mono); font-size:10.5px; font-weight:600; letter-spacing:.2em;
  color:var(--tv-text-dim); text-transform:uppercase; }
.tv-brand-2 { font-family:var(--tv-mono); font-size:clamp(15px,1.5vw,19px); font-weight:700;
  letter-spacing:.04em; color:var(--tv-text); }

.tv-banner { flex:1; min-width:0; display:flex; align-items:center; gap:16px;
  padding:10px 20px; border-radius:8px; position:relative; border:1px solid var(--tv-hair); background:var(--tv-panel); }
.tv-banner.ok { border-color:rgba(52,211,153,.35); color:var(--tv-ok); }
.tv-banner.warn { border-color:rgba(251,191,36,.35); color:var(--tv-warn); }
.tv-banner.crit { border-color:rgba(240,71,90,.45); color:var(--tv-crit); animation:tvBannerPulse 2.6s ease-in-out infinite; }
@keyframes tvBannerPulse {
  0%,100%{ box-shadow:0 0 0 0 rgba(240,71,90,0), inset 0 0 24px rgba(240,71,90,.05); }
  50%{ box-shadow:0 0 26px 1px var(--tv-crit-glow), inset 0 0 24px rgba(240,71,90,.12); }
}
.tv-banner-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; background:currentColor;
  box-shadow:0 0 12px 2px currentColor; opacity:.9; }
.tv-banner-text { font-family:var(--tv-mono); font-weight:700; letter-spacing:.06em;
  font-size:clamp(13px,1.2vw,16px); text-transform:uppercase; }
.tv-banner-sub { font-size:12px; color:var(--tv-text-dim); font-weight:500; margin-left:auto; white-space:nowrap; }

.tv-clock-block { text-align:right; flex-shrink:0; }
.tv-clock-time { font-family:var(--tv-mono); font-variant-numeric:tabular-nums;
  font-size:clamp(22px,2.4vw,32px); font-weight:700; line-height:1; color:var(--tv-text); }
.tv-clock-date { font-family:var(--tv-mono); font-size:11px; color:var(--tv-text-dim);
  letter-spacing:.1em; margin-top:5px; text-transform:uppercase; }

.tv-panels { display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
  gap:clamp(12px,1.6vw,20px); flex:1; min-height:0; }
/* Single-company screen (?tv=1&company=PTA) — one panel gets the whole wall, so let it breathe */
.tv-panels.tv-single { grid-template-columns:1fr; max-width:900px; margin:0 auto; width:100%; }
.tv-panels.tv-single .tv-panel-code { font-size:30px; }
.tv-panels.tv-single .tv-panel-name { font-size:13px; }
.tv-panels.tv-single .tv-dev-name { font-size:15px; }
.tv-panels.tv-single .tv-dev-ip { font-size:12px; }
.tv-panels.tv-single .tv-device { padding:13px 20px; }
.tv-panel { background:linear-gradient(180deg, var(--tv-panel) 0%, var(--tv-panel-2) 100%);
  border:1px solid var(--tv-hair); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
.tv-panel-head { display:flex; align-items:center; gap:10px; padding:14px 16px 12px;
  border-bottom:1px solid var(--tv-hair); background:rgba(255,255,255,.014); flex-shrink:0; }
.tv-panel-code { font-family:var(--tv-mono); font-weight:800; font-size:20px; color:var(--tv-accent); }
.tv-panel-name { font-size:11px; color:var(--tv-text-dim); margin-top:2px; }
.tv-panel-tally { margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.tv-page-label { font-family:var(--tv-mono); font-size:10.5px; font-weight:700; color:var(--tv-text-faint); letter-spacing:.06em; }
.tv-tchip { font-family:var(--tv-mono); font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:5px;
  padding:3px 7px; border-radius:5px; background:var(--tv-panel-2); border:1px solid var(--tv-hair); font-variant-numeric:tabular-nums; }
.tv-tchip .lamp { width:6px; height:6px; border-radius:50%; background:currentColor; }
.tv-tchip.c-ok { color:var(--tv-ok); } .tv-tchip.c-crit { color:var(--tv-crit); } .tv-tchip.c-warn { color:var(--tv-warn); }

.tv-devices { overflow:hidden; flex:1; min-height:0; }
.tv-dev-page { display:none; animation:tvPageIn .35s ease both; }
.tv-dev-page.active { display:block; }
@keyframes tvPageIn { from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);} }
.tv-device { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--tv-hair); }
.tv-device:last-child { border-bottom:none; }
.tv-dev-icon { width:28px; height:28px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  background:var(--tv-panel-2); border:1px solid var(--tv-hair); color:var(--tv-text-dim); font-size:12.5px; }
.tv-dev-body { min-width:0; flex:1; }
.tv-dev-name { font-size:13px; font-weight:600; color:var(--tv-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tv-dev-ip { font-family:var(--tv-mono); font-size:10.5px; color:var(--tv-text-faint); margin-top:1px; }
.tv-dev-status { display:flex; align-items:center; gap:8px; flex-shrink:0; }
.tv-dev-status-label { font-family:var(--tv-mono); font-size:9.5px; font-weight:700; letter-spacing:.07em;
  text-transform:uppercase; color:var(--tv-text-faint); width:48px; text-align:right; }
.tv-lamp-big { width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--tv-text-faint); }
.tv-device.on .tv-dev-status-label { color:var(--tv-ok); }
.tv-device.on .tv-lamp-big { background:var(--tv-ok); box-shadow:0 0 9px 2px var(--tv-ok-glow); animation:tvBreathe 3.2s ease-in-out infinite; }
.tv-device.off { background:linear-gradient(90deg, rgba(240,71,90,.10), transparent 60%); }
.tv-device.off .tv-dev-status-label { color:var(--tv-crit); }
.tv-device.off .tv-lamp-big { background:var(--tv-crit); box-shadow:0 0 10px 2px var(--tv-crit-glow); animation:tvBlink 1.1s steps(1) infinite; }
.tv-device.chk .tv-dev-status-label { color:var(--tv-warn); }
.tv-device.chk .tv-lamp-big { background:var(--tv-warn); box-shadow:0 0 9px 2px var(--tv-warn-glow); animation:tvBreathe 1.4s ease-in-out infinite; }
@keyframes tvBreathe { 0%,100%{opacity:1;} 50%{opacity:.45;} }
@keyframes tvBlink { 0%,49%{opacity:1;} 50%,100%{opacity:.25;} }

.tv-pager-dots { display:flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 0 10px; border-top:1px solid var(--tv-hair); flex-shrink:0; }
.tv-pager-dots .dot { width:5px; height:5px; border-radius:50%; background:var(--tv-text-faint); transition:background .2s, width .2s, border-radius .2s; }
.tv-pager-dots .dot.active { background:var(--tv-accent); width:14px; border-radius:3px; }

.tv-foot { display:flex; align-items:center; gap:20px; padding-top:clamp(8px,1.2vw,14px);
  border-top:1px solid var(--tv-hair); font-family:var(--tv-mono); font-size:10.5px; color:var(--tv-text-dim); letter-spacing:.04em; flex-shrink:0; }
.tv-legend { display:flex; gap:16px; }
.tv-legend-item { display:flex; align-items:center; gap:6px; }
.tv-legend-dot { width:7px; height:7px; border-radius:50%; }
.tv-foot-updated { margin-left:auto; color:var(--tv-text-faint); }
.tv-foot-updated b { color:var(--tv-text-dim); font-weight:600; }

@media (prefers-reduced-motion: reduce) {
  .tv-banner.crit, .tv-device.on .tv-lamp-big, .tv-device.off .tv-lamp-big, .tv-device.chk .tv-lamp-big, .tv-dev-page { animation:none; }
}
</style>
</head>

<script>
// ── DEFAULT DATA ──────────────────────────────────────────────
const DEFAULT_CONFIG = {

            { id: 'd4', name: 'Apeos C3070 F17', ip: '192.168.0.24', url: 'https://192.168.0.24/home/index.html#hashHome', icon: 'fa-print', color: '#fef9c3', colorText: '#854d0e' },
          ]
        }
      ]
    },
    {
      id: 'PT4', name: 'Powertech 2004', code: 'PT4',
      sections: [
        {
          id: 's3', name: 'Printer',
          devices: [
            { id: 'd5', name: 'Apeos C3070 F5', ip: '192.168.1.247', url: 'https://192.168.1.247/home/index.html#hashHome', icon: 'fa-print', color: '#fef9c3', colorText: '#854d0e' },
            { id: 'd6', name: 'Apeos C3070 F6', ip: '192.168.1.253', url: 'https://192.168.1.253/home/index.html#hashHome', icon: 'fa-print', color: '#fef9c3', colorText: '#854d0e' },
            { id: 'd7', name: 'Apeos C3070 F7', ip: '192.168.1.254', url: 'https://192.168.1.254/home/index.html#hashHome', icon: 'fa-print', color: '#fef9c3', colorText: '#854d0e' },
            { id: 'd8', name: 'F6 (LG) ชาวกำ',  ip: '192.168.1.238', url: 'https://192.168.1.238/home/index.html#hashHome', icon: 'fa-print', color: '#fef9c3', colorText: '#854d0e' },
            { id: 'd9', name: 'F7 (ACC) ชาวกำ', ip: '192.168.1.251', url: 'https://192.168.1.251/home/index.html#hashHome', icon: 'fa-print', color: '#fef9c3', colorText: '#854d0e' },
          ]
        }
      ]
    },
    {
      id: 'PTE', name: 'Powertech Energy Solutions', code: 'PTE',
      sections: [
        {
          id: 's4', name: 'Printer',
          devices: [
            { id: 'd10', name: 'Apeos C3070', ip: '192.168.5.5', url: 'https://192.168.5.5/home/index.html#hashHome', icon: 'fa-print', color: '#fef9c3', colorText: '#854d0e' },
          ]
        }
      ]
    }
  ]
};

const ICONS = [
  { id: 'fa-print',        label: '🖨️' },
  { id: 'fa-database',     label: '🗄️' },
  { id: 'fa-server',       label: '🖥️' },
  { id: 'fa-network-wired',label: '🌐' },
  { id: 'fa-wifi',         label: '📶' },
  { id: 'fa-video',        label: '📹' },
  { id: 'fa-bolt',         label: '⚡' },
  { id: 'fa-desktop',      label: '🖥' },
  { id: 'fa-hdd',          label: '💿' },
  { id: 'fa-shield-alt',   label: '🛡️' },
  { id: 'fa-fire',         label: '🔥' },
  { id: 'fa-cog',          label: '⚙️' },
];

const COLORS = [
  { bg: '#fef9c3', text: '#854d0e' },
  { bg: '#e0f2fe', text: '#0369a1' },
  { bg: '#dcfce7', text: '#166534' },
  { bg: '#fce7f3', text: '#9d174d' },
  { bg: '#ede9fe', text: '#5b21b6' },
  { bg: '#ffedd5', text: '#9a3412' },
  { bg: '#f1f5f9', text: '#334155' },
  { bg: '#fee2e2', text: '#991b1b' },
];

// ── STATE ─────────────────────────────────────────────────────
let config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
let activeTab = 0;
let statusMap = {};
let editTarget = null; // { companyId, sectionId, deviceId } or null

let modalIconSel = ICONS[0].id;
let modalColorSel = COLORS[0];

// ── INIT ─────────────────────────────────────────────────────
async function init() {
  const s = await fetch('api.php?action=check_session').then(r => r.json()).catch(() => ({ loggedin: false }));
  if (!s.loggedin) { window.location.href = 'login.html?returnUrl=it_links.html'; return; }

  await loadConfig();
  renderAll();
  setTimeout(checkAll, 400);

  const params = new URLSearchParams(location.search);
  if (params.get('tv') === '1') enterTvMode(params.get('company'));
}

// ── RENDER ────────────────────────────────────────────────────
function renderAll() {
  renderTabs();
  renderPages();
  updateStats();
}

function renderTabs() {
  const bar = document.getElementById('tabs-bar');
  bar.innerHTML = '';
  config.companies.forEach((c, i) => {
    const t = document.createElement('div');
    t.className = 'tab' + (i === activeTab ? ' active' : '');
    t.textContent = c.code;
    t.title = c.name;
    t.onclick = () => { activeTab = i; renderAll(); };
    bar.appendChild(t);
  });
  const addT = document.createElement('div');
  addT.className = 'tab-add';
  addT.innerHTML = '<i class="fas fa-plus"></i>';
  addT.title = 'เพิ่มบริษัท';
  addT.onclick = openAddCompany;
  bar.appendChild(addT);
}

function renderPages() {
  const container = document.getElementById('tab-pages');
  container.innerHTML = '';
  config.companies.forEach((company, ci) => {
    const page = document.createElement('div');
    page.className = 'tab-page' + (ci === activeTab ? ' active' : '');

    company.sections.forEach((section, si) => {
      const sec = document.createElement('div');
      sec.className = 'section';

      const secHeader = document.createElement('div');
      secHeader.className = 'section-header';

      const title = document.createElement('div');
      title.className = 'section-title';
      title.innerHTML = `<i class="fas fa-layer-group"></i> ${esc(section.name)}`;

      const delSecBtn = document.createElement('button');
      delSecBtn.className = 'btn btn-danger btn-sm';
      delSecBtn.innerHTML = '<i class="fas fa-trash"></i>';
      delSecBtn.title = 'ลบหมวดหมู่';
      delSecBtn.onclick = () => {
        if (confirm(`ลบหมวด "${section.name}"?`)) {
          company.sections.splice(si, 1);
          saveConfig(); renderAll();
        }
      };

      secHeader.appendChild(title);
      secHeader.appendChild(delSecBtn);
      sec.appendChild(secHeader);

      const grid = document.createElement('div');
      grid.className = 'cards-grid';

      section.devices.forEach((dev, di) => {
        const card = buildCard(dev, company.id, section.id);
        grid.appendChild(card);
      });

      // Add device card
      const addCard = document.createElement('div');
      addCard.className = 'add-card';
      addCard.innerHTML = '<i class="fas fa-plus"></i> เพิ่มอุปกรณ์';
      addCard.onclick = () => openAddDevice(company.id, section.id);
      grid.appendChild(addCard);

      sec.appendChild(grid);
      page.appendChild(sec);
    });

    // Add section button
    const addSecBtn = document.createElement('button');
    addSecBtn.className = 'add-section-btn';
    addSecBtn.innerHTML = '<i class="fas fa-layer-group"></i> เพิ่มหมวดหมู่';
    addSecBtn.onclick = () => openAddSection(company.id);
    page.appendChild(addSecBtn);

    // Delete company button
    const delCompBtn = document.createElement('button');
    delCompBtn.className = 'btn btn-danger btn-sm';
    delCompBtn.style.marginTop = '16px';
    delCompBtn.innerHTML = `<i class="fas fa-trash"></i> ลบบริษัท ${esc(company.code)}`;
    delCompBtn.onclick = () => {
      if (confirm(`ลบบริษัท "${company.name}"?`)) {
        config.companies.splice(ci, 1);
        activeTab = Math.max(0, activeTab - 1);
        saveConfig(); renderAll();
      }
    };
    page.appendChild(delCompBtn);

    container.appendChild(page);
  });
}

function buildCard(dev, companyId, sectionId) {
  const hasUrl = dev.url && dev.url.trim() !== '';
  const card = document.createElement(hasUrl ? 'a' : 'div');
  card.className = 'device-card' + (hasUrl ? '' : ' no-url');
  if (hasUrl) { card.href = dev.url; card.target = '_blank'; card.rel = 'noopener'; }
  card.dataset.ip = dev.ip;

  const iconEl = document.createElement('div');
  iconEl.className = 'card-icon';
  iconEl.style.background = dev.color || '#f1f5f9';
  iconEl.style.color = dev.colorText || '#334155';
  iconEl.innerHTML = `<i class="fas ${dev.icon || 'fa-server'}"></i>`;

  const body = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = `<div class="card-name">${esc(dev.name)}</div><div class="card-ip">${esc(dev.ip)}</div>`;

  const dot = document.createElement('div');
  dot.className = 'status-dot';
  dot.dataset.ip = dev.ip;
  applyStatus(dot, dev.ip);

  const editBtn = document.createElement('button');
  editBtn.className = 'card-edit-btn';
  editBtn.innerHTML = '<i class="fas fa-pen"></i>';
  editBtn.title = 'แก้ไข';
  editBtn.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    openEditDevice(companyId, sectionId, dev.id);
  };

  card.appendChild(iconEl);
  card.appendChild(body);
  card.appendChild(dot);
  card.appendChild(editBtn);
  return card;
}

// ── STATUS ────────────────────────────────────────────────────
function applyStatus(dot, ip) {
  const s = statusMap[ip];
  dot.className = 'status-dot' + (s ? ' ' + s : ' checking');
}

function getAllDevices() {
  const result = [];
  config.companies.forEach(c => c.sections.forEach(s => s.devices.forEach(d => result.push(d))));
  return result;
}

let isChecking = false;
function checkAll() {
  if (isChecking) return;
  isChecking = true;
  const icon = document.getElementById('check-icon');
  icon.className = 'fas fa-circle-notch fa-spin';

  const devs = getAllDevices();
  if (devs.length === 0) { finishCheck(); return; }

  // Reset dots to checking
  document.querySelectorAll('.status-dot').forEach(d => {
    d.className = 'status-dot checking';
    delete statusMap[d.dataset.ip];
  });
  updateStats();

  let done = 0;
  devs.forEach(dev => {
    // เช็คจาก server เสมอ (server อยู่วง LAN เดียวกับอุปกรณ์อยู่แล้ว เชื่อถือได้กว่า browser
    // ของผู้ใช้ ซึ่งอาจอยู่คนละ subnet/VPN แล้ว fetch ตรงไม่ติดทั้งที่เครื่องปกติดี)
    const params = new URLSearchParams({ action: 'probe_host', ip: dev.ip });
    if (dev.probePort) params.set('port', dev.probePort);
    fetch(`api.php?${params.toString()}`)
      .then(r => r.json())
      .then(d => { statusMap[dev.ip] = d.online ? 'online' : 'offline'; })
      .catch(() => { statusMap[dev.ip] = 'offline'; })
      .finally(() => {
        document.querySelectorAll(`.status-dot[data-ip="${dev.ip}"]`).forEach(d => applyStatus(d, dev.ip));
        done++;
        updateStats();
        if (done >= devs.length) finishCheck();
      });
  });
}

function finishCheck() {
  document.getElementById('check-icon').className = 'fas fa-satellite-dish';
  document.getElementById('last-check').textContent = 'อัปเดต ' + new Date().toLocaleTimeString('th-TH');
  isChecking = false;
  updateStats();
  if (tvActive) renderTvView();
}

function updateStats() {
  const total = getAllDevices().length;
  const online = Object.values(statusMap).filter(s => s === 'online').length;
  const offline = Object.values(statusMap).filter(s => s === 'offline').length;
  document.getElementById('s-online').textContent = online;
  document.getElementById('s-offline').textContent = offline;
  document.getElementById('s-checking').textContent = Math.max(0, total - online - offline);
}

// ── MODAL: Device ─────────────────────────────────────────────
function buildIconPicker(selected) {
  const picker = document.getElementById('icon-picker');
  picker.innerHTML = '';
  ICONS.forEach(ic => {
    const el = document.createElement('div');
    el.className = 'icon-opt' + (ic.id === selected ? ' active' : '');
    el.title = ic.id;
    el.innerHTML = `<i class="fas ${ic.id}"></i>`;
    el.onclick = () => {
      modalIconSel = ic.id;
      picker.querySelectorAll('.icon-opt').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
    };
    picker.appendChild(el);
  });
}

function buildColorPicker(selectedBg) {
  const picker = document.getElementById('color-picker');
  picker.innerHTML = '';
  COLORS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'color-opt' + (c.bg === selectedBg ? ' active' : '');
    el.style.background = c.bg;
    el.style.border = `2px solid ${c.text}40`;
    el.onclick = () => {
      modalColorSel = c;
      picker.querySelectorAll('.color-opt').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
    };
    picker.appendChild(el);
  });
}

function openAddDevice(companyId, sectionId) {
  editTarget = { companyId, sectionId, deviceId: null };
  modalIconSel = ICONS[0].id;
  modalColorSel = COLORS[0];
  const company = config.companies.find(c => c.id === companyId);
  document.getElementById('modal-device-title').textContent = 'เพิ่มอุปกรณ์';
  document.getElementById('d-name').value = '';
  document.getElementById('d-ip').value = company && company.ipPrefix ? company.ipPrefix + '.' : '';
  document.getElementById('d-url').value = '';
  document.getElementById('d-probe-port').value = '';
  document.getElementById('modal-delete-btn').style.display = 'none';
  buildIconPicker(modalIconSel);
  buildColorPicker(modalColorSel.bg);
  openModal('modal-device');
  setTimeout(() => document.getElementById('d-name').focus(), 150);
}

function openEditDevice(companyId, sectionId, deviceId) {
  const company = config.companies.find(c => c.id === companyId);
  const section = company.sections.find(s => s.id === sectionId);
  const dev = section.devices.find(d => d.id === deviceId);
  editTarget = { companyId, sectionId, deviceId };
  modalIconSel = dev.icon || ICONS[0].id;
  modalColorSel = COLORS.find(c => c.bg === dev.color) || COLORS[0];
  document.getElementById('modal-device-title').textContent = 'แก้ไขอุปกรณ์';
  document.getElementById('d-name').value = dev.name;
  document.getElementById('d-ip').value = dev.ip;
  document.getElementById('d-url').value = dev.url || '';
  document.getElementById('d-probe-port').value = dev.probePort || '';
  document.getElementById('modal-delete-btn').style.display = 'inline-flex';
  buildIconPicker(modalIconSel);
  buildColorPicker(modalColorSel.bg);
  openModal('modal-device');
}

function saveDevice() {
  const name      = document.getElementById('d-name').value.trim();
  const ip        = document.getElementById('d-ip').value.trim();
  const url       = document.getElementById('d-url').value.trim();
  const probePort = parseInt(document.getElementById('d-probe-port').value) || null;
  if (!name || !ip) { alert('กรุณาใส่ชื่อและ IP'); return; }

  const company = config.companies.find(c => c.id === editTarget.companyId);
  const section = company.sections.find(s => s.id === editTarget.sectionId);

  if (editTarget.deviceId) {
    const dev = section.devices.find(d => d.id === editTarget.deviceId);
    dev.name = name; dev.ip = ip; dev.url = url; dev.probePort = probePort;
    dev.icon = modalIconSel; dev.color = modalColorSel.bg; dev.colorText = modalColorSel.text;
  } else {
    section.devices.push({ id: uid(), name, ip, url, probePort, icon: modalIconSel, color: modalColorSel.bg, colorText: modalColorSel.text });
  }

  saveConfig(); closeModal('modal-device'); renderAll();
  setTimeout(checkAll, 200);
}

function deleteDevice() {
  if (!editTarget.deviceId) return;
  const company = config.companies.find(c => c.id === editTarget.companyId);
  const section = company.sections.find(s => s.id === editTarget.sectionId);
  if (confirm('ลบอุปกรณ์นี้?')) {
    section.devices = section.devices.filter(d => d.id !== editTarget.deviceId);
    saveConfig(); closeModal('modal-device'); renderAll();
  }
}

// ── MODAL: Section ────────────────────────────────────────────
let addSectionTarget = null;
function openAddSection(companyId) {
  addSectionTarget = companyId;
  document.getElementById('s-name').value = '';
  openModal('modal-section');
  setTimeout(() => document.getElementById('s-name').focus(), 150);
}
function saveSection() {
  const name = document.getElementById('s-name').value.trim();
  if (!name) return;
  const company = config.companies.find(c => c.id === addSectionTarget);
  company.sections.push({ id: uid(), name, devices: [] });
  saveConfig(); closeModal('modal-section'); renderAll();
}

// ── MODAL: Company ────────────────────────────────────────────
function openAddCompany() {
  document.getElementById('c-name').value = '';
  document.getElementById('c-code').value = '';
  document.getElementById('c-ip-prefix').value = '';
  openModal('modal-company');
  setTimeout(() => document.getElementById('c-name').focus(), 150);
}
function saveCompany() {
  const name = document.getElementById('c-name').value.trim();
  const code = document.getElementById('c-code').value.trim().toUpperCase();
  let ipPrefix = document.getElementById('c-ip-prefix').value.trim().replace(/\.+$/, '');
  if (!name || !code) { alert('กรุณาใส่ชื่อและรหัสบริษัท'); return; }
  if (ipPrefix && !/^\d{1,3}\.\d{1,3}\.\d{1,3}$/.test(ipPrefix)) {
    alert('รูปแบบวง IP ไม่ถูกต้อง (ตัวอย่าง: 192.168.0)');
    return;
  }
  config.companies.push({ id: uid(), name, code, ipPrefix, sections: [] });
  activeTab = config.companies.length - 1;
  saveConfig(); closeModal('modal-company'); renderAll();
}

// ── MODAL HELPERS ─────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('active'); });
});

// ── PERSISTENCE ───────────────────────────────────────────────
// Server (system_settings key 'it_links_config') is the source of truth so every
// technician sees the same device list. localStorage is kept only as an offline cache.
async function saveConfig() {
  try { localStorage.setItem('it_links_v2', JSON.stringify(config)); } catch {}
  try {
    const fd = new FormData();
    fd.append('config', JSON.stringify(config));
    const res  = await fetch('api.php?action=save_it_links_config', { method: 'POST', body: fd });
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message || 'save failed');
  } catch (e) {
    console.error('Save to server failed', e);
    alert('บันทึกไปเซิร์ฟเวอร์ไม่สำเร็จ (คนอื่นจะยังไม่เห็นการเปลี่ยนแปลงนี้): ' + e.message);
  }
}

async function loadConfig() {
  try {
    const res  = await fetch('api.php?action=get_it_links_config');
    const json = await res.json();
    if (json.status === 'success' && json.exists && json.config && Array.isArray(json.config.companies)) {
      config = json.config;
      return;
    }
  } catch (e) { console.error('Load from server failed, falling back to local data', e); }

  // No server data yet — migrate old localStorage copy (if any) up to the server once, else use defaults
  try {
    const raw = localStorage.getItem('it_links_v2');
    const parsed = raw ? JSON.parse(raw) : null;
    if (parsed && Array.isArray(parsed.companies)) {
      config = parsed;
      saveConfig();
      return;
    }
  } catch {}
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}

// ── EXPORT / IMPORT ───────────────────────────────────────────
function exportConfig() {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'it-links-config.json'; a.click();
}
function importConfig(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imp = JSON.parse(ev.target.result);
      if (!imp.companies) { alert('ไฟล์ไม่ถูกต้อง'); return; }
      if (!confirm('การนำเข้าไฟล์นี้จะแทนที่รายการอุปกรณ์ทั้งหมดที่มีอยู่ตอนนี้ (ของทุกคนที่ใช้หน้านี้ร่วมกัน)\n\nต้องการดำเนินการต่อหรือไม่?')) return;
      config = imp; saveConfig(); renderAll(); checkAll();
    } catch { alert('อ่านไฟล์ไม่ได้'); }
  };
  reader.readAsText(file); e.target.value = '';
}

// ── TV MODE (wall-monitor view) ─────────────────────────────────
const TV_CYCLE_MS   = 4500;  // how long each page stays on screen
const TV_REFRESH_MS = 60000; // how often to re-probe all devices while on the wall
let tvActive = false;
let tvPagerIntervals = [];
let tvClockInterval  = null;
let tvRefreshInterval = null;
let tvCompanyFilter  = null; // null = show every company; 'PTA' etc = single-company wall (per-site screen)

// Single-company screens have the whole width to themselves, so let them show more
// rows per page before needing to cycle at all.
function tvPageSize() { return tvCompanyFilter ? 12 : 6; }

function enterTvMode(companyCode) {
  tvCompanyFilter = companyCode || null;
  tvActive = true;
  document.getElementById('tv-view').classList.add('active');
  document.getElementById('tv-panels').classList.toggle('tv-single', !!tvCompanyFilter);
  renderTvView();
  tickTvClock();
  tvClockInterval = setInterval(tickTvClock, 1000);
  tvRefreshInterval = setInterval(checkAll, TV_REFRESH_MS);
  document.addEventListener('keydown', tvKeyHandler);
  checkAll(); // refresh immediately so the wall isn't showing stale data
}

function exitTvMode() {
  tvActive = false;
  document.getElementById('tv-view').classList.remove('active');
  clearInterval(tvClockInterval);  tvClockInterval  = null;
  clearInterval(tvRefreshInterval); tvRefreshInterval = null;
  tvPagerIntervals.forEach(clearInterval); tvPagerIntervals = [];
  document.removeEventListener('keydown', tvKeyHandler);
}

function tvKeyHandler(e) { if (e.key === 'Escape') exitTvMode(); }

function tickTvClock() {
  const now = new Date();
  const clockEl = document.getElementById('tv-clock');
  const dateEl  = document.getElementById('tv-date');
  if (clockEl) clockEl.textContent =
    [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
  if (dateEl) dateEl.textContent = now.toLocaleDateString('th-TH', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}

function renderTvView() {
  tvPagerIntervals.forEach(clearInterval);
  tvPagerIntervals = [];

  // Scope to a single company on a per-site screen (?tv=1&company=PTA), or show everyone
  // on the combined overview screen (?tv=1).
  const scopedCompanies = tvCompanyFilter
    ? config.companies.filter(c => c.code.toUpperCase() === tvCompanyFilter.toUpperCase())
    : config.companies;

  // ── Overall status banner (reflects only what's on THIS screen) ──
  const allDevices = [];
  scopedCompanies.forEach(c => c.sections.forEach(s => s.devices.forEach(d => allDevices.push(d))));
  const offline = allDevices.filter(d => statusMap[d.ip] === 'offline');
  const banner     = document.getElementById('tv-banner');
  const bannerText = document.getElementById('tv-banner-text');
  const bannerSub  = document.getElementById('tv-banner-sub');
  banner.className = 'tv-banner';

  if (offline.length > 0) {
    banner.classList.add('crit');
    bannerText.textContent = offline.length === 1 ? '1 DEVICE OFFLINE' : `${offline.length} DEVICES OFFLINE`;
    let loc = '';
    outer:
    for (const c of scopedCompanies) {
      for (const s of c.sections) {
        for (const d of s.devices) {
          if (d.ip === offline[0].ip) { loc = tvCompanyFilter ? `${d.name} · ${d.ip}` : `${c.code} · ${d.name} · ${d.ip}`; break outer; }
        }
      }
    }
    bannerSub.textContent = loc;
  } else {
    const checkedCount = allDevices.filter(d => statusMap[d.ip]).length;
    if (allDevices.length > 0 && checkedCount < allDevices.length) {
      banner.classList.add('warn');
      bannerText.textContent = 'CHECKING…';
      bannerSub.textContent = `${checkedCount}/${allDevices.length}`;
    } else {
      banner.classList.add('ok');
      bannerText.textContent = 'ALL SYSTEMS NOMINAL';
      bannerSub.textContent = `${allDevices.length} devices`;
    }
  }

  // ── Company panels ──
  const panelsEl = document.getElementById('tv-panels');
  panelsEl.innerHTML = '';

  if (!scopedCompanies.length) {
    panelsEl.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--tv-text-faint);font-family:var(--tv-mono)">
      ไม่พบบริษัทรหัส "${esc(tvCompanyFilter)}"</div>`;
    document.getElementById('tv-last-updated').textContent = new Date().toLocaleTimeString('th-TH');
    return;
  }

  const pageSize = tvPageSize();
  scopedCompanies.forEach(company => {
    const devices = [];
    company.sections.forEach(s => s.devices.forEach(d => devices.push(d)));
    const onCount  = devices.filter(d => statusMap[d.ip] === 'online').length;
    const offCount = devices.filter(d => statusMap[d.ip] === 'offline').length;
    const chkCount = devices.length - onCount - offCount;

    const pageCount = Math.max(1, Math.ceil(devices.length / pageSize));
    const pagerId = `tvp-${company.id}`, dotsId = `tvd-${company.id}`, labelId = `tvl-${company.id}`;

    let pagesHtml = '';
    for (let p = 0; p < pageCount; p++) {
      const slice = devices.slice(p * pageSize, p * pageSize + pageSize);
      pagesHtml += `<div class="tv-dev-page${p === 0 ? ' active' : ''}">` + slice.map(tvDeviceRow).join('') + `</div>`;
    }
    if (!devices.length) pagesHtml = `<div style="padding:24px;text-align:center;color:var(--tv-text-faint);font-size:12px">ไม่มีอุปกรณ์</div>`;

    const dotsHtml = pageCount > 1
      ? `<div class="tv-pager-dots" id="${dotsId}">` + Array.from({ length: pageCount }).map((_, i) => `<span class="dot${i === 0 ? ' active' : ''}"></span>`).join('') + `</div>`
      : '';

    const tallyHtml = (pageCount > 1 ? `<span class="tv-page-label" id="${labelId}">PAGE 1/${pageCount}</span>` : '')
      + (onCount  ? `<div class="tv-tchip c-ok"><span class="lamp"></span>${onCount}</div>` : '')
      + (offCount ? `<div class="tv-tchip c-crit"><span class="lamp"></span>${offCount}</div>` : '')
      + (chkCount ? `<div class="tv-tchip c-warn"><span class="lamp"></span>${chkCount}</div>` : '');

    const panelEl = document.createElement('div');
    panelEl.className = 'tv-panel';
    panelEl.innerHTML = `
      <div class="tv-panel-head">
        <div>
          <div class="tv-panel-code">${esc(company.code)}</div>
          <div class="tv-panel-name">${esc(company.name)}</div>
        </div>
        <div class="tv-panel-tally">${tallyHtml}</div>
      </div>
      <div class="tv-devices" id="${pagerId}">${pagesHtml}</div>
      ${dotsHtml}
    `;
    panelsEl.appendChild(panelEl);

    if (pageCount > 1) tvPagerIntervals.push(initTvPager(pagerId, dotsId, labelId, pageCount, TV_CYCLE_MS));
  });

  document.getElementById('tv-last-updated').textContent = new Date().toLocaleTimeString('th-TH');
}

function tvDeviceRow(dev) {
  const s = statusMap[dev.ip];
  const cls   = s === 'online' ? 'on' : s === 'offline' ? 'off' : 'chk';
  const label = s === 'online' ? 'Online' : s === 'offline' ? 'Offline' : 'Checking';
  return `<div class="tv-device ${cls}">
    <div class="tv-dev-icon"><i class="fas ${dev.icon || 'fa-server'}"></i></div>
    <div class="tv-dev-body"><div class="tv-dev-name">${esc(dev.name)}</div><div class="tv-dev-ip">${esc(dev.ip)}</div></div>
    <div class="tv-dev-status"><span class="tv-dev-status-label">${label}</span><span class="tv-lamp-big"></span></div>
  </div>`;
}

function initTvPager(pagerId, dotsId, labelId, pageCount, intervalMs) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return null;
  let idx = 0;
  return setInterval(() => {
    const pager = document.getElementById(pagerId);
    if (!pager) return;
    const pages   = pager.querySelectorAll('.tv-dev-page');
    const dotsWrap = document.getElementById(dotsId);
    const dots    = dotsWrap ? dotsWrap.querySelectorAll('.dot') : [];
    const label   = document.getElementById(labelId);
    if (!pages.length) return;
    pages[idx]?.classList.remove('active'); dots[idx]?.classList.remove('active');
    idx = (idx + 1) % pages.length;
    pages[idx]?.classList.add('active'); dots[idx]?.classList.add('active');
    if (label) label.textContent = `PAGE ${idx + 1}/${pageCount}`;
  }, intervalMs);
}

// ── UTILS ─────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2, 9); }
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Theme toggle ──────────────────────────────────────────────
(function initTheme() {
  const updateIcon = () => {
    document.getElementById('theme-icon').className =
      document.documentElement.classList.contains('dark') ? 'fas fa-moon' : 'fas fa-sun';
  };
  updateIcon();
  document.getElementById('theme-toggle').addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    document.documentElement.classList.toggle('dark-theme');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    updateIcon();
  });
})();

// ── START ─────────────────────────────────────────────────────
init();
</script>
