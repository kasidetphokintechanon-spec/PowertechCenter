<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เอกสาร — Powertech IT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background: #f1f5f9; margin: 0; font-family: 'Inter', 'IBM Plex Sans Thai', sans-serif; color: #1e293b; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
        .back { display: inline-flex; align-items: center; gap: 6px; color: #2563eb; text-decoration: none; font-size: 13px; margin-bottom: 20px; }
        .back:hover { text-decoration: underline; }
        .md-body {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 32px 36px;
            line-height: 1.75;
            font-size: 14px;
        }
        .md-body h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .md-body h2 { font-size: 17px; font-weight: 700; margin: 28px 0 10px; color: #1e293b; }
        .md-body h3 { font-size: 14px; font-weight: 700; margin: 20px 0 8px; color: #334155; }
        .md-body p { margin: 0 0 12px; color: #334155; }
        .md-body ul, .md-body ol { padding-left: 22px; margin: 0 0 12px; color: #334155; }
        .md-body li { margin-bottom: 4px; }
        .md-body code { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 4px; padding: 1px 6px; font-size: 12px; color: #dc2626; }
        .md-body pre { background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 16px; overflow-x: auto; margin: 0 0 14px; }
        .md-body pre code { background: none; border: none; color: inherit; font-size: 12px; padding: 0; }
        .md-body table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 13px; }
        .md-body th { background: #f8fafc; border: 1px solid #e2e8f0; padding: 8px 12px; text-align: left; font-weight: 700; color: #475569; }
        .md-body td { border: 1px solid #e2e8f0; padding: 8px 12px; color: #334155; }
        .md-body tr:hover td { background: #f8fafc; }
        .md-body blockquote { border-left: 3px solid #2563eb; margin: 0 0 12px; padding: 8px 14px; background: #eff6ff; border-radius: 0 6px 6px 0; color: #1e40af; }
        .md-body hr { border: none; border-top: 1px solid #e2e8f0; margin: 20px 0; }
        .md-body a { color: #2563eb; }
        .loading { text-align: center; padding: 60px; color: #94a3b8; font-size: 14px; }
        .error { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 20px; color: #dc2626; text-align: center; }
    </style>
</head>
<body>
<div class="wrap">
    <a href="help.html" class="back"><i class="fas fa-arrow-left"></i> กลับศูนย์ช่วยเหลือ</a>
    <div id="content" class="loading"><i class="fas fa-spinner fa-spin"></i> กำลังโหลด...</div>
</div>
<script>
    const params = new URLSearchParams(location.search);
    const file = params.get('file');
    const content = document.getElementById('content');

    if (!file) {
        content.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> ไม่พบไฟล์ที่ต้องการ</div>';
    } else {
        fetch(file)
            .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
            .then(md => {
                document.title = file.replace(/\.md$/i, '') + ' — Powertech IT';
                content.className = 'md-body';
                content.innerHTML = marked.parse(md);
            })
            .catch(() => {
                content.innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i> ไม่สามารถโหลดไฟล์ได้</div>';
            });
    }
</script>
</body>
</html>
