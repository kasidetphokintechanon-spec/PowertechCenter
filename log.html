<style>
/* ════ งานช่าง IT — บอร์ดคิวงาน + หน้างาน + ค้นหางานทั้งหมด · สีจาก token design-system (ธีมมืดเปลี่ยนตามเอง) ════ */
body { background:var(--ptc-bg); color:var(--ptc-text); margin:0; }
.lg-tabs { display:flex; border:1px solid var(--ptc-border); border-radius:8px; overflow:hidden; margin-left:auto; }
.lg-tabs button { height:34px; padding:0 14px; border:0; background:var(--ptc-surface); color:var(--ptc-text-2); font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.lg-tabs button.on { background:var(--ptc-text); color:var(--ptc-surface); }
.lg-tabs .cnt { min-width:18px; height:18px; border-radius:9px; background:#dc2626; color:#fff; font-size:11px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
.nb { height:34px; padding:0 12px; border:1px solid var(--ptc-border); border-radius:8px; display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12.5px; font-weight:700; color:var(--ptc-text-2); text-decoration:none; background:var(--ptc-surface); cursor:pointer; white-space:nowrap; }
.nb.pri { background:var(--ptc-primary); border-color:var(--ptc-primary); color:#fff; }
.wrap { max-width:1480px; margin:0 auto; padding:18px 16px 40px; }
.card { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; }
.btn { height:36px; padding:0 13px; border-radius:8px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap; text-decoration:none; }
.btn:hover { border-color:var(--ptc-primary); }
.btn.pri { background:var(--ptc-primary); border-color:var(--ptc-primary); color:#fff; }
.btn.ok { background:#16a34a; border-color:#16a34a; color:#fff; }
.btn.sm { height:30px; padding:0 10px; font-size:12px; }
.btn.danger { color:#dc2626; }
.btn.ghost { background:transparent; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.muted { color:var(--ptc-text-muted); }
.pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; color:var(--c, #64748b); background:color-mix(in srgb, var(--c, #64748b) 12%, transparent); }
.chip { padding:6px 12px; border-radius:99px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
.chip.on { border-color:var(--ptc-primary); background:var(--ptc-primary-light); color:var(--ptc-primary); }
.av { width:22px; height:22px; border-radius:50%; background:var(--ptc-primary); color:#fff; font-size:9px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.empty { padding:30px 14px; text-align:center; color:var(--ptc-text-muted); font-size:13px; }
.empty i { font-size:22px; display:block; margin-bottom:6px; opacity:.6; }

/* KPI */
.kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:14px; }
.kpi { padding:12px 14px; cursor:pointer; text-align:left; font:inherit; color:inherit; }
.kpi b { font-size:24px; font-weight:800; display:block; line-height:1.15; }
.kpi span { font-size:12px; color:var(--ptc-text-muted); }
.kpi.on { border-color:var(--ptc-primary); box-shadow:0 0 0 3px var(--ptc-primary-ring, rgba(37,99,235,.15)); }
.kpi.bad { background:#fef2f2; border-color:#fecaca; } .kpi.bad b { color:#dc2626; }
html.dark .kpi.bad { background:rgba(220,38,38,.1); border-color:rgba(220,38,38,.35); }
.fbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.fbar input[type=text] { flex:1; min-width:180px; height:36px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 12px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }

/* บอร์ด */
.board { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start; }
.col { background:var(--ptc-surface-2); border:1px solid var(--ptc-border); border-radius:10px; padding:10px; min-width:0; }
.col-h { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; padding:2px 4px 10px; }
.col-h i.dot { width:8px; height:8px; border-radius:50%; background:var(--c); }
.col-h .n { margin-left:auto; font-size:11.5px; font-weight:700; background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:99px; padding:0 8px; }
.jc { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:9px; padding:10px 11px; margin-bottom:8px; cursor:pointer; display:block; min-width:0; }
.jc:last-child { margin-bottom:0; }
.jc:hover { border-color:var(--ptc-primary); }
.jc.u3 { box-shadow:inset 3px 0 0 #dc2626; } .jc.u2 { box-shadow:inset 3px 0 0 #d97706; }
.jc-top { display:flex; align-items:center; gap:6px; font-size:11.5px; min-width:0; }
.jc-top .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); white-space:nowrap; }
.sla { margin-left:auto; font-size:11px; font-weight:700; padding:1px 7px; border-radius:99px; white-space:nowrap; }
.sla.ok { color:#16a34a; background:#f0fdf4; } .sla.warn { color:#b45309; background:#fffbeb; } .sla.bad { color:#fff; background:#dc2626; } .sla.wait { color:var(--ptc-text-muted); background:var(--ptc-surface-2); }
html.dark .sla.ok { background:rgba(22,163,74,.14); } html.dark .sla.warn { background:rgba(217,119,6,.16); }
.jc h4 { font-size:13.5px; font-weight:700; margin:5px 0 3px; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.jc-m { font-size:11.5px; color:var(--ptc-text-muted); display:flex; flex-wrap:wrap; gap:2px 10px; }
.jc-m span { overflow-wrap:anywhere; }
.jc-f { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11.5px; color:var(--ptc-text-2); flex-wrap:wrap; }
.jc-f .who { display:flex; align-items:center; gap:6px; min-width:0; }
.mtabs { display:none; }

/* หน้างาน */
.ws { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; align-items:start; }
.back { font-size:13px; color:var(--ptc-primary); font-weight:700; cursor:pointer; margin-bottom:10px; display:inline-flex; gap:6px; align-items:center; background:none; border:0; font-family:inherit; padding:0; }
.ws-h { padding:16px 18px; border-bottom:1px solid var(--ptc-border); }
.ws-h .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); }
.ws-h h2 { font-size:19px; margin:6px 0 3px; overflow-wrap:anywhere; }
.sec { padding:14px 18px; border-bottom:1px solid var(--ptc-border); }
.sec:last-child { border-bottom:0; }
.sec h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); letter-spacing:.03em; margin:0 0 8px; }
.qa { display:grid; grid-template-columns:110px 1fr; gap:5px 12px; font-size:13px; }
.qa span { color:var(--ptc-text-muted); } .qa b { font-weight:600; overflow-wrap:anywhere; }
.imgs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.imgs a { width:92px; height:70px; border-radius:8px; overflow:hidden; border:1px solid var(--ptc-border); display:block; }
.imgs img { width:100%; height:100%; object-fit:cover; }
.acts { display:flex; gap:8px; flex-wrap:wrap; }
.acts .btn { flex:1 1 150px; height:40px; }
.notes { font-size:13px; white-space:pre-line; overflow-wrap:anywhere; margin:0; color:var(--ptc-text-2); }
.tl-i { display:flex; gap:12px; position:relative; padding-bottom:12px; }
.tl-i:before { content:''; position:absolute; left:6px; top:16px; bottom:0; width:2px; background:var(--ptc-border); }
.tl-i:last-child:before { display:none; }
.tl-i > i { width:14px; height:14px; border-radius:50%; background:var(--ptc-border); border:3px solid var(--ptc-surface); box-shadow:0 0 0 1px var(--ptc-border); flex-shrink:0; margin-top:3px; z-index:1; }
.tl-i.it > i { background:var(--ptc-primary); box-shadow:0 0 0 1px var(--ptc-primary); }
.tl-i.ok > i { background:#16a34a; box-shadow:0 0 0 1px #16a34a; }
.tl-i.me > i { background:#64748b; box-shadow:0 0 0 1px #64748b; }
.tl-i .b { min-width:0; flex:1; }
.tl-i b { font-size:13px; display:block; } .tl-i span { font-size:12px; color:var(--ptc-text-muted); }
.tl-i p { font-size:12.5px; color:var(--ptc-text-2); margin:4px 0 0; background:var(--ptc-surface-2); border:1px solid var(--ptc-border); border-radius:8px; padding:7px 10px; white-space:pre-line; overflow-wrap:anywhere; }
.tl-i p img { max-width:180px; border-radius:6px; display:block; margin-top:6px; }
.compose textarea { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:9px 11px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; resize:vertical; }
.compose .row { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; font-size:12.5px; }
.compose label { display:inline-flex; gap:6px; align-items:center; cursor:pointer; color:var(--ptc-text-2); }
.side .card { padding:14px 16px; margin-bottom:12px; }
.side h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); letter-spacing:.03em; margin:0 0 10px; }
.person { display:flex; gap:10px; align-items:center; }
.person .av { width:36px; height:36px; font-size:12px; }
.person b { display:block; font-size:13.5px; overflow-wrap:anywhere; } .person div > span { font-size:12px; color:var(--ptc-text-muted); }
.filebtn { position:relative; overflow:hidden; }
.filebtn input { position:absolute; inset:0; opacity:0; cursor:pointer; }
.hist { font-size:12.5px; }
.hist a { display:grid; grid-template-columns:70px 1fr; gap:8px; padding:6px 0; border-top:1px solid var(--ptc-border); color:inherit; text-decoration:none; }
.hist a:first-child { border-top:0; }
.hist a:hover b { color:var(--ptc-primary); }
.hist span { color:var(--ptc-text-muted); } .hist b { font-weight:500; overflow-wrap:anywhere; }
.menu-list { display:flex; flex-direction:column; gap:6px; }
.menu-list .btn { justify-content:flex-start; }

/* ทั้งหมด */
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { text-align:left; font-size:11.5px; color:var(--ptc-text-muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--ptc-border); white-space:nowrap; }
.tbl td { padding:10px 12px; border-bottom:1px solid var(--ptc-border); vertical-align:top; }
.tbl tbody tr { cursor:pointer; } .tbl tbody tr:hover { background:var(--ptc-surface-2); }
.tbl .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); white-space:nowrap; }
.tbl .pb { max-width:420px; overflow-wrap:anywhere; }
.fsel, .fdate { height:36px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
.pager { display:flex; align-items:center; gap:8px; padding:12px; font-size:12.5px; color:var(--ptc-text-muted); }
.pager .sp { flex:1; }

/* ฟอร์มใน popup */
.fx { text-align:left; display:grid; gap:10px; }
.fx label { font-size:12.5px; font-weight:700; color:var(--ptc-text-2); display:block; margin-bottom:4px; }
.fx input:not([type=checkbox]), .fx select, .fx textarea { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:8px 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; }
.fx .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.fx .req { color:#dc2626; }
.fx .ck { display:flex; gap:7px; align-items:center; font-size:12.5px; font-weight:500; color:var(--ptc-text-2); cursor:pointer; }
.fx .hint { font-size:12px; color:var(--ptc-text-muted); }
.fx .kb a { display:block; font-size:12.5px; color:var(--ptc-primary); text-decoration:none; padding:2px 0; }
.opt { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.opt label { margin:0; border:1px solid var(--ptc-border); border-radius:8px; padding:9px 10px; cursor:pointer; font-weight:600; display:flex; gap:7px; align-items:center; }
.opt label:has(input:checked) { border-color:var(--ptc-primary); background:var(--ptc-primary-light); color:var(--ptc-primary); }

@media (max-width: 1180px) {
  .kpis { grid-template-columns:repeat(3,1fr); }
  .ws { grid-template-columns:minmax(0,1fr); }
}
@media (max-width: 900px) {
  /* มือถือ/แท็บเล็ต: บอร์ดเหลือทีละช่อง สลับด้วยแท็บ */
  .board { grid-template-columns:minmax(0,1fr); }
  .board .col { display:none; } .board .col.show { display:block; }
  .mtabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px; }
  .mtabs .chip b { margin-left:4px; }
  .tbl thead { display:none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display:block; width:100%; box-sizing:border-box; }
  .tbl tr { border-bottom:1px solid var(--ptc-border); padding:8px 0; }
  .tbl td { border:0; padding:3px 14px; }
}
@media (max-width: 640px) {
  /* มือถือ: ตัวเลขเป็นแถวเลื่อนข้าง เตี้ย ๆ ไม่กินครึ่งจอ */
  .kpis { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-bottom:10px; }
  .kpis::-webkit-scrollbar, .mtabs::-webkit-scrollbar { display:none; }
  .kpi { flex:0 0 auto; min-width:84px; padding:8px 12px; }
  .kpi b { font-size:19px; } .kpi span { font-size:11px; white-space:nowrap; }
  .mtabs { scrollbar-width:none; }
  #v-all .fbar > * { flex:1 1 calc(50% - 8px); min-width:0; }
  #v-all .fbar > input[type=text] { flex-basis:100%; }
  .wrap { padding:12px 10px 30px; }
  .lg-tabs { position:fixed; top:var(--lg-nav-h, 56px); left:0; right:0; z-index:90; border-radius:0; border-width:0 0 1px; margin:0; }
  .lg-tabs button { flex:1; justify-content:center; height:44px; }
  .wrap { padding-top:calc(44px + 12px) !important; }
  .nb span, .ptc-nav-sub { display:none; }
  .qa { grid-template-columns:90px 1fr; }
  .fx .two, .opt { grid-template-columns:1fr; }
}
</style>
</head>

<script>
const gid = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const jsArg = v => esc(JSON.stringify(String(v ?? '')));
const stripTitle = n => String(n || '').replace(/^(Mr\.?|Mrs\.?|Ms\.?|Miss|Dr\.?|นาย|นางสาว|นาง)\s*/i, '').trim();
const firstName = n => stripTitle(n).split(/\s+/)[0] || '';
const initials = n => stripTitle(n).split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';
const toDate = v => v ? new Date(String(v).replace(' ', 'T')) : null;
const thDT = v => { const d = toDate(v); return !d || isNaN(d) ? esc(v || '') : d.toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };
const thD = v => { const d = toDate(v); return !d || isNaN(d) ? esc(v || '') : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' }); };
const localDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const nowStamp = () => new Date().toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' });

// ══════════ เวลา / SLA ══════════
// เวลารับเรื่องตามที่ตั้งในหน้าตั้งค่า (ข้อความ เช่น "ภายใน 4 ชม.") → นาที
function respMin(urg) {
    const txt = { 'ปกติ': SUP.sla_normal, 'ด่วน': SUP.sla_urgent, 'ด่วนที่สุด': SUP.sla_critical }[urg] || '';
    const m = String(txt).match(/(\d+(?:\.\d+)?)\s*(ชม|ชั่วโมง|นาที|วัน)/);
    if (!m) return { 'ปกติ': 240, 'ด่วน': 120, 'ด่วนที่สุด': 30 }[urg] || 240;
    return +m[1] * (m[2] === 'นาที' ? 1 : m[2] === 'วัน' ? 1440 : 60);
}
const now = () => Date.now() + clockSkew;
const created = l => toDate(l.created_at) || toDate(l.date + ' 08:00');
function fmtMin(m) {
    m = Math.max(0, Math.round(m));
    if (m < 60) return m + ' นาที';
    const h = Math.floor(m / 60), r = m % 60;
    if (h < 24) return h + (r && h < 3 ? ':' + String(r).padStart(2, '0') : '') + ' ชม.';
    const d = Math.floor(h / 24);
    return d + ' วัน' + (h % 24 && d < 3 ? ' ' + (h % 24) + ' ชม.' : '');
}
// คืน { cls, txt, rank } — rank น้อย = เร่งกว่า ใช้เรียงการ์ด
function slaOf(l) {
    const c = created(l); if (!c) return { cls: 'wait', txt: '', rank: 9e9 };
    const el = (now() - c) / 60000;
    if (l.status === 'Awaiting Confirmation') {
        const a = toDate(l.awaiting_confirmation_at) || c;
        return { cls: 'wait', txt: 'รอ ' + fmtMin((now() - a) / 60000), rank: 9e9 };
    }
    if (PARTS.includes(l.status)) return { cls: 'wait', txt: l.eta_date ? 'ของถึง ' + thD(l.eta_date) : 'รอ ' + fmtMin(el), rank: 8e9 };
    const lim = l.status === 'Pending' ? respMin(l.urgency) : (FIX_H[l.urgency] || 72) * 60;
    const left = lim - el;
    if (left < 0) return { cls: 'bad', txt: 'เกิน ' + fmtMin(-left), rank: left };
    return { cls: left < lim * 0.25 ? 'warn' : 'ok', txt: 'เหลือ ' + fmtMin(left), rank: left };
}

// ══════════ ข้อความปัญหา ══════════
function parseProblem(p) {
    const out = { cat: '', fields: [], text: '' };
    const rest = [];
    String(p || '').split('\n').map(s => s.trim()).filter(Boolean).forEach((ln, i) => {
        const m0 = i === 0 && ln.match(/^\[([^\]]+)\]\s*(.*)$/);
        if (m0) { out.cat = m0[2]; return; }
        const m = ln.match(/^([^:：]{2,24})[:：]\s*(.+)$/);
        if (m && !/^https?$/i.test(m[1])) out.fields.push([m[1], m[2]]); else rest.push(ln);
    });
    out.text = rest.join('\n');
    return out;
}
function titleOf(l) {
    const p = parseProblem(l.problem);
    const sym = p.fields.find(f => /อาการ|ความต้องการ/.test(f[0]));
    return (sym ? sym[1] : p.text || p.fields[0]?.[1] || l.problem || '-').split('\n')[0];
}
const field = (l, re) => (parseProblem(l.problem).fields.find(f => re.test(f[0])) || [])[1] || '';

async function api(params) {
    const j = await (await fetch('api.php?' + new URLSearchParams(params), { cache: 'no-store' })).json();
    return j;
}
async function post(obj) {
    const fd = new FormData();
    Object.entries(obj).forEach(([k, v]) => { if (v !== undefined && v !== null) fd.append(k, v); });
    const j = await (await fetch('api.php', { method: 'POST', body: fd })).json();
    if (j.status !== 'success') throw new Error(j.message || 'ไม่สำเร็จ');
    return j;
}

    lastPending = pend;

}
function isMine(l) { return String(l.servicedById || '') === String(S.user_id); }
function renderCoChips() {

        + `<button class="chip ${fMine ? 'on' : ''}" onclick="fMine=!fMine;fKpi='';renderCoChips();renderKpis();renderBoard()"><i class="fa fa-user"></i> เฉพาะของฉัน</button>`;
}
function renderKpis() {

}
function setKpi(k) {
    fKpi = fKpi === k ? '' : k; fMine = false;
    // มือถือเห็นทีละช่อง → กดตัวเลขแล้วพาไปช่องที่ตรง
    if (fKpi === 'new') mCol = 'new'; else if (fKpi === 'confirm') mCol = 'confirm';
    renderCoChips(); renderKpis(); renderBoard();
}
function boardRows() {
    const q = (gid('q').value || '').toLowerCase().trim();
    return board.filter(l => !CLOSED.includes(l.status))
        .filter(l => !fCo || l.company === fCo)
        .filter(l => !(fMine || fKpi === 'mine') || isMine(l))
        .filter(l => fKpi !== 'late' || slaOf(l).cls === 'bad')
        .filter(l => !q || [l.id, l.requester, l.department, l.problem, l.asset_id, l.servicedBy].join(' ').toLowerCase().includes(q));
}
function subBadge(l) {
    if (l.status === 'Waiting for User') return '<span class="pill" style="--c:#dc2626">รอผู้แจ้งตอบ</span>';
    if (l.status === 'Temporary Fix') return '<span class="pill" style="--c:#4f46e5">แก้ชั่วคราว</span>';

}
function card(l) {
    const s = slaOf(l), u = URG.indexOf(l.urgency) + 1;
    const where = l.asset_id || field(l, /ตำแหน่ง/);

// ══════════ หน้างาน ══════════
async function getTicket(id) {
    const j = await api({ action: 'get', file: 'it_logs', id, paginate: '1', page: '1', per_page: '1', v: Date.now() });
    const l = (j.data || [])[0];
    if (!l) return null;
    const b = board.find(x => x.id === id);
    if (b) { l.created_at = b.created_at; l.accepted_at = b.accepted_at; }
    return l;
}
async function openTicket(id, keepScroll) {
    curId = id;
    showView('ws');
    try { const u = new URL(location.href); u.searchParams.set('ticket_id', id); history.replaceState(null, '', u); } catch (_) {}
    const box = gid('v-ws');
    if (!keepScroll) { box.innerHTML = '<div class="empty"><i class="fa fa-spinner fa-spin"></i>กำลังโหลด…</div>'; window.scrollTo(0, 0); }
    const l = await getTicket(id);
    if (curId !== id) return;
    if (!l) { box.innerHTML = '<button class="back" onclick="closeTicket()"><i class="fa fa-arrow-left"></i> กลับ</button><div class="card empty">ไม่พบงานนี้ หรือไม่มีสิทธิ์ดู</div>'; return; }
    const b = board.find(x => x.id === id); if (b) b._st = l.status;
    const [ev, cm, at, hist] = await Promise.all([
        api({ action: 'get_ticket_events', log_id: id }).catch(() => ({})),
        api({ action: 'get_ticket_comments', ticket_id: id }).catch(() => ({})),
        api({ action: 'get', file: 'it_log_attachments', log_id: id }).catch(() => []),
        l.asset_id ? api({ action: 'get_asset_repair_history', asset_id: l.asset_id }).catch(() => []) : Promise.resolve([]),
    ]);
    if (curId !== id) return;
    if (!l.created_at) l.created_at = ((ev.events || []).find(e => e.event_type === 'CREATE') || {}).created_at;
    renderWs(l, ev.events || [], cm.comments || [], Array.isArray(at) ? at : [], Array.isArray(hist) ? hist.filter(h => h.id !== id) : []);
    loadKb(l);
}
function closeTicket() {
    curId = null;
    try { const u = new URL(location.href); u.searchParams.delete('ticket_id'); u.searchParams.delete('id'); history.replaceState(null, '', u); } catch (_) {}
    showView(gid('tab-all-btn').classList.contains('on') ? 'all' : 'queue');
}
function actionButtons(l) {
    const id = jsArg(l.id), st = l.status;
    if (st === 'Pending') return `<button class="btn pri" onclick="quickAccept(${id})"><i class="fa fa-hand"></i> รับงาน</button><button class="btn" onclick="assign(${id})"><i class="fa fa-user-plus"></i> มอบให้…</button>`;
    if (st === 'Received') return `<button class="btn pri" onclick="setStatus(${id},'In Progress')"><i class="fa fa-play"></i> เริ่มซ่อม</button><button class="btn ok" onclick="finish(${id})"><i class="fa fa-flag-checkered"></i> แก้เสร็จแล้ว</button>`;
    if (['PR Submitted', 'PO Issued', 'Waiting for Parts', 'Waiting Parts'].includes(st)) return `<button class="btn" onclick="parts(${id})"><i class="fa fa-box"></i> อัปเดตจัดซื้อ</button><button class="btn pri" onclick="setStatus(${id},'In Progress','ได้อะไหล่แล้ว ซ่อมต่อ')"><i class="fa fa-box-open"></i> ได้อะไหล่แล้ว ซ่อมต่อ</button>`;
    if (st === 'Sent to Vendor') return `<button class="btn pri" onclick="setStatus(${id},'In Progress','รับเครื่องคืนจากร้านซ่อม')"><i class="fa fa-truck-ramp-box"></i> รับคืนจากร้านแล้ว</button><button class="btn ok" onclick="finish(${id})"><i class="fa fa-flag-checkered"></i> ซ่อมเสร็จ</button>`;
    if (st === 'Awaiting Confirmation') return `${['admin', 'staff'].includes(S.role) ? `<button class="btn ok" onclick="adminClose(${id})"><i class="fa fa-check-double"></i> ปิดงานแทนผู้แจ้ง</button>` : ''}<button class="btn" onclick="reopen(${id})"><i class="fa fa-rotate-left"></i> กลับมาซ่อมต่อ</button>`;
    if (CLOSED.includes(st)) return `<button class="btn" onclick="reopen(${id})"><i class="fa fa-rotate-left"></i> เปิดงานใหม่</button>`;
    return `<button class="btn" onclick="parts(${id})"><i class="fa fa-box"></i> รออะไหล่ / PR</button><button class="btn" onclick="vendor(${id})"><i class="fa fa-truck"></i> ส่งซ่อมภายนอก</button><button class="btn ok" onclick="finish(${id})"><i class="fa fa-flag-checkered"></i> ซ่อมเสร็จ</button>`;
}

    });

    const tl = items.map(i => `<div class="tl-i ${i.cls}"><i></i><div class="b"><b>${esc(i.title)}</b><span>${thDT(i.t)}</span>${i.body || i.file ? `<p>${esc(i.body)}${i.file || ''}</p>` : ''}</div></div>`).join('');

let busy = false;
async function run(label, fn) {
    if (busy) return; busy = true;

}

        html: `<div class="fx"><div><label>ช่าง</label><select id="as-t">${opts}</select></div>
            ${cur ? '<div><label>เหตุผลที่เปลี่ยน <span class="req">*</span></label><textarea id="as-r" rows="2" placeholder="เช่น งานต้องใช้ความเชี่ยวชาญด้านเครือข่าย"></textarea></div>' : ''}</div>`,

    run('มอบหมาย', async () => {

async function setStatus(id, status, note) {

        const l = await ticket(id); if (!l) return;
        const data = { status };
        if (note) data.solution = addNote(l, note);
        // เริ่มซ่อมโดยยังไม่มีช่าง → ถือว่าคนกดเป็นคนรับ
        const extra = {};
        if (status === 'In Progress' && !l.servicedById) { const me = meTech(); data.servicedBy = me.name; extra.servicedById = me.id; }
        await updateItem(l, data, extra);
        await refreshAfter(id, STATUS_TH[status] || status);

async function sendUpdate(id) {
    const msg = (gid('up-msg').value || '').trim(), file = gid('up-file').files[0], wait = gid('up-wait').checked;
    if (!msg && !file) { gid('up-msg').focus(); return; }
    run('ส่งอัปเดต', async () => {
        gid('up-send').disabled = true;
        const fd = new FormData();
        fd.append('action', 'add_ticket_comment'); fd.append('ticket_id', id); fd.append('message', msg);
        if (file) fd.append('comment_file', file);
        if (wait) fd.append('set_waiting', '1');
        const j = await (await fetch('api.php', { method: 'POST', body: fd })).json();
        if (j.status !== 'success') { gid('up-send').disabled = false; throw new Error(j.message || ''); }
        await refreshAfter(id, wait ? 'ส่งแล้ว — รอผู้แจ้งตอบ' : 'ส่งอัปเดตแล้ว');
    });
}

async function reopen(id) {
    const l = await ticket(id); if (!l) return;
    const { value, isConfirmed } = await ptcSwal().fire({ title: 'เปิดกลับมาซ่อมต่อ', input: 'text', inputPlaceholder: 'เหตุผล เช่น อาการกลับมาอีก', showCancelButton: true, confirmButtonText: 'เปิดงาน', cancelButtonText: 'ยกเลิก', inputValidator: v => !v.trim() && 'กรุณาระบุเหตุผล' });
    if (!isConfirmed) return;
    run('เปิดงาน', async () => {
        await updateItem(l, { status: 'In Progress', solution: (l.solution ? l.solution + '\n' : '') + `[Reopened ${new Date().toLocaleString('th-TH')}]: ${value.trim()}` });
        await refreshAfter(id, 'เปิดงานแล้ว');
    });
}
async function cancelJob(id) {
    const P = ['แจ้งซ้ำกับงานอื่น', 'ไม่อยู่ในขอบเขตงาน IT', 'ผู้แจ้งขอยกเลิก', 'ติดต่อผู้แจ้งไม่ได้ / ข้อมูลไม่ครบ', 'ผู้แจ้งแก้ได้เองแล้ว'];
    const { value, isConfirmed } = await ptcSwal().fire({
        title: 'ยกเลิกงาน',
        html: `<div class="fx"><div><label>เหตุผล <span class="req">*</span></label><select id="cc-p"><option value="">— เลือก —</option>${P.map(p => `<option>${p}</option>`).join('')}</select></div><div><label>รายละเอียดเพิ่ม</label><textarea id="cc-x" rows="2"></textarea></div></div>`,
        showCancelButton: true, confirmButtonText: 'ยืนยันยกเลิก', cancelButtonText: 'ไม่ยกเลิก', focusConfirm: false,
        preConfirm: () => { const p = gid('cc-p').value; if (!p) return Swal.showValidationMessage('กรุณาเลือกเหตุผล'); const x = gid('cc-x').value.trim(); return x ? `${p}: ${x}` : p; },
    });
    if (!isConfirmed) return;
    run('ยกเลิก', async () => { await post({ action: 'cancel_ticket', id, reason: `[CANCELLED BY IT] เหตุผล: ${value}` }); await refreshAfter(id, 'ยกเลิกแล้ว'); });
}
async function editTicket(id) {
    const l = await getTicket(id); if (!l) return;
    const { value, isConfirmed } = await ptcSwal().fire({
        title: 'แก้ไขข้อมูลงาน',
        html: `<div class="fx"><div class="two"><div><label>หมวด</label><select id="ed-t">${TYPES.map(t => `<option value="${t[0]}" ${t[0] === l.type ? 'selected' : ''}>${t[1]}</option>`).join('')}${TYPES.some(t => t[0] === l.type) ? '' : `<option value="${esc(l.type)}" selected>${esc(l.type)}</option>`}</select></div>
            <div><label>ความด่วน</label><select id="ed-u">${URG.map(u => `<option ${u === l.urgency ? 'selected' : ''}>${u}</option>`).join('')}</select></div></div>
            <div class="two"><div><label>รหัสเครื่อง</label><input id="ed-a" value="${esc(l.asset_id || '')}" placeholder="เช่น PTA-NB-0142"></div><div><label>เบอร์ติดต่อ</label><input id="ed-c" value="${esc(l.contact || '')}"></div></div></div>`,
        showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก', focusConfirm: false,
        preConfirm: () => ({ type: gid('ed-t').value, urgency: gid('ed-u').value, asset_id: gid('ed-a').value.trim(), contact: gid('ed-c').value.trim() || null }),
    });
    if (!isConfirmed) return;
    run('บันทึก', async () => { await updateItem(l, value); await refreshAfter(id, 'บันทึกแล้ว'); });
}
async function printTicket(id) {
    const l = await getTicket(id); if (!l) return;
    try { await TicketPrint.preview(l); } catch (e) { ptcAlert('error', 'พิมพ์ไม่สำเร็จ', e.message); }
}

// รับแจ้งทางโทรศัพท์ / เดินมาแจ้ง
let emps = null;
async function newTicket() {
    if (!emps) {
        try { const j = await api({ action: 'get', file: 'employees', status_filter: 'active' }); emps = (Array.isArray(j) ? j : []).map(e => { let a = e.assignments; if (typeof a === 'string') { try { a = JSON.parse(a); } catch (_) { a = []; } } const p = (a || []).find(x => x.is_primary == 1) || (a || [])[0] || {}; return { id: e.id, name: e.name, co: p.company || '', dept: p.department || '', phone: e.phone || '' }; }); }
        catch (_) { emps = []; }
    }
    const { value, isConfirmed } = await ptcSwal().fire({
        title: 'งานใหม่ (รับแจ้งทางโทรศัพท์ / หน้างาน)', width: 'min(600px, 96vw)',
        html: `<div class="fx"><div><label>ผู้แจ้ง <span class="req">*</span></label><input id="nt-r" list="nt-emps" placeholder="พิมพ์ชื่อหรือรหัสพนักงาน"><datalist id="nt-emps">${emps.map(e => `<option value="${esc(e.name)} · ${esc(e.id)}">${esc(e.dept)} · ${esc(e.co)}</option>`).join('')}</datalist></div>
            <div class="two"><div><label>หมวด</label><select id="nt-t">${TYPES.map(t => `<option value="${t[0]}">${t[1]}</option>`).join('')}</select></div><div><label>ความด่วน</label><select id="nt-u">${URG.map(u => `<option>${u}</option>`).join('')}</select></div></div>
            <div><label>อาการ <span class="req">*</span></label><textarea id="nt-p" rows="3"></textarea></div>
            <div class="two"><div><label>รหัสเครื่อง / ตำแหน่ง</label><input id="nt-a" placeholder="เช่น PTA-NB-0142 หรือ F4 ชั้น 2"></div><div><label>เบอร์ติดต่อ</label><input id="nt-c"></div></div>
            <div><label>รูป (ถ้ามี)</label><input type="file" id="nt-f" accept="image/*" multiple></div>
            <label class="ck"><input type="checkbox" id="nt-me" checked> ฉันรับงานนี้เอง</label></div>`,
        showCancelButton: true, confirmButtonText: 'บันทึกงาน', cancelButtonText: 'ยกเลิก', focusConfirm: false,
        didOpen: () => gid('nt-r').addEventListener('change', () => { const e = pickEmp(gid('nt-r').value); if (e && !gid('nt-c').value) gid('nt-c').value = e.phone; }),
        preConfirm: () => {
            const e = pickEmp(gid('nt-r').value), p = gid('nt-p').value.trim();
            if (!e) return Swal.showValidationMessage('เลือกผู้แจ้งจากรายชื่อ');
            if (!p) return Swal.showValidationMessage('กรุณาระบุอาการ');
            return { e, p, t: gid('nt-t').value, u: gid('nt-u').value, a: gid('nt-a').value.trim(), c: gid('nt-c').value.trim(), f: [...gid('nt-f').files], me: gid('nt-me').checked };
        },
    });
    if (!isConfirmed) return;
    run('บันทึกงาน', async () => {
        const isAsset = /^[A-Z0-9]+-[A-Z0-9-]+$/i.test(value.a) && /\d/.test(value.a);
        const lines = [`[แจ้งซ่อม] ${typeTh(value.t)}`, isAsset ? '' : value.a && `ตำแหน่ง: ${value.a}`, `อาการที่พบ: ${value.p}`, `รับแจ้งโดย: ${stripTitle(S.display_name)} (โทร/หน้างาน)`].filter(Boolean);
        const data = { date: localDate(), company: value.e.co, department: value.e.dept, requester: value.e.name, requester_id: value.e.id, asset_id: isAsset ? value.a.toUpperCase() : '', problem: lines.join('\n'), contact: value.c || null, type: value.t, urgency: value.u, status: 'Pending', service_type: 'IT', request_uid: `log_${Date.now()}_${Math.random().toString(36).slice(2, 10)}` };
        const r = await post({ action: 'add_item', key: 'it_logs', data: JSON.stringify(data), requester_id: value.e.id });
        for (const f of value.f) { try { await post({ action: 'upload_attachment', log_id: r.new_id, attachmentFile: f }); } catch (_) {} }
        if (value.me && r.new_id) { const me = meTech(); try { await post({ action: 'update_item', key: 'it_logs', data: JSON.stringify({ id: r.new_id, status: 'Received', servicedBy: me.name }), servicedById: me.id, expected_current_status: 'Pending' }); } catch (_) {} }
        await refreshAfter(null, 'บันทึกงาน ' + (r.new_id || '') + ' แล้ว');
        if (r.new_id) openTicket(r.new_id);
    });
}
function pickEmp(v) {
    const id = String(v || '').split('·').pop().trim();
    return emps.find(e => String(e.id) === id) || emps.find(e => e.name === String(v).trim()) || null;
}

// ══════════ ทั้งหมด ══════════
function allParams(page) {
    const p = { action: 'get', file: 'it_logs', paginate: '1', page: String(page), per_page: '30', v: Date.now() };
    const m = { filter_search: gid('aq').value.trim(), filter_company: gid('a-co').value, filter_status: gid('a-st').value, filter_date_start: gid('a-ds').value, filter_date_end: gid('a-de').value };
    Object.entries(m).forEach(([k, v]) => { if (v) p[k] = v; });
    return p;
}
async function loadAll(page) {
    allPage = Math.max(1, page || 1);
    gid('a-body').innerHTML = '<tr><td colspan="5" class="empty"><i class="fa fa-spinner fa-spin"></i>กำลังโหลด…</td></tr>';
    let j;
    try { j = await api(allParams(allPage)); } catch (e) { gid('a-body').innerHTML = `<tr><td colspan="5" class="empty">โหลดไม่สำเร็จ</td></tr>`; return; }
    const rows = j.data || [];
    gid('a-body').innerHTML = rows.length ? rows.map(l => `<tr onclick="openTicket(${jsArg(l.id)})"><td><span class="no">${esc(l.id)}</span><div class="muted" style="font-size:11.5px">${thD(l.date)}</div></td>
        <td><b style="font-weight:600">${esc(stripTitle(l.requester))}</b><div class="muted" style="font-size:11.5px">${esc(l.department || '')} · ${esc(l.company || '')}</div></td>
        <td class="pb">${esc(titleOf(l))}<div class="muted" style="font-size:11.5px">${esc(typeTh(l.type))}${l.asset_id ? ' · ' + esc(l.asset_id) : ''}</div></td>
        <td><span class="pill" style="--c:${STATUS_C[l.status] || '#d97706'}">${esc(STATUS_TH[l.status] || l.status)}</span></td>
        <td>${l.servicedBy ? `<span class="muted"><i class="fa fa-wrench"></i></span> ${esc(stripTitle(l.servicedBy))}` : '<span class="muted">ยังไม่มีช่าง</span>'}</td></tr>`).join('') : '<tr><td colspan="5" class="empty"><i class="fa fa-inbox"></i>ไม่พบงาน</td></tr>';
    const tot = +j.total || 0, pages = +j.total_pages || 1;
    gid('a-info').textContent = tot ? `${(allPage - 1) * 30 + 1}–${Math.min(allPage * 30, tot)} จาก ${tot} งาน` : '';
    gid('a-prev').disabled = allPage <= 1; gid('a-next').disabled = allPage >= pages;
}
function exportAll() {
    const q = new URLSearchParams({ action: 'export_logs', company: gid('a-co').value, status: gid('a-st').value, type: '', search: gid('aq').value.trim(), date_start: gid('a-ds').value, date_end: gid('a-de').value });
    location.href = 'api.php?' + q;
}

// ══════════ แท็บ / เริ่มต้น ══════════
function syncNavH() { const n = document.querySelector('.ptc-nav'); if (n) document.documentElement.style.setProperty('--lg-nav-h', n.getBoundingClientRect().bottom + 'px'); }
window.addEventListener('resize', syncNavH);
function showView(v) {
    ['queue', 'ws', 'all'].forEach(k => gid('v-' + k).style.display = k === v ? '' : 'none');
}
function switchTab(t) {
    syncNavH();
    curId = null;
    gid('tab-queue-btn').classList.toggle('on', t === 'queue');
    gid('tab-all-btn').classList.toggle('on', t === 'all');
    showView(t);
    try { const u = new URL(location.href); u.searchParams.set('tab', t); u.searchParams.delete('ticket_id'); u.searchParams.delete('id'); history.replaceState(null, '', u); } catch (_) {}
    if (t === 'all' && !gid('a-body').children.length) loadAll(1);
}
(async function init() {
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) { S = {}; }
    if (!S.loggedin) { location.href = 'login.html'; return; }
    const perms = S.effective_permissions || [];
    if (!(S.role === 'admin' || perms.includes('*') || perms.includes('it_log.access'))) {
        gid('v-queue').innerHTML = '<div class="card empty"><i class="fa fa-lock"></i>หน้านี้สำหรับทีม IT · <a href="request.html">ไปหน้าแจ้งซ่อม</a></div>';
        return;
    }
    gid('a-st').innerHTML = '<option value="">ทุกสถานะ</option>' + Object.entries(STATUS_TH).filter(([k]) => !['Waiting Parts', 'Waiting for Parts', 'Parts Received'].includes(k)).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    const q = new URLSearchParams(location.search);
    const [sup, tl] = await Promise.all([
        api({ action: 'get_it_support_settings' }).catch(() => ({})),
        api({ action: 'get', file: 'employees', scope: 'technicians' }).catch(() => []),
    ]);
    SUP = sup || {}; techs = Array.isArray(tl) ? tl : [];
    switchTab(q.get('tab') === 'all' ? 'all' : 'queue');
    await loadBoard();
    const cos = [...new Set(board.map(l => l.company).filter(Boolean)), 'PTA', 'PT4', 'PTE'].filter((v, i, a) => a.indexOf(v) === i).sort();
    gid('a-co').innerHTML = '<option value="">ทุกบริษัท</option>' + cos.map(c => `<option>${esc(c)}</option>`).join('');
    const open = q.get('ticket_id') || q.get('id');
    if (open) openTicket(open);
    // งานที่รอผู้แจ้งยืนยันเกิน 3 วัน ระบบปิดให้เอง
    post({ action: 'auto_close_tickets' }).then(r => { if (r.closed > 0) loadBoard(); }).catch(() => {});
    // รีเฟรชทุก 1 นาทีตอนเปิดหน้าอยู่ — งานใหม่ขึ้นเองไม่ต้องกด
    setInterval(() => { if (document.visibilityState === 'visible') loadBoard(); }, 60000);
    setInterval(() => { if (document.visibilityState === 'visible' && gid('v-queue').style.display !== 'none') { renderKpis(); renderBoard(); } }, 30000);
})();
</script>
