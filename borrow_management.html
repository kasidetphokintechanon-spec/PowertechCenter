<style>
/* ════ ยืม-คืนอุปกรณ์ (IT) — บอร์ด 4 ช่อง + หน้าส่งมอบ/รับคืน + ประวัติ · แพทเทิร์นเดียวกับ log.html · สีจาก token design-system ════ */
/* enterprise-theme ล็อกการเลื่อนทั้งหน้าบนจอกว้าง (ไว้ใช้กับหน้าที่มีเมนูซ้าย) — หน้านี้เลื่อนทั้งหน้าตามปกติ */
html { overflow:auto !important; height:auto !important; } body { overflow:visible !important; height:auto !important; }
body { background:var(--ptc-bg); color:var(--ptc-text); margin:0; }
.lg-tabs { display:flex; border:1px solid var(--ptc-border); border-radius:8px; overflow:hidden; margin-left:auto; }
.lg-tabs button { height:34px; padding:0 14px; border:0; background:var(--ptc-surface); color:var(--ptc-text-2); font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.lg-tabs button.on { background:var(--ptc-text); color:var(--ptc-surface); }
.lg-tabs .cnt { min-width:18px; height:18px; border-radius:9px; background:#dc2626; color:#fff; font-size:11px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
.nb { height:34px; padding:0 12px; border:1px solid var(--ptc-border); border-radius:8px; display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12.5px; font-weight:700; color:var(--ptc-text-2); text-decoration:none; background:var(--ptc-surface); cursor:pointer; white-space:nowrap; }
.wrap { max-width:1480px; margin:0 auto; padding:18px 16px 40px; }
.card { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; }
.btn { height:36px; padding:0 13px; border-radius:8px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap; text-decoration:none; }
.btn:hover { border-color:var(--ptc-primary); }
.btn.pri { background:var(--ptc-primary); border-color:var(--ptc-primary); color:#fff; }
.btn.ok { background:#16a34a; border-color:#16a34a; color:#fff; }
.btn.sm { height:30px; padding:0 10px; font-size:12px; }
.btn.danger { color:#dc2626; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.muted { color:var(--ptc-text-muted); }
.pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; color:var(--c, #64748b); background:color-mix(in srgb, var(--c, #64748b) 12%, transparent); }
.chip { padding:6px 12px; border-radius:99px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
.chip.on { border-color:var(--ptc-primary); background:var(--ptc-primary-light); color:var(--ptc-primary); }
.av { width:22px; height:22px; border-radius:50%; background:var(--ptc-primary); color:#fff; font-size:9px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.empty { padding:30px 14px; text-align:center; color:var(--ptc-text-muted); font-size:13px; }
.empty i { font-size:22px; display:block; margin-bottom:6px; opacity:.6; }
/* KPI */
.kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:14px; }
.kpi { padding:12px 14px; text-align:left; font:inherit; color:inherit; }
.kpi b { font-size:24px; font-weight:800; display:block; line-height:1.15; }
.kpi span { font-size:12px; color:var(--ptc-text-muted); }
.kpi.bad { background:#fef2f2; border-color:#fecaca; } .kpi.bad b { color:#dc2626; }
html.dark .kpi.bad { background:rgba(220,38,38,.1); border-color:rgba(220,38,38,.35); }
.fbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.fbar input[type=text] { flex:1; min-width:180px; height:36px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 12px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
/* บอร์ด */
.board { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start; }
.col { background:var(--ptc-surface-2); border:1px solid var(--ptc-border); border-radius:10px; padding:10px; min-width:0; }
.col-h { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; padding:2px 4px 10px; }
.col-h i.dot { width:8px; height:8px; border-radius:50%; background:var(--c); }
.col-h .n { margin-left:auto; font-size:11.5px; font-weight:700; background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:99px; padding:0 8px; }
.jc { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:9px; padding:10px 11px; margin-bottom:8px; cursor:pointer; display:block; min-width:0; }
.jc:last-child { margin-bottom:0; }
.jc:hover { border-color:var(--ptc-primary); }
.jc.u3 { box-shadow:inset 3px 0 0 #dc2626; } .jc.u2 { box-shadow:inset 3px 0 0 #d97706; }
.jc-top { display:flex; align-items:center; gap:6px; font-size:11.5px; min-width:0; }
.jc-top .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); white-space:nowrap; }
.jc-top .pill { margin-left:auto; }
.jc h4 { font-size:13.5px; font-weight:700; margin:5px 0 3px; overflow-wrap:anywhere; }
.jc-m { font-size:11.5px; color:var(--ptc-text-muted); display:flex; flex-wrap:wrap; gap:2px 10px; }
.jc-f { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11.5px; color:var(--ptc-text-2); flex-wrap:wrap; }
.mtabs { display:none; }
/* หน้าส่งมอบ / รับคืน */
.ws { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; align-items:start; }
.back { font-size:13px; color:var(--ptc-primary); font-weight:700; cursor:pointer; margin-bottom:10px; display:inline-flex; gap:6px; align-items:center; background:none; border:0; font-family:inherit; padding:0; }
.ws-h { padding:16px 18px; border-bottom:1px solid var(--ptc-border); }
.ws-h .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); }
.ws-h h2 { font-size:19px; margin:6px 0 3px; overflow-wrap:anywhere; }
.sec { padding:14px 18px; border-bottom:1px solid var(--ptc-border); }
.sec:last-child { border-bottom:0; }
.sec h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); letter-spacing:.03em; margin:0 0 8px; }
.qa { display:grid; grid-template-columns:110px 1fr; gap:5px 12px; font-size:13px; }
.qa span { color:var(--ptc-text-muted); } .qa b { font-weight:600; overflow-wrap:anywhere; }
.acts { display:flex; gap:8px; flex-wrap:wrap; }
.acts .btn { flex:1 1 150px; height:40px; }
.cks { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
.cks label { display:flex; gap:8px; align-items:center; border:1px solid var(--ptc-border); border-radius:8px; padding:8px 10px; font-size:13px; cursor:pointer; min-width:0; overflow-wrap:anywhere; }
.cks label:has(input:checked) { border-color:#16a34a; background:#f0fdf4; }
.cks label.miss { border-color:#fecaca; background:#fef2f2; color:#b91c1c; }
html.dark .cks label:has(input:checked) { background:rgba(22,163,74,.12); border-color:rgba(22,163,74,.5); }
html.dark .cks label.miss { background:rgba(220,38,38,.1); border-color:rgba(220,38,38,.4); color:#fca5a5; }
.add-it { display:flex; gap:6px; margin-top:8px; }
.add-it input { flex:1; min-width:0; height:34px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
.opt { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.opt label { margin:0; border:1px solid var(--ptc-border); border-radius:8px; padding:9px 10px; cursor:pointer; font-weight:600; font-size:13px; display:flex; gap:7px; align-items:center; }
.opt label:has(input:checked) { border-color:var(--ptc-primary); background:var(--ptc-primary-light); color:var(--ptc-primary); }
.opt label.bad:has(input:checked) { border-color:#dc2626; background:#fef2f2; color:#dc2626; }
html.dark .opt label.bad:has(input:checked) { background:rgba(220,38,38,.12); }
.wipe { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:9px; border:1px solid #fde68a; background:#fffbeb; font-size:13px; cursor:pointer; }
.wipe:has(input:checked) { border-color:#bbf7d0; background:#f0fdf4; }
html.dark .wipe { background:rgba(217,119,6,.1); border-color:rgba(217,119,6,.35); } html.dark .wipe:has(input:checked) { background:rgba(22,163,74,.12); border-color:rgba(22,163,74,.45); }
.wipe input { margin-top:3px; width:16px; height:16px; }
.ta { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:9px 11px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; resize:vertical; }
.sig { position:relative; border:1px dashed var(--ptc-border-strong, #cbd5e1); border-radius:9px; background:#fff; height:160px; touch-action:none; }
.sig canvas { width:100%; height:100%; display:block; cursor:crosshair; }
.sig .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:13px; pointer-events:none; }
.sig .clr { position:absolute; top:6px; right:6px; }
.side .card { padding:14px 16px; margin-bottom:12px; }
.side h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); letter-spacing:.03em; margin:0 0 10px; }
.person { display:flex; gap:10px; align-items:center; }
.person .av { width:36px; height:36px; font-size:12px; }
.person b { display:block; font-size:13.5px; overflow-wrap:anywhere; } .person div > span { font-size:12px; color:var(--ptc-text-muted); }
.hist { font-size:12.5px; }
.hist div { display:grid; grid-template-columns:86px 1fr; gap:8px; padding:6px 0; border-top:1px solid var(--ptc-border); }
.hist div:first-child { border-top:0; }
.hist span { color:var(--ptc-text-muted); } .hist b { font-weight:500; overflow-wrap:anywhere; }
.banner { padding:10px 12px; border-radius:9px; font-size:13px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
.banner b { flex:1; min-width:200px; font-weight:600; }
.banner.go { background:#eff6ff; border:1px solid #bfdbfe; } .banner.bad { background:#fef2f2; border:1px solid #fecaca; }
html.dark .banner.go { background:rgba(37,99,235,.12); border-color:rgba(37,99,235,.35); } html.dark .banner.bad { background:rgba(220,38,38,.1); border-color:rgba(220,38,38,.35); }
/* ประวัติ / เครื่อง */
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { text-align:left; font-size:11.5px; color:var(--ptc-text-muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--ptc-border); white-space:nowrap; }
.tbl td { padding:10px 12px; border-bottom:1px solid var(--ptc-border); vertical-align:top; }
.tbl tbody tr.cl { cursor:pointer; } .tbl tbody tr.cl:hover { background:var(--ptc-surface-2); }
.tbl .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); white-space:nowrap; }
.fsel { height:36px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
.pager { display:flex; align-items:center; gap:8px; padding:12px; font-size:12.5px; color:var(--ptc-text-muted); }
.pager .sp { flex:1; }
.tl { display:flex; gap:2px; min-width:140px; } .tl i { flex:1; height:6px; border-radius:2px; background:#bbf7d0; } .tl i.b { background:#fecaca; }
html.dark .tl i { background:rgba(22,163,74,.45); } html.dark .tl i.b { background:rgba(220,38,38,.55); }
@media (max-width:1180px) { .kpis { grid-template-columns:repeat(3,1fr); } .ws { grid-template-columns:minmax(0,1fr); } }
@media (max-width:900px) {
  .board { grid-template-columns:minmax(0,1fr); }
  .board .col { display:none; } .board .col.show { display:block; }
  .mtabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px; scrollbar-width:none; }
  .mtabs .chip b { margin-left:4px; }
  .tbl thead { display:none; }
  .tbl, .tbl tbody, .tbl tr, .tbl td { display:block; width:100%; box-sizing:border-box; }
  .tbl tr { border-bottom:1px solid var(--ptc-border); padding:8px 0; }
  .tbl td { border:0; padding:3px 14px; }
}
@media (max-width:640px) {
  .kpis { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-bottom:10px; }
  .kpis::-webkit-scrollbar, .mtabs::-webkit-scrollbar { display:none; }
  .kpi { flex:0 0 auto; min-width:84px; padding:8px 12px; }
  .kpi b { font-size:19px; } .kpi span { font-size:11px; white-space:nowrap; }
  .wrap { padding:12px 10px 30px; }
  .lg-tabs { position:fixed; top:var(--lg-nav-h, 56px); left:0; right:0; z-index:90; border-radius:0; border-width:0 0 1px; margin:0; }
  .lg-tabs button { flex:1; justify-content:center; height:44px; }
  .wrap { padding-top:calc(44px + 12px) !important; }
  .nb span, .ptc-nav-sub { display:none; }
  .qa { grid-template-columns:90px 1fr; }
  .cks, .opt { grid-template-columns:1fr; }
}
</style>

<body>

<main class="wrap">

        <div class="kpis" id="kpis"></div>
        <div class="fbar"><input type="text" id="q" placeholder="ค้นหาเลขที่ / ผู้ยืม / รหัสเครื่อง…" oninput="renderBoard()"></div>

            <select class="fsel" id="hs" onchange="loadHist(1)"><option value="">ทุกสถานะ</option><option value="requested">รออนุมัติ</option><option value="approved">รอรับของ</option><option value="active">กำลังยืม</option><option value="returned">คืนแล้ว</option><option value="rejected">ไม่อนุมัติ</option><option value="cancelled">ยกเลิก</option></select></div>

<script>
const gid = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const thD = s => s ? new Date(String(s).slice(0, 10) + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : '';
const thDT = s => s ? new Date(String(s).replace(' ', 'T')).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const initials = n => String(n || '').replace(/^(Mr\.?|Mrs\.?|Ms\.?|นาย|นางสาว|นาง)\s*/i, '').split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';
const STATUS_C = { requested: '#d97706', approved: '#2563eb', active: '#ea580c', returned: '#16a34a', rejected: '#64748b', cancelled: '#64748b' };
const COND = { ok: 'ปกติ', minor: 'มีรอยเล็กน้อย', broken: 'เสีย ต้องซ่อม' };

let rows = [], today = ymd(new Date()), util = null, mcol = 'new', cur = null, sig = null, busy = false;

async function api(p) { const j = await (await fetch('api.php?' + new URLSearchParams(p), { cache: 'no-store' })).json(); if (j.status !== 'success') throw new Error(j.message || 'โหลดไม่สำเร็จ'); return j; }
async function post(o) { const fd = new FormData(); Object.entries(o).forEach(([k, v]) => fd.append(k, v ?? '')); const j = await (await fetch('api.php', { method: 'POST', body: fd })).json(); if (j.status !== 'success') throw new Error(j.message || 'ไม่สำเร็จ'); return j; }

// ── บอร์ด ──
function colOf(l) {
    if (l.status === 'requested') return 'new';
    if (l.status === 'approved') return 'out';
    if (l.status === 'active') return l.extend_status === 'pending' ? 'new' : 'act';
    return 'done';
}
const COLS = [{ k: 'new', t: 'คำขอใหม่', c: '#d97706' }, { k: 'out', t: 'รอรับของ', c: '#2563eb' }, { k: 'act', t: 'กำลังยืม', c: '#ea580c' }, { k: 'done', t: 'ปิดวันนี้', c: '#16a34a' }];
function renderKpis() {
    const n = s => rows.filter(s).length;
    const k = [
        { b: n(l => l.status === 'requested' || l.extend_status === 'pending' && l.status === 'active'), s: 'รอตัดสินใจ' },
        { b: n(l => l.status === 'approved' && l.start_date <= today), s: 'ต้องส่งมอบวันนี้' },
        { b: n(l => l.status === 'active'), s: 'กำลังยืม' },
        { b: n(l => l.overdue_days > 0), s: 'เกินกำหนดคืน', bad: true },
        { b: util == null ? '-' : util + '%', s: 'ใช้งานเครื่อง 30 วัน' },
    ];
    gid('kpis').innerHTML = k.map(x => `<div class="card kpi ${x.bad && x.b ? 'bad' : ''}"><b>${x.b}</b><span>${x.s}</span></div>`).join('');
    const c = k[0].b; gid('new-cnt').textContent = c; gid('new-cnt').style.display = c ? '' : 'none';
}
function card(l) {

function sigBox(label) { return `<h4 style="margin-top:14px">${label}</h4><div class="sig" id="sig"><canvas></canvas><span class="ph">เซ็นชื่อตรงนี้ (นิ้ว / เมาส์)</span><button class="btn sm clr" type="button" onclick="sig.clear()">ล้าง</button></div>`; }
function mountSig() {
    const box = gid('sig'); if (!box) return (sig = null);
    const cv = box.querySelector('canvas'), ph = box.querySelector('.ph'), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = '#0f172a';
    let draw = false, used = false, last = null;
    const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = e => { draw = true; last = pt(e); cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = e => { if (!draw) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; if (!used) { used = true; ph.style.display = 'none'; } };
    cv.onpointerup = cv.onpointercancel = () => { draw = false; };

}

        const busyOn = (it, d) => it.bookings.some(b => b.from <= d && (!b.to || b.to >= d));
        gid('eq').innerHTML = j.items.length ? `<table class="tbl"><thead><tr><th>รหัส</th><th>อุปกรณ์</th><th>สถานะเครื่อง</th><th>14 วันข้างหน้า</th><th>ของในชุด</th></tr></thead><tbody>
            ${j.items.map(i => `<tr><td class="no">${esc(i.equipment_id)}</td><td><b style="font-weight:600">${esc(i.name)}</b><br><span class="muted" style="font-size:12px">${esc(i.category)}${i.company ? ' · ' + esc(i.company) : ''}</span></td>
                <td><span class="pill" style="--c:${i.blocked ? '#dc2626' : i.status === 'ถูกยืม' ? '#ea580c' : '#16a34a'}">${esc(i.status)}</span></td>
                <td><div class="tl">${Array.from({ length: 14 }, (_, n) => `<i class="${busyOn(i, addDays(t, n)) ? 'b' : ''}" title="${thD(addDays(t, n))}"></i>`).join('')}</div></td>
                <td style="font-size:12px">${esc(i.accessories.join(', ') || '-')}</td></tr>`).join('')}</tbody></table>`
            : '<div class="empty"><i class="fa fa-box-open"></i>ยังไม่มีเครื่องที่เปิดให้ยืม — ตั้ง "ให้ยืมได้" ที่หน้าทะเบียนทรัพย์สิน</div>';
    } catch (e) { gid('eq').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ── เริ่มต้น ──
function syncNavH() { const n = document.querySelector('.ptc-nav'); if (n) document.documentElement.style.setProperty('--lg-nav-h', n.getBoundingClientRect().bottom + 'px'); }
window.addEventListener('resize', syncNavH);
function tab(t) {
    syncNavH();
    ['board', 'ws', 'hist', 'eq'].forEach(k => gid('v-' + k).style.display = k === t ? '' : 'none');
    ['board', 'hist', 'eq'].forEach(k => gid('t-' + k).classList.toggle('on', k === t || (t === 'ws' && k === 'board')));
    if (t !== 'ws') { try { const u = new URL(location.href); u.searchParams.delete('id'); u.searchParams.set('tab', t); history.replaceState(null, '', u); } catch (_) {} }
    if (t === 'hist') loadHist(1);
    if (t === 'eq') loadEq();
    window.scrollTo(0, 0);
}
(async function init() {
    let S = {};
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) {}
    if (!S.loggedin) { location.href = 'login.html?returnUrl=' + encodeURIComponent(location.pathname.split('/').pop() + location.search); return; }
    const qs = new URLSearchParams(location.search);
    await loadBoard();
    if (+qs.get('id')) openWs(+qs.get('id'));
    else tab(['hist', 'eq'].includes(qs.get('tab')) ? qs.get('tab') : 'board');
    // รีเฟรชบอร์ดทุก 1 นาทีตอนเปิดหน้าอยู่ — ไม่ยุ่งตอนกำลังเซ็น/กรอกในหน้าส่งมอบ
    setInterval(() => { if (document.visibilityState === 'visible' && gid('v-board').style.display !== 'none') loadBoard(); }, 60000);
})();
</script>
