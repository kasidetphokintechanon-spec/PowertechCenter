<script>
    let currentTab = 'pending';
    let currentItem = null;
    let signaturePad = null;
    let allHistoryItems = [];
    let currentLoanItems = [];
    const api = 'api.php';
    let _cachedSession = null;   // session fetched once, reused across tab switches
    let _loadSeq = 0;            // increment on each loadData() call; stale calls bail early

    document.addEventListener('DOMContentLoaded', () => {
        initSignaturePad();
        loadData();
        setInterval(updateBadgeCount, 10000);
    });

    function initSignaturePad() {
        const canvas = document.getElementById('signature-pad');
        signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(255, 255, 255)' });
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    }

    function resizeCanvas() {
        const canvas = document.getElementById('signature-pad');
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        canvas.getContext('2d').scale(ratio, ratio);
    }

    function hasValidDate(value) {
        if (!value) return false;
        const raw = String(value).trim().toLowerCase();
        return raw && raw !== 'null' && raw !== '0000-00-00' && raw !== '0000-00-00 00:00:00';
    }

    function toDateOnly(value) {
        if (!hasValidDate(value)) return '';
        return String(value).split(' ')[0];
    }

    function getHistoryStatusMeta(item) {
        const isReturned = hasValidDate(item.return_date);
        const expectedReturnDate = toDateOnly(item.expected_return_date);
        const expectedDateObj = expectedReturnDate ? new Date(`${expectedReturnDate}T00:00:00`) : null;
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const isOverdue = !isReturned && !!expectedDateObj && expectedDateObj < today;
        return { isReturned, isOverdue, expectedReturnDate };
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function switchTab(tab) {
        currentTab = tab;
        ['pending', 'active', 'history'].forEach(t => {
            const el = document.getElementById('tab-' + t);
            if (el) el.classList.toggle('active', t === tab);
        });

        const filterDiv = document.getElementById('history-filters');
        const contentArea = document.getElementById('content-area');
        const summary = document.getElementById('active-loan-summary');

        if (tab === 'history') {
            filterDiv.classList.add('visible');
            contentArea.className = 'borrow-card-list';
            if (summary) summary.style.display = 'none';
        } else {
            filterDiv.classList.remove('visible');
            contentArea.className = 'borrow-card-grid';
            if (summary) summary.style.display = '';
        }
        loadData();
    }

    function setBadgeValue(elId, count) {
        const el = document.getElementById(elId);
        if (!el) return;
        el.textContent = count;
        el.classList.toggle('show', count > 0);
    }

    function setLoanBadgesAndSummary(items) {
        if (!Array.isArray(items)) return;
        const pendingItems = items.filter(i => i.loan_status === 'Pending');
        const activeItems = items.filter(i => i.loan_status === 'Active');
        setBadgeValue('badge-pending', pendingItems.length);
        setBadgeValue('badge-active', activeItems.length);

        const summary = document.getElementById('active-loan-summary');
        const countText = document.getElementById('active-loan-count-text');
        const listEl = document.getElementById('active-loan-list');
        if (!summary || !countText || !listEl) return;
        countText.textContent = `${activeItems.length} รายการ`;
        if (currentTab === 'history') {
            summary.style.display = 'none';
            return;
        }
        summary.style.display = '';
        if (activeItems.length === 0) {
            listEl.innerHTML = `<li style="color:#94a3b8;font-size:13px;padding:4px 0">ตอนนี้ไม่มีรายการที่กำลังถูกยืม</li>`;
            return;
        }
        const previewItems = activeItems.slice(0, 5);
        listEl.innerHTML = previewItems.map(i => {
            const dueText = hasValidDate(i.return_date)
                ? new Date(`${toDateOnly(i.return_date)}T00:00:00`).toLocaleDateString('th-TH')
                : 'ไม่มีกำหนดคืน';
            return `<li class="active-loan-item">
                <div style="min-width:0;flex:1">
                    <div class="active-loan-item-name">${escapeHtml(i.asset_name || '-')}</div>
                    <div class="active-loan-item-sub">${escapeHtml(i.equipment_id || '-')} · ${escapeHtml(i.borrower_name || '-')}</div>
                </div>
                <div class="active-loan-item-due">คืน ${dueText}</div>
            </li>`;

    async function loadData() {
        const seq = ++_loadSeq;
        const area = document.getElementById('content-area');
        area.innerHTML = '<div class="loading-center"><i class="fas fa-circle-notch fa-spin"></i></div>';

        try {
            // Fetch session only once; reuse on subsequent tab switches
            if (!_cachedSession) {
                const sessRes = await fetch(`${api}?action=check_session`);
                _cachedSession = await sessRes.json();
                const _p = _cachedSession.effective_permissions || [];
                const isItUser = (_cachedSession.role === 'admin')
                    || (_cachedSession.primary_department === 'IT')
                    || _p.includes('*')
                    || _p.includes('loan.manage');
                if (!isItUser) {
                    await Swal.fire({
                        icon: 'error',
                        title: 'Access Denied',
                        text: 'หน้าจัดการการยืม-คืนใช้สำหรับทีม IT/ผู้ดูแลเท่านั้น',
                        confirmButtonText: 'กลับหน้าแรก'
                    });
                    window.location.href = 'index.html';
                    return;
                }
            }
            const sess = _cachedSession;

            // Bail if a newer loadData() call has already started
            if (seq !== _loadSeq) return;

            if (currentTab === 'history') {
                currentLoanItems = [];
                const res = await fetch(`${api}?action=getLoanManagementHistory`);
                const items = await res.json();
                if (seq !== _loadSeq) return;
                allHistoryItems = items;
                renderHistoryTable();
                return;
            }

            let companyParam = sess.company || '';
            if (sess.role === 'admin') companyParam = 'All';
            const res = await fetch(`${api}?action=getLoanRequests&company=${encodeURIComponent(companyParam)}&t=${Date.now()}`);
            if (!res.ok) {
                const text = await res.text();
                throw new Error(`Server Error: ${res.status} ${res.statusText}\n${text}`);
            }
            const items = await res.json();

            if (seq !== _loadSeq) return;

            if (!Array.isArray(items)) {
                area.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color:#ef4444"></i><p style="color:#ef4444">API Error: ${items.message || 'Unknown error'}</p></div>`;
                return;
            }
            setLoanBadgesAndSummary(items);

            const filtered = items.filter(i => currentTab === 'pending' ? i.loan_status === 'Pending' : i.loan_status === 'Active');
            currentLoanItems = filtered;

            if (filtered.length === 0) {
                area.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>ไม่มีรายการ${currentTab === 'pending' ? 'รออนุมัติ' : 'ที่กำลังถูกยืม'}</p></div>`;

            area.innerHTML = filtered.map(i => {

                    ? `uploads/employees/${i.borrower_image}`

                const dueDateText = hasValidDate(i.return_date)
                    ? new Date(`${toDateOnly(i.return_date)}T00:00:00`).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' })
                    : 'ไม่มีกำหนดคืน';
                const purposeText = i.purpose ? escapeHtml(i.purpose) : '-';

                return `
                <div class="ptc-card loan-card">
                    <div class="loan-card-img">
                        <img src="${img}" alt="${escapeHtml(i.asset_name)}">
                        <span class="loan-card-id-tag">${escapeHtml(i.equipment_id)}</span>
                    </div>
                    <div class="loan-card-body">
                        <div class="loan-card-title">${escapeHtml(i.asset_name || 'ไม่ระบุชื่อ')}</div>
                        <div class="loan-card-meta">
                            <div class="loan-card-borrower">
                                <img src="${borrowerImgSrc}" alt="${escapeHtml(i.borrower_name)}">
                                <div>
                                    <div class="loan-card-borrower-name">${escapeHtml(i.borrower_name)}</div>
                                    <div class="loan-card-borrower-dept">${escapeHtml(i.department)}</div>
                                </div>
                            </div>
                            <div class="loan-card-info"><i class="fas fa-calendar" style="color:#fb923c"></i><span>กำหนดคืน: ${dueDateText}</span></div>
                            <div class="loan-card-info"><i class="fas fa-clipboard-list" style="color:#60a5fa"></i><span>วัตถุประสงค์: ${purposeText}</span></div>
                        </div>
                        <div class="loan-card-actions">
                            ${currentTab === 'pending' ? `
                                <button onclick="denyRequest(${i.loan_id})" class="ptc-btn-danger" title="ปฏิเสธ" style="flex:0.6;justify-content:center">
                                    <i class="fas fa-times"></i>
                                </button>
                                <button onclick="openActionModal('${i.loan_id}', '${escapeHtml(i.equipment_id)}', 'pending')" class="ptc-btn-success">
                                    <i class="fas fa-check"></i> อนุมัติ
                                </button>
                            ` : `
                                <button onclick="openActionModal('${i.loan_id}', '${escapeHtml(i.equipment_id)}', 'active')" class="ptc-btn-warning">
                                    <i class="fas fa-undo"></i> รับคืน

        }

    function exportHistory() {
        const search = document.getElementById('hist-search').value.toLowerCase();
        const start = document.getElementById('hist-start').value;
        const end = document.getElementById('hist-end').value;
        const status = document.getElementById('hist-status').value;

        const filtered = allHistoryItems.filter(i => {
            const txt = (i.equipment_name + i.equipment_id + i.borrower).toLowerCase();
            const matchSearch = !search || txt.includes(search);
            const date = i.lend_date.split(' ')[0];
            const matchStart = !start || date >= start;
            const matchEnd = !end || date <= end;
            const { isReturned, isOverdue } = getHistoryStatusMeta(i);
            const matchStatus =
                status === 'all' ||
                (status === 'returned' && isReturned) ||
                (status === 'overdue' && isOverdue) ||
                (status === 'active' && !isReturned && !isOverdue);
            return matchSearch && matchStart && matchEnd && matchStatus;
        });

        if (filtered.length === 0) { Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลให้ Export', 'warning'); return; }

        let csvContent = '﻿Equipment ID,Equipment Name,Borrower,Lend Date,Return Date,Status,Approver,Receiver\n';
        filtered.forEach(i => {
            const { isReturned, isOverdue } = getHistoryStatusMeta(i);
            const rowStatus = isReturned ? 'Returned' : isOverdue ? 'Overdue' : 'Borrowed';
            const row = [
                `"${i.equipment_id}"`, `"${i.equipment_name}"`, `"${i.borrower}"`,
                `"${i.lend_date}"`, `"${i.return_date || ''}"`, `"${rowStatus}"`,
                `"${i.approver_name || ''}"`, `"${i.return_receiver_name || ''}"`
            ];
            csvContent += row.join(',') + '\n';
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.setAttribute('href', URL.createObjectURL(blob));
        link.setAttribute('download', `Loan_History_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

            fd.append('id', loanId);
            try {
                const res = await fetch(api, { method: 'POST', body: fd });
                const json = await res.json();
                if (json.status === 'success') {
                    Swal.fire('สำเร็จ', 'ปฏิเสธคำขอเรียบร้อย', 'success');
                    loadData();
                } else {
                    throw new Error(json.message || 'API Error');
                }
            } catch(e) { Swal.fire('ผิดพลาด', e.message, 'error'); }
        }
    }

    async function submitAction() {
        if (signaturePad.isEmpty()) return Swal.fire('แจ้งเตือน', 'กรุณาเซ็นชื่อ', 'warning');
        if (currentItem?.type === 'active') {
            const returnCondition = document.getElementById('return-condition').value;
            const returnNotes = document.getElementById('return-notes').value.trim();
            if (!returnCondition) {
                return Swal.fire('แจ้งเตือน', 'กรุณาเลือกผลตรวจสภาพก่อนคืน', 'warning');
            }
            if (returnCondition !== 'ปกติ' && !returnNotes) {
                return Swal.fire('แจ้งเตือน', 'กรุณาระบุรายละเอียดสภาพอุปกรณ์', 'warning');
            }
        }

        const btn = document.getElementById('btn-confirm');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> บันทึก...';

        try {
            const sigData = signaturePad.toDataURL();

            // 1. Upload Signature
            const sigFd = new FormData();
            sigFd.append('action', 'upload_signature');
            sigFd.append('signature_data', sigData);
            sigFd.append('prefix', currentItem.type);

            const upRes = await fetch(api, { method: 'POST', body: sigFd });
            const upJson = await upRes.json();
            if (upJson.status !== 'success') throw new Error(upJson.message || 'อัปโหลดลายเซ็นไม่สำเร็จ');
            const sigPath = upJson.path;

            // 2. Call approve / return API
            const fd = new FormData();
            fd.append('action', 'update_loan_status');
            if (currentItem.type === 'pending') {
                fd.append('status', 'Active');
            } else {
                fd.append('status', 'Completed');
                fd.append('return_condition', document.getElementById('return-condition').value);
                fd.append('return_notes', document.getElementById('return-notes').value.trim());
            }
            fd.append('id', currentItem.loanId);
            fd.append('signature', sigPath);

            const res = await fetch(api, { method: 'POST', body: fd });
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || 'Server Error');

            closeModal();
            await Swal.fire({
                icon: 'success',
                title: 'สำเร็จ',
                text: currentItem.type === 'pending' ? 'อนุมัติเรียบร้อยแล้ว' : 'รับคืนเรียบร้อยแล้ว',
                timer: 2000,
                showConfirmButton: false
            });
            loadData();

        } catch(e) {
            Swal.fire('ผิดพลาด', e.message || 'เกิดข้อผิดพลาด', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check"></i> ยืนยัน';
        }
    }
</script>
