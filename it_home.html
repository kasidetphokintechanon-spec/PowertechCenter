<title>IT Portal ย้ายแล้ว</title>
<script>
fetch('api.php?action=check_session', { cache: 'no-store' }).then(r => r.json()).then(s => {
    // เข้า Admin ได้ → หน้าภาพรวม · ช่างที่ไม่มีสิทธิ์ Admin → งานช่างโดยตรง
    location.replace(!s.loggedin ? 'login.html' : s.can_access_admin ? 'admin.html' : 'log.html');
}).catch(() => location.replace('index.html'));
</script>
</head>
<body style="font-family:sans-serif;padding:40px;color:#475569">กำลังพาไปหน้าใหม่… <a href="admin.html">ระบบจัดการ</a></body>
