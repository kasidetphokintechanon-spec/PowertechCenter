<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - Powertech System Center</title>
    <link rel="manifest" href="app-manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="uploads/logos/pta_logo.png">
    <script src="js/pwa.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                fontFamily: { sans: ['Kanit', 'sans-serif'] },
                extend: { colors: { primary: '#6366f1' } }
            }
        };
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-slate-800">

    <div class="bg-white/80 backdrop-blur-xl border border-white/50 rounded-3xl shadow-2xl w-full max-w-md relative z-10 p-8 md:p-12">
        
        <div class="mb-8 text-center">
            <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-key text-3xl text-indigo-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">ลืมรหัสผ่าน?</h2>
            <p class="text-slate-500 text-sm">กรอกอีเมลที่ลงทะเบียนไว้เพื่อรับลิงก์สำหรับตั้งรหัสผ่านใหม่</p>
        </div>

        <form id="resetForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">อีเมลที่ลงทะเบียน</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fas fa-envelope text-slate-400"></i>
                    </div>
                    <input type="email" id="email" class="w-full pl-10 pr-4 py-2.5 bg-white/50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm" placeholder="example@powertech.co.th" required>
                </div>
            </div>

            <button type="submit" id="resetBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-indigo-500/30 transition transform hover:-translate-y-0.5">
                ส่งลิงก์ตั้งรหัสผ่านใหม่
            </button>
        </form>

        <div class="mt-8 text-center">
            <a href="login.html" class="text-sm text-slate-500 hover:text-indigo-600 transition flex items-center justify-center gap-2">
                <i class="fas fa-arrow-left"></i> กลับไปหน้าเข้าสู่ระบบ
            </a>
        </div>
    </div>

    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const email = document.getElementById('email').value;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>กำลังส่ง...';

            try {
                const fd = new FormData();
                fd.append('action', 'request_password_reset');
                fd.append('email', email);

                // Call the actual API
                const res = await fetch('api.php', { method: 'POST', body: fd });
                const data = await res.json();
                // Security: Do not throw error on failure to prevent user enumeration.
                // The backend will handle whether to send an email or not, but the frontend always shows success.

                Swal.fire({
                    icon: 'success',
                    title: 'ส่งคำขอสำเร็จ!',
                    html: `หากอีเมล <strong>${email}</strong> มีอยู่ในระบบ<br>คุณจะได้รับลิงก์สำหรับตั้งรหัสผ่านใหม่ในไม่ช้า`,
                    confirmButtonText: 'ตกลง'
                }).then(() => {
                    window.location.href = 'login.html';
                });

            } catch (err) {
                // TISAX Security: Always show a generic success message to prevent user enumeration.
                // An attacker should not be able to know if an email exists in the system or not.
                Swal.fire({
                    icon: 'success',
                    title: 'ส่งคำขอสำเร็จ!',
                    html: `หากอีเมล <strong>${email}</strong> มีอยู่ในระบบ<br>คุณจะได้รับลิงก์สำหรับตั้งรหัสผ่านใหม่ในไม่ช้า`,
                    confirmButtonText: 'ตกลง'
                }).then(() => {
                    window.location.href = 'login.html';
                });
            }
        });
    </script>
</body>
</html>
