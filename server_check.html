<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Room Check</title>
    <link rel="icon" href="favicon.ico">
    <script src="js/favicon-version.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/enterprise-theme.css?v=20261021">
<link rel="stylesheet" href="css/ptc-unified-global.css?v=20260529">
<script>(function(){const t=localStorage.getItem('theme')||'light';if(t==='dark')document.documentElement.classList.add('dark','dark-theme');})();</script>
<style>
html,body{overflow:auto!important;height:auto!important;}
body{font-family:'Inter','IBM Plex Sans Thai',sans-serif;background:#f1f5f9;color:#334155;padding-bottom:20px;}
html.dark body{background:#0a0f1e;color:#e2e8f0;}

/* ── top bar ── */
.sc-topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:52px;z-index:40;}
html.dark .sc-topbar{background:#1e293b;border-color:#334155;}
.sc-month-nav{display:flex;align-items:center;gap:4px;}
.sc-month-nav button{width:30px;height:30px;border-radius:7px;border:1px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
html.dark .sc-month-nav button{background:#1e293b;border-color:#334155;color:#94a3b8;}
.sc-month-nav button:hover{background:#f1f5f9;color:#2563eb;}
.sc-month-label{font-size:14px;font-weight:800;color:#0f172a;min-width:130px;text-align:center;}
html.dark .sc-month-label{color:#f1f5f9;}
.sc-today-btn{height:30px;padding:0 12px;border-radius:7px;border:1px solid #e2e8f0;background:#fff;font-size:11px;font-weight:700;color:#2563eb;cursor:pointer;font-family:inherit;}
.sc-autosave-hint{margin-left:auto;font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:5px;}
html.dark .sc-autosave-hint{color:#475569;}
html.dark .sc-today-btn{background:#1e293b;border-color:#334155;}
.sc-today-btn:hover{background:#eff6ff;}
.sc-badge{display:inline-flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:99px;padding:4px 12px;font-size:11px;font-weight:700;color:#64748b;}
html.dark .sc-badge{background:#0f172a;border-color:#334155;}
.sc-badge.done{background:#f0fdf4;border-color:#86efac;color:#16a34a;}

/* ── company filter ── */
.sc-co-filter{display:flex;align-items:center;gap:4px;margin-left:auto;}
.sc-co-btn{height:28px;padding:0 12px;border-radius:99px;border:1px solid #e2e8f0;background:#fff;font-size:11px;font-weight:700;color:#64748b;cursor:pointer;font-family:inherit;}
html.dark .sc-co-btn{background:#1e293b;border-color:#334155;color:#94a3b8;}
.sc-co-btn:hover{background:#f1f5f9;}
.sc-co-btn.active{background:#0f172a;border-color:#0f172a;color:#fff;}
.sc-co-btn.active.co-PTA{background:#059669;border-color:#059669;}
.sc-co-btn.active.co-PT4{background:#dc2626;border-color:#dc2626;}
.sc-co-btn.active.co-PTE{background:#2563eb;border-color:#2563eb;}

/* ── accordion ── */
.sc-wrap{padding:12px 14px;display:flex;flex-direction:column;gap:8px;}
.acc-room{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;}
html.dark .acc-room{background:#1e293b;border-color:#334155;}
.acc-room.has-issue{border-color:#fca5a5;}
.acc-room.all-ok{border-color:#86efac;}
.acc-hd{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none;}
.acc-hd:hover{background:#f8fafc;}
html.dark .acc-hd:hover{background:#0f172a;}
.acc-code{font-size:14px;font-weight:800;color:#0f172a;min-width:44px;}
html.dark .acc-code{color:#f1f5f9;}
.acc-name{font-size:11px;color:#64748b;flex:1;}
.acc-stat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;}
.acc-stat.ok{background:#dcfce7;color:#166534;}
.acc-stat.issue{background:#fee2e2;color:#991b1b;}
.acc-stat.partial{background:#fef9c3;color:#854d0e;}
.acc-stat.empty{background:#f1f5f9;color:#94a3b8;}
html.dark .acc-stat.empty{background:#334155;}
.acc-actions{display:flex;gap:5px;flex-shrink:0;}
.acc-chevron{font-size:11px;color:#94a3b8;transition:transform .2s;flex-shrink:0;}
.acc-room.open .acc-chevron{transform:rotate(180deg);}
.acc-body{display:none;border-top:1px solid #f1f5f9;}
html.dark .acc-body{border-color:#334155;}
.acc-room.open .acc-body{display:block;}

/* ── month table ── */
.mtbl-wrap{overflow-x:auto;padding:10px 12px 12px;}
.mtbl{border-collapse:separate;border-spacing:2px;white-space:nowrap;font-size:9.5px;}
.mtbl th.item-hd{text-align:left;font-size:9px;font-weight:700;color:#94a3b8;padding:2px 6px;width:150px;min-width:120px;position:sticky;left:0;background:#fff;z-index:2;}
html.dark .mtbl th.item-hd{background:#1e293b;}
.mtbl td.item-lbl{font-size:10px;font-weight:600;color:#334155;padding:3px 6px;position:sticky;left:0;background:#fff;z-index:2;border-right:1px solid #f1f5f9;}
html.dark .mtbl td.item-lbl{color:#cbd5e1;background:#1e293b;border-color:#334155;}
.mtbl th.day-hd{text-align:center;font-size:9px;font-weight:700;color:#64748b;width:28px;min-width:28px;padding:2px 0;}
.mtbl th.day-hd.we{color:#cbd5e1;}
html.dark .mtbl th.day-hd.we{color:#475569;}
.mtbl th.day-hd.ph{color:#f97316;font-weight:800;}
html.dark .mtbl th.day-hd.ph{color:#fb923c;}
.mtbl th.day-hd.tod{color:#2563eb;}
.dow{font-size:8px;font-weight:500;display:block;}

/* ── value cells ── */
.cv{width:28px;height:26px;text-align:center;vertical-align:middle;border-radius:5px;cursor:pointer;font-size:10px;font-weight:700;transition:transform .1s;}
.cv:hover{transform:scale(1.2);z-index:5;position:relative;}
.cv.we{background:transparent;cursor:default;color:#cbd5e1;}
.cv.we:hover{transform:none;}
.cv.ph{background:#fff7ed;cursor:default;color:#f97316;}
.cv.ph:hover{transform:none;}
.cv-chk.ph{cursor:default;background:#fff7ed;color:#f97316;}
.cv.empty{background:#f1f5f9;}
html.dark .cv.empty{background:#334155;}
.cv.v-ok{background:#bbf7d0;color:#166534;}
.cv.v-issue{background:#fecaca;color:#991b1b;}
.cv.v-backup{background:#bfdbfe;color:#1d4ed8;}
.cv.v-good{background:#bbf7d0;color:#166534;}
.cv.v-bad{background:#fecaca;color:#991b1b;}
.cv.v-med{background:#fef9c3;color:#854d0e;}
.cv.tod{box-shadow:0 0 0 2px #2563eb;}
.cv.tod:hover{box-shadow:0 0 0 2px #2563eb,0 2px 6px rgba(0,0,0,.15);}

/* checker row */
.cv-chk{width:28px;height:60px;text-align:center;vertical-align:middle;font-size:8px;font-weight:600;color:#94a3b8;cursor:pointer;border-radius:4px;overflow:hidden;writing-mode:vertical-rl;transform:rotate(180deg);padding:2px 0;}
.cv-chk.filled{color:#2563eb;background:#eff6ff;}
.cv-chk.we{cursor:default;}
.cv-chk:not(.we):hover{background:#eff6ff;color:#2563eb;}
td.item-lbl.chk-lbl{color:#94a3b8;font-size:9px;font-weight:600;}

/* note row */
.cv-note{width:28px;height:26px;text-align:center;vertical-align:middle;cursor:pointer;border-radius:5px;color:#cbd5e1;font-size:10px;}
.cv-note:hover{background:#f1f5f9;}
html.dark .cv-note:hover{background:#334155;}
.cv-note.we{cursor:default;}
.cv-note.ph{background:#fff7ed;cursor:default;}
.cv-note.filled{color:#d97706;background:#fffbeb;}
.cv-note.needs{color:#dc2626;background:#fef2f2;}
td.item-lbl.note-lbl{color:#94a3b8;font-size:9px;font-weight:600;}

/* inline input overlay */
.cell-input-wrap{position:fixed;z-index:9999;background:#fff;border:1.5px solid #2563eb;border-radius:7px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:6px;}
html.dark .cell-input-wrap{background:#1e293b;}
.cell-input-wrap input{width:70px;height:30px;padding:0 8px;border:1px solid #e2e8f0;border-radius:5px;font-size:13px;font-weight:700;text-align:center;font-family:inherit;background:#fff;color:#0f172a;outline:none;}
html.dark .cell-input-wrap input{background:#0f172a;border-color:#334155;color:#e2e8f0;}
.cell-input-wrap .ci-label{font-size:9px;color:#94a3b8;margin-bottom:4px;display:block;}
.cell-input-wrap .ci-row{display:flex;align-items:center;gap:5px;}
.cell-input-wrap .ci-clear{width:26px;height:30px;border:1px solid #fecaca;background:#fef2f2;color:#dc2626;border-radius:5px;cursor:pointer;font-size:13px;flex-shrink:0;}
.cell-input-wrap .ci-clear:hover{background:#fee2e2;}
html.dark .cell-input-wrap .ci-clear{background:#3f1d1d;border-color:#7f1d1d;color:#fca5a5;}

/* checker bar (per room) */
.chk-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid #f1f5f9;background:#f8fafc;}
html.dark .chk-bar{background:#1e293b;border-color:#334155;}
.chk-bar-input{flex:1;max-width:220px;height:28px;padding:0 8px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px;font-family:inherit;background:#fff;color:#0f172a;outline:none;}
.chk-bar-input:focus{border-color:#2563eb;}
html.dark .chk-bar-input{background:#0f172a;border-color:#334155;color:#e2e8f0;}

/* checker name popup */
.chk-popup{position:fixed;z-index:9999;background:#fff;border:1.5px solid #2563eb;border-radius:7px;box-shadow:0 4px 16px rgba(0,0,0,.15);padding:6px;}
html.dark .chk-popup{background:#1e293b;}
.chk-popup input{width:120px;height:30px;padding:0 8px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px;font-family:inherit;background:#fff;color:#0f172a;outline:none;}
html.dark .chk-popup input{background:#0f172a;border-color:#334155;color:#e2e8f0;}
.chk-popup textarea{width:210px;padding:6px 8px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px;font-family:inherit;background:#fff;color:#0f172a;outline:none;resize:vertical;}
html.dark .chk-popup textarea{background:#0f172a;border-color:#334155;color:#e2e8f0;}
.chk-popup .note-save-btn{margin-top:6px;width:100%;height:28px;border:none;border-radius:5px;background:#2563eb;color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
.chk-popup .note-save-btn:hover{background:#1d4ed8;}
.chk-popup .ci-label{font-size:9px;color:#94a3b8;margin-bottom:4px;display:block;}

/* misc */
.sc-loading{text-align:center;padding:40px;color:#94a3b8;font-size:13px;}
.legend{display:flex;gap:12px;padding:0 14px 12px;flex-wrap:wrap;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:#64748b;}
html.dark .leg-item{color:#94a3b8;}
.leg-dot{width:12px;height:12px;border-radius:3px;}
.leg-dot.v-ok,.leg-dot.v-good{background:#bbf7d0;}.leg-dot.v-issue,.leg-dot.v-bad{background:#fecaca;}.leg-dot.v-backup{background:#bfdbfe;}
/* วันที่ยังไม่ถึง: กดไม่ได้ (บันทึกล่วงหน้าไม่ได้ — TISAX) */
.cv.fut{cursor:not-allowed;background:transparent;border:1px dashed #e2e8f0;}
.cv.fut:hover{transform:none;}
html.dark .cv.fut{border-color:#334155;}
.day-hd.late sup{color:#d97706;font-weight:800;}
html.dark .ptc-btn-ghost{background:#1e293b !important;border-color:#334155 !important;color:#e2e8f0;}

/* ══════════════════════════════════════════════════════════════
   จอ TV (ห้อง IT) — ธีมมืดเฉพาะหน้านี้ อ่านง่ายจากไกล · เวที 1920×1080 ย่อตามจอ
   ══════════════════════════════════════════════════════════════ */
#tv-view { position:fixed; inset:0; z-index:9999; display:none; background:#000; align-items:center; justify-content:center; overflow:hidden;
  --bg:#070b14; --panel:#0d1424; --line:#1c2740; --tx:#e6edf7; --tx2:#93a3bd; --tx3:#5b6b86;
  --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --idle:#475569; --pta:#10b981; --pt4:#f43f5e; --pte:#3b82f6; }
#tv-view.active { display:flex; }
#tv-view .mono { font-family:'JetBrains Mono',ui-monospace,Consolas,monospace; }
.tv-exit { position:fixed; top:14px; right:14px; z-index:3; width:40px; height:40px; border-radius:10px; border:1px solid #1c2740; background:#0d1424; color:#93a3bd; cursor:pointer; opacity:.35; font-size:16px; }
.tv-exit:hover { opacity:1; color:#fff; }
#tv-stage { width:1920px; height:1080px; flex-shrink:0; background:var(--bg); color:var(--tx); position:relative; transform-origin:center; padding:34px 40px 28px; display:grid; grid-template-rows:auto auto 1fr auto; gap:22px; font-family:'Sarabun',system-ui,sans-serif; }
#tv-stage::before { content:''; position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(56,189,248,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.035) 1px,transparent 1px); background-size:48px 48px; }
.tv2-top { display:flex; align-items:center; gap:22px; position:relative; }
.tv2-brand { display:flex; align-items:center; gap:16px; }
.tv2-brand .mk { width:58px; height:58px; border-radius:14px; background:#0f766e; display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 28px rgba(15,118,110,.45); }
.tv2-brand small { display:block; font-size:15px; letter-spacing:.24em; color:var(--tx3); font-weight:700; }
.tv2-brand b { font-size:32px; letter-spacing:.04em; font-weight:800; }
.tv2-live { display:flex; align-items:center; gap:8px; margin-left:18px; font-size:15px; font-weight:800; letter-spacing:.18em; color:var(--ok); }
.tv2-live i { width:10px; height:10px; border-radius:50%; background:var(--ok); box-shadow:0 0 12px var(--ok); animation:tv2blink 1.6s infinite; }
.tv2-live.off { color:var(--warn); } .tv2-live.off i { background:var(--warn); box-shadow:0 0 12px var(--warn); }
@keyframes tv2blink { 50% { opacity:.25; } }
.tv2-clock { margin-left:auto; text-align:right; margin-right:40px; }
.tv2-clock .t { font-size:64px; font-weight:800; line-height:1; }
.tv2-clock .d { font-size:19px; color:var(--tx2); margin-top:4px; }
.tv2-sum { display:grid; grid-template-columns:420px 1fr; gap:22px; position:relative; }
.tv2-ringbox { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px 24px; display:flex; align-items:center; gap:24px; }
.tv2-ring { position:relative; width:150px; height:150px; flex-shrink:0; }
.tv2-ring svg { transform:rotate(-90deg); }
.tv2-ring .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.tv2-ring .c b { font-size:46px; font-weight:800; line-height:1; }
.tv2-ring .c span { font-size:15px; color:var(--tx2); }
.tv2-counts { display:grid; gap:10px; flex:1; }
.tv2-cnt { display:flex; align-items:center; gap:12px; font-size:19px; color:var(--tx2); }
.tv2-cnt b { font-size:34px; font-weight:800; min-width:46px; text-align:right; line-height:1; }
.tv2-cnt i { width:12px; height:12px; border-radius:3px; }
.tv2-alert { border-radius:18px; padding:20px 26px; display:flex; align-items:center; gap:22px; border:1px solid; min-width:0; }
.tv2-alert.bad { background:rgba(239,68,68,.09); border-color:rgba(239,68,68,.45); box-shadow:inset 0 0 40px rgba(239,68,68,.08); }
.tv2-alert.ok { background:rgba(34,197,94,.08); border-color:rgba(34,197,94,.4); }
.tv2-alert.wait { background:rgba(245,158,11,.07); border-color:rgba(245,158,11,.35); }
.tv2-alert.off { background:rgba(148,163,184,.06); border-color:var(--line); }
.tv2-alert .ic { width:76px; height:76px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:34px; flex-shrink:0; }
.tv2-alert.bad .ic { background:rgba(239,68,68,.16); color:var(--bad); animation:tv2pulse 1.8s infinite; }
.tv2-alert.ok .ic { background:rgba(34,197,94,.16); color:var(--ok); }
.tv2-alert.wait .ic { background:rgba(245,158,11,.14); color:var(--warn); }
.tv2-alert.off .ic { background:rgba(148,163,184,.1); color:var(--tx2); }
@keyframes tv2pulse { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,.45); } 60% { box-shadow:0 0 0 18px rgba(239,68,68,0); } }
.tv2-alert h2 { font-size:34px; font-weight:800; line-height:1.1; margin:0; }
.tv2-alert.bad h2 { color:#fca5a5; } .tv2-alert.ok h2 { color:#86efac; } .tv2-alert.wait h2 { color:#fcd34d; }
.tv2-alert p { font-size:20px; color:var(--tx2); margin:6px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tv2-alert p b { color:var(--tx); }
.tv2-grid { display:grid; gap:18px; position:relative; min-height:0; }
.tv2-room { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:18px 20px; display:flex; flex-direction:column; position:relative; overflow:hidden; min-height:0; }
.tv2-room::before { content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--st); }
.tv2-room.bad { border-color:rgba(239,68,68,.55); box-shadow:0 0 0 1px rgba(239,68,68,.25),0 0 34px rgba(239,68,68,.18); }
.tv2-room.none { opacity:.82; }
.r-top { display:flex; align-items:flex-start; gap:10px; }
.r-code { font-size:44px; font-weight:800; line-height:1; }
.r-co { margin-top:6px; font-size:13px; font-weight:800; letter-spacing:.1em; padding:3px 9px; border-radius:6px; border:1px solid; }
.r-st { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:17px; font-weight:800; color:var(--st); white-space:nowrap; }
.r-st i { width:12px; height:12px; border-radius:50%; background:var(--st); box-shadow:0 0 12px var(--st); }
.tv2-room.bad .r-st i { animation:tv2blink 1s infinite; }
.r-name { font-size:16px; color:var(--tx2); margin:6px 0 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.r-cams { display:grid; gap:9px; }
.r-cam { display:grid; grid-template-columns:62px 1fr auto; align-items:center; gap:10px; font-size:15px; }
.r-cam .l { color:var(--tx3); font-weight:700; white-space:nowrap; overflow:hidden; }
.r-bar { height:12px; border-radius:6px; background:#1a2438; overflow:hidden; }
.r-bar i { display:block; height:100%; border-radius:6px; }
.r-cam .v { font-weight:800; font-size:17px; min-width:74px; text-align:right; }
.r-ret { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.r-ret span { font-size:14px; padding:3px 10px; border-radius:7px; background:#141e33; color:var(--tx2); border:1px solid var(--line); }
.r-ret span b { color:var(--tx); }
.r-ret span.f { color:#fca5a5; border-color:rgba(239,68,68,.45); background:rgba(239,68,68,.08); }
.r-ret span.f b { color:#fecaca; }
.r-foot { margin-top:auto; padding-top:12px; display:flex; align-items:flex-end; gap:10px; }
.r-dots { display:flex; gap:4px; flex-wrap:wrap; flex:1; }
.r-dots i { width:13px; height:13px; border-radius:3px; background:#1f2a40; }
.r-dots i.o { background:var(--ok); } .r-dots i.x { background:var(--bad); box-shadow:0 0 8px rgba(239,68,68,.7); }
.r-who { font-size:14px; color:var(--tx3); text-align:right; white-space:nowrap; }
.r-who b { color:var(--tx2); }
.tv2-hist { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:14px 22px; position:relative; display:flex; align-items:center; gap:22px; }
.tv2-hist h3 { font-size:15px; letter-spacing:.16em; color:var(--tx3); font-weight:800; white-space:nowrap; margin:0; }
.tv2-hgrid { flex:1; display:grid; gap:14px; }
.tv2-hcol { display:flex; flex-direction:column; gap:5px; min-width:0; }
.tv2-hcol b { font-size:14px; color:var(--tx2); }
.tv2-hdays { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.tv2-hdays i { height:16px; border-radius:3px; background:#1f2a40; }
.tv2-hdays i.ok { background:rgba(34,197,94,.75); } .tv2-hdays i.bad { background:var(--bad); } .tv2-hdays i.part { background:var(--warn); }

<script>
const API = 'api.php';
const thMonths  = ['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const thMSh     = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDows    = ['อา','จ','อ','พ','พฤ','ศ','ส'];

let currentMonth = new Date().getMonth() + 1;
let currentYear  = new Date().getFullYear();
let monthDays    = 30;
let holidayMap   = {}; // date string → holiday name

// Data state (all mutable)
let rooms = [], itemsByRoom = {}, vals = {}, checkers = {}, sugg = {}, late = {};
const backfillReason = {}; // rid → เหตุผลบันทึกย้อนหลัง (ถามครั้งเดียวต่อห้องต่อการเปิดหน้า)
const _bfPending = {};
let dirty = {};       // `${rid}:${date}` → true
let saveTimers = {};  // debounce per rid:date
let openRooms  = new Set();
let _loadAbort = null;
let activeInput = null; // current floating input element
let myName = '';      // ชื่อ login ของ user (ตัด Mr./Mrs. แล้ว)
let companyFilter = localStorage.getItem('sc_company_filter') || ''; // '' = ทั้งหมด
const COMPANY_LABELS = { '': 'ทั้งหมด', PTA: 'PTA', PT4: 'PT4', PTE: 'PTE' };

function visibleRooms() {
    return companyFilter ? rooms.filter(r => r.company === companyFilter) : rooms;
}

function renderCompanyFilter() {
    const el = document.getElementById('sc-co-filter');
    if (!el) return;
    const present = new Set(rooms.map(r => r.company).filter(Boolean));
    const cos = ['', ...['PTA','PT4','PTE'].filter(c => present.has(c))];
    el.innerHTML = cos.map(c => `<button class="sc-co-btn${c===companyFilter?' active':''}${c?' co-'+c:''}" onclick="setCompanyFilter('${c}')">${COMPANY_LABELS[c]}</button>`).join('');
}

function setCompanyFilter(co) {
    companyFilter = co;
    localStorage.setItem('sc_company_filter', co);
    renderCompanyFilter();
    render();
    updateBadge();
}

function stripTitle(n) {
    return (n || '').replace(/^(Mr\.|Mrs\.|Miss|Ms\.|Dr\.|Prof\.|นาย|นาง|นางสาว)\s+/iu, '').trim();
}

function pad2(n) { return String(n).padStart(2,'0'); }
function localToday() { const n = new Date(); return `${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}`; }
function ds(d)   { return `${currentYear}-${pad2(currentMonth)}-${pad2(d)}`; }
function isWE(dateStr) { const dow=new Date(dateStr+'T00:00:00').getDay(); return dow===0||dow===6; }
function isPH(dateStr) { return !!holidayMap[dateStr]; } // public/company holiday

// ── Month nav ──────────────────────────────────────────────────
function prevMonth(){ currentMonth--; if(currentMonth<1){currentMonth=12;currentYear--;} load(); }
function nextMonth(){ currentMonth++; if(currentMonth>12){currentMonth=1;currentYear++;} load(); }
function goThisMonth(){ const n=new Date(); currentMonth=n.getMonth()+1; currentYear=n.getFullYear(); load(); }
function updateMonthLabel(){ document.getElementById('month-label').textContent=`${thMonths[currentMonth]} ${currentYear+543}`; }

// ── Load ───────────────────────────────────────────────────────
async function load() {
    if (_loadAbort) _loadAbort.abort();
    _loadAbort = new AbortController();
    const sig = _loadAbort.signal;
    updateMonthLabel();
    document.getElementById('sc-page').innerHTML = '<div class="sc-loading"><i class="fa fa-spinner fa-spin" style="font-size:24px;color:#0f766e"></i><br>กำลังโหลด...</div>';
    try {
        const [res, hres] = await Promise.all([
            fetch(`${API}?action=get_month_detail&month=${currentMonth}&year=${currentYear}`, { signal: sig }),
            fetch(`${API}?action=get_holidays&month=${currentMonth}&year=${currentYear}`, { signal: sig }).catch(() => null)
        ]);
        const data = await res.json();
        const hdata = hres && hres.ok ? await hres.json().catch(() => ({})) : {};
        if (data.status !== 'success') return;
        rooms       = data.rooms;
        itemsByRoom = data.itemsByRoom;
        vals        = data.vals     || {};
        checkers    = data.checkers || {};
        sugg        = data.sugg     || {};
        late        = data.late     || {};
        monthDays   = data.days;
        holidayMap  = hdata.map || {};
        renderCompanyFilter();
        render();
        updateBadge();
    } catch(e){ if (e?.name === 'AbortError') return; console.error(e); }
}

// ── Render accordion ───────────────────────────────────────────
function render() {
    if (scView === 'today') return renderToday();
    const today = localToday();
    let html = '<div class="sc-wrap">';
    const roomsShown = visibleRooms();

    if (!roomsShown.length) {
        html += `<div class="sc-loading"><i class="fa fa-building-circle-xmark" style="font-size:22px;color:#cbd5e1"></i><br>ไม่มีห้องของบริษัทนี้</div>`;
    }

    roomsShown.forEach(room => {
        const rid   = room.id;
        const items = itemsByRoom[rid] || [];
        const open  = openRooms.has(rid);

        const roomCls = stat.cls === 'issue' ? 'has-issue' : stat.cls === 'ok' ? 'all-ok' : '';

        html += `<div class="acc-room ${roomCls}${open?' open':''}" id="acc-${rid}">
        <div class="acc-hd" onclick="toggleRoom(${rid})">
            <span class="acc-code">${esc(room.code)}</span>
            <span class="acc-name">${esc(room.name)}</span>
            <span class="acc-stat ${statCls}">${statLbl}</span>
            <div class="acc-actions" onclick="event.stopPropagation()">
                <button class="ptc-btn-ghost ptc-btn-sm" style="font-size:10.5px;height:26px;padding:0 8px;color:#15803d;border:1px solid #bbf7d0" onclick="bulkRoom(${rid})" title="ติ๊กปกติให้วันทำงานที่ผ่านมาแล้วและยังว่าง (ไม่ทับของเดิม ไม่เติมวันข้างหน้า)">
                    <i class="fa fa-check-double"></i> ปกติวันที่ว่าง
                </button>
                <button class="ptc-btn-ghost ptc-btn-sm" style="font-size:10px;height:26px;padding:0 8px;border:1px solid var(--ptc-border)" onclick="printRoom(${rid})" title="พิมพ์ใบตรวจรายเดือน">
                    <i class="fa fa-print"></i>
                </button>
            </div>
            <i class="fa fa-chevron-down acc-chevron"></i>
        </div>
        <div class="acc-body">
            <div class="chk-bar">
                <i class="fa fa-user-check" style="color:#64748b"></i>
                <span style="font-size:12px;color:#64748b;white-space:nowrap">ผู้ตรวจสอบ</span>
                <input type="text" class="chk-bar-input" id="chk-bar-${rid}"
                    value="${esc(Object.values(checkers[rid]||{})[0]||myName)}"
                    placeholder="ชื่อผู้ตรวจสอบ"
                    onkeydown="if(event.key==='Enter')applyCheckerAll(${rid})">
                <button class="ptc-btn ptc-btn-primary ptc-btn-sm" style="font-size:11px;height:28px;padding:0 12px;white-space:nowrap"
                    onclick="applyCheckerAll(${rid})">

    });

    html += `<div class="legend">
        <span class="leg-item"><span class="leg-dot v-ok"></span>OK</span>
        <span class="leg-item"><span class="leg-dot v-issue"></span>Issue</span>
        <span class="leg-item"><span class="leg-dot v-backup"></span>Backup OK</span>
        <span class="leg-item"><span class="leg-dot v-good"></span>ตัวเลขดี</span>
        <span class="leg-item"><span class="leg-dot v-bad"></span>ตัวเลขต่ำ</span>
        <span class="leg-item"><span class="leg-dot empty" style="border:1px solid #e2e8f0"></span>ยังไม่เช็ค</span>
        <span class="leg-item"><i class="fa fa-note-sticky" style="color:#dc2626"></i>ต้องระบุหมายเหตุ (มี Issue แต่ยังไม่กรอก)</span>
    </div></div>`;

    document.getElementById('sc-page').innerHTML = html;
}

function buildTable(rid, items, today) {
    // Precompute day metadata once — avoids new Date() × items × days
    const dayInfo = [];
    for (let d = 1; d <= monthDays; d++) {
        const date = ds(d);
        const dow  = new Date(date + 'T00:00:00').getDay();
        dayInfo.push({ d, date, dow, we: dow===0||dow===6, ph: isPH(date), tod: date===today, fut: date > today });
    }

    // Header
    let thead = `<tr><th class="item-hd">รายการ</th>`;
    for (const {d, date, dow, we, ph, tod} of dayInfo) {
        const cls   = ph ? 'ph' : we ? 'we' : '';
        const title = ph ? `title="${holidayMap[date]}"` : '';
        const lt = late[rid]?.[date];
        thead += `<th class="day-hd${cls?' '+cls:''}${tod?' tod':''}${lt?' late':''}" ${lt ? `title="บันทึกย้อนหลัง (ลงระบบ ${lt})"` : title}>${d}${lt ? '<sup>*</sup>' : ''}<span class="dow">${thDows[dow]}</span></th>`;
    }
    thead += `</tr>`;

    // Item rows
    let tbody = '';
    items.forEach(item => {
        const iid = item.id;
        tbody += `<tr><td class="item-lbl">${esc(item.item_no)}. ${esc(item.label)}</td>`;
        for (const {date, we, ph, tod, fut} of dayInfo) {
            const v = vals[rid]?.[date]?.[iid] ?? '';
            if (fut && !v) {
                tbody += `<td class="cv fut" title="ยังไม่ถึงวันที่ ${date}"></td>`;
            } else if (we) {
                tbody += `<td class="cv we${tod?' tod':''}">—</td>`;
            } else if (ph) {
                tbody += `<td class="cv ph${tod?' tod':''}" title="${esc(holidayMap[date])}">—</td>`;
            } else {
                const {cls, txt} = cellDisplay(v, item.input_type, item.threshold);
                tbody += `<td class="cv ${cls}${tod?' tod':''}" id="cv-${rid}-${iid}-${date}"
                    onclick="cellClick(${rid},${iid},'${date}','${esc(item.input_type)}',${item.threshold||0},this)"
                    title="${item.label} — ${date}">${txt}</td>`;
            }
        }
        tbody += `</tr>`;
    });

    // Checker row
    tbody += `<tr><td class="item-lbl chk-lbl"><i class="fa fa-user" style="margin-right:3px"></i>ผู้ตรวจ</td>`;
    for (const {date, we, ph, tod} of dayInfo) {
        const name  = checkers[rid]?.[date] ?? '';
        const short = shortName(name);
        if (we) {
            tbody += `<td class="cv-chk we"></td>`;
        } else if (ph) {
            tbody += `<td class="cv-chk ph" title="${esc(holidayMap[date])}"></td>`;
        } else {
            tbody += `<td class="cv-chk${short?' filled':''}" id="chk-${rid}-${date}"
                onclick="checkerCellClick(${rid},'${date}',this)"
                oncontextmenu="checkerCustomPopup(${rid},'${date}',this);return false;"
                title="${name||'ยังไม่ระบุ'} (คลิกขวา = พิมพ์ชื่ออื่น)">${esc(short)}</td>`;
        }
    }
    tbody += `</tr>`;

    // Note row (หมายเหตุ / สาเหตุปัญหา)
    tbody += `<tr><td class="item-lbl note-lbl"><i class="fa fa-note-sticky" style="margin-right:3px"></i>หมายเหตุ</td>`;
    for (const {date, we, ph, tod} of dayInfo) {
        if (we) {
            tbody += `<td class="cv-note we"></td>`;
        } else if (ph) {
            tbody += `<td class="cv-note ph" title="${esc(holidayMap[date])}"></td>`;
        } else {
            const note = sugg[rid]?.[date] ?? '';
            const dayVals = vals[rid]?.[date];
            const hasIssue = dayVals ? Object.values(dayVals).includes('✖') : false;
            const cls = note ? 'filled' : (hasIssue ? 'needs' : '');
            tbody += `<td class="cv-note${cls?' '+cls:''}" id="note-${rid}-${date}"
                onclick="noteClick(${rid},'${date}',this)"
                title="${note?esc(note):'ไม่มีหมายเหตุ'}"><i class="fa fa-note-sticky"></i></td>`;
        }
    }
    tbody += `</tr>`;

    return `<table class="mtbl"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
}

function cellDisplay(v, type, threshold) {
    if (v === '' || v === null || v === undefined) return { cls: 'empty', txt: '' };
    if (type === 'status') {
        if (v === '###') return { cls: 'v-ok',    txt: '✓' };
        if (v === '✖')   return { cls: 'v-issue', txt: '✗' };
        return { cls: 'empty', txt: '' };
    }
    if (type === 'backup') {
        if (v === 'O')  return { cls: 'v-backup', txt: 'O' };
        if (v === '✖')  return { cls: 'v-issue',  txt: '✗' };
        return { cls: 'empty', txt: '' };
    }
    if (type === 'percent') {
        const n = parseFloat(v);
        if (isNaN(n)) return { cls: 'empty', txt: '' };
        return { cls: n >= 90 ? 'v-good' : n >= 70 ? 'v-med' : 'v-bad', txt: n + '%' };
    }
    if (type === 'days') {
        const n = parseFloat(v);
        if (isNaN(n)) return { cls: 'empty', txt: '' };
        const ok = threshold ? n >= threshold : n > 0;
        return { cls: ok ? 'v-good' : 'v-bad', txt: String(n) };
    }
    return { cls: 'empty', txt: v };
}

// ── Toggle room accordion ──────────────────────────────────────
function toggleRoom(rid) {
    const el = document.getElementById('acc-' + rid);
    if (!el) return;
    if (openRooms.has(rid)) {
        openRooms.delete(rid);
        el.classList.remove('open');
    } else {
        openRooms.add(rid);
        el.classList.add('open');
    }
}

// ── Cell click ─────────────────────────────────────────────────
function cellClick(rid, iid, date, type, threshold, el) {
    closeActiveInput();
    if (type === 'status' || type === 'backup') {
        // Cycle: empty → ok → issue → empty
        const cur = vals[rid]?.[date]?.[iid] ?? '';
        let next;
        if (type === 'status')  next = cur==='' ? '###' : cur==='###' ? '✖' : '';
        if (type === 'backup')  next = cur==='' ? 'O'   : cur==='O'   ? '✖' : '';
        setVal(rid, iid, date, next, el, type, threshold);
    } else if (type === 'percent') {
        // Cycle: empty → 100 → 50 → 0 → empty
        const cur = vals[rid]?.[date]?.[iid] ?? '';
        const next = cur === '' ? '100' : cur === '100' ? '50' : cur === '50' ? '0' : '';
        setVal(rid, iid, date, next, el, type, threshold);
    } else {
        // days → floating input
        showNumInput(rid, iid, date, type, threshold, el);
    }
}

function setVal(rid, iid, date, val, el, type, threshold) {
    if (!vals[rid])        vals[rid] = {};
    if (!vals[rid][date])  vals[rid][date] = {};
    vals[rid][date][iid] = val;

    const {cls, txt} = cellDisplay(val, type, threshold);
    el.className = `cv ${cls}${date === localToday() ? ' tod' : ''}`;
    el.textContent = txt;

    markDirty(rid, date);
    updateRoomStat(rid);
    updateBadge();
    updateNoteCue(rid, date);
}

function updateNoteCue(rid, date) {
    const noteEl = document.getElementById(`note-${rid}-${date}`);
    if (!noteEl || noteEl.classList.contains('filled')) return; // already has a note, leave as-is
    const dayVals  = vals[rid]?.[date];
    const hasIssue = dayVals ? Object.values(dayVals).includes('✖') : false;
    noteEl.classList.toggle('needs', hasIssue);
}

// ── Floating number input ──────────────────────────────────────
function showNumInput(rid, iid, date, type, threshold, el) {
    const cur = vals[rid]?.[date]?.[iid] ?? '';
    const rect = el.getBoundingClientRect();
    const suffix = type === 'percent' ? '%' : 'วัน';
    const lbl    = type === 'percent' ? `% Online (≥90)` : `จำนวนวัน (≥${threshold||0})`;

    const wrap = document.createElement('div');
    wrap.className = 'cell-input-wrap';
    wrap.innerHTML = `<span class="ci-label">${lbl}</span>
        <div class="ci-row">
            <input type="number" min="0" ${type==='percent'?'max="100"':''} value="${esc(String(cur))}" placeholder="0">
            <button type="button" class="ci-clear" title="ลบค่า">×</button>
        </div>`;
    wrap.style.cssText = `left:${Math.min(rect.left, window.innerWidth-160)}px;top:${rect.bottom+4}px;`;
    document.body.appendChild(wrap);
    activeInput = wrap;

    const inp = wrap.querySelector('input');
    const clearBtn = wrap.querySelector('.ci-clear');
    inp.focus(); inp.select();

    let cleared = false;
    const commit = () => {
        const v = cleared ? '' : inp.value.trim();
        setVal(rid, iid, date, v, el, type, threshold);
        closeActiveInput();
    };
    clearBtn.addEventListener('click', () => { cleared = true; commit(); });
    inp.addEventListener('keydown', e => { if(e.key==='Enter') commit(); if(e.key==='Escape') closeActiveInput(); });
    setTimeout(() => document.addEventListener('click', function outsideClick(ev) {
        if (!wrap.contains(ev.target)) { commit(); document.removeEventListener('click', outsideClick); }
    }), 50);
}

function closeActiveInput() {
    if (activeInput) { activeInput.remove(); activeInput = null; }
}

// ── Checker name ───────────────────────────────────────────────
function shortName(name) {
    const _p = name ? name.trim().split(/\s+/) : [];
    return _p.length > 1 && _p[0].endsWith('.') ? _p[1] : (_p[0] || '');
}

// Click: toggle เป็นชื่อฉัน / ว่าง (แบบเดียวกับสถานะช่องอื่น)
function checkerCellClick(rid, date, el) {
    closeActiveInput();
    const cur  = checkers[rid]?.[date] ?? '';
    const next = cur === myName ? '' : myName;
    if (!checkers[rid]) checkers[rid] = {};
    checkers[rid][date] = next;
    const short = shortName(next);
    el.textContent = short;
    el.className = `cv-chk${short?' filled':''}`;
    el.title = (next || 'ยังไม่ระบุ') + ' (คลิกขวา = พิมพ์ชื่ออื่น)';
    markDirty(rid, date);
}

// Right-click: เปิดช่องพิมพ์ชื่ออื่น (กรณีคนอื่นเป็นผู้ตรวจแทน)

}

// ── Note / suggestions (หมายเหตุ, สาเหตุปัญหา) ──────────────────
function noteClick(rid, date, el) {
    closeActiveInput();
    const cur = sugg[rid]?.[date] ?? '';
    const rect = el.getBoundingClientRect();

    const wrap = document.createElement('div');
    wrap.className = 'chk-popup';

        <textarea rows="3" placeholder="พิมพ์หมายเหตุ...">${esc(cur)}</textarea>
        <button type="button" class="note-save-btn">บันทึก</button>`;
    wrap.style.cssText = `left:${Math.min(rect.left, window.innerWidth-230)}px;top:${rect.bottom+4}px;`;

// ── Apply checker name to all weekdays in month ────────────────
function applyCheckerAll(rid) {
    const inp = document.getElementById(`chk-bar-${rid}`);
    if (!inp) return;
    const name = stripTitle(inp.value.trim());
    if (!name) { inp.focus(); return; }

    const from = new Date(currentYear, currentMonth - 1, 1);
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

    if (!checkers[rid]) checkers[rid] = {};

    for (let d = 1; d <= daysInMonth; d++) {
        const date = `${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const dow  = new Date(date + 'T00:00:00').getDay();
        if (dow === 0 || dow === 6) continue; // skip weekends
        if (isPH(date)) continue;             // skip holidays
        // ใส่ชื่อเฉพาะวันที่มีผลตรวจแล้ว — ไม่สร้างบันทึกเปล่าหรือวันข้างหน้า
        if (date > localToday() || !Object.values(vals[rid]?.[date] || {}).some(v => v !== '')) continue;
        checkers[rid][date] = name;

        // update cell in DOM if rendered
        const el = document.getElementById(`chk-${rid}-${date}`);
        if (el) {
            el.textContent = name;
            el.className = 'cv-chk filled';
            el.title = name;
        }
        markDirty(rid, date);
    }
    inp.value = name;
}

// ── บันทึกย้อนหลัง (TISAX) ─────────────────────────────────────
function yesterdayStr() { const y = new Date(); y.setDate(y.getDate() - 1); return `${y.getFullYear()}-${pad2(y.getMonth()+1)}-${pad2(y.getDate())}`; }
function isBackfillDate(date) { return date < yesterdayStr(); }
function askBackfillReason(rid) {
    if (backfillReason[rid]) return Promise.resolve(true);
    if (_bfPending[rid]) return _bfPending[rid];
    const room = rooms.find(r => r.id == rid);
    const msg = `บันทึกย้อนหลัง — ${room?.code || ''}\n\nวันที่เก่ากว่าเมื่อวาน ต้องระบุเหตุผล (เก็บเป็นหลักฐานตรวจสอบ)\nเช่น "ตรวจแล้วแต่ลงระบบช้า"`;
    _bfPending[rid] = Promise.resolve(window.prompt(msg, '')).then(v => {
        delete _bfPending[rid];
        const r = String(v || '').trim();
        if (r) backfillReason[rid] = r;
        return !!r;
    });
    return _bfPending[rid];
}

// ── Dirty / save ───────────────────────────────────────────────
function markDirty(rid, date) {
    // วันเก่ากว่าเมื่อวาน: ขอเหตุผลก่อน ถ้ายกเลิก → โหลดค่าเดิมกลับ
    if (isBackfillDate(date) && !backfillReason[rid]) {
        askBackfillReason(rid).then(ok => { if (ok) markDirty(rid, date); else reloadRoom(rid); });
        return;
    }
    const k = `${rid}:${date}`;
    dirty[k] = true;
    clearTimeout(saveTimers[k]);
    saveTimers[k] = setTimeout(() => saveCell(rid, date), 1800);
}

async function saveCell(rid, date) {
    const k = `${rid}:${date}`;
    if (!dirty[k]) return;
    dirty[k] = false;

    const fd = new FormData();
    fd.append('action',      'save_check');
    fd.append('room_id',     rid);
    fd.append('check_date',  date);
    fd.append('checked_by',  checkers[rid]?.[date] ?? '');
    fd.append('suggestions', sugg[rid]?.[date] ?? '');
    fd.append('values',      JSON.stringify(vals[rid]?.[date] ?? {}));
    if (isBackfillDate(date)) fd.append('backfill_reason', backfillReason[rid] || '');

    try {
        const res  = await fetch(API, { method:'POST', body:fd });
        const data = await res.json();
        if (data.status !== 'success') dirty[k] = true; // retry on next change
        else if (isBackfillDate(date)) { if (!late[rid]) late[rid] = {}; late[rid][date] = localToday(); }
    } catch(e) { dirty[k] = true; }
}

// ── Bulk fill room ─────────────────────────────────────────────
async function bulkRoom(rid) {
    const room = rooms.find(r => r.id == rid);
    if (!confirm(`ติ๊กปกติวันที่ว่าง: ${room?.code} — ${thMSh[currentMonth]} ${currentYear+543}\n\nจะติ๊ก ✓ ให้ข้อปกติ/มีปัญหา ในวันทำงานที่ผ่านมาแล้วและยังไม่ได้บันทึก
• ช่องตัวเลข (กล้องออนไลน์ / วันเก็บภาพ) เว้นไว้ — กรอกตามที่ดูจริง\n• ไม่ทับวันที่บันทึกไว้แล้ว\n• ไม่เติมวันข้างหน้า\n\nยืนยันว่าได้ตรวจจริงตามวันดังกล่าว?`)) return;

    const fd = new FormData();
    fd.append('action',  'bulk_fill');
    fd.append('room_id', rid);
    fd.append('month',   currentMonth);
    fd.append('year',    currentYear);
    fd.append('mode',    'all');
    const ys = yesterdayStr();
    const needOld = Array.from({ length: monthDays }, (_, i) => ds(i + 1)).some(d => d < ys && !isWE(d) && !isPH(d) && !Object.keys(vals[rid]?.[d] || {}).length);
    if (needOld) {
        if (!(await askBackfillReason(rid))) return;
        fd.append('backfill_reason', backfillReason[rid]);
    }

    try {
        const res  = await fetch(API, { method:'POST', body:fd });
        const data = await res.json();
        if (data.status === 'success') {
            // Reload just this room's data
            await reloadRoom(rid);
        } else {
            alert('เกิดข้อผิดพลาด: ' + (data.message || ''));
        }
    } catch(e) { alert('Error: ' + e.message); }
}

async function reloadRoom(rid) {
    const res  = await fetch(`${API}?action=get_month_detail&month=${currentMonth}&year=${currentYear}`);
    const data = await res.json();
    if (data.status !== 'success') return;

    vals[rid]     = data.vals?.[rid]     || {};
    checkers[rid] = data.checkers?.[rid] || {};
    sugg[rid]     = data.sugg?.[rid]     || {};
    // Re-render room body

// ════ โหมด "ตรวจวันนี้": ภาพรวมทุกห้อง → ตรวจทีละห้อง → บันทึกแล้วไปห้องถัดไป ════
let scView = localStorage.getItem('sc_view') || 'today';
let tdRoom = null;        // ห้องที่กำลังตรวจ
let tdInRoom = false;     // มือถือ: อยู่หน้าตรวจห้อง (ไม่ใช่ภาพรวม)
let tdUnsaved = false;

function setView(v) {
    if (v === scView) return;
    if (scView === 'today' && tdUnsaved && !confirm('ผลตรวจห้องนี้ยังไม่ได้บันทึก — ออกโดยไม่บันทึก?')) return;

    localStorage.setItem('sc_view', v);

    if (v === 'today' && (currentMonth !== n.getMonth() + 1 || currentYear !== n.getFullYear())) { goThisMonth(); return; }

}
function applyViewTabs() {
    document.body.classList.toggle('view-today', scView === 'today');

// ค่าที่ "ไม่ผ่าน" ของแต่ละแบบรายการ (ใช้นับปัญหาและบังคับหมายเหตุ)
function tdFail(item, v) {
    if (v === '' || v == null) return false;
    if (v === '✖') return true;
    const thr = parseFloat(item.threshold) || 90;
    if (item.input_type === 'percent' || item.input_type === 'days') { const n = parseFloat(v); return !isNaN(n) && n < thr; }
    return false;
}
function tdRoomState(rid) {
    const today = localToday();
    const items = itemsByRoom[rid] || [];
    const dv = vals[rid]?.[today] || {};
    const done = items.filter(i => (dv[i.id] ?? '') !== '').length;
    const bad = items.filter(i => tdFail(i, dv[i.id])).length;
    const cls = !items.length ? 'no' : bad ? 'bad' : done === 0 ? 'no' : done < items.length ? 'part' : 'ok';
    const lbl = !items.length ? 'ไม่มีรายการ' : bad ? `มีปัญหา ${bad}` : done === 0 ? 'ยังไม่ตรวจ' : done < items.length ? `${done}/${items.length}` : 'ปกติ';
    return { cls, lbl, done, bad, total: items.length };
}
function tdNextRoom(afterRid) {
    const list = visibleRooms();
    const idx = list.findIndex(r => r.id == afterRid);
    const pending = r => { const s = tdRoomState(r.id); return s.total && (s.cls === 'no' || s.cls === 'part'); };
    return list.slice(idx + 1).find(pending) || list.slice(0, Math.max(0, idx)).find(pending) || null;
}

    const rows = items.map((it, i) => {

            ctl = `<div class="td-seg"><button class="ok ${v === okV ? 'on' : ''}" onclick="tdSet(${it.id},'${okV}')"><i class="fa fa-check"></i> ปกติ</button><button class="bad ${v === '✖' ? 'on' : ''}" onclick="tdSet(${it.id},'✖')"><i class="fa fa-xmark"></i> มีปัญหา</button></div>`;
        } else if (it.input_type === 'percent' && parseInt(it.total_count, 10) > 0) {

            <div><label>ผู้ตรวจ</label><input id="td-checker" value="${esc(checker)}" oninput="tdUnsaved=true"></div>
            <div class="td-save">

                <button class="pri" id="td-save-next" onclick="tdSave(true)" ${st.done < st.total || needNote ? 'disabled' : ''}>${nextAfter ? `บันทึก แล้วไปห้อง ${esc(nextAfter.code)} <i class="fa fa-arrow-right"></i>` : 'บันทึก — ห้องสุดท้ายแล้ว <i class="fa fa-flag-checkered"></i>'}</button>
            </div>
            <div class="td-hint" id="td-hint">${st.bad ? 'ข้อที่มีปัญหาจะแจ้ง LINE/Telegram ทันทีที่บันทึก' : st.done < st.total ? `เหลืออีก ${st.total - st.done} ข้อ` : 'ตรวจครบแล้ว'} · ดู/แก้ไขย้อนหลังที่แท็บ "รายเดือน"</div>
        </div></div>`;

    document.getElementById('sc-page').innerHTML = `<div class="td-wrap${tdInRoom ? ' in-room' : ''}">${ov}${ck}</div>`;
}

function tdOpen(rid) {
    if (rid != tdRoom && tdUnsaved && !confirm('ผลตรวจห้องนี้ยังไม่ได้บันทึก — เปลี่ยนห้องโดยไม่บันทึก?')) return;
    if (rid != tdRoom) tdUnsaved = false;
    tdRoom = rid; tdInRoom = true;
    renderToday();
    window.scrollTo({ top: 0 });
}
function tdBack() { tdInRoom = false; renderToday(); window.scrollTo({ top: 0 }); }
function tdSet(iid, v) {
    const today = localToday();
    if (!vals[tdRoom]) vals[tdRoom] = {};
    if (!vals[tdRoom][today]) vals[tdRoom][today] = {};
    const cur = vals[tdRoom][today][iid] ?? '';
    vals[tdRoom][today][iid] = (v === cur && (v === '###' || v === 'O' || v === '✖')) ? '' : String(v).trim();
    tdUnsaved = true;
    renderToday();
}
function tdSetCount(iid, cnt, tot) {
    if (cnt === '') return tdSet(iid, '');
    const c = Math.max(0, Math.min(tot, parseInt(cnt, 10) || 0));
    tdSet(iid, String(Math.round(c / tot * 1000) / 10));
}
function tdAllOk() {
    const today = localToday();
    if (!vals[tdRoom]) vals[tdRoom] = {};
    if (!vals[tdRoom][today]) vals[tdRoom][today] = {};
    (itemsByRoom[tdRoom] || []).forEach(it => {
        if (it.input_type === 'status') vals[tdRoom][today][it.id] = '###';
        if (it.input_type === 'backup') vals[tdRoom][today][it.id] = 'O';
    });
    tdUnsaved = true;
    renderToday();
}
function tdNote(v) {
    const today = localToday();
    if (!sugg[tdRoom]) sugg[tdRoom] = {};
    sugg[tdRoom][today] = v;
    tdUnsaved = true;
    // อัปเดตแค่ปุ่ม/กรอบ ไม่วาดใหม่ทั้งหน้า (ไม่ให้เคอร์เซอร์หลุดระหว่างพิมพ์)
    const st = tdRoomState(tdRoom), need = st.bad > 0 && !v.trim();
    document.getElementById('td-note')?.classList.toggle('req', need);
    const a = document.getElementById('td-save-only'), b = document.getElementById('td-save-next');
    if (a) a.disabled = need;
    if (b) b.disabled = need || st.done < st.total;
}
async function tdSave(goNext) {
    const today = localToday();
    const rid = tdRoom;
    if (!checkers[rid]) checkers[rid] = {};
    checkers[rid][today] = (document.getElementById('td-checker')?.value || myName).trim();
    const fd = new FormData();
    fd.append('action', 'save_check');
    fd.append('room_id', rid);
    fd.append('check_date', today);
    fd.append('checked_by', checkers[rid][today]);
    fd.append('suggestions', sugg[rid]?.[today] ?? '');
    fd.append('values', JSON.stringify(vals[rid]?.[today] ?? {}));
    const btns = [document.getElementById('td-save-only'), document.getElementById('td-save-next')];
    btns.forEach(b => b && (b.disabled = true));
    try {
        const data = await (await fetch(API, { method: 'POST', body: fd })).json();
        if (data.status !== 'success') throw new Error(data.message || 'บันทึกไม่สำเร็จ');
        tdUnsaved = false;
        const room = rooms.find(r => r.id == rid);
        if (typeof showToast === 'function') showToast(`บันทึก ${room?.code || ''} แล้ว`);
        updateBadge();
        const nx = goNext ? tdNextRoom(rid) : null;
        if (nx) { tdRoom = nx.id; tdInRoom = true; window.scrollTo({ top: 0 }); }
        else if (goNext) tdInRoom = false;
        renderToday();
    } catch (e) {
        alert('บันทึกไม่สำเร็จ: ' + e.message);
        btns.forEach(b => b && (b.disabled = false));
    }
}
window.addEventListener('beforeunload', e => { if (tdUnsaved) { e.preventDefault(); e.returnValue = ''; } });

// ── Print ──────────────────────────────────────────────────────
function printRoom(rid) {
    window.open(`server_check_print.php?room_id=${rid}&month=${currentMonth}&year=${currentYear}`, '_blank');
}

// ── Stats ──────────────────────────────────────────────────────
function roomStat(rid) {
    const items = itemsByRoom[rid] || [];
    const total = items.length;
    if (total === 0) return { cls: 'empty', lbl: 'ไม่มีรายการ' };

    let daysOk = 0, daysIssue = 0, daysTotal = 0;
    for (let d = 1; d <= monthDays; d++) {
        const date = ds(d);
        if (isWE(date)) continue;
        daysTotal++;
        const dayVals = vals[rid]?.[date];
        if (!dayVals) continue;
        const vArr = Object.values(dayVals);
        if (vArr.includes('✖')) daysIssue++;
        else if (vArr.length >= total) daysOk++;
    }
    if (daysIssue > 0) return { cls: 'issue',   lbl: `${daysIssue} วัน ⚠` };
    if (daysOk === daysTotal && daysTotal > 0) return { cls: 'ok',   lbl: `${daysOk}/${daysTotal} วัน ✓` };
    if (daysOk > 0)          return { cls: 'partial', lbl: `${daysOk}/${daysTotal} วัน` };
    return { cls: 'empty', lbl: 'ยังไม่เช็ค' };
}

function updateRoomStat(rid) {
    const stat    = roomStat(rid);
    const statEl  = document.querySelector(`#acc-${rid} .acc-stat`);
    const roomEl  = document.getElementById('acc-' + rid);
    if (statEl) { statEl.className = `acc-stat ${stat.cls}`; statEl.textContent = stat.lbl; }
    if (roomEl) {
        roomEl.classList.remove('has-issue','all-ok');
        if (stat.cls === 'issue') roomEl.classList.add('has-issue');
        if (stat.cls === 'ok')    roomEl.classList.add('all-ok');
    }
}

function updateBadge() {
    const today = localToday();
    const el = document.getElementById('overall-badge');
    const txt = document.getElementById('overall-text');
    if (!el) return;

    const now = new Date();
    const roomsShown = visibleRooms();
    if (currentMonth === now.getMonth()+1 && currentYear === now.getFullYear() && !isWE(today)) {
        // Today: how many rooms done
        let done = 0;
        roomsShown.forEach(r => {
            const items = itemsByRoom[r.id] || [];
            const dayVals = vals[r.id]?.[today];
            if (dayVals && Object.values(dayVals).filter(v=>v&&v!=='').length >= items.length) done++;
        });
        txt.textContent = `วันนี้ ${done}/${roomsShown.length} ห้อง`;
        el.className = 'sc-badge' + (done === roomsShown.length && roomsShown.length > 0 ? ' done' : '');
    } else {
        // Month total
        let total = 0, ok = 0;
        roomsShown.forEach(r => {
            const items = itemsByRoom[r.id] || [];
            for (let d=1; d<=monthDays; d++) {
                const date = ds(d);
                if (isWE(date)) continue;
                total++;
                const dv = vals[r.id]?.[date];
                if (dv && Object.values(dv).filter(v=>v&&v!=='').length >= items.length) ok++;
            }
        });
        txt.textContent = `${ok}/${total} ช่อง`;
        el.className = 'sc-badge' + (total > 0 && ok === total ? ' done' : '');
    }
}

// ── Helpers ────────────────────────────────────────────────────
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── จอ TV (ห้อง IT) ─────────────────────────────────────────────
const TV_REFRESH_MS = 60000; // ดึงข้อมูลใหม่ทุก 1 นาที
let tvActive = false;
let tvClockInterval  = null;
let tvRefreshInterval = null;
let tvCompanyFilter  = null; // null = ทุกบริษัท · 'PTA' = จอของไซต์เดียว
let tvData = null, tvOnline = true;

async function enterTvMode(companyCode) {
    tvCompanyFilter = companyCode || null;
    tvActive = true;
    document.getElementById('tv-view').classList.add('active');
    tvFit();
    await tvLoad();
    tickTvClock();
    tvClockInterval = setInterval(tickTvClock, 1000);
    tvRefreshInterval = setInterval(tvLoad, TV_REFRESH_MS);
    document.addEventListener('keydown', tvKeyHandler);
    window.addEventListener('resize', tvFit);
}
function exitTvMode() {
    tvActive = false;
    document.getElementById('tv-view').classList.remove('active');
    clearInterval(tvClockInterval);   tvClockInterval   = null;
    clearInterval(tvRefreshInterval); tvRefreshInterval = null;
    document.removeEventListener('keydown', tvKeyHandler);
    window.removeEventListener('resize', tvFit);
}
function tvKeyHandler(e) { if (e.key === 'Escape') exitTvMode(); }
function tvFit() {
    const st = document.getElementById('tv-stage');
    if (st) st.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`;
}
async function tvLoad() {
    try {
        const j = await (await fetch(`${API}?action=get_tv_status&_t=${Date.now()}`, { cache: 'no-store' })).json();
        if (j.status !== 'success') throw new Error(j.message || 'error');
        tvData = j; tvOnline = true;
    } catch (e) { tvOnline = false; } // เน็ตหลุด: คงภาพเดิมไว้ ขึ้นป้าย OFFLINE
    if (tvActive) renderTvView();
}
function tickTvClock() {
    const el = document.getElementById('tv-clock');
    if (el) el.textContent = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
// ชื่อสั้นของกล้อง/DVR จากชื่อรายการ เช่น "DVR 1 (25CH) – Online %" → DVR 1, "CCTV – Online (%) (F-16)" → F-16
function tvShort(label, def) {
    const m = String(label).match(/\b(F-\d+)\b/) || String(label).match(/^(DVR\s*\d+)/i);
    return m ? m[1].toUpperCase().replace(/\s+/, ' ') : def;
}
function tvFailItem(it, v) {
    if (v === '' || v == null) return false;
    if (['✖', '✗', 'issue', 'X', 'x'].includes(v)) return true;
    return (it.type === 'percent' || it.type === 'days') && !isNaN(parseFloat(v)) && parseFloat(v) < it.thr;
}

function renderTvView() {
    const stage = document.getElementById('tv-stage');
    if (!stage) return;
    if (!tvData) { stage.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;font-size:28px;color:#93a3bd">กำลังโหลด…</div>'; return; }
    const rs = tvData.rooms.filter(r => !tvCompanyFilter || r.company === tvCompanyFilter);
    const n = rs.length || 1;
    const cnt = st => rs.filter(r => r.state === st).length;
    const ok = cnt('ok'), bad = cnt('bad'), part = cnt('part'), none = cnt('none');
    const C = 2 * Math.PI * 64;
    const stCol = s => s === 'bad' ? 'var(--bad)' : s === 'ok' ? 'var(--ok)' : s === 'part' ? 'var(--warn)' : 'var(--idle)';
    const coCol = { PTA: 'var(--pta)', PT4: 'var(--pt4)', PTE: 'var(--pte)' };
    const now = new Date();

    // รายละเอียดข้อที่ไม่ผ่านของห้อง (แสดงในกล่องแจ้งเตือน)
    const failText = r => r.items.filter(it => tvFailItem(it, r.vals[it.id])).slice(0, 2).map(it => {
        const v = r.vals[it.id];
        if (it.type === 'percent' && it.total) { const on = Math.round(parseFloat(v) / 100 * it.total); return `${tvShort(it.label, 'กล้อง')} ออนไลน์ ${on}/${it.total} (ดับ ${it.total - on} ตัว)`; }
        if (it.type === 'percent') return `${tvShort(it.label, 'กล้อง')} ${v}%`;
        if (it.type === 'days') return `${tvShort(it.label, 'เก็บภาพ')} เก็บภาพ ${v} วัน (เกณฑ์ ${it.thr})`;
        return `${it.label} มีปัญหา`;
    }).join(' · ');
    const badRooms = rs.filter(r => r.state === 'bad');
    let alert;
    if (badRooms.length) alert = `<div class="tv2-alert bad"><div class="ic"><i class="fa fa-triangle-exclamation"></i></div><div style="min-width:0">
        <h2>${badRooms.length} ห้องพบปัญหา — ${badRooms.map(r => esc(r.code)).join(', ')}</h2>
        <p>${badRooms.map(r => `<b>${esc(r.code)}</b> ${esc(failText(r))}${r.by ? ` · ${esc(stripTitle(r.by).split(' ')[0])} ${esc(r.at)} น.` : ''}`).join(' &nbsp;|&nbsp; ')}</p></div></div>`;
    else if (tvData.closed && ok + part === 0) alert = `<div class="tv2-alert off"><div class="ic"><i class="fa fa-mug-hot"></i></div><div><h2>วันนี้เป็นวันหยุด</h2><p>ไม่บังคับตรวจ · ถ้าเข้าห้องจริงบันทึกได้ตามปกติ</p></div></div>`;
    else if (ok === rs.length) alert = `<div class="tv2-alert ok"><div class="ic"><i class="fa fa-circle-check"></i></div><div><h2>ทุกห้องทำงานปกติ</h2><p>ตรวจครบ <b>${ok}/${rs.length}</b> ห้อง · ไม่พบปัญหาวันนี้</p></div></div>`;
    else alert = `<div class="tv2-alert wait"><div class="ic"><i class="fa fa-hourglass-half"></i></div><div style="min-width:0"><h2>รอตรวจอีก ${part + none} ห้อง</h2>
        <p>${rs.filter(r => r.state === 'none' || r.state === 'part').map(r => `<b>${esc(r.code)}</b>${r.state === 'part' ? ' (ไม่ครบ)' : ''}`).join(' · ')}</p></div></div>`;

    const cols = Math.min(4, rs.length || 1), rows = Math.ceil((rs.length || 1) / cols);
    const tiles = rs.map(r => {
        const pct = r.items.filter(i => i.type === 'percent');
        const ret = r.items.filter(i => i.type === 'days');
        const filled = r.items.filter(i => (r.vals[i.id] ?? '') !== '');
        const lbl = r.state === 'bad' ? 'พบปัญหา' : r.state === 'ok' ? 'ปกติ' : r.state === 'part' ? `${filled.length}/${r.items.length}` : 'ยังไม่ตรวจ';
        const cams = pct.map(it => {
            const v = r.vals[it.id]; const has = v !== undefined && v !== '';
            const p = has ? Math.max(0, Math.min(100, parseFloat(v))) : 0;
            const c = !has ? 'var(--idle)' : p >= it.thr ? 'var(--ok)' : 'var(--bad)';
            const txt = !has ? '—' : it.total ? `${Math.round(p / 100 * it.total)}/${it.total}` : `${p}%`;
            return `<div class="r-cam"><span class="l">${esc(tvShort(it.label, 'CCTV'))}</span><div class="r-bar"><i style="width:${p}%;background:${c}"></i></div><span class="v mono" style="color:${has ? c : 'var(--tx3)'}">${txt}</span></div>`;
        }).join('');
        const rets = ret.map(it => { const v = r.vals[it.id]; const has = v !== undefined && v !== '';
            return `<span class="${has && parseFloat(v) < it.thr ? 'f' : ''}"><i class="fa fa-film"></i> ${esc(tvShort(it.label, 'เก็บภาพ'))} <b>${has ? esc(v) : '—'}</b>${has ? ' วัน' : ''}</span>`; }).join('');
        const dots = r.items.map(it => { const v = r.vals[it.id]; return `<i class="${tvFailItem(it, v) ? 'x' : (v !== undefined && v !== '') ? 'o' : ''}"></i>`; }).join('');
        return `<div class="tv2-room ${r.state}" style="--st:${stCol(r.state)}">
            <div class="r-top"><div class="r-code">${esc(r.code)}</div><span class="r-co" style="color:${coCol[r.company] || 'var(--tx2)'};border-color:${coCol[r.company] || 'var(--line)'}">${esc(r.company || '')}</span>
                <div class="r-st"><i></i>${lbl}</div></div>
            <div class="r-name">${esc(r.name)}</div>
            <div class="r-cams">${cams}</div>
            ${rets ? `<div class="r-ret">${rets}</div>` : ''}
            <div class="r-foot"><div class="r-dots">${dots}</div><div class="r-who">${r.by ? `<b>${esc(stripTitle(r.by).split(' ')[0])}</b><br>${esc(r.at)} น.` : 'รอตรวจ'}</div></div>
        </div>`;
    }).join('');

    stage.innerHTML = `
    <div class="tv2-top">
        <div class="tv2-brand"><div class="mk"><i class="fa fa-server"></i></div><div><small>POWERTECH GROUP · IT${tvCompanyFilter ? ' · ' + esc(tvCompanyFilter) : ''}</small><b>SERVER ROOM MONITOR</b></div></div>
        <div class="tv2-live ${tvOnline ? '' : 'off'}"><i></i>${tvOnline ? 'LIVE' : 'OFFLINE — แสดงข้อมูลล่าสุด'}</div>
        <div class="tv2-clock"><div class="t mono" id="tv-clock">${now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</div>
            <div class="d">${now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div></div>
    </div>
    <div class="tv2-sum">
        <div class="tv2-ringbox">
            <div class="tv2-ring"><svg width="150" height="150"><circle cx="75" cy="75" r="64" stroke="#1a2438" stroke-width="14" fill="none"/>
                <circle cx="75" cy="75" r="64" stroke="var(--ok)" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${C * ok / n} ${C}"/>
                <circle cx="75" cy="75" r="64" stroke="var(--bad)" stroke-width="14" fill="none" stroke-dasharray="${C * bad / n} ${C}" stroke-dashoffset="${-C * ok / n}"/>
                <circle cx="75" cy="75" r="64" stroke="var(--warn)" stroke-width="14" fill="none" stroke-dasharray="${C * part / n} ${C}" stroke-dashoffset="${-C * (ok + bad) / n}"/></svg>
                <div class="c"><b>${ok + bad}/${rs.length}</b><span>ห้องตรวจแล้ว</span></div></div>
            <div class="tv2-counts">
                <div class="tv2-cnt"><b style="color:var(--ok)">${ok}</b><i style="background:var(--ok)"></i>ปกติ</div>
                <div class="tv2-cnt"><b style="color:var(--bad)">${bad}</b><i style="background:var(--bad)"></i>พบปัญหา</div>
                <div class="tv2-cnt"><b style="color:var(--tx2)">${part + none}</b><i style="background:var(--idle)"></i>ยังไม่ตรวจ${part ? ` <span style="font-size:15px">(ไม่ครบ ${part})</span>` : ''}</div>
            </div>
        </div>
        ${alert}
    </div>
    <div class="tv2-grid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${tiles || '<div style="color:#93a3bd;font-size:24px">ไม่มีห้อง</div>'}</div>
    <div class="tv2-hist"><h3>${tvData.days.length} วันทำงานล่าสุด</h3>
        <div class="tv2-hgrid" style="grid-template-columns:repeat(${Math.max(1, rs.length)},1fr)">${rs.map(r => `<div class="tv2-hcol"><b class="mono">${esc(r.code)}</b><div class="tv2-hdays">${r.hist.map(h => `<i class="${h.st}" title="${esc(h.date)}"></i>`).join('')}</div></div>`).join('')}</div>
        <div class="tv2-hleg"><span><i style="background:rgba(34,197,94,.75)"></i>ปกติ</span><span><i style="background:var(--bad)"></i>ปัญหา</span><span><i style="background:var(--warn)"></i>ไม่ครบ</span><span><i style="background:#1f2a40"></i>ไม่ได้ตรวจ</span></div>
    </div>`;
}

// ── Init ───────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', async () => {
    const updateIcon = () => {
        document.getElementById('theme-icon').className =
            document.documentElement.classList.contains('dark') ? 'fa fa-moon' : 'fa fa-sun';
    };
    updateIcon();
    document.getElementById('theme-toggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        document.documentElement.classList.toggle('dark-theme');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        updateIcon();
    });

    fetch('api.php?action=check_session').then(r=>r.json()).then(s=>{
        if (!s.loggedin) { window.location.href='login.html?returnUrl=server_check.html'; return; }
        myName = stripTitle(s.display_name || s.username || '');
    });

    const p = new URLSearchParams(location.search);
    if (p.get('month')) currentMonth = parseInt(p.get('month'));
    if (p.get('year'))  currentYear  = parseInt(p.get('year'));
    if (p.get('date')) {
        const d = new Date(p.get('date')+'T00:00:00');
        currentMonth = d.getMonth()+1; currentYear = d.getFullYear();
    }

    updateMonthLabel();
    applyViewTabs();
    await load();

    if (p.get('tv') === '1') enterTvMode(p.get('company'));
});
</script>
<script src="js/nav-chip.js?v=20260707"></script>
<!-- วันหยุดบริษัท: วันที่ไม่ต้องตรวจห้อง Server -->
<div class="hd-backdrop" id="hd-backdrop" onmousedown="if(event.target===this)closeHolidays()">
  <div class="hd-modal" role="dialog" aria-labelledby="hd-title">
    <div class="hd-head">
      <div class="ic"><i class="fa fa-calendar-xmark"></i></div>
      <div><h3 id="hd-title">วันหยุดบริษัท</h3><p>วันที่ตั้งไว้ระบบจะข้ามให้ ไม่ต้องตรวจห้อง Server</p></div>
      <button class="hd-x" onclick="closeHolidays()" title="ปิด (Esc)"><i class="fa fa-xmark"></i></button>
    </div>
    <div class="hd-body">
      <div class="hd-side">
        <div class="hd-year"><button onclick="hdYear(-1)" title="ปีก่อน"><i class="fa fa-chevron-left"></i></button><b id="hd-year"></b><button onclick="hdYear(1)" title="ปีถัดไป"><i class="fa fa-chevron-right"></i></button><span class="cnt" id="hd-count"></span></div>
        <label class="hd-lbl" for="hd-date">วันที่</label><input class="hd-in" type="date" id="hd-date">
        <label class="hd-lbl" for="hd-name">ชื่อวันหยุด</label><input class="hd-in" id="hd-name" placeholder="เช่น วันสงกรานต์" autocomplete="off">
        <div class="hd-msg" id="hd-msg"></div>
        <button class="hd-add" id="hd-add" onclick="addHoliday()"><i class="fa fa-plus"></i> เพิ่มวันหยุด</button>
        <div class="hd-pre-t">วันหยุดราชการ — กดเพื่อเติมให้</div>
        <div class="hd-pre" id="hd-pre"></div>
      </div>
      <div class="hd-main">
        <div class="hd-months" id="hd-months"></div>
        <div class="hd-list" id="hd-list"></div>
      </div>
    </div>
  </div>
</div>
<script>
// ── วันหยุดบริษัท (ย้ายมาจาก holidays.html) ──
const HD_MONTHS = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const HD_DOWS = ['อา','จ','อ','พ','พฤ','ศ','ส'];
const HD_PRESETS = [
    ['01-01','วันขึ้นปีใหม่'],['04-06','วันจักรี'],['04-13','วันสงกรานต์'],['04-14','วันสงกรานต์'],['04-15','วันสงกรานต์'],
    ['05-01','วันแรงงานแห่งชาติ'],['05-04','วันฉัตรมงคล'],['06-03','วันเฉลิมพระชนมพรรษา ราชินี'],['07-28','วันเฉลิมพระชนมพรรษา ร.10'],
    ['08-12','วันแม่แห่งชาติ'],['10-13','วันคล้ายวันสวรรคต ร.9'],['10-23','วันปิยมหาราช'],['12-05','วันพ่อแห่งชาติ'],['12-10','วันรัฐธรรมนูญ'],['12-31','วันสิ้นปี'],
];
const hd = { year: new Date().getFullYear(), list: [], month: 0, changed: false };

function openHolidays() {
    hd.year = currentYear; hd.month = 0; hd.changed = false;
    document.getElementById('hd-backdrop').classList.add('open');
    document.getElementById('hd-date').value = `${hd.year}-${pad2(currentMonth)}-01`;
    hdLoad();
    setTimeout(() => document.getElementById('hd-name').focus(), 50);
}
function closeHolidays() {
    document.getElementById('hd-backdrop').classList.remove('open');
    if (hd.changed) load(); // วันหยุดเปลี่ยน → วาดตารางเดือนนี้ใหม่
}
function hdYear(d) { hd.year += d; hd.month = 0; document.getElementById('hd-date').value = `${hd.year}-01-01`; hdLoad(); }
async function hdLoad() {
    document.getElementById('hd-year').textContent = hd.year + 543;
    try {
        const r = await fetch(`${API}?action=get_holidays&year=${hd.year}`);
        const d = await r.json();
        hd.list = d.holidays || [];
    } catch (e) { hd.list = []; }
    hdRender();
}
function hdRender() {
    document.getElementById('hd-count').textContent = `${hd.list.length} วัน`;
    const months = new Set(hd.list.map(h => parseInt(h.holiday_date.split('-')[1], 10)));
    document.getElementById('hd-months').innerHTML = `<button class="${hd.month ? '' : 'on'}" onclick="hd.month=0;hdRender()">ทั้งปี</button>`
        + HD_MONTHS.slice(1).map((m, i) => `<button class="${hd.month === i + 1 ? 'on' : months.has(i + 1) ? 'has' : ''}" onclick="hd.month=${i + 1};hdRender()">${m}</button>`).join('');
    const rows = hd.month ? hd.list.filter(h => parseInt(h.holiday_date.split('-')[1], 10) === hd.month) : hd.list;
    document.getElementById('hd-list').innerHTML = rows.length ? rows.map(h => {
        const dt = new Date(h.holiday_date + 'T00:00:00'), dow = dt.getDay();
        return `<div class="hd-item"><span class="d">${pad2(dt.getDate())} ${HD_MONTHS[dt.getMonth() + 1]} ${dt.getFullYear() + 543}</span>
            <span class="w ${dow === 0 || dow === 6 ? 'we' : ''}">${HD_DOWS[dow]}</span><span class="n">${esc(h.name)}</span>
            <button onclick="delHoliday(${parseInt(h.id, 10)})" title="ลบ"><i class="fa fa-trash"></i></button></div>`;
    }).join('') : `<div class="hd-empty"><i class="fa fa-calendar-xmark"></i><br>ยังไม่มีวันหยุด${hd.month ? 'ในเดือนนี้' : `ในปี ${hd.year + 543}`}</div>`;
    const have = new Set(hd.list.map(h => h.holiday_date));
    document.getElementById('hd-pre').innerHTML = HD_PRESETS.map(([md, name]) => {
        const date = `${hd.year}-${md}`;
        return `<button class="${have.has(date) ? 'done' : ''}" onclick="hdFill('${date}', this.dataset.n)" data-n="${esc(name)}">${have.has(date) ? '<i class="fa fa-check"></i> ' : ''}${esc(name.replace(/^วัน/, ''))}</button>`;
    }).join('');
}
function hdFill(date, name) { document.getElementById('hd-date').value = date; document.getElementById('hd-name').value = name; document.getElementById('hd-name').focus(); }
async function addHoliday() {
    const date = document.getElementById('hd-date').value, name = document.getElementById('hd-name').value.trim();
    const msg = document.getElementById('hd-msg');
    if (!date || !name) { msg.textContent = 'กรอกวันที่และชื่อวันหยุด'; return; }
    msg.textContent = '';
    const btn = document.getElementById('hd-add'); btn.disabled = true;
    const fd = new FormData(); fd.append('action', 'save_holiday'); fd.append('holiday_date', date); fd.append('name', name);
    try {
        const d = await (await fetch(API, { method: 'POST', body: fd })).json();
        if (d.status !== 'success') throw new Error(d.message || 'บันทึกไม่สำเร็จ');
        hd.changed = true;
        document.getElementById('hd-name').value = '';
        if (parseInt(date.slice(0, 4), 10) !== hd.year) hd.year = parseInt(date.slice(0, 4), 10);
        await hdLoad();
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false;
}
async function delHoliday(id) {
    if (!confirm('ลบวันหยุดนี้?')) return;
    const fd = new FormData(); fd.append('action', 'delete_holiday'); fd.append('id', id);
    try {
        const d = await (await fetch(API, { method: 'POST', body: fd })).json();
        if (d.status !== 'success') throw new Error(d.message || 'ลบไม่สำเร็จ');
        hd.changed = true; await hdLoad();
    } catch (e) { document.getElementById('hd-msg').textContent = e.message; }
}
document.getElementById('hd-name').addEventListener('keydown', e => { if (e.key === 'Enter') addHoliday(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('hd-backdrop').classList.contains('open')) closeHolidays(); });
</script>
</body>
</html>
