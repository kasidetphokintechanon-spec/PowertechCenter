<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Log - System Admin</title>
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="app-manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="uploads/logos/pta_logo.png">
    <script src="js/favicon-version.js"></script>
    <script src="js/pwa.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: { sans: ['Kanit', 'sans-serif'] },
            }
        };
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') document.documentElement.classList.add('dark', 'dark-theme');
        })();
    </script>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/enterprise-theme.css?v=20261021">
<link rel="stylesheet" href="css/ptc-unified-global.css?v=20260529">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300 ptc-unified-v1" data-page="audit_log">

    <nav class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm fixed w-full z-50 border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="admin.html" class="flex items-center gap-2 font-bold text-lg text-slate-700 dark:text-white hover:text-blue-600 transition">
                    <i class="fas fa-arrow-left"></i> กลับหน้า Admin
                </a>
                <h1 class="text-lg font-bold">Audit Log</h1>
                <div style="display:flex;align-items:center;gap:8px;">
                    <a href="settings_notify.html" class="flex items-center gap-2 text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-green-600 dark:hover:text-green-400 transition">
                        <i class="fab fa-line text-lg"></i> <span class="hidden sm:inline">ศูนย์แจ้งเตือน</span>
                    </a>
                    <button type="button" id="theme-toggle" title="สลับธีม" class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                        <i id="theme-icon" class="fas fa-sun"></i>
                    </button>
                    <div id="nav-user-area"></div>
                </div>
            </div>
        </div>
    </nav>

    <div style="display:flex;margin-top:64px;height:calc(100vh - 64px);overflow:hidden;">
    <aside id="ptc-sidebar" style="height:calc(100vh - 64px)"></aside>
    <main class="flex-1 pb-12 px-4 sm:px-6 lg:px-8 w-full" style="overflow-y:auto;">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-4 mb-6 flex flex-col md:flex-row gap-4 items-center">
            <div class="relative flex-1 w-full">
                <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" placeholder="ค้นหา Action, User, Target ID..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
            </div>
            <div class="flex items-center gap-2">
                <input type="date" id="start-date" class="px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-sm">
                <span class="text-slate-400">ถึง</span>
                <input type="date" id="end-date" class="px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-sm">
                <button onclick="exportAuditLogs()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-lg shadow-sm transition flex items-center gap-2 ml-2">
                    <i class="fas fa-file-excel"></i> <span class="hidden sm:inline">Export</span>
                </button>
            </div>
        </div>

        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-6 border-b border-slate-100 dark:border-slate-700">
                <h2 class="text-xl font-bold flex items-center gap-2"><i class="fas fa-history text-slate-500"></i> บันทึกการใช้งานระบบ</h2>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600 dark:text-slate-300">
                    <thead class="bg-slate-50 dark:bg-slate-700/50 text-slate-500 dark:text-slate-400 uppercase font-semibold text-xs">
                        <tr>
                            <th class="px-6 py-4">Timestamp</th>
                            <th class="px-6 py-4">User</th>
                            <th class="px-6 py-4">Action</th>
                            <th class="px-6 py-4">Target ID</th>
                            <th class="px-6 py-4">Details</th>
                            <th class="px-6 py-4">IP Address</th>
                        </tr>
                    </thead>
                    <tbody id="log-list" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                        <tr><td colspan="6" class="px-6 py-10 text-center text-slate-400">กำลังโหลด...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let allLogs = [];

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const sess = await (await fetch('api.php?action=check_session')).json();
                const _p = sess.effective_permissions || [];
                const _ok = sess.role === 'admin' || _p.includes('*') || _p.includes('audit.view');
                if (!sess.loggedin || !_ok) { window.location.href = 'login.html'; return; }

                const res = await fetch('api.php?action=get_audit_logs&v=' + Date.now());
                allLogs = await res.json();

                renderLogs();

                document.getElementById('search-input').addEventListener('input', renderLogs);
                document.getElementById('start-date').addEventListener('change', renderLogs);
                document.getElementById('end-date').addEventListener('change', renderLogs);

            } catch (e) { console.error(e); }
        });

        function renderLogs() {
            const tbody = document.getElementById('log-list');
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            const filteredLogs = allLogs.filter(log => {
                const logDate = new Date(log.timestamp);
                const matchesSearch = !searchTerm || 
                    (log.action && log.action.toLowerCase().includes(searchTerm)) ||
                    (log.user_name && log.user_name.toLowerCase().includes(searchTerm)) ||
                    (log.target_id && log.target_id.toLowerCase().includes(searchTerm));

                const matchesDate = (!startDate || logDate >= new Date(startDate)) && 
                                    (!endDate || logDate <= new Date(endDate + 'T23:59:59'));

                return matchesSearch && matchesDate;
            });

            if (filteredLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-400"><i class="fas fa-search text-4xl mb-2 opacity-50"></i><p>ไม่พบข้อมูลที่ตรงกับการค้นหา</p></td></tr>`;
                return;
            }

            tbody.innerHTML = filteredLogs.map(log => {
                const timestamp = new Date(log.timestamp).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'medium' });
                let detailsHtml = '-';
                if (log.details) { try { const parsedDetails = JSON.parse(log.details); detailsHtml = `<pre class="text-xs bg-slate-100 dark:bg-slate-700 p-2 rounded max-h-24 overflow-auto custom-scrollbar">${JSON.stringify(parsedDetails, null, 2)}</pre>`; } catch (e) { detailsHtml = `<div class="text-xs text-slate-400">${log.details}</div>`; } }
                
                return `<tr class="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition">
                    <td class="px-6 py-4 font-mono text-slate-500 text-xs whitespace-nowrap">${timestamp}</td>
                    <td class="px-6 py-4 font-medium dark:text-white">${log.user_name || 'Guest'} <div class="text-xs text-slate-400">${log.user_id || ''}</div></td>
                    <td class="px-6 py-4 font-mono text-blue-600 dark:text-blue-400 text-xs">${log.action}</td>
                    <td class="px-6 py-4 font-mono text-slate-500 text-xs">${log.target_id || '-'}</td>
                    <td class="px-6 py-4">${detailsHtml}</td>
                    <td class="px-6 py-4 text-slate-500 text-xs">${log.ip_address || '-'}</td>
                </tr>`;
            }).join('');
        }

        function exportAuditLogs() {
            const searchTerm = document.getElementById('search-input').value;
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;
            
            let url = `api.php?action=export_audit_logs`;
            if(searchTerm) url += `&search=${encodeURIComponent(searchTerm)}`;
            if(startDate) url += `&start_date=${encodeURIComponent(startDate)}`;
            if(endDate) url += `&end_date=${encodeURIComponent(endDate)}`;
            
            window.location.href = url;
        }

        // Theme was already read from localStorage on load (see boot script in <head>),
        // but there was no button anywhere to actually switch it from this page.
        (function initThemeToggle() {
            const updateIcon = () => {
                const icon = document.getElementById('theme-icon');
                if (icon) icon.className = document.documentElement.classList.contains('dark') ? 'fas fa-moon' : 'fas fa-sun';
            };
            updateIcon();
            document.getElementById('theme-toggle')?.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                document.documentElement.classList.toggle('dark-theme');
                localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
                updateIcon();
            });
        })();
    </script>
</main></div>
<script src="js/sidebar.js?v=20261023c"></script>
<script src="js/nav-chip.js?v=20260707"></script>
</body>
</html>
