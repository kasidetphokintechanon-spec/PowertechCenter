                    <button type="button" id="perm-role-create" class="ptc-btn-primary ptc-btn-sm" style="justify-content:center"><i class="fa fa-plus"></i> เพิ่มชุดสิทธิ์</button>
                    <button type="button" id="perm-role-seed" class="ptc-btn-ghost ptc-btn-sm" style="justify-content:center"><i class="fa fa-wand-magic-sparkles"></i> โหลดชุดมาตรฐาน</button>
                    <div id="perm-role-list" style="display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto">${listHtml || '<div style="font-size:12px;color:#94a3b8">ยังไม่มี Role</div>'}</div>
                </div>
                <div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
                        <input id="perm-role-name" class="ptc-input" placeholder="ชื่อชุดสิทธิ์">
                        <input id="perm-role-desc" class="ptc-input" placeholder="คำอธิบาย (ไม่บังคับ)">
                    </div>
                    <div id="perm-role-perms" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:290px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px;padding:10px;background:#f8fafc"></div>
                    <div style="display:flex;justify-content:space-between;gap:8px;margin-top:10px">
                        <button type="button" id="perm-role-delete" class="ptc-btn-ghost ptc-btn-sm" style="color:#ef4444;border-color:#fecaca">ลบชุดสิทธิ์</button>
                        <button type="button" id="perm-role-save" class="ptc-btn-primary ptc-btn-sm">บันทึกชุดสิทธิ์</button>
                    </div>
                </div>
            </div>
        `;

        const result = await Swal.fire({
            title: 'จัดการชุดสิทธิ์ (Permission Roles)',
            html,
            width: 920,
            showCancelButton: true,
            confirmButtonText: 'ปิด',
            cancelButtonText: 'ปิด',
            showConfirmButton: false,
            didOpen: () => {
                let selected = roleRows.length ? roleRows[0] : null;
                const listEl = gid('perm-role-list');
                const permsEl = gid('perm-role-perms');
                const nameEl = gid('perm-role-name');
                const descEl = gid('perm-role-desc');
                const saveEl = gid('perm-role-save');
                const deleteEl = gid('perm-role-delete');
                const createEl = gid('perm-role-create');
                const seedEl = gid('perm-role-seed');

                const renderPermChecks = (checkedList) => {
                    const checked = new Set(Array.isArray(checkedList) ? checkedList : []);
                    permsEl.innerHTML = defs.map(p => `
                        <label style="display:flex;align-items:flex-start;gap:6px;font-size:12px">
                            <input type="checkbox" class="perm-role-check" value="${p.key}" ${checked.has(p.key)?'checked':''}>
                            <span><span style="font-weight:600;color:#334155">${p.label}</span><span style="display:block;font-size:11px;color:#94a3b8">${p.desc}</span></span>
                        </label>
                    `).join('');
                };

                const paintSelected = () => {
                    if (!listEl) return;
                    listEl.querySelectorAll('[data-role-id]').forEach(btn => {
                        const isSel = selected && String(selected.id) === String(btn.getAttribute('data-role-id'));
                        btn.style.borderColor = isSel ? '#93c5fd' : '#e2e8f0';
                        btn.style.background = isSel ? '#eff6ff' : '#fff';
                    });
                };

                const bindRole = (roleObj) => {
                    selected = roleObj;
                    if (nameEl) nameEl.value = roleObj?.name || '';
                    if (descEl) descEl.value = roleObj?.description || '';
                    renderPermChecks(roleObj?.permissions || []);
                    if (deleteEl) deleteEl.style.display = roleObj?.id ? '' : 'none';
                    paintSelected();
                };

                if (listEl) {
                    listEl.addEventListener('click', (e) => {
                        const btn = e.target.closest('[data-role-id]');
                        if (!btn) return;
                        const roleId = parseInt(btn.getAttribute('data-role-id') || '0', 10);
                        const found = roleRows.find(r => parseInt(r.id, 10) === roleId);
                        if (found) bindRole(found);
                    });
                }

                createEl?.addEventListener('click', () => {
                    bindRole({ id: 0, name: '', description: '', permissions: [] });
                });

                seedEl?.addEventListener('click', async () => {
                    const confirmed = await Swal.fire({
                        icon: 'question',
                        title: 'โหลดชุดสิทธิ์มาตรฐาน?',
                        text: 'ระบบจะเพิ่ม Role ตัวอย่างที่ยังไม่มีอยู่',
                        showCancelButton: true,
                        confirmButtonText: 'โหลด',
                        cancelButtonText: 'ยกเลิก'
                    });
                    if (!confirmed.isConfirmed) return;
                    seedEl.disabled = true;
                    seedEl.textContent = 'กำลังโหลด...';
                    try {
                        const js = await seedPermissionRoles();
                        if (js?.status !== 'success') throw new Error(js?.message || 'โหลดไม่สำเร็จ');
                        const inserted = Number(js?.inserted || 0);
                        const skipped = Number(js?.skipped || 0);
                        Toast.fire({ icon: 'success', title: `โหลดแล้ว (+${inserted}, ข้าม ${skipped})` });
                        await loadPermissionRoles(true);
                        Swal.close();
                        openPermissionRoleManager();
                    } catch (e) {
                        Toast.fire({ icon: 'error', title: e?.message || 'เกิดข้อผิดพลาด' });
                    } finally {
                        seedEl.disabled = false;
                        seedEl.innerHTML = '<i class="fa fa-wand-magic-sparkles"></i> โหลดชุดมาตรฐาน';
                    }
                });

                saveEl?.addEventListener('click', async () => {
                    const payload = {
                        id: selected?.id || 0,
                        name: String(nameEl?.value || '').trim(),
                        description: String(descEl?.value || '').trim(),
                        permissions: Array.from(permsEl.querySelectorAll('.perm-role-check')).filter(cb => cb.checked).map(cb => cb.value)
                    };
                    if (!payload.name) {
                        Toast.fire({ icon: 'warning', title: 'กรุณาระบุชื่อชุดสิทธิ์' });
                        return;
                    }
                    saveEl.disabled = true;
                    saveEl.textContent = 'กำลังบันทึก...';
                    try {
                        const js = await savePermissionRole(payload);
                        if (js?.status !== 'success') throw new Error(js?.message || 'บันทึกไม่สำเร็จ');
                        await loadPermissionRoles(true);
                        Toast.fire({ icon: 'success', title: 'บันทึกชุดสิทธิ์แล้ว' });
                        Swal.close();
                        openPermissionRoleManager();
                    } catch (e) {
                        Toast.fire({ icon: 'error', title: e?.message || 'เกิดข้อผิดพลาด' });
                    } finally {
                        saveEl.disabled = false;
                        saveEl.textContent = 'บันทึกชุดสิทธิ์';
                    }
                });

                deleteEl?.addEventListener('click', async () => {
                    if (!selected?.id) return;
                    const confirmed = await Swal.fire({
                        icon: 'warning',
                        title: 'ลบชุดสิทธิ์นี้?',
                        text: 'การลบจะเอา role ออกจากผู้ใช้ที่ถูก assign อยู่',
                        showCancelButton: true,
                        confirmButtonText: 'ลบ',
                        cancelButtonText: 'ยกเลิก'
                    });
                    if (!confirmed.isConfirmed) return;
                    try {
                        const js = await deletePermissionRole(selected.id);
                        if (js?.status !== 'success') throw new Error(js?.message || 'ลบไม่สำเร็จ');
                        await loadPermissionRoles(true);
                        Toast.fire({ icon: 'success', title: 'ลบชุดสิทธิ์แล้ว' });
                        Swal.close();
                        openPermissionRoleManager();
                    } catch (e) {
                        Toast.fire({ icon: 'error', title: e?.message || 'เกิดข้อผิดพลาด' });
                    }
                });

                bindRole(selected || { id: 0, name: '', description: '', permissions: [] });
            }
        });
        return result;
    }

    function renderPermissionsContent(container) {
        if (!container) return;
        const employees = (data.employees||[]).filter(e=>(e.employment_status||'').toLowerCase()==='active');
        const searchVal = gid('search-input').value.toLowerCase();
        const hasRoleOf = e => ['admin','staff'].includes((e.role||'').toLowerCase());
        const searched = employees.filter(e => { const t=Object.values(e).join(' ').toLowerCase(); return !searchVal||t.includes(searchVal); });
        // ตัวกรองสถานะสิทธิ์ (จำไว้ระหว่างกดเลือกคน)
        const pf = window.permFilter || 'all';
        const cntHas = searched.filter(hasRoleOf).length, cntNone = searched.length - cntHas;
        const filtered = searched.filter(e => pf === 'all' || (pf === 'has' ? hasRoleOf(e) : !hasRoleOf(e)));
        const pfChip = (key, label, n, dot) => `<button type="button" class="perm-filter-chip${pf===key?' on':''}" data-pf="${key}">${dot?`<span style="width:7px;height:7px;border-radius:50%;background:${dot}"></span>`:''}${label}<span class="n">${n}</span></button>`;
        const avatarColorsPerm = ['#3b82f6','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];
        const leftList = filtered.map(e => {
            const primaryAssign = (e.assignments&&e.assignments.find(a=>a.is_primary==1))||(e.assignments&&e.assignments[0]);
            const dept = primaryAssign?primaryAssign.department:'';
            const isSelected = window.selectedPermissionUser === e.id;
            const eRole = (e.role||'').toLowerCase();
            const hasRole = eRole === 'admin' || eRole === 'staff';
            const needsAttention = !hasRole;
            let cls = 'perm-user-item';
            if (isSelected) cls += ' is-selected';
            else if (needsAttention) cls += ' needs-role';
            const avatarBg = hasRole
                ? (eRole === 'admin' ? '#854d0e' : '#1d4ed8')
                : avatarColorsPerm[(e.id||'').split('').reduce((s,c)=>s+c.charCodeAt(0),0)%avatarColorsPerm.length];
            // ใช้อักษรย่อจากชื่ออังกฤษ (เดิมตัด 2 ตัวแรกของชื่อไทย = "นา" จาก นาย/นาง ทุกคน)
            const initials2 = escapeHtml((String(e.name||e.name_th||'?').replace(/^(mr|ms|mrs|miss)\.?\s*/i,'').replace(/^(นางสาว|นาย|นาง)\s*/,'').trim().split(/\s+/).map(w=>w[0]||'').join('').slice(0,2) || '?').toUpperCase());
            let roleBadge = '';
            if (eRole==='admin') roleBadge = `<span style="padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;background:#fef9c3;color:#854d0e;border:1px solid #fde047;margin-left:3px">ADMIN</span>`;
            else if (eRole==='staff') roleBadge = `<span style="padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;margin-left:3px">STAFF</span>`;
            else roleBadge = `<span style="padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;margin-left:3px" title="ยังไม่ได้กำหนดสิทธิ์"><i class="fa fa-exclamation-circle" style="font-size:8px"></i></span>`;
            const deptText = dept?`<div style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ptc-text-faint)">${dept}</div>`:'';
            return `<div class="${cls}" data-user-id="${e.id}">
                <div style="width:32px;height:32px;border-radius:50%;background:${avatarBg};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0">${initials2}</div>
                <div style="flex:1;min-width:0">
                    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(e.name_th||e.name)}</span>${roleBadge}</div>
                    ${deptText}
                </div>
            </div>`;
        }).join('');
        const html = `<div class="perm-panel-wrap">
            <div class="perm-panel-left">
                <div class="perm-panel-hd">
                    <div class="perm-panel-hd-label">เลือกผู้ใช้</div>
                    <button type="button" id="permission-role-manager-btn" class="ptc-btn-ghost ptc-btn-sm" style="font-size:11px;white-space:nowrap">จัดการชุดสิทธิ์</button>
                </div>
                <div class="perm-filter-row">
                    ${pfChip('all','ทั้งหมด',searched.length,'')}
                    ${pfChip('has','มีสิทธิ์แล้ว',cntHas,'#2563eb')}
                    ${pfChip('none','ยังไม่ได้ตั้ง',cntNone,'#ea580c')}
                </div>
                <div class="perm-legend"><i class="fa fa-exclamation-circle" style="color:#c2410c"></i> = ยังไม่ได้ตั้งสิทธิ์ เข้าหน้า admin ไม่ได้ · ADMIN = ทำได้ทุกอย่าง · STAFF = ตามชุดสิทธิ์ที่ตั้ง</div>
                <div id="permission-user-list" style="display:flex;flex-direction:column;gap:2px">${leftList||'<div style="font-size:12px;color:var(--ptc-text-faint)">ไม่พบผู้ใช้</div>'}</div>
            </div>
            <div class="perm-panel-right">
                <div id="permission-detail-container" style="font-size:12px;color:var(--ptc-text-faint)">
                    <div class="perm-empty">
                        <div class="ic"><i class="fa fa-user-shield"></i></div>
                        <div class="t">เลือกผู้ใช้จากด้านซ้ายเพื่อจัดการสิทธิ์</div>
                        <div class="s">${cntNone ? `มี <b>${cntNone} คน</b> ที่ยังไม่ได้ตั้งสิทธิ์ — <a href="#" data-pf-jump="none">ดูรายชื่อ</a>` : 'ทุกคนตั้งสิทธิ์ครบแล้ว ✓'}</div>
                    </div>
                </div>
            </div>
        </div>`;
        container.innerHTML = html;
        container.querySelectorAll('[data-pf],[data-pf-jump]').forEach(b => b.addEventListener('click', ev => {
            ev.preventDefault();
            window.permFilter = b.dataset.pf || b.dataset.pfJump;
            renderPermissionsContent(container);
        }));
        const roleMgrBtn = gid('permission-role-manager-btn');
        if (roleMgrBtn) {
            roleMgrBtn.addEventListener('click', async () => {
                await openPermissionRoleManager();
                await loadPermissionRoles(true);
                renderPermissionsContent(container);
            });
        }
        const listEl = gid('permission-user-list');
        if (listEl) {
            listEl.querySelectorAll('[data-user-id]').forEach(el => {
                el.addEventListener('click', async () => {
                    const userId = el.getAttribute('data-user-id');
                    window.selectedPermissionUser = userId;
                    renderPermissionsContent(container);
                    const detailWrap = gid('permission-detail-container');
                    if (!detailWrap) return;
                    detailWrap.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;padding:40px;color:#94a3b8"><i class="fa fa-spinner fa-spin" style="margin-right:8px"></i>Loading...</div>';
                    const roles = await loadPermissionRoles();
                    const detail = await loadUserPermissionDetail(userId);
                    if (!detail||detail.status!=='success') { detailWrap.innerHTML='<div style="font-size:12px;color:#ef4444">ไม่สามารถโหลดข้อมูลสิทธิ์ได้</div>'; return; }
                    const user = detail.user||{};
                    const effective = Array.isArray(detail.effective_permissions)?detail.effective_permissions:[];
                    const assignedRoleIds = Array.isArray(detail.assigned_role_ids)?detail.assigned_role_ids:[];
                    const roleOptions = roles.map(r=>`<option value="${r.id}" ${assignedRoleIds.includes(r.id)?'selected':''}>${r.name}</option>`).join('');
                    const baseRole = user.base_role||'user';
                    const effectiveText = effective.length?effective.join(', '):'-';
                    const isAdminUser = baseRole === 'admin';
                    const isSelf = user.id === (window.adminSession&&window.adminSession.user_id);
                    detailWrap.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
                        <div><div style="font-size:14px;font-weight:700;color:#0f172a">${user.name_th||user.name||''}</div><div style="font-size:11px;color:#94a3b8">กำหนดสิทธิ์จากหน้านี้เป็นศูนย์กลางเดียว</div></div>
                        ${isAdminUser ? `
                        <div>
                            <div id="perm-role-badge" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                                <span style="display:inline-flex;align-items:center;gap:6px;background:#fef9c3;border:1px solid #fde047;border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;color:#854d0e"><i class="fas fa-shield-alt"></i> ADMIN — สิทธิ์เต็ม (*)</span>
                                ${!isSelf ? `<button type="button" onclick="document.getElementById('permission-base-role-select').value='staff';document.getElementById('perm-role-badge').style.display='none';document.getElementById('perm-role-staff-note').style.display='flex';" style="font-size:11px;padding:3px 10px;border:1px solid #fca5a5;border-radius:6px;background:#fef2f2;color:#b91c1c;cursor:pointer">ถอดสิทธิ์ Admin</button>` : ''}
                            </div>
                            <div id="perm-role-staff-note" style="display:none;align-items:center;gap:6px;font-size:11px;color:#b91c1c;background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;padding:6px 10px;margin-top:6px"><i class="fas fa-exclamation-triangle"></i> จะเปลี่ยนเป็น Staff — บันทึกเพื่อยืนยัน</div>
                            <input type="hidden" id="permission-base-role-select" value="admin">
                        </div>` : `<input type="hidden" id="permission-base-role-select" value="staff">`}
                        <div><div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:6px">ชุดสิทธิ์ (Permission Roles)</div><select id="permission-role-select" multiple style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:6px;font-size:12px;min-height:60px">${roleOptions||'<option value="">(ยังไม่มี Role)</option>'}</select><div style="font-size:11px;color:#94a3b8;margin-top:4px">กด Ctrl หรือ Command เพื่อเลือกหลายรายการ</div></div>
                        <div><div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px">สิทธิ์ที่มีผลรวม (Effective)</div><div style="font-size:11px;color:#64748b;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px;word-break:break-all">${effectiveText}</div></div>
                        <div>
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                                <div style="font-size:11px;font-weight:700;color:#64748b">Why User Has This Permission</div>
                                <button type="button" id="permission-trace-refresh" class="ptc-btn-ghost ptc-btn-sm" style="font-size:11px">รีเฟรช Trace</button>
                            </div>
                            <div id="permission-trace-panel" style="display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto;border:1px solid #e2e8f0;border-radius:8px;padding:8px;background:#f8fafc"></div>
                        </div>
                        <div style="display:flex;justify-content:flex-end"><button id="btn-save-permissions" class="ptc-btn-primary">บันทึกการเปลี่ยนแปลง</button></div>
                    </div>`;
                    const tracePanel = gid('permission-trace-panel');
                    const traceRefreshBtn = gid('permission-trace-refresh');
                    const selectedRoleEl = gid('permission-role-select');
                    const selectedBaseRoleEl = gid('permission-base-role-select');

                    const collectSelectedRoleIds = () => {
                        if (!selectedRoleEl || !selectedRoleEl.options) return [];
                        return Array.from(selectedRoleEl.options)
                            .filter(o => o.selected && o.value)
                            .map(o => parseInt(o.value, 10))
                            .filter(v => v > 0);
                    };
                    const permissionSetFromSelectedRoles = (selectedRoleIdsNow) => {
                        const set = new Set();
                        roles.forEach(r => {
                            const rid = parseInt(r.id, 10);
                            if (!selectedRoleIdsNow.includes(rid)) return;
                            const perms = Array.isArray(r.permissions) ? r.permissions : [];
                            perms.forEach(p => { if (p && p !== '*') set.add(String(p)); });
                        });
                        return set;
                    };

                    const preferredRoleIdsForBaseRole = (baseRoleNow) => {
                        const normalized = String(baseRoleNow || 'user').trim().toLowerCase();
                        const byName = (regex, excludeRegex = null) => roles
                            .filter(r => regex.test(String(r.name || '')) && (!excludeRegex || !excludeRegex.test(String(r.name || ''))))
                            .map(r => parseInt(r.id, 10))
                            .filter(v => v > 0);
                        const byPerm = (key) => roles
                            .filter(r => Array.isArray(r.permissions) && r.permissions.includes(key))
                            .map(r => parseInt(r.id, 10))
                            .filter(v => v > 0);
                        if (normalized === 'admin') {
                            const m = byPerm('admin.manage_permissions');
                            if (m.length) return m;
                            const fallback = byName(/admin|permission/i);
                            return fallback;
                        }
                        if (normalized === 'staff') {
                            const m = byName(/staff|support|manager|operator/i, /admin/i);
                            if (m.length) return m;
                            const fallback = byPerm('admin.access_admin').filter(id => {
                                const row = roles.find(r => parseInt(r.id, 10) === id);
                                return row ? !(String(row.name || '').match(/admin/i)) : true;
                            });
                            return fallback.slice(0, 1);
                        }
                        const m = byName(/user|viewer|basic/i, /admin|staff|support|manager/i);
                        if (m.length) return m;
                        return [];
                    };

                    const applyHardRoleLinking = () => {
                        const baseNow = String(selectedBaseRoleEl?.value || 'user').trim().toLowerCase();
                        const targetRoleIds = preferredRoleIdsForBaseRole(baseNow);
                        if (selectedRoleEl && selectedRoleEl.options) {
                            Array.from(selectedRoleEl.options).forEach(opt => {
                                const rid = parseInt(opt.value || '0', 10);
                                opt.selected = targetRoleIds.includes(rid);
                            });
                        }
                        const rolePerms = permissionSetFromSelectedRoles(targetRoleIds);
                        permissionCheckboxEls.forEach(cb => {
                            if (baseNow === 'admin') {
                                cb.checked = true;
                                return;
                            }
                            cb.checked = rolePerms.has(String(cb.value || ''));
                        });
                        Toast.fire({ icon: 'info', title: 'Sync สิทธิ์ตาม Base Role แล้ว' });
                        renderTracePreview();
                    };

                    const renderTracePreview = () => {
                        const selectedRoleIdsNow = collectSelectedRoleIds();
                        const selectedBaseRoleNow = String(selectedBaseRoleEl?.value || baseRole || 'user').trim();
                        const traceRows = buildPermissionTraceRows({
                            baseRole: selectedBaseRoleNow,
                            selectedRoleIds: selectedRoleIdsNow,
                            checkedPerms: [],
                            customPermissions: [],
                            allRoles: roles
                        });
                        renderPermissionTracePanel(tracePanel, traceRows);
                    };

                    traceRefreshBtn?.addEventListener('click', renderTracePreview);
                    selectedRoleEl?.addEventListener('change', renderTracePreview);
                    selectedBaseRoleEl?.addEventListener('change', applyHardRoleLinking);
                    renderTracePreview();
                    const saveBtn = gid('btn-save-permissions');
                    if (saveBtn) {
                        saveBtn.addEventListener('click', async () => {
                            const sel = gid('permission-role-select');
                            let selectedRoles = [];
                            if (sel&&sel.options) selectedRoles = Array.from(sel.options).filter(o=>o.selected&&o.value).map(o=>parseInt(o.value,10)).filter(v=>v>0);
                            const baseRoleSel = gid('permission-base-role-select');
                            const selectedBaseRole = String(baseRoleSel?.value || baseRole || 'user').trim();
                            const fd = new FormData();
                            fd.append('action','update_user_permissions'); fd.append('user_id',userId);
                            fd.append('base_role', selectedBaseRole);
                            fd.append('role_ids',JSON.stringify(selectedRoles)); fd.append('permissions',JSON.stringify([]));
                            saveBtn.disabled=true; saveBtn.textContent='กำลังบันทึก...';
                            try {
                                const resSave = await fetch(apiPath,{method:'POST',body:fd}); const js = await resSave.json();
                                if (js.status==='success') Toast.fire({icon:'success',title:'บันทึกสิทธิ์สำเร็จ'});
                                else Toast.fire({icon:'error',title:js.message||'บันทึกไม่สำเร็จ'});
                            } catch(e) { Toast.fire({icon:'error',title:'เกิดข้อผิดพลาดขณะบันทึก'}); }
                            finally { saveBtn.disabled=false; saveBtn.textContent='บันทึกการเปลี่ยนแปลง'; }
                        });
                    }
                });
            });
            const pendingUser = String(window.pendingPermissionUserId || '').trim();
            if (pendingUser) {
                const targetNode = Array.from(listEl.querySelectorAll('[data-user-id]')).find(el => String(el.getAttribute('data-user-id') || '') === pendingUser);
                window.pendingPermissionUserId = '';
                if (targetNode) {
                    targetNode.click();
                }
            }
        }
    }

    // ระดับในผังองค์กร — ต้องตรงกับ ORG_LEVELS ใน includes/job_position_levels.php
    const JP_LEVEL_LABEL = { 1:'ผู้บริหาร', 2:'ผู้จัดการ', 3:'หัวหน้างาน', 4:'วิศวกร / ผู้ชำนาญ', 5:'พนักงาน' };
    const JP_LEVEL_COLOR = { 1:'#d97706', 2:'#7c3aed', 3:'#2563eb', 4:'#0891b2', 5:'#64748b' };
    async function renderJobPositionsContent(container) {
        if (!container) return;
        container.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:200px;color:#94a3b8"><i class="fa fa-circle-notch fa-spin" style="margin-right:6px"></i> Loading...</div>`;
        try {
            const res = await fetch(`${apiPath}?action=get_job_positions_admin&v=${Date.now()}`, { cache: 'no-store' });
            const json = await res.json();
            const rows = (json&&json.status==='success'&&Array.isArray(json.positions))?json.positions:[];
            const term = (gid('search-input')?.value||'').toLowerCase();
            const filtered = rows.filter(r=>String(r.name||'').toLowerCase().includes(term));

            container.innerHTML = `
            <div style="padding:20px">
                <!-- add new -->
                <div style="display:flex;gap:8px;margin-bottom:20px;align-items:center">
                    <input id="jp-add-name" type="text" class="ptc-input" placeholder="ชื่อตำแหน่งใหม่..." style="flex:1">
                    <button id="jp-add-btn" class="ptc-btn-primary" style="white-space:nowrap;display:flex;align-items:center;gap:6px">
                        <i class="fa fa-plus"></i>เพิ่ม
                    </button>
                </div>
                <!-- header hint -->
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                    <span style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;gap:5px">
                        <i class="fa fa-grip-vertical"></i>ลาก-วางเพื่อเรียงลำดับ · เลือก "ระดับ" เพื่อจัดชั้นในผังองค์กร
                    </span>
                    <button id="jp-save-order-btn" style="padding:5px 14px;border-radius:7px;background:#10b981;color:#fff;border:none;font-size:11px;font-weight:700;cursor:pointer;opacity:.35;pointer-events:none;transition:opacity .15s;display:flex;align-items:center;gap:5px">
                        <i class="fa fa-check"></i>บันทึกลำดับ
                    </button>
                </div>
                <!-- list -->
                <div id="jp-list" style="display:flex;flex-direction:column;gap:5px">
                    ${filtered.length ? filtered.map((r,idx) => `
                    <div data-jp-id="${r.id}" draggable="true"
                        style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--ptc-border,#e2e8f0);border-radius:8px;background:var(--ptc-surface,#fff);transition:border-color .12s">
                        <i class="fa fa-grip-vertical" style="color:#d1d5db;cursor:grab;font-size:13px;flex-shrink:0;padding:0 2px" title="ลากเพื่อเรียง"></i>
                        <input data-jp-name="${r.id}" type="text" value="${escapeHtml(r.name||'')}"
                            style="flex:1;border:1px solid transparent;border-radius:6px;outline:none;font-size:13px;font-family:inherit;background:transparent;color:var(--ptc-text,#0f172a);min-width:0;padding:3px 6px;transition:border-color .12s"
                            onfocus="this.style.borderColor='#2563eb';this.style.background='#f8fafc'"
                            onblur="this.style.borderColor='transparent';this.style.background='transparent'">
                        <select data-jp-level="${r.id}" title="ระดับในผังองค์กร (Contact List) — เปลี่ยนแล้วบันทึกทันที"
                            style="flex-shrink:0;width:160px;height:28px;padding:0 6px;border:1px solid var(--ptc-border,#e2e8f0);border-left:3px solid ${JP_LEVEL_COLOR[r.org_level]||'#94a3b8'};border-radius:6px;background:var(--ptc-surface,#fff);color:var(--ptc-text,#0f172a);font-size:12px;font-family:inherit;cursor:pointer">
                            ${Object.entries(JP_LEVEL_LABEL).map(([k,v])=>`<option value="${k}" ${String(r.org_level)===k?'selected':''}>${v}${String(r.org_level)===k&&!Number(r.org_level_set)?' (อัตโนมัติ)':''}</option>`).join('')}
                        </select>
                        <label style="display:flex;align-items:center;gap:4px;flex-shrink:0;cursor:pointer;padding:0 4px">
                            <input data-jp-active="${r.id}" type="checkbox" ${parseInt(r.is_active||0)===1?'checked':''} style="accent-color:#2563eb;width:14px;height:14px;cursor:pointer">
                            <span style="font-size:11px;color:#94a3b8;white-space:nowrap">Active</span>
                        </label>
                        <button data-jp-save="${r.id}"
                            style="padding:4px 10px;border-radius:6px;background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;white-space:nowrap">บันทึก</button>
                        <button data-jp-delete="${r.id}"
                            style="padding:4px 8px;border-radius:6px;background:transparent;color:#cbd5e1;border:1px solid #e2e8f0;font-size:11px;cursor:pointer;flex-shrink:0;transition:all .12s"
                            onmouseenter="this.style.background='#fee2e2';this.style.color='#b91c1c';this.style.borderColor='#fecaca'"
                            onmouseleave="this.style.background='transparent';this.style.color='#cbd5e1';this.style.borderColor='#e2e8f0'"
                            title="ลบ"><i class="fa fa-trash"></i></button>
                    </div>`).join('') : `<div style="padding:40px;text-align:center;color:#94a3b8;font-size:13px">ยังไม่มีตำแหน่ง — เพิ่มด้านบนได้เลย</div>`}
                </div>
            </div>`;

            const listEl = container.querySelector('#jp-list');
            const saveOrderBtn = container.querySelector('#jp-save-order-btn');
            let orderDirty = false;
            const setOrderDirty = v => {
                orderDirty = v;
                if (!saveOrderBtn) return;
                saveOrderBtn.style.opacity = v ? '1' : '.35';
                saveOrderBtn.style.pointerEvents = v ? 'auto' : 'none';
            };

            // drag-and-drop
            let dragSrc = null;
            listEl?.querySelectorAll('[data-jp-id]').forEach(row => {
                row.addEventListener('dragstart', e => {
                    dragSrc = row; row.style.opacity = '.4';
                    e.dataTransfer.effectAllowed = 'move';
                });
                row.addEventListener('dragend', () => { row.style.opacity='1'; dragSrc=null; });
                row.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; });
                row.addEventListener('dragenter', e => { e.preventDefault(); if(row!==dragSrc) row.style.borderColor='#2563eb'; });
                row.addEventListener('dragleave', () => { if(row!==dragSrc) row.style.borderColor=''; });
                row.addEventListener('drop', e => {
                    e.preventDefault(); row.style.borderColor='';
                    if (!dragSrc||dragSrc===row) return;
                    const items=[...listEl.querySelectorAll('[data-jp-id]')];
                    const si=items.indexOf(dragSrc), ti=items.indexOf(row);
                    if(si<ti) listEl.insertBefore(dragSrc, row.nextSibling);
                    else listEl.insertBefore(dragSrc, row);
                    setOrderDirty(true);
                });

                // ระดับในผังองค์กร — บันทึกทันทีที่เปลี่ยน (ส่งแค่ org_level ไม่แตะลำดับ/ชื่อ)
                row.querySelector('[data-jp-level]')?.addEventListener('change', async (ev) => {
                    const id = row.getAttribute('data-jp-id');
                    const sel = ev.target;
                    const fd=new FormData();
                    fd.append('action','update_job_position'); fd.append('id',id); fd.append('org_level',sel.value);
                    try {
                        const rs=await fetch(apiPath,{method:'POST',body:fd}); const js=await rs.json();
                        if(js.status!=='success') throw new Error(js.message||'Error');
                        sel.style.borderLeftColor = JP_LEVEL_COLOR[sel.value]||'#94a3b8';
                        [...sel.options].forEach(o=>{ o.textContent = JP_LEVEL_LABEL[o.value]; });
                        Toast.fire({icon:'success',title:'ตั้งระดับแล้ว: '+JP_LEVEL_LABEL[sel.value]});
                    } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                });

                // save row
                row.querySelector('[data-jp-save]')?.addEventListener('click', async () => {
                    const id = row.getAttribute('data-jp-id');
                    const name = String(row.querySelector(`[data-jp-name="${id}"]`)?.value||'').trim();
                    const active = row.querySelector(`[data-jp-active="${id}"]`)?.checked?'1':'0';
                    const curOrder = filtered.find(r=>String(r.id)===id)?.sort_order??999;
                    if (!name) return;
                    const fd=new FormData();
                    fd.append('action','update_job_position'); fd.append('id',id);
                    fd.append('name',name); fd.append('sort_order',String(curOrder)); fd.append('is_active',active);
                    try {
                        const rs=await fetch(apiPath,{method:'POST',body:fd}); const js=await rs.json();
                        if(js.status!=='success') throw new Error(js.message||'Error');
                        await loadJobPositions();
                        const btn=row.querySelector('[data-jp-save]');
                        if(btn){btn.textContent='✓ บันทึกแล้ว';btn.style.background='#d1fae5';btn.style.color='#065f46';btn.style.borderColor='#6ee7b7';
                            setTimeout(()=>{btn.textContent='บันทึก';btn.style.background='#eff6ff';btn.style.color='#1d4ed8';btn.style.borderColor='#bfdbfe';},1500);}
                    } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                });

                // delete row
                row.querySelector('[data-jp-delete]')?.addEventListener('click', async () => {
                    const id = row.getAttribute('data-jp-id');
                    const name = String(row.querySelector(`[data-jp-name="${id}"]`)?.value||'').trim();
                    const ok=await Swal.fire({title:'ลบตำแหน่ง?',text:`"${name}"`,icon:'warning',showCancelButton:true,confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#dc2626'});
                    if(!ok.isConfirmed) return;
                    const fd=new FormData();
                    fd.append('action','update_job_position'); fd.append('id',id);
                    fd.append('name',name); fd.append('sort_order','999'); fd.append('is_active','0');
                    try {
                        const rs=await fetch(apiPath,{method:'POST',body:fd}); const js=await rs.json();
                        if(js.status!=='success') throw new Error(js.message||'Error');
                        await loadJobPositions(); await renderJobPositionsContent(container);
                        Toast.fire({icon:'success',title:'ลบแล้ว'});
                    } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                });
            });

            // save order
            saveOrderBtn?.addEventListener('click', async () => {
                const items=[...listEl.querySelectorAll('[data-jp-id]')];
                try {
                    await Promise.all(items.map((row,idx)=>{
                        const id=row.getAttribute('data-jp-id');
                        const name=String(row.querySelector(`[data-jp-name="${id}"]`)?.value||'').trim();
                        const active=row.querySelector(`[data-jp-active="${id}"]`)?.checked?'1':'0';
                        const fd=new FormData();
                        fd.append('action','update_job_position'); fd.append('id',id);
                        fd.append('name',name); fd.append('sort_order',String(idx+1)); fd.append('is_active',active);
                        return fetch(apiPath,{method:'POST',body:fd});
                    }));
                    await loadJobPositions(); setOrderDirty(false);
                    Toast.fire({icon:'success',title:'บันทึกลำดับแล้ว'});
                } catch(e) { Toast.fire({icon:'error',title:e.message}); }
            });

            // add new — Enter key support
            const doAdd = async () => {
                const name=String(gid('jp-add-name')?.value||'').trim();
                if(!name){gid('jp-add-name')?.focus();return;}
                const fd=new FormData(); fd.append('action','save_job_position'); fd.append('name',name);
                try {
                    const rs=await fetch(apiPath,{method:'POST',body:fd}); const js=await rs.json();
                    if(js.status!=='success') throw new Error(js.message||'Error');
                    if(gid('jp-add-name')) gid('jp-add-name').value='';
                    await loadJobPositions(); await renderJobPositionsContent(container);
                    Toast.fire({icon:'success',title:'เพิ่มตำแหน่งแล้ว'});
                } catch(e) { Toast.fire({icon:'error',title:e.message}); }
            };
            container.querySelector('#jp-add-btn')?.addEventListener('click', doAdd);
            container.querySelector('#jp-add-name')?.addEventListener('keydown', e=>{if(e.key==='Enter')doAdd();});

        } catch(e) { container.innerHTML=`<div style="padding:20px;font-size:13px;color:#ef4444">${escapeHtml(e.message||'Error')}</div>`; }
    }

    window.renderTreeView = function(items, container) {
        if (items.length === 0) {
            container.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:#94a3b8"><i class="fa fa-box-open" style="font-size:40px;opacity:.3;margin-bottom:12px"></i><p style="font-size:14px">ไม่พบข้อมูล</p></div>`;
            return;
        }
        const itemMap = new Map(items.map(item=>[item.db_id,{...item,children:[]}]));
        const rootItems = [];
        itemMap.forEach(item => {
            if (item.parent_id&&itemMap.has(item.parent_id)) itemMap.get(item.parent_id).children.push(item);
            else rootItems.push(item);
        });
        const renderNode = (item) => {
            let img = item['รูปภาพ (URL)']||(item.images&&item.images[0]);
            img = normalizeUploadUrl(img)||placeholderThumbUrl;
            const brandModel = escapeHtml([item.brand,item.model].filter(Boolean).join(' '));
            const companyAccentBg = getCompanyAccentBgClass(item.company);
            const dbId = escapeJsString(item.db_id);
            const eqId = escapeHtml(item['ID อุปกรณ์']||'-');
            const name = escapeHtml(item['ชื่ออุปกรณ์']||'-');
            let sClass = 'background:#f1f5f9;color:#475569;border:1px solid #cbd5e1';
            if (item['สถานะ']==='ใช้งานปกติ') sClass='background:#f0fdf4;color:#166534;border:1px solid #bbf7d0';
            else if (item['สถานะ']==='ถูกยืม') sClass='background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe';
            else if (item['สถานะ']==='ว่าง') sClass='background:#f0f9ff;color:#0e7490;border:1px solid #a5f3fc';
            else if (item['สถานะ']==='ส่งซ่อม') sClass='background:#fffbeb;color:#92400e;border:1px solid #fde68a';
            else if (item['สถานะ']==='ตัดจำหน่าย') sClass='background:#fef2f2;color:#991b1b;border:1px solid #fecaca';
            const hasChildIssue = item.children&&item.children.some(c=>['ส่งซ่อม','ตัดจำหน่าย','เสีย','ชำรุด'].includes(c['สถานะ']));
            const childrenHtml = item.children.length>0?`<div class="tree-container" style="margin-top:10px;display:flex;flex-direction:column;gap:10px">${item.children.map(renderNode).join('')}</div>`:'';
            return `<div class="relative ${item.parent_id?'tree-node':''}">
                <div class="section-card" style="padding:14px;cursor:pointer;border:1px solid ${hasChildIssue?'#fbbf24':'#e2e8f0'};position:relative;overflow:hidden" onclick="showAssetDetailsModal('${dbId}')">
                    <div style="position:absolute;left:0;top:0;bottom:0;width:3px" class="${companyAccentBg}"></div>
                    <div style="display:flex;align-items:center;gap:12px;padding-left:6px">
                        <div class="asset-thumb-wrapper"><img src="${img}" loading="lazy" decoding="async" onerror="handleImgError(this)" data-fallback="${placeholderThumbUrl}" class="asset-thumb" style="border-radius:6px;border:1px solid #e2e8f0"></div>
                        <div style="flex:1;min-width:0">
                            <div style="font-weight:700;font-size:13px;color:#0f172a">${name}</div>
                            <div style="font-size:11px;color:#94a3b8">${brandModel||'-'}</div>
                            <div style="font-family:monospace;font-size:11px;color:#2563eb;margin-top:3px">${eqId}</div>
                        </div>
                        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
                            <span style="${sClass};display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700">${escapeHtml(item['สถานะ']||'-')}</span>
                            <div style="display:flex;gap:4px">
                                <button onclick="event.stopPropagation();openQRModal('${escapeJsString(item['ID อุปกรณ์'])}','${escapeJsString(item['ชื่ออุปกรณ์'])}','${dbId}')" class="ptc-btn-ghost ptc-btn-sm" title="QR"><i class="fa fa-qrcode"></i></button>
                                <button onclick="event.stopPropagation();editItem('${dbId}')" class="ptc-btn-ghost ptc-btn-sm" style="color:#2563eb" title="Edit"><i class="fa fa-edit"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                ${childrenHtml}
            </div>`;
        };
        container.innerHTML = `<div style="padding:12px;display:flex;flex-direction:column;gap:12px">${rootItems.map(renderNode).join('')}</div>`;
    }

    function buildAssetParentOptionsHtml(item) {
        const selfId = item.db_id;
        const company = String(item.company || '').trim();
        const pool = (data.it_assets || []).filter(a => a.db_id != selfId && !a.parent_id);
        const scoped = company ? pool.filter(a => String(a.company || '').trim() === company) : pool;
        return (scoped.length ? scoped : pool).slice(0, 120).map(a =>
            `<option value="${a.db_id}" ${item.parent_id==a.db_id?'selected':''}>${escapeHtml(a['ID อุปกรณ์']||'')} - ${escapeHtml(a['ชื่ออุปกรณ์']||'')}</option>`
        ).join('');
    }

    function addAssignmentRow(assignment = {}) {
        const container = document.getElementById('assignmentsContainer');
        if (!container) return;
        const assignmentId = 'assignment-radio-' + Date.now();
        const isChecked = assignment.is_primary == 1 ? 'checked' : '';
        const deptOptions = data.departments.map(d=>`<option value="${d.dept_name}">${d.dept_name}</option>`).join('');
        const newRow = document.createElement('div');
        newRow.className = 'grid grid-cols-12 gap-3 items-center p-2 bg-slate-50 dark:bg-slate-700/50 rounded-lg assignment-row border border-slate-200 dark:border-slate-600';
        newRow.innerHTML = `<div class="col-span-12 sm:col-span-3"><select class="assignment-company w-full border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-md py-2 px-3 text-sm"><option value="PTA">PTA</option><option value="PT4">PT4</option><option value="PTE">PTE</option></select></div><div class="col-span-12 sm:col-span-3"><select class="assignment-department w-full border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-md py-2 px-3 text-sm"><option value="">เลือกแผนก</option>${deptOptions}</select></div><div class="col-span-12 sm:col-span-4"><input type="email" class="assignment-email w-full border border-gray-300 dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-md py-2 px-3 text-sm" placeholder="อีเมล" value="${assignment.email||''}"></div><div class="col-span-6 sm:col-span-1 text-center"><input type="radio" id="${assignmentId}" name="is_primary_assignment" class="assignment-primary h-5 w-5 text-blue-600" ${isChecked}><label for="${assignmentId}" class="text-sm ml-1 dark:text-slate-300">หลัก</label></div><div class="col-span-6 sm:col-span-1 text-right"><button type="button" class="text-red-500 hover:text-red-700 remove-assignment-btn"><i class="fas fa-trash-alt"></i></button></div>`;
        if (assignment.company) newRow.querySelector('.assignment-company').value = assignment.company;
        if (assignment.department) newRow.querySelector('.assignment-department').value = assignment.department;
        container.appendChild(newRow);
        newRow.querySelector('.remove-assignment-btn').addEventListener('click', () => newRow.remove());
    }

    window.addAccessory = function() {
        const input = gid('accessory-input'); const value = input.value.trim();
        if (value && !currentAccessories.includes(value)) { currentAccessories.push(value); renderAccessories(); input.value = ''; input.focus(); }
    }
    window.removeAccessory = function(index) { currentAccessories.splice(index, 1); renderAccessories(); }
    window.removeAssetImage = function(index) {
        const input = document.getElementById('existing-images-input');
        if (!input) return;
        let images = JSON.parse(input.value); images.splice(index, 1); input.value = JSON.stringify(images);

    async function loadEmpPermContent(userId, contentEl) {
        try {
            const [roles, detail] = await Promise.all([loadPermissionRoles(), loadUserPermissionDetail(userId)]);
            if (!detail || detail.status !== 'success') {
                contentEl.innerHTML = '<span style="color:#ef4444">โหลดข้อมูลสิทธิ์ไม่สำเร็จ</span>';
                return;
            }
            const user = detail.user || {};
            const assignedRoleIds = Array.isArray(detail.assigned_role_ids) ? detail.assigned_role_ids : [];
            const baseRole = user.base_role || 'user';
            const isAdmin = baseRole === 'admin';

            const roleChips = roles.map(r => {
                const active = assignedRoleIds.includes(parseInt(r.id, 10));
                return `<label style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid ${active?'#2563eb':'#e2e8f0'};background:${active?'#eff6ff':'#f8fafc'};color:${active?'#1d4ed8':'#475569'};font-size:12px;font-weight:${active?'600':'400'};cursor:pointer;transition:all .15s">
                    <input type="checkbox" class="emp-perm-role-cb" value="${r.id}" ${active?'checked':''} style="display:none">
                    ${active?'<i class="fa fa-check" style="font-size:10px"></i>':''}<span>${escapeHtml(r.name)}</span>
                </label>`;
            }).join('');

            contentEl.innerHTML = `
                <div style="margin-bottom:10px">
                    <div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:6px">Base Role</div>
                    <div style="display:flex;gap:6px">
                        <label style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;border:1px solid ${baseRole==='admin'?'#f59e0b':'#e2e8f0'};background:${baseRole==='admin'?'#fef9c3':'#f8fafc'};color:${baseRole==='admin'?'#92400e':'#475569'};font-size:12px;cursor:pointer">
                            <input type="radio" name="emp-base-role" value="admin" ${baseRole==='admin'?'checked':''} style="width:13px;height:13px"> Admin
                        </label>
                        <label style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;border:1px solid ${baseRole==='staff'?'#2563eb':'#e2e8f0'};background:${baseRole==='staff'?'#eff6ff':'#f8fafc'};color:${baseRole==='staff'?'#1e40af':'#475569'};font-size:12px;cursor:pointer">
                            <input type="radio" name="emp-base-role" value="staff" ${baseRole==='staff'?'checked':''} style="width:13px;height:13px"> Staff
                        </label>
                        <label style="display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;border:1px solid ${baseRole==='user'?'#6366f1':'#e2e8f0'};background:${baseRole==='user'?'#eef2ff':'#f8fafc'};color:${baseRole==='user'?'#4338ca':'#475569'};font-size:12px;cursor:pointer">
                            <input type="radio" name="emp-base-role" value="user" ${(!baseRole||baseRole==='user')?'checked':''} style="width:13px;height:13px"> User
                        </label>
                    </div>
                </div>
                ${roles.length ? `<div style="font-size:11px;font-weight:700;color:#64748b;margin-bottom:6px">Permission Roles</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${roleChips}</div>` : ''}
                <div style="display:flex;justify-content:flex-end">
                    <button type="button" id="emp-perm-save-btn" style="padding:5px 14px;border-radius:7px;background:#2563eb;color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer">
                        <i class="fa fa-save" style="margin-right:4px"></i>บันทึกสิทธิ์
                    </button>
                </div>`;

            contentEl.querySelectorAll('.emp-perm-role-cb').forEach(cb => {
                cb.closest('label').addEventListener('click', function() {
                    cb.checked = !cb.checked;
                    const lbl = cb.closest('label');
                    const on = cb.checked;
                    lbl.style.border = `1px solid ${on?'#2563eb':'#e2e8f0'}`;
                    lbl.style.background = on?'#eff6ff':'#f8fafc';
                    lbl.style.color = on?'#1d4ed8':'#475569';
                    lbl.style.fontWeight = on?'600':'400';
                    const icon = lbl.querySelector('i');
                    if (on) { if (!icon) { const i=document.createElement('i'); i.className='fa fa-check'; i.style.fontSize='10px'; lbl.insertBefore(i, lbl.querySelector('span')); } }
                    else { if (icon) icon.remove(); }
                });
            });

            const saveBtn = gid('emp-perm-save-btn');
            if (saveBtn) {
                saveBtn.addEventListener('click', async () => {
                    const selectedRoles = Array.from(contentEl.querySelectorAll('.emp-perm-role-cb:checked')).map(cb => parseInt(cb.value, 10)).filter(v => v > 0);
                    const selectedBase = (contentEl.querySelector('input[name="emp-base-role"]:checked') || {}).value || 'user';
                    saveBtn.disabled = true; saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin" style="margin-right:4px"></i>กำลังบันทึก...';
                    try {
                        const fd = new FormData();
                        fd.append('action', 'update_user_permissions');
                        fd.append('user_id', userId);
                        fd.append('base_role', selectedBase);
                        fd.append('role_ids', JSON.stringify(selectedRoles));
                        fd.append('permissions', JSON.stringify([]));
                        const res = await (await fetch(apiPath, { method: 'POST', body: fd })).json();
                        if (res.status === 'success') {
                            Toast.fire({ icon: 'success', title: 'บันทึกสิทธิ์สำเร็จ' });
                            window._modalDirty = false;
                        } else {
                            Toast.fire({ icon: 'error', title: res.message || 'บันทึกไม่สำเร็จ' });
                        }
                    } catch { Toast.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด' }); }
                    finally { saveBtn.disabled = false; saveBtn.innerHTML = '<i class="fa fa-save" style="margin-right:4px"></i>บันทึกสิทธิ์'; }
                });
            }
        } catch { contentEl.innerHTML = '<span style="color:#ef4444">โหลดข้อมูลสิทธิ์ไม่สำเร็จ</span>'; }
    }

            const sm = j.summary || {};
            const age = sm.since ? (Date.now() - new Date(String(sm.since).replace(' ', 'T'))) / (365.25 * 86400000) : null;
            const ageTxt = age === null ? '-' : age < 1 ? `${Math.max(1, Math.round(age * 12))} เดือน` : `${age.toFixed(1)} ปี`;

                else _ppEvents.push({ ...e });
            });
            renderAssetPassport('all');

            tl.innerHTML = `<div class="ad-muted" style="padding:10px;color:var(--ptc-danger)">${escapeHtml(e.message)}</div>`;

    function renderAssetPassport(filter) {
        const tl = gid('pp-timeline');
        if (!tl) return;
        document.querySelectorAll('#pp-filter [data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
        const FIELD_TH = { serial_number: 'S/N', hostname: 'ชื่อเครื่อง', ip_address: 'IP', mac_address: 'MAC', custodian: 'ผู้ถือครอง', company: 'บริษัท', status: 'สถานะ', location: 'สถานที่' };
        const rows = _ppEvents.filter(e => filter === 'all' || (PP_EV[e.type] || [, , , 'data'])[3] === filter);
        if (!rows.length) { tl.innerHTML = '<div class="ad-muted" style="padding:10px">ไม่มีรายการ</div>'; return; }
        tl.innerHTML = rows.map(e => {
            const ev = PP_EV[e.type] || ['fa-clock-rotate-left', e.type, '#64748b'];
            let d = String(e.detail || '');
            if (e.type === 'NOTE') { try { d = JSON.parse(d).text || ''; } catch (_) {} }
            d = escapeHtml(d.replace(/^Sync จาก Setup:\s*/i, '')).replace(/\b([a-z]+(?:_[a-z]+)+|hostname|company|status|location|custodian)\b/g, m => FIELD_TH[m] || m);
            const when = e.at ? new Date(String(e.at).replace(' ', 'T')).toLocaleString('th-TH', String(e.at).length > 10 ? { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' } : { day: 'numeric', month: 'short', year: '2-digit' }) : '';
            const title = e.title || ev[1];
            return `<div class="pp-item"><div class="pp-dot" style="color:${ev[2]};border-color:${ev[2]}"><i class="fa ${ev[0]}"></i></div>
                <div class="pp-body"><div class="pp-t">${escapeHtml(title)}${e.n > 1 ? ` <span class="pp-n">×${e.n}</span>` : ''}${e.status ? ` <span class="pp-st">${escapeHtml(e.status)}</span>` : ''}</div>
                ${d ? `<div class="pp-d">${d}</div>` : ''}<div class="pp-m">${escapeHtml(when)}${e.by ? ' · ' + escapeHtml(e.by) : ''}</div></div></div>`;
        }).join('');
    }

    window.handleFormSubmit = async function(e) {
        e.preventDefault();
        const fd = new FormData(e.target);
        let finalFd = new FormData();
        if (activeTab === 'it_assets') {
            const assetErr = validateAssetRegistryForm(fd);
            if (assetErr) {
                window._afShowErrors = true;
                updateAssetRequiredMarkers();
                Swal.fire('แจ้งเตือน', assetErr, 'warning');
                return;
            }
            finalFd = fd;
            finalFd.append('action','save_equipment');
        }
        else if (activeTab === 'employees') {
            finalFd = fd;
            if (String(fd.get('position')||'') === '__custom__') {
                const customVal = String(document.getElementById('form-position-custom')?.value||'').trim();
                if (!customVal) { Swal.fire('แจ้งเตือน','กรุณาพิมพ์ชื่อตำแหน่ง','warning'); return; }
                finalFd.set('position', customVal);
            }
            finalFd.append('action', isEditing?'update_employee':'add_employee');
            if (!fd.has('is_executive')) finalFd.append('is_executive','0');
            if (!fd.has('is_management')) finalFd.append('is_management','0');
            if (!fd.has('is_technician')) finalFd.append('is_technician','0');
            // Permissions (role/stock access) are managed only in Permissions tab.
            finalFd.delete('role');
            finalFd.delete('can_manage_stock');
            const manageSystemUser = String(fd.get('manage_system_user')||'0') === '1';
            finalFd.set('manage_system_user', manageSystemUser ? '1' : '0');
            if (!manageSystemUser) {
                finalFd.delete('username');
                finalFd.delete('password');
                finalFd.delete('responsible_department');
            }
            const isExecutiveFlag = String(fd.get('is_executive')||'')==='1';
            const isManagementFlag = String(fd.get('is_management')||'')==='1';
            const isTechnicianFlag = String(fd.get('is_technician')||'')==='1';
            const allowEmptyAssignments = isExecutiveFlag||isManagementFlag;
            if (manageSystemUser) {
                const username = String(fd.get('username') || '').trim();
                const password = String(fd.get('password') || '').trim();
                if (!username) { Swal.fire('แจ้งเตือน','กรุณากรอก Username สำหรับบัญชีผู้ใช้ระบบ','warning'); return; }
                if (!isEditing && !password) { Swal.fire('แจ้งเตือน','กรุณากรอก Password สำหรับบัญชีผู้ใช้ระบบ','warning'); return; }
            }
            const assignmentsRaw = Array.from(document.querySelectorAll('.assignment-row')).map(row=>({company:(row.querySelector('.assignment-company')?.value||'').trim(),department:(row.querySelector('.assignment-department')?.value||'').trim(),email:(row.querySelector('.assignment-email')?.value||'').trim(),is_primary:row.querySelector('.assignment-primary')?.checked?1:0}));
            const errors = [];
            const assignments = assignmentsRaw.filter(a=>{if(!a.company&&!a.department&&!a.email)return false;if(!a.company){errors.push('ทุกสังกัดต้องระบุบริษัท');return false;}if(!a.department&&!allowEmptyAssignments){errors.push('ทุกสังกัดต้องระบุแผนก');return false;}return true;});
            if (!assignments.length&&!allowEmptyAssignments) errors.push('กรุณาระบุอย่างน้อย 1 สังกัด');
            if (!assignments.length&&isTechnicianFlag) errors.push('ทีมช่างต้องมีอย่างน้อย 1 สังกัด');
            if (assignments.length) { let pc=assignments.reduce((s,a)=>s+(a.is_primary?1:0),0); if(pc===0){assignments[0].is_primary=1;pc=1;} if(pc>1)errors.push('เลือกสังกัดหลักได้เพียง 1 รายการ'); }
            if (errors.length) { Swal.fire('แจ้งเตือน',errors[0],'warning'); return; }
            finalFd.append('assignments', JSON.stringify(assignments));
        }
        else if (activeTab === 'locations') {
            const name=(fd.get('name')||'').trim();
            if (!name) { Swal.fire('Error','ชื่อสถานที่ไม่สามารถเว้นว่างได้','error'); return; }
            finalFd = fd; finalFd.append('action','save_location');
        }
        else if (activeTab === 'server_check') {
            const code=(fd.get('code')||'').trim();
            const name=(fd.get('name')||'').trim();
            if (!code) { Swal.fire('Error','กรุณากรอกรหัสห้อง','error'); return; }
            if (!name) { Swal.fire('Error','กรุณากรอกชื่อห้อง','error'); return; }
            finalFd = fd; finalFd.append('action','save_room');
        }
        else {
            let obj = {}; fd.forEach((v,k)=>obj[k]=v);
            if (activeTab==='kb_articles') { obj.is_published=obj.is_published?1:0; }
            if (activeTab==='announcements') { if(fd.get('no_expire')==='1'){obj.expirationDate='';} else{obj.expirationDate=String(obj.expirationDate||'').trim();} delete obj.no_expire; }
            if (activeTab==='services') {
                try {
                    const primaryUrl = normalizeServiceUrlInput(obj.url_primary, true);
                    const backupUrl = normalizeServiceUrlInput(obj.url_fallback, false);
                    if (backupUrl && backupUrl === primaryUrl) {
                        Swal.fire('แจ้งเตือน', 'Backup URL ต้องไม่ซ้ำกับ Primary URL', 'warning');
                        return;
                    }
                    obj.url_primary = primaryUrl;
                    obj.url_fallback = backupUrl;
                    obj.is_active = String(obj.is_active ?? '1') === '0' ? 0 : 1;
                } catch (urlErr) {
                    Swal.fire('แจ้งเตือน', urlErr.message || 'URL ไม่ถูกต้อง', 'warning');
                    return;
                }
            }
            finalFd.append('action',isEditing?'update_item':'add_item'); finalFd.append('key',activeTab); finalFd.append('data',JSON.stringify(obj));
        }
        const _saveBtn = gid('modal-save-btn');
        const _saveBtnHtml = _saveBtn ? _saveBtn.innerHTML : null;
        if (_saveBtn) { _saveBtn.disabled = true; _saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังบันทึก...'; }
        try {
            if (activeTab==='employees') { const posName=String(finalFd.get('position')||'').trim(); if(posName){const fdPos=new FormData();fdPos.append('action','save_job_position');fdPos.append('name',posName);await fetch(apiPath,{method:'POST',body:fdPos});} }
            const res = await (await fetch(apiPath,{method:'POST',body:finalFd})).json();
            if(res.status==='success') {
                const _isNewEmp = (activeTab==='employees' && !isEditing);
                const _newEmpId = _isNewEmp ? String(finalFd.get('id')||'').trim() : '';
                const _hasSysUser = _isNewEmp && finalFd.get('manage_system_user')==='1';
                if (!_hasSysUser) Toast.fire({icon:'success',title:'Saved!'});
                window._modalDirty=false; closeModal(); await loadAllData(); renderContent();
                if (_isNewEmp && _hasSysUser && _newEmpId) {
                    const _name = escapeHtml(String(finalFd.get('name_th')||finalFd.get('name')||_newEmpId));
                    Swal.fire({
                        title: 'เพิ่มพนักงานสำเร็จ',
                        html: `<div style="font-size:13px;color:#475569;line-height:1.9">ต้องการกำหนดสิทธิ์ระบบให้<br><b>${_name}</b><br>ตอนนี้เลยหรือไม่?</div>`,
                        icon: 'success',
                        showCancelButton: true,
                        confirmButtonText: '<i class="fa fa-key" style="margin-right:5px"></i>กำหนดสิทธิ์เลย',
                        cancelButtonText: 'ข้ามก่อน',
                        confirmButtonColor: '#2563eb',
                    }).then(r => {
                        if (r.isConfirmed) {
                            window.pendingPermissionUserId = _newEmpId;
                            switchTab('permissions');
                        }
                    });
                }
            }
            else throw new Error(res.message);
        } catch(err) {
            if (_saveBtn && _saveBtnHtml) { _saveBtn.disabled = false; _saveBtn.innerHTML = _saveBtnHtml; }
            Swal.fire('Error', err.message, 'error');
        }
    }

    function findAdminItemById(tab, id) {
        const list = data[tab] || [];
        const needle = String(id ?? '').trim();
        if (!needle) return undefined;
        return list.find(i => {
            const candidates = [i.id, i.db_id, i.cat_id, i.dept_id, i.date];
            return candidates.some(v => String(v ?? '').trim() === needle);
        });
    }

        else if (activeTab === 'locations' || activeTab === 'holidays' || activeTab === 'server_check') realId = item.id;

        const fd = new FormData();
        fd.append('action', activeTab === 'locations' ? 'delete_location' : (activeTab === 'server_check' ? 'delete_room' : 'delete_item'));
        fd.append('key', activeTab);
        fd.append('id', realId);
        if (activeTab === 'services' && !serviceIdIsValid(realId)) {
            fd.append('fallback_url', String(item.url_primary || '').trim());
            fd.append('fallback_title', String(item.title || '').trim());
        }
        try {
            const res = await fetch(apiPath, { method: 'POST', body: fd });
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || 'Delete failed');
            await loadAllData();
            renderContent();
            Toast.fire({ icon: 'success', title: 'ลบเรียบร้อย' });
        } catch (e) {
            Swal.fire('Error', e.message || 'ลบไม่สำเร็จ', 'error');
        }
    }

    const SC_TYPE_LABELS = { status:'สถานะ (✓/✗)', backup:'Backup (✓/✗)', percent:'เปอร์เซ็นต์ (%)', days:'จำนวนวัน' };
    window.openServerCheckItemsManager = async function(roomId, roomLabel) {
        const typeOptions = (sel) => Object.entries(SC_TYPE_LABELS)
            .map(([v,l]) => `<option value="${v}" ${sel===v?'selected':''}>${l}</option>`).join('');
        const html = `
        <div style="text-align:left;font-family:inherit">
            <div style="font-size:12px;color:#64748b;margin-bottom:12px">${escapeHtml(roomLabel||'')}</div>
            <div style="display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;flex-wrap:wrap">
                <input id="scim-new-label" type="text" placeholder="ชื่อรายการตรวจใหม่..." style="flex:2;min-width:160px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none;font-family:inherit">
                <select id="scim-new-type" style="padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:inherit">${typeOptions('status')}</select>
                <input id="scim-new-threshold" type="number" min="0" placeholder="เกณฑ์ (วัน)" style="width:100px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:inherit;display:none">
                <button id="scim-add-btn" type="button" style="padding:8px 16px;border-radius:8px;background:#2563eb;color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px"><i class="fa fa-plus"></i>เพิ่ม</button>
            </div>
            <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:flex;align-items:center;gap:6px">
                <i class="fa fa-grip-vertical" style="font-size:10px"></i>ลาก-วางเพื่อเรียงลำดับ
            </div>
            <div id="scim-list" style="max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:5px"></div>
        </div>`;
        await Swal.fire({
            title: 'จัดการรายการตรวจ', html, width: 640, showConfirmButton: false, showCloseButton: true,
            didOpen: async () => {
                const listEl        = document.getElementById('scim-list');
                const addBtn        = document.getElementById('scim-add-btn');
                const newLabelEl    = document.getElementById('scim-new-label');
                const newTypeEl     = document.getElementById('scim-new-type');
                const newThreshEl   = document.getElementById('scim-new-threshold');
                let dragSrc = null;

                newTypeEl?.addEventListener('change', () => {
                    newThreshEl.style.display = newTypeEl.value === 'days' ? '' : 'none';
                });

                const saveOrder = async () => {
                    const rows = [...listEl.querySelectorAll('[data-item-id]')];
                    const order = rows.map(r => r.getAttribute('data-item-id'));
                    const fd = new FormData();
                    fd.append('action','reorder_items_sc'); fd.append('order', JSON.stringify(order));
                    try {
                        const rs = await fetch(apiPath,{method:'POST',body:fd});
                        const js = await rs.json();
                        if (js.status!=='success') throw new Error(js.message||'Error');
                    } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                };

                const render = async () => {
                    if (!listEl) return;
                    listEl.innerHTML = `<div style="font-size:12px;color:#94a3b8;padding:8px">กำลังโหลด...</div>`;
                    try {
                        const res = await fetch(`${apiPath}?action=get_items_sc&room_id=${roomId}&v=${Date.now()}`, { cache: 'no-store' });
                        const json = await res.json();
                        const rows = (json?.status === 'success' && Array.isArray(json.items)) ? json.items : [];
                        if (!rows.length) { listEl.innerHTML = `<div style="font-size:12px;color:#94a3b8;padding:8px">ยังไม่มีรายการตรวจ</div>`; return; }
                        listEl.innerHTML = rows.map(r => `
                            <div data-item-id="${r.id}" draggable="true"
                                style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:default;transition:box-shadow .12s,border-color .12s;flex-wrap:wrap">
                                <i class="fa fa-grip-vertical" style="color:#cbd5e1;cursor:grab;font-size:13px;flex-shrink:0;padding:2px 4px"></i>
                                <input data-name="${r.id}" type="text" value="${escapeHtml(r.label||'')}"
                                    style="flex:2;min-width:140px;border:1px solid transparent;outline:none;font-size:13px;font-family:inherit;background:transparent;color:#0f172a"
                                    onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='transparent'">
                                <select data-type="${r.id}" style="padding:5px 8px;border-radius:6px;border:1px solid #e2e8f0;font-size:11px;font-family:inherit">${typeOptions(r.input_type)}</select>
                                <input data-threshold="${r.id}" type="number" min="0" value="${r.threshold ?? ''}" placeholder="เกณฑ์(วัน)"
                                    style="width:90px;padding:5px 8px;border-radius:6px;border:1px solid #e2e8f0;font-size:11px;font-family:inherit;display:${r.input_type==='days'?'':'none'}">
                                <button data-save="${r.id}" type="button"
                                    style="padding:5px 10px;border-radius:6px;background:#e0f2fe;color:#0369a1;border:none;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0">บันทึก</button>
                                <button data-del="${r.id}" type="button"
                                    style="padding:5px 8px;border-radius:6px;background:#fee2e2;color:#b91c1c;border:none;font-size:11px;cursor:pointer;flex-shrink:0" title="ลบ">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>`).join('');

                        listEl.querySelectorAll('[data-item-id]').forEach(row => {
                            const id = row.getAttribute('data-item-id');
                            const typeSel = row.querySelector(`[data-type="${id}"]`);
                            const threshInp = row.querySelector(`[data-threshold="${id}"]`);
                            typeSel?.addEventListener('change', () => {
                                threshInp.style.display = typeSel.value === 'days' ? '' : 'none';
                            });

                            row.addEventListener('dragstart', e => { dragSrc = row; row.style.opacity = '.4'; e.dataTransfer.effectAllowed = 'move'; });
                            row.addEventListener('dragend', async () => { row.style.opacity = '1'; dragSrc = null; await saveOrder(); });
                            row.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
                            row.addEventListener('dragenter', e => { e.preventDefault(); if (row !== dragSrc) row.style.borderColor = '#2563eb'; });
                            row.addEventListener('dragleave', () => { row.style.borderColor = '#e2e8f0'; });
                            row.addEventListener('drop', e => {
                                e.preventDefault(); row.style.borderColor = '#e2e8f0';
                                if (!dragSrc || dragSrc === row) return;
                                const allRows = [...listEl.querySelectorAll('[data-item-id]')];
                                const srcIdx = allRows.indexOf(dragSrc);
                                const tgtIdx = allRows.indexOf(row);
                                if (srcIdx < tgtIdx) listEl.insertBefore(dragSrc, row.nextSibling);
                                else listEl.insertBefore(dragSrc, row);
                            });

                            row.querySelector('[data-save]')?.addEventListener('click', async () => {
                                const label = String(row.querySelector(`[data-name="${id}"]`)?.value||'').trim();
                                const type  = typeSel?.value || 'status';
