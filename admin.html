    function filtAssets() {
        const term = (gid('search-input').value || '').toLowerCase();
        const cat = gid('filter-category').value;
        const stat = gid('filter-status').value;
        const co = gid('filter-company').value;
        return (data.it_assets || []).filter(i => {
            const txt = (
                String(i['ID อุปกรณ์'] || '') +
                String(i['ชื่ออุปกรณ์'] || '') +
                String(i['Serial Number'] || '') +
                String(i.asset_id || '') +
                String(i.ip_address || '') +
                String(i.mac_address || '') +
                JSON.stringify(i.accessories || [])
            ).toLowerCase();
            return (!term || txt.includes(term)) &&
                (!cat || i['หมวดหมู่'] === cat) &&
                (!stat || i['สถานะ'] === stat) &&
                (!co || i.company === co);
        });
    }

    function printBatchStickers(tpl, type, items) {
        const cfgMap = {
            A4_3x8: { cols: 3, rows: 8, gapMm: 4, pageMarginMm: 8, labelWmm: 63.5, labelHmm: 33.9, qrMm: 22, barcodeHmm: 10, idPt: 10, namePt: 7.5 },
            A4_4x10: { cols: 4, rows: 10, gapMm: 2.5, pageMarginMm: 6, labelWmm: 48, labelHmm: 25.4, qrMm: 16, barcodeHmm: 8, idPt: 8.5, namePt: 6.5 },
            DIECUT_62x100: { cols: 2, rows: 5, gapMm: 6, pageMarginMm: 8, labelWmm: 62, labelHmm: 100, qrMm: 32, barcodeHmm: 14, idPt: 12, namePt: 9 },
        };

        const cfg = cfgMap[tpl] || cfgMap.A4_3x8;
        const perPage = cfg.cols * cfg.rows;
        const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const printItems = (items || []).map(i => {
            const id = String(i['ID อุปกรณ์'] || i.asset_id || '').trim();
            const name = String(i['ชื่ออุปกรณ์'] || '').trim();
            return { id, name };
        }).filter(x => x.id);

        const win = window.open('', '', 'width=980,height=720');
        if (!win) return;

        win.document.write(`
            <html>
            <head>
                <title>Stickers</title>
                <meta charset="utf-8" />
                <style>
                    :root{
                        --cols:${cfg.cols};
                        --rows:${cfg.rows};
                        --gap:${cfg.gapMm}mm;
                        --m:${cfg.pageMarginMm}mm;
                        --w:${cfg.labelWmm}mm;
                        --h:${cfg.labelHmm}mm;
                        --qr:${cfg.qrMm}mm;
                        --bh:${cfg.barcodeHmm}mm;
                        --idpt:${cfg.idPt}pt;
                        --namept:${cfg.namePt}pt;
                    }
                    @page { size: A4; margin: var(--m); }
                    html, body { padding: 0; margin: 0; }
                    body { font-family: Arial, sans-serif; color: #111; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                    .page { width: 100%; }
                    .sheet { display: grid; grid-template-columns: repeat(var(--cols), var(--w)); grid-auto-rows: var(--h); gap: var(--gap); justify-content: center; align-content: start; }
                    .sticker { width: var(--w); height: var(--h); box-sizing: border-box; border: 0.35mm solid #111; border-radius: 2mm; padding: 2.5mm; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
                    .row { display: flex; gap: 2.5mm; align-items: center; min-height: 0; }
                    .code { width: var(--qr); height: var(--qr); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
                    .meta { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
                    .label { font-size: 7pt; font-weight: 700; letter-spacing: .4pt; text-transform: uppercase; color: #111; }
                    .id { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-weight: 800; font-size: var(--idpt); line-height: 1.05; margin-top: 0.5mm; }
                    .name { font-size: var(--namept); color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.5mm; }
                    .barcode { width: 100%; height: var(--bh); display: flex; align-items: center; justify-content: center; margin-top: 1.5mm; }
                    .barcode svg, .barcode img { width: 100%; height: 100%; }
                    .center { text-align: center; }
                    .pb { page-break-after: always; }
                    .sticker--acc { padding-top: 3mm; }
                </style>
            </head>
            <body>
                <div id="root"></div>
                <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
                <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
                <script>
                    (function(){
                        const pxPerMm = 3.7795275591;
                        const cfg = ${JSON.stringify(cfg)};
                        const type = ${JSON.stringify(type)};
                        const baseUrl = ${JSON.stringify(baseUrl)};
                        const items = ${JSON.stringify(printItems)};
                        const perPage = ${perPage};
                        const qrPx = Math.max(40, Math.round((cfg.qrMm || 22) * pxPerMm));
                        const barHPx = Math.max(24, Math.round((cfg.barcodeHmm || 10) * pxPerMm));

                        const esc = (s) => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
                        const root = document.getElementById('root');

                        let html = '';
                        const pages = Math.ceil(items.length / perPage) || 1;
                        for (let p = 0; p < pages; p++) {
                            html += '<div class="page">';
                            html += '<div class="sheet">';
                            const slice = items.slice(p * perPage, (p + 1) * perPage);
                            slice.forEach((it, idx) => {
                                const sid = 'st_' + p + '_' + idx;
                                const labelText = type === 'ACC' ? 'ASSET TAG' : 'SCAN FOR REPAIR';
                                const stickerClass = type === 'ACC' ? 'sticker sticker--acc' : 'sticker';
                                html += '<div class="' + stickerClass + '" id="' + sid + '" data-id="' + esc(it.id) + '" data-name="' + esc(it.name) + '">';
                                if (type === 'ACC') {
                                    html += '<div class="label center">' + labelText + '</div>';
                                    html += '<div class="barcode" data-role="barcode"></div>';
                                    html += '<div class="id center">' + esc(it.id) + '</div>';
                                    html += '<div class="name center">' + esc(it.name) + '</div>';
                                } else if (type === 'BOTH') {
                                    html += '<div class="row">';
                                    html += '<div class="code" data-role="qr"></div>';
                                    html += '<div class="meta">';
                                    html += '<div class="label">' + labelText + '</div>';
                                    html += '<div class="id">' + esc(it.id) + '</div>';
                                    html += '<div class="name">' + esc(it.name) + '</div>';
                                    html += '</div>';
                                    html += '</div>';
                                    html += '<div class="barcode" data-role="barcode"></div>';
                                } else {
                                    html += '<div class="row">';
                                    html += '<div class="code" data-role="qr"></div>';
                                    html += '<div class="meta">';
                                    html += '<div class="label">' + labelText + '</div>';
                                    html += '<div class="id">' + esc(it.id) + '</div>';
                                    html += '<div class="name">' + esc(it.name) + '</div>';
                                    html += '</div>';
                                    html += '</div>';
                                    html += '<div class="barcode" style="display:none"></div>';
                                }
                                html += '</div>';
                            });
                            html += '</div>';
                            html += '</div>';
                            if (p < pages - 1) html += '<div class="pb"></div>';
                        }

                        root.innerHTML = html;

                        const stickers = Array.from(document.querySelectorAll('.sticker'));
                        stickers.forEach(st => {
                            const id = st.getAttribute('data-id') || '';
                            const qrUrl = baseUrl + '/request.html?asset_id=' + encodeURIComponent(id);

                            const qrEl = st.querySelector('[data-role="qr"]');
                            if (qrEl) {
                                new QRCode(qrEl, { text: qrUrl, width: qrPx, height: qrPx });
                            }

                            const barEl = st.querySelector('[data-role="barcode"]');
                            if (barEl) {
                                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                                barEl.appendChild(svg);
                                JsBarcode(svg, id, {
                                    format: 'CODE128',
                                    lineColor: '#111',
                                    width: 1.6,
                                    height: barHPx,
                                    displayValue: false,
                                    margin: 0
                                });
                            }
                        });

                        setTimeout(() => window.print(), 250);
                    })();
                <\/script>
            </body>
            </html>
        `);
        win.document.close();
    }

    window.printEmployeeDirectory = function() {

        }
        
        // เรียงลำดับ: บริษัท -> แผนก -> ชื่อ
        items.sort((a, b) => {
            const assignA = a.assignments.find(x => x.is_primary) || a.assignments[0] || {};
            const assignB = b.assignments.find(x => x.is_primary) || b.assignments[0] || {};
            if ((assignA.company || '') !== (a
