    <style>
        /* === PTC Design System supplements for admin.html === */
        body { font-family: var(--ptc-font-th, 'Kanit', sans-serif) !important; }

        /* Sidebar use design-system surface vars where possible */
        :root { --admin-sidebar-w: 16rem; }

        /* Responsive data tables inside admin panels */
        @media (max-width: 640px) {
            table.admin-resp-table thead { display: none; }
            table.admin-resp-table tbody tr {
                display: flex; flex-direction: column;
                border: 1px solid var(--ptc-border, #e2e8f0);
                border-radius: var(--ptc-radius-lg, 0.75rem);
                margin-bottom: .75rem;
                padding: .5rem .75rem;
                background: var(--ptc-surface, #fff);
            }
            table.admin-resp-table td { padding: .35rem 0; border: none; font-size: .875rem; }
            table.admin-resp-table td::before {
                content: attr(data-label);
                display: block; font-size: .7rem; font-weight: 600;
                color: var(--ptc-text-muted, #94a3b8);
                text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px;
            }
            /* Modal full-width on mobile */
            .modal-box, [id$="-modal"] > div { margin: .5rem !important; border-radius: var(--ptc-radius-xl, 1rem) !important; }
            /* Filter bar stack */
            .filter-bar { flex-direction: column !important; gap: .5rem !important; }
            .filter-bar input, .filter-bar select { width: 100% !important; }
        }

        /* Consistent focus ring using design-system primary */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--ptc-primary, #2563eb) !important;
            box-shadow: 0 0 0 3px var(--ptc-primary-ring, rgba(37,99,235,.15)) !important;
        }

        /* Stat pill hover */
        .stat-pill { transition: transform .15s ease, box-shadow .15s ease; }
        .stat-pill:hover { transform: translateY(-2px); box-shadow: var(--ptc-shadow-md, 0 4px 12px rgba(0,0,0,.1)); }

        /* Scrollbar polish */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--ptc-border, #cbd5e1); border-radius: 3px; }
        .dark ::-webkit-scrollbar-thumb { background: var(--ptc-border-dark, #475569); }

        /* Typography tightening */
        h1, h2, h3, h4 { letter-spacing: -0.01em; }
    </style>

    <!-- Asset Details Modal -->
    <div id="asset-details-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeDetailsModal()"></div>
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-slate-800 text-left shadow-2xl transition-all w-full max-w-3xl flex flex-col max-h-[90vh]">
                <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                    <h3 class="text-lg font-bold text-slate-800 dark:text-white" id="details-modal-title">Asset Details</h3>
                    <button onclick="closeDetailsModal()" class="text-slate-400 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
                </div>
                <div class="p-6 overflow-y-auto custom-scrollbar" id="details-modal-body"></div>
                <div class="px-6 py-4 border-t border-slate-100 dark:border-slate-700 flex justify-end bg-slate-50 dark:bg-slate-800">

                        <button id="transfer-btn" class="hidden px-4 py-2 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded-lg text-sm font-medium transition"><i class="fas fa-random mr-2"></i>โอนย้าย</button>
                        <button id="transfer-set-btn" class="hidden px-4 py-2 bg-purple-100 text-purple-700 hover:bg-purple-200 rounded-lg text-sm font-medium transition"><i class="fas fa-layer-group mr-2"></i>โอนย้ายทั้งชุด</button>
                        <button id="repair-btn" class="hidden px-4 py-2 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg text-sm font-medium transition"><i class="fas fa-wrench mr-2"></i>แจ้งซ่อม</button>
                        <button onclick="closeDetailsModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-lg text-sm font-medium transition">ปิด</button>
                    </div>

    <script>
        // --- 1. Global Variables ---
        var activeTab = 'it_assets';
        var data = { it_assets:[], asset_categories:[], departments:[], locations:[], employees:[], announcements:[], holidays:[], services:[], kb_articles:[], kb_categories:[], permissions:[] };
        
        var isEditing = false;
        var currentAccessories = []; // Global for the modal
        // Chart Instances
        var currentView = 'list'; // 'list' or 'tree'
        var statusChart = null;
        var categoryChart = null;
        
        const keyTitles = { 
            it_assets:'ทะเบียนพัสดุภัณฑ์', 
            asset_categories:'หมวดหมู่อุปกรณ์', 
            departments:'แผนก', 
            locations: 'สถานที่ (Locations)',
            employees:'พนักงาน', 
            job_positions:'ตำแหน่งงาน',
            announcements:'ประกาศ', 
            holidays:'วันหยุด', 
            services:'บริการ',
            kb_articles: 'Knowledge Base Articles',
            kb_categories: 'KB Categories',
            permissions: 'สิทธิ์ผู้ใช้ (Permissions)'
        };
        
        const apiPath = 'api.php';
        const gid = (id) => document.getElementById(id);
        const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, timerProgressBar: true });
        let supplierCache = [];
        let supplierListenersRegistered = false;
        const defaultPositionOptions = [
            'Managing Director',
            'Executive Director and General Manager For Administration Division',
            'Digital Transformation Analyst Manager',
            'Senior Manager',
            'Manager',
            'Manager (Acting)',
            'Plan Manager',
            'Assistant Manger',
            'Head of General Administratoin Division',
            'Head of Operations',
            'Head of Testing',
            'Senior Supervisor',
            'Supervisor (Lv3)',
            'Supervisor (Lv2)',
            'Supervisor (Lv1)',
            'Senior Officer',
            'Officer',
            'Programmer',
            'Senior Programmer',
            'Engineer(Lv3)',
            'Engineer(Lv2)',
            'Engineer(Lv1)',
            'Senior Technician',
            'Senior Springer',
            'Springer',
            'Staff',
            'Factory and Mainteanace'
        ];
        let jobPositionOptions = [];

        async function fetchSuppliers(term = '', company = '') {
            const url = `${apiPath}?action=get_suppliers&term=${encodeURIComponent(term || '')}&company=${encodeURIComponent(company || '')}&limit=50`;
            const res = await fetch(url, { cache: 'no-store' });
            const json = await res.json();
            if (json && json.status === 'success' && Array.isArray(json.suppliers)) return json.suppliers;
            return [];
        }

        function renderSupplierDatalist(items) {
            const dl = document.getElementById('supplier-list');
            if (!dl) return;
            dl.innerHTML = (items || []).map(s => `<option value="${escapeHtml(s.name || '')}"></option>`).join('');
        }

        async function refreshSupplierDatalist(term = '') {
            const companyEl = gid('form-company');
            const company = companyEl ? companyEl.value : '';
            supplierCache = await fetchSuppliers(term, company);
            renderSupplierDatalist(supplierCache);
        }

        window.openSupplierManager = function() {
            window.open('supplier.html', '_blank');
        }

        function initSupplierField() {
            const input = gid('form-supplier');
            if (!input) return;
            if (input.dataset.inited === '1') return;
            input.dataset.inited = '1';

            const onRefresh = () => refreshSupplierDatalist(input.value || '');

            input.addEventListener('focus', onRefresh);
            input.addEventListener('input', onRefresh);

            const companyEl = gid('form-company');
            if (companyEl) companyEl.addEventListener('change', () => refreshSupplierDatalist(''));

            if (!supplierListenersRegistered) {
                supplierListenersRegistered = true;
                window.addEventListener('focus', () => {
                    const supplierInput = gid('form-supplier');
                    if (supplierInput) refreshSupplierDatalist(supplierInput.value || '');
                });
                window.addEventListener('storage', (e) => {
                    if (e.key === 'suppliers_last_update') {
                        const supplierInput = gid('form-supplier');
                        if (supplierInput) refreshSupplierDatalist(supplierInput.value || '');
                    }
                });
            }
        }

        async function loadJobPositions() {
            try {
                const res = await fetch(`${apiPath}?action=get_job_positions&v=${Date.now()}`, { cache: 'no-store' });
                const json = await res.json();
                if (json && json.status === 'success' && Array.isArray(json.positions)) {
                    jobPositionOptions = json.positions.map(p => String(p.name || '').trim()).filter(Boolean);
                    return;
                }
            } catch (_) {}
            jobPositionOptions = [];
        }

        function getPositionSelectOptions(selected = '') {
            const merged = [...new Set([...(jobPositionOptions.length ? jobPositionOptions : defaultPositionOptions), selected].filter(Boolean))];
            return `<option value="">เลือกตำแหน่ง</option>` + merged.map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('');
        }

        window.saveCurrentPositionOption = async function() {
            const input = gid('form-position');
            if (!input) return;
            const name = String(input.value || '').trim();
            if (!name) {
                Swal.fire('แจ้งเตือน', 'กรุณาพิมพ์ชื่อตำแหน่งก่อน', 'info');
                return;
            }
            try {
                const fd = new FormData();
                fd.append('action', 'save_job_position');
                fd.append('name', name);
                const res = await fetch(apiPath, { method: 'POST', body: fd });
                const json = await res.json();
                if (json.status !== 'success') throw new Error(json.message || 'Save failed');
                await loadJobPositions();
                const dl = gid('position-options-list');
                if (dl) dl.innerHTML = getPositionSelectOptions(name).replace('<option value="">เลือกตำแหน่ง</option>', '');
                Toast.fire({ icon: 'success', title: 'บันทึกตำแหน่งแล้ว' });
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
            }
        }

        window.openJobPositionManager = async function() {
            const html = `
                <div class="space-y-3 text-left">
                    <div class="flex gap-2">
                        <input id="new-job-position-name" type="text" class="swal2-input !m-0 !w-full" placeholder="ชื่อตำแหน่งใหม่">
                        <input id="new-job-position-order" type="number" min="1" class="swal2-input !m-0 !w-28" placeholder="ลำดับ">
                        <button id="add-job-position-btn" type="button" class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 whitespace-nowrap">เพิ่ม</button>
                    </div>
                    <div id="job-position-list" class="max-h-[420px] overflow-y-auto space-y-2"></div>
                </div>
            `;
            await Swal.fire({
                title: 'จัดการตำแหน่งงาน',
                html,
                width: 820,
                showConfirmButton: false,
                didOpen: async () => {
                    const listEl = document.getElementById('job-position-list');
                    const addBtn = document.getElementById('add-job-position-btn');
                    const nameEl = document.getElementById('new-job-position-name');
                    const orderEl = document.getElementById('new-job-position-order');
                    const render = async () => {
                        if (!listEl) return;
                        listEl.innerHTML = `<div class="text-xs text-slate-500 p-2">กำลังโหลด...</div>`;
                        try {
                            const res = await fetch(`${apiPath}?action=get_job_positions_admin&v=${Date.now()}`, { cache: 'no-store' });
                            const json = await res.json();
                            const rows = (json && json.status === 'success' && Array.isArray(json.positions)) ? json.positions : [];
                            if (!rows.length) {
                                listEl.innerHTML = `<div class="text-xs text-slate-500 p-2">ไม่พบข้อมูลตำแหน่ง</div>`;
                                return;
                            }
                            listEl.innerHTML = rows.map(r => `
                                <div class="grid grid-cols-[1fr_90px_84px_84px_84px] gap-2 items-center p-2 rounded border border-slate-200 dark:border-slate-700">
                                    <input data-f-name="${r.id}" type="text" class="px-2 py-1 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm" value="${escapeHtml(r.name || '')}">
                                    <input data-f-order="${r.id}" type="number" min="1" class="px-2 py-1 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm" value="${parseInt(r.sort_order || 999)}">
                                    <label class="inline-flex items-center gap-1 text-xs">
                                        <input data-f-active="${r.id}" type="checkbox" ${parseInt(r.is_active || 0) === 1 ? 'checked' : ''}>
                                        Active
                                    </label>
                                    <button data-f-save="${r.id}" type="button" class="px-2 py-1 rounded bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700">บันทึก</button>
                                    <button data-f-delete="${r.id}" type="button" class="px-2 py-1 rounded bg-rose-600 text-white text-xs font-semibold hover:bg-rose-700">ลบ</button>
                                </div>
                            `).join('');
                            rows.forEach(r => {
                                const saveBtn = listEl.querySelector(`[data-f-save="${r.id}"]`);
                                if (!saveBtn) return;
                                saveBtn.addEventListener('click', async () => {
                                    const nameInput = listEl.querySelector(`[data-f-name="${r.id}"]`);
                                    const orderInput = listEl.querySelector(`[data-f-order="${r.id}"]`);
                                    const activeInput = listEl.querySelector(`[data-f-active="${r.id}"]`);
                                    const fd = new FormData();
                                    fd.append('action', 'update_job_position');
                                    fd.append('id', String(r.id));
                                    fd.append('name', String(nameInput?.value || '').trim());
                                    fd.append('sort_order', String(parseInt(orderInput?.value || '999') || 999));
                                    fd.append('is_active', activeInput?.checked ? '1' : '0');
                                    try {
                                        const rs = await fetch(apiPath, { method: 'POST', body: fd });
                                        const js = await rs.json();
                                        if (!rs.ok || js.status !== 'success') throw new Error(js.message || 'Update failed');
                                        await loadJobPositions();
                                        Toast.fire({ icon: 'success', title: 'อัปเดตแล้ว' });
                                    } catch (e) {
                                        Swal.fire('Error', e.message, 'error');
                                    }
                                });
                                const deleteBtn = listEl.querySelector(`[data-f-delete="${r.id}"]`);
                                if (!deleteBtn) return;
                                deleteBtn.addEventListener('click', async () => {
                                    const ok = await Swal.fire({
                                        title: 'ลบตำแหน่งงาน?',
                                        text: `ยืนยันลบ "${String(r.name || '').trim()}"`,
                                        icon: 'warning',
                                        showCancelButton: true,
                                        confirmButtonText: 'ลบ',
                                        cancelButtonText: 'ยกเลิก'
                                    });
                                    if (!ok.isConfirmed) return;
                                    const fd = new FormData();
                                    fd.append('action', 'update_job_position');
                                    fd.append('id', String(r.id));
                                    fd.append('name', String(r.name || '').trim());
                                    fd.append('sort_order', String(parseInt(r.sort_order || 999) || 999));
                                    fd.append('is_active', '0');
                                    try {
                                        const rs = await fetch(apiPath, { method: 'POST', body: fd });
                                        const js = await rs.json();
                                        if (!rs.ok || js.status !== 'success') throw new Error(js.message || 'Delete failed');
                                        await loadJobPositions();
                                        await render();
                                        Toast.fire({ icon: 'success', title: 'ลบตำแหน่งแล้ว' });
                                    } catch (e) {
                                        Swal.fire('Error', e.message, 'error');
                                    }
                                });
                            });
                        } catch (e) {
                            listEl.innerHTML = `<div class="text-xs text-red-500 p-2">${escapeHtml(e.message || 'Error')}</div>`;
                        }
                    };
                    if (addBtn) {
                        addBtn.addEventListener('click', async () => {
                            const name = String(nameEl?.value || '').trim();
                            if (!name) return;
                            const fd = new FormData();
                            fd.append('action', 'save_job_position');
                            fd.append('name', name);
                            fd.append('sort_order', String(parseInt(orderEl?.value || '999') || 999));
                            try {
                                const res = await fetch(apiPath, { method: 'POST', body: fd });
                                const json = await res.json();
                                if (!res.ok || json.status !== 'success') throw new Error(json.message || 'Save failed');
                                if (nameEl) nameEl.value = '';
                                if (orderEl) orderEl.value = '';
                                await loadJobPositions();
                                await render();
                                Toast.fire({ icon: 'success', title: 'เพิ่มตำแหน่งแล้ว' });
                            } catch (e) {
                                Swal.fire('Error', e.message, 'error');
                            }
                        });
                    }
                    await render();
                }
            });
        }

        window.openCompanyOrderManager = async function() {
            const html = `
                <div class="space-y-3 text-left">
                    <div class="text-xs text-slate-500">โหมดหมู่ / บริษัท: เพิ่ม, แก้ชื่อ, ลบ และเรียงลำดับโฟลเดอร์สำหรับหน้า Directory</div>
                    <div class="grid grid-cols-[1fr_auto] gap-2">
                        <input id="new-company-code" type="text" class="px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm" placeholder="เพิ่มรหัสบริษัท เช่น PTA2">
                        <button id="add-company-code-btn" type="button" class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700">เพิ่มโฟลเดอร์</button>
                    </div>
                    <div id="company-order-list" class="space-y-2 max-h-[420px] overflow-y-auto"></div>
                    <button id="save-company-order-btn" type="button" class="px-3 py-2 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700">บันทึกการเปลี่ยนแปลง</button>
                </div>
            `;
            await Swal.fire({
                title: 'จัดการโฟลเดอร์บริษัท',
                html,
                width: 680,
                showConfirmButton: false,
                didOpen: async () => {
                    const listEl = document.getElementById('company-order-list');
                    const saveBtn = document.getElementById('save-company-order-btn');
                    const addBtn = document.getElementById('add-company-code-btn');
                    const newCodeEl = document.getElementById('new-company-code');
                    if (!listEl || !saveBtn || !addBtn || !newCodeEl) return;
                    const normalizeCode = (v) => String(v || '').trim().toUpperCase().replace(/\s+/g, '');
                    const isValidCode = (v) => /^[A-Z0-9_-]{2,20}$/.test(v);
                    const render = async () => {
                        listEl.innerHTML = `<div class="text-xs text-slate-500 p-2">กำลังโหลด...</div>`;
                        try {
                            const res = await fetch(`${apiPath}?action=get_company_order&v=${Date.now()}`, { cache: 'no-store' });
                            const json = await res.json();
                            const rows = (json && json.status === 'success' && Array.isArray(json.order)) ? json.order : ['PTA', 'PT4', 'PTE'];
                            listEl.innerHTML = rows.map(code => `
                                <div class="grid grid-cols-[40px_1fr_auto] gap-2 items-center p-2 rounded border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800" data-company-row="1">
                                    <button type="button" class="h-8 rounded border border-slate-300 dark:border-slate-600 text-slate-500 handle" title="ลากเพื่อเรียงลำดับ">
                                        <i class="fas fa-bars"></i>
                                    </button>
                                    <input type="text" value="${escapeHtml(code)}" class="company-code-input px-2 py-1.5 rounded border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-semibold" />
                                    <button type="button" class="h-8 w-8 rounded border border-red-300 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 company-delete-btn" title="ลบโฟลเดอร์">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            `).join('');
                            listEl.querySelectorAll('.company-delete-btn').forEach(btn => {
                                btn.addEventListener('click', () => {
                                    const row = btn.closest('[data-company-row="1"]');
                                    if (!row) return;
                                    const total = listEl.querySelectorAll('[data-company-row="1"]').length;
                                    if (total <= 1) {
                                        Swal.fire('แจ้งเตือน', 'ต้องมีอย่างน้อย 1 บริษัท', 'warning');
                                        return;
                                    }
                                    row.remove();
                                });
                            });
                            new Sortable(listEl, {
                                handle: '.handle',
                                animation: 150,
                                ghostClass: 'bg-blue-50'
                            });
                        } catch (e) {
                            listEl.innerHTML = `<div class="text-xs text-red-500 p-2">${escapeHtml(e.message || 'Error')}</div>`;
                        }
                    };
                    addBtn.addEventListener('click', () => {
                        const code = normalizeCode(newCodeEl.value);
                        if (!isValidCode(code)) {
                            Swal.fire('แจ้งเตือน', 'รหัสบริษัทต้องเป็น A-Z, 0-9, _ หรือ - และยาว 2-20 ตัวอักษร', 'warning');
                            return;
                        }
                        const existing = Array.from(listEl.querySelectorAll('.company-code-input')).map(el => normalizeCode(el.value));
                        if (existing.includes(code)) {
                            Swal.fire('แจ้งเตือน', 'มีรหัสบริษัทนี้อยู่แล้ว', 'warning');
                            return;
                        }
                        const row = document.createElement('div');
                        row.className = 'grid grid-cols-[40px_1fr_auto] gap-2 items-center p-2 rounded border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800';
                        row.setAttribute('data-company-row', '1');
                        row.innerHTML = `
                            <button type="button" class="h-8 rounded border border-slate-300 dark:border-slate-600 text-slate-500 handle" title="ลากเพื่อเรียงลำดับ">
                                <i class="fas fa-bars"></i>
                            </button>
                            <input type="text" value="${escapeHtml(code)}" class="company-code-input px-2 py-1.5 rounded border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm font-semibold" />
                            <button type="button" class="h-8 w-8 rounded border border-red-300 text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20 company-delete-btn" title="ลบโฟลเดอร์">
                                <i class="fas fa-trash"></i>
                            </button>
                        `;
                        const delBtn = row.querySelector('.company-delete-btn');
                        if (delBtn) {
                            delBtn.addEventListener('click', () => {
                                const total = listEl.querySelectorAll('[data-company-row="1"]').length;
                                if (total <= 1) {
                                    Swal.fire('แจ้งเตือน', 'ต้องมีอย่างน้อย 1 บริษัท', 'warning');
                                    return;
                                }
                                row.remove();
                            });
                        }
                        listEl.appendChild(row);
                        newCodeEl.value = '';
                    });
                    saveBtn.addEventListener('click', async () => {
                        const order = Array.from(listEl.querySelectorAll('.company-code-input'))
                            .map(el => normalizeCode(el.value))
                            .filter(Boolean);
                        if (!order.length) {
                            Swal.fire('แจ้งเตือน', 'ต้องมีอย่างน้อย 1 บริษัท', 'warning');
                            return;
                        }
                        if (order.some(code => !isValidCode(code))) {
                            Swal.fire('แจ้งเตือน', 'พบรหัสบริษัทไม่ถูกต้อง', 'warning');
                            return;
                        }
                        const uniq = [...new Set(order)];
                        if (uniq.length !== order.length) {
                            Swal.fire('แจ้งเตือน', 'รหัสบริษัทซ้ำกัน กรุณาตรวจสอบ', 'warning');
                            return;
                        }
                        const fd = new FormData();
                        fd.append('action', 'save_company_order');
                        fd.append('order', JSON.stringify(order));
                        try {

        function normalizeUploadUrl(url) {
            const u = String(url || '').trim();
            if (!u) return '';
            if (u.startsWith('data:') || u.startsWith('blob:')) return u;
            const idx = u.indexOf('uploads/');
            if (idx !== -1) return u.slice(idx);
            try {
                const parsed = new URL(u, window.location.href);
                const p = String(parsed.pathname || '').replace(/^\/+/, '');
                const pIdx = p.indexOf('uploads/');
                if (pIdx !== -1) return p.slice(pIdx);
            } catch (_) {}
            return u;
        }

        let activeModalEl = null;

        function getFocusableElements(root) {
            if (!root) return [];
            const selector = [
                'a[href]',
                'button:not([disabled])',
                'textarea:not([disabled])',
                'input:not([disabled])',
                'select:not([disabled])',
                '[tabindex]:not([tabindex="-1"])',
            ].join(',');
            return Array.from(root.querySelectorAll(selector)).filter(el => el.offsetParent !== null);
        }

        function activateModalA11y(modalEl, closeFn) {
            if (!modalEl) return;
            activeModalEl = modalEl;
            activeModalClose = closeFn;
            lastActiveElement = document.activeElement;
            modalFocusables = getFocusableElements(modalEl);
            const first = modalFocusables[0];
            if (first) first.focus();
        }

        function deactivateModalA11y() {
            activeModalEl = null;
            activeModalClose = null;
            modalFocusables = [];
            const prev = lastActiveElement;
            lastActiveElement = null;
            if (prev && typeof prev.focus === 'function') prev.focus();
        }

        document.addEventListener('keydown', (e) => {
            if (!activeModalEl || activeModalEl.classList.contains('hidden')) return;
            if (e.key === 'Escape') {
                e.preventDefault();
                if (typeof activeModalClose === 'function') activeModalClose();
                return;
            }
            if (e.key !== 'Tab') return;
            modalFocusables = getFocusableElements(activeModalEl);
            if (!modalFocusables.length) return;
            const first = modalFocusables[0];
            const last = modalFocusables[modalFocusables.length - 1];
            if (e.shiftKey) {
                if (document.activeElement === first || document.activeElement === activeModalEl) {
                    e.preventDefault();
                    last.focus();
                }
            } else {
                if (document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }
        });

        function buildDataUrlByKey(k) {
            let url = `${apiPath}?action=${k==='it_assets'?'getEquipmentData':(k==='locations'?'get_locations':'get&file='+k)}`;
            if (k === 'departments') url += `&include_management=1`;
            url += `&v=${Date.now()}`;
            return url;
        }

        async function fetchDataKey(k) {
            try {
                const res = await fetch(buildDataUrlByKey(k), { cache: 'no-store' });
                const raw = await res.text();
                let j = null;
                try { j = JSON.parse(raw); } catch (_) { j = null; }
                if (!res.ok || j === null) throw new Error(`HTTP ${res.status}`);
                let arr = [];
                if (Array.isArray(j)) arr = j;
                else if (j && Array.isArray(j.data)) arr = j.data;
                else if (j && j.status === 'error') throw new Error(j.message || 'API error');
                return { key: k, items: arr, ok: true };
            } catch (err) {
                console.error(`Load failed [${k}]`, err);
                return { key: k, items: Array.isArray(data[k]) ? data[k] : [], ok: false };
            }
        }

                const s = i['สถานะ'] || 'Other';

            if(statusChart) statusChart.destroy();
            
            statusChart = new Chart(ctxStatus, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(statusCounts),
                    datasets: [{
                        data: Object.values(statusCounts),
                        backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#64748b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { color: textColor } }

                type: 'bar',

                    labels: Object.keys(catCounts),

        async function loadAssetHistory(assetId, containerId = 'asset-history-container') {
            const container = gid(containerId);
            if (!container) return;
            container.innerHTML = '<div class="text-center text-slate-400 py-4"><i class="fas fa-spinner fa-spin"></i> Loading history...</div>';

            try {
                const res = await fetch(`${apiPath}?action=get_asset_history&id=${assetId}`);
                const history = await res.json();

                if (history.status === 'error') throw new Error(history.message);
                if (!Array.isArray(history)) throw new Error('Invalid data format');

                if (history.length === 0) {
                    container.innerHTML = '<div class="text-center text-slate-400 py-4">No history found.</div>';
                    return;
                }

                const iconMap = { 
                    CREATE: 'fa-plus-circle text-green-500', 
                    UPDATE: 'fa-pencil-alt text-blue-500', 
                    STATUS_CHANGE: 'fa-random text-purple-500', 
                    LOAN: 'fa-arrow-circle-up text-orange-500', 
                    LOAN_REQUEST: 'fa-paper-plane text-orange-400', 
                    RETURN: 'fa-arrow-circle-down text-teal-500', 
                    NOTE: 'fa-comment-dots text-slate-500',
                    SPEC_CHANGE: 'fa-microchip text-indigo-500',
                    TRANSFER: 'fa-exchange-alt text-purple-500'
                };

                container.innerHTML = history.map(h => {
                    const isNote = h.event_type === 'NOTE';
                    let noteText = '', noteImage = '', safeNoteForEdit = '', detailsHtml = '';

                    if (isNote) {
                        try {
                            const noteData = JSON.parse(h.details);
                            noteText = noteData.text || '';
                            noteImage = noteData.image || '';
                        } catch (e) {
                            noteText = h.details || ''; // Fallback for old plain text notes
                        }
                        detailsHtml = `<div class="text-slate-500 dark:text-slate-400">${noteText.replace(/\\"/g, '"')}</div>`;
                        if (noteImage) {
                            detailsHtml += `<a href="${noteImage}" target="_blank" class="mt-2 inline-block"><img src="${noteImage}" class="max-w-[150px] max-h-24 rounded border dark:border-slate-600"></a>`;
                        }
                        safeNoteForEdit = encodeURIComponent(noteText);
                    } else {
                        detailsHtml = `<div class="text-slate-500 dark:text-slate-400">${(h.details || '').replace(/\\"/g, '"')}</div>`;
                    }

                    const noteActions = isNote ? `
                        <div class="ml-auto flex gap-1 pl-2">
                            <button type="button" onclick="editAssetNote(${h.history_id}, '${safeNoteForEdit}')" class="text-xs text-blue-500 hover:underline">แก้ไข</button>
                            <button type="button" onclick="deleteAssetNote(${h.history_id})" class="text-xs text-red-500 hover:underline">ลบ</button>
                        </div>
                    ` : '';

                    return `<div class="flex gap-3 text-xs"><div class="w-6 text-center pt-0.5"><i class="fas ${iconMap[h.event_type] || 'fa-history'}"></i></div><div class="flex-1 flex items-start"><div class="flex-1"><p class="font-bold text-slate-600 dark:text-slate-300">${h.event_type}</p>${detailsHtml}<p class="text-slate-400 text-[10px] mt-0.5">${new Date(h.timestamp).toLocaleString('th-TH')} by ${h.user_name}</p></div>${noteActions}</div></div>`;
                }).join('');
            } catch (e) { 
                console.error(e);
                container.innerHTML = `<div class="text-center text-red-500 py-4 text-xs">Failed to load history.<br>${e.message}</div>`; 
            }
        }

        window.addAssetNote = async function(assetId) {
            const input = gid('asset-note-input');
            const fileInput = gid('asset-note-file');
            if (!input || !fileInput) return;
            
            const note = input.value.trim();
            const file = fileInput.files[0];

            if (!note && !file) {
                Swal.fire('แจ้งเตือน', 'กรุณาระบุข้อความบันทึกหรือแนบรูปภาพ', 'warning');
                return;
            }

            const btn = event ? event.target : null;
            if(btn) { btn.innerText = '...'; btn.disabled = true; }

            try {
                const fd = new FormData();
                fd.append('action', 'add_asset_note');
                fd.append('id', assetId);
                fd.append('note', note);
                if (file) fd.append('note_image', file);

                const res = await fetch(apiPath, { method: 'POST', body: fd });
                const result = await res.json();

                if (result.status === 'success') {
                    input.value = '';
                    fileInput.value = '';
                    gid('asset-note-filename').textContent = '';
                    await loadAssetHistory(assetId);
                    Toast.fire({ icon: 'success', title: 'บันทึกเรียบร้อย' });
                } else { throw new Error(result.message || 'Failed'); }
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
            finally { if(btn) { btn.innerText = 'Add'; btn.disabled = false; } }
        }

        window.renderContent = function() {
            const container = gid('content-area');
            if (activeTab === 'permissions') {
                renderPermissionsContent(container);
                return;
            }
            if (activeTab === 'job_positions') {
                renderJobPositionsContent(container);
                return;
            }
            const term = gid('search-input').value.toLowerCase();
            let items = data[activeTab] || [];

            if (activeTab === 'it_assets') {
                const cat = gid('filter-category').value;
                const stat = gid('filter-status').value;
                const co = gid('filter-company').value;
                items = items.filter(i => {
                const txt = (String(i['ID อุปกรณ์']||'')+String(i['ชื่ออุปกรณ์']||'')+String(i['Serial Number']||'')+String(i.asset_id||'')+String(i.ip_address||'')+String(i.mac_address||'')+JSON.stringify(i.accessories||[])).toLowerCase();
                    return (!term || txt.includes(term)) && (!cat || i['หมวดหมู่']===cat) && (!stat || i['สถานะ']===stat) && (!co || i.company === co);
                });
            } else if (activeTab === 'employees') {
                const co = gid('filter-emp-company').value;
                const techFilter = gid('filter-emp-tech')?.value || '';
                items = items.filter(i => {
                    const txt = Object.values(i).join(' ').toLowerCase();
                    // เช็คบริษัทจาก assignments
                    const hasCompany = !co || (i.assignments && i.assignments.some(a => a.company === co));
                    const isTech = parseInt(i.is_technician || 0) === 1;
                    const hasTechMatch = !techFilter || (techFilter === 'tech' ? isTech : !isTech);
                    return (!term || txt.includes(term)) && hasCompany && hasTechMatch;
                });
            } else {
                items = items.filter(i => Object.values(i).join(' ').toLowerCase().includes(term));
            }

            const countBadge = gid('record-count');
            if(countBadge) {
                if (activeTab === 'employees') {
                    const techCount = items.filter(i => parseInt(i.is_technician || 0) === 1).length;
                    const nonTechCount = Math.max(0, items.length - techCount);
                    countBadge.textContent = `${items.length} คน | ช่าง ${techCount} | ไม่ใช่ช่าง ${nonTechCount}`;
                } else {
                    countBadge.textContent = items.length + ' items';
                }
                countBadge.classList.remove('hidden');
            }

            if (activeTab === 'it_assets' && currentView === 'tree') {
                renderTreeView(items, container);
            } else {
                const usePaging = activeTab === 'it_assets' || activeTab === 'employees';
                if (!usePaging) {
                    renderTable(items, container);
                    return;
                }
                const pager = getPager(activeTab);
                const pageSize = Math.max(5, parseInt(pager.pageSize, 10) || 25);
                const total = items.length;
                const pageCount = Math.max(1, Math.ceil(total / pageSize));
                const page = Math.min(Math.max(1, parseInt(pager.page, 10) || 1), pageCount);
                if (page !== pager.page) setPager(activeTab, { page });
                const startIdx = (page - 1) * pageSize;
                const pageItems = items.slice(startIdx, startIdx + pageSize);
                renderTable(pageItems, container, { total, page, pageSize, pageCount });
            }
        }

        async function loadPermissionRoles() {
            if (window.permissionRoles && window.permissionRoles.length) return window.permissionRoles;
            const res = await fetch(`${apiPath}?action=get_permission_roles&v=${Date.now()}`, { cache: 'no-store' });
            const json = await res.json();
            const roles = Array.isArray(json.roles) ? json.roles : [];
            window.permissionRoles = roles;
            return roles;
        }

        async function loadUserPermissionDetail(userId) {
            const res = await fetch(`${apiPath}?action=get_user_permissions&user_id=${encodeURIComponent(userId)}&v=${Date.now()}`, { cache: 'no-store' });
            return await res.json();
        }

        function renderPermissionsContent(container) {
            if (!container) return;
            const employees = (data.employees || []).filter(e => (e.employment_status || '').toLowerCase() === 'active');
            const searchVal = gid('search-input').value.toLowerCase();
            const filtered = employees.filter(e => {
                const t = Object.values(e).join(' ').toLowerCase();
                return !searchVal || t.includes(searchVal);
            });
            const leftList = filtered.map(e => {
                const primaryAssign = (e.assignments && e.assignments.find(a => a.is_primary == 1)) || (e.assignments && e.assignments[0]);
                const comp = primaryAssign ? primaryAssign.company : '';
                const dept = primaryAssign ? primaryAssign.department : '';
                const isSelected = window.selectedPermissionUser === e.id;
                const baseClass = 'flex items-center gap-2 px-3 py-2 rounded-lg text-xs cursor-pointer';
                const cls = isSelected ? baseClass + ' bg-blue-100 text-blue-700' : baseClass + ' hover:bg-slate-100 text-slate-600';

                                <div class="text-[11px] font-semibold text-slate-500">สิทธิ์แบบกำหนดเอง (Granular Permissions)</div>

        async function renderJobPositionsContent(container) {
            if (!container) return;
            container.innerHTML = `<div class="flex items-center justify-center h-64 text-slate-400"><i class="fas fa-circle-notch fa-spin mr-2"></i> Loading...</div>`;
            try {
                const res = await fetch(`${apiPath}?action=get_job_positions_admin&v=${Date.now()}`, { cache: 'no-store' });
                const json = await res.json();
                const rows = (json && json.status === 'success' && Array.isArray(json.positions)) ? json.positions : [];
                const term = (gid('search-input')?.value || '').toLowerCase();
                const filtered = rows.filter(r => String(r.name || '').toLowerCase().includes(term));
                const persistJobPositionOrder = async (orderedRows) => {
                    for (let i = 0; i < orderedRows.length; i++) {
                        const row = orderedRows[i];
                        const fd = new FormData();
                        fd.append('action', 'update_job_position');
                        fd.append('id', String(row.id));
                        fd.append('name', String(row.name || '').trim());
                        fd.append('sort_order', String(i + 1));
                        fd.append('is_active', parseInt(row.is_active || 0) === 1 ? '1' : '0');
                        const rs = await fetch(apiPath, { method: 'POST', body: fd });
                        const js = await rs.json();
                        if (!rs.ok || js.status !== 'success') throw new Error(js.message || 'Reorder failed');
                        row.sort_order = i + 1;
                    }
                };
                const bindJobPositionDragAndDrop = (scopeEl) => {
                    const body = scopeEl?.querySelector('[data-jp-tbody]');
                    if (!body) return;
                    let draggedId = '';
                    const rowEls = body.querySelectorAll('tr[data-jp-row-id]');
                    const clearHover = () => rowEls.forEach(el => el.classList.remove('bg-blue-50', 'dark:bg-blue-900/20'));
                    body.querySelectorAll('[data-jp-drag]').forEach(handle => {
                        handle.addEventListener('dragstart', (e) => {
                            draggedId = String(handle.dataset.jpDrag || '');
                            if (e.dataTransfer) {
                                e.dataTransfer.effectAllowed = 'move';
                                e.dataTransfer.setData('text/plain', draggedId);
                            }
                        });
                        handle.addEventListener('dragend', () => {
                            draggedId = '';
                            clearHover();
                        });
                    });
                    rowEls.forEach(targetRow => {
                        targetRow.addEventListener('dragover', (e) => {
                            if (!draggedId) return;
                            e.preventDefault();
                            if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
                        });
                        targetRow.addEventListener('dragenter', () => {
                            if (!draggedId) return;
                            clearHover();
                            targetRow.classList.add('bg-blue-50', 'dark:bg-blue-900/20');
                        });
                        targetRow.addEventListener('drop', async (e) => {
                            if (!draggedId) return;
                            e.preventDefault();
                            clearHover();
                            const targetId = String(targetRow.dataset.jpRowId || '');
                            if (!targetId || targetId === draggedId) return;
                            const from = rows.findIndex(x => String(x.id) === draggedId);
                            const to = rows.findIndex(x => String(x.id) === targetId);
                            if (from < 0 || to < 0 || from === to) return;
                            const [moved] = rows.splice(from, 1);
                            rows.splice(to, 0, moved);
                            try {
                                await persistJobPositionOrder(rows);
                                await loadJobPositions();
                                await renderJobPositionsContent(container);
                                Toast.fire({ icon: 'success', title: 'จัดลำดับแล้ว' });
                            } catch (err) {
                                Swal.fire('Error', err.message || 'Reorder failed', 'error');
                            }
                        });
                    });
                };
                const rowHtml = filtered.map(r => `
                    <tr data-jp-row-id="${r.id}">
                        <td class="px-4 py-3 border-b border-slate-100 dark:border-slate-700">
                            <input data-jp-name="${r.id}" type="text" class="w-full px-2 py-1 rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm" value="${escapeHtml(r.name || '')}">
                        </td>
                        <td class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 w-28">
                            <button data-jp-drag="${r.id}" draggable="true" class="w-10 h-8 rounded border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold" title="ลากเพื่อเรียงลำดับ">↕</button>
                        </td>
                        <td class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 w-28 text-center">
                            <input data-jp-active="${r.id}" type="checkbox" ${parseInt(r.is_active || 0) === 1 ? 'checked' : ''}>
                        </td>
                        <td class="px-4 py-3 border-b border-slate-100 dark:border-slate-700 w-36 text-right">
                            <div class="inline-flex items-center gap-2">
                                <button data-jp-save="${r.id}" class="px-3 py-1 rounded bg-emerald-600 text-white text-xs font-semibold hover:bg-emerald-700">บันทึก</button>
                                <button data-jp-delete="${r.id}" class="px-3 py-1 rounded bg-rose-600 text-white text-xs font-semibold hover:bg-rose-700">ลบ</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
                container.innerHTML = `
                    <div class="p-4 md:p-6 space-y-4">
                        <div class="flex flex-col md:flex-row gap-2">
                            <input id="jp-add-name" type="text" class="flex-1 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-sm" placeholder="ชื่อตำแหน่งใหม่">
                            <button id="jp-add-btn" class="px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">เพิ่มตำแหน่ง</button>
                        </div>
                        <div class="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700">
                            <table class="w-full text-sm">
                                <thead>
                                    <tr>
                                        <th class="px-4 py-3 text-left text-xs uppercase text-slate-500 bg-slate-50 dark:bg-slate-700/50">ตำแหน่ง</th>
                                        <th class="px-4 py-3 text-left text-xs uppercase text-slate-500 bg-slate-50 dark:bg-slate-700/50">เลื่อน</th>
                                        <th class="px-4 py-3 text-center text-xs uppercase text-slate-500 bg-slate-50 dark:bg-slate-700/50">Active</th>
                                        <th class="px-4 py-3 text-right text-xs uppercase text-slate-500 bg-slate-50 dark:bg-slate-700/50">Action</th>
                                    </tr>
                                </thead>
                                <tbody data-jp-tbody>${rowHtml || `<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400">ไม่พบข้อมูล</td></tr>`}</tbody>
                            </table>
                        </div>
                    </div>
                `;
                bindJobPositionDragAndDrop(container);
                const addBtn = gid('jp-add-btn');
                if (addBtn) {
                    addBtn.addEventListener('click', async () => {
                        const name = String(gid('jp-add-name')?.value || '').trim();
                        if (!name) return Swal.fire('แจ้งเตือน', 'กรุณาระบุชื่อตำแหน่ง', 'info');
                        const fd = new FormData();
                        fd.append('action', 'save_job_position');
                        fd.append('name', name);
                        const rs = await fetch(apiPath, { method: 'POST', body: fd });
                        const js = await rs.json();
                        if (!rs.ok || js.status !== 'success') throw new Error(js.message || 'Save failed');
                        await loadJobPositions();
                        await renderJobPositionsContent(container);
                        Toast.fire({ icon: 'success', title: 'เพิ่มตำแหน่งแล้ว' });
                    });
                }
                filtered.forEach(r => {
                    const btn = container.querySelector(`[data-jp-save="${r.id}"]`);
                    if (!btn) return;
                    btn.addEventListener('click', async () => {
                        const name = String(container.querySelector(`[data-jp-name="${r.id}"]`)?.value || '').trim();
                        const active = container.querySelector(`[data-jp-active="${r.id}"]`)?.checked ? '1' : '0';
                        if (!name) return Swal.fire('แจ้งเตือน', 'ชื่อตำแหน่งห้ามว่าง', 'info');
                        const fd = new FormData();
                        fd.append('action', 'update_job_position');
                        fd.append('id', String(r.id));
                        fd.append('name', name);
                        fd.append('sort_order', String(parseInt(r.sort_order || 999) || 999));
                        fd.append('is_active', active);
                        const rs = await fetch(apiPath, { method: 'POST', body: fd });
                        const js = await rs.json();
                        if (!rs.ok || js.status !== 'success') throw new Error(js.message || 'Update failed');
                        r.name = name;
                        r.is_active = active === '1' ? 1 : 0;
                        await loadJobPositions();
                        Toast.fire({ icon: 'success', title: 'อัปเดตแล้ว' });
                    });
                    const deleteBtn = container.querySelector(`[data-jp-delete="${r.id}"]`);
                    if (deleteBtn) {
                        deleteBtn.addEventListener('click', async () => {
                            const ok = await Swal.fire({
                                title: 'ลบตำแหน่งงาน?',
                                text: `ยืนยันลบ "${String(r.name || '').trim()}"`,
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonText: 'ลบ',
                                cancelButtonText: 'ยกเลิก'
                            });
                            if (!ok.isConfirmed) return;
                            const fd = new FormData();
                            fd.append('action', 'update_job_position');
                            fd.append('id', String(r.id));
                            fd.append('name', String(r.name || '').trim());
                            fd.append('sort_order', String(parseInt(r.sort_order || 999) || 999));
                            fd.append('is_active', '0');
                            const rs = await fetch(apiPath, { method: 'POST', body: fd });
                            const js = await rs.json();
                            if (!rs.ok || js.status !== 'success') throw new Error(js.message || 'Delete failed');
                            await loadJobPositions();
                            await renderJobPositionsContent(container);
                            Toast.fire({ icon: 'success', title: 'ลบตำแหน่งแล้ว' });
                        });
                    }
                });
            } catch (e) {
                container.innerHTML = `<div class="p-6 text-sm text-red-500">${escapeHtml(e.message || 'Error')}</div>`;
            }
        }

    // ย้าย renderTreeView ออกมาข้างนอก renderTable
    window.renderTreeView = function(items, container) {
        if (items.length === 0) {
            container.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-slate-400"><i class="fas fa-box-open text-5xl opacity-30 mb-4"></i><p>ไม่พบข้อมูล</p></div>`;
            return;
        }

        // 1. Group children under their parents
        const itemMap = new Map(items.map(item => [item.db_id, { ...item, children: [] }]));
        const rootItems = [];

        itemMap.forEach(item => {
            if (item.parent_id && itemMap.has(item.parent_id)) {
                itemMap.get(item.parent_id).children.push(item);
            } else {
                rootItems.push(item);
            }
        });

        // 2. Function to render a single node (and its children recursively)
        const renderNode = (item) => {
            let img = item['รูปภาพ (URL)'] || (item.images && item.images[0]);
            img = normalizeUploadUrl(img) || placeholderThumbUrl;
            const brandModel = escapeHtml([item.brand, item.model].filter(Boolean).join(' '));
            const companyAccentBg = getCompanyAccentBgClass(item.company);
            const dbId = escapeJsString(item.db_id);
            const eqId = escapeHtml(item['ID อุปกรณ์'] || '-');
            const name = escapeHtml(item['ชื่ออุปกรณ์'] || '-');
            
            let sClass = 'bg-slate-100 text-slate-600 border-slate-200';
            if (item['สถานะ'] === 'ใช้งานปกติ') sClass = 'bg-emerald-50 text-emerald-700 border-emerald-200';
            else if (item['สถานะ'] === 'ถูกยืม') sClass = 'bg-blue-50 text-blue-700 border-blue-200';
            else if (item['สถานะ'] === 'ส่งซ่อม') sClass = 'bg-amber-50 text-amber-700 border-amber-200';
            else if (item['สถานะ'] === 'ตัดจำหน่าย') sClass = 'bg-red-50 text-red-700 border-red-200';

            // ตรวจสอบว่ามีลูกข่ายที่สถานะผิดปกติหรือไม่
            const hasChildIssue = item.children && item.children.some(c => ['ส่งซ่อม', 'ตัดจำหน่าย', 'เสีย', 'ชำรุด'].includes(c['สถานะ']));
            const warningIcon = hasChildIssue ? `<div class="absolute -top-2 -right-2 text-amber-500 bg-white rounded-full shadow-sm border border-amber-100 p-0.5 z-10" title="อุปกรณ์ในชุดมีปัญหา"><i class="fas fa-exclamation-circle text-lg"></i></div>` : '';

            const childrenHtml = item.children.length > 0
                ? `<div class="tree-container mt-4 space-y-4">${item.children.map(renderNode).join('')}</div>`
                : '';

            return `
                <div class="relative ${item.parent_id ? 'tree-node' : ''}">
                    <div class="card-content bg-white dark:bg-slate-800 p-4 rounded-lg border ${hasChildIssue ? 'border-amber-300 dark:border-amber-700' : 'border-slate-200 dark:border-slate-700'} shadow-sm hover:shadow-md transition-shadow cursor-pointer group relative" onclick="showAssetDetailsModal('${dbId}')">
                        <div class="absolute left-0 top-0 bottom-0 w-1 ${companyAccentBg} rounded-r"></div>
                        ${warningIcon}
                        <div class="flex items-center gap-4">
                            <div class="asset-thumb-wrapper">
                                <img src="${img}" loading="lazy" decoding="async" onerror="handleImgError(this)" data-fallback="${placeholderThumbUrl}" class="asset-thumb rounded-lg border dark:border-slate-600 bg-white">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="font-bold text-slate-800 dark:text-white">${name}</div>
                                <div class="text-xs text-slate-500">${brandModel || '-'}</div>
                                <div class="font-mono text-xs text-blue-500 mt-1">${eqId}</div>
                            </div>
                            <div class="flex flex-col items-end gap-2">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border ${sClass}">
                                    ${escapeHtml(item['สถานะ'] || '-')}

        window.addAccessory = function() {
            const input = gid('accessory-input');
            const value = input.value.trim();
            if (value && !currentAccessories.includes(value)) {
                currentAccessories.push(value);
                renderAccessories();
                input.value = '';
                input.focus();
            }
        }

        window.removeAccessory = function(index) {
            currentAccessories.splice(index, 1);
            renderAccessories();
        }

        window.removeAssetImage = function(index) {
            const input = document.getElementById('existing-images-input');
            if (!input) return;
            let images = JSON.parse(input.value);
            images.splice(index, 1);
            input.value = JSON.stringify(images);
            
            // Re-render modal content is tricky, simpler to just hide the element for now or reload modal
            // For simplicity, let's just remove the element from DOM
            const container = document.getElementById('image-preview-container');
            if (container && container.children[index]) container.children[index].remove();
            
            // Note: Index mismatch might occur if removing multiple without re-render. 
            // Better approach: Reload the form HTML with updated data, but that resets other inputs.
            // Best simple approach: Just hide it visually and update the JSON.
            // But to be safe, let's just update the JSON. The visual removal might be off index if not careful.
            // Let's re-render the preview area only? Too complex for this snippet.
            // Let's just reload the modal with current form data? No.
            // Let's stick to simple DOM removal, but we need to be careful about indices.
            // Actually, let's just update the JSON and let the user save. The visual feedback is important.
            // Let's refresh the whole modal for safety, preserving current inputs?
            // Or simpler: Just hide the parent div of the button clicked.
            event.target.closest('.relative').style.display = 'none';
        }

            const container = gid('accessories-container');
            if (!container) return;
            container.innerHTML = currentAccessories.map((acc, index) => `<span class="flex items-center gap-2 bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-1 rounded-full dark:bg-blue-900 dark:text-blue-300"> ${escapeHtml(acc)} <button type="button" onclick="removeAccessory(${index})" class="text-blue-500 hover:text-blue-700">&times;</button> </span>`).join('');
            gid('form-accessories-json').value = JSON.stringify(currentAccessories);

        window.addChildAsset = function(parentId) {
            const parent = data.it_assets.find(i => i.db_id == parentId);
            if(!parent) return;
            
            // เตรียมข้อมูลสำหรับอุปกรณ์ลูก (Inherit ค่าจากแม่)
            const newItem = {
                parent_id: parentId,
                company: parent.company,
                owning_department: parent.owning_department,
                location: parent.location,
                status: 'ใช้งานปกติ',
                // Inherit Procurement Info (ดึงข้อมูลจัดซื้อจากตัวแม่มาด้วย)

                'วันที่ซื้อ': parent['วันที่ซื้อ'],
                warranty_expires_on: parent.warranty_expires_on,
                po_number: parent.po_number,

                brand: parent.brand

        window.generateNewAssetId = async function() {
            const co = gid('form-company').value;
            const deptId = gid('form-dept').value;
            const catId = gid('form-cat').value;

            if (!co || !deptId || !catId) return Swal.fire('แจ้งเตือน', 'กรุณาเลือก บริษัท, แผนก และประเภท', 'warning');

            const btn = event.target;
            const oldText = btn.innerText;
            btn.innerText = '...'; btn.disabled = true;

            try {
                const url = `${apiPath}?action=generate_next_asset_id&company=${co}&department_id=${deptId}&category_id=${catId}`;
                const res = await (await fetch(url)).json();
                if (res.status === 'success') gid('form-equipment-id').value = res.new_id;
                else Swal.fire('Error', res.message, 'error');
            } catch (e) { console.error(e); } 
            finally { btn.innerText = oldText; btn.disabled = false; }
        }

        window.checkDuplicateAssetId = async function() {
            const id = gid('form-equipment-id').value.trim();
            const dbId = document.querySelector('input[name="db_id"]').value;
            
            if (!id) {
                Swal.fire('แจ้งเตือน', 'กรุณาระบุรหัสพัสดุ', 'warning');
                return;
            }

            try {
                const res = await fetch(`${apiPath}?action=check_duplicate_asset&equipment_id=${encodeURIComponent(id)}&db_id=${dbId}`);
                const data = await res.json();
                
                if (data.status === 'success') {
                    if (data.is_duplicate) {
                        Swal.fire('ซ้ำ!', `รหัส ${id} มีอยู่ในระบบแล้ว`, 'error');
                    } else {
                        Swal.fire('ใช้งานได้', `รหัส ${id} สามารถใช้งานได้ (ไม่ซ้ำ)`, 'success');
                    }
                } else {
                    throw new Error(data.message);
                }
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
            }
        }

        window.openTransferModal = async function(db_id, current_company, isSet = false) {
            const title = isSet ? 'โอนย้ายทรัพย์สินทั้งชุด' : 'โอนย้ายทรัพย์สิน';
            const text = isSet ? 'การกระทำนี้จะโอนย้ายทรัพย์สินหลักและอุปกรณ์ในชุดทั้งหมดไปยังบริษัทใหม่' : 'โอนย้ายทรัพย์สินนี้ไปยังบริษัทอื่น';

            const { value: formValues } = await Swal.fire({
                title: title,
                html: `
                    <p class="text-sm text-slate-500 mb-4">${text}</p>
                    <select id="swal-company" class="swal2-input">
                        <option value="PTA" ${current_company === 'PTA' ? 'disabled' : ''}>PTA</option>
                        <option value="PT4" ${current_company === 'PT4' ? 'disabled' : ''}>PT4</option>

                    </select>
                    <textarea id="swal-reason" class="swal2-textarea" placeholder="เหตุผลในการโอนย้าย..."></textarea>
                `,
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonText: 'ยืนยันการโอนย้าย',
                preConfirm: () => {
                    return {
                        company: document.getElementById('swal-company').value,
                        reason: document.getElementById('swal-reason').value
                    }
                }
            });

            if (formValues) {
                const fd = new FormData();
                fd.append('action', 'transfer_asset');
                fd.append('db_id', db_id);
                fd.append('new_company', formValues.company);
                fd.append('reason', formValues.reason);
            if (isSet) {
                fd.append('transfer_set', '1');
            }

                try {
                    const res = await fetch(apiPath, { method: 'POST', body: fd });
                    const json = await res.json();
                    if (json.status !== 'success') throw new Error(json.message);
                    
                    Toast.fire({ icon: 'success', title: 'โอนย้ายสำเร็จ!' });

        window.showAssetDetailsModal = function(db_id) {
            const item = data.it_assets.find(i => i.db_id == db_id);
            if (!item) {
                Swal.fire('Error', 'Asset not found', 'error');
                return;
            }

            gid('details-modal-title').textContent = String(item['ชื่ออุปกรณ์'] || 'Asset Details');
            const body = gid('details-modal-body');
            const transferBtn = gid('transfer-btn');
            const transferSetBtn = gid('transfer-set-btn');
            const repairBtn = gid('repair-btn');

            const childAssets = data.it_assets.filter(a => a.parent_id == item.db_id);

            // Setup transfer button
            transferBtn.classList.remove('hidden');
            transferBtn.onclick = () => openTransferModal(item.db_id, item.company, false);

            if (childAssets.length > 0) {
                transferSetBtn.classList.remove('hidden');
                transferSetBtn.onclick = () => openTransferModal(item.db_id, item.company, true);
            } else {

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const fd = new FormData(e.target);
            let finalFd = new FormData();

            if (activeTab === 'it_assets') { // ✅ Handle IT Assets
                finalFd = fd;
                finalFd.append('action', 'save_equipment');
            } 
            else if (activeTab === 'employees') {
                finalFd = fd;
                finalFd.append('action', isEditing ? 'update_employee' : 'add_employee');
                if (!fd.has('is_executive')) finalFd.append('is_executive', '0');
                if (!fd.has('is_management')) finalFd.append('is_management', '0');
                if (!fd.has('is_technician')) finalFd.append('is_technician', '0');
                const isExecutiveFlag = String(fd.get('is_executive') || '') === '1';
                const isManagementFlag = String(fd.get('is_management') || '') === '1';
                const isTechnicianFlag = String(fd.get('is_technician') || '') === '1';
                const allowEmptyAssignments = isExecutiveFlag || isManagementFlag;

                const assignmentsRaw = Array.from(document.querySelectorAll('.assignment-row')).map(row => ({
                    company: (row.querySelector('.assignment-company')?.value || '').trim(),
                    department: (row.querySelector('.assignment-department')?.value || '').trim(),
                    email: (row.querySelector('.assignment-email')?.value || '').trim(),
                    is_primary: row.querySelector('.assignment-primary')?.checked ? 1 : 0,
                }));

                const errors = [];
                const assignments = assignmentsRaw.filter(a => {
                    if (!a.company && !a.department && !a.email) return false;
                    if (!a.company) {
                        errors.push('ทุกสังกัดต้องระบุบริษัท');
                        return false;
                    }
                    if (!a.department && !allowEmptyAssignments) {
                        errors.push('ทุกสังกัดต้องระบุแผนก (ยกเว้นผู้บริหาร/ระดับ Management)');
                        return false;
                    }
                    return true;
                });

                if (!assignments.length && !allowEmptyAssignments) {
                    errors.push('กรุณาระบุอย่างน้อย 1 สังกัด');
                }
                if (!assignments.length && isTechnicianFlag) {
                    errors.push('ทีมช่างต้องมีอย่างน้อย 1 สังกัด');
                }

                if (assignments.length) {
                    let primaryCount = assignments.reduce((sum, a) => sum + (a.is_primary ? 1 : 0), 0);
                    if (primaryCount === 0) {
                        assignments[0].is_primary = 1;
                        primaryCount = 1;
                    }
                    if (primaryCount > 1) {
                        errors.push('เลือกสังกัดหลักได้เพียง 1 รายการ');
                    }
                }

                if (errors.length) {
                    Swal.fire('แจ้งเตือน', errors[0], 'warning');
                    return;
                }

                finalFd.append('assignments', JSON.stringify(assignments));
            }
            else if (activeTab === 'locations') {
                const name = (fd.get('name') || '').trim();
                if (!name) { Swal.fire('Error', 'ชื่อสถานที่ไม่สามารถเว้นว่างได้', 'error'); return; }
                finalFd = fd;
                finalFd.append('action', 'save_location');
            }
            else {
                let obj = {}; fd.forEach((v,k)=>obj[k]=v);
                // ✅ เพิ่มการจัดการข้อมูลสำหรับ Meeting Rooms และ Amenities
                // ✅ เพิ่มการจัดการข้อมูลสำหรับ KB Articles
                if (activeTab === 'kb_articles') {
                    obj.is_published = obj.is_published ? 1 : 0;
                    obj.author_id = sessionStorage.getItem('user_id'); // ดึง user_id จาก session storage
                }
                if (activeTab === 'announcements') {
                    if (fd.get('no_expire') === '1') {
                        obj.expirationDate = '';
                    } else {
                        obj.expirationDate = String(obj.expirationDate || '').trim();
                    }
                    delete obj.no_expire;
                }

                finalFd.append('action', isEditing ? 'update_item' : 'add_item');
                finalFd.append('key', activeTab);
                finalFd.append('data', JSON.stringify(obj));
            }

            try {
                if (activeTab === 'employees') {
                    const posName = String(finalFd.get('position') || '').trim();
                    if (posName) {
                        const fdPos = new FormData();
                        fdPos.append('action', 'save_job_position');
                        fdPos.append('name', posName);
                        await fetch(apiPath, { method: 'POST', body: fdPos });
                    }
                }
                const res = await (await fetch(apiPath, { method:'POST', body:finalFd })).json();
                if(res.status==='success') {
                    Toast.fire({ icon:'success', title:'Saved!' });
                    closeModal();
                    await loadAllData();
                    renderContent();
                } else throw new Error(res.message);
            } catch(err) { Swal.fire('Error', err.message, 'error'); }
        }

        window.deleteItem = async function(id) {
            const {isConfirmed} = await Swal.fire({ title:'Are you sure?', icon:'warning', showCancelButton:true, confirmButtonColor:'#ef4444' });
            if(isConfirmed) {
                const item = data[activeTab].find(i => i.id==id || i.db_id==id || i.cat_id==id || i.dept_id==id || i.date==id);
                
                if (!item) {

                if(activeTab === 'it_assets') realId = item.db_id;

                const fd = new FormData();

            }

        async function uploadAndInsertKbImage(event) {
            const fileInput = document.getElementById('kb-image-upload');
            const file = fileInput.files[0];
            const textarea = document.getElementById('kb-content-textarea');

            if (!file) {
                Swal.fire('No file selected', 'Please choose an image to upload.', 'warning');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            const formData = new FormData();
            formData.append('action', 'upload_kb_image');
            formData.append('kb_image', file);

            try {
                const res = await fetch(apiPath, { method: 'POST', body: formData });
                const result = await res.json();

                if (result.status === 'success') {
                    const markdown = `\n\n!${file.name}\n\n`;
                    const cursorPos = textarea.selectionStart;
                    const textBefore = textarea.value.substring(0, cursorPos);
                    const textAfter = textarea.value.substring(cursorPos, textarea.value.length);
                    textarea.value = textBefore + markdown + textAfter;
                    
                    fileInput.value = '';
                    Toast.fire({ icon: 'success', title: 'Image inserted!' });
                } else {
                    throw new Error(result.message);
                }
            } catch (e) {
                Swal.fire('Upload Error', e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Insert';
            }
        }

        }

        // 2. ใช้ Swal แสดงหน้าต่าง Preview
        Swal.fire({
            title: `<strong>QR Code: ${title}</strong>`,
            html: `
                <div id="print-area" class="flex flex-col items-center justify-center p-4 border-2 ${borderClass} rounded-lg w-fit mx-auto mt-2 bg-white text-black">
                    <div class="text-xs font-bold uppercase tracking-wider mb-1">${label}</div>

            confirmButtonText: '<i class="fas fa-print"></i> พิมพ์สติ๊กเกอร์',

    window.printSticker = function() {

            const canvas = qrDiv.querySelector('canvas');
            if (canvas) {
                codeImgHtml = `<img src="${canvas.toDataURL()}" style="width: 128px; height: 128px;">`;
