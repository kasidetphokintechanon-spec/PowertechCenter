                                if (!label) return;
                                const fd = new FormData();
                                fd.append('action','save_item_sc'); fd.append('id',id); fd.append('room_id',roomId);
                                fd.append('label',label); fd.append('input_type',type); fd.append('threshold',thresh);
                                try {
                                    const rs = await fetch(apiPath,{method:'POST',body:fd});
                                    const js = await rs.json();
                                    if (js.status!=='success') throw new Error(js.message||'Error');
                                    const btn = row.querySelector('[data-save]');
                                    if (btn) { btn.style.background='#d1fae5'; btn.style.color='#065f46'; btn.textContent='✓'; setTimeout(()=>{btn.style.background='#e0f2fe';btn.style.color='#0369a1';btn.textContent='บันทึก';},1200); }
                                } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                            });

                            row.querySelector('[data-del]')?.addEventListener('click', async () => {
                                const label = String(row.querySelector(`[data-name="${id}"]`)?.value||'').trim();
                                const ok = await Swal.fire({title:'ลบรายการตรวจ?',text:`"${label}" — ประวัติเก่ายังเก็บไว้ครบ`,icon:'warning',showCancelButton:true,confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#dc2626'});
                                if (!ok.isConfirmed) return;
                                const fd = new FormData();
                                fd.append('action','delete_item_sc'); fd.append('id',id);
                                try {
                                    const rs = await fetch(apiPath,{method:'POST',body:fd});
                                    const js = await rs.json();
                                    if (js.status!=='success') throw new Error(js.message||'Error');
                                    await render(); Toast.fire({icon:'success',title:'ลบแล้ว'});
                                    await loadAllData(); renderContent();
                                } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                            });
                        });
                    } catch(e) { listEl.innerHTML = `<div style="font-size:12px;color:#ef4444;padding:8px">${escapeHtml(e.message)}</div>`; }
                };

                const doAdd = async () => {
                    const label = String(newLabelEl?.value||'').trim();
                    const type  = newTypeEl?.value || 'status';
                    const thresh = type === 'days' ? (newThreshEl?.value || '') : '';
                    if (!label) { newLabelEl?.focus(); return; }
                    const fd = new FormData();
                    fd.append('action','save_item_sc'); fd.append('room_id',roomId);
                    fd.append('label',label); fd.append('input_type',type); fd.append('threshold',thresh);
                    try {
                        const res = await fetch(apiPath,{method:'POST',body:fd});
                        const json = await res.json();
                        if (json.status!=='success') throw new Error(json.message||'Error');
                        if (newLabelEl) newLabelEl.value='';
                        if (newThreshEl) newThreshEl.value='';
                        await render();
                        await loadAllData(); renderContent();
                        Toast.fire({icon:'success',title:'เพิ่มรายการแล้ว'});
                    } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                };
                addBtn?.addEventListener('click', doAdd);
                newLabelEl?.addEventListener('keydown', e => { if (e.key==='Enter') doAdd(); });

                await render();
            }
        });
    }

            const form = gid('dynamic-form');

    document.addEventListener('change', (e) => {
        if (e.target.id !== 'af-image-input') return;
        const box = gid('af-new-imgs');
        if (!box) return;
        box.querySelectorAll('img').forEach(i => URL.revokeObjectURL(i.src));
        box.innerHTML = [...e.target.files].map(f => `<img src="${URL.createObjectURL(f)}" alt="" title="${escapeHtml(f.name)}">`).join('');
    });
    ['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { const d = e.target.closest?.('.af-drop'); if (d) d.classList.add('over'); }));
    ['dragleave','drop'].forEach(t => document.addEventListener(t, e => { const d = e.target.closest?.('.af-drop'); if (d) d.classList.remove('over'); }));

    window.toggleAssetFormSection = function(sectionId) {
        const el = gid(sectionId);
        const btn = gid(sectionId + '-toggle');
        if (!el) return;
        const opening = el.style.display === 'none';
        el.style.display = opening ? '' : 'none';
        if (btn) btn.setAttribute('aria-expanded', opening ? 'true' : 'false');
    };
    function setAssetFieldWrapVisible(wrapId, show) {
        const el = gid(wrapId);
        if (el) el.style.display = show ? '' : 'none';
    }
    window.updateAssetRequiredMarkers = function() {
        const catId = gid('form-cat')?.value || '';
        const abbr = getAssetCategoryAbbr(catId);
        const needsComp = ['NB', 'PC', 'SV'].includes(abbr);
        const needsIp = abbr === 'NT';
        const showNetworkFields = needsComp || needsIp;
        const toggle = (markId, show, inputId) => {
            const mark = gid(markId);
            const inputEl = inputId ? gid(inputId) : null;
            if (mark) mark.style.display = show ? 'inline' : 'none';
            setAssetReqInputHighlight(inputEl, show);
        };
        toggle('req-mark-serial', needsComp, 'form-serial');
        toggle('req-mark-hostname', needsComp, 'form-hostname');
        toggle('req-mark-ip', needsIp, 'form-ip');
        setAssetFieldWrapVisible('asset-field-wrap-hostname', needsComp || !abbr);
        setAssetFieldWrapVisible('asset-field-wrap-ip', showNetworkFields || !abbr);
        setAssetFieldWrapVisible('asset-field-wrap-mac', showNetworkFields || !abbr);
        const bundleSec = gid('asset-section-bundle');
        const hasParent = !!String(gid('form-parent-id')?.value || '').trim();
        const hasChildren = String(gid('asset-has-children')?.value || '') === '1';
        if (bundleSec) bundleSec.style.display = (abbr === 'PC' || hasParent || hasChildren) ? '' : 'none';
        ['form-company', 'form-dept', 'form-cat', 'form-location'].forEach(id => {
            const el = gid(id);
            if (el) setAssetReqInputHighlight(el, true);
        });
        const nameEl = document.querySelector('#dynamic-form input[name="name"]');
        if (nameEl) setAssetReqInputHighlight(nameEl, true);
    };
    window.initAssetRequiredFieldHints = function() { updateAssetRequiredMarkers(); };
    window.validateAssetRegistryForm = function(fd) {
        const name = String(fd.get('name') || '').trim();
        const company = String(fd.get('company') || '').trim();
        const dept = String(fd.get('owning_department') || '').trim();
        const catId = String(fd.get('asset_category') || '').trim();
        const location = String(fd.get('location') || '').trim();
        const serial = String(fd.get('serial_number') || '').trim();
        const hostname = String(fd.get('hostname') || '').trim();
        const ip = String(fd.get('ip_address') || '').trim();
        const abbr = getAssetCategoryAbbr(catId);
        if (!name) return 'กรุณาระบุชื่ออุปกรณ์';
        if (!company) return 'กรุณาเลือกบริษัท';
        if (!dept) return 'กรุณาเลือกแผนก';
        if (!catId) return 'กรุณาเลือกหมวดหมู่';
        if (!location) return 'กรุณาระบุ Location';
        if (['NB', 'PC', 'SV'].includes(abbr)) {
            if (!serial) return `${abbr} ต้องระบุ Serial Number`;
            if (!hostname) return `${abbr} ต้องระบุชื่อเครื่อง (Hostname)`;
        }
        if (abbr === 'NT' && !ip) return 'Network ต้องระบุ IP Address';
        const custType = String(fd.get('custodian_type') || 'person');
        if (custType === 'department') {
            const custDept = String(fd.get('custodian_dept_id') || fd.get('owning_department') || '').trim();
            if (!custDept) return 'กรุณาเลือกแผนกผู้ถือครอง (ใช้ร่วมกัน)';
        }
        return '';
    };
    window.onBorrowerInput = function(term) {
        if (!String(term || '').trim()) {
            const hidId = gid('form-custodian-employee-id');
            const hidBorrowerId = gid('form-borrower-id');
            const hidDept = gid('form-custodian-department');
            if (hidId) hidId.value = '';
            if (hidBorrowerId) hidBorrowerId.value = '';
            if (hidDept) hidDept.value = '';
        }
        searchBorrower(term);
    };
    const searchBorrowerDebounced = debounce(function(term) { searchBorrowerNow(term); }, 180);
    window.searchBorrower = function(term) { searchBorrowerDebounced(term); };
    window.searchBorrowerNow = function(term) {
        const resDiv=gid('borrower-results'); if(!resDiv) return;
        const lowerTerm=term?term.toLowerCase():'';
        const matches=data.employees.filter(e=>!lowerTerm||(e.name&&e.name.toLowerCase().includes(lowerTerm))||(e.name_th&&e.name_th.toLowerCase().includes(lowerTerm))||(e.id&&e.id.toLowerCase().includes(lowerTerm))).slice(0,10);
        if (matches.length===0) { resDiv.innerHTML='<div style="padding:12px;font-size:13px;color:#94a3b8;text-align:center">ไม่พบข้อมูล</div>'; }
        else {
            resDiv.innerHTML=matches.map(e=>{
                const img=e.image?`uploads/employees/${e.image}`:`https://ui-avatars.com/api/?name=${encodeURIComponent(e.name)}&background=random&color=fff&size=32`;
                const primaryAssign=(e.assignments&&e.assignments.find(a=>a.is_primary==1))||(e.assignments&&e.assignments[0]);
                const deptName=primaryAssign?primaryAssign.department:'';
                const safeName = escapeHtml(e.name || '');
                const safeId = escapeHtml(String(e.id || ''));
                const safeDept = escapeHtml(String(deptName || ''));
                return `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #f1f5f9" onmouseenter="this.style.background='#f8fafc'" onmouseleave="this.style.background=''" data-name="${safeName}" data-id="${safeId}" data-dept="${safeDept}" onclick="selectBorrowerFromEl(this)"><img src="${img}" style="width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid #e2e8f0"><div><div style="font-size:13px;font-weight:500;color:#334155">${safeName}</div><div style="font-size:11px;color:#94a3b8">${escapeHtml(e.name_th||'')} <span style="background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:10px">${safeId}</span>${deptName?`<span style="margin-left:4px;color:#6366f1">(${safeDept})</span>`:''}</div></div></div>`;
            }).join('');
        }
        resDiv.style.display='block';
    };
    window.selectBorrowerFromEl = function(el) {
        selectBorrower(el?.dataset?.name || '', el?.dataset?.id || '', el?.dataset?.dept || '');
    };
    window.selectBorrower = function(name, empId, dept) {
        const input=gid('form-borrower'); if(input)input.value=name||'';
        const hidId=gid('form-custodian-employee-id'); if(hidId)hidId.value=empId||'';
        const hidBorrowerId=gid('form-borrower-id'); if(hidBorrowerId)hidBorrowerId.value=empId||'';
        const hidDept=gid('form-custodian-department'); if(hidDept)hidDept.value=dept||'';
        const resDiv=gid('borrower-results'); if(resDiv)resDiv.style.display='none';
        // เลือกผู้ถือแล้ว เครื่องไม่ "ว่าง" อีกต่อไป
        const st=gid('form-status'); if(st && name && st.value==='ว่าง') st.value='ใช้งานปกติ';
    }
    document.addEventListener('click', (e) => {
        if (e.target.id!=='form-borrower'&&!e.target.closest('#borrower-results')) {
            const res=document.getElementById('borrower-results'); if(res)res.style.display='none';
        }
    });

    function filtAssets() {
        const term=(gid('search-input').value||'').toLowerCase(); const cat=gid('filter-category').value;
        const stat=gid('filter-status').value; const co=gid('filter-company').value;
        const setupFilter = gid('filter-setup-status')?.value || '';
        return (data.it_assets||[]).filter(i=>{
            const txt=(String(i['ID อุปกรณ์']||'')+String(i['ชื่ออุปกรณ์']||'')+String(i['Serial Number']||'')+String(i.asset_id||'')+String(i.ip_address||'')+String(i.mac_address||'')+JSON.stringify(i.accessories||[])).toLowerCase();
            const isSetupDone = setupStatusMap[i['ID อุปกรณ์']||i.equipment_id||''] === 'active';
            const matchesSetup = !setupFilter || (setupFilter === 'done' ? isSetupDone : !isSetupDone);
            return (!term||txt.includes(term))&&(!cat||i['หมวดหมู่']===cat)&&(!stat||i['สถานะ']===stat)&&(!co||i.company===co)&&matchesSetup;
        });
    }

    // ═══════════════════════════════════════════════════════════
    // REPAIR MODAL
    // ═══════════════════════════════════════════════════════════
    var _repairItem = null;

    window.openRepairModalById = function(dbId) {
        const item = (data.it_assets || []).find(i => String(i.db_id) === String(dbId));
        if (item) openRepairModal(item);
    };

    window.openRepairModal = function(item) {
        _repairItem = item || {};
        const assetId   = String(item['ID อุปกรณ์'] || item.asset_id || '');
        const assetName = String(item['ชื่ออุปกรณ์'] || '');
        const serial    = String(item['Serial Number'] || item.serial_number || '');
        const cat       = String(item['หมวดหมู่'] || '');
        const dept      = String(item.owning_department_name || item.owning_department || '');
        const loc       = String(item.location || '');
        const company   = String(item.company || '');

        // Subtitle
        gid('repair-modal-subtitle').textContent = assetId + (assetName ? '  ·  ' + assetName : '');

        // Asset strip
        const strip = gid('repair-asset-strip');
        const infoItems = [
            ['รหัสพัสดุ', assetId],
            ['ชื่ออุปกรณ์', assetName || '—'],
            ['หมายเลขเครื่อง (S/N)', serial || '—'],
            ['หมวดหมู่', cat || '—'],
            ['แผนก', dept || '—'],
            ['บริษัท / สถานที่', (company ? company : '') + (loc && !/^(PTA|PT4|PTE)$/i.test(loc) ? (company ? ' · ' : '') + loc : '') || '—'],
        ];
        strip.innerHTML = infoItems.map(([l, v]) =>
            `<div><span style="font-size:11px;font-weight:600;color:var(--text-tertiary)">${escapeHtml(l)}</span><div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-top:1px">${escapeHtml(v)}</div></div>`
        ).join('');

        // Defaults
        const today = new Date().toISOString().slice(0,10);
        gid('repair-date').value = today;
        gid('repair-status').value = 'Pending';
        gid('repair-problem').value = '';
        gid('repair-solution').value = '';

        // Pre-fill IT staff name from session
        const sess = window.adminSession || {};
        const staffName = sess.display_name || sess.username || '';
        gid('repair-serviced-by').value = staffName;

        gid('repair-modal').style.display = '';
        if (typeof activateModalA11y === 'function') activateModalA11y(gid('repair-modal'), closeRepairModal);
        setTimeout(() => gid('repair-problem').focus(), 80);
    };

    window.closeRepairModal = function() {
        gid('repair-modal').style.display = 'none';
        if (typeof deactivateModalA11y === 'function') deactivateModalA11y();
        _repairItem = null;
    };

    window.saveRepairTicket = function() {
        const assetId  = String(_repairItem['ID อุปกรณ์'] || _repairItem.asset_id || '').trim();
        const problem  = gid('repair-problem').value.trim();
        const solution = gid('repair-solution').value.trim();
        const status   = gid('repair-status').value;
        const servicedBy = gid('repair-serviced-by').value.trim() || 'IT';
        const dateStr  = gid('repair-date').value;

        if (!assetId || !problem) {
            Swal.fire({ icon:'warning', title:'กรุณากรอกข้อมูล', text:'ต้องระบุ Asset ID และอาการเสีย', confirmButtonColor:'#dc2626' });
            return;
        }

        const saveBtn = gid('repair-save-btn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังบันทึก...';

        const fd = new FormData();
        fd.append('asset_id',   assetId);
        fd.append('problem',    problem);
        fd.append('solution',   solution);
        fd.append('status',     status);
        fd.append('servicedBy', servicedBy);
        fd.append('date',       dateStr);

        fetch(apiPath + '?action=create_repair', { method:'POST', body:fd })
            .then(r => r.json())
            .then(res => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-save" style="margin-right:5px"></i>บันทึกงานซ่อม';
                if (res.status === 'success') {
                    const jobNo = res.job_no || ('RPR-' + res.id);
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกเรียบร้อย',
                        html: `<div style="font-size:14px">เลขงาน: <b style="font-family:monospace;color:#dc2626">${escapeHtml(jobNo)}</b></div>`,
                        confirmButtonColor: '#dc2626',
                        confirmButtonText: 'ตกลง',
                        showDenyButton: true,
                        denyButtonText: 'พิมพ์ใบซ่อม',
                        denyButtonColor: '#2563eb',
                    }).then(r2 => {
                        if (r2.isDenied) {
                            _repairLastJobNo = jobNo;
                            printRepairTicket(jobNo);
                        }
                    });
                    closeRepairModal();
                } else {
                    Swal.fire({ icon:'error', title:'เกิดข้อผิดพลาด', text: res.message || 'ไม่สามารถบันทึกได้', confirmButtonColor:'#dc2626' });
                }
            })
            .catch(err => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-save" style="margin-right:5px"></i>บันทึกงานซ่อม';
                Swal.fire({ icon:'error', title:'Network Error', text: String(err), confirmButtonColor:'#dc2626' });
            });
    };

    var _repairLastJobNo = '';

    // ใบแจ้งซ่อมจากทะเบียนพัสดุ = ใบงานซ่อมมาตรฐานเดียวกับหน้าช่าง (js/ticket-print.js)
    window.printRepairTicket = function(jobNoOverride) {
        const item = _repairItem || {};
        const v = id => (gid(id)?.value || '').trim();
        TicketPrint.print({
            id: jobNoOverride || _repairLastJobNo || '',
            company: item.company || '', date: v('repair-date') || new Date().toISOString().slice(0, 10),
            status: v('repair-status') || 'Pending', requester: v('repair-serviced-by') || '', department: item.owning_department_name || '',
            servicedBy: v('repair-serviced-by'), type: item['หมวดหมู่'] || '', urgency: 'ปกติ',
            asset_id: item['ID อุปกรณ์'] || item.asset_id || '', problem: v('repair-problem'), solution: v('repair-solution'),
        }, { includeImages: false });
    };

    window.exportEmployees = function() {
        const co=gid('filter-emp-company').value; const search=gid('search-input').value;
        let url=`${apiPath}?action=export_employees`;
        if(co) url+=`&company=${encodeURIComponent(co)}`; if(search) url+=`&search=${encodeURIComponent(search)}`;
        window.location.href=url;
    }

    window.printEmployeeDirectory = function() {
        const co=gid('filter-emp-company').value;
        let items=data.employees.filter(e=>e.employment_status==='active');
        if (co) items=items.filter(e=>e.assignments&&e.assignments.some(a=>a.company===co));
        items.sort((a,b)=>{
            const assignA=a.assignments.find(x=>x.is_primary)||a.assignments[0]||{};
            const assignB=b.assignments.find(x=>x.is_primary)||b.assignments[0]||{};
            if ((assignA.company||'')!==( assignB.company||'')) return (assignA.company||'').localeCompare(assignB.company||'');
            if ((assignA.department||'')!==(assignB.department||'')) return (assignA.department||'').localeCompare(assignB.department||'');
            return (a.name||'').localeCompare(b.name||'');
        });
        const rows=items.map(e=>{
            const pa=(e.assignments&&e.assignments.find(a=>a.is_primary==1))||(e.assignments&&e.assignments[0])||{};
            return `<tr><td>${escapeHtml(e.id)}</td><td>${escapeHtml(e.name)}</td><td>${escapeHtml(e.name_th||'')}</td><td>${escapeHtml(e.position||'-')}</td><td>${escapeHtml(pa.department||'-')}</td><td>${escapeHtml(pa.company||'-')}</td></tr>`;
        }).join('');
        const win=window.open('','','width=900,height=700');
        win.document.write(`<html><head><title>Employee Directory</title><style>body{font-family:Arial,sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;font-size:12px;}th,td{border:1px solid #ccc;padding:6px 10px;text-align:left;}th{background:#f1f5f9;font-weight:700;}tr:nth-child(even){background:#f8fafc;}</style></head><body class="ptc-unified-v1"><h2 style="margin-bottom:16px">Employee Directory${co?' — '+co:''}</h2><table><thead><tr><th>ID</th><th>Name (EN)</th><th>Name (TH)</th><th>Position</th><th>Department</th><th>Company</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);
        win.document.close(); setTimeout(()=>win.print(),400);
    }

</script>
