<head>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: { sans: ['Inter', 'Kanit', '-apple-system', 'sans-serif'] },
                extend: {
                    colors: {
                        brand: { DEFAULT: '#2563eb', light: '#eff6ff', dark: '#1d4ed8' }
                    }
                }
            }
        };
    </script>
    <script>(function(){const t=localStorage.getItem('theme')||'light';if(t==='dark')document.documentElement.classList.add('dark','dark-theme');})();</script>
    <style>
        /* page-specific only */
        @keyframes ptc-shimmer {
            0%   { background-position: -200% 0; }
            100% { background-position:  200% 0; }
        }
        .ptc-skel {
            background: linear-gradient(90deg, var(--ptc-surface-3,#f1f5f9) 25%, var(--ptc-surface-2,#f8fafc) 50%, var(--ptc-surface-3,#f1f5f9) 75%);
            background-size: 200% 100%;
            animation: ptc-shimmer 1.4s infinite linear;
            border-radius: 4px;
        }
        .ptc-table tbody tr:focus-visible {
            outline: 2px solid var(--ptc-primary, #2563eb);
            outline-offset: -2px;
            background: var(--ptc-primary-light, #eff6ff) !important;
        }
        .tree-container { padding-left: 1rem; }
        .tree-node { margin-left: 1.5rem; border-left: 2px dashed var(--ptc-border); }
        .tree-node .card-content { border-radius: 0.5rem; }
        .tree-node:last-child { border-left: none; }

        .asset-thumb-wrapper { width: 3rem; height: 3rem; flex-shrink: 0; }
        .asset-thumb { width: 100%; height: 100%; object-fit: cover; }
        .asset-main-image { width: 100%; height: auto; max-height: 340px; object-fit: contain; border-radius: var(--ptc-radius-md); }
        @media (max-width: 768px) { .asset-main-image { max-height: 260px; } }

        /* Asset edit form */
        .ptc-modal-dialog--asset { max-width:780px !important; width:100%; }
        /* Audit dashboard */
        .audit-round-hd{background:var(--ptc-surface-2);border:1px solid var(--ptc-border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
        .audit-round-title{display:flex;align-items:center;font-size:14px;font-weight:700;color:var(--ptc-text);margin-bottom:2px}
        .audit-round-meta{font-size:12px;color:var(--ptc-text-muted)}
        .audit-prog{height:5px;background:var(--ptc-border);border-radius:99px;margin:8px 0 2px;overflow:hidden}
        .audit-prog-bar{height:100%;background:var(--ptc-primary);border-radius:99px;transition:width .4s}
        .audit-token-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;margin-bottom:4px;background:var(--ptc-surface);border:1px solid var(--ptc-border)}
        .audit-token-row:hover{background:var(--ptc-surface-2)}
        .audit-status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .audit-status-dot.pending{background:#f59e0b}
        .audit-status-dot.confirmed{background:#10b981}
        .audit-status-dot.partial{background:#3b82f6}
        .audit-emp-name{flex:1;font-size:13px;font-weight:600;color:var(--ptc-text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .audit-status-txt{font-size:11.5px;color:var(--ptc-text-muted);margin-right:4px;white-space:nowrap}
        .audit-copy-btn{padding:4px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--ptc-border);background:var(--ptc-surface);color:var(--ptc-primary);border-radius:6px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .12s}
        .audit-copy-btn:hover{background:var(--ptc-primary);color:#fff;border-color:var(--ptc-primary)}
        .audit-copy-btn.copied{background:#10b981;color:#fff;border-color:#10b981}
        .asset-form-shell { max-height:65vh; overflow-y:auto; padding-right:4px; }
        .ptc-section-hd { font-size:11.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; margin:0 0 14px; padding:7px 12px 7px 12px; border-radius:8px; border-left:3px solid; display:flex; align-items:center; gap:8px; }
        .ptc-section-hd.s-blue   { color:#1d4ed8; background:#eff6ff; border-left-color:#2563eb; }
        .ptc-section-hd.s-violet { color:#6d28d9; background:#f5f3ff; border-left-color:#7c3aed; }
        .ptc-section-hd.s-green  { color:#065f46; background:#ecfdf5; border-left-color:#059669; }
        .ptc-section-hd.s-amber  { color:#92400e; background:#fffbeb; border-left-color:#d97706; }
        html.dark .ptc-section-hd.s-blue   { color:#93c5fd; background:#1e3a5f33; border-left-color:#3b82f6; }
        html.dark .ptc-section-hd.s-violet { color:#c4b5fd; background:#2e1a6033; border-left-color:#8b5cf6; }
        html.dark .ptc-section-hd.s-green  { color:#6ee7b7; background:#06443333; border-left-color:#10b981; }
        html.dark .ptc-section-hd.s-amber  { color:#fcd34d; background:#45260033; border-left-color:#f59e0b; }
        .ptc-form-grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-bottom:12px; }
        .ptc-form-grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:12px; }
        .ptc-form-span-all { grid-column:1/-1; }
        @media (max-width:640px) { .ptc-form-grid-3, .ptc-form-grid-2 { grid-template-columns:1fr; } }
        .ptc-collapse-btn { display:flex; align-items:center; justify-content:space-between; width:100%; background:var(--ptc-surface-2); border:1px solid var(--ptc-border); border-radius:var(--ptc-radius-md); padding:10px 14px; font-size:13px; font-weight:600; color:var(--ptc-text-2); cursor:pointer; margin:10px 0 0; font-family:inherit; text-align:left; transition:background .12s; border-left-width:3px; }
        .ptc-collapse-btn:hover { background:var(--ptc-surface-3); }
        .ptc-collapse-btn.s-green { border-left-color:#059669; color:#065f46; }
        .ptc-collapse-btn.s-amber { border-left-color:#d97706; color:#92400e; }
        html.dark .ptc-collapse-btn.s-green { border-left-color:#10b981; color:#6ee7b7; }
        html.dark .ptc-collapse-btn.s-amber { border-left-color:#f59e0b; color:#fcd34d; }
        .ptc-collapse-chevron { transition:transform .15s; color:var(--ptc-text-faint); font-size:11px; }
        .ptc-collapse-btn[aria-expanded="true"] .ptc-collapse-chevron { transform:rotate(180deg); }
        .ptc-req-hint { font-size:11px; color:var(--ptc-text-muted); margin:0 0 12px; }
        .ptc-req-mark { color:var(--ptc-danger); font-weight:700; margin-left:2px; }
        .ptc-custodian-opt { display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; color:var(--ptc-text-2); }
        .svc-help, .asset-form-help { font-size:11px; color:var(--ptc-text-muted); margin-top:4px; line-height:1.45; }
        .ptc-child-row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 10px; background:var(--ptc-surface); border-radius:var(--ptc-radius-sm); border:1px solid var(--ptc-border); font-size:13px; }
        .ptc-borrower-dropdown { display:none; position:absolute; z-index:20; width:100%; max-width:480px; margin-top:4px; background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:var(--ptc-radius-sm); box-shadow:var(--ptc-shadow-md); max-height:200px; overflow-y:auto; }
        .input-asset-req-empty { border-color:#f87171 !important; box-shadow:0 0 0 1px #fecaca !important; }
        .ptc-code-input { font-family:ui-monospace,monospace; font-weight:700; }
        .ptc-form-footnote { font-size:11px; color:var(--ptc-text-faint); margin-top:10px; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--ptc-border-strong); border-radius: 3px; }

        /* Sidebar nav items */
        .snav-section-label {
            padding: 14px 12px 4px; font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .08em;
            color: var(--ptc-text-faint);
        }
        .snav-item {
            display: flex; align-items: center; gap: 9px;
            padding: 7px 12px; border-radius: var(--ptc-radius-sm); margin: 1px 6px;
            font-size: 13px; font-weight: 500; color: var(--ptc-text-muted);
            cursor: pointer; transition: all .12s; text-decoration: none;
            background: transparent; border: none; width: calc(100% - 12px);
            text-align: left; font-family: inherit;
        }
        .snav-item i { width: 16px; text-align: center; font-size: 12px; flex-shrink: 0; }
        .snav-item:hover { background: var(--ptc-surface-3); color: var(--ptc-text); }
        .snav-item.active {
            background: var(--ptc-primary-light); color: var(--ptc-primary); font-weight: 600;
            border-right: 3px solid var(--ptc-primary);
        }
        .snav-badge {
            margin-left: auto; background: var(--ptc-danger); color: #fff;
            font-size: 10px; font-weight: 700; padding: 1px 6px;
            border-radius: 99px; flex-shrink: 0;
        }

        /* Content area cards */
        .section-card { background: var(--ptc-surface); border: 1px solid var(--ptc-border); border-radius: var(--ptc-radius-lg); overflow: hidden; }
        .section-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--ptc-border); flex-wrap: wrap; }

        /* ptc-table — overrides enterprise-theme.css: wider padding + sticky header */
        .ptc-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .ptc-table thead th {
            padding: 10px 16px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .05em;
            color: var(--ptc-text-muted); background: var(--ptc-surface-2);
            border-bottom: 1px solid var(--ptc-border); text-align: left;
            position: sticky; top: 0; z-index: 1;
        }
        .ptc-table tbody tr { transition: background .1s; }
        .ptc-table tbody tr:hover { background: var(--ptc-surface-2); }
        .ptc-table td {
            padding: 10px 16px; border-bottom: 1px solid var(--ptc-surface-3);
            color: var(--ptc-text-2); vertical-align: middle;
        }

        /* ptc-btn — not in enterprise-theme.css, defined here */
        .ptc-btn-primary { background:var(--ptc-primary);color:#fff;border:none;border-radius:var(--ptc-radius-sm);padding:7px 14px;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s; }
        .ptc-btn-primary:hover { background:var(--ptc-primary-dark); }
        .ptc-btn-ghost { background:transparent;border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-sm);padding:6px 12px;font-size:13px;font-family:inherit;font-weight:500;color:var(--ptc-text-muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .12s; }
        .ptc-btn-ghost:hover { background:var(--ptc-surface-2);border-color:var(--ptc-border-strong);color:var(--ptc-text-2); }
        .ptc-btn-sm { padding:5px 10px;font-size:12px; }

        /* ptc-modal — overrides enterprise-theme.css: blur overlay + 18px body padding */
        .ptc-modal { position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px; }
        .ptc-modal-overlay { position:absolute;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px); }
        .ptc-modal-dialog { position:relative;background:var(--ptc-surface);border-radius:var(--ptc-radius-lg);box-shadow:var(--ptc-shadow-xl);display:flex;flex-direction:column;max-height:90vh;overflow:hidden;border:1px solid var(--ptc-border); }
        .ptc-modal-header { display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--ptc-border);flex-shrink:0; }
        .ptc-modal-body { padding:18px;overflow-y:auto;flex:1; }
        .ptc-modal-section--stack { margin-bottom:0; }
        .ptc-modal-footer { display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--ptc-border);flex-shrink:0;background:var(--ptc-surface-2); }

        /* Chart cards */
        .chart-card { background:var(--ptc-surface);border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-lg);padding:18px; }

        /* App shell */
        .ptc-app-shell { display:flex;height:calc(100vh - 56px);overflow:hidden; }
        .ptc-sidebar { width:200px;flex-shrink:0;background:var(--ptc-surface);border-right:1px solid var(--ptc-border);overflow-y:auto;padding:6px 0; }
        .ptc-main-scroll { flex:1;overflow-y:auto;background:var(--ptc-bg);padding:20px; }

        /* filter bar */
        .filter-bar { display:flex;flex-wrap:wrap;align-items:center;gap:8px; }
        .filter-select { height:34px;padding:0 10px;background:var(--ptc-surface-2);border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-sm);font-size:12px;font-family:inherit;color:var(--ptc-text-2);outline:none;cursor:pointer; }
        .filter-select:focus { border-color:var(--ptc-primary);box-shadow:0 0 0 3px var(--ptc-primary-ring); }

        /* .ptc-input / .ptc-label — defined in enterprise-theme.css, not duplicated here */
        .svc-form-shell { display:flex;flex-direction:column;gap:12px; }
        .svc-form-card { border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-md);padding:12px;background:var(--ptc-surface-2); }
        .svc-form-title { font-size:11px;font-weight:700;color:var(--ptc-text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px; }
        .svc-grid-2 { display:grid;grid-template-columns:1fr 1fr;gap:10px; }
        .svc-color-wrap { display:flex;align-items:center;gap:8px; }
        .svc-color-input { height:34px;width:42px;border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-sm);background:var(--ptc-surface);padding:2px;cursor:pointer; }
        .svc-tone-preview { display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-sm);background:var(--ptc-primary-light);color:var(--ptc-primary);font-size:12px;font-weight:600; }
        .svc-tone-dot { width:8px;height:8px;border-radius:999px;background:var(--ptc-primary);flex-shrink:0; }
        .svc-help { margin-top:4px;font-size:11px;color:var(--ptc-text-faint); }
        @media (max-width: 640px) { .svc-grid-2 { grid-template-columns:1fr; } }

        /* Pager */
        .pager-wrap { display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;border-top:1px solid var(--ptc-border);background:var(--ptc-surface-2);flex-wrap:wrap; }
        .pager-info { font-size:12px;color:var(--ptc-text-muted); }
        .pager-controls { display:flex;align-items:center;gap:6px; }
        .pager-btn { height:30px;padding:0 12px;background:var(--ptc-surface);border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-xs);font-size:12px;color:var(--ptc-text-muted);cursor:pointer;transition:all .12s; }
        .pager-btn:hover:not([disabled]) { background:var(--ptc-surface-3);color:var(--ptc-text-2); }
        .pager-btn[disabled] { opacity:.4;cursor:not-allowed; }

        /* Custom scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width:6px;height:6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background:var(--ptc-border-strong);border-radius:3px; }

        /* Record count badge */
        .record-badge { display:inline-flex;align-items:center;padding:2px 8px;background:var(--ptc-primary-light);color:var(--ptc-primary);border-radius:99px;font-size:11px;font-weight:700; }

        /* ── Dashboard components (token-aware) ── */
        .dash-card { background:var(--ptc-surface);border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-lg);overflow:hidden; }
        .dash-card-hd { display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--ptc-border); }
        .dash-card-title { font-weight:700;font-size:13px;color:var(--ptc-text);display:flex;align-items:center;gap:8px; }
        .dash-stat-card { background:var(--ptc-surface);border:1px solid var(--ptc-border);border-radius:var(--ptc-radius-lg);padding:18px 20px;display:flex;align-items:center;gap:16px;transition:box-shadow .15s; }
        .dash-stat-card.is-link { cursor:pointer; }
        .dash-stat-card.is-link:hover { box-shadow:var(--ptc-shadow-md); }
        .dash-stat-value { font-size:22px;font-weight:800;color:var(--ptc-text);line-height:1; }
        .dash-stat-label { font-size:12px;color:var(--ptc-text-muted);margin-top:3px; }
        .dash-th { padding:8px 12px;text-align:left;font-size:11px;font-weight:600;color:var(--ptc-text-muted);text-transform:uppercase;border-bottom:1px solid var(--ptc-border);background:var(--ptc-surface-2); }
        .dash-td { padding:8px 12px;font-size:12px;color:var(--ptc-text-2);border-bottom:1px solid var(--ptc-surface-3); }
        .dash-td-muted { padding:8px 12px;font-size:12px;color:var(--ptc-text-muted);border-bottom:1px solid var(--ptc-surface-3); }
        .dash-td-faint { padding:8px 12px;font-size:11px;color:var(--ptc-text-faint);border-bottom:1px solid var(--ptc-surface-3); }
        .dash-td-arrow { padding:8px 12px;text-align:right;border-bottom:1px solid var(--ptc-surface-3);color:var(--ptc-text-faint); }
        .dash-td-bold { padding:8px 12px;font-size:12px;font-weight:600;color:var(--ptc-text);border-bottom:1px solid var(--ptc-surface-3); }
        .dash-tr { cursor:pointer;transition:background .1s; }
        .dash-tr:hover { background:var(--ptc-surface-2); }

        /* ── Permissions left-panel (token-aware) ── */
        .perm-panel-wrap { display:grid;grid-template-columns:220px 1fr;height:100%; }
        .perm-panel-left { border-right:1px solid var(--ptc-border);padding:12px;overflow-y:auto; }
        .perm-panel-hd { display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px; }
        .dash-kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:24px; }
        @media (max-width:1100px) { .dash-kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
        /* ── popup รายละเอียดพัสดุ (ad-*) ── */
        .ad-head { display:flex; gap:12px; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--ptc-border); }
        .ad-title { font-size:18px; font-weight:700; color:var(--ptc-text); }
        .ad-sub { font-size:12.5px; color:var(--ptc-text-muted); margin-top:2px; }
        .ad-chips { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px; }
        .ad-code { font-family:ui-monospace,Consolas,monospace; font-size:12px; font-weight:700; color:var(--ptc-primary); background:var(--ptc-primary-light); padding:3px 8px; border-radius:6px; }
        .ad-co { font-size:11px; font-weight:700; color:#fff; padding:3px 8px; border-radius:6px; background:#64748b; }
        .ad-co.PTA { background:#059669; } .ad-co.PT4 { background:#dc2626; } .ad-co.PTE { background:#2563eb; }
        .ad-status { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:99px; border:1px solid; }
        html.dark .ad-status { background:var(--ptc-surface-2) !important; }
        .ad-layout { display:grid; grid-template-columns:240px minmax(0,1fr); gap:20px; }
        .ad-img { width:100%; aspect-ratio:4/3; object-fit:contain; background:var(--ptc-surface-2); border:1px solid var(--ptc-border); border-radius:10px; }
        .ad-thumbs { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }

<script>

    var activeTab = 'dashboard';

    var setupStatusMap = {}; // asset_code -> 'active' | 'offboarded' (สถานะ Setup Checklist ล่าสุด)
    var currentDetailsAssetCode = ''; // asset_code ของ asset ที่ details modal กำลังเปิดอยู่ (ถ้ามี)

    // Lazy-load config
    const STATIC_KEYS  = new Set(['asset_categories','departments','locations','services','kb_categories']);
    const EAGER_KEYS   = ['it_assets','employees','asset_categories','departments','locations','services'];
    const TAB_EXTRA_KEYS = {
        announcements:  ['announcements'],
        holidays:       ['holidays'],
        kb_articles:    ['kb_articles','kb_categories'],
        kb_categories:  ['kb_categories'],
        permissions:    ['permissions'],
        server_check:   ['server_check'],
    };

    const _keyTs = {}; // key → timestamp last loaded

    var isEditing = false;
    var currentAccessories = [];
    var currentView = 'list';
    var statusChart = null;
    var categoryChart = null;

    const keyTitles = {
        dashboard: 'ภาพรวมระบบ',
        it_assets:'ทะเบียนพัสดุภัณฑ์',
        asset_categories:'หมวดหมู่อุปกรณ์',
        departments:'แผนก',
        locations: 'สถานที่ (Locations)',
        employees:'พนักงาน',
        job_positions:'ตำแหน่งงาน',
        announcements:'ประกาศ',
        holidays:'วันหยุด',
        services:'บริการ',
        kb_articles: 'Knowledge Base Articles',
        kb_categories: 'KB Categories',
        permissions: 'สิทธิ์ผู้ใช้ (Permissions)',
        server_check: 'Server Check — ห้อง/รายการตรวจ'
    };

    function getAdminEntryContext() {
        const params = new URLSearchParams(window.location.search || '');
        const rawTab = String(params.get('tab') || '').trim();
        const rawUser = String(params.get('user_id') || params.get('permission_user') || '').trim();
        const rawEmployeeId = String(params.get('employeeId') || params.get('emp') || '').trim();
        const rawMode = String(params.get('mode') || '').trim();
        let tab = keyTitles[rawTab] ? rawTab : '';
        if (rawUser && !tab) tab = 'permissions';
        if (rawEmployeeId && !tab) tab = 'employees';
        if (rawMode === 'add' && !tab) tab = 'employees';
        return { tab, permissionUserId: rawUser, employeeId: rawEmployeeId, employeeMode: rawMode };
    }

    const apiPath = 'api.php';
    const gid = (id) => document.getElementById(id);
    const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000, timerProgressBar: true });
    // Redirect Toast.fire → ptcToast for non-blocking bottom-right toasts
    if (window.ptcToast) {
        const _tFire = Toast.fire.bind(Toast);
        Toast.fire = function (opts) {
            if (opts && typeof opts === 'object' && opts.icon && !opts.input && !opts.html && !opts.preConfirm) {
                ptcToast.show(opts.icon, opts.title || '', opts.text || '');
                return Promise.resolve({ isConfirmed: false, isDenied: false, isDismissed: true });
            }
            return _tFire(opts);
        };
    }
    const adminEntry = getAdminEntryContext();
    if (adminEntry.tab) activeTab = adminEntry.tab;
    if (adminEntry.permissionUserId) {
        window.selectedPermissionUser = adminEntry.permissionUserId;
        window.pendingPermissionUserId = adminEntry.permissionUserId;
    }
    if (adminEntry.employeeId) window.pendingAdminEmployeeId = adminEntry.employeeId;
    if (adminEntry.employeeMode) window.pendingAdminEmployeeMode = adminEntry.employeeMode;
    let supplierCache = [];
    let supplierListenersRegistered = false;
    const defaultPositionOptions = [

        'Executive Director and General Manager For Administration Division',

        'Senior Manager',

        'Manager (Acting)',

        'Senior Technician',
        'Senior Springer',
        'Springer',
        'Staff',
        'Factory and Mainteanace'
    ];
    let jobPositionOptions = [];

    // --- Dark mode toggle ---

    async function fetchSuppliers(term = '', company = '') {
        const url = `${apiPath}?action=get_suppliers&term=${encodeURIComponent(term || '')}&company=${encodeURIComponent(company || '')}&limit=50`;
        const res = await fetch(url, { cache: 'no-store' });
        const json = await res.json();
        if (json && json.status === 'success' && Array.isArray(json.suppliers)) return json.suppliers;
        return [];
    }

    function renderSupplierDatalist(items) {
        const dl = document.getElementById('supplier-list');
        if (!dl) return;
        dl.innerHTML = (items || []).map(s => `<option value="${escapeHtml(s.name || '')}"></option>`).join('');
    }

    async function refreshSupplierDatalist(term = '') {
        const companyEl = gid('form-company');
        const company = companyEl ? companyEl.value : '';
        supplierCache = await fetchSuppliers(term, company);
        renderSupplierDatalist(supplierCache);
    }

    window.openSupplierManager = function() {
        window.open('supplier.html', '_blank');
    }

    function initSupplierField() {
        const input = gid('form-supplier');
        if (!input) return;
        if (input.dataset.inited === '1') return;
        input.dataset.inited = '1';
        const onRefresh = () => refreshSupplierDatalist(input.value || '');
        input.addEventListener('focus', onRefresh);
        input.addEventListener('input', onRefresh);
        const companyEl = gid('form-company');
        if (companyEl) companyEl.addEventListener('change', () => refreshSupplierDatalist(''));
        if (!supplierListenersRegistered) {
            supplierListenersRegistered = true;
            window.addEventListener('focus', () => {
                const supplierInput = gid('form-supplier');
                if (supplierInput) refreshSupplierDatalist(supplierInput.value || '');
            });
            window.addEventListener('storage', (e) => {
                if (e.key === 'suppliers_last_update') {
                    const supplierInput = gid('form-supplier');
                    if (supplierInput) refreshSupplierDatalist(supplierInput.value || '');
                }
            });
        }
    }

    async function loadJobPositions() {
        try {
            const res = await fetch(`${apiPath}?action=get_job_positions&v=${Date.now()}`, { cache: 'no-store' });
            const json = await res.json();
            if (json && json.status === 'success' && Array.isArray(json.positions)) {
                jobPositionOptions = json.positions.map(p => String(p.name || '').trim()).filter(Boolean);
                return;
            }
        } catch (_) {}
        jobPositionOptions = [];
    }

    function getPositionSelectOptions(selected = '') {
        const merged = [...new Set([...(jobPositionOptions.length ? jobPositionOptions : defaultPositionOptions), selected].filter(Boolean))];
        return `<option value="">เลือกตำแหน่ง</option>` + merged.map(name => `<option value="${escapeHtml(name)}"${name===selected?' selected':''}>${escapeHtml(name)}</option>`).join('');
    }

    window.saveCurrentPositionOption = async function() {
        const input = gid('form-position');
        if (!input) return;
        const name = String(input.value || '').trim();
        if (!name) { Swal.fire('แจ้งเตือน', 'กรุณาพิมพ์ชื่อตำแหน่งก่อน', 'info'); return; }
        try {
            const fd = new FormData();
            fd.append('action', 'save_job_position');
            fd.append('name', name);
            const res = await fetch(apiPath, { method: 'POST', body: fd });
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || 'Save failed');
            await loadJobPositions();
            const dl = gid('position-options-list');
            if (dl) dl.innerHTML = getPositionSelectOptions(name).replace('<option value="">เลือกตำแหน่ง</option>', '');
            Toast.fire({ icon: 'success', title: 'บันทึกตำแหน่งแล้ว' });
        } catch (e) { Swal.fire('Error', e.message, 'error'); }
    }

    window.openJobPositionManager = async function() {
        const S = (t,s='')=>`<span style="${s}">${t}</span>`;
        const html = `
        <div style="text-align:left;font-family:inherit">
            <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center">

                    <i class="fa fa-sort-amount-down"></i>บันทึกลำดับ

        await Swal.fire({
            title: 'จัดการตำแหน่งงาน', html, width: 560, showConfirmButton: false, showCloseButton: true,
            didOpen: async () => {
                const listEl = document.getElementById('jpm-list');
                const addBtn = document.getElementById('jpm-add-btn');
                const newNameEl = document.getElementById('jpm-new-name');
                const saveOrderBtn = document.getElementById('jpm-save-order-btn');
                let orderDirty = false;
                let dragSrc = null;

                const setOrderDirty = (v) => {

                    if (saveOrderBtn) {

                    try {
                        const res = await fetch(`${apiPath}?action=get_job_positions_admin&v=${Date.now()}`, { cache: 'no-store' });

                        const rows = (json?.status === 'success' && Array.isArray(json.positions)) ? json.positions : [];

    function escapeHtml(text) {
        if (!text) return text;
        return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
    }

    function getCompanyAccentBgClass(company) {
        const c = String(company || '').trim().toUpperCase();
        if (c === 'PTA') return 'bg-emerald-500';
        if (c === 'PT4') return 'bg-red-500';
        if (c === 'PTE') return 'bg-blue-500';
        return 'bg-slate-300';
    }

    function normalizeUploadUrl(url) {
        const u = String(url || '').trim();
        if (!u) return '';
        if (u.startsWith('data:') || u.startsWith('blob:')) return u;
        const idx = u.indexOf('uploads/');
        if (idx !== -1) return u.slice(idx);
        try {
            const parsed = new URL(u, window.location.href);
            const p = String(parsed.pathname || '').replace(/^\/+/, '');
            const pIdx = p.indexOf('uploads/');
            if (pIdx !== -1) return p.slice(pIdx);
        } catch (_) {}
        return u;
    }

    function getPlaceholderDataUrl(width, height, text) {
        const w = Math.max(1, parseInt(width, 10) || 1);
        const h = Math.max(1, parseInt(height, 10) || 1);
        const t = String(text || '');
        const fontSize = Math.max(10, Math.floor(Math.min(w, h) * 0.35));
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#f1f5f9"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="${fontSize}">${t}</text></svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    // ไม่มีรูป → ไอคอนจอคอมสีเทา (เดิมขึ้นคำว่า "No" ดูเหมือนบั๊ก)
    function getDevicePlaceholderUrl(w, h, caption) {
        const s = Math.min(w, h) * 0.5, x = (w - s) / 2, y = (h - s) / 2 - (caption ? h * 0.06 : 0);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><rect width="100%" height="100%" fill="#f1f5f9"/>`
            + `<g fill="none" stroke="#94a3b8" stroke-width="${Math.max(1.5, s / 14)}" stroke-linecap="round" stroke-linejoin="round">`
            + `<rect x="${x}" y="${y}" width="${s}" height="${s * 0.68}" rx="${s * 0.08}"/><path d="M${x + s * 0.35} ${y + s * 0.9}h${s * 0.3}M${w / 2} ${y + s * 0.68}v${s * 0.22}"/></g>`
            + (caption ? `<text x="50%" y="${y + s + h * 0.1}" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="${Math.max(11, h * 0.07)}">${caption}</text>` : '')
            + `</svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;

    function buildDataUrlByKey(k) {
        let url = `${apiPath}?action=${k==='it_assets'?'getEquipmentData':(k==='locations'?'get_locations':(k==='server_check'?'get_rooms_admin':'get&file='+k))}`;
        if (k === 'departments') url += `&include_management=1`;
        url += `&v=${Date.now()}`;
        return url;
    }

    async function fetchDataKey(k) {
        try {
            const cacheMode = STATIC_KEYS.has(k) ? 'default' : 'no-store';
            const res = await fetch(buildDataUrlByKey(k), { cache: cacheMode });
            const raw = await res.text();
            let j = null;
            try { j = JSON.parse(raw); } catch (_) { j = null; }
            if (!res.ok || j === null) throw new Error(`HTTP ${res.status}`);
            let arr = [];
            if (Array.isArray(j)) arr = j;
            else if (j && Array.isArray(j.data)) arr = j.data;
            else if (j && j.status === 'error') throw new Error(j.message || 'API error');
            return { key: k, items: arr, ok: true };
        } catch (err) {
            console.error(`Load failed [${k}]`, err);
            return { key: k, items: Array.isArray(data[k]) ? data[k] : [], ok: false };
        }
    }

    function normalizeLoadedData() {
        if (data.employees) {
            data.employees.forEach(emp => {
                if (typeof emp.assignments === 'string') { try { emp.assignments = JSON.parse(emp.assignments); } catch(e) { emp.assignments = []; } }
                else if (!Array.isArray(emp.assignments)) { emp.assignments = []; }
            });
        }
        if (data.services) {
            data.services.forEach(s => {
                if (s.is_active === undefined || s.is_active === null || s.is_active === '') {
                    s.is_active = 1;
                } else {
                    s.is_active = parseInt(s.is_active, 10) === 0 ? 0 : 1;
                }
            });
        }
        if (data.it_assets) {
            data.it_assets.forEach(item => {
                if (typeof item.accessories === 'string') { try { item.accessories = JSON.parse(item.accessories); } catch(e) { item.accessories = []; } }
                else if (!Array.isArray(item.accessories)) { item.accessories = []; }
                if (typeof item.images === 'string') { try { item.images = JSON.parse(item.images); } catch(e) { item.images = []; } }
                else if (!Array.isArray(item.images)) { item.images = []; }
            });
        }
    }

    window.retryFailedDataKeys = async function(keys = []) {
        const uniqueKeys = Array.from(new Set((keys || []).filter(Boolean)));
        if (!uniqueKeys.length) return;
        if (window.Swal) Swal.fire({ title: 'กำลังลองใหม่...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const retryResults = await Promise.all(uniqueKeys.map(k => fetchDataKey(k)));
        const now = Date.now();
        retryResults.forEach(r => { data[r.key] = r.items; _keyTs[r.key] = now; });
        const stillFailed = retryResults.filter(r => !r.ok).map(r => r.key);
        normalizeLoadedData(); populateDropdowns(); updateSidebarBadge(); updateWarrantyBadge();
        if (activeTab === 'it_assets') updateCharts();
        updatePageSubtitle();
        renderContent();
        if (window.Swal) {
            if (stillFailed.length) Swal.fire({ icon: 'warning', title: 'ยังมีบางแหล่งที่โหลดไม่สำเร็จ', text: stillFailed.join(', '), confirmButtonColor: '#f59e0b' });
            else if (window.ptcToast) ptcToast.success('รีโหลดสำเร็จ');
        }
    }

    window.loadAllData = async function(forceAll = false) {
        try {
            const keys = forceAll ? Object.keys(data) : EAGER_KEYS;
            const [results] = await Promise.all([
                Promise.all(keys.map(k => fetchDataKey(k))),
                loadJobPositions(),
            ]);
            const now = Date.now();
            results.forEach(r => { data[r.key] = r.items; _keyTs[r.key] = now; });
            const failedKeys = results.filter(r => !r.ok).map(r => r.key);
            normalizeLoadedData();
            populateDropdowns(); updateSidebarBadge(); updateWarrantyBadge();
            if (activeTab === 'it_assets') updateCharts();
            if (failedKeys.length > 0 && window.Swal) {
                const rs = await Swal.fire({ icon: 'warning', title: 'บางข้อมูลโหลดไม่สำเร็จ', text: `แหล่งข้อมูลที่มีปัญหา: ${failedKeys.join(', ')}`, confirmButtonText: 'ตกลง', showDenyButton: true, denyButtonText: 'Retry เฉพาะที่พัง', confirmButtonColor: '#f59e0b', denyButtonColor: '#2563eb' });
                if (rs.isDenied) await retryFailedDataKeys(failedKeys);
            }
        } catch(e) { console.error("Load Data Error:", e); }
    }

            // Loan pending badge
            const loan = ok ? (parseInt(counts.loan_pending_count) || 0) : 0;
            const badge = gid('sidebar-badge');

                if (loan > 0) { badge.textContent = loan; badge.style.display = ''; }

            // Assets รออนุมัติ badge
            const assetPending = (data.it_assets || []).filter(a => a['สถานะ'] === 'รออนุมัติ').length;
            const badgeAssets = gid('badge-assets');
            if (badgeAssets) {
                if (assetPending > 0) { badgeAssets.textContent = assetPending; badgeAssets.style.display = ''; }
                else badgeAssets.style.display = 'none';
            }

            // Permissions — users with no role assigned

        const base = String(serviceId || '').replace(/[^a-zA-Z0-9_-]/g, '_') || 'empty';

    function serviceIdIsValid(id) {

    function encodeServiceRowId(serviceId) {
        return encodeURIComponent(String(serviceId ?? ''));
    }
    function encodeServiceRowKey(item, index) {
        if (serviceIdIsValid(item?.id)) return encodeServiceRowId(item.id);
        return encodeURIComponent(`__idx:${index}`);
    }
    function decodeServiceRowId(encoded) {
        if (encoded == null || encoded === '') return '';
        try { return decodeURIComponent(String(encoded)); } catch (_) { return String(encoded); }
    }
    function resolveServiceItem(encodedKey) {
        const key = decodeServiceRowId(encodedKey);
        if (key.startsWith('__idx:')) {
            const idx = parseInt(key.slice(6), 10);
            if (!Number.isNaN(idx) && data.services && data.services[idx]) return data.services[idx];
            return undefined;
        }
        return findAdminItemById('services', key);
    }
    function handleServiceTableAction(ev) {
        if (activeTab !== 'services') return;
        const root = gid('content-area');
        if (!root || !root.contains(ev.target)) return;
        const btn = ev.target.closest('[data-svc-action]');
        if (!btn) return;
        ev.preventDefault();
        ev.stopPropagation();
        const action = btn.getAttribute('data-svc-action');
        const rowKey = btn.getAttribute('data-service-id');
        const item = resolveServiceItem(rowKey);
        if (!item) {
            Swal.fire('Error', 'ไม่พบรายการบริการ', 'error');
            return;
        }
        const serviceId = String(item.id ?? '').trim();
        if (action === 'delete') deleteItem(rowKey);
        else if (action === 'edit') editItem(rowKey);
        else if (action === 'toggle') {
            if (!serviceIdIsValid(serviceId)) {
                Swal.fire('แจ้งเตือน', 'รายการนี้ไม่มีรหัส (ID) — กดแก้ไขแล้วใส่รหัสบริการก่อนเปลี่ยนสถานะ', 'warning');
                return;
            }
            const next = parseInt(btn.getAttribute('data-svc-next-active'), 10) === 1 ? 1 : 0;

                return;

    window.testServiceHealth = async function(serviceId, silent = false) {
        if (!serviceId) return null;
        window.serviceHealthCache[serviceId] = { state: 'checking' };
        updateServiceHealthBadge(serviceId, 'checking');
        try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 12000);
            const res = await fetch(`${apiPath}?action=check_service_health&service_id=${encodeURIComponent(serviceId)}&_t=${Date.now()}`, { signal: ctrl.signal });
            clearTimeout(timer);
            const json = await res.json();
            if (!res.ok || json.status !== 'success') throw new Error(json.message || 'Health check failed');
            const state = json.active_link === 'primary' ? 'primary' : (json.active_link === 'backup' ? 'backup' : 'down');
            window.serviceHealthCache[serviceId] = { state, data: json, ts: Date.now() };
            updateServiceHealthBadge(serviceId, state);
            if (!silent) {
                const title = state === 'primary' ? 'Server Probe: Primary พร้อมใช้งาน'
                    : state === 'backup' ? 'Server Probe: ใช้ Backup ได้'
                    : 'Server Probe: Primary/Backup ไม่ตอบสนอง';
                Toast.fire({ icon: state === 'down' ? 'warning' : 'success', title });
            }
            return json;
        } catch (e) {
            window.serviceHealthCache[serviceId] = { state: 'down', error: String(e.message || e) };
            updateServiceHealthBadge(serviceId, 'down');
            if (!silent) Swal.fire('Health Check Error', e.message || 'ไม่สามารถทดสอบลิงก์ได้', 'error');
            return null;
        }
    }

            <button onclick="window.open('print_asset.php?id=${dbId}','_blank','width=880,height=900');${close}"><i class="fa fa-print"></i> พิมพ์ใบทะเบียน</button>

        document.body.appendChild(menu);
        const rect = e.currentTarget.getBoundingClientRect();
        const mw = 200, mh = 250;
        let top = rect.bottom + 4, left = rect.right - mw;
        if (top + mh > window.innerHeight) top = rect.top - mh - 4;

    }

    window.toggleAssetCharts = function() {
        const body = gid('chart-body');

    window.updateCharts = function() {
        if (gid('chart-body')?.style.display !== 'grid') return;
        const items = data.it_assets || [];
        if (items.length === 0) return;
        const statusCounts = {};
        items.forEach(i => { const s = i['สถานะ'] || 'Other'; statusCounts[s] = (statusCounts[s] || 0) + 1; });
        const catCounts = {};
        items.forEach(i => { const c = i['หมวดหมู่'] || 'Uncategorized'; catCounts[c] = (catCounts[c] || 0) + 1; });
        const isDark = document.documentElement.classList.contains('dark');
        const textColor = isDark ? '#cbd5e1' : '#475569';

        const ctxStatus = gid('chart-status').getContext('2d');
        if (statusChart) {
            statusChart.data.labels = Object.keys(statusCounts);
            statusChart.data.datasets[0].data = Object.values(statusCounts);
            statusChart.options.plugins.legend.labels.color = textColor;
            statusChart.update('none');
        } else {
            statusChart = new Chart(ctxStatus, {
                type: 'doughnut',
                data: { labels: Object.keys(statusCounts), datasets: [{ data: Object.values(statusCounts), backgroundColor: ['#10b981','#3b82f6','#f59e0b','#ef4444','#64748b'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: textColor } } } }
            });
        }

        const ctxCat = gid('chart-category').getContext('2d');
        if (categoryChart) {
            categoryChart.data.labels = Object.keys(catCounts);
            categoryChart.data.datasets[0].data = Object.values(catCounts);
            categoryChart.options.scales.y.ticks.color = textColor;
            categoryChart.options.scales.x.ticks.color = textColor;
            categoryChart.update('none');
        } else {
            categoryChart = new Chart(ctxCat, {
                type: 'bar',
                data: { labels: Object.keys(catCounts), datasets: [{ label: 'จำนวน (ชิ้น)', data: Object.values(catCounts), backgroundColor: '#6366f1', borderRadius: 5 }] },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { color: textColor, precision:0 } }, x: { ticks: { color: textColor } } }, plugins: { legend: { display: false } } }
            });
        }
    }

    async function loadAssetHistory(assetId, containerId = 'asset-history-container') {
        const container = gid(containerId);
        if (!container) return;
        container.innerHTML = '<div class="text-center text-slate-400 py-4"><i class="fas fa-spinner fa-spin"></i> Loading history...</div>';
        try {
            const res = await fetch(`${apiPath}?action=get_asset_history&id=${assetId}`);
            const history = await res.json();
            if (history.status === 'error') throw new Error(history.message);
            if (!Array.isArray(history)) throw new Error('Invalid data format');
            if (history.length === 0) { container.innerHTML = '<div class="ad-muted" style="padding:6px 0">ยังไม่มีบันทึก</div>'; return; }
            // แปลงรหัสเหตุการณ์เป็นภาษาคน (เดิมโชว์ SETUP_SYNC / serial_number ตรงๆ)
            const EV = {
                CREATE: ['fa-plus', 'เพิ่มเข้าระบบ', '#16a34a'], UPDATE: ['fa-pen', 'แก้ไขข้อมูล', '#2563eb'],
                STATUS_CHANGE: ['fa-arrows-rotate', 'เปลี่ยนสถานะ', '#7c3aed'], SPEC_CHANGE: ['fa-microchip', 'เปลี่ยนสเปค', '#4f46e5'],
                TRANSFER: ['fa-right-left', 'โอนย้าย', '#7c3aed'], NOTE: ['fa-comment', 'บันทึกโน้ต', '#64748b'],
                SETUP_SYNC: ['fa-laptop-code', 'อัปเดตจากใบติดตั้ง', '#0891b2'], ACCESS: ['fa-eye', 'เปิดดู', '#94a3b8'], ISSUE: ['fa-triangle-exclamation', 'แจ้งปัญหา', '#dc2626'],
                LOAN: ['fa-arrow-up-from-bracket', 'ยืมออก', '#ea580c'], LOAN_REQUEST: ['fa-paper-plane', 'ขอยืม', '#ea580c'], LOAN_APPROVED: ['fa-check', 'อนุมัติการยืม', '#16a34a'],
                LOAN_DENIED: ['fa-xmark', 'ปฏิเสธการยืม', '#dc2626'], LOAN_CANCELLED: ['fa-ban', 'ยกเลิกการยืม', '#64748b'], LOAN_RETURNED: ['fa-arrow-rotate-left', 'คืนแล้ว', '#0d9488'], RETURN: ['fa-arrow-rotate-left', 'คืนแล้ว', '#0d9488'],
                REPAIR_REQUEST: ['fa-screwdriver-wrench', 'แจ้งซ่อม', '#f59e0b'], REPAIR_CREATED: ['fa-screwdriver-wrench', 'เปิดงานซ่อม', '#f59e0b'], REPAIR_START: ['fa-gears', 'เริ่มซ่อม', '#f59e0b'],
                REPAIR_COMPLETE: ['fa-circle-check', 'ซ่อมเสร็จ', '#16a34a'], REPAIR_CANCEL: ['fa-ban', 'ยกเลิกงานซ่อม', '#64748b'], REPAIR_DELETE: ['fa-trash', 'ลบงานซ่อม', '#64748b'], REPAIR_UNREPAIRABLE: ['fa-heart-crack', 'ซ่อมไม่ได้', '#dc2626'],
            };
            const FIELD_TH = { serial_number: 'S/N', hostname: 'ชื่อเครื่อง', ip_address: 'IP', mac_address: 'MAC', custodian: 'ผู้ถือครอง', company: 'บริษัท', status: 'สถานะ', location: 'สถานที่', department: 'แผนก', name: 'ชื่อ', brand: 'ยี่ห้อ', model: 'รุ่น' };
            const humanize = txt => escapeHtml(String(txt || '').replace(/\\"/g, '"'))
                .replace(/^Sync จาก Setup:\s*/i, 'อัปเดต: ')
                .replace(/\b([a-z]+(?:_[a-z]+)+|hostname|company|status|location|custodian)\b/g, m => FIELD_TH[m] || m);
            // ซ่อน "เปิดดู" (ACCESS) ไว้ท้าย ไม่ให้กลบเหตุการณ์สำคัญ
            const ordered = history.filter(h => h.event_type !== 'ACCESS').concat(history.filter(h => h.event_type === 'ACCESS'));
            container.innerHTML = ordered.map(h => {
                const ev = EV[h.event_type] || ['fa-clock-rotate-left', h.event_type, '#64748b'];
                const isNote = h.event_type === 'NOTE';
                let detailsHtml = '', noteActions = '';
                if (isNote) {
                    let noteText = '', noteImage = '';
                    try { const nd = JSON.parse(h.details); noteText = nd.text || ''; noteImage = nd.image || ''; } catch (e) { noteText = h.details || ''; }
                    detailsHtml = humanize(noteText);
                    if (noteImage) detailsHtml += `<div><a href="${escapeHtml(noteImage)}" target="_blank" rel="noopener"><img src="${escapeHtml(noteImage)}" style="max-width:150px;max-height:96px;border-radius:6px;border:1px solid var(--ptc-border);margin-top:4px"></a></div>`;
                    const safe = encodeURIComponent(noteText);
                    noteActions = ` · <a href="#" onclick="event.preventDefault();editAssetNote(${parseInt(h.history_id,10)},'${safe}')">แก้ไข</a> · <a href="#" style="color:var(--ptc-danger)" onclick="event.preventDefault();deleteAssetNote(${parseInt(h.history_id,10)})">ลบ</a>`;
                } else {
                    detailsHtml = humanize(h.details);
                }
                const when = h.timestamp ? new Date(h.timestamp).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
                return `<div class="ad-tl"><div class="ad-tl-ic" style="color:${ev[2]}"><i class="fa ${ev[0]}"></i></div>
                    <div style="min-width:0;flex:1"><div class="ad-tl-t">${escapeHtml(ev[1])}</div>${detailsHtml ? `<div class="ad-tl-d">${detailsHtml}</div>` : ''}
                    <div class="ad-tl-m">${escapeHtml(when)}${h.user_name ? ' · ' + escapeHtml(h.user_name) : ''}${noteActions}</div></div></div>`;
            }).join('');
        } catch (e) { console.error(e); container.innerHTML = `<div class="text-center text-red-500 py-4 text-xs">Failed to load history.<br>${e.message}</div>`; }
    }

    window.addAssetNote = async function(assetId) {
        const input = gid('asset-note-input'); const fileInput = gid('asset-note-file');
        if (!input || !fileInput) return;
        const note = input.value.trim(); const file = fileInput.files[0];
        if (!note && !file) { Swal.fire('แจ้งเตือน','กรุณาระบุข้อความบันทึกหรือแนบรูปภาพ','warning'); return; }
        const btn = event ? event.target : null;
        if(btn) { btn.innerText='...'; btn.disabled=true; }
        try {
            const fd = new FormData();
            fd.append('action','add_asset_note'); fd.append('id',assetId); fd.append('note',note);
            if (file) fd.append('note_image', file);
            const res = await fetch(apiPath,{method:'POST',body:fd}); const result = await res.json();
            if (result.status==='success') { input.value=''; fileInput.value=''; gid('asset-note-filename').textContent=''; await loadAssetHistory(assetId); Toast.fire({icon:'success',title:'บันทึกเรียบร้อย'}); }
            else throw new Error(result.message||'Failed');
        } catch(e) { Swal.fire('Error',e.message,'error'); }
        finally { if(btn){btn.innerText='Add';btn.disabled=false;} }
    }

        if (newNote && newNote !== currentNote) {
            const fd = new FormData(); fd.append('action','update_asset_note'); fd.append('history_id',historyId); fd.append('note',newNote);

                const res = await fetch(apiPath,{method:'POST',body:fd}); const result = await res.json();

    window.openAuditDashboard = async function() {
        Swal.fire({ title: 'กำลังโหลด...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
            const res  = await fetch(`${apiPath}?action=get_audit_rounds`);
            const json = await res.json();
            if (json.status !== 'success') throw new Error(json.message || 'โหลดไม่สำเร็จ');
            const rounds = json.rounds;
            if (!rounds.length) {
                Swal.fire({ icon: 'info', title: 'ยังไม่มีรอบตรวจนับ', text: 'กดปุ่ม "ตรวจนับ" เพื่อเริ่มรอบแรก' }); return;
            }
            const html = rounds.map(r => {
                const pct = r.total > 0 ? Math.round(r.confirmed / r.total * 100) : 0;
                const deadlineStr = r.deadline ? new Date(r.deadline).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : 'ไม่กำหนด';
                const statusBadge = r.status === 'closed'
                    ? '<span class="ad-chip" style="margin-left:6px;background:var(--ptc-surface-2);color:var(--ptc-text-muted)">ปิดแล้ว</span>'
                    : '<span class="ad-chip ok" style="margin-left:6px">กำลังเปิด</span>';
                const rows = r.tokens.map(t => {

                    const statusTxt = t.status === 'confirmed' ? 'ยืนยันแล้ว' : t.status === 'partial' ? 'ยืนยันบางส่วน' : 'รอยืนยัน';
                    const copyBtn = t.status === 'pending'
                        ? `<button class="audit-copy-btn" onclick="auditCopyLink(this,'${escapeHtml(t.link)}')"><i class="fas fa-copy" style="font-size:10px"></i> คัดลอกลิงก์</button>`
                        : `<span style="font-size:11px;color:#94a3b8">${t.confirmed_at ? new Date(t.confirmed_at).toLocaleDateString('th-TH') : ''}</span>`;
                    return `<div class="audit-token-row">
                        <div class="audit-status-dot ${dotCls}"></div>
                        <div class="audit-emp-name">${escapeHtml(t.employee_name)}</div>
                        <div class="audit-status-txt">${statusTxt}</div>

                    </div>`;

                    <div class="audit-round-meta">กำหนดส่ง: ${deadlineStr} · ยืนยันแล้ว ${r.confirmed}/${r.total} คน</div>
                    <div class="audit-prog"><div class="audit-prog-bar" style="width:${pct}%"></div></div>
                </div>
                <div style="margin-bottom:16px">${rows || '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:12px">ไม่มีพนักงานที่มีทรัพย์สินผูกไว้</div>'}</div>`;
            }).join('');
            Swal.fire({
                title: 'สถานะรอบตรวจนับ',
                html: `<div class="custom-scrollbar" style="text-align:left;max-height:60vh;overflow-y:auto;padding-right:4px">${html}</div>`,
                showCancelButton: false,
                confirmButtonText: 'ปิด',
                width: 600,
            });
        } catch(e) { Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: e.message }); }
    };

    window.auditCopyLink = function(btn, link) {

    window.renderContent = function() {
        const container = gid('content-area');
        if (activeTab === 'dashboard') { renderDashboardContent(container); return; }
        if (activeTab === 'permissions') { renderPermissionsContent(container); return; }
        if (activeTab === 'job_positions') { renderJobPositionsContent(container); return; }
        if (activeTab === 'borrow_management') {
            container.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center">
                <i class="fa fa-hand-holding" style="font-size:48px;color:#bfdbfe;margin-bottom:20px"></i>

                <a href="borrow_management.html" class="ptc-btn" style="font-size:13px;text-decoration:none">
                    <i class="fa fa-external-link-alt" style="margin-right:6px"></i>ไปหน้าจัดการการยืม
                </a>
            </div>`;
            return;
        }
        const term = gid('search-input').value.toLowerCase();
        let items = data[activeTab] || [];

        if (activeTab === 'it_assets') {
            const cat = gid('filter-category').value; const stat = gid('filter-status').value; const co = gid('filter-company').value;
            const setupFilter = gid('filter-setup-status')?.value || '';
            items = items.filter(i => {
                const txt = (String(i['ID อุปกรณ์']||'')+String(i['ชื่ออุปกรณ์']||'')+String(i['Serial Number']||'')+String(i.asset_id||'')+String(i.ip_address||'')+String(i.mac_address||'')+JSON.stringify(i.accessories||[])).toLowerCase();
                const isSetupDone = setupStatusMap[i['ID อุปกรณ์']||i.equipment_id||''] === 'active';
                const matchesSetup = !setupFilter || (setupFilter === 'done' ? isSetupDone : !isSetupDone);
                const matchesStat = !stat || (stat === '__repair' ? ASSET_REPAIR_STATUSES.includes(i['สถานะ']) : i['สถานะ'] === stat);
                return (!term||txt.includes(term))&&(!cat||i['หมวดหมู่']===cat)&&matchesStat&&(!co||i.company===co)&&matchesSetup;
            });
        } else if (activeTab === 'employees') {
            const co = gid('filter-emp-company').value; const techFilter = gid('filter-emp-tech')?.value||'';
            items = items.filter(i => {
                const txt = Object.values(i).join(' ').toLowerCase();
                const hasCompany = !co||(i.assignments&&i.assignments.some(a=>a.company===co));
                const isTech = parseInt(i.is_technician||0)===1;
                const hasTechMatch = !techFilter||(techFilter==='tech'?isTech:!isTech);
                return (!term||txt.includes(term))&&hasCompany&&hasTechMatch;
            });
        } else {
            items = items.filter(i => Object.values(i).join(' ').toLowerCase().includes(term));
        }

        const countBadge = gid('record-count');
        if(countBadge) {
            if (activeTab === 'employees') {
                const techCount = items.filter(i=>parseInt(i.is_technician||0)===1).length;
                countBadge.textContent = `${items.length} คน | ช่าง ${techCount} | ไม่ใช่ช่าง ${Math.max(0,items.length-techCount)}`;
            } else { countBadge.textContent = items.length+' items'; }
            countBadge.style.display = '';
        }

        if (activeTab === 'it_assets') renderAssetKpis();
        if (activeTab === 'it_assets' && currentView === 'tree') {
            renderTreeView(items, container);
        } else {
            const usePaging = activeTab==='it_assets'||activeTab==='employees';
            if (!usePaging) { renderTable(items, container); return; }
            const pager = getPager(activeTab);
            const pageSize = Math.max(5,parseInt(pager.pageSize,10)||25);
            const total = items.length;
            const pageCount = Math.max(1,Math.ceil(total/pageSize));
            const page = Math.min(Math.max(1,parseInt(pager.page,10)||1),pageCount);
            if (page!==pager.page) setPager(activeTab,{page});
            const startIdx = (page-1)*pageSize;
            const pageItems = items.slice(startIdx,startIdx+pageSize);
            renderTable(pageItems, container, {total,page,pageSize,pageCount});
        }
    }

    async function loadPermissionRegistry() {
        if (window.permissionRegistry && window.permissionRegistry.admin_menus) return window.permissionRegistry;
        try {
            const res = await fetch(`${apiPath}?action=get_permission_registry&v=${Date.now()}`, { cache: 'no-store' });
            const json = await res.json();
            if (json && json.status === 'success') window.permissionRegistry = json;
        } catch (e) { console.warn('permission registry', e); }
        return window.permissionRegistry || { admin_menus: {}, permissions: [] };
    }

    function sessionHasPerm(session, key) {
        if (!session) return false;
        if (session.role === 'admin') return true;
        const eff = session.effective_permissions || [];
        if (key === '*') return eff.includes('*');
        return eff.includes('*') || eff.includes(key);
    }

    function applyAdminMenuAccess(session, registry) {
        const menuMap = registry?.admin_menus || {};
        const allMenuIds = [...new Set([
            ...Object.keys(menuMap),
            'menu-permissions', 'menu-employees', 'menu-job_positions', 'menu-departments',
            'menu-it_assets', 'menu-asset_categories', 'menu-locations', 'menu-borrow_management',
            'menu-services', 'menu-kb_articles', 'menu-kb_categories', 'menu-announcements', 'menu-holidays',
            'menu-settings_telegram', 'menu-settings_line', 'menu-settings_notify', 'menu-admin_logo', 'menu-audit_log',
            'menu-update_db', 'menu-backup', 'menu-server_check'
        ])];
        const hasAll = session.role === 'admin' || sessionHasPerm(session, '*');
        allMenuIds.forEach(id => {
            const el = gid(id);
            if (!el) return;
            let allowed = hasAll;
            if (!allowed) {
                const required = menuMap[id] || (id === 'menu-permissions' ? ['admin.manage_permissions'] : []);
                allowed = required.some(k => sessionHasPerm(session, k));
            }
            if (allowed) return;
            el.style.opacity = '0.4';
            el.style.cursor = 'not-allowed';
            const newEl = el.cloneNode(true);
            newEl.removeAttribute('href');
            newEl.removeAttribute('onclick');
            newEl.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                Swal.fire({ icon: 'warning', title: 'ไม่มีสิทธิ์', text: 'บัญชีของคุณไม่มีสิทธิ์เข้าเมนูนี้', confirmButtonColor: '#64748b' });
            });
            el.parentNode.replaceChild(newEl, el);
        });
    }

    function getFirstAllowedAdminTab(session, registry) {
        const order = ['permissions', 'employees', 'it_assets', 'kb_articles', 'announcements', 'holidays', 'server_check', 'borrow_management'];
        const tabToMenu = {
            permissions:       'menu-permissions',
            employees:         'menu-employees',
            it_assets:         'menu-it_assets',
            kb_articles:       'menu-kb_articles',
            announcements:     'menu-announcements',
            holidays:          'menu-holidays',
            server_check:      'menu-server_check',
            borrow_management: 'menu-borrow_management',
        };
        // Fallback permission requirements when DB registry has no entry for a menu
        const permDefaults = {
            'menu-permissions':       ['admin.manage_permissions'],
            'menu-employees':         ['employee.manage'],
            'menu-it_assets':         ['asset.manage'],
            'menu-kb_articles':       ['kb.manage'],
            'menu-announcements':     ['admin.manage_permissions'],
            'menu-holidays':          ['admin.manage_permissions'],
            'menu-server_check':      ['admin.manage_permissions'],
            'menu-borrow_management': ['loan.manage'],
        };
        const menuMap = registry?.admin_menus || {};
        if (session.role === 'admin') return activeTab && tabToMenu[activeTab] ? activeTab : 'it_assets';
        for (const tab of order) {
            const menuId = tabToMenu[tab];
            if (!menuId) continue;
            const required = (menuMap[menuId] && menuMap[menuId].length) ? menuMap[menuId] : (permDefaults[menuId] || []);
            if (!required.length || required.some(k => sessionHasPerm(session, k))) return tab;
        }
        return null; // no allowed tab — should not reach admin at all
    }

    function buildPermissionTraceRows({ baseRole, selectedRoleIds, checkedPerms, customPermissions, allRoles }) {
        const defs = getPermissionOptionDefinitions();
        const defMap = {};
        defs.forEach(d => { defMap[d.key] = d; });
        const roleSet = new Set((selectedRoleIds || []).map(v => parseInt(v, 10)).filter(v => v > 0));
        const customMap = {};
        (customPermissions || []).forEach(item => {
            const key = String(item?.key || '').trim();
            if (!key) return;
            customMap[key] = !!item.is_granted;
        });
        const checkedSet = new Set((checkedPerms || []).map(v => String(v || '').trim()).filter(Boolean));
        const keys = Array.from(new Set([
            ...defs.map(d => d.key),
            ...Object.keys(customMap),
            ...checkedSet
        ]));

        return keys.map((key) => {
            const sources = [];
            let granted = false;

            if (baseRole === 'admin') {
                granted = true;
                sources.push({ type: 'base', label: 'Base Role: ADMIN (*)' });
            }

            (allRoles || []).forEach((role) => {
                const roleId = parseInt(role.id, 10);
                if (!roleSet.has(roleId)) return;
                const perms = Array.isArray(role.permissions) ? role.permissions : [];
                if (perms.includes('*') || perms.includes(key)) {
                    granted = true;
                    sources.push({ type: 'role', label: `Role: ${role.name}` });
                }
            });

            if (checkedSet.has(key)) {
                granted = true;
                sources.push({ type: 'custom-grant', label: 'Custom: Grant' });
            }
            if (Object.prototype.hasOwnProperty.call(customMap, key) && customMap[key] === false) {
                granted = false;
                sources.push({ type: 'custom-deny', label: 'Custom: Deny' });
            }

            const meta = defMap[key] || { label: key, desc: 'สิทธิ์ที่ไม่อยู่ใน registry' };
            return {
                key,
                label: meta.label || key,
                desc: meta.desc || '',
                granted,
                sources
            };
        });
    }

    function renderPermissionTracePanel(targetEl, traceRows) {
        if (!targetEl) return;
        const ordered = [...traceRows].sort((a, b) => {
            if (a.granted !== b.granted) return a.granted ? -1 : 1;
            return String(a.label || a.key).localeCompare(String(b.label || b.key));
        });
        if (!ordered.length) {
            targetEl.innerHTML = '<div style="font-size:11px;color:#94a3b8">ยังไม่มีข้อมูล trace</div>';
            return;
        }
        const chips = (sources) => (sources || []).map(s => {
            let style = 'background:#e2e8f0;color:#334155;';
            if (s.type === 'base') style = 'background:#dbeafe;color:#1d4ed8;';
            if (s.type === 'role') style = 'background:#dcfce7;color:#166534;';
            if (s.type === 'custom-grant') style = 'background:#fef3c7;color:#92400e;';
            if (s.type === 'custom-deny') style = 'background:#fee2e2;color:#b91c1c;';
            return `<span style="display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;${style}">${escapeHtml(s.label || '')}</span>`;
        }).join('');
        targetEl.innerHTML = ordered.map(row => `
            <div style="border:1px solid #e2e8f0;border-radius:8px;padding:8px;background:${row.granted ? '#f8fafc' : '#fff'}">
                <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
                    <div>
                        <div style="font-size:12px;font-weight:700;color:#0f172a">${escapeHtml(row.label || row.key)}</div>
                        <div style="font-size:10px;color:#64748b">${escapeHtml(row.key)}</div>
                    </div>
                    <span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;${row.granted ? 'background:#dcfce7;color:#166534' : 'background:#fee2e2;color:#b91c1c'}">${row.granted ? 'Granted' : 'Denied'}</span>
                </div>
                ${row.desc ? `<div style="font-size:11px;color:#94a3b8;margin-top:4px">${escapeHtml(row.desc)}</div>` : ''}
                <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${chips(row.sources) || '<span style="font-size:10px;color:#94a3b8">ไม่มีแหล่งที่มา</span>'}</div>
            </div>
        `).join('');
    }

        const json = await res.json();
        const roles = Array.isArray(json.roles) ? json.roles : [];
        window.permissionRoles = roles;
        return roles;

    async function savePermissionRole(rolePayload) {
        const fd = new FormData();
        fd.append('action', 'save_permission_role');
        if (rolePayload?.id) fd.append('id', String(rolePayload.id));
        fd.append('name', String(rolePayload?.name || '').trim());
        fd.append('description', String(rolePayload?.description || '').trim());
        fd.append('permissions', JSON.stringify(Array.isArray(rolePayload?.permissions) ? rolePayload.permissions : []));
        const res = await fetch(apiPath, { method: 'POST', body: fd });
        return await res.json();
    }

        fd.append('action', 'delete_permission_role');
        fd.append('id', String(roleId || ''));
        const res = await fetch(apiPath, { method: 'POST', body: fd });
        return await res.json();
