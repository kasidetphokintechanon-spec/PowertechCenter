<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Directory - Contact List</title>
    <meta name="description" content="ค้นหาข้อมูลพนักงาน เบอร์โทรศัพท์ และอีเมลภายในองค์กร">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <span class="logo-text">Directory</span>
                </div>
                <button class="theme-toggle" id="themeToggle" title="สลับธีม">
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>

            <!-- Search -->
            <div class="search-container">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
                <input type="text" class="search-input" id="searchInput" placeholder="ค้นหาพนักงาน...">
                <kbd class="search-shortcut">⌘K</kbd>
            </div>

            <!-- Stats -->
            <div class="stats-container">
                <div class="stat-item">
                    <span class="stat-value" id="totalCount">0</span>
                    <span class="stat-label">ทั้งหมด</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="filteredCount">0</span>
                    <span class="stat-label">แสดง</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="favoriteCount">0</span>
                    <span class="stat-label">ปักหมุด</span>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">หมวดหมู่</div>
                    <button class="nav-item active" data-filter="all">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <span>พนักงานทั้งหมด</span>
                        <span class="nav-badge" id="allBadge">0</span>
                    </button>
                    <button class="nav-item" data-filter="favorites">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        <span>ปักหมุด</span>
                        <span class="nav-badge" id="favBadge">0</span>
                    </button>
                    <button class="nav-item" data-filter="executives">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 8V4H8"></path>
                            <rect width="16" height="12" x="4" y="8" rx="2"></rect>
                            <path d="M2 14h2M20 14h2M15 13v2M9 13v2"></path>
                        </svg>
                        <span>ผู้บริหาร</span>
                        <span class="nav-badge" id="execBadge">0</span>
                    </button>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">บริษัท</div>
                    <button class="nav-item" data-filter="company-PTA">
                        <span class="company-dot pta"></span>
                        <span>PTA</span>
                        <span class="nav-badge" id="ptaBadge">0</span>
                    </button>
                    <button class="nav-item" data-filter="company-PT4">
                        <span class="company-dot pt4"></span>
                        <span>PT4</span>
                        <span class="nav-badge" id="pt4Badge">0</span>
                    </button>
                    <button class="nav-item" data-filter="company-PTE">
                        <span class="company-dot pte"></span>
                        <span>PTE</span>
                        <span class="nav-badge" id="pteBadge">0</span>
                    </button>
                </div>

                <div class="nav-section">
                    <div class="nav-section-title">แผนก</div>
                    <div id="departmentList"></div>
                </div>
            </nav>

            <div class="sidebar-footer">
                <p>Version 2.0</p>
                <p>macOS Style UI</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Mobile Header -->
            <header class="mobile-header">
                <button class="menu-toggle" id="menuToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h1 class="mobile-title">Directory</h1>
                <button class="theme-toggle-mobile" id="themeToggleMobile">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </header>

            <!-- Employee List -->
            <section class="employee-list-section">
                <div class="list-header">
                    <h2 class="list-title" id="listTitle">พนักงานทั้งหมด</h2>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="list" title="List view">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                        </button>
                        <button class="view-btn" data-view="grid" title="Grid view">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="employee-list" id="employeeList"></div>
            </section>

            <!-- Employee Detail -->
            <section class="employee-detail" id="employeeDetail">
                <div class="detail-placeholder">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <p>เลือกพนักงานเพื่อดูรายละเอียด</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <span id="toastMessage"></span>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script src="directory.js"></script>
</body>
</html>
