<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - Powertech System Center</title>
    <link rel="manifest" href="app-manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="uploads/logos/pta_logo.png">
    <script src="js/pwa.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                fontFamily: { sans: ['Kanit', 'sans-serif'] },
                extend: { colors: { primary: '#6366f1' } }
            }
        };
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .password-rule { transition: color 0.3s ease; }
        .password-rule.valid { color: #10b981; }
        .password-rule.invalid { color: #ef4444; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-slate-800">

    <div id="form-container" class="bg-white/80 backdrop-blur-xl border border-white/50 rounded-3xl shadow-2xl w-full max-w-md relative z-10 p-8 md:p-12 hidden">
        
        <div class="mb-8 text-center">
            <div class="w-16 h-16 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-shield-alt text-3xl text-indigo-500"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">ตั้งรหัสผ่านใหม่</h2>
            <p class="text-slate-500 text-sm">กรุณาตั้งรหัสผ่านใหม่ของคุณ</p>
        </div>

        <form id="resetForm" class="space-y-6">
            <input type="hidden" id="reset_token">
            <div>
                <label for="new_password" class="block text-sm font-medium text-slate-700 mb-1.5">รหัสผ่านใหม่</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-lock text-slate-400"></i></div>
                    <input type="password" id="new_password" class="w-full pl-10 pr-4 py-2.5 bg-white/50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm" required>
                </div>
            </div>
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1.5">ยืนยันรหัสผ่านใหม่</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="fas fa-lock text-slate-400"></i></div>
                    <input type="password" id="confirm_password" class="w-full pl-10 pr-4 py-2.5 bg-white/50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm" required>
                </div>
            </div>

            <div id="password-rules" class="text-xs space-y-1 text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <p id="rule-length" class="password-rule invalid"><i class="fas fa-times-circle mr-1"></i> มีความยาวอย่างน้อย 8 ตัวอักษร</p>
                <p id="rule-lowercase" class="password-rule invalid"><i class="fas fa-times-circle mr-1"></i> มีตัวพิมพ์เล็ก (a-z)</p>
                <p id="rule-uppercase" class="password-rule invalid"><i class="fas fa-times-circle mr-1"></i> มีตัวพิมพ์ใหญ่ (A-Z)</p>
                <p id="rule-number" class="password-rule invalid"><i class="fas fa-times-circle mr-1"></i> มีตัวเลข (0-9)</p>
                <p id="rule-match" class="password-rule invalid"><i class="fas fa-times-circle mr-1"></i> รหัสผ่านตรงกัน</p>
            </div>

            <button type="submit" id="resetBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-indigo-500/30 transition transform hover:-translate-y-0.5" disabled>
                บันทึกรหัสผ่านใหม่
            </button>
        </form>
    </div>

    <script>
        const gid = (id) => document.getElementById(id);

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                Swal.fire({
                    icon: 'error',
                    title: 'ลิงก์ไม่ถูกต้อง',
                    text: 'ไม่พบ Token สำหรับการตั้งรหัสผ่านใหม่ กรุณาทำรายการใหม่อีกครั้ง',
                    allowOutsideClick: false
                }).then(() => window.location.href = 'forgot_password.html');
                return;
            }

            gid('reset_token').value = token;
            gid('form-container').classList.remove('hidden');

            const passInput = gid('new_password');
            const confirmInput = gid('confirm_password');
            const rules = {
                length: gid('rule-length'),
                lowercase: gid('rule-lowercase'),
                uppercase: gid('rule-uppercase'),
                number: gid('rule-number'),
                match: gid('rule-match')
            };

            function validatePassword() {
                const pass = passInput.value;
                const confirm = confirmInput.value;
                let allValid = true;

                const validations = {
                    length: pass.length >= 8,
                    lowercase: /[a-z]/.test(pass),
                    uppercase: /[A-Z]/.test(pass),
                    number: /[0-9]/.test(pass),
                    match: pass !== '' && pass === confirm
                };

                for (const key in validations) {
                    const ruleEl = rules[key];
                    if (validations[key]) {
                        ruleEl.classList.replace('invalid', 'valid');
                        ruleEl.querySelector('i').className = 'fas fa-check-circle mr-1';
                    } else {
                        ruleEl.classList.replace('valid', 'invalid');
                        ruleEl.querySelector('i').className = 'fas fa-times-circle mr-1';
                        allValid = false;
                    }
                }
                gid('resetBtn').disabled = !allValid;
            }

            passInput.addEventListener('input', validatePassword);
            confirmInput.addEventListener('input', validatePassword);
        });

        gid('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = gid('resetBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>กำลังบันทึก...';

            const fd = new FormData();
            fd.append('action', 'reset_password');
            fd.append('token', gid('reset_token').value);
            fd.append('new_password', gid('new_password').value);

            try {
                const res = await fetch('api.php', { method: 'POST', body: fd });
                const data = await res.json();

                if (data.status === 'success') {
                    Swal.fire({
                        icon: 'success',
                        title: 'ตั้งรหัสผ่านใหม่สำเร็จ!',
                        text: 'คุณสามารถใช้รหัสผ่านใหม่เพื่อเข้าสู่ระบบได้ทันที',
                    }).then(() => window.location.href = 'login.html');
                } else {
                    throw new Error(data.message);
                }
            } catch (err) {
                Swal.fire('เกิดข้อผิดพลาด', err.message || 'ไม่สามารถตั้งรหัสผ่านใหม่ได้ กรุณาลองอีกครั้ง', 'error');
                btn.disabled = false;
                btn.innerHTML = 'บันทึกรหัสผ่านใหม่';
            }
        });
    </script>
</body>
</html>
