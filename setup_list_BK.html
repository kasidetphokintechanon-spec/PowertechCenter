<script>
let allRecords = [];
let pendingDeleteId = null;

// ── Load records ──
async function loadRecords() {
    try {
        const resp = await fetch('api.php?action=getSetupRecords');
        const data = await resp.json();
        if (data.status === 'success') {
            allRecords = data.records || [];
            applyFilters();
        } else {
            showError(data.message || 'โหลดไม่ได้');
        }
    } catch(e) {
        showError('เชื่อมต่อ API ไม่ได้');
    }
}

function showError(msg) {
    document.getElementById('tbl-body').innerHTML =
        `<tr class="loading-row"><td colspan="6" style="color:#dc2626"><i class="fa fa-triangle-exclamation"></i> ${msg}</td></tr>`;
}

// ── Filter ──
function applyFilters() {
    const q       = document.getElementById('search-input').value.trim().toLowerCase();
    const status  = document.getElementById('filter-status').value;
    const company = document.getElementById('filter-company').value;

    let rows = allRecords.filter(r => {
        if (status  && r.status  !== status)  return false;
        if (company && r.company !== company) return false;
        if (q) {
            const hay = [r.employee_name, r.employee_id, r.asset_code, r.pc_name, r.tech_name]
                .join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
        }
        return true;
    });

    // Stats (over all records, not filtered)
    const total    = allRecords.length;
    const active   = allRecords.filter(r => r.status === 'active').length;
    const offboard = allRecords.filter(r => r.status === 'offboarded').length;
    document.getElementById('stat-total').textContent    = total;
    document.getElementById('stat-active').textContent   = active;
    document.getElementById('stat-offboard').textContent = offboard;

    renderTable(rows);
    renderMobile(rows);

    document.getElementById('empty-state').style.display = rows.length ? 'none' : 'block';
}

// ── Format date ──
function fmtDate(d) {
    if (!d) return '—';
    try {
        return new Date(d).toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' });
    } catch { return d; }
}

// ── Company badge ──
function coBadge(co) {
    if (!co) return '';
    const cls = co === 'PTA' ? 'co-pta' : co === 'PT4' ? 'co-pt4' : co === 'PTE' ? 'co-pte' : 'co-other';
    const icon = co === 'PTA' ? '🏢' : co === 'PT4' ? '🏭' : co === 'PTE' ? '🏗️' : '🏬';
    return `<span class="co-badge ${cls}">${icon} ${co}</span>`;
}

// ── Action buttons ──
function actionBtns(r) {
    const isOff = r.status === 'offboarded';
    const viewBtn  = `<a href="setup.html?id=${r.id}" class="act-btn act-btn-view"><i class="fa fa-pen-to-square"></i> ดู/แก้ไข</a>`;
    const printBtn = `<a href="#" class="act-btn act-btn-print" onclick="printRecord(${r.id},event)"><i class="fa fa-print"></i> พิมพ์</a>`;
    const offBtn   = isOff
        ? `<span class="act-btn act-btn-done"><i class="fa fa-check"></i> Offboarded</span>`
        : `<a href="setup_offboard.html?id=${r.id}" class="act-btn act-btn-offboard"><i class="fa fa-right-from-bracket"></i> Offboard</a>`;
    const delBtn   = `<button class="act-btn act-btn-del" onclick="openDelModal(${r.id},'${(r.employee_name||'').replace(/'/g,"\\'")}')"><i class="fa fa-trash"></i></button>`;
    return `<div class="act-btns">${viewBtn}${printBtn}${offBtn}${delBtn}</div>`;
}

// ── Delete modal ──
function openDelModal(id, name) {
    pendingDeleteId = id;
    document.getElementById('del-modal-name').textContent = name || `Record #${id}`;
    document.getElementById('del-modal').style.display = 'flex';
}
function closeDelModal() {
    pendingDeleteId = null;
    document.getElementById('del-modal').style.display = 'none';
}
async function confirmDelete() {
    if (!pendingDeleteId) return;
    const btn = document.getElementById('del-confirm-btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังลบ…';

    try {
        const fd = new FormData();
        fd.append('id', pendingDeleteId);
        const resp = await fetch('api.php?action=deleteSetupRecord', { method:'POST', body:fd });
        const data = await resp.json();
        if (data.status === 'success') {
            allRecords = allRecords.filter(r => r.id !== pendingDeleteId);
            closeDelModal();
            applyFilters();
        } else {
            alert('ลบไม่ได้: ' + (data.message || 'Unknown error'));
        }
    } catch(e) {
        alert('เกิดข้อผิดพลาด');
    }
    btn.disabled = false;
    btn.innerHTML = '<i class="fa fa-trash"></i> ลบ';
}

// ── Close modal on overlay click ──
document.addEventListener('click', e => {
    if (e.target.id === 'del-modal') closeDelModal();
});

async function printRecord(id, e) {
    e.preventDefault();
    // เปิด popup ทันที (user gesture) — Chrome จะไม่ block
    const w = window.open('', '_blank', 'width=860,height=1000');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>กำลังโหลด...</title>
        <style>body{font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#64748b;flex-direction:column;gap:12px;}
        .spin{width:36px;height:36px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:s 0.8s linear infinite;}
        @keyframes s{to{transform:rotate(360deg);}}</style></head>
        <body><div class="spin"></div><div>กำลังโหลดข้อมูล...</div></body></html>`);
    w.document.close();

    // fetch ข้อมูลจาก API
    let r;
    try {
        const fd = new FormData(); fd.append('id', id);
        const res = await fetch('api.php?action=getSetupRecord', { method:'POST', body:fd });
        const data = await res.json();
        if (data.status !== 'success') { w.document.write('<p>โหลดข้อมูลไม่สำเร็จ</p>'); return; }
        r = data.record;
    } catch(err) { w.close(); alert('ไม่สามารถโหลดข้อมูลได้'); return; }

    // ── สร้าง HTML ใบส่งมอบ (เหมือน printSetup ใน setup.html) ──
    const fmtDate = d => { if (!d) return '-'; const p = d.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; };
    const coLabel  = { PTA:'PowerTech Assembly', PT4:'PowerTech 2004', PTE:'PowerTech Energy' };
    const coColors = { PTA:'#059669', PT4:'#dc2626', PTE:'#2563eb' };
    const accentColor = coColors[r.company] || '#334155';
    const coName = coLabel[r.company] || r.company || 'Powertech Center';

    const states = r.checklist_states || {};
    const cats = [...new Set(SETUP_CHECKS.map(c => c.cat))];
    const checklistHtml = cats.map(cat => {
        const items = SETUP_CHECKS.filter(c => c.cat === cat);
        return `<div style="break-inside:avoid;margin-bottom:10px;">
            <div style="font-size:9pt;font-weight:700;color:${accentColor};border-bottom:1px solid #e2e8f0;padding-bottom:3px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;">${cat}</div>
            ${items.map(c => {
                const st = states[c.id] || 'pending';
                const done = st === 'done', skipped = st === 'skipped';
                const box = done
                    ? `<span style="display:inline-block;width:13px;height:13px;border:1.5px solid #16a34a;border-radius:3px;background:#dcfce7;margin-right:5px;vertical-align:middle;text-align:center;font-size:9pt;line-height:13px;color:#16a34a;">✓</span>`
                    : skipped
                    ? `<span style="display:inline-block;width:13px;height:13px;border:1.5px solid #94a3b8;border-radius:3px;background:#f1f5f9;margin-right:5px;vertical-align:middle;text-align:center;font-size:9pt;line-height:13px;color:#94a3b8;">—</span>`
                    : `<span style="display:inline-block;width:13px;height:13px;border:1.5px solid #cbd5e1;border-radius:3px;background:#fff;margin-right:5px;vertical-align:middle;"></span>`;
                const style = skipped ? 'text-decoration:line-through;color:#94a3b8;' : done ? 'color:#166534;' : '';
                return `<div style="font-size:9pt;padding:2px 0;${style}">${box}${c.title}${c.critical?' ⚠':''}${skipped?' (ข้าม)':''}</div>`;
            }).join('')}
        </div>`;
    }).join('');

    // Custom items (เพิ่มเติม)
    const rCustomItems = Array.isArray(r.custom_items) ? r.custom_items : [];
    const customHtml = rCustomItems.length ? `
        <div style="break-inside:avoid;margin-bottom:10px;grid-column:1/-1;">

            ${rCustomItems.map(c => {
                const done = c.state==='done', skipped = c.state==='skipped';

    const netSection = (coAccess.length || r.ip_address) ? `

        ${r.ip_address ? `<tr>

    const slCoNameTh = {PTA:'บริษัท พาวเวอร์เทค เอนจิ้น แอสเซมบลี จำกัด',PT4:'บริษัท พาวเวอร์เทค 2004 จำกัด',PTE:'บริษัท พาวเวอร์เทค เอนเนอร์ยี โซลูชั่นส์ จำกัด'}[r.company]||'Powertech Group of Companies';

    const _slBase = window.location.origin + window.location.pathname.replace(/\/[^/]*$/,'/');

// ── Desktop table ──
function renderTable(rows) {
    const tbody = document.getElementById('tbl-body');
    if (!rows.length) { tbody.innerHTML = ''; return; }

    tbody.innerHTML = rows.map(r => {
        const statusBadge = r.status === 'active'
            ? `<span class="status-badge active"><i class="fa fa-circle" style="font-size:7px"></i> Active</span>`
            : `<span class="status-badge offboarded"><i class="fa fa-circle" style="font-size:7px"></i> Offboarded ${r.offboard_date ? '· '+fmtDate(r.offboard_date) : ''}</span>`;

        return `<tr>
            <td>
                <div class="emp-cell">
                    <div class="emp-name">${r.employee_name || '—'}</div>
                    <div class="emp-meta">${r.employee_id ? `#${r.employee_id}` : ''}${r.tech_name ? ` · ช่าง: ${r.tech_name}` : ''}</div>
                </div>
            </td>
            <td>
                <div style="display:flex;flex-direction:column;gap:4px">
                    ${coBadge(r.company)}
                    <span style="font-size:11px;color:#64748b">${r.department || ''}</span>
                </div>
            </td>
            <td>
                <div style="display:flex;flex-direction:column;gap:1px">
                    <span style="font-weight:600;font-size:12px">${r.pc_name || '—'}</span>
                    <span style="font-size:11px;color:#64748b">${r.asset_code || ''}</span>
                </div>
            </td>
            <td style="color:#64748b;font-size:12px;white-space:nowrap">${fmtDate(r.setup_date)}</td>
            <td>${statusBadge}</td>
            <td>${actionBtns(r)}</td>
        </tr>`;
    }).join('');
}

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
    const updateIcon = () => {
        document.getElementById('theme-icon').className =
            document.documentElement.classList.contains('dark') ? 'fa fa-moon' : 'fa fa-sun';
    };
    updateIcon();
    document.getElementById('theme-toggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        document.documentElement.classList.toggle('dark-theme');
        localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        updateIcon();
    });

    // Check session
    fetch('api.php?action=check_session').then(r => r.json()).then(s => {
        if (!s.loggedin) { window.location.href = 'login.html'; return; }
        loadRecords();
    });

    // Keyboard shortcut: / to focus search
    document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            document.getElementById('search-input').focus();
        }
    });
});
