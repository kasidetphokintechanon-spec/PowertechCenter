<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico">
    <link rel="manifest" href="app-manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="uploads/logos/pta_logo.png">
    <script src="js/favicon-version.js"></script>
    <script src="js/pwa.js" defer></script>
    <title>แจ้งซ่อม IT</title>
    <link rel="stylesheet" href="css/fonts/inter-kanit-local.css">
    <link rel="stylesheet" href="css/vendor/fontawesome.min.css"/>
    <script src="js/vendor/sweetalert2.min.js"></script>
    <script src="js/enterprise-swal.js?v=20261021b"></script>
    <script src="js/ptc-swal-ui.js?v=20260530"></script>
    <script src="js/vendor/qrcode.min.js"></script>
    <script src="js/doc-print.js?v=20261023"></script>
    <script src="js/ticket-print.js?v=20261024a"></script>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/enterprise-theme.css?v=20261021">
    <script>(function(){const t=localStorage.getItem('theme')||'light';if(t==='dark')document.documentElement.classList.add('dark','dark-theme');})();</script>
<style>
/* ════ แจ้งซ่อม IT (ฝั่งผู้ใช้) — แจ้ง 3 ขั้น + ติดตาม/ปิดงาน · สีจาก token design-system (ธีมมืดเปลี่ยนตามเอง) ════ */
/* enterprise-theme ล็อกการเลื่อนทั้งหน้าบนจอกว้าง (ไว้ใช้กับหน้าที่มีเมนูซ้าย) — หน้านี้เลื่อนทั้งหน้าตามปกติ */
html { overflow:auto !important; height:auto !important; } body { overflow:visible !important; height:auto !important; }
body { background:var(--ptc-bg); color:var(--ptc-text); margin:0; }
.rq-tabs { display:flex; border:1px solid var(--ptc-border); border-radius:8px; overflow:hidden; margin-left:auto; }
.rq-tabs button { height:34px; padding:0 14px; border:0; background:var(--ptc-surface); color:var(--ptc-text-2); font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.rq-tabs button.on { background:var(--ptc-text); color:var(--ptc-surface); }
.rq-tabs .cnt { min-width:18px; height:18px; border-radius:9px; background:var(--ptc-primary); color:#fff; font-size:11px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
.rq-techlink { height:34px; padding:0 12px; border:1px solid var(--ptc-border); border-radius:8px; display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:var(--ptc-text-2); text-decoration:none; background:var(--ptc-surface); }
.rq-wrap { max-width:1180px; margin:0 auto; padding:18px 16px 40px; }
.rq-card { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; }
.rq-grid { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
.rq-h { font-size:19px; font-weight:800; margin:0; }
.rq-s { font-size:12.5px; color:var(--ptc-text-muted); margin:2px 0 0; }
.rq-btn { height:38px; padding:0 14px; border-radius:8px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; text-decoration:none; }
.rq-btn:hover { border-color:var(--ptc-primary); }
.rq-btn.pri { background:var(--ptc-primary); border-color:var(--ptc-primary); color:#fff; }
.rq-btn.ok { background:#16a34a; border-color:#16a34a; color:#fff; }
.rq-btn.lg { height:44px; font-size:14.5px; padding:0 18px; }
.rq-btn.ghost { background:transparent; }
.rq-btn.danger { color:#dc2626; }
.rq-btn:disabled { opacity:.5; cursor:not-allowed; }
.wz-foot .miss { margin-left:auto; font-size:12.5px; color:#b45309; font-weight:600; text-align:right; } .wz-foot .miss:empty { display:none; }
html.dark .wz-foot .miss { color:#fbbf24; }

/* ขั้นตอน */
.wz { padding:20px; }
.wz-steps { display:flex; gap:6px; margin:12px 0 16px; }
.wz-steps div { flex:1; }
.wz-steps i { display:block; height:4px; border-radius:2px; background:var(--ptc-border); }
.wz-steps i.on { background:var(--ptc-primary); }
.wz-steps span { display:block; font-size:11px; color:var(--ptc-text-muted); margin-top:4px; font-weight:600; }
.wz-steps .cur span { color:var(--ptc-primary); }
.cats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.cat { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; padding:11px 12px; cursor:pointer; display:flex; align-items:center; gap:10px; text-align:left; font:inherit; color:inherit; min-width:0; }
.cat .tx { min-width:0; display:flex; flex-direction:column; gap:1px; }
.cat:hover, .cat.on { border-color:var(--ptc-primary); box-shadow:0 0 0 3px var(--ptc-primary-ring, rgba(37,99,235,.15)); }
.cat i { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
html.dark .cat i { background:rgba(148,163,184,.12) !important; }
.cat b { font-size:13.5px; line-height:1.3; } .cat .tx span { font-size:11.5px; color:var(--ptc-text-muted); line-height:1.35; }
.tip { margin-top:14px; padding:12px 14px; border-radius:10px; background:#fffbeb; border:1px solid #fde68a; display:flex; gap:12px; font-size:13px; }
html.dark .tip { background:rgba(217,119,6,.1); border-color:rgba(217,119,6,.35); }
.tip > i { color:#d97706; font-size:18px; margin-top:2px; }
.tip b { display:block; }
.tip ul { margin:4px 0 0 16px; padding:0; color:var(--ptc-text-2); }
.tip > div { flex:1; min-width:0; }
.tip .act { display:flex; gap:8px; flex-wrap:wrap; align-self:center; flex:0 0 auto; }
.devs { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.dev { display:flex; gap:12px; align-items:center; padding:12px; border:1px solid var(--ptc-border); border-radius:10px; background:var(--ptc-surface); cursor:pointer; font:inherit; color:inherit; text-align:left; min-width:0; }
.dev.on { border-color:var(--ptc-primary); box-shadow:0 0 0 3px var(--ptc-primary-ring, rgba(37,99,235,.15)); }
.dev > i:first-child { width:38px; height:38px; border-radius:9px; background:var(--ptc-primary-light); color:var(--ptc-primary); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.dev .tx { min-width:0; flex:1; }
.dev b { display:block; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dev span { font-size:11.5px; color:var(--ptc-text-muted); }
.dev .chk { color:var(--ptc-primary); }
.dev.wide { grid-column:1 / -1; }
.dev.place > i:first-child { background:#fffbeb; color:#d97706; }
html.dark .dev.place > i:first-child { background:rgba(217,119,6,.12); }
.fld { margin-top:14px; }
.fld > label { display:block; font-size:12.5px; font-weight:700; color:var(--ptc-text-2); margin-bottom:6px; }
.fld textarea, .fld input[type=text], .fld input[type=tel], .fld input[type=date], .fld input[type=time] { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:9px 11px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:14px; }
.fld .req { color:#dc2626; font-weight:600; }
.fld input.bad, .fld textarea.bad { border-color:#dc2626; }
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip { padding:7px 12px; border-radius:99px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
.chip.on { border-color:var(--ptc-primary); background:var(--ptc-primary-light); color:var(--ptc-primary); }
.chip.red.on { border-color:#dc2626; background:#fef2f2; color:#dc2626; }
html.dark .chip.red.on { background:rgba(220,38,38,.14); }
.chip small { opacity:.7; font-weight:500; }
.fld-row { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:14px; align-items:start; }
.drop { border:1.5px dashed var(--ptc-border); border-radius:10px; padding:14px; text-align:center; font-size:12.5px; color:var(--ptc-text-muted); cursor:pointer; }
.drop:hover { border-color:var(--ptc-primary); color:var(--ptc-primary); }
.thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.thumbs div { position:relative; width:76px; height:60px; border-radius:8px; overflow:hidden; border:1px solid var(--ptc-border); }
.thumbs img { width:100%; height:100%; object-fit:cover; }
.thumbs button { position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%; border:0; background:rgba(15,23,42,.7); color:#fff; font-size:10px; cursor:pointer; }
.wz-foot { display:flex; gap:10px; justify-content:space-between; align-items:center; margin-top:18px; padding-top:14px; border-top:1px solid var(--ptc-border); }
/* ปุ่มถัดไป/ส่ง ติดขอบล่างจอเสมอ — ไม่จมใต้กล่องคำแนะนำหรือรายการเครื่องยาว ๆ */
.wz-foot { position:sticky; bottom:0; z-index:5; background:var(--ptc-surface); margin-left:-20px; margin-right:-20px; padding:12px 20px; border-radius:0 0 10px 10px; box-shadow:0 -6px 14px -6px rgba(15,23,42,.12); }
html.dark .wz-foot { box-shadow:0 -6px 14px -6px rgba(0,0,0,.5); }
.wz-foot .hint { font-size:12.5px; color:var(--ptc-text-2); }
.wz-foot > :last-child { margin-left:auto; }
.side .rq-card { padding:14px; margin-bottom:12px; }
.side h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); letter-spacing:.03em; margin:0 0 8px; }
.kv { display:flex; justify-content:space-between; gap:10px; font-size:12.5px; padding:4px 0; color:var(--ptc-text-2); }
.kv b { color:var(--ptc-text); font-weight:600; text-align:right; }
.kv a { color:var(--ptc-primary); text-decoration:none; font-family:Consolas,monospace; font-size:12px; }
.done-box { text-align:center; padding:34px 10px; }
.done-box .ic { width:72px; height:72px; border-radius:50%; background:#f0fdf4; color:#16a34a; display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 14px; }
html.dark .done-box .ic { background:rgba(22,163,74,.14); }

/* ติดตามงาน */
.tk-grid { display:grid; grid-template-columns:minmax(0,1fr) 420px; gap:16px; align-items:start; }
.tk-filter { padding:12px 16px; border-bottom:1px solid var(--ptc-border); display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.tk-filter input { flex:1; min-width:150px; height:34px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
.tk { padding:14px 16px; border-bottom:1px solid var(--ptc-border); cursor:pointer; display:block; }
.tk:last-child { border-bottom:0; }
.tk:hover { background:var(--ptc-surface-2); }
.tk.sel { background:var(--ptc-primary-light); box-shadow:inset 3px 0 0 var(--ptc-primary); }
.tk-top { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ptc-text-muted); min-width:0; }
.tk-top .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); white-space:nowrap; }
.tk-sub { font-size:12px; color:var(--ptc-text-muted); margin-top:3px; overflow-wrap:anywhere; }
.pill { font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:99px; white-space:nowrap; margin-left:auto; color:var(--c); background:color-mix(in srgb, var(--c) 12%, transparent); }
.tk h3 { font-size:15px; font-weight:700; margin:5px 0 0; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.stp { display:flex; gap:3px; margin:10px 0 5px; }
.stp i { flex:1; height:5px; border-radius:3px; background:var(--ptc-border); }
.stp i.on { background:var(--ptc-primary); }
.stp.done i { background:#16a34a; } .stp.off i { background:var(--ptc-border); }
.stp-l { display:flex; justify-content:space-between; font-size:10.5px; color:var(--ptc-text-muted); }
.stp-l .cur { color:var(--ptc-primary); font-weight:700; }
.tk-who { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:12px; color:var(--ptc-text-2); min-width:0; }
.tk-who span:last-child { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.av { width:22px; height:22px; border-radius:50%; background:var(--ptc-primary); color:#fff; font-size:9px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.cta { margin-top:10px; padding:10px 12px; border-radius:9px; background:#f0fdf4; border:1px solid #bbf7d0; display:flex; align-items:center; gap:10px; font-size:13px; }
html.dark .cta { background:rgba(22,163,74,.1); border-color:rgba(22,163,74,.35); }
.cta b { flex:1; }
.stars-sm { color:#fbbf24; font-size:13px; margin-top:6px; letter-spacing:1px; }
.empty { padding:40px 16px; text-align:center; color:var(--ptc-text-muted); font-size:13px; }
.empty i { font-size:26px; display:block; margin-bottom:8px; opacity:.6; }
/* รายละเอียด */
.dt { position:sticky; top:calc(var(--rq-nav-h, 56px) + 18px); max-height:calc(100vh - var(--rq-nav-h, 56px) - 36px); overflow-y:auto; }
.dt-h { padding:16px; border-bottom:1px solid var(--ptc-border); }
.dt-h .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); font-size:13px; }
.dt-h h2 { font-size:17px; margin:6px 0 2px; }
.dt-sec { padding:14px 16px; border-bottom:1px solid var(--ptc-border); }
.dt-sec:last-child { border-bottom:0; }
.dt-sec h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); letter-spacing:.03em; margin:0 0 8px; }
.qa { display:grid; grid-template-columns:96px 1fr; gap:4px 12px; font-size:13px; }
.qa span { color:var(--ptc-text-muted); }
.qa b { font-weight:600; overflow-wrap:anywhere; }
.imgs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.imgs a { width:84px; height:64px; border-radius:8px; overflow:hidden; border:1px solid var(--ptc-border); display:block; }
.imgs img { width:100%; height:100%; object-fit:cover; }
.tl-i { display:flex; gap:12px; position:relative; padding-bottom:14px; }
.tl-i:before { content:''; position:absolute; left:6px; top:16px; bottom:0; width:2px; background:var(--ptc-border); }
.tl-i:last-child:before { display:none; }
.tl-i > i { width:14px; height:14px; border-radius:50%; background:var(--ptc-border); border:3px solid var(--ptc-surface); box-shadow:0 0 0 1px var(--ptc-border); flex-shrink:0; margin-top:3px; z-index:1; }
.tl-i.it > i { background:var(--ptc-primary); box-shadow:0 0 0 1px var(--ptc-primary); }
.tl-i.ok > i { background:#16a34a; box-shadow:0 0 0 1px #16a34a; }
.tl-i.me > i { background:#64748b; box-shadow:0 0 0 1px #64748b; }
.tl-i .b { min-width:0; flex:1; }
.tl-i b { font-size:13px; display:block; } .tl-i span { font-size:12px; color:var(--ptc-text-muted); }
.tl-i p { font-size:12.5px; color:var(--ptc-text-2); margin:4px 0 0; background:var(--ptc-surface-2); border:1px solid var(--ptc-border); border-radius:8px; padding:7px 10px; white-space:pre-line; overflow-wrap:anywhere; }
.tl-i p img { max-width:160px; border-radius:6px; display:block; margin-top:6px; }
.msg { display:flex; gap:8px; margin:4px -16px -14px; padding:10px 16px; position:sticky; bottom:0; z-index:2; background:var(--ptc-surface); border-top:1px solid var(--ptc-border); }
.msg input[type=text] { flex:1; min-width:0; height:38px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
.rate { text-align:center; }
.rate .stars { display:flex; gap:6px; justify-content:center; margin:8px 0; }
.rate .stars button { border:0; background:none; font-size:28px; color:#cbd5e1; cursor:pointer; padding:0 2px; }
.rate .stars button.on { color:#fbbf24; }
.dt-back { display:none; }
.ask { padding:12px; border-radius:10px; background:#f0fdf4; border:1px solid #bbf7d0; }
html.dark .ask { background:rgba(22,163,74,.1); border-color:rgba(22,163,74,.35); }

@media (max-width: 960px) {
  .rq-grid, .tk-grid { grid-template-columns:minmax(0,1fr); }
  .side { display:none; }
  .cats { grid-template-columns:repeat(2,1fr); gap:8px; }
  .devs { grid-template-columns:1fr; gap:8px; }
  .wz { padding:14px; }
  .fld-row { grid-template-columns:minmax(0,1fr); gap:0; }
  .wz-foot { margin-left:-14px; margin-right:-14px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow:0 -4px 12px rgba(15,23,42,.06); }
  /* มือถือ: การ์ดหมวดแบบแถวเตี้ย ให้เห็นครบไม่ต้องเลื่อนยาว */
  .cat { padding:10px; }
  .cat i { width:34px; height:34px; font-size:15px; }
  .cat b { font-size:13px; } .cat .tx span { display:none; }
  .tip { flex-wrap:wrap; } .tip .act { flex-basis:100%; padding-left:30px; }
  /* มือถือ: รายละเอียดเปิดเต็มจอทับรายการ */
  .tk-grid .dt { position:fixed; inset:0; z-index:200; max-height:none; border-radius:0; border:0; display:none; }
  .tk-grid.open .dt { display:block; }
  .dt-back { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ptc-primary); font-weight:700; cursor:pointer; padding:12px 16px 0; background:none; border:0; font-family:inherit; }
}
@media (max-width: 640px) {
  /* มือถือ: แท็บย้ายลงมาเป็นแถบเต็มกว้างใต้เมนูบน — แถบบนแคบเกินจะใส่ทุกปุ่ม */
  .rq-tabs { position:fixed; top:var(--rq-nav-h, 56px); left:0; right:0; z-index:90; border-radius:0; border-width:0 0 1px; margin:0; }
  .rq-tabs button { flex:1; justify-content:center; height:44px; }
  .rq-wrap { padding-top:calc(44px + 12px) !important; }
  .rq-techlink span, .ptc-nav-sub { display:none; }
  .rq-wrap { padding:12px 10px 30px; }
  .wz-foot .hint { display:none; }
}
</style>
</head>
<body>
<nav class="ptc-nav">
    <a href="index.html" class="nav-back" title="กลับหน้าแรก"><i class="fa fa-arrow-left"></i></a>
    <div class="ptc-nav-brand">
        <div class="ptc-nav-icon" style="background:#2563eb"><i class="fa fa-headset"></i></div>
        <div><div class="ptc-nav-title">แจ้งซ่อม IT</div><div class="ptc-nav-sub">IT Service Desk</div></div>
    </div>
    <div class="rq-tabs" role="tablist">
        <button id="tab-form-btn" onclick="switchTab('form')"><i class="fa fa-plus"></i>แจ้งใหม่</button>
        <button id="tab-tickets-btn" onclick="switchTab('tickets')"><i class="fa fa-list-check"></i>งานของฉัน<span class="cnt" id="active-cnt" style="display:none">0</span></button>
    </div>
    <a href="log.html" id="req-tech-link" class="rq-techlink" style="display:none" title="งานช่าง IT"><i class="fa fa-screwdriver-wrench"></i><span>งานช่าง</span></a>
    <a href="help.html#repair" class="nav-back" title="วิธีใช้" aria-label="วิธีใช้" style="margin-left:6px"><i class="fa fa-circle-question"></i></a>
    <div id="nav-user-area"></div>
</nav>

<main class="rq-wrap">
    <section id="panel-form"></section>
    <section id="panel-tickets" style="display:none">
        <div class="tk-grid" id="tk-grid">
            <div class="rq-card">
                <div class="tk-filter">
                    <button class="chip on" data-f="active" onclick="setFilter('active')">ยังไม่เสร็จ <b id="f-active">0</b></button>
                    <button class="chip" data-f="done" onclick="setFilter('done')">เสร็จแล้ว <b id="f-done">0</b></button>
                    <button class="chip" data-f="all" onclick="setFilter('all')">ทั้งหมด</button>
                    <input type="text" id="tk-search" placeholder="ค้นหาเลขที่ / อาการ…" oninput="renderList()">
                </div>
                <div id="tk-list"><div class="empty"><i class="fa fa-spinner fa-spin"></i>กำลังโหลด…</div></div>
            </div>

    } else if (wz.step === 3) {

        <div class="fld"><label>${wz.cat === 6 ? 'โปรแกรม / สิทธิ์ที่ต้องการ และเหตุผล' : 'อาการที่เจอ'} <span class="req">*</span></label>

        if (c && c[6] && !wz.dev) return 'เลือกเครื่อง หรือจุดที่มีปัญหา';
        if (placeRequired() && !wz.bld && !wz.place.trim()) return 'บอกว่าอยู่ที่ไหน (เลือกอาคาร หรือพิมพ์)';
    }
    if (wz.step === 3) {
        const n = wz.symptom.trim().length;
        if (n < SYMPTOM_MIN) return n ? `เล่า${wz.cat === 6 ? 'สิ่งที่ต้องการ' : 'อาการ'}อีก ${SYMPTOM_MIN - n} ตัวอักษร` : (wz.cat === 6 ? 'บอกสิ่งที่ต้องการ' : 'เล่าอาการที่เจอ');
        if (wz.sched && !wz.sDate) return 'เลือกวันที่นัด';
    }
    return '';
}
function wzSync() {
    const m = wzMiss(), btn = gid(wz.step === 2 ? 'wz-next' : 'wz-send'), el = gid('wz-miss');
    if (btn && !sending) btn.disabled = !!m;
    if (el) el.innerHTML = m ? '<i class="fa fa-circle-info"></i> ' + m : '';
}
function pickCat(i) {
    wz.cat = i;
    const c = CATS[i];
    // เลือกเครื่องให้ก่อนเฉพาะหมวดคอม (เครื่องในชื่อส่วนใหญ่เป็นโน้ตบุ๊ก) — หมวดอื่นอย่างปริ้นเตอร์ให้ผู้ใช้เลือกเอง ไม่งั้นได้เครื่องผิด
    if (!c[6] || (i !== 0 && !wz.scanned)) wz.dev = null;
    else if (!wz.dev) { const d = devList()[0]; wz.dev = d ? d.key : null; }

}
function goStep(n) {

        if (c[6] && !wz.dev) return ptcToast('warning', '', 'เลือกเครื่องหรือจุดที่มีปัญหาก่อน');
        if (placeRequired() && !wz.bld && !wz.place.trim()) { gid('wz-place')?.classList.add('bad'); gid('wz-place')?.focus(); return; }

}
function solvedSelf() {

}
function resetWizard() {

}
function addFiles(list) {

async function submitTicket() {
    if (sending) return;
    const c = CATS[wz.cat];
    if (wz.symptom.trim().length < SYMPTOM_MIN) { gid('wz-symptom')?.classList.add('bad'); gid('wz-symptom')?.focus(); return; }
    if (wz.sched && !wz.sDate) return ptcToast('warning', '', 'เลือกวันที่นัดก่อน');
    const where = [wz.bld, wz.place.trim()].filter(Boolean).join(' · ');
    const dev = c[6] ? devLabel() : '';
    // ข้อความปัญหาแบบมีหัวข้อ — หน้าช่างและใบพิมพ์อ่านต่อได้ (รูปแบบเดียวกับฟอร์มเดิม)
    const lines = [`[${wz.cat === 6 ? 'ขอใช้งาน' : 'แจ้งซ่อม'}] ${c[3]}`];
    if (dev) lines.push(`อุปกรณ์: ${dev}`);
    if (where) lines.push(`ตำแหน่ง: ${where}`);
    lines.push(`${wz.cat === 6 ? 'ความต้องการ' : 'อาการที่พบ'}: ${wz.symptom.trim()}`);
    if (wz.cat !== 6) lines.push(`เริ่มเกิดตั้งแต่: ${WHEN[wz.when]}`);
    if (wz.sched) lines.push(`นัดให้เข้า: ${wz.sDate}${wz.sTime ? ' เวลา ' + wz.sTime : ''}`);
    const asset = (wz.dev || '').startsWith('a:') ? wz.dev.slice(2) : '';
    const data = {
        date: localDate(), company: S.company || '', department: S.primary_department || '',
        requester: S.display_name || '', requester_id: S.user_id || '', asset_id: asset,
        problem: lines.join('\n'), contact: wz.phone.trim(), type: c[5], urgency: URG[wz.urg][0],
        status: 'Pending', service_type: 'IT', request_uid: `req_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`,
    };
    sending = true;
    const btn = gid('wz-send'); if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังส่ง…'; }
    try {
        const fd = new FormData();
        fd.append('action', 'add_item'); fd.append('key', 'it_logs'); fd.append('data', JSON.stringify(data)); fd.append('requester_id', data.requester_id);
        const res = await (await fetch('api.php', { method: 'POST', body: fd })).json();
        if (res.status !== 'success') throw new Error(res.message || 'บันทึกไม่สำเร็จ');
        for (const f of wz.files) {
            const f2 = new FormData(); f2.append('action', 'upload_attachment'); f2.append('log_id', res.new_id); f2.append('attachmentFile', f.file);
            try { await fetch('api.php', { method: 'POST', body: f2 }); } catch (_) {}
        }
        wz.newId = res.new_id; wz.step = 4;
        renderForm(); loadMyLogs();
    } catch (e) {
        ptcAlert('error', 'ส่งไม่สำเร็จ', e.message);
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fa fa-paper-plane"></i> ส่งแจ้งซ่อม'; }
    } finally { sending = false; }
}

// ══════════ งานของฉัน ══════════
// พิมพ์ใบงานได้เฉพาะงานที่ปิดแล้ว — ระหว่างซ่อมข้อมูลยังเปลี่ยน พิมพ์ไปก็ต้องพิมพ์ใหม่ (ลดใบซ้ำ)
async function loadMyLogs() {

        myLogs = (Array.isArray(j?.data) ? j.data : Array.isArray(j) ? j : []).filter(Boolean);
    } catch (_) { myLogs = []; }
    const act = myLogs.filter(l => !CLOSED.includes(l.status)).length;
    gid('active-cnt').textContent = act; gid('active-cnt').style.display = act ? '' : 'none';
    gid('f-active').textContent = act; gid('f-done').textContent = myLogs.length - act;

// ชื่องาน: อาการ (บรรทัด "อาการที่พบ:") หรือบรรทัดแรกที่ไม่ใช่หัวข้อ
function parseProblem(p) {
    const out = { tag: '', cat: '', fields: [], text: '' };
    const lines = String(p || '').split('\n').map(s => s.trim()).filter(Boolean);
    const rest = [];
    lines.forEach((ln, i) => {
        const m0 = i === 0 && ln.match(/^\[([^\]]+)\]\s*(.*)$/);
        if (m0) { out.tag = m0[1]; out.cat = m0[2]; return; }
        const m = ln.match(/^([^:：]{2,24})[:：]\s*(.+)$/);
        if (m && !/^https?$/i.test(m[1])) out.fields.push([m[1], m[2]]); else rest.push(ln);
    });
    out.text = rest.join('\n');
    return out;
}
function ticketTitle(l) {
    const p = parseProblem(l.problem);
    const sym = p.fields.find(f => /อาการ|ความต้องการ/.test(f[0]));
    return (sym ? sym[1] : p.text || p.fields[0]?.[1] || l.problem || '-').split('\n')[0];
}
function stepOf(st) {
    if (st === 'Pending') return 1;

    return 3;
}
function stepper(st) {

    return `<div class="stp ${cls}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>
        <div class="stp-l">${['แจ้งแล้ว', 'รับเรื่อง', 'กำลังซ่อม', 'รอยืนยัน', 'เสร็จ'].map((s, i) => `<span class="${i + 1 === n && !cls ? 'cur' : ''}">${s}</span>`).join('')}</div>`;
}
function setFilter(f) { filter = f; document.querySelectorAll('.tk-filter .chip').forEach(b => b.classList.toggle('on', b.dataset.f === f)); renderList(); }
function renderList() {
    const q = (gid('tk-search')?.value || '').toLowerCase().trim();
    let rows = myLogs.filter(l => filter === 'all' || (filter === 'active' ? !CLOSED.includes(l.status) : CLOSED.includes(l.status)));

    box.innerHTML = rows.map(l => {

            : l.status === 'Waiting for User' ? `<div class="cta" style="background:#fef2f2;border-color:#fecaca"><i class="fa fa-comment-dots" style="color:#dc2626;font-size:18px"></i><b>ช่างรอคำตอบจากคุณ</b><button class="rq-btn" onclick="event.stopPropagation();openTicket(${jsArg(l.id)})">ตอบกลับ</button></div>` : '';
        const rated = l.status === 'Completed' && +l.rating ? `<div class="stars-sm">${'★'.repeat(+l.rating)}${'☆'.repeat(5 - +l.rating)}</div>` : '';
        return `<div class="tk ${l.id === selId ? 'sel' : ''}" onclick="openTicket(${jsArg(l.id)})">

    }).join('');
}

function setStars(n) {

async function postForm(obj) {

}
async function reopenTicket(id) {
    const { value, isConfirmed } = await ptcSwal().fire({ title: 'ยังใช้งานไม่ได้', input: 'textarea', inputPlaceholder: 'เล่าอาการที่ยังเป็นอยู่ เช่น ยังเปิดเครื่องไม่ได้', showCancelButton: true, confirmButtonText: 'ส่งกลับให้ช่าง', cancelButtonText: 'ยกเลิก', inputValidator: v => !v.trim() && 'กรุณาเล่าอาการ' });
    if (!isConfirmed) return;
    try { await postForm({ action: 'reopen_ticket', ticket_id: id, reason: value.trim() }); await loadMyLogs(); ptcToast('info', '', 'ส่งกลับทีม IT แล้ว'); }
    catch (e) { ptcAlert('error', 'ไม่สำเร็จ', e.message); }
}
async function cancelTicket(id) {
    const { value, isConfirmed } = await ptcSwal().fire({ title: 'ยกเลิกงานนี้?', input: 'select', inputOptions: { 'แก้ได้เองแล้ว': 'แก้ได้เองแล้ว', 'แจ้งผิด / ซ้ำ': 'แจ้งผิด / ซ้ำ', 'ไม่ต้องการแล้ว': 'ไม่ต้องการแล้ว' }, showCancelButton: true, confirmButtonText: 'ยืนยันยกเลิก', cancelButtonText: 'ไม่ยกเลิก' });
    if (!isConfirmed) return;
    try { await postForm({ action: 'cancel_ticket', id, reason: `[USER CANCELLED] เหตุผล: ${value}` }); await loadMyLogs(); ptcToast('success', '', 'ยกเลิกแล้ว'); }
    catch (e) { ptcAlert('error', 'ไม่สำเร็จ', e.message); }
}
async function sendMsg(id) {
    const el = gid('msg-' + id); const msg = (el?.value || '').trim();
    if (!msg) return;
    try { el.disabled = true; const j = await postForm({ action: 'add_ticket_comment', ticket_id: id, message: msg }); if (j.new_status) await loadMyLogs(); else await renderDetail(id); }
    catch (e) { ptcAlert('error', 'ส่งไม่ได้', e.message); if (el) el.disabled = false; }
}

// ══════════ แท็บ / เริ่มต้น ══════════
// ความสูงเมนูบนจริง (มือถือเตี้ยกว่าคอม) — ใช้วางแถบแท็บให้ชิดพอดี
function syncNavH() { const n = document.querySelector('.ptc-nav'); if (n) document.documentElement.style.setProperty('--rq-nav-h', n.getBoundingClientRect().bottom + 'px'); }
window.addEventListener('resize', syncNavH);
function switchTab(t) {
    syncNavH();
    gid('panel-form').style.display = t === 'form' ? '' : 'none';
    gid('panel-tickets').style.display = t === 'tickets' ? '' : 'none';
    gid('tab-form-btn').classList.toggle('on', t === 'form');
    gid('tab-tickets-btn').classList.toggle('on', t === 'tickets');
    try { const u = new URL(location.href); u.searchParams.set('tab', t); history.replaceState(null, '', u); } catch (_) {}
    if (t === 'form') renderForm();
}
(async function init() {
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) { S = {}; }
    if (!S.loggedin) { location.href = 'login.html'; return; }
    const perms = S.effective_permissions || [];
    if (S.role === 'admin' || perms.includes('*') || perms.includes('it_log.access')) gid('req-tech-link').style.display = '';
    const q = new URLSearchParams(location.search);
    if (q.get('asset_id')) { wz.scanned = q.get('asset_id').trim(); wz.dev = 'a:' + wz.scanned; }
    const [sup, assets] = await Promise.all([
        fetch('api.php?action=get_it_support_settings').then(r => r.json()).catch(() => ({})),
        fetch('api.php?action=get_my_assets').then(r => r.json()).catch(() => []),
    ]);
    SUP = sup || {}; myAssets = Array.isArray(assets) ? assets : [];
    // เบอร์ติดต่อจากข้อมูลพนักงาน (เติมให้ก่อน แก้ได้)
    fetch('api.php?action=get&file=employees').then(r => r.json()).then(list => {
        const me = (Array.isArray(list) ? list : list?.data || []).find(e => String(e.id) === String(S.user_id));
        if (me && !wz.phone) { wz.phone = me.phone || ''; if (wz.step === 3) renderForm(); }
    }).catch(() => {});
    const tab = q.get('tab') || (q.get('asset_id') ? 'form' : 'form');
    switchTab(tab === 'tickets' ? 'tickets' : 'form');
    await loadMyLogs();
    if (q.get('id')) openTicket(q.get('id'));
    // งานที่รอยืนยันเกิน 3 วัน ระบบปิดให้เอง (ทำครั้งเดียวต่อการเปิดหน้า)
    postForm({ action: 'auto_close_tickets' }).then(r => { if (r.closed > 0) loadMyLogs(); }).catch(() => {});
})();
</script>
