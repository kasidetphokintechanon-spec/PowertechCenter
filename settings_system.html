<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งค่าระบบ - PowertechCenter</title>
    <link rel="icon" href="favicon.ico">
    <script src="js/favicon-version.js"></script>
    <link rel="stylesheet" href="css/fonts/inter-kanit-local.css">
    <link rel="stylesheet" href="css/vendor/fontawesome.min.css"/>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/enterprise-theme.css?v=20261021">
    <script src="js/vendor/sweetalert2.min.js"></script>
    <script src="js/enterprise-swal.js?v=20261021b"></script>
    <script src="js/ptc-swal-ui.js?v=20260530"></script>
    <script>(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark','dark-theme');})()</script>
<style>
/* ════ ตั้งค่าระบบ — รวมข้อมูลบริษัท/โลโก้ (เดิม admin_logo.html) + ทีม IT + QR พัสดุ + เลขเอกสาร · สีจาก token design-system ════ */
html, body { overflow-y:auto !important; height:auto !important; }
body { background:var(--ptc-bg); color:var(--ptc-text); margin:0; font-family:Kanit, Inter, sans-serif; }
.st-top { position:sticky; top:0; z-index:100; background:var(--ptc-surface); border-bottom:1px solid var(--ptc-border); border-top:3px solid var(--ptc-primary); display:flex; align-items:center; gap:12px; padding:0 16px; height:56px; }
.st-back { width:34px; height:34px; border-radius:8px; border:1px solid var(--ptc-border); display:flex; align-items:center; justify-content:center; color:var(--ptc-text-2); text-decoration:none; }
.st-ic { width:34px; height:34px; border-radius:9px; background:#475569; color:#fff; display:flex; align-items:center; justify-content:center; }
.st-top b { font-size:15px; display:block; } .st-top small { font-size:11.5px; color:var(--ptc-text-muted); }
.layout { max-width:1280px; margin:0 auto; padding:18px 16px 100px; display:grid; grid-template-columns:220px minmax(0,1fr); gap:18px; align-items:start; }
.side { position:sticky; top:74px; display:flex; flex-direction:column; gap:4px; }
.side a { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:9px; color:var(--ptc-text-2); text-decoration:none; font-size:13.5px; font-weight:600; border:1px solid transparent; white-space:nowrap; }
.side a i { width:18px; text-align:center; color:var(--ptc-text-muted); }
.side a.on { background:var(--ptc-surface); border-color:var(--ptc-border); color:var(--ptc-text); box-shadow:inset 3px 0 0 var(--ptc-primary); }
.side a.on i { color:var(--ptc-primary); }
.side a .dot { margin-left:auto; width:7px; height:7px; border-radius:50%; background:#d97706; display:none; }
.side a.dirty .dot { display:block; }
.side small { font-size:11px; color:var(--ptc-text-muted); padding:10px 12px 0; line-height:1.5; }
.card { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; }
.h { font-size:17px; font-weight:800; margin:0; } .s { font-size:12.5px; color:var(--ptc-text-muted); margin:3px 0 0; }
.anchor { scroll-margin-top:74px; margin-top:28px; } .anchor:first-child { margin-top:0; }
.seg { display:inline-flex; border:1px solid var(--ptc-border); border-radius:9px; overflow:hidden; margin:14px 0; }
.seg button { border:0; background:var(--ptc-surface); padding:9px 16px; font:inherit; font-size:13px; font-weight:700; color:var(--ptc-text-2); cursor:pointer; display:flex; gap:8px; align-items:center; }
.seg button.on { background:var(--ptc-text); color:var(--ptc-surface); }
.seg .sw { width:10px; height:10px; border-radius:3px; }
.seg .dd { width:6px; height:6px; border-radius:50%; background:#d97706; }
.co { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:16px; align-items:start; }
.sec { padding:16px 18px; border-bottom:1px solid var(--ptc-border); }
.sec:last-child { border-bottom:0; }
.sec h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); margin:0 0 12px; letter-spacing:.03em; }
.row { display:flex; gap:14px; align-items:center; }
.logo { width:96px; height:96px; border-radius:12px; border:1.5px dashed var(--ptc-border); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; color:var(--ptc-text-muted); font-size:11px; background:var(--ptc-surface-2); flex-shrink:0; overflow:hidden; }
.logo img { width:100%; height:100%; object-fit:contain; background:#fff; }
.logo.sm { width:60px; height:60px; }
.fg { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.f label { display:block; font-size:12px; font-weight:700; color:var(--ptc-text-2); margin-bottom:5px; }
.f input, .f textarea { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:9px 11px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; }
.f textarea { resize:vertical; }
.f.full { grid-column:1 / -1; }
.f .hint { font-size:11.5px; color:var(--ptc-text-muted); margin-top:4px; }
.f .warn { font-size:11.5px; color:#d97706; margin-top:4px; font-weight:600; }
.f .warn button { border:0; background:none; color:var(--ptc-primary); font:inherit; font-weight:700; cursor:pointer; padding:0; text-decoration:underline; }
.btn { height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-weight:700; font-size:12.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn:hover { border-color:var(--ptc-primary); }
.btn.pri { background:var(--ptc-primary); border-color:var(--ptc-primary); color:#fff; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.qr { width:64px; height:64px; border:1px solid var(--ptc-border); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:28px; color:#06c755; flex-shrink:0; overflow:hidden; background:#fff; }
.qr img { width:100%; height:100%; object-fit:contain; }
/* ตัวอย่างหัวใบพิมพ์ — กระดาษสีขาวเสมอ (ของจริงพิมพ์บนกระดาษ) */
.pv { position:sticky; top:74px; }
.paper { background:#fff; color:#0f172a; border-radius:6px; box-shadow:0 8px 24px rgba(15,23,42,.14); padding:22px 20px; font-size:9px; min-height:250px; }
.paper .hd { display:flex; gap:10px; align-items:flex-start; border-bottom:2px solid var(--c); padding-bottom:8px; }
.paper .lg { width:42px; height:42px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:12px; background:var(--c); flex-shrink:0; overflow:hidden; }
.paper .lg img { width:100%; height:100%; object-fit:contain; background:#fff; }
.paper .co-n { min-width:0; } .paper .co-n b { font-size:12px; display:block; } .paper .co-n span { color:#475569; display:block; margin-top:1px; } .paper .co-n small { color:#94a3b8; font-size:8px; display:block; margin-top:2px; overflow-wrap:anywhere; }
.paper .meta { margin-left:auto; text-align:right; flex-shrink:0; } .paper .meta .id { font-family:Consolas, monospace; font-weight:800; font-size:10.5px; color:var(--c); }
.paper .ttl { margin-top:10px; background:var(--c); color:#fff; border-radius:4px; padding:6px 10px; font-weight:800; font-size:11px; display:flex; justify-content:space-between; }
.paper .ln { height:8px; border-radius:2px; background:#f1f5f9; margin-top:7px; }
.pv-cap { font-size:12px; color:var(--ptc-text-muted); text-align:center; margin-top:10px; }
.apps { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; margin-top:12px; }
.app { padding:14px; display:flex; gap:12px; align-items:center; }
.app b { display:block; font-size:13.5px; } .app small { color:var(--ptc-text-muted); font-size:11.5px; }
.grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
.sticker { width:250px; border:1px solid #e2e8f0; border-radius:8px; padding:10px; display:flex; gap:10px; background:#fff; color:#0f172a; font-size:10px; }
.sticker .q { width:62px; height:62px; flex-shrink:0; border:1px solid #e2e8f0; border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:34px; color:#0f172a; }
table.iso { width:100%; border-collapse:collapse; font-size:13px; }
table.iso th { text-align:left; font-size:11.5px; color:var(--ptc-text-muted); padding:9px 10px; border-bottom:1px solid var(--ptc-border); }
table.iso td { padding:6px 10px; border-bottom:1px solid var(--ptc-border); }
table.iso tr:last-child td { border-bottom:0; }
table.iso input { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:6px; padding:6px 8px; font:inherit; font-size:12.5px; background:var(--ptc-surface); color:var(--ptc-text); }
.tag { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:#f0fdf4; color:#16a34a; white-space:nowrap; }
.tag.no { background:var(--ptc-surface-2); color:var(--ptc-text-muted); }
html.dark .tag { background:rgba(22,163,74,.14); }
/* แถบบันทึก — ขึ้นเฉพาะตอนมีการแก้ไข */
.save { position:fixed; left:50%; bottom:18px; transform:translate(-50%, 140%); background:#0f172a; color:#fff; border-radius:12px; padding:10px 12px 10px 18px; display:flex; gap:12px; align-items:center; box-shadow:0 10px 30px rgba(15,23,42,.3); font-size:13px; z-index:150; transition:transform .2s; max-width:calc(100vw - 24px); }
.save.show { transform:translate(-50%, 0); }
html.dark .save { background:#1e293b; border:1px solid #334155; }
.save .btn.ghost { background:transparent; color:#cbd5e1; border-color:#334155; }
.save span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
@media (max-width:1100px) { .co { grid-template-columns:minmax(0,1fr); } .pv { position:static; } }
@media (max-width:900px) {
  .layout { grid-template-columns:minmax(0,1fr); padding-top:12px; }
  .side { position:sticky; top:56px; z-index:50; flex-direction:row; overflow-x:auto; background:var(--ptc-bg); padding:6px 0; scrollbar-width:none; }
  .side small { display:none; }
  .fg, .grid3, .apps { grid-template-columns:minmax(0,1fr); }
  .anchor { scroll-margin-top:110px; }
}
@media (max-width:640px) { .st-top small { display:none; } }
</style>
</head>
<body data-page="settings_system">
<header class="st-top">
    <a href="admin.html" class="st-back" aria-label="กลับ"><i class="fa fa-arrow-left"></i></a>
    <div class="st-ic"><i class="fa fa-gear"></i></div>
    <div><b>ตั้งค่าระบบ</b><small>ข้อมูลบริษัท · ทีม IT · QR พัสดุ · เลขเอกสาร</small></div>
    <div style="flex:1"></div>
    <div id="nav-user-area"></div>
</header>
<div style="display:flex;min-height:calc(100vh - 56px)">
<aside id="ptc-sidebar"></aside>
<div style="flex:1;min-width:0">
<div class="layout">
    <nav class="side" id="side">
        <a href="#company" data-g="company"><i class="fa fa-building"></i>ข้อมูลบริษัท<span class="dot"></span></a>
        <a href="#icons" data-g="icons"><i class="fa fa-mobile-screen"></i>ไอคอนแอป<span class="dot"></span></a>
        <a href="#it" data-g="it"><i class="fa fa-headset"></i>ทีม IT และเวลาตอบสนอง<span class="dot"></span></a>
        <a href="#qr" data-g="qr"><i class="fa fa-qrcode"></i>QR สติกเกอร์พัสดุ<span class="dot"></span></a>
        <a href="#iso" data-g="iso"><i class="fa fa-file-lines"></i>เลขที่เอกสาร (ISO)<span class="dot"></span></a>
        <small>แก้แล้วแถบบันทึกจะขึ้นด้านล่าง · จุดสีส้ม = หมวดที่ยังไม่บันทึก</small>
    </nav>
    <main id="app"><div class="card" style="padding:30px;text-align:center;color:var(--ptc-text-muted)"><i class="fa fa-spinner fa-spin"></i> กำลังโหลด…</div></main>
</div>
</div>
</div>
<div class="save" id="savebar"><span id="save-msg"></span><button class="btn ghost" onclick="discard()">ยกเลิก</button><button class="btn pri" id="save-btn" onclick="saveAll()"><i class="fa fa-check"></i> บันทึก</button></div>
<input type="file" id="logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none">

<script>
const gid = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// สีและชื่อชุดเดียวกับหัวใบพิมพ์ (js/doc-print.js)
const COS = { PTA: '#059669', PT4: '#dc2626', PTE: '#2563eb' };
const GROUP_TH = { company: 'ข้อมูลบริษัท', it: 'ทีม IT', qr: 'QR พัสดุ', iso: 'เลขเอกสาร' };
const CI_KEYS = ['name_th', 'name_en', 'address_th', 'address_en', 'phone', 'fax', 'tax_id'];

let saved = null, cur = null, co = 'PTA', logoTs = Date.now();

async function api(params) { return (await fetch('api.php?' + new URLSearchParams(params), { cache: 'no-store' })).json(); }
async function post(obj) {
    const fd = new FormData(); Object.entries(obj).forEach(([k, v]) => fd.append(k, v ?? ''));
    const j = await (await fetch('api.php', { method: 'POST', body: fd })).json();
    if (j.status !== 'success') throw new Error(j.message || 'บันทึกไม่สำเร็จ');
    return j;
}
const clone = o => JSON.parse(JSON.stringify(o));
const extractUrl = raw => { const t = String(raw || '').trim(); const m = t.match(/src=["']([^"']+)["']/i); return m ? m[1].trim() : t; };

async function load() {
    const [ci, it, sc, df] = await Promise.all([
        api({ action: 'get_company_info' }).catch(() => ({})),
        api({ action: 'get_it_support_settings' }).catch(() => ({})),
        api({ action: 'get_scan_settings' }).catch(() => ({})),
        api({ action: 'get_doc_forms' }).catch(() => ({})),
    ]);
    const company = {};
    Object.keys(COS).forEach(k => {
        const d = (ci.data || {})[k] || {};
        company[k] = Object.fromEntries(CI_KEYS.map(x => [x, d[x] || '']));
        company[k].line_id = sc['line_id_' + k.toLowerCase()] || '';
        company[k].line_qr = extractUrl(sc['line_qr_' + k.toLowerCase()] || '');
    });
    saved = {
        company,
        it: { phone: it.phone || '', line: it.line || '', sla_normal: it.sla_normal || '', sla_urgent: it.sla_urgent || '', sla_critical: it.sla_critical || '', sla_hours: it.sla_hours || '' },
        qr: { primary_url: sc.primary_url || '', backup_url: sc.backup_url || '', line_group_url: sc.line_group_url || '' },
        iso: df.forms || {},
    };
    cur = clone(saved);
    render();
    if (location.hash) setTimeout(() => document.querySelector(location.hash)?.scrollIntoView(), 50);
}

// ── เช็กว่าหมวดไหนแก้ค้าง ──
function dirtyGroups() {
    const out = [];
    if (JSON.stringify(cur.company) !== JSON.stringify(saved.company)) out.push('company');
    ['it', 'qr', 'iso'].forEach(g => { if (JSON.stringify(cur[g]) !== JSON.stringify(saved[g])) out.push(g); });
    return out;
}
const coDirty = k => JSON.stringify(cur.company[k]) !== JSON.stringify(saved.company[k]);
function syncDirty() {
    const d = dirtyGroups();
    document.querySelectorAll('#side a').forEach(a => a.classList.toggle('dirty', d.includes(a.dataset.g)));
    document.querySelectorAll('#seg button').forEach(b => { const dd = b.querySelector('.dd'); if (dd) dd.style.display = coDirty(b.dataset.co) ? '' : 'none'; });
    const coList = Object.keys(COS).filter(coDirty);
    gid('save-msg').innerHTML = `<i class="fa fa-circle-exclamation" style="color:#fbbf24"></i> ยังไม่บันทึก: ${d.map(g => g === 'company' ? 'ข้อมูลบริษัท ' + coList.join(', ') : GROUP_TH[g]).join(' · ')}`;
    gid('savebar').classList.toggle('show', d.length > 0);
}
window.addEventListener('beforeunload', e => { if (cur && dirtyGroups().length) { e.preventDefault(); e.returnValue = ''; } });

// ── วาดหน้า ──
function render() {
    const iso = Object.entries(cur.iso);
    gid('app').innerHTML = `
    <section id="company" class="anchor"><h2 class="h">ข้อมูลบริษัท</h2><p class="s">ชื่อ โลโก้ ที่อยู่ — ไปโผล่ที่หัวใบพิมพ์ทุกใบ สติกเกอร์พัสดุ และหน้าสแกน QR</p>
        <div class="seg" id="seg">${Object.keys(COS).map(k => `<button data-co="${k}" class="${k === co ? 'on' : ''}" onclick="pickCo('${k}')"><span class="sw" style="background:${COS[k]}"></span>${k}<span class="dd" style="display:none"></span></button>`).join('')}</div>
        <div class="co"><div class="card" id="co-form"></div><div class="pv"><div class="paper" id="paper"></div><div class="pv-cap">ตัวอย่างหัวใบพิมพ์ — ใบแจ้งซ่อม ใบติดตั้ง ใบตรวจห้อง ใช้หัวเดียวกันทุกใบ</div></div></div></section>

    <section id="icons" class="anchor"><h2 class="h">ไอคอนแอป</h2><p class="s">ไอคอนตอนติดตั้งเป็นแอปบนมือถือ/คอม และไอคอนบนแท็บเบราว์เซอร์ · เปลี่ยนแล้วมีผลทันที (ไม่ต้องกดบันทึก)</p>
        <div class="apps">${[['APP', 'แอปหลัก', 'Powertech Center', 'powertech_app_icon.png'], ['DIR', 'Contact List', 'แอปสมุดรายชื่อ', 'directory_app_icon.png']].map(a => `<div class="card app">
            <div class="logo sm"><img src="uploads/logos/${a[3]}?t=${logoTs}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fa fa-image'}))"></div>
            <div><b>${a[1]}</b><small>${a[2]}</small><br><button class="btn" style="margin-top:6px;height:28px" onclick="pickLogo('${a[0]}')"><i class="fa fa-upload"></i> เปลี่ยนไอคอน</button></div></div>`).join('')}</div>
        <p class="s" style="margin-top:8px"><i class="fa fa-circle-info"></i> คนที่ติดตั้งแอปไว้แล้ว อาจยังเห็นไอคอนเก่า — ลบแอปแล้วติดตั้งใหม่จากเบราว์เซอร์</p></section>

    <section id="it" class="anchor"><h2 class="h">ทีม IT และเวลาตอบสนอง</h2><p class="s">โชว์ในหน้าแจ้งซ่อม · เวลารับเรื่องใช้นับถอยหลังบนบอร์ดช่าง แจ้งเตือนงานเกินเวลา และรายงาน IT</p>
        <div class="card" style="margin-top:12px"><div class="sec"><div class="fg">
            ${fld('it', 'phone', 'เบอร์โทร / ต่อภายใน', 'เช่น 1234 หรือ 08x-xxx-xxxx')}${fld('it', 'line', 'LINE ทีม IT', 'เช่น @ptcitsupport')}
            ${fld('it', 'sla_hours', 'เวลาทำการ', 'เช่น จ.–ศ. 08:00–17:30')}<div></div></div></div>
            <div class="sec"><h4>ต้องรับเรื่องภายใน</h4><div class="grid3">
                ${fld('it', 'sla_normal', 'ทั่วไป', 'ภายใน 4 ชม.')}${fld('it', 'sla_urgent', '<span style="color:#d97706">ด่วน</span>', 'ภายใน 2 ชม.')}${fld('it', 'sla_critical', '<span style="color:#dc2626">ด่วนที่สุด</span>', 'ภายใน 30 นาที')}</div>
                <p class="s" style="margin-top:8px" id="sla-read"></p></div></div></section>

    <section id="qr" class="anchor"><h2 class="h">QR สติกเกอร์พัสดุ</h2><p class="s">ลิงก์ที่ฝังใน QR บนสติกเกอร์ — สแกนแล้วต้องล็อกอินก่อนเห็นข้อมูลเครื่อง · มีผลกับสติกเกอร์ที่พิมพ์ใหม่</p>
        <div class="card" style="margin-top:12px"><div class="sec" style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">
            <div class="fg" style="flex:1;min-width:260px;grid-template-columns:minmax(0,1fr)">
                ${fld('qr', 'primary_url', '<i class="fa fa-wifi"></i> ลิงก์หลัก (ในบริษัท)', 'http://192.168.0.2/PowertechCenter', 'ใช้ตอนต่อ WiFi บริษัท (เร็วกว่า)')}
                ${fld('qr', 'backup_url', '<i class="fa fa-globe"></i> ลิงก์สำรอง (นอกบริษัท)', 'https://….myqnapcloud.com:8081/PowertechCenter', 'ใช้ตอนอยู่นอกบริษัท')}
                ${fld('qr', 'line_group_url', '<i class="fab fa-line"></i> ลิงก์กลุ่ม LINE IT', 'https://line.me/ti/g2/…', 'ปุ่ม "เปิด LINE กลุ่ม IT" ในหน้าสแกน')}</div>
            <div><p class="s" style="margin:0 0 6px">ตัวอย่างสติกเกอร์</p><div class="sticker"><div class="q"><i class="fa fa-qrcode"></i></div><div><b style="font-size:11px">PTA-NB-0142</b><br>Dell Latitude 5440<br><span style="color:#64748b">สแกนเพื่อดูข้อมูล / แจ้งซ่อม</span><br><span style="color:#94a3b8;font-size:8.5px;overflow-wrap:anywhere" id="stk-url"></span></div></div></div></div></div></section>

    <section id="iso" class="anchor"><h2 class="h">เลขที่เอกสาร (ISO)</h2><p class="s">ขึ้นกล่องเลขฟอร์มมุมขวาบนของใบพิมพ์ · ใบไหนเว้นเลขฟอร์มว่าง จะไม่โชว์กล่อง</p>
        <div class="card" style="margin-top:12px;overflow-x:auto"><table class="iso"><thead><tr><th>เอกสาร</th><th style="width:160px">เลขฟอร์ม</th><th style="width:76px">Rev.</th><th style="width:124px">วันที่มีผล</th><th style="width:70px"></th></tr></thead><tbody>
            ${iso.length ? iso.map(([k, f]) => `<tr><td>${esc(f.label)}</td><td><input data-iso="${esc(k)}" data-f="no" value="${esc(f.no)}" placeholder="เช่น IT-FM-001" maxlength="40"></td>
                <td><input data-iso="${esc(k)}" data-f="rev" value="${esc(f.rev)}" placeholder="01" maxlength="10"></td><td><input data-iso="${esc(k)}" data-f="eff" value="${esc(f.eff)}" placeholder="01/01/2569" maxlength="20"></td>
                <td><span class="tag ${f.no ? '' : 'no'}" id="iso-tag-${esc(k)}">${f.no ? 'โชว์' : 'ไม่โชว์'}</span></td></tr>`).join('') : '<tr><td colspan="5" style="color:var(--ptc-text-muted)">โหลดรายการไม่สำเร็จ</td></tr>'}
        </tbody></table></div></section>`;
    // ช่องกรอกทุกช่องอัปเดต state แล้วเช็กค้าง
    document.querySelectorAll('[data-g][data-k]').forEach(el => el.addEventListener('input', () => { cur[el.dataset.g][el.dataset.k] = el.value; syncDirty(); if (el.dataset.g === 'it') slaRead(); if (el.dataset.g === 'qr') stk(); }));
    document.querySelectorAll('[data-iso]').forEach(el => el.addEventListener('input', () => {
        const f = cur.iso[el.dataset.iso]; f[el.dataset.f] = el.value;
        const tg = gid('iso-tag-' + el.dataset.iso); tg.className = 'tag ' + (f.no.trim() ? '' : 'no'); tg.textContent = f.no.trim() ? 'โชว์' : 'ไม่โชว์';
        syncDirty();
    }));
    renderCo(); slaRead(); stk(); syncDirty(); spy();
}
function fld(g, k, label, ph, hint) {
    return `<div class="f"><label>${label}</label><input data-g="${g}" data-k="${k}" value="${esc(cur[g][k])}" placeholder="${esc(ph || '')}">${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
// อ่านตัวเลขจากข้อความ SLA แบบเดียวกับบอร์ดช่าง — ให้เห็นว่าระบบเข้าใจถูก
function slaRead() {
    const p = t => { const m = String(t).match(/(\d+(?:\.\d+)?)\s*(ชม|ชั่วโมง|นาที|วัน)/); return m ? +m[1] * (m[2] === 'นาที' ? 1 : m[2] === 'วัน' ? 1440 : 60) : null; };
    const show = n => n == null ? '<b style="color:#dc2626">อ่านไม่ออก</b>' : n < 60 ? n + ' นาที' : (n / 60) + ' ชม.';
    gid('sla-read').innerHTML = `<i class="fa fa-circle-info"></i> ระบบอ่านได้ว่า ทั่วไป ${show(p(cur.it.sla_normal))} · ด่วน ${show(p(cur.it.sla_urgent))} · ด่วนที่สุด ${show(p(cur.it.sla_critical))} — ใส่เป็นตัวเลขตามด้วย "นาที" "ชม." หรือ "วัน"`;
}
function stk() { const el = gid('stk-url'); if (el) el.textContent = (cur.qr.primary_url || '…') + '/scan.php?id=PTA-NB-0142'; }

function pickCo(k) { co = k; document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.co === k)); renderCo(); }
function renderCo() {
    const c = cur.company[co];
    const typo = /industrail/i.test(c.address_en);
    gid('co-form').innerHTML = `
        <div class="sec"><h4>โลโก้ ${co}</h4><div class="row"><div class="logo" id="co-logo"></div>
            <div><button class="btn" onclick="pickLogo('${co}')"><i class="fa fa-upload"></i> เปลี่ยนโลโก้</button><p class="s" style="margin-top:6px">PNG พื้นใส · แนะนำ 512×512 · ไม่เกิน 10 MB · อัปโหลดแล้วมีผลทันที</p></div></div></div>
        <div class="sec"><h4>ชื่อและที่อยู่</h4><div class="fg">
            ${cf('name_th', 'ชื่อบริษัท (ไทย)')}${cf('name_en', 'ชื่อบริษัท (อังกฤษ) — ตัวใหญ่บนหัวใบพิมพ์')}
            ${cf('address_th', 'ที่อยู่ (ไทย)', 1)}
            <div class="f full"><label>ที่อยู่ (อังกฤษ) — บรรทัดเล็กบนหัวใบพิมพ์</label><textarea data-ci="address_en" rows="2">${esc(c.address_en)}</textarea>
                ${typo ? `<div class="warn"><i class="fa fa-triangle-exclamation"></i> สะกดผิดหรือเปล่า: "Industrail" → "Industrial" <button type="button" onclick="fixTypo()">แก้ให้</button></div>` : ''}</div>
            ${cf('phone', 'โทรศัพท์')}${cf('fax', 'แฟกซ์')}${cf('tax_id', 'เลขประจำตัวผู้เสียภาษี')}</div></div>
        <div class="sec"><h4>LINE ประจำบริษัท <span style="font-weight:500;color:var(--ptc-text-muted)">— พิมพ์บนสติกเกอร์พัสดุ</span></h4><div class="row" style="align-items:flex-start">
            <div class="qr" id="co-qr"></div><div class="fg" style="flex:1">${cf('line_id', 'LINE ID', 0, '@xxxxxxx')}${cf('line_qr', 'ลิงก์รูป QR', 0, 'https://qr-official.line.me/…', 'LINE OA Manager → QR Code → คลิกขวา "Copy image address"')}</div></div></div>`;
    gid('co-form').querySelectorAll('[data-ci]').forEach(el => el.addEventListener('input', () => {
        let v = el.value;
        if (el.dataset.ci === 'line_qr') { const u = extractUrl(v); if (u !== v.trim()) { v = u; el.value = u; } qrPv(); }
        cur.company[co][el.dataset.ci] = v; syncDirty(); paper();
        if (el.dataset.ci === 'address_en' && /industrail/i.test(v) !== !!el.parentNode.querySelector('.warn')) { renderCo(); const t = gid('co-form').querySelector('[data-ci="address_en"]'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
    }));
    logoPv(); qrPv(); paper();
}
function cf(k, label, full, ph, hint) {
    return `<div class="f ${full ? 'full' : ''}"><label>${label}</label><input data-ci="${k}" value="${esc(cur.company[co][k])}" placeholder="${esc(ph || '')}">${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;
}
function fixTypo() { cur.company[co].address_en = cur.company[co].address_en.replace(/Industrail/g, 'Industrial').replace(/industrail/g, 'industrial'); renderCo(); syncDirty(); }
function logoPv() {
    const box = gid('co-logo'); if (!box) return;
    const img = new Image();
    img.onload = () => { box.innerHTML = ''; box.appendChild(img); paper(); };
    img.onerror = () => { box.innerHTML = '<i class="fa fa-image" style="font-size:22px"></i>ยังไม่มีโลโก้'; };
    img.src = `uploads/logos/${co.toLowerCase()}_logo.png?t=${logoTs}`;
}
function qrPv() {
    const box = gid('co-qr'); if (!box) return;
    const u = cur.company[co].line_qr;
    if (!u) { box.innerHTML = '<i class="fab fa-line"></i>'; return; }
    const img = new Image(); img.onload = () => { box.innerHTML = ''; box.appendChild(img); }; img.onerror = () => { box.innerHTML = '<i class="fab fa-line" style="color:#dc2626" title="เปิดรูปไม่ได้"></i>'; }; img.src = u;
}
function paper() {
    const c = cur.company[co], img = gid('co-logo')?.querySelector('img');
    gid('paper').innerHTML = `<div style="--c:${COS[co]}"><div class="hd"><div class="lg">${img ? `<img src="${img.src}" alt="">` : co}</div>
        <div class="co-n"><b>${esc(c.name_en || c.name_th || '—')}</b><span>${c.name_en ? esc(c.name_th) + ' · ' : ''}ฝ่ายเทคโนโลยีสารสนเทศ</span><small>${esc(c.address_en || 'ยังไม่ได้ใส่ที่อยู่ภาษาอังกฤษ')}${c.phone ? ' · ' + esc(c.phone) : ''}</small></div>
        <div class="meta"><div style="color:#64748b">เลขที่</div><div class="id">${co}-MIS261022-05</div>${cur.iso.repair?.no ? `<div style="color:#64748b">${esc(cur.iso.repair.no)}${cur.iso.repair.rev ? ' Rev.' + esc(cur.iso.repair.rev) : ''}</div>` : ''}</div></div>
        <div class="ttl"><span>ใบแจ้งซ่อม</span><span style="font-weight:600">Service Request</span></div>
        <div class="ln" style="width:90%"></div><div class="ln" style="width:70%"></div><div class="ln" style="width:82%"></div><div class="ln" style="width:55%"></div><div class="ln" style="width:75%"></div></div>`;
}

// ── อัปโหลดโลโก้/ไอคอน (มีผลทันที ไม่รวมกับแถบบันทึก) ──
let logoTarget = null;
function pickLogo(code) { logoTarget = code; gid('logo-file').value = ''; gid('logo-file').click(); }
gid('logo-file').addEventListener('change', async e => {
    const f = e.target.files[0]; if (!f || !logoTarget) return;
    if (f.size > 10 * 1024 * 1024) return ptcAlert('warning', 'ไฟล์ใหญ่เกินไป', 'ใช้ไฟล์ไม่เกิน 10 MB');
    const label = { APP: 'ไอคอนแอปหลัก', DIR: 'ไอคอน Contact List' }[logoTarget] || 'โลโก้ ' + logoTarget;
    const prev = URL.createObjectURL(f);
    const { isConfirmed } = await ptcSwal().fire({ title: `เปลี่ยน${label}?`, html: `<img src="${prev}" style="max-width:160px;max-height:160px;border:1px solid #e2e8f0;border-radius:10px;background:#fff">`, showCancelButton: true, confirmButtonText: 'อัปโหลด', cancelButtonText: 'ยกเลิก' });
    if (!isConfirmed) return;
    try {
        const fd = new FormData(); fd.append('action', 'upload_company_logo'); fd.append('company', logoTarget); fd.append('logoFile', f);
        const j = await (await fetch('api.php', { method: 'POST', body: fd })).json();
        if (j.status !== 'success') throw new Error(j.message || 'อัปโหลดไม่สำเร็จ');
        logoTs = Date.now();
        ptcToast('success', `อัปเดต${label}แล้ว`, j.needs_repin ? 'คนที่ติดตั้งแอปไว้ อาจต้องติดตั้งใหม่ถึงจะเห็นไอคอนใหม่' : '');
        const keep = clone(cur); render(); cur = keep; renderCo(); syncDirty();
    } catch (err) { ptcAlert('error', 'อัปโหลดไม่สำเร็จ', err.message); }
});

// ── บันทึก / ยกเลิก ──
async function saveAll() {
    const d = dirtyGroups(); if (!d.length) return;
    const btn = gid('save-btn'); btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังบันทึก';
    try {
        const jobs = [];
        Object.keys(COS).filter(coDirty).forEach(k => jobs.push(post({ action: 'save_company_info', company: k, ...Object.fromEntries(CI_KEYS.map(x => [x, cur.company[k][x].trim()])) })));
        if (d.includes('it')) jobs.push(post({ action: 'save_it_support_settings', ...Object.fromEntries(Object.entries(cur.it).map(([k, v]) => [k, v.trim()])) }));
        // ลิงก์ QR + LINE ประจำบริษัทอยู่ในชุดเดียวกัน (save_scan_settings เขียนทับทุกช่อง) — ส่งครบเสมอ
        if (d.includes('qr') || Object.keys(COS).some(k => cur.company[k].line_id !== saved.company[k].line_id || cur.company[k].line_qr !== saved.company[k].line_qr)) {
            const p = { action: 'save_scan_settings', primary_url: cur.qr.primary_url.trim(), backup_url: cur.qr.backup_url.trim(), line_group_url: cur.qr.line_group_url.trim() };
            Object.keys(COS).forEach(k => { p['line_id_' + k.toLowerCase()] = cur.company[k].line_id.trim(); p['line_qr_' + k.toLowerCase()] = cur.company[k].line_qr.trim(); });
            jobs.push(post(p));
        }
        if (d.includes('iso')) jobs.push(post({ action: 'save_doc_forms', forms: JSON.stringify(Object.fromEntries(Object.entries(cur.iso).map(([k, f]) => [k, { no: f.no.trim(), rev: f.rev.trim(), eff: f.eff.trim() }]))) }));
        await Promise.all(jobs);
        saved = clone(cur); syncDirty();
        ptcToast('success', 'บันทึกแล้ว', d.map(g => GROUP_TH[g]).join(' · '));
    } catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
    finally { btn.disabled = false; btn.innerHTML = '<i class="fa fa-check"></i> บันทึก'; }
}
function discard() { cur = clone(saved); render(); }

// ไฮไลต์เมนูซ้ายตามหมวดที่เลื่อนอยู่
function spy() {
    const secs = [...document.querySelectorAll('main section')];
    const on = () => {
        let id = secs[0]?.id;
        secs.forEach(s => { if (s.getBoundingClientRect().top < 140) id = s.id; });
        if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) id = secs[secs.length - 1]?.id;
        document.querySelectorAll('#side a').forEach(a => a.classList.toggle('on', a.dataset.g === id));
    };
    window.removeEventListener('scroll', window._spy || (() => {})); window._spy = on;
    window.addEventListener('scroll', on, { passive: true }); on();
}

(async function init() {
    let S = {};
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) {}
    if (!S.loggedin) { location.href = 'login.html'; return; }
    const perms = S.effective_permissions || [];
    if (!(S.role === 'admin' || perms.includes('*') || perms.includes('admin.access_admin'))) { gid('app').innerHTML = '<div class="card" style="padding:30px;text-align:center"><i class="fa fa-lock"></i> หน้านี้สำหรับผู้ดูแลระบบ</div>'; return; }
    const h = location.hash.replace('#', '');
    if (['PTA', 'PT4', 'PTE'].includes(new URLSearchParams(location.search).get('co'))) co = new URLSearchParams(location.search).get('co');
    await load();
    if (h) document.getElementById(h)?.scrollIntoView();
})();
</script>
