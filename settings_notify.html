<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์แจ้งเตือน - PowertechCenter</title>
    <link rel="icon" href="favicon.ico">
    <script src="js/favicon-version.js"></script>
    <link rel="stylesheet" href="css/fonts/inter-kanit-local.css">
    <link rel="stylesheet" href="css/vendor/fontawesome.min.css"/>
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/enterprise-theme.css?v=20261021">
    <script src="js/vendor/sweetalert2.min.js"></script>
    <script src="js/enterprise-swal.js?v=20261021b"></script>
    <script src="js/ptc-swal-ui.js?v=20260530"></script>
    <script>(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark','dark-theme');})()</script>
<style>
/* ════ ศูนย์แจ้งเตือน — เรื่องไหน ส่งเข้ากลุ่ม LINE/Telegram ไหน · สีจาก token design-system (ธีมมืดเปลี่ยนตามเอง) ════ */
html, body { overflow-y:auto !important; height:auto !important; }
body { background:var(--ptc-bg); color:var(--ptc-text); margin:0; font-family:Kanit, Inter, sans-serif; }
.nt-top { position:sticky; top:0; z-index:100; background:var(--ptc-surface); border-bottom:1px solid var(--ptc-border); border-top:3px solid var(--ptc-primary); display:flex; align-items:center; gap:12px; padding:0 16px; height:56px; }
.nt-back { width:34px; height:34px; border-radius:8px; border:1px solid var(--ptc-border); display:flex; align-items:center; justify-content:center; color:var(--ptc-text-2); text-decoration:none; }
.nt-ic { width:34px; height:34px; border-radius:9px; background:#16a34a; color:#fff; display:flex; align-items:center; justify-content:center; }
.nt-top b { font-size:15px; display:block; } .nt-top small { font-size:11.5px; color:var(--ptc-text-muted); }
.nt-main { flex:1; overflow-y:auto; }
.wrap { max-width:1280px; margin:0 auto; padding:18px 18px 50px; }
.card { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; }
.h { font-size:15px; font-weight:800; margin:0; display:flex; align-items:center; gap:8px; }
.s { font-size:12.5px; color:var(--ptc-text-muted); margin:3px 0 0; }
.btn { height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-weight:700; font-size:12.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.btn:hover { border-color:var(--ptc-primary); }
.btn.pri { background:var(--ptc-primary); border-color:var(--ptc-primary); color:#fff; }
.btn.sm { height:28px; padding:0 9px; font-size:12px; }
.btn.danger { color:#dc2626; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.empty { padding:26px 14px; text-align:center; color:var(--ptc-text-muted); font-size:13px; }

/* กลุ่ม */
.chans { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px; margin:14px 0 18px; }
.ch { padding:14px; display:flex; flex-direction:column; gap:10px; min-width:0; }
.ch.off { opacity:.6; }
.ch-top { display:flex; gap:10px; align-items:center; }
.ch-ic { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; color:#fff; background:#06c755; flex-shrink:0; }
.ch-ic.telegram { background:#229ed9; }
.ch b { font-size:14px; display:block; overflow-wrap:anywhere; } .ch small { font-size:11.5px; color:var(--ptc-text-muted); }
.health { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; }
.dot { width:8px; height:8px; border-radius:50%; background:#16a34a; box-shadow:0 0 0 3px rgba(22,163,74,.18); flex-shrink:0; }
.dot.bad { background:#dc2626; box-shadow:0 0 0 3px rgba(220,38,38,.18); } .dot.none { background:#94a3b8; box-shadow:none; }
.health.bad { color:#dc2626; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--ptc-border); padding-top:10px; }
.stats div { text-align:center; } .stats b { font-size:17px; } .stats span { display:block; font-size:11px; color:var(--ptc-text-muted); }
.ch-act { display:flex; gap:6px; flex-wrap:wrap; }
.add { border:1.5px dashed var(--ptc-border); background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--ptc-text-muted); font:inherit; font-weight:700; font-size:13px; cursor:pointer; min-height:170px; }
.add:hover { border-color:var(--ptc-primary); color:var(--ptc-primary); }
.add i { font-size:20px; }

/* ตารางเส้นทาง */
.grid2 { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start; }
.sec-h { padding:14px 16px; border-bottom:1px solid var(--ptc-border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.sec-h .r { margin-left:auto; display:flex; gap:6px; }
.mx-wrap { overflow-x:auto; }
.mx { width:100%; border-collapse:collapse; font-size:13px; }
.mx th { font-size:11.5px; font-weight:700; color:var(--ptc-text-muted); padding:10px 8px; border-bottom:1px solid var(--ptc-border); text-align:center; white-space:nowrap; }
.mx th:first-child { text-align:left; padding-left:16px; }
.mx th .chn { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ptc-text); max-width:110px; margin:0 auto; white-space:normal; line-height:1.25; }
.mx th .chn i { font-size:15px; color:#06c755; } .mx th .chn i.telegram { color:#229ed9; }
.mx td { padding:9px 8px; border-bottom:1px solid var(--ptc-border); text-align:center; }
.mx td:first-child { text-align:left; padding-left:16px; }
.mx tr.ev { cursor:pointer; } .mx tr.ev:hover td { background:var(--ptc-surface-2); }
.mx tr.ev.sel td { background:var(--ptc-primary-light); }
.mx tr.grp td { background:var(--ptc-surface-2); font-size:11.5px; font-weight:800; color:var(--ptc-text-2); padding-top:7px; padding-bottom:7px; }
.evn { display:flex; align-items:center; gap:9px; }
.evn i.c { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.evn b { font-weight:600; } .evn small { display:block; font-size:11px; color:var(--ptc-text-muted); }
.new { font-size:10px; font-weight:800; color:#fff; background:var(--ptc-primary); border-radius:4px; padding:0 5px; margin-left:4px; vertical-align:middle; }
/* กันสไตล์ปุ่มกลางของธีม (มือถือขยายปุ่มให้สูง 44px) มาทับสวิตช์ */
.tg { width:36px; height:20px; min-width:36px; min-height:0 !important; max-height:20px; padding:0; box-sizing:border-box; border-radius:99px; background:var(--ptc-border); position:relative; border:0; cursor:pointer; vertical-align:middle; flex:0 0 36px; }
.tg:after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.2); }
.tg.on { background:#16a34a; } .tg.on:after { left:18px; }
.tg:disabled { opacity:.45; cursor:not-allowed; }
.warn { font-size:11px; font-weight:700; color:#dc2626; background:#fef2f2; border-radius:99px; padding:2px 8px; white-space:nowrap; }
html.dark .warn { background:rgba(220,38,38,.14); }
.legend { display:flex; gap:14px; padding:10px 16px; font-size:12px; color:var(--ptc-text-muted); flex-wrap:wrap; }

/* ตัวอย่าง LINE */
.phone { position:sticky; top:72px; }
.ph { border-radius:22px; background:#8cabd9; padding:14px; border:6px solid #0f172a; }
.ph-top { color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; gap:6px; margin-bottom:10px; }
.bub { display:flex; gap:8px; align-items:flex-start; }
.bub .av { width:30px; height:30px; border-radius:50%; background:#06c755; color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.flex { background:#fff; border-radius:14px; overflow:hidden; flex:1; font-size:12px; color:#111; min-width:0; }
.flex .fh { padding:12px 14px 8px; } .flex .fh b { font-size:15px; display:block; }
.flex .kv { display:grid; grid-template-columns:78px 1fr; gap:3px 8px; padding:8px 14px 12px; border-top:1px solid #eee; }
.flex .kv span { color:#888; } .flex .kv b { font-weight:600; overflow-wrap:anywhere; }
.flex .ft { border-top:1px solid #eee; padding:7px 14px; text-align:right; color:#aaa; font-size:10.5px; }
.ph-cap { font-size:12px; color:var(--ptc-text-muted); margin-top:10px; text-align:center; }

/* ล่าง */
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px; }
.sched { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--ptc-border); font-size:13px; }
.sched:last-child { border-bottom:0; }
.sched .t { font-family:Consolas, monospace; font-size:16px; font-weight:800; width:56px; }
.sched .d { flex:1; min-width:0; } .sched small { display:block; color:var(--ptc-text-muted); font-size:11.5px; }
.log { padding:4px 16px 10px; max-height:420px; overflow-y:auto; }
.lg { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--ptc-border); font-size:12.5px; align-items:flex-start; }
.lg:last-child { border-bottom:0; }
.lg .st { width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; color:#fff; background:#16a34a; margin-top:1px; }
.lg .st.bad { background:#dc2626; } .lg .st.skip { background:#94a3b8; }
.lg .b { flex:1; min-width:0; } .lg b { font-weight:600; overflow-wrap:anywhere; } .lg small { color:var(--ptc-text-muted); display:block; font-size:11.5px; overflow-wrap:anywhere; }
.lg .tm { font-size:11.5px; color:var(--ptc-text-muted); white-space:nowrap; }
.wh { margin-top:16px; padding:14px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:13px; }
.wh .tx { flex:1; min-width:240px; } .wh small { display:block; color:var(--ptc-text-muted); font-size:12px; }

/* ฟอร์มใน popup */
.fx { text-align:left; display:grid; gap:10px; }
.fx label { font-size:12.5px; font-weight:700; color:var(--ptc-text-2); display:block; margin-bottom:4px; }
.fx input, .fx select { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:8px 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; }
.fx .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.fx .hint { font-size:11.5px; color:var(--ptc-text-muted); margin-top:3px; }
.fx .req { color:#dc2626; }

@media (max-width:1000px) { .grid2, .row2 { grid-template-columns:minmax(0,1fr); } .phone { position:static; } }
@media (max-width:640px) { .wrap { padding:12px 10px 30px; } .nt-top small { display:none; } .fx .two { grid-template-columns:1fr; } }
</style>
</head>
<body data-page="settings_notify">
<header class="nt-top">
    <a href="admin.html" class="nt-back" aria-label="กลับ"><i class="fa fa-arrow-left"></i></a>
    <div class="nt-ic"><i class="fa fa-bell"></i></div>
    <div><b>ศูนย์แจ้งเตือน</b><small>LINE / Telegram — เรื่องไหน ส่งเข้ากลุ่มไหน</small></div>
    <div style="flex:1"></div>
    <div id="nav-user-area"></div>
</header>
<div style="display:flex;min-height:calc(100vh - 56px)">
<aside id="ptc-sidebar"></aside>
<main class="nt-main"><div class="wrap" id="app"><div class="empty"><i class="fa fa-spinner fa-spin"></i> กำลังโหลด…</div></div></main>
</div>

<script>
const gid = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const thTime = v => { const d = new Date(String(v).replace(' ', 'T')); if (isNaN(d)) return ''; const t = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); return d.toDateString() === new Date().toDateString() ? t : d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) + ' ' + t; };

// ทุกเรื่องที่ระบบแจ้งได้ — [รหัส, ชื่อ, คำอธิบาย, สี, ตัวอย่างข้อความ {t, no, kv}, ใหม่]
const EVENTS = [
    ['งานซ่อม IT', [
        ['it_repair', 'แจ้งซ่อมใหม่', 'มีคนแจ้งเข้ามา', '#ef454d', { t: 'แจ้งซ่อมใหม่', no: 'PTA-MIS261022-05', kv: [['ผู้แจ้ง', 'Pornpapat · HR'], ['อาการ', 'ปริ้นเตอร์พิมพ์ไม่ออก'], ['ความด่วน', 'ด่วนที่สุด']] }],
        ['it_user_reply', 'ผู้แจ้งตอบกลับ / ยังไม่หาย', 'ช่างรู้ทันทีไม่ต้องเปิดเว็บดู', '#7c3aed', { t: '💬 ผู้แจ้งตอบกลับ', no: 'PTA-MIS261020-02', kv: [['จาก', 'Kasidet P.'], ['ข้อความ', 'สะดวกให้เข้าหลังบ่าย 2 ครับ'], ['ช่าง', 'Somya']] }, 1],
        ['it_overdue', 'งานซ่อมเกินเวลา', 'ไม่มีใครรับ / ซ่อมนานเกิน (เตือนงานละครั้ง)', '#dc2626', { t: '⏰ งานซ่อมเกินเวลา — ยังไม่มีใครรับเรื่อง', no: 'PTA-MIS261022-05', kv: [['อาการ', 'ปริ้นเตอร์พิมพ์ไม่ออก'], ['ความด่วน', 'ด่วนที่สุด'], ['เกินมาแล้ว', '12 นาที'], ['ช่าง', 'ยังไม่มี']] }, 1],
        ['it_cancel', 'ยกเลิกงานซ่อม', 'ผู้แจ้งหรือช่างยกเลิก', '#ff9500', { t: 'ยกเลิกงานซ่อม', no: 'PT4-MIS261022-02', kv: [['เหตุผล', 'แจ้งซ้ำกับงานอื่น']] }],
        ['it_approve', 'ซ่อมเสร็จ / ปิดงาน', 'ผู้แจ้งยืนยัน หรือระบบปิดให้ใน 3 วัน', '#1db446', { t: 'ปิดงานเรียบร้อย', no: 'PTA-MIS261021-04', kv: [['ผู้แจ้ง', 'ยืนยันแล้ว ★★★★★']] }],
        ['it_daily_summary', 'สรุปเช้าทีม IT', '08:00 วันทำงาน', '#0f172a', { t: '☀️ สรุปเช้า ทีม IT', no: '', kv: [['งานค้าง', '6 งาน'], ['รอรับเรื่อง', '2 งาน'], ['เกินเวลา', '⚠️ 1 งาน'], ['รอผู้แจ้งยืนยัน', '1 งาน'], ['ห้องต้องตรวจ', '8 ห้อง']] }, 1],
    ]],
    ['เบิกของ / สต็อก', [
        ['stock_new', 'เบิกของใหม่', 'มีคำขอเบิก', '#2563eb', { t: 'คำขอเบิกของใหม่', no: 'ST-2610-118', kv: [['ผู้ขอ', 'Somsak · Logistics'], ['รายการ', 'กระดาษ A4 × 5 รีม']] }],
        ['stock_approve', 'อนุมัติเบิก', '', '#16a34a', null], ['stock_reject', 'ไม่อนุมัติเบิก', '', '#dc2626', null], ['stock_cancel', 'ยกเลิกเบิก', '', '#ff9500', null],
        ['stock_low', 'ของใกล้หมด', 'ต่ำกว่าจุดสั่งซื้อ', '#d97706', { t: 'ของใกล้หมด', no: '3 รายการ', kv: [['หมึก HP 85A', 'เหลือ 1'], ['กระดาษ A4', 'เหลือ 4 รีม']] }],
        ['stock_summary', 'สรุปสต็อก', 'ตามเวลาที่ตั้งด้านล่าง', '#0f172a', null],
    ]],
    ['ยืมอุปกรณ์', [
        ['loan_new', 'ขอยืมใหม่', '', '#7c3aed', null], ['loan_approve', 'อนุมัติยืม', '', '#16a34a', null], ['loan_reject', 'ไม่อนุมัติยืม', '', '#dc2626', null],
        ['loan_return', 'คืนอุปกรณ์', '', '#0891b2', null, 1],
    ]],
    ['ห้อง Server', [
        ['server_check_issue', 'ตรวจห้องแล้วพบปัญหา', 'ติ๊ก ✗ หรือกล้องต่ำกว่าเกณฑ์', '#b91c1c', { t: 'ห้อง Server พบปัญหา', no: 'F20', kv: [['ผู้ตรวจ', 'Likit'], ['ไม่ผ่าน', 'กล้องออนไลน์ 78% (เกณฑ์ 90%)']] }],
        ['server_check_missing', 'ยังไม่ได้ตรวจวันนี้', '15:00 วันทำงาน', '#b45309', { t: '🖥️ ยังไม่ได้ตรวจห้อง Server วันนี้ (2 ห้อง)', no: '', kv: [['ห้อง', 'F6 — Warehouse Plant'], ['ห้อง', 'F20 — Car Wheel Plant']] }, 1],
    ]],
    ['พนักงาน', [['employee_offboard', 'พนักงานลาออก', 'เตือนเก็บคืนเครื่อง/ปิดบัญชี', '#be123c', null]]],
];
const ALL = EVENTS.flatMap(g => g[1]);
const ALL_KEYS = ALL.map(e => e[0]);
const evName = k => (ALL.find(e => e[0] === k) || [k, k])[1];

let CH = [], LOG = [], SCHED = [], secretSet = false, sel = 'it_repair', canStock = false;

async function api(params) { return (await fetch('api.php?' + new URLSearchParams(params), { cache: 'no-store' })).json(); }
async function post(obj) {
    const fd = new FormData(); Object.entries(obj).forEach(([k, v]) => fd.append(k, v ?? ''));
    const j = await (await fetch('api.php', { method: 'POST', body: fd })).json();
    if (j.status !== 'success') throw new Error(j.message || 'ไม่สำเร็จ');
    return j;
}
const hasEv = (c, k) => c.events.includes('*') || c.events.includes(k);

async function load() {
    const j = await api({ action: 'get_notify_overview' });
    if (j.status !== 'success') { gid('app').innerHTML = `<div class="card empty">${esc(j.message || 'โหลดไม่สำเร็จ')}</div>`; return; }
    CH = j.channels.map(c => ({ ...c, id: +c.id, enabled: +c.enabled })); LOG = j.log || []; secretSet = j.webhook_secret_set;
    if (canStock) { try { SCHED = (await api({ action: 'getStockSummarySchedules' })).schedules || []; } catch (_) { SCHED = []; } }
    render();
}

function render() {
    const chCards = CH.map(c => {
        const L = c.last, okState = !L ? 'none' : +L.ok === 1 ? 'ok' : 'bad';
        const health = okState === 'none' ? '<span class="dot none"></span>ยังไม่เคยส่งผ่านระบบใหม่'
            : okState === 'ok' ? `<span class="dot"></span>ส่งล่าสุดสำเร็จ · ${esc(thTime(L.created_at))}` : `<span class="dot bad"></span>ส่งไม่สำเร็จ — ${esc(L.detail || 'ตรวจกุญแจ')}`;
        const n = ALL_KEYS.filter(k => hasEv(c, k)).length;
        return `<div class="card ch ${c.enabled ? '' : 'off'}"><div class="ch-top"><div class="ch-ic ${c.channel_type}"><i class="fab fa-${c.channel_type}"></i></div>
            <div style="flex:1;min-width:0"><b>${esc(c.name)}</b><small>${c.channel_type === 'line' ? 'LINE' : 'Telegram'}${c.company ? ' · เฉพาะ ' + esc(c.company) : ' · ทุกบริษัท'} · กุญแจ …${esc(c.token_tail)}</small></div>
            <button class="tg ${c.enabled ? 'on' : ''}" title="${c.enabled ? 'ปิด' : 'เปิด'}กลุ่มนี้" onclick="toggleCh(${c.id})"></button></div>
            <div class="health ${okState === 'bad' ? 'bad' : ''}">${health}</div>
            <div class="stats"><div><b>${c.today}</b><span>ส่งวันนี้</span></div><div><b>${c.week}</b><span>7 วัน</span></div><div><b>${n}</b><span>เรื่องที่รับ</span></div></div>
            <div class="ch-act"><button class="btn sm" onclick="testCh(${c.id})"><i class="fa fa-paper-plane"></i> ทดสอบ</button><button class="btn sm" onclick="editCh(${c.id})"><i class="fa fa-pen"></i> แก้ไข / กุญแจ</button><button class="btn sm danger" onclick="delCh(${c.id})" title="ลบกลุ่ม"><i class="fa fa-trash"></i></button></div></div>`;
    }).join('') + `<button class="card add" onclick="editCh(0)"><i class="fa fa-plus-circle"></i>เพิ่มกลุ่มใหม่<small style="font-weight:500">LINE หรือ Telegram</small></button>`;

    const mx = CH.length ? `<table class="mx"><thead><tr><th>เรื่อง</th>${CH.map(c => `<th><span class="chn"><i class="fab fa-${c.channel_type} ${c.channel_type}"></i>${esc(c.name.replace(/^Powertech\s*-\s*/i, ''))}</span></th>`).join('')}<th></th></tr></thead><tbody>`
        + EVENTS.map(([g, evs]) => `<tr class="grp"><td colspan="${CH.length + 2}">${g}</td></tr>` + evs.map(e => {
            const on = CH.filter(c => c.enabled && hasEv(c, e[0])).length;
            return `<tr class="ev ${sel === e[0] ? 'sel' : ''}" onclick="pick('${e[0]}')"><td><span class="evn"><i class="c" style="background:${e[3]}"></i><span><b>${e[1]}${e[5] ? '<span class="new">ใหม่</span>' : ''}</b>${e[2] ? `<small>${e[2]}</small>` : ''}</span></span></td>
                ${CH.map(c => `<td><button class="tg ${hasEv(c, e[0]) ? 'on' : ''}" ${c.enabled ? '' : 'disabled title="กลุ่มนี้ปิดอยู่"'} onclick="event.stopPropagation();flip(${c.id},'${e[0]}')"></button></td>`).join('')}
                <td>${on ? '' : '<span class="warn">ไม่มีใครรับ</span>'}</td></tr>`;
        }).join('')).join('') + '</tbody></table>' : '<div class="empty">ยังไม่มีกลุ่ม — กด "เพิ่มกลุ่มใหม่" ด้านบน</div>';

    const sc = SCHED.length ? SCHED.map(s => {
        const freq = s.frequency === 'weekly' ? 'ทุกวัน' + ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'][+s.day_of_week] : s.frequency === 'monthly' ? `ทุกวันที่ ${s.day_of_month}` : 'ทุกวัน';
        return `<div class="sched"><span class="t">${esc(s.send_time)}</span><div class="d"><b>${esc(s.name || freq)}</b><small>${freq} · ${esc(s.company || 'ทุกบริษัท')} · ${s.stock_type === 'stationery' ? 'เครื่องเขียน' : s.stock_type === 'maid' ? 'แม่บ้าน' : 'ทุกประเภท'}${s.last_sent ? ' · ส่งล่าสุด ' + esc(s.last_sent) : ''}</small></div>
            <button class="tg ${+s.enabled ? 'on' : ''}" onclick="toggleSched(${s.id})"></button><button class="btn sm" onclick="editSched(${s.id})"><i class="fa fa-pen"></i></button><button class="btn sm danger" onclick="delSched(${s.id})"><i class="fa fa-trash"></i></button></div>`;
    }).join('') : '<div class="empty">ยังไม่ได้ตั้งเวลา</div>';

    const lg = LOG.length ? LOG.map(l => `<div class="lg"><span class="st ${+l.ok === 1 ? '' : +l.ok === 2 ? 'skip' : 'bad'}"><i class="fa fa-${+l.ok === 1 ? 'check' : +l.ok === 2 ? 'minus' : 'xmark'}"></i></span>
        <div class="b"><b>${esc(evName(l.event))} · ${esc(String(l.title || '').replace(/^[^\p{L}\p{N}]+/u, ''))}</b><small>${l.channel_name ? '→ ' + esc(l.channel_name) : ''}${l.detail ? (l.channel_name ? ' · ' : '') + esc(l.detail) : ''}</small></div><span class="tm">${esc(thTime(l.created_at))}</span></div>`).join('')
        : '<div class="empty">ยังไม่มีประวัติ — เริ่มเก็บตั้งแต่ระบบใหม่นี้</div>';

    gid('app').innerHTML = `<h2 class="h">กลุ่มที่รับแจ้งเตือน</h2><p class="s">แต่ละกล่อง = กลุ่ม LINE หรือ Telegram 1 กลุ่ม · ไฟเขียว = ส่งล่าสุดสำเร็จ · ไฟแดง = ส่งไม่ออก (มักเป็นกุญแจหมดอายุ)</p>
        <div class="chans">${chCards}</div>
        <div class="grid2"><div class="card"><div class="sec-h"><div><h2 class="h"><i class="fa fa-route" style="color:var(--ptc-primary)"></i>เรื่องไหน ส่งเข้ากลุ่มไหน</h2><p class="s">กดสวิตช์แล้วบันทึกทันที · กดชื่อเรื่องเพื่อดูตัวอย่างข้อความ</p></div></div>
            <div class="mx-wrap">${mx}</div><div class="legend"><span><span class="warn">ไม่มีใครรับ</span> = เรื่องนี้เกิดขึ้นแล้วไม่แจ้งใครเลย</span><span><span class="new">ใหม่</span> = แจ้งเตือนที่เพิ่มรอบนี้</span></div></div>
            <div class="phone" id="phone"></div></div>
        <div class="row2">
            <div class="card"><div class="sec-h"><h2 class="h"><i class="fa fa-clock" style="color:#d97706"></i>ส่งสรุปสต็อกอัตโนมัติ</h2>${canStock ? `<div class="r"><button class="btn sm" onclick="sendSummaryNow(this)"><i class="fa fa-paper-plane"></i> ส่งตอนนี้</button><button class="btn sm pri" onclick="editSched(0)"><i class="fa fa-plus"></i> ตั้งเวลา</button></div>` : ''}</div>
                ${canStock ? sc : '<div class="empty">ต้องมีสิทธิ์จัดการสต็อก</div>'}</div>
            <div class="card"><div class="sec-h"><h2 class="h"><i class="fa fa-list-check" style="color:#16a34a"></i>ส่งไปล่าสุด</h2><div class="r"><button class="btn sm" onclick="load()"><i class="fa fa-rotate"></i> รีเฟรช</button></div></div><div class="log">${lg}</div></div>
        </div>
        <div class="card wh"><i class="fa fa-shield-halved" style="color:var(--ptc-primary);font-size:20px"></i><div class="tx"><b>ปุ่มอนุมัติในแชต LINE — Channel secret</b>
            <small>ใช้ตรวจว่าคำสั่งที่กดในแชตมาจาก LINE จริง กันคนปลอมคำสั่ง · หาได้ที่ LINE Developers → Basic settings → Channel secret</small></div>
            <span style="font-weight:700;font-size:12.5px;color:${secretSet ? '#16a34a' : '#d97706'}"><i class="fa fa-${secretSet ? 'circle-check' : 'triangle-exclamation'}"></i> ${secretSet ? 'ตั้งแล้ว' : 'ยังไม่ได้ตั้ง'}</span>
            <button class="btn sm" onclick="editSecret()">${secretSet ? 'เปลี่ยน' : 'ตั้งค่า'}</button></div>`;
    renderPhone();
}

function renderPhone() {
    const e = ALL.find(x => x[0] === sel); if (!e) return;
    const p = e[4] || { t: e[1], no: '', kv: [['รายละเอียด', e[2] || 'ตามข้อมูลในระบบ']] };
    const to = CH.filter(c => c.enabled && hasEv(c, sel)).map(c => c.name.replace(/^Powertech\s*-\s*/i, ''));
    const now = new Date();
    gid('phone').innerHTML = `<div class="ph"><div class="ph-top"><i class="fa fa-chevron-left"></i>${esc(to.length ? to.join(' + ') : 'ไม่มีกลุ่มรับเรื่องนี้')}</div>
        <div class="bub"><div class="av"><i class="fa fa-bell"></i></div><div class="flex"><div class="fh"><b style="color:${e[3]}">${esc(p.t)}</b>${p.no ? `<span style="color:#888">${esc(p.no)}</span>` : ''}</div>
        <div class="kv">${p.kv.map(k => `<span>${esc(k[0])}</span><b>${esc(k[1])}</b>`).join('')}</div><div class="ft">${now.toLocaleDateString('th-TH')} ${now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })}</div></div></div></div>
        <div class="ph-cap">ตัวอย่างหน้าตาข้อความ · ข้อมูลจริงมาจากงานที่เกิดขึ้น</div>`;
}
function pick(k) { sel = k; document.querySelectorAll('.mx tr.ev').forEach(tr => tr.classList.toggle('sel', tr.getAttribute('onclick') === `pick('${k}')`)); renderPhone(); }

// ── บันทึกกลุ่ม (ฟิลด์ครบตาม save_notify_channel · กุญแจว่าง = ใช้ตัวเดิม) ──
function saveCh(c, extra = {}) {
    return post({ action: 'save_notify_channel', id: c.id, name: c.name, channel_type: c.channel_type, token: '', dest_id: c.dest_id,
        events: JSON.stringify(c.events), company: c.company || '', enabled: c.enabled ? 1 : 0, sort_order: c.sort_order || 0, ...extra });
}
async function flip(id, k) {
    const c = CH.find(x => x.id === id); if (!c) return;
    // กลุ่มที่รับ "ทุกเรื่อง" (*) → แตกเป็นรายการก่อน แล้วถ้าเปิดครบทุกเรื่องค่อยกลับเป็น * (เรื่องใหม่ในอนาคตจะเข้ากลุ่มนี้เอง)
    let set = c.events.includes('*') ? [...ALL_KEYS] : [...c.events];
    set = set.includes(k) ? set.filter(x => x !== k) : [...set, k];
    if (!set.length) return ptcToast('warning', '', 'กลุ่มต้องรับอย่างน้อย 1 เรื่อง — ถ้าไม่ใช้ ให้ปิดกลุ่มแทน');
    const prev = c.events;
    c.events = ALL_KEYS.every(x => set.includes(x)) ? ['*'] : set;
    render();
    try { await saveCh(c); ptcToast('success', '', `${evName(k)} → ${hasEv(c, k) ? 'ส่ง' : 'ไม่ส่ง'}เข้า ${c.name}`); }
    catch (e) { c.events = prev; render(); ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}
async function toggleCh(id) {
    const c = CH.find(x => x.id === id); if (!c) return;
    c.enabled = c.enabled ? 0 : 1; render();
    try { await saveCh(c); } catch (e) { c.enabled = c.enabled ? 0 : 1; render(); ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}
async function testCh(id) {
    const c = CH.find(x => x.id === id); if (!c) return;
    try { await post({ action: 'test_notify_channel', id, channel_type: c.channel_type, token: '...', dest_id: c.dest_id }); ptcToast('success', 'ส่งข้อความทดสอบแล้ว', 'ดูในกลุ่ม ' + c.name); }
    catch (e) { ptcAlert('error', 'ส่งไม่สำเร็จ', e.message); }
}
async function editCh(id) {
    const c = CH.find(x => x.id === id) || { id: 0, name: '', channel_type: 'line', dest_id: '', company: '', enabled: 1, events: ['*'], sort_order: CH.length };
    const { value, isConfirmed } = await ptcSwal().fire({
        title: id ? 'แก้ไขกลุ่ม' : 'เพิ่มกลุ่มใหม่', width: 'min(520px, 96vw)', focusConfirm: false, showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
        html: `<div class="fx"><div class="two"><div><label>ชื่อกลุ่ม <span class="req">*</span></label><input id="f-name" value="${esc(c.name)}" placeholder="เช่น IT Support"></div>
            <div><label>ช่องทาง</label><select id="f-type"><option value="line" ${c.channel_type === 'line' ? 'selected' : ''}>LINE</option><option value="telegram" ${c.channel_type === 'telegram' ? 'selected' : ''}>Telegram</option></select></div></div>
            <div><label>กุญแจ (Token) ${id ? '' : '<span class="req">*</span>'}</label><input id="f-token" type="password" autocomplete="off" placeholder="${id ? 'เว้นว่าง = ใช้กุญแจเดิม (…' + esc(c.token_tail) + ')' : 'LINE: Channel access token · Telegram: Bot token'}">
                <div class="hint">LINE: LINE Developers → Messaging API → Channel access token · Telegram: คุยกับ @BotFather</div></div>
            <div><label>รหัสกลุ่มปลายทาง <span class="req">*</span></label><input id="f-dest" value="${esc(c.dest_id)}" placeholder="LINE: ขึ้นต้นด้วย C… · Telegram: Chat ID">
                <div class="hint">LINE: เชิญบอทเข้ากลุ่มแล้วพิมพ์ !id ในกลุ่ม</div></div>
            <div><label>รับเฉพาะงานของบริษัท</label><select id="f-co">${['', 'PTA', 'PT4', 'PTE'].map(x => `<option value="${x}" ${(c.company || '') === x ? 'selected' : ''}>${x || 'ทุกบริษัท'}</option>`).join('')}</select></div>
            ${id ? '' : '<div class="hint">กลุ่มใหม่รับทุกเรื่องก่อน แล้วค่อยปิดเรื่องที่ไม่ต้องการในตาราง</div>'}</div>`,
        preConfirm: () => {
            const v = { name: gid('f-name').value.trim(), channel_type: gid('f-type').value, token: gid('f-token').value.trim(), dest_id: gid('f-dest').value.trim(), company: gid('f-co').value };
            if (!v.name || !v.dest_id) return Swal.showValidationMessage('กรอกชื่อกลุ่มและรหัสกลุ่มปลายทาง');
            if (!id && !v.token) return Swal.showValidationMessage('กลุ่มใหม่ต้องใส่กุญแจ');
            return v;
        },
    });
    if (!isConfirmed) return;
    try { await saveCh({ ...c, ...value }, { token: value.token }); ptcToast('success', '', 'บันทึกแล้ว'); load(); }
    catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}
async function delCh(id) {
    const c = CH.find(x => x.id === id); if (!c) return;
    const { isConfirmed } = await ptcSwal().fire({ title: `ลบกลุ่ม "${esc(c.name)}"?`, text: 'กลุ่มใน LINE ไม่ถูกลบ แค่ระบบเลิกส่งเข้ากลุ่มนี้ · ถ้าแค่พักชั่วคราว ใช้สวิตช์ปิดแทน', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก' });
    if (!isConfirmed) return;
    try { await post({ action: 'delete_notify_channel', id }); load(); } catch (e) { ptcAlert('error', 'ลบไม่สำเร็จ', e.message); }
}
async function editSecret() {
    const { value, isConfirmed } = await ptcSwal().fire({
        title: 'Channel secret ของบอท LINE', input: 'password', inputPlaceholder: 'ตัวอักษร 32 ตัว (เว้นว่าง = ล้างค่า)', showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
        inputValidator: v => v && !/^[a-f0-9]{32}$/i.test(v.trim()) && 'Channel secret ต้องเป็น a-f / 0-9 จำนวน 32 ตัว',
    });
    if (!isConfirmed) return;
    try { await post({ action: 'save_line_webhook_secret', secret: value.trim() }); ptcToast('success', '', 'บันทึกแล้ว'); load(); } catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}

// ── สรุปสต็อก (API เดิม) ──
async function sendSummaryNow(btn) {
    btn.disabled = true;
    try { const r = await post({ action: 'sendStockSummary' }); ptcToast('success', 'ส่งสรุปแล้ว', r.message || ''); load(); }
    catch (e) { ptcAlert('error', 'ส่งไม่สำเร็จ', e.message); } finally { btn.disabled = false; }
}
function schedPayload(s) {
    return { action: 'saveStockSummarySchedule', id: s.id || '', name: s.name || '', company: s.company || '', stock_type: s.stock_type || '', frequency: s.frequency, send_time: s.send_time, day_of_week: s.day_of_week ?? 1, day_of_month: s.day_of_month ?? 1, enabled: +s.enabled ? 1 : 0 };
}
async function toggleSched(id) {
    const s = SCHED.find(x => +x.id === id); if (!s) return;
    s.enabled = +s.enabled ? 0 : 1; render();
    try { await post(schedPayload(s)); } catch (e) { s.enabled = +s.enabled ? 0 : 1; render(); ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}
async function editSched(id) {
    const s = SCHED.find(x => +x.id === id) || { id: 0, name: '', company: '', stock_type: '', frequency: 'daily', send_time: '08:00', day_of_week: 1, day_of_month: 1, enabled: 1 };
    const DAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
    const { value, isConfirmed } = await ptcSwal().fire({
        title: id ? 'แก้ไขเวลาส่งสรุป' : 'ตั้งเวลาส่งสรุปสต็อก', focusConfirm: false, showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ยกเลิก',
        html: `<div class="fx"><div><label>ชื่อ</label><input id="s-name" value="${esc(s.name)}" placeholder="เช่น สรุปเช้า"></div>
            <div class="two"><div><label>บริษัท</label><select id="s-co">${['', 'PTA', 'PT4', 'PTE'].map(x => `<option value="${x}" ${(s.company || '') === x ? 'selected' : ''}>${x || 'ทุกบริษัท'}</option>`).join('')}</select></div>
            <div><label>ประเภท</label><select id="s-type"><option value="">ทุกประเภท</option><option value="stationery" ${s.stock_type === 'stationery' ? 'selected' : ''}>เครื่องเขียน</option><option value="maid" ${s.stock_type === 'maid' ? 'selected' : ''}>แม่บ้าน</option></select></div></div>
            <div class="two"><div><label>ความถี่</label><select id="s-freq" onchange="gid('s-dow-w').style.display=this.value==='weekly'?'':'none';gid('s-dom-w').style.display=this.value==='monthly'?'':'none'">${[['daily', 'ทุกวัน'], ['weekly', 'ทุกสัปดาห์'], ['monthly', 'ทุกเดือน']].map(f => `<option value="${f[0]}" ${s.frequency === f[0] ? 'selected' : ''}>${f[1]}</option>`).join('')}</select></div>
            <div><label>เวลา</label><input id="s-time" type="time" value="${esc(s.send_time)}"></div></div>
            <div id="s-dow-w" style="${s.frequency === 'weekly' ? '' : 'display:none'}"><label>วัน</label><select id="s-dow">${DAYS.map((d, i) => `<option value="${i}" ${+s.day_of_week === i ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
            <div id="s-dom-w" style="${s.frequency === 'monthly' ? '' : 'display:none'}"><label>วันที่</label><input id="s-dom" type="number" min="1" max="28" value="${esc(s.day_of_month || 1)}"></div></div>`,
        preConfirm: () => ({ ...s, name: gid('s-name').value.trim(), company: gid('s-co').value, stock_type: gid('s-type').value, frequency: gid('s-freq').value, send_time: gid('s-time').value || '08:00', day_of_week: gid('s-dow').value, day_of_month: gid('s-dom').value }),
    });
    if (!isConfirmed) return;
    try { await post(schedPayload(value)); ptcToast('success', '', 'บันทึกแล้ว'); load(); } catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}
async function delSched(id) {
    const { isConfirmed } = await ptcSwal().fire({ title: 'ลบเวลาส่งนี้?', icon: 'warning', showCancelButton: true, confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก' });
    if (!isConfirmed) return;
    try { await post({ action: 'deleteStockSummarySchedule', id }); load(); } catch (e) { ptcAlert('error', 'ลบไม่สำเร็จ', e.message); }
}

(async function init() {
    let S = {};
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) {}
    if (!S.loggedin) { location.href = 'login.html'; return; }
    const perms = S.effective_permissions || [];
    const has = p => S.role === 'admin' || perms.includes('*') || perms.includes(p);
    if (!has('settings.notifications')) { gid('app').innerHTML = '<div class="card empty"><i class="fa fa-lock"></i> หน้านี้สำหรับผู้ดูแลการแจ้งเตือน</div>'; return; }
    canStock = has('stock.manage');
    load();
})();
</script>
