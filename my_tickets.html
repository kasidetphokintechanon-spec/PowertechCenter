        /* === PTC Design System supplements for my_tickets.html === */
        body { font-family: var(--ptc-font-th, 'Kanit', sans-serif) !important; }

        /* Responsive ticket list table */
        @media (max-width: 640px) {
            table.ticket-table thead { display: none; }

                display: flex; flex-direction: column;

                border-radius: var(--ptc-radius-lg, 0.75rem);

            table.ticket-table td::before {

        .badge-Completed  { background: var(--ptc-success-bg, #d1fae5); color: var(--ptc-success, #059669); }

        /* Focus ring */
        input:focus, select:focus, textarea:focus {
            outline: none;

            box-shadow: 0 0 0 3px var(--ptc-primary-ring, rgba(37,99,235,.15)) !important;

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--ptc-border, #cbd5e1); border-radius: 3px; }

    <script>
        const API_PATH = 'api.php';
        let allMyLogs = [];
        let sessionData = {};
        let currentSort = { column: 'date', direction: 'desc' };
        let currentPage = 1;
        const itemsPerPage = 10;
        let selectedTicketId = null;
        let lastDetailRenderedId = null;
        let dateStartFilter = '';
        let dateEndFilter = '';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 1. Get User Info
                const sessRes = await fetch('api.php?action=check_session');
                sessionData = await sessRes.json();
                if (!sessionData.loggedin) { window.location.href = 'login.html'; return; }

                // 2. Get Logs (ใช้ endpoint เดียวกับหน้า Dashboard)
                const res = await fetch('api.php?action=get&file=it_logs&v=' + Date.now());
                const logsRaw = await res.json();
                if (!Array.isArray(logsRaw) && logsRaw && typeof logsRaw === 'object' && logsRaw.status === 'error') {
                    throw new Error(logsRaw.message || 'โหลดข้อมูลไม่สำเร็จ');
                }
                const logs = Array.isArray(logsRaw) ? logsRaw : [];

                // 3. Filter & Render (ยึด logic เดียวกับหน้า Dashboard → renderMyStatusUI)
                const uid = String(sessionData.user_id ?? '').trim();
                const role = String(sessionData.role ?? '').toLowerCase();
                const primaryDept = String(sessionData.primary_department ?? '').toUpperCase();

                if (!uid) {
                    allMyLogs = [];
                } else if (role === 'admin' || primaryDept === 'IT') {
                    allMyLogs = logs.filter(l =>
                        l &&
                        (String(l.requester_id ?? '') === uid ||
                         String(l.servicedById ?? '') === uid ||
                         l.status === 'Pending')
                    );
                } else {
                    allMyLogs = logs.filter(l =>
                        l &&
                        (String(l.requester_id ?? '') === uid ||
                         String(l.servicedById ?? '') === uid)
                    );
                }

                // กันเคสข้อมูลเก่า/ไม่ลง requester_id → ถ้ากรองแล้วว่าง แต่ฐานมีข้อมูล ให้แสดงทั้งหมดก่อน
                if (allMyLogs.length === 0 && logs.length > 0) allMyLogs = logs;
                updateTicketStats();
                sortTickets('date', false);

                const statusView = document.getElementById('status-view');
                const searchInput = document.getElementById('search-input');
                if (statusView) statusView.addEventListener('change', () => { currentPage = 1; renderTickets(); });
                if (searchInput) searchInput.addEventListener('input', () => { currentPage = 1; renderTickets(); });

                const dateStartEl = document.getElementById('date-start');
                const dateEndEl = document.getElementById('date-end');
                const quickLast30 = document.getElementById('quick-last-30');
                const clearDateBtn = document.getElementById('clear-date-filter');

                if (dateStartEl) dateStartEl.addEventListener('change', () => { dateStartFilter = dateStartEl.value || ''; currentPage = 1; renderTickets(); });
                if (dateEndEl) dateEndEl.addEventListener('change', () => { dateEndFilter = dateEndEl.value || ''; currentPage = 1; renderTickets(); });
                if (clearDateBtn) clearDateBtn.addEventListener('click', () => {
                    dateStartFilter = '';
                    dateEndFilter = '';
                    if (dateStartEl) dateStartEl.value = '';
                    if (dateEndEl) dateEndEl.value = '';
                    currentPage = 1;
                    renderTickets();
                });
                if (quickLast30) quickLast30.addEventListener('click', () => {
                    const end = new Date();
                    const start = new Date();
                    start.setDate(end.getDate() - 30);
                    const toISODate = (d) => d.toISOString().slice(0, 10);
                    dateStartFilter = toISODate(start);
                    dateEndFilter = toISODate(end);
                    if (dateStartEl) dateStartEl.value = dateStartFilter;
                    if (dateEndEl) dateEndEl.value = dateEndFilter;
                    currentPage = 1;
                    renderTickets();
                });
            } catch (e) {
                console.error(e);
                const tbody = document.getElementById('ticket-list');
                if (tbody) tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-400">โหลดข้อมูลไม่สำเร็จ</td></tr>`;
                if (window.Swal) Swal.fire('ผิดพลาด', e?.message || 'โหลดข้อมูลไม่สำเร็จ', 'error');
            }
        });

        function updateTicketStats() {
            const el = document.getElementById('ticket-stats');
            if (!el) return;

            const total = allMyLogs.length;
            const active = allMyLogs.filter(l => l && !['Completed', 'Cancelled', 'Unrepairable'].includes(l.status)).length;
            const completed = allMyLogs.filter(l => l && ['Completed', 'Unrepairable'].includes(l.status)).length;
            const cancelled = allMyLogs.filter(l => l && l.status === 'Cancelled').length;
            const rated = allMyLogs.filter(l => l && ['Completed', 'Unrepairable'].includes(l.status) && l.rating).length;

            el.innerHTML = `
                <button type="button" data-view="all" class="px-2.5 py-1 rounded-full bg-slate-200/70 dark:bg-slate-700/70 font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition">ทั้งหมด: ${total}</button>
                <button type="button" data-view="active" class="px-2.5 py-1 rounded-full bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 font-semibold hover:bg-blue-200/70 dark:hover:bg-blue-900/40 transition">กำลังดำเนินการ: ${active}</button>
                <button type="button" data-view="completed" class="px-2.5 py-1 rounded-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300 font-semibold hover:bg-emerald-200/70 dark:hover:bg-emerald-900/40 transition">เสร็จสิ้น: ${completed}</button>
                <button type="button" data-view="cancelled" class="px-2.5 py-1 rounded-full bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 font-semibold hover:bg-red-200/70 dark:hover:bg-red-900/40 transition">ยกเลิก: ${cancelled}</button>
                <span class="px-2.5 py-1 rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300 font-semibold">ให้คะแนนแล้ว: ${rated}</span>
            `;

            el.querySelectorAll('button[data-view]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const view = btn.getAttribute('data-view') || 'all';
                    const statusView = document.getElementById('status-view');
                    if (statusView) statusView.value = view;
                    currentPage = 1;
                    renderTickets();
                });
            });
        }

        function sortTickets(column, toggle = true) {
            if (toggle) {
                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = 'asc';
                }
            }
            
            updateSortIndicators();

            allMyLogs.sort((a, b) => {
                let valA = a[column] || '';
                let valB = b[column] || '';
                
                if (column === 'date') {
                    valA = new Date(valA).getTime();
                    valB = new Date(valB).getTime();
                } else {
                    valA = String(valA).toLowerCase();
                    valB = String(valB).toLowerCase();
                }

                if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            currentPage = 1; // Reset page on sort
            renderTickets();
        }

        function updateSortIndicators() {
            document.querySelectorAll('.sort-icon').forEach(icon => icon.className = 'fas fa-sort ml-1 text-slate-300 sort-icon');
            const activeIcon = document.getElementById(`sort-icon-${currentSort.column}`);
            if (activeIcon) activeIcon.className = `fas fa-sort-${currentSort.direction === 'asc' ? 'up' : 'down'} ml-1 text-blue-500 sort-icon`;
        }

        function exportTickets() {
            if (!allMyLogs || allMyLogs.length === 0) {
                Swal.fire('แจ้งเตือน', 'ไม่มีข้อมูลให้ Export', 'warning');
                return;
            }

            // CSV Header
            let csvContent = "\uFEFFTicket ID,Date,Problem,Type,Status,Serviced By,Solution\n";

            allMyLogs.forEach(log => {
                const escapeCsv = (text) => {
                    if (!text) return "";
                    return '"' + String(text).replace(/"/g, '""').replace(/\n/g, ' ') + '"';
                };

                const row = [
                    escapeCsv(log.id),
                    escapeCsv(log.date),
                    escapeCsv(log.problem),
                    escapeCsv(log.type),
                    escapeCsv(log.status),
                    escapeCsv(log.servicedBy),
                    escapeCsv(log.solution)
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `My_Tickets_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function formatTypeLabel(type) {
            const t = String(type || '').trim();
            if (!t) return '-';
            if (t.toLowerCase() === 'other') return 'อื่นๆ';
            return t;
        }

        function changePage(delta) {
            currentPage += delta;
            renderTickets();
        }

        function renderTickets() {
            const tbody = document.getElementById('ticket-list');
            const paginationControls = document.getElementById('pagination-controls');
            const view = document.getElementById('status-view')?.value || 'all';
            const term = (document.getElementById('search-input')?.value || '').trim().toLowerCase();

            const filteredLogs = allMyLogs.filter(l => {
                if (!l) return false;
                const isClosed = ['Completed', 'Cancelled', 'Unrepairable'].includes(l.status);
                if (view === 'active' && isClosed) return false;
                if (view === 'completed' && !['Completed', 'Unrepairable'].includes(l.status)) return false;
                if (view === 'cancelled' && l.status !== 'Cancelled') return false;

                if (dateStartFilter || dateEndFilter) {
                    const baseDateRaw = (view === 'completed' || view === 'cancelled')
                        ? (l.closed_date || l.completed_date || l.date)
                        : l.date;
                    const baseDate = new Date(baseDateRaw);
                    if (!isNaN(baseDate.getTime())) {
                        if (dateStartFilter) {
                            const start = new Date(dateStartFilter + 'T00:00:00');
                            if (baseDate < start) return false;
                        }
                        if (dateEndFilter) {
                            const end = new Date(dateEndFilter + 'T23:59:59');
                            if (baseDate > end) return false;
                        }
                    }
                }

                if (!term) return true;
                const hay = [
                    l.id, l.problem, l.type, l.status, l.solution, l.servicedBy,
                    l.department, l.company, l.asset_id, l.asset
                ].filter(Boolean).join(' ').toLowerCase();
                return hay.includes(term);
            });

            // Pagination Logic
            const totalItems = filteredLogs.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            
            // Ensure currentPage is valid
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages && totalPages > 0) currentPage = totalPages;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
            const paginatedLogs = filteredLogs.slice(startIndex, endIndex);

            if (filteredLogs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-10 text-center text-slate-400 flex flex-col items-center"><i class="fas fa-search text-4xl mb-2 opacity-50"></i><p>ไม่พบรายการ</p></td></tr>`;
                paginationControls.classList.add('hidden');
                paginationControls.classList.remove('flex');
                return;
            }

            paginationControls.classList.remove('hidden');
            paginationControls.classList.add('flex');
            document.getElementById('page-start').textContent = totalItems > 0 ? startIndex + 1 : 0;
            document.getElementById('page-end').textContent = endIndex;
            document.getElementById('page-total').textContent = totalItems;
            document.getElementById('btn-prev').disabled = currentPage <= 1;
            document.getElementById('btn-next').disabled = currentPage >= totalPages;

            tbody.innerHTML = paginatedLogs.map(l => {
                    const isSelected = l.id === selectedTicketId;
                    const selectedRowClass = isSelected ? 'bg-blue-50/70 dark:bg-blue-900/20' : '';

                    const isAssigned = String(l.servicedById ?? '').trim() === String(sessionData.user_id ?? '').trim();
                    const jobBadge = isAssigned ? '<span class="bg-amber-100 text-amber-700 border border-amber-200 text-[10px] px-1.5 py-0.5 rounded ml-2 font-bold">งานซ่อม</span>' : '';
                    
                    // Service Type Icon
                    let typeIcon = '<i class="fas fa-laptop text-blue-500"></i>';
                    let typeBg = 'bg-blue-50 border-blue-100';
                    if (l.service_type === 'MT') {
                        typeIcon = '<i class="fas fa-tools text-orange-500"></i>';
                        typeBg = 'bg-orange-50 border-orange-100';

                    let idColorClass = 'text-slate-700 dark:text-slate-200';

                    let step2Label = 'ดำเนินการ';

                        else if(l.status === 'Temporary Fix') { subStatus = 'แก้ชั่วคราว'; activeColor = 'indigo'; step2Label = 'แก้ชั่วคราว'; }

                    } else {

                                    if (i < currentIdx) {
                                        circle = 'bg-emerald-500 text-white';

                                    } else if (i === currentIdx) {
                                        if(activeColor === 'blue') { circle = 'bg-blue-500 text-white ring-4 ring-blue-100 dark:ring-blue-900/30'; text = 'text-blue-600 dark:text-blue-400 font-bold'; }

                                        else if(activeColor === 'teal') { circle = 'bg-teal-500 text-white ring-4 ring-teal-100 dark:ring-teal-900/30'; text = 'text-teal-600 dark:text-teal-400 font-bold'; }
                                        else if(activeColor === 'cyan') { circle = 'bg-cyan-500 text-white ring-4 ring-cyan-100 dark:ring-cyan-900/30'; text = 'text-cyan-600 dark:text-cyan-400 font-bold'; }
                                        else if(activeColor === 'orange') { circle = 'bg-orange-500 text-white ring-4 ring-orange-100 dark:ring-orange-900/30'; text = 'text-orange-500 dark:text-orange-400 font-bold'; }

                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                            <div class="text-[10px] text-slate-400 mt-1">
                                เวลาในสถานะนี้: ${statusDuration}
                            </div>
                        </div>
                        `;
                    }

                    // Action Button Logic
                    let actionBtn = '';
                    if (l.status === 'Pending') {
                        actionBtn = `<button onclick="cancelTicket('${l.id}')" class="px-3 py-1 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg text-xs font-bold transition border border-red-200 shadow-sm"><i class="fas fa-times-circle mr-1"></i> ยกเลิก</button>`;
                    } else if (['Completed', 'Unrepairable'].includes(l.status)) {
                        if (l.rating) {
                             actionBtn = `<div class="flex justify-center text-yellow-400 text-xs" title="Rating: ${l.rating}/5">`;
                             for(let r=1; r<=5; r++) actionBtn += r <= l.rating ? '<i class="fas fa-star"></i>' : '<i class="far fa-star text-slate-300"></i>';
                             actionBtn += `</div>`;
                        } else {
                             actionBtn = `<button onclick="rateTicket('${l.id}')" class="px-3 py-1 bg-yellow-50 text-yellow-600 hover:bg-yellow-100 rounded-lg text-xs font-bold transition border border-yellow-200 shadow-sm"><i class="far fa-star mr-1"></i> ให้คะแนน</button>`;
                        }
                    } else if (isCancelled) {
                        actionBtn = `<span class="text-xs text-slate-400">-</span>`;
                    } else {
                        actionBtn = `<span class="text-xs text-slate-400">รอปิดงาน</span>`;
                    }

                    // Print Button
                    const printBtn = `<button onclick="printTicket('${l.id}')" class="ml-2 p-1.5 text-slate-400 hover:text-blue-600 transition rounded hover:bg-slate-100 dark:hover:bg-slate-700" title="พิมพ์ใบงาน"><i class="fas fa-print"></i></button>`;

                    const statusBadge = (() => {

                            'Received': 'bg-amber-50 text-amber-700 border-amber-200',
                            'PR Submitted': 'bg-sky-50 text-sky-700 border-sky-200',
                            'PO Issued': 'bg-teal-50 text-teal-700 border-teal-200',
                            'Parts Received': 'bg-cyan-50 text-cyan-700 border-cyan-200',
                            'In Progress': 'bg-amber-50 text-amber-700 border-amber-200',
                            'Waiting for Parts': 'bg-orange-50 text-orange-700 border-orange-200',
                            'Temporary Fix': 'bg-indigo-50 text-indigo-700 border-indigo-200',
                            'Unrepairable': 'bg-rose-50 text-rose-700 border-rose-200',
                            'Completed': 'bg-emerald-50 text-emerald-700 border-emerald-200',
                            'Cancelled': 'bg-slate-100 text-slate-600 border-slate-200'
                        };
                        const cls = map[l.status] || 'bg-slate-100 text-slate-600 border-slate-200';
                        const labelMap = {
                            'Pending': 'รอรับเรื่อง',
                            'Received': 'รับเรื่องแล้ว',
                            'PR Submitted': 'ส่ง PR แล้ว',
                            'PO Issued': 'ออก PO แล้ว',
                            'Parts Received': 'ได้รับอะไหล่แล้ว',
                            'In Progress': 'กำลังซ่อม',
                            'Waiting for Parts': 'รออะไหล่',
                            'Temporary Fix': 'แก้ชั่วคราว',
                            'Unrepairable': 'ซ่อมไม่ได้',
                            'Completed': 'เสร็จสิ้น',
                            'Cancelled': 'ยกเลิก'
                        };
                        const label = labelMap[l.status] || l.status;
                        return `<span class="inline-flex items-center px-2 py-0.5 rounded-full border text-[10px] font-bold ${cls}">${label}${getPrPoStatusIcon(l)}</span>`;
                    })();

                    const assigneeLine = l.servicedBy ? `<div class="text-[10px] text-slate-400 mt-1"><i class="fas fa-user-gear mr-1 opacity-60"></i>${l.servicedBy}</div>` : '';

                    // Mobile Status Indicator
                    let mobileStatusDot = '';
                    if (l.status === 'Pending') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-blue-500 ml-1" title="Pending"></span>';
                    else if (l.status === 'Received') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-amber-400 ml-1" title="Received"></span>';
                    else if (l.status === 'PR Submitted') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-sky-500 ml-1" title="PR Submitted"></span>';
                    else if (l.status === 'PO Issued') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-teal-500 ml-1" title="PO Issued"></span>';
                    else if (l.status === 'Parts Received') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-cyan-500 ml-1" title="Parts Received"></span>';
                    else if (l.status === 'In Progress') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-amber-500 ml-1" title="In Progress"></span>';
                    else if (l.status === 'Waiting for Parts') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-orange-500 ml-1" title="Waiting for Parts"></span>';
                    else if (l.status === 'Temporary Fix') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-indigo-500 ml-1" title="Temporary Fix"></span>';
                    else if (l.status === 'Unrepairable') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-rose-500 ml-1" title="Unrepairable"></span>';
                    else if (l.status === 'Completed') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-emerald-500 ml-1" title="Completed"></span>';
                    else if (l.status === 'Cancelled') mobileStatusDot = '<span class="sm:hidden inline-block w-2 h-2 rounded-full bg-red-500 ml-1" title="Cancelled"></span>';

                    return `<tr class="${selectedRowClass} hover:bg-slate-50 dark:hover:bg-slate-700/30 transition cursor-pointer text-xs sm:text-sm" onclick="handleTicketClick('${l.id}')">
                        <td class="px-3 py-3 sm:px-6 sm:py-4 font-mono font-medium text-slate-700 dark:text-slate-200 align-top">
                            <div class="flex items-center gap-2"><div class="w-6 h-6 rounded flex items-center justify-center border ${typeBg}">${typeIcon}</div> <span class="${idColorClass}">${l.id}</span></div>

                                ${statusBadge}
                                ${jobBadge}
                            </div>
                            <div class="sm:hidden text-[10px] text-slate-400 mt-1">${new Date(l.date).toLocaleDateString('th-TH', {day:'numeric', month:'short'})}</div>

                                ${l.asset_id || l.asset ? `<span class="text-[10px] text-indigo-600 dark:text-indigo-300"><i class="fas fa-desktop mr-1 opacity-60"></i>${l.asset_id || l.asset}</span>` : ''}
                                ${l.appointment_date ? `<span class="text-[10px] text-slate-500 dark:text-slate-400"><i class="far fa-calendar mr-1 opacity-60"></i>${new Date(l.appointment_date).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' })}</span>` : ''}
                            </div>
                        </td>
                        <td class="px-6 py-4 align-top hidden md:table-cell"><span class="px-2 py-1 bg-slate-100 dark:bg-slate-700 rounded text-xs text-slate-600 dark:text-slate-300">${formatTypeLabel(l.type)}</span></td>
                        <td class="px-6 py-2 align-middle hidden sm:table-cell">${timelineHtml}</td>

                                ${printBtn}

                        </td>
                    </tr>`;

        }

                </div>
            `;

        async function renderTicketDetailPanel(logId, force = false) {
            const panel = document.getElementById('ticket-detail-panel');
            if (!panel) return;
            if (!force && lastDetailRenderedId === logId && panel.getAttribute('data-ticket-id') === logId) return;

            const log = allMyLogs.find(l => l && l.id === logId);
            if (!log) { clearTicketDetailPanel(); return; }

            panel.setAttribute('data-ticket-id', logId);
            panel.innerHTML = `
                <div class="animate-pulse space-y-3">
                    <div class="h-5 bg-slate-200 dark:bg-slate-700 rounded w-1/2"></div>
                    <div class="h-24 bg-slate-100 dark:bg-slate-700/50 rounded"></div>
                    <div class="h-24 bg-slate-100 dark:bg-slate-700/50 rounded"></div>
                </div>
            `;

            let imagesHtml = '';
            try {
                const res = await fetch('api.php?action=get&file=it_log_attachments&log_id=' + encodeURIComponent(logId));
                const files = await res.json();
                if (Array.isArray(files) && files.length > 0) {
                    const imgs = files.filter(f => /\.(jpg|jpeg|png|gif|webp)$/i.test(f.stored_filename));
                    if (imgs.length > 0) {
                        imagesHtml = `
                        <div class="mt-4 border-t border-slate-200 dark:border-slate-600 pt-3">
                            <h4 class="font-bold text-slate-700 dark:text-slate-200 mb-2 text-xs uppercase"><i class="fas fa-images text-blue-500 mr-1"></i> รูปภาพประกอบ</h4>
                            <div class="grid grid-cols-4 gap-2">
                                ${imgs.map(f => `<a href="uploads/attachments/${f.stored_filename}" target="_blank" class="block aspect-square rounded-lg overflow-hidden border border-slate-200 dark:border-slate-600 hover:opacity-80 transition bg-slate-100"><img src="uploads/attachments/${f.stored_filename}" class="w-full h-full object-cover"></a>`).join('')}
                            </div>
                        </div>`;
                    }
                }
            } catch (e) { console.error(e); }

            let uploadMoreHtml = '';
            if (!['Completed', 'Cancelled', 'Unrepairable'].includes(log.status)) {
                uploadMoreHtml = `
                    <div class="mt-4 border-t border-slate-200 dark:border-slate-600 pt-3">
                        <h4 class="font-bold text-slate-700 dark:text-slate-200 mb-2 text-xs uppercase"><i class="fas fa-paperclip text-green-500 mr-1"></i> แนบรูปภาพเพิ่มเติม</h4>
                        <div class="flex items-center gap-2">
                            <input type="file" id="more-attachments-panel-${log.id}" multiple accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-slate-700 dark:file:text-slate-200">
                            <button onclick="uploadMoreAttachments('${log.id}', 'more-attachments-panel-${log.id}')" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 transition shadow-sm flex items-center gap-2">
                                <i class="fas fa-upload"></i> <span class="hidden sm:inline">อัปโหลด</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            const txt = (t) => t || '-';
            const getStatusClass = s => {
                 const map = { 'Pending':'bg-blue-100 text-blue-600', 'PR Submitted':'bg-sky-100 text-sky-600', 'PO Issued':'bg-teal-100 text-teal-600', 'Parts Received':'bg-cyan-100 text-cyan-600', 'In Progress':'bg-amber-100 text-amber-600', 'Waiting for Parts':'bg-red-100 text-red-600', 'Temporary Fix':'bg-indigo-100 text-indigo-600', 'Unrepairable':'bg-rose-100 text-rose-600', 'Completed':'bg-emerald-100 text-emerald-600', 'Cancelled': 'bg-slate-100 text-slate-500' };
                 return map[s] || 'bg-slate-100 text-slate-600';
            };

            let panelActions = '';
            if (log.status === 'Pending') {
                panelActions = `<button onclick="cancelTicket('${log.id}')" class="w-full mt-4 py-2 bg-red-50 text-red-600 hover:bg-red-100 rounded-lg font-bold transition border border-red-200"><i class="fas fa-times-circle mr-1"></i> ยกเลิกงานแจ้งซ่อม</button>`;
            } else if (['Completed', 'Unrepairable'].includes(log.status)) {
                if (!log.rating) {
                     panelActions = `<button onclick="rateTicket('${log.id}')" class="w-full mt-4 py-2 bg-yellow-50 text-yellow-600 hover:bg-yellow-100 rounded-lg font-bold transition border border-yellow-200"><i class="far fa-star mr-1"></i> ให้คะแนนความพึงพอใจ</button>`;
                }
            }
            panelActions += `<button onclick="printTicket('${log.id}')" class="w-full mt-2 py-2 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg font-bold transition border border-slate-200"><i class="fas fa-print mr-1"></i> พิมพ์ใบงาน</button>`;

            let currentIdx = 0;
            let subStatus = '';
            let activeColor = 'blue';
            let isCancelled = log.status === 'Cancelled';
            let step2Label = 'ดำเนินการ';

            if (log.status === 'Pending') currentIdx = 0;
            else if (['Received','In Progress', 'Waiting for Parts', 'Temporary Fix', 'PR Submitted', 'PO Issued', 'Parts Received'].includes(log.status)) {
                currentIdx = 1;

                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'ยืนยันการยกเลิก',

                    if (!value) return 'กรุณาระบุเหตุผลก่อนยกเลิก';

        function formatDuration(startDate, endDate) {
            if (!startDate || !endDate) return '-';

            let diff = new Date(endDate) - new Date(startDate);
            if (diff < 0) return '-';

            let days = Math.floor(diff / (1000 * 60 * 60 * 24));
            diff -= days * (1000 * 60 * 60 * 24);

            let hours = Math.floor(diff / (1000 * 60 * 60));
            diff -= hours * (1000 * 60 * 60);

            let mins = Math.floor(diff / (1000 * 60));

            let parts = [];
            if (days > 0) parts.push(`${days} วัน`);
            if (hours > 0) parts.push(`${hours} ชม.`);
            if (mins > 0 && days === 0) parts.push(`${mins} นาที`);

            if (parts.length === 0 && diff > 0) return '< 1 นาที';
            if (parts.length === 0) return '-';
            return parts.join(' ');
        }

        function formatSecondsDuration(totalSeconds) {
            if (!totalSeconds || totalSeconds <= 0) return '-';
            let remaining = Math.floor(totalSeconds);
            const days = Math.floor(remaining / 86400);
            remaining -= days * 86400;
            const hours = Math.floor(remaining / 3600);
            remaining -= hours * 3600;
            const mins = Math.floor(remaining / 60);
            const parts = [];
            if (days > 0) parts.push(days + ' วัน');
            if (hours > 0) parts.push(hours + ' ชม.');
            if (mins > 0 && days === 0) parts.push(mins + ' นาที');
            if (!parts.length) return '< 1 นาที';
            return parts.join(' ');
        }
        function formatSolutionText(value) {
            const raw = String(value || '');
            if (!raw.trim()) return '';
            return raw
                .replace(/\[(\d{1,2}\/\d{1,2}\/\d{2,4}|\d{4}-\d{1,2}-\d{1,2})(\s+\d{1,2}:\d{2}(:\d{2})?)?\]\s*/g, '[$1] ')
                .replace(/\[Reopened\s+(\d{1,2}\/\d{1,2}\/\d{2,4}|\d{4}-\d{1,2}-\d{1,2})(\s+\d{1,2}:\d{2}(:\d{2})?)?\]\s*/g, '[Reopened $1] ')
                .split('\n')
                .map(line => line.trim())
                .filter(Boolean)
                .join('\n');
        }
        function getPrPoStatusIcon(item) {
            const hasPr = !!String(item?.pr_no || '').trim();
            const hasPo = !!String(item?.po_no || '').trim();

            let html = '';
            if (hasPr) html += `<span class="ml-1 inline-flex items-center text-blue-600" title="มี PR แล้ว"><i class="fas fa-file-signature"></i></span>`;
            if (hasPo) html += `<span class="ml-1 inline-flex items-center text-emerald-600" title="มี PO แล้ว"><i class="fas fa-file-invoice"></i></span>`;
            return html;
        }

        function getCurrentStatusDuration(log) {
            const now = new Date();
            const status = log.status || '';
            if (['In Progress', 'Waiting for Parts', 'Temporary Fix', 'PR Submitted', 'PO Issued', 'Parts Received'].includes(status)) {
                let secs = Number(log.total_work_duration_seconds || 0);
                if (log.last_work_start_time) {
                    const start = new Date(log.last_work_start_time);
                    if (!isNaN(start.getTime())) {
                        secs += Math.max(0, Math.floor((now - start) / 1000));
                    }
                }
                return formatSecondsDuration(secs);
            }
            if (status === 'Completed' || status === 'Unrepairable') {
                const secs = Number(log.total_work_duration_seconds || 0);
                return formatSecondsDuration(secs);
            }
            const created = new Date(log.date);
            if (isNaN(created.getTime())) return '-';
            const diffSecs = Math.max(0, Math.floor((now - created) / 1000));
            return formatSecondsDuration(diffSecs);
        }

        async function uploadMoreAttachments(logId, inputId) {
            const input = document.getElementById(inputId || `more-attachments-${logId}`);
            const files = input.files;

            if (!files || files.length === 0) {
                Swal.fire('แจ้งเตือน', 'กรุณาเลือกไฟล์รูปภาพก่อน', 'warning');
                return;
            }

            Swal.fire({
                title: 'กำลังอัปโหลด...',
                text: `กำลังอัปโหลด ${files.length} ไฟล์`,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                // Using Promise.all to upload concurrently
                const uploadPromises = Array.from(files).map(file => {
                    const fd = new FormData();
                    fd.append('action', 'upload_attachment');
                    fd.append('log_id', logId);
                    fd.append('attachmentFile', file);
                    return fetch(API_PATH, { method: 'POST', body: fd }).then(res => res.json());
                });

                const results = await Promise.all(uploadPromises);
                
                const failures = results.filter(r => r.status !== 'success');
                if (failures.length > 0) {
                    throw new Error(`อัปโหลดไม่สำเร็จ ${failures.length} ไฟล์`);
                }

                await Swal.fire('สำเร็จ!', 'อัปโหลดรูปภาพเพิ่มเติมเรียบร้อยแล้ว', 'success');

            }
        }
