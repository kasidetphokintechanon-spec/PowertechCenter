<style>
/* ════ สต็อก & เบิกของ (ผู้ดูแล) — คำขอ (บอร์ด + จัดของ/จ่าย) / คลังสินค้า (รับเข้า นับ แก้สินค้า) / รายงาน · แพทเทิร์นเดียวกับ log.html ════ */
/* enterprise-theme ล็อกการเลื่อนทั้งหน้าบนจอกว้าง (ไว้ใช้กับหน้าที่มีเมนูซ้าย) — หน้านี้เลื่อนทั้งหน้าตามปกติ */
html { overflow:auto !important; height:auto !important; } body { overflow:visible !important; height:auto !important; }
body { background:var(--ptc-bg); color:var(--ptc-text); margin:0; }
.lg-tabs { display:flex; border:1px solid var(--ptc-border); border-radius:8px; overflow:hidden; margin-left:auto; }
.lg-tabs button { height:34px; padding:0 14px; border:0; background:var(--ptc-surface); color:var(--ptc-text-2); font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px; }
.lg-tabs button.on { background:var(--ptc-text); color:var(--ptc-surface); }
.lg-tabs .cnt { min-width:18px; height:18px; border-radius:9px; background:#dc2626; color:#fff; font-size:11px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
.nb { height:34px; padding:0 12px; border:1px solid var(--ptc-border); border-radius:8px; display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12.5px; font-weight:700; color:var(--ptc-text-2); text-decoration:none; background:var(--ptc-surface); cursor:pointer; white-space:nowrap; }
.wrap { max-width:1480px; margin:0 auto; padding:18px 16px 40px; }
.card { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; }
.btn { height:36px; padding:0 13px; border-radius:8px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap; text-decoration:none; }
.btn:hover { border-color:var(--ptc-primary); }
.btn.pri { background:var(--ptc-primary); border-color:var(--ptc-primary); color:#fff; }
.btn.ok { background:#16a34a; border-color:#16a34a; color:#fff; }
.btn.sm { height:30px; padding:0 10px; font-size:12px; }
.btn.danger { color:#dc2626; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.muted { color:var(--ptc-text-muted); }
.pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; color:var(--c, #64748b); background:color-mix(in srgb, var(--c, #64748b) 12%, transparent); }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { padding:6px 12px; border-radius:99px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
.chip.on { border-color:var(--ptc-primary); background:var(--ptc-primary-light); color:var(--ptc-primary); }
.chip.red { color:#dc2626; } .chip.red.on { border-color:#dc2626; background:#fef2f2; }
html.dark .chip.red.on { background:rgba(220,38,38,.12); }
.av { width:22px; height:22px; border-radius:50%; background:var(--ptc-primary); color:#fff; font-size:9px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.empty { padding:30px 14px; text-align:center; color:var(--ptc-text-muted); font-size:13px; }
.empty i { font-size:22px; display:block; margin-bottom:6px; opacity:.6; }
.sep { width:1px; height:22px; background:var(--ptc-border); }
/* KPI */
.kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:14px; }
.kpi { padding:12px 14px; text-align:left; font:inherit; color:inherit; }
.kpi b { font-size:24px; font-weight:800; display:block; line-height:1.15; }
.kpi span { font-size:12px; color:var(--ptc-text-muted); }
button.kpi { cursor:pointer; } button.kpi:hover { border-color:var(--ptc-primary); }
.kpi.bad { background:#fef2f2; border-color:#fecaca; } .kpi.bad b { color:#dc2626; }
html.dark .kpi.bad { background:rgba(220,38,38,.1); border-color:rgba(220,38,38,.35); }
.fbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.fbar input[type=text], .fbar input[type=month] { flex:1; min-width:180px; height:36px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 12px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
.fbar input[type=month] { flex:0 0 auto; min-width:0; }
/* บอร์ด */
.board { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; align-items:start; }
.col { background:var(--ptc-surface-2); border:1px solid var(--ptc-border); border-radius:10px; padding:10px; min-width:0; }
.col-h { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:800; padding:2px 4px 10px; }
.col-h i.dot { width:8px; height:8px; border-radius:50%; background:var(--c); }
.col-h .n { margin-left:auto; font-size:11.5px; font-weight:700; background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:99px; padding:0 8px; }
.jc { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:9px; padding:10px 11px; margin-bottom:8px; cursor:pointer; display:block; min-width:0; }
.jc:last-child { margin-bottom:0; }
.jc:hover { border-color:var(--ptc-primary); }
.jc.u2 { box-shadow:inset 3px 0 0 #d97706; }
.jc-top { display:flex; align-items:center; gap:6px; font-size:11.5px; min-width:0; }
.jc-top .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); white-space:nowrap; }
.jc-top .pill { margin-left:auto; }
.jc h4 { font-size:13.5px; font-weight:700; margin:5px 0 3px; overflow-wrap:anywhere; }
.jc-m { font-size:11.5px; color:var(--ptc-text-muted); overflow-wrap:anywhere; }
.jc-f { display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11.5px; color:var(--ptc-text-2); flex-wrap:wrap; }
.mtabs { display:none; }
/* หน้าใบเบิก */
.ws { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; align-items:start; }
.back { font-size:13px; color:var(--ptc-primary); font-weight:700; cursor:pointer; margin-bottom:10px; display:inline-flex; gap:6px; align-items:center; background:none; border:0; font-family:inherit; padding:0; }
.ws-h { padding:16px 18px; border-bottom:1px solid var(--ptc-border); }
.ws-h .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); }
.ws-h h2 { font-size:19px; margin:6px 0 3px; overflow-wrap:anywhere; }
.sec { padding:14px 18px; border-bottom:1px solid var(--ptc-border); }
.sec:last-child { border-bottom:0; }
.sec h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); letter-spacing:.03em; margin:0 0 8px; }
.acts { display:flex; gap:8px; flex-wrap:wrap; }
.acts .btn { flex:1 1 170px; height:42px; }
.warn { margin-top:10px; padding:9px 11px; border-radius:9px; background:#fffbeb; border:1px solid #fde68a; font-size:12.5px; color:#92400e; display:flex; gap:7px; }
html.dark .warn { background:rgba(217,119,6,.1); border-color:rgba(217,119,6,.35); color:#fcd34d; }
.ta, .in { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:8px 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; }
.num { width:72px; height:32px; border:1px solid var(--ptc-border); border-radius:7px; text-align:center; font:inherit; font-size:13.5px; background:var(--ptc-surface); color:var(--ptc-text); }
.num.chg { border-color:#d97706; background:#fffbeb; } html.dark .num.chg { background:rgba(217,119,6,.12); }
.sig { position:relative; border:1px dashed var(--ptc-border-strong, #cbd5e1); border-radius:9px; background:#fff; height:150px; touch-action:none; }
.sig canvas { width:100%; height:100%; display:block; cursor:crosshair; }
.sig .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:13px; pointer-events:none; }
.sig .clr { position:absolute; top:6px; right:6px; }
.side .card { padding:14px 16px; margin-bottom:12px; }
.side h4 { font-size:12px; font-weight:800; color:var(--ptc-text-2); letter-spacing:.03em; margin:0 0 10px; }
.person { display:flex; gap:10px; align-items:center; }
.person .av { width:36px; height:36px; font-size:12px; }
.person b { display:block; font-size:13.5px; overflow-wrap:anywhere; } .person div > span { font-size:12px; color:var(--ptc-text-muted); }
.hist div { display:grid; grid-template-columns:62px 1fr; gap:8px; padding:6px 0; border-top:1px solid var(--ptc-border); font-size:12.5px; }
.hist div:first-child { border-top:0; } .hist span { color:var(--ptc-text-muted); } .hist b { font-weight:500; overflow-wrap:anywhere; }
.meter { height:7px; border-radius:4px; background:var(--ptc-border); overflow:hidden; margin-top:8px; } .meter i { display:block; height:100%; background:#16a34a; } .meter i.w { background:#d97706; } .meter i.b { background:#dc2626; }
/* ตาราง */
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { text-align:left; font-size:11.5px; color:var(--ptc-text-muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--ptc-border); white-space:nowrap; }
.tbl td { padding:9px 12px; border-bottom:1px solid var(--ptc-border); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:0; }
.tbl .r { text-align:right; white-space:nowrap; } .tbl .code { font-family:Consolas,monospace; font-size:12px; color:var(--ptc-text-muted); white-space:nowrap; }
.tbl .low { color:#dc2626; font-weight:700; } .tbl tr.off td { opacity:.5; }
.lvl { height:6px; border-radius:3px; background:var(--ptc-border); overflow:hidden; width:90px; } .lvl i { display:block; height:100%; background:#16a34a; } .lvl i.w { background:#d97706; } .lvl i.b { background:#dc2626; }
.tblwrap { overflow-x:auto; }
.sumg { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
.h3 { font-size:14px; font-weight:800; margin:0; padding:12px 14px; border-bottom:1px solid var(--ptc-border); display:flex; align-items:center; gap:8px; }
.h3 .sp { flex:1; }
/* ฟอร์มรับเข้า / นับ */
.rrow { display:grid; grid-template-columns:minmax(0,2.2fr) 90px 130px 110px 130px 34px; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid var(--ptc-border); }
.rrow.hd { font-size:11.5px; color:var(--ptc-text-muted); font-weight:700; padding-top:0; }
.rrow select, .rrow input { height:34px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 8px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; width:100%; box-sizing:border-box; min-width:0; }
.seg { display:flex; border:1px solid var(--ptc-border); border-radius:8px; overflow:hidden; height:34px; }
.seg button { flex:1; border:0; background:var(--ptc-surface); color:var(--ptc-text-2); font:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg button.on { background:var(--ptc-primary-light); color:var(--ptc-primary); }
.fx { text-align:left; display:grid; gap:10px; }
.fx label { font-size:12.5px; font-weight:700; color:var(--ptc-text-2); display:block; margin-bottom:4px; }
.fx input:not([type=checkbox]), .fx select, .fx textarea { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:8px 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; }
.fx .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .fx .three { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.fx .hint { font-size:12px; color:var(--ptc-text-muted); margin-top:4px; }
.fx .ck { display:flex; gap:7px; align-items:center; font-size:13px; font-weight:500; cursor:pointer; }
@media (max-width:1180px) { .kpis { grid-template-columns:repeat(3,1fr); } .ws { grid-template-columns:minmax(0,1fr); } .sumg { grid-template-columns:repeat(2,1fr); } }
@media (max-width:900px) {
  .board { grid-template-columns:minmax(0,1fr); }
  .board .col { display:none; } .board .col.show { display:block; }
  .mtabs { display:flex; gap:6px; overflow-x:auto; margin-bottom:10px; padding-bottom:2px; scrollbar-width:none; }
  .mtabs .chip b { margin-left:4px; }
  .rrow { grid-template-columns:1fr 1fr; } .rrow.hd { display:none; } .rrow > :first-child { grid-column:1/-1; }
}
@media (max-width:640px) {
  .kpis { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin-bottom:10px; }
  .kpis::-webkit-scrollbar, .mtabs::-webkit-scrollbar { display:none; }
  .kpi { flex:0 0 auto; min-width:84px; padding:8px 12px; }
  .kpi b { font-size:19px; } .kpi span { font-size:11px; white-space:nowrap; }
  .wrap { padding:12px 10px 30px; }
  .lg-tabs { position:fixed; top:var(--lg-nav-h, 56px); left:0; right:0; z-index:90; border-radius:0; border-width:0 0 1px; margin:0; }
  .lg-tabs button { flex:1; justify-content:center; height:44px; }
  .wrap { padding-top:calc(44px + 12px) !important; }
  .nb span, .ptc-nav-sub { display:none; }
  .sumg { grid-template-columns:1fr 1fr; gap:8px; }
  .tbl.cards thead { display:none; }
  .tbl.cards, .tbl.cards tbody, .tbl.cards tr, .tbl.cards td { display:block; width:100%; box-sizing:border-box; }
  .tbl.cards tr { border-bottom:1px solid var(--ptc-border); padding:8px 0; }
  .tbl.cards td { border:0; padding:2px 14px; text-align:left; }
  .tbl.cards td[data-l]:before { content:attr(data-l) ' '; color:var(--ptc-text-muted); font-size:12px; }
  .fx .two, .fx .three { grid-template-columns:1fr; }
}
</style>
</head>

<main class="wrap">

        <div class="kpis" id="kpis"></div>
        <div class="fbar"><input type="text" id="q" placeholder="ค้นหาเลขที่ / ผู้เบิก / แผนก / ชื่อของ…" oninput="renderBoard()"><div class="chips co-chips"></div><span class="sep"></span><div class="chips" id="type-chips"></div></div>

<script>
const gid = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const thD = s => s ? new Date(String(s).replace(' ', 'T')).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : '';
const thDT = s => s ? new Date(String(s).replace(' ', 'T')).toLocaleString('th-TH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
const baht = n => '฿' + Number(n || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });
const num = n => Number(n || 0).toLocaleString('th-TH');
const ago = s => { const m = Math.round((Date.now() - new Date(String(s).replace(' ', 'T'))) / 60000); return m < 1 ? 'เมื่อกี้' : m < 60 ? m + ' นาที' : m < 1440 ? Math.round(m / 60) + ' ชม.' : Math.round(m / 1440) + ' วัน'; };
const initials = n => String(n || '').replace(/^(Mr\.?|Mrs\.?|Ms\.?|นาย|นางสาว|นาง)\s*/i, '').split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';
const TYPES = { stationery: { t: 'เครื่องเขียน', ic: 'fa-pen-ruler' }, maid: { t: 'ของแม่บ้าน', ic: 'fa-broom' } };
const CAT_TH = { office: 'สำนักงาน', it: 'IT', safety: 'ความปลอดภัย', cleaning: 'ทำความสะอาด', laundry: 'ผ้า/ซักรีด', other: 'อื่น ๆ' };
const STATUS_C = { pending: '#d97706', approved: '#2563eb', ready: '#0891b2', issued: '#16a34a', rejected: '#64748b', cancelled: '#64748b' };
const COS = ['PTA', 'PT4', 'PTE'];

let isAdmin = false, myCo = '', co = '', tf = '', rows = [], board = {}, mcol = 'pending', cur = null, sig = null, busy = false;
let inv = [], invQ = '', invLow = false, invMode = 'list', recv = [], repMonth = new Date().toISOString().slice(0, 7);

async function api(p) { const j = await (await fetch('api.php?' + new URLSearchParams(p), { cache: 'no-store' })).json(); if (j.status !== 'success') throw new Error(j.message || 'โหลดไม่สำเร็จ'); return j; }
async function post(o) { const fd = o instanceof FormData ? o : new FormData(); if (!(o instanceof FormData)) Object.entries(o).forEach(([k, v]) => fd.append(k, v ?? '')); const j = await (await fetch('api.php', { method: 'POST', body: fd })).json(); if (j.status !== 'success') throw new Error(j.message || 'ไม่สำเร็จ'); return j; }

// บริษัท: admin เลือกได้ (ว่าง = ทุกบริษัท) · ผู้ดูแลทั่วไปเห็นของบริษัทตัวเอง
function coChips(allowAll, onPick) {
    if (!isAdmin) return `<span class="pill" style="--c:#0891b2">${esc(myCo)}</span>`;
    return (allowAll ? `<button class="chip ${co === '' ? 'on' : ''}" onclick="${onPick}('')">ทุกบริษัท</button>` : '') + COS.map(c => `<button class="chip ${co === c ? 'on' : ''}" onclick="${onPick}('${c}')">${c}</button>`).join('');
}
const needCo = () => co || myCo || 'PTA';

// ── บอร์ดคำขอ ──
const COLS = [{ k: 'pending', t: 'คำขอใหม่', c: '#d97706' }, { k: 'approved', t: 'กำลังจัดของ', c: '#2563eb' }, { k: 'ready', t: 'รอมารับ', c: '#0891b2' }, { k: 'done', t: 'ปิดวันนี้', c: '#16a34a' }];
const colOf = r => ['pending', 'approved', 'ready'].includes(r.status) ? r.status : 'done';
function pickBoardCo(c) { co = c; loadBoard(); }
function renderKpis() {
    const n = s => rows.filter(r => r.status === s).length;

function sigBox(label) { return `<h4 style="margin-top:14px">${label}</h4><div class="sig" id="sig"><canvas></canvas><span class="ph">เซ็นชื่อตรงนี้ (นิ้ว / เมาส์)</span><button class="btn sm clr" type="button" onclick="sig.clear()">ล้าง</button></div>`; }
function mountSig() {
    const box = gid('sig'); if (!box) return (sig = null);
    const cv = box.querySelector('canvas'), ph = box.querySelector('.ph'), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = '#0f172a';
    let draw = false, used = false, last = null;
    const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
    cv.onpointerdown = e => { draw = true; last = pt(e); cv.setPointerCapture(e.pointerId); };
    cv.onpointermove = e => { if (!draw) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; if (!used) { used = true; ph.style.display = 'none'; } };
    cv.onpointerup = cv.onpointercancel = () => { draw = false; };
    sig = { empty: () => !used, data: () => cv.toDataURL('image/png'), clear: () => { ctx.clearRect(0, 0, cv.width, cv.height); used = false; ph.style.display = ''; } };
}

function csv(name, rows) {
    const body = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([body], { type: 'text/csv;charset=utf-8' })), download: name });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// นำเข้าสินค้าจาก CSV (เปิดด้วย Excel ได้) — รหัสซ้ำในบริษัทเดียวกัน = อัปเดต · ยอดคงเหลือไม่เปลี่ยน (ใช้ "รับของเข้า" แทน)
const IMPORT_COLS = ['item_code', 'name', 'type', 'category', 'unit', 'pack_unit', 'pack_size', 'price_per_unit', 'min_stock', 'max_stock', 'description'];
function parseCsv(text) {
    const out = []; let row = [], f = '', q = false;
    text = text.replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (q) { if (c === '"' && text[i + 1] === '"') { f += '"'; i++; } else if (c === '"') q = false; else f += c; }
        else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); out.push(row); row = []; f = ''; } else f += c;
    }
    if (f !== '' || row.length) { row.push(f); out.push(row); }
    return out.filter(r => r.some(x => x.trim() !== ''));
}

        <p class="muted" style="font-size:12.5px;margin:10px 14px 0">พิมพ์ใบนับไปนับของจริง → กรอกเฉพาะรายการที่นับแล้ว (ช่องว่าง = ไม่ปรับ) → ระบบปรับยอดให้เท่าที่นับได้ พร้อมเก็บประวัติ</p>
        <div class="tblwrap"><table class="tbl cards"><thead><tr><th>สินค้า</th><th class="r">ยอดระบบ</th><th>นับได้</th><th class="r">ต่าง</th></tr></thead><tbody>
        ${list.map(i => { const v = countVals[i.id] || {}, pk = i.pack_size > 1;
            return `<tr><td><b style="font-weight:600">${esc(i.name)}</b> <span class="code">${esc(i.item_code)}</span></td><td class="r" data-l="ระบบ">${num(i.balance)} ${esc(i.unit)}</td>
            <td style="white-space:nowrap">${pk ? `<input class="num" type="number" min="0" inputmode="numeric" placeholder="0" value="${esc(v.p ?? '')}" oninput="setCount(${i.id},'p',this.value)"> ${esc(i.pack_unit)} + ` : ''}<input class="num" type="number" min="0" inputmode="numeric" placeholder="${pk ? '0' : '-'}" value="${esc(v.u ?? '')}" oninput="setCount(${i.id},'u',this.value)"> ${esc(i.unit)}</td>
            <td class="r" id="cd-${i.id}">${diffText(i)}</td></tr>`; }).join('')}</tbody></table></div>
        <div class="fx" style="padding:14px"><div><label>เหตุผล <span style="color:#dc2626">*</span></label><input id="c-reason" placeholder="เช่น นับสต็อกประจำเดือน ต.ค. / ของเสียหาย / เจอของตกหล่น"></div>
            <div style="display:flex;justify-content:flex-end"><button class="btn ok" id="c-go" onclick="saveCount()"><i class="fa fa-check"></i> บันทึกยอดนับ</button></div></div></div>`;
}
function countedOf(i) { const v = countVals[i.id]; if (!v || (v.p === '' || v.p == null) && (v.u === '' || v.u == null)) return null; return (+v.p || 0) * (i.pack_size > 1 ? i.pack_size : 1) + (+v.u || 0); }
function diffText(i) { const c = countedOf(i); if (c === null) return '<span class="muted">-</span>'; const d = c - i.balance; return d === 0 ? '<span style="color:#16a34a">ตรง</span>' : `<b style="color:${d < 0 ? '#dc2626' : '#16a34a'}">${d > 0 ? '+' : ''}${num(d)}</b>`; }
function setCount(id, k, v) { (countVals[id] = countVals[id] || {})[k] = v; const i = inv.find(x => x.id === id); gid('cd-' + id).innerHTML = diffText(i); }
async function saveCount() {
    const rowsC = countList().map(i => ({ item_id: i.id, counted: countedOf(i) })).filter(r => r.counted !== null);
    if (!rowsC.length) return ptcAlert('warning', 'ยังไม่ได้กรอกยอดนับ', 'กรอกอย่างน้อย 1 รายการ');
    const reason = gid('c-reason').value.trim();
    if (!reason) return ptcAlert('warning', 'ใส่เหตุผล', 'เก็บไว้ในประวัติเพื่อตรวจย้อนหลัง');
    const changed = rowsC.filter(r => r.counted !== inv.find(i => i.id === r.item_id).balance).length;
    const { isConfirmed } = await ptcSwal().fire({ title: changed ? `ปรับยอด ${changed} รายการ?` : 'ยอดตรงทุกรายการ', text: changed ? 'ยอดในระบบจะเปลี่ยนเป็นยอดที่นับได้' : 'ไม่มีรายการต้องปรับ', showCancelButton: !!changed, confirmButtonText: changed ? 'ปรับยอด' : 'ตกลง', cancelButtonText: 'กลับ' });
    if (!isConfirmed || !changed) return;
    gid('c-go').disabled = true;
    try { const j = await post({ action: 'stock_count', company: needCo(), reason, rows: JSON.stringify(rowsC) }); ptcToast('success', `ปรับยอดแล้ว ${j.changed} รายการ`); invMode = 'list'; countVals = {}; loadInv(); }
    catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); gid('c-go').disabled = false; }
}

// ── รายงาน ──
let rep = null;
function pickRepCo(c) { co = c; loadRep(); }
async function loadRep() {
    gid('v-rep').innerHTML = `<div class="fbar"><input type="month" id="rp-m" value="${repMonth}" onchange="repMonth=this.value;loadRep()"><div class="chips">${coChips(true, 'pickRepCo')}</div><span class="sep"></span>
        <div class="chips"><button class="chip ${tf === '' ? 'on' : ''}" onclick="tf='';loadRep()">ทุกประเภท</button>${Object.entries(TYPES).map(([k, v]) => `<button class="chip ${tf === k ? 'on' : ''}" onclick="tf='${k}';loadRep()">${v.t}</button>`).join('')}</div>
        <button class="btn" style="margin-left:auto" onclick="exportRep()"><i class="fa fa-file-csv"></i> ส่งออก</button></div><div id="rp-body"><div class="empty">กำลังโหลด…</div></div>`;
    try { rep = await api({ action: 'stock_report', company: co, month: repMonth, type: tf }); } catch (e) { gid('rp-body').innerHTML = `<div class="card empty">${esc(e.message)}</div>`; return; }
    const t = rep.totals, rq = rep.requests, nReq = Object.values(rq).reduce((a, b) => a + b, 0), maxD = Math.max(1, ...rep.departments.map(d => d.value));
    gid('rp-body').innerHTML = `<div class="sumg"><div class="card kpi"><b style="color:#16a34a">${baht(t.val_in)}</b><span>รับเข้าเดือนนี้</span></div><div class="card kpi"><b style="color:#2563eb">${baht(t.val_out)}</b><span>จ่ายออกเดือนนี้</span></div>
        <div class="card kpi"><b>${baht(t.val_closing)}</b><span>มูลค่าคงเหลือสิ้นเดือน</span></div><div class="card kpi"><b>${nReq}</b><span>ใบเบิก · จ่ายแล้ว ${rq.issued || 0} · ไม่อนุมัติ ${rq.rejected || 0} · ยกเลิก ${rq.cancelled || 0}</span></div></div>
    <div class="ws" style="grid-template-columns:minmax(0,1fr) 380px">
        <div class="card"><div class="h3">ความเคลื่อนไหวรายสินค้า<span class="sp"></span><span class="muted" style="font-size:12px;font-weight:500">ยกมา + รับเข้า − จ่ายออก ± ปรับยอด = คงเหลือ</span></div><div class="tblwrap"><table class="tbl cards"><thead><tr><th>สินค้า</th><th class="r">ยกมา</th><th class="r">รับเข้า</th><th class="r">จ่ายออก</th><th class="r">ปรับยอด</th><th class="r">คงเหลือ</th><th class="r">มูลค่าจ่าย</th></tr></thead><tbody>
            ${rep.items.map(i => `<tr><td><b style="font-weight:600">${esc(i.name)}</b> <span class="code">${esc(i.item_code)}</span> <span class="muted" style="font-size:12px">${esc(i.unit)}${isAdmin && !co ? ' · ' + esc(i.company) : ''}</span></td><td class="r" data-l="ยกมา">${num(i.opening)}</td><td class="r" data-l="รับเข้า">${i.qty_in ? '+' + num(i.qty_in) : '-'}</td>
                <td class="r" data-l="จ่ายออก">${i.qty_out ? '−' + num(i.qty_out) : '-'}</td><td class="r" data-l="ปรับยอด">${i.qty_adj ? (i.qty_adj > 0 ? '+' : '') + num(i.qty_adj) : '-'}</td><td class="r" data-l="คงเหลือ"><b>${num(i.closing)}</b></td><td class="r" data-l="มูลค่าจ่าย">${i.val_out ? baht(i.val_out) : '-'}</td></tr>`).join('') || '<tr><td colspan="7"><div class="empty">ไม่มีความเคลื่อนไหว</div></td></tr>'}</tbody></table></div></div>
        <div><div class="card" style="margin-bottom:12px"><div class="h3">เบิกตามแผนก</div><div style="padding:8px 14px 12px">${rep.departments.map(d => `<div style="padding:7px 0;font-size:13px"><div style="display:flex;gap:8px"><span style="flex:1;overflow-wrap:anywhere">${esc(d.department)}${isAdmin && !co ? ' · ' + esc(d.company) : ''}</span><b>${baht(d.value)}</b></div>
            <div class="meter" style="margin-top:5px"><i style="width:${d.value / maxD * 100}%;background:var(--ptc-primary)"></i></div><span class="muted" style="font-size:11.5px">${d.requests} ใบ</span></div>`).join('') || '<div class="empty">ยังไม่มีการจ่ายของ</div>'}</div></div>
            <div class="card"><div class="h3">วงเงินแผนก / เดือน<span class="sp"></span><button class="btn sm" onclick="quotaEdit()"><i class="fa fa-sliders"></i> ตั้งวงเงิน</button></div><p class="muted" style="font-size:12.5px;margin:10px 14px 12px">เกินวงเงินแค่ขึ้นเตือนทั้งฝั่งพนักงานและผู้อนุมัติ ไม่บล็อกการเบิก</p></div></div></div>`;
}
function exportRep() {
    if (!rep) return;
    csv(`รายงานสต็อก-${rep.month}-${co || 'ทุกบริษัท'}.csv`, [['บริษัท', 'รหัส', 'สินค้า', 'หน่วย', 'ยกมา', 'รับเข้า', 'มูลค่ารับเข้า', 'จ่ายออก', 'มูลค่าจ่ายออก', 'ปรับยอด', 'คงเหลือ', 'มูลค่าคงเหลือ'],
        ...rep.items.map(i => [i.company, i.item_code, i.name, i.unit, i.opening, i.qty_in, i.val_in, i.qty_out, i.val_out, i.qty_adj, i.closing, i.val_closing]), [], ['แผนก', 'บริษัท', 'จำนวนใบ', 'มูลค่า'], ...rep.departments.map(d => [d.department, d.company, d.requests, d.value])]);
}
async function quotaEdit() {
    const c = needCo(), t = tf || 'stationery';
    let j; try { j = await api({ action: 'stock_quota', company: c, stock_type: t }); } catch (e) { return ptcAlert('error', 'โหลดไม่สำเร็จ', e.message); }
    const { isConfirmed, value: changes = [] } = await ptcSwal().fire({ title: `วงเงิน${TYPES[t].t} / เดือน · ${c}`, width: 'min(620px,96vw)', showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ปิด', focusConfirm: false,
        html: `<p class="muted" style="font-size:12.5px;margin:0 0 8px;text-align:left">ใส่ 0 หรือว่าง = ไม่จำกัด · สลับประเภทได้จากปุ่มด้านบนของหน้ารายงาน</p><div style="max-height:55vh;overflow:auto"><table class="tbl" style="text-align:left"><thead><tr><th>แผนก</th><th class="r">ใช้ไปเดือนนี้</th><th class="r">วงเงิน (บาท)</th></tr></thead><tbody>
            ${j.rows.map((r, n) => `<tr><td>${esc(r.department)}</td><td class="r">${baht(r.used)}</td><td class="r"><input class="num" style="width:110px" type="number" min="0" step="100" data-q="${n}" value="${r.limit || ''}" placeholder="ไม่จำกัด"></td></tr>`).join('')}</tbody></table></div>`,
        preConfirm: () => [...document.querySelectorAll('[data-q]')].map(el => ({ d: j.rows[+el.dataset.q].department, v: +el.value || 0, old: j.rows[+el.dataset.q].limit })).filter(x => x.v !== x.old) });
    if (!isConfirmed || !changes.length) return;
    try { for (const x of changes) await post({ action: 'stock_quota', company: c, stock_type: t, department: x.d, limit: x.v }); ptcToast('success', `บันทึกวงเงิน ${changes.length} แผนก`); }
    catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}

// ── เริ่มต้น ──
function syncNavH() { const n = document.querySelector('.ptc-nav'); if (n) document.documentElement.style.setProperty('--lg-nav-h', n.getBoundingClientRect().bottom + 'px'); }
window.addEventListener('resize', syncNavH);
function tab(t) {
    syncNavH();
    ['board', 'ws', 'inv', 'rep'].forEach(k => gid('v-' + k).style.display = k === t ? '' : 'none');
    ['board', 'inv', 'rep'].forEach(k => gid('t-' + k).classList.toggle('on', k === t || (t === 'ws' && k === 'board')));
    if (t !== 'ws') { try { const u = new URL(location.href); u.searchParams.delete('id'); u.searchParams.set('tab', t); history.replaceState(null, '', u); } catch (_) {} }
    if (t === 'board') renderBoard();
    if (t === 'inv') { invMode = 'list'; loadInv(); }
    if (t === 'rep') loadRep();
    scrollTo(0, 0);
}
(async function init() {
    let S = {};
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) {}
    if (!S.loggedin) { location.href = 'login.html?returnUrl=' + encodeURIComponent(location.pathname.split('/').pop() + location.search); return; }
    isAdmin = S.role === 'admin'; myCo = S.company || '';
    const qs = new URLSearchParams(location.search);
    await loadBoard();
    if (+qs.get('id')) openWs(+qs.get('id'));
    else tab(['inv', 'rep'].includes(qs.get('tab')) ? qs.get('tab') : 'board');
    // รีเฟรชบอร์ดทุก 1 นาทีตอนเปิดหน้าอยู่ — ไม่ยุ่งตอนกำลังจัดของ/เซ็นในหน้าใบเบิก
    setInterval(() => { if (document.visibilityState === 'visible' && gid('v-board').style.display !== 'none') loadBoard(); }, 60000);
})();
</script>
