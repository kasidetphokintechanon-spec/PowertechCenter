    // --- Server Check: Items manager (per room) ---
    const SC_TYPE_LABELS = { status:'สถานะ (✓/✗)', backup:'Backup (✓/✗)', percent:'เปอร์เซ็นต์ (%)', days:'จำนวนวัน' };
    window.openServerCheckItemsManager = async function(roomId, roomLabel) {
        const typeOptions = (sel) => Object.entries(SC_TYPE_LABELS)
            .map(([v,l]) => `<option value="${v}" ${sel===v?'selected':''}>${l}</option>`).join('');
        const html = `
        <div style="text-align:left;font-family:inherit">
            <div style="font-size:12px;color:#64748b;margin-bottom:12px">${escapeHtml(roomLabel||'')}</div>
            <div style="display:flex;gap:8px;margin-bottom:14px;align-items:flex-start;flex-wrap:wrap">
                <input id="scim-new-label" type="text" placeholder="ชื่อรายการตรวจใหม่..." style="flex:2;min-width:160px;padding:8px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;outline:none;font-family:inherit">
                <select id="scim-new-type" style="padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:inherit">${typeOptions('status')}</select>
                <input id="scim-new-threshold" type="number" min="0" placeholder="เกณฑ์ (วัน)" style="width:100px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:inherit;display:none">
                <button id="scim-add-btn" type="button" style="padding:8px 16px;border-radius:8px;background:#2563eb;color:#fff;border:none;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px"><i class="fa fa-plus"></i>เพิ่ม</button>
            </div>
            <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:flex;align-items:center;gap:6px">
                <i class="fa fa-grip-vertical" style="font-size:10px"></i>ลาก-วางเพื่อเรียงลำดับ
            </div>
            <div id="scim-list" style="max-height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:5px"></div>
        </div>`;
        await Swal.fire({
            title: 'จัดการรายการตรวจ', html, width: 640, showConfirmButton: false, showCloseButton: true,
            didOpen: async () => {
                const listEl        = document.getElementById('scim-list');
                const addBtn        = document.getElementById('scim-add-btn');
                const newLabelEl    = document.getElementById('scim-new-label');
                const newTypeEl     = document.getElementById('scim-new-type');
                const newThreshEl   = document.getElementById('scim-new-threshold');
                let dragSrc = null;

                newTypeEl?.addEventListener('change', () => {
                    newThreshEl.style.display = newTypeEl.value === 'days' ? '' : 'none';
                });

                const saveOrder = async () => {
                    const rows = [...listEl.querySelectorAll('[data-item-id]')];
                    const order = rows.map(r => r.getAttribute('data-item-id'));
                    const fd = new FormData();
                    fd.append('action','reorder_items_sc'); fd.append('order', JSON.stringify(order));
                    try {
                        const rs = await fetch(apiPath,{method:'POST',body:fd});
                        const js = await rs.json();
                        if (js.status!=='success') throw new Error(js.message||'Error');
                    } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                };

                const render = async () => {
                    if (!listEl) return;
                    listEl.innerHTML = `<div style="font-size:12px;color:#94a3b8;padding:8px">กำลังโหลด...</div>`;
                    try {
                        const res = await fetch(`${apiPath}?action=get_items_sc&room_id=${roomId}&v=${Date.now()}`, { cache: 'no-store' });
                        const json = await res.json();
                        const rows = (json?.status === 'success' && Array.isArray(json.items)) ? json.items : [];
                        if (!rows.length) { listEl.innerHTML = `<div style="font-size:12px;color:#94a3b8;padding:8px">ยังไม่มีรายการตรวจ</div>`; return; }
                        listEl.innerHTML = rows.map(r => `
                            <div data-item-id="${r.id}" draggable="true"
                                style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;cursor:default;transition:box-shadow .12s,border-color .12s;flex-wrap:wrap">
                                <i class="fa fa-grip-vertical" style="color:#cbd5e1;cursor:grab;font-size:13px;flex-shrink:0;padding:2px 4px"></i>
                                <input data-name="${r.id}" type="text" value="${escapeHtml(r.label||'')}"
                                    style="flex:2;min-width:140px;border:1px solid transparent;outline:none;font-size:13px;font-family:inherit;background:transparent;color:#0f172a"
                                    onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='transparent'">
                                <select data-type="${r.id}" style="padding:5px 8px;border-radius:6px;border:1px solid #e2e8f0;font-size:11px;font-family:inherit">${typeOptions(r.input_type)}</select>
                                <input data-threshold="${r.id}" type="number" min="0" value="${r.threshold ?? ''}" placeholder="เกณฑ์(วัน)"
                                    style="width:90px;padding:5px 8px;border-radius:6px;border:1px solid #e2e8f0;font-size:11px;font-family:inherit;display:${r.input_type==='days'?'':'none'}">
                                <button data-save="${r.id}" type="button"
                                    style="padding:5px 10px;border-radius:6px;background:#e0f2fe;color:#0369a1;border:none;font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0">บันทึก</button>
                                <button data-del="${r.id}" type="button"
                                    style="padding:5px 8px;border-radius:6px;background:#fee2e2;color:#b91c1c;border:none;font-size:11px;cursor:pointer;flex-shrink:0" title="ลบ">
                                    <i class="fa fa-trash"></i>
                                </button>
                            </div>`).join('');

                        listEl.querySelectorAll('[data-item-id]').forEach(row => {
                            const id = row.getAttribute('data-item-id');
                            const typeSel = row.querySelector(`[data-type="${id}"]`);
                            const threshInp = row.querySelector(`[data-threshold="${id}"]`);
                            typeSel?.addEventListener('change', () => {
                                threshInp.style.display = typeSel.value === 'days' ? '' : 'none';
                            });

                            row.addEventListener('dragstart', e => { dragSrc = row; row.style.opacity = '.4'; e.dataTransfer.effectAllowed = 'move'; });
                            row.addEventListener('dragend', async () => { row.style.opacity = '1'; dragSrc = null; await saveOrder(); });
                            row.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
                            row.addEventListener('dragenter', e => { e.preventDefault(); if (row !== dragSrc) row.style.borderColor = '#2563eb'; });
                            row.addEventListener('dragleave', () => { row.style.borderColor = '#e2e8f0'; });
                            row.addEventListener('drop', e => {
                                e.preventDefault(); row.style.borderColor = '#e2e8f0';
                                if (!dragSrc || dragSrc === row) return;
                                const allRows = [...listEl.querySelectorAll('[data-item-id]')];
                                const srcIdx = allRows.indexOf(dragSrc);
                                const tgtIdx = allRows.indexOf(row);
                                if (srcIdx < tgtIdx) listEl.insertBefore(dragSrc, row.nextSibling);
                                else listEl.insertBefore(dragSrc, row);
                            });

                            row.querySelector('[data-save]')?.addEventListener('click', async () => {
                                const label = String(row.querySelector(`[data-name="${id}"]`)?.value||'').trim();
                                const type  = typeSel?.value || 'status';
                                const thresh = type === 'days' ? (threshInp?.value || '') : '';
                                if (!label) return;
                                const fd = new FormData();
                                fd.append('action','save_item_sc'); fd.append('id',id); fd.append('room_id',roomId);
                                fd.append('label',label); fd.append('input_type',type); fd.append('threshold',thresh);
                                try {
                                    const rs = await fetch(apiPath,{method:'POST',body:fd});
                                    const js = await rs.json();
                                    if (js.status!=='success') throw new Error(js.message||'Error');
                                    const btn = row.querySelector('[data-save]');
                                    if (btn) { btn.style.background='#d1fae5'; btn.style.color='#065f46'; btn.textContent='✓'; setTimeout(()=>{btn.style.background='#e0f2fe';btn.style.color='#0369a1';btn.textContent='บันทึก';},1200); }
                                } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                            });

                            row.querySelector('[data-del]')?.addEventListener('click', async () => {
                                const label = String(row.querySelector(`[data-name="${id}"]`)?.value||'').trim();
                                const ok = await Swal.fire({title:'ลบรายการตรวจ?',text:`"${label}" — ประวัติเก่ายังเก็บไว้ครบ`,icon:'warning',showCancelButton:true,confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก',confirmButtonColor:'#dc2626'});
                                if (!ok.isConfirmed) return;
                                const fd = new FormData();
                                fd.append('action','delete_item_sc'); fd.append('id',id);
                                try {
                                    const rs = await fetch(apiPath,{method:'POST',body:fd});
                                    const js = await rs.json();
                                    if (js.status!=='success') throw new Error(js.message||'Error');
                                    await render(); Toast.fire({icon:'success',title:'ลบแล้ว'});
                                    await loadAllData(); renderContent();
                                } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                            });
                        });
                    } catch(e) { listEl.innerHTML = `<div style="font-size:12px;color:#ef4444;padding:8px">${escapeHtml(e.message)}</div>`; }
                };

                const doAdd = async () => {
                    const label = String(newLabelEl?.value||'').trim();
                    const type  = newTypeEl?.value || 'status';
                    const thresh = type === 'days' ? (newThreshEl?.value || '') : '';
                    if (!label) { newLabelEl?.focus(); return; }
                    const fd = new FormData();
                    fd.append('action','save_item_sc'); fd.append('room_id',roomId);
                    fd.append('label',label); fd.append('input_type',type); fd.append('threshold',thresh);
                    try {
                        const res = await fetch(apiPath,{method:'POST',body:fd});
                        const json = await res.json();
                        if (json.status!=='success') throw new Error(json.message||'Error');
                        if (newLabelEl) newLabelEl.value='';
                        if (newThreshEl) newThreshEl.value='';
                        await render();
                        await loadAllData(); renderContent();
                        Toast.fire({icon:'success',title:'เพิ่มรายการแล้ว'});
                    } catch(e) { Toast.fire({icon:'error',title:e.message}); }
                };
                addBtn?.addEventListener('click', doAdd);
                newLabelEl?.addEventListener('keydown', e => { if (e.key==='Enter') doAdd(); });

                await render();
            }
        });
    }

    // Build mm-based label HTML for print (each size has its own proportions)
    function buildLabelPrint(size, qrSrc, d) {
        const { safeId, safeName, dept, serial, company, lineId, co } = d;
        const qrImg = `<img src="${qrSrc}" style="width:100%;height:100%;display:block;">`;
        const qrImgInv = `<img src="${qrSrc}" style="width:100%;height:100%;display:block;filter:invert(1);">`;
        const coName = co.label;

        // cfg: w/h in mm, hdrH/ftrH in mm, bodyPadV/H in mm, qrS in mm, fonts in pt
        const cfgs = {
            'label-L':  { w:100, h:50,  hdrH:8,   ftrH:7,   bodyPadV:'3mm',   bodyPadH:'4mm',   qrS:'26mm', idPt:13,  coPt:7,   tagPt:4,  propPt:3.5, namePt:5.5, glPt:3,   gvPt:4.5, ftrPt:3.5, scanPt:3,   full:true  },
            'label-M':  { w:89,  h:36,  hdrH:5.5, ftrH:5,   bodyPadV:'2.5mm', bodyPadH:'3.5mm', qrS:'19mm', idPt:9.5, coPt:5,   tagPt:3,  propPt:2.5, namePt:4,   glPt:2.5, gvPt:3.5, ftrPt:2.5, scanPt:2.5, full:true  },
            'label-S':  { w:62,  h:29,  hdrH:4.5, ftrH:4.5, bodyPadV:'2mm',   bodyPadH:'2.5mm', qrS:'15mm', idPt:7.5, coPt:4,   tagPt:2,  propPt:2,   namePt:3.5, glPt:2,   gvPt:3,   ftrPt:2,   scanPt:2,   full:false },
            'label-XS': { w:38,  h:19,  hdrH:3,   ftrH:2.5, bodyPadV:'1.5mm', bodyPadH:'2mm',   qrS:'10mm', idPt:5.5, coPt:2.5, tagPt:1.5,propPt:0,   namePt:0,   glPt:0,   gvPt:2.5, ftrPt:0,   scanPt:0,   xs:true    },
        };
        const c = cfgs[size];
        if (!c) return null;

        // Adaptive ID font: shrink if ID is too long for available space
        // Available info-column width per size (mm) = label_w - 2×padH - qrS - gap
        const _idAvailMm = { 'label-L':63, 'label-M':60, 'label-S':40, 'label-XS':20 }[size] || 60;
        // monospace char width ≈ pt × 0.353mm × 0.62
        const _idPt = (function() {
            const charMm = c.idPt * 0.353 * 0.62;
            const needed = safeId.length * charMm;
            if (needed <= _idAvailMm) return c.idPt;

    window.printSticker = function() {
        if (!_curLabelPrint) return;
        const size = _selectedLabelSize || 'label-L';

        // Bake QR canvas → dataURL
        const qrDiv = document.getElementById('qrcode');
        let qrSrc = '';
        if (qrDiv) {
            const canvas = qrDiv.querySelector('canvas');
            if (canvas) qrSrc = canvas.toDataURL();
            else { const img = qrDiv.querySelector('img'); if (img) qrSrc = img.src; }
        }

        let pageW, pageH, bodyHtml, winW, winH;

        if (size === 'a4-2x5') {
            // A4 2×5 = 10 L-labels per page, no scaling (2×100mm = 200mm + 5mm margins each side = 210mm ✓)
            const lbl = buildLabelPrint('label-L', qrSrc, _curLabelPrint);
            const cells = Array(10).fill(`<div>${lbl}</div>`).join('');
            pageW='210mm'; pageH='297mm'; winW=900; winH=1100;
            bodyHtml = `<div style="display:grid;grid-template-columns:100mm 100mm;gap:0;padding:5mm;">${cells}</div>`;
        } else if (size === 'a4-3x7') {
            // A4 3×7 = 21 S-labels (62mm each), 3×62+2×6+2×6=210mm ✓
            const lbl = buildLabelPrint('label-S', qrSrc, _curLabelPrint);
            const cells = Array(21).fill(`<div>${lbl}</div>`).join('');
            pageW='210mm'; pageH='297mm'; winW=900; winH=1100;
            bodyHtml = `<div style="display:grid;grid-template-columns:62mm 62mm 62mm;gap:6mm;padding:6mm;">${cells}</div>`;
        } else {
            // Single label — mm-sized HTML, exact @page
            const lbl = buildLabelPrint(size, qrSrc, _curLabelPrint);
            if (!lbl) return;
            const sm = {
                'label-L':  { w:'100mm', h:'50mm',  winW:460, winH:255 },
                'label-M':  { w:'89mm',  h:'36mm',  winW:420, winH:195 },
                'label-S':  { w:'62mm',  h:'29mm',  winW:355, winH:165 },
                'label-XS': { w:'38mm',  h:'19mm',  winW:280, winH:125 },
            }[size] || { w:'100mm', h:'50mm', winW:460, winH:255 };
            pageW=sm.w; pageH=sm.h; winW=sm.winW; winH=sm.winH;
            bodyHtml = lbl;
        }

        const win = window.open('', '', `width=${winW},height=${winH}`);
        win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Asset Tag</title>
        <style>
            *{box-sizing:border-box;margin:0;padding:0}
            body{background:#fff;}
            @media print{@page{size:${pageW} ${pageH};margin:0} body{margin:0;padding:0}}
        </style></head><body>${bodyHtml}</body></html>`);
        win.document.close();
        setTimeout(() => { win.print(); }, 800);
    }

    window.saveRepairTicket = function() {
        const assetId  = String(_repairItem['ID อุปกรณ์'] || _repairItem.asset_id || '').trim();
        const problem  = gid('repair-problem').value.trim();
        const solution = gid('repair-solution').value.trim();
        const status   = gid('repair-status').value;
        const servicedBy = gid('repair-serviced-by').value.trim() || 'IT';
        const dateStr  = gid('repair-date').value;

        if (!assetId || !problem) {
            Swal.fire({ icon:'warning', title:'กรุณากรอกข้อมูล', text:'ต้องระบุ Asset ID และอาการเสีย', confirmButtonColor:'#dc2626' });
            return;
        }

        const saveBtn = gid('repair-save-btn');
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> กำลังบันทึก...';

        const fd = new FormData();
        fd.append('asset_id',   assetId);
        fd.append('problem',    problem);
        fd.append('solution',   solution);
        fd.append('status',     status);
        fd.append('servicedBy', servicedBy);
        fd.append('date',       dateStr);

        fetch(apiPath + '?action=create_repair', { method:'POST', body:fd })
            .then(r => r.json())
            .then(res => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-save" style="margin-right:5px"></i>บันทึก Ticket';
                if (res.status === 'success') {
                    const jobNo = res.job_no || ('RPR-' + res.id);
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกเรียบร้อย',
                        html: `<div style="font-size:14px">เลขงาน: <b style="font-family:monospace;color:#dc2626">${escapeHtml(jobNo)}</b></div>`,
                        confirmButtonColor: '#dc2626',
                        confirmButtonText: 'ตกลง',
                        showDenyButton: true,
                        denyButtonText: 'พิมพ์ใบซ่อม',
                        denyButtonColor: '#2563eb',
                    }).then(r2 => {
                        if (r2.isDenied) {
                            _repairLastJobNo = jobNo;
                            printRepairTicket(jobNo);
                        }
                    });
                    closeRepairModal();
                } else {
                    Swal.fire({ icon:'error', title:'เกิดข้อผิดพลาด', text: res.message || 'ไม่สามารถบันทึกได้', confirmButtonColor:'#dc2626' });
                }
            })
            .catch(err => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-save" style="margin-right:5px"></i>บันทึก Ticket';
                Swal.fire({ icon:'error', title:'Network Error', text: String(err), confirmButtonColor:'#dc2626' });
            });

        let items=data.employees.filter(e=>e.employment_status==='active');
        if (co) items=items.filter(e=>e.assignments&&e.assignments.some(a=>a.company===co));
        items.sort((a,b)=>{
            const assignA=a.assignments.find(x=>x.is_primary)||a.assignments[0]||{};
            const assignB=b.assignments.find(x=>x.is_primary)||b.assignments[0]||{};
            if ((assignA.company||'')!==( assignB.company||'')) return (assignA.company||'').localeCompare(assignB.company||'');
            if ((assignA.department||'')!==(assignB.department||'')) return (assignA.department||'').localeCompare(assignB.department||'');
            return (a.name||'').localeCompare(b.name||'');
        });
        const rows=items.map(e=>{
            const pa=(e.assignments&&e.assignments.find(a=>a.is_primary==1))||(e.assignments&&e.assignments[0])||{};
            return `<tr><td>${escapeHtml(e.id)}</td><td>${escapeHtml(e.name)}</td><td>${escapeHtml(e.name_th||'')}</td><td>${escapeHtml(e.position||'-')}</td><td>${escapeHtml(pa.department||'-')}</td><td>${escapeHtml(pa.company||'-')}</td></tr>`;
        }).join('');
        const win=window.open('','','width=900,height=700');
        win.document.write(`<html><head><title>Employee Directory</title><style>body{font-family:Arial,sans-serif;padding:20px;}table{width:100%;border-collapse:collapse;font-size:12px;}th,td{border:1px solid #ccc;padding:6px 10px;text-align:left;}th{background:#f1f5f9;font-weight:700;}tr:nth-child(even){background:#f8fafc;}</style></head><body class="ptc-unified-v1"><h2 style="margin-bottom:16px">Employee Directory${co?' — '+co:''}</h2><table><thead><tr><th>ID</th><th>Name (EN)</th><th>Name (TH)</th><th>Position</th><th>Department</th><th>Company</th></tr></thead><tbody>${rows}</tbody></table></body></html>`);
        win.document.close(); setTimeout(()=>win.print(),400);
    }

</script>
