<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการวันหยุดบริษัท</title>
    <link rel="icon" href="favicon.ico">
    <script src="js/favicon-version.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Kanit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/enterprise-theme.css">
<link rel="stylesheet" href="css/ptc-unified-global.css?v=20260529">
<script>(function(){const t=localStorage.getItem('theme')||'light';if(t==='dark')document.documentElement.classList.add('dark','dark-theme');})();</script>
<style>
html,body{overflow:auto!important;height:auto!important;}
body{font-family:'Inter','Kanit',sans-serif;background:#f1f5f9;color:#334155;padding-bottom:40px;}

.page-wrap{max-width:900px;margin:0 auto;padding:16px;}

.page-header{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.page-header h1{font-size:1.1rem;font-weight:700;color:#0f172a;margin:0;}
.page-header p{font-size:.8rem;color:#64748b;margin:0;}
.header-icon{width:40px;height:40px;background:#fff7ed;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#ea580c;font-size:1.1rem;border:1px solid #fed7aa;flex-shrink:0;}

.toolbar-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.year-nav{display:flex;align-items:center;gap:4px;}
.year-nav button{width:28px;height:28px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;font-size:11px;}
.year-nav button:hover{background:#f1f5f9;}
.year-label{font-size:14px;font-weight:700;color:#0f172a;min-width:60px;text-align:center;}
html.dark-theme .year-label{color:#f1f5f9;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.grid-2{grid-template-columns:1fr;}}

.card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:16px;}
html.dark-theme .card{background:#1e293b;border-color:#334155;}
.card-title{font-size:.8rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px;display:flex;align-items:center;gap:6px;}

/* Add form */
.add-form{display:flex;flex-direction:column;gap:8px;}
.form-row{display:flex;flex-direction:column;gap:3px;}
.form-row label{font-size:.7rem;font-weight:600;color:#64748b;}
.form-row input, .form-row select{height:34px;padding:0 10px;border:1px solid #e2e8f0;border-radius:6px;font-size:.8rem;font-family:inherit;background:#fff;color:#0f172a;outline:none;width:100%;box-sizing:border-box;}
.form-row input:focus, .form-row select:focus{border-color:#2563eb;}
html.dark-theme .form-row input, html.dark-theme .form-row select{background:#0f172a;border-color:#334155;color:#e2e8f0;}

/* Preset buttons */
.preset-section{margin-top:4px;}
.preset-title{font-size:.65rem;font-weight:600;color:#94a3b8;margin-bottom:6px;}
.preset-grid{display:flex;flex-wrap:wrap;gap:4px;}
.preset-btn{font-size:.65rem;padding:3px 8px;border-radius:4px;border:1px solid #e2e8f0;background:#f8fafc;color:#475569;cursor:pointer;font-family:inherit;}
.preset-btn:hover{background:#eff6ff;border-color:#bfdbfe;color:#2563eb;}

/* Holiday list */
.hday-list{display:flex;flex-direction:column;gap:4px;max-height:420px;overflow-y:auto;}
.hday-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;border:1px solid #e2e8f0;background:#fafafa;font-size:.8rem;}
html.dark-theme .hday-item{background:#0f172a;border-color:#1e293b;}
.hday-item:hover{background:#f1f5f9;}
.hday-date{font-weight:700;color:#0f172a;min-width:80px;font-size:.75rem;}
html.dark-theme .hday-date{color:#e2e8f0;}
.hday-dow{font-size:.65rem;padding:1px 5px;border-radius:3px;font-weight:600;}
.hday-dow.we{background:#fee2e2;color:#dc2626;}
.hday-dow.wd{background:#e0f2fe;color:#0369a1;}
.hday-name{flex:1;color:#334155;}
html.dark-theme .hday-name{color:#cbd5e1;}
.hday-del{width:22px;height:22px;border-radius:4px;border:none;background:transparent;color:#94a3b8;cursor:pointer;font-size:.7rem;display:flex;align-items:center;justify-content:center;}
.hday-del:hover{background:#fee2e2;color:#dc2626;}

.empty-state{text-align:center;padding:30px;color:#94a3b8;font-size:.8rem;}

/* Month summary */
.month-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.month-chip{font-size:.65rem;padding:2px 8px;border-radius:10px;border:1px solid #e2e8f0;color:#64748b;cursor:pointer;}
.month-chip.has-holiday{background:#fff7ed;border-color:#fed7aa;color:#ea580c;font-weight:600;}
.month-chip:hover{background:#f1f5f9;}
</style>
</head>
<body>
<!-- nav -->
<div id="nav-placeholder"></div>
<script src="js/nav-loader.js"></script>

<div class="page-wrap">
    <div class="page-header">
        <div class="header-icon"><i class="fa fa-calendar-xmark"></i></div>
        <div>
            <h1>จัดการวันหยุดบริษัท / Company Holidays</h1>
            <p>กำหนดวันหยุดที่ระบบ Server Check จะข้ามอัตโนมัติ (ไม่ต้องตรวจ)</p>
        </div>
        <div style="margin-left:auto;display:flex;gap:8px;">
            <a href="server_check.html" class="ptc-btn ptc-btn-secondary ptc-btn-sm">
                <i class="fa fa-arrow-left"></i> กลับ Server Check
            </a>
        </div>
    </div>

    <div class="toolbar-row">
        <div class="year-nav">
            <button onclick="changeYear(-1)"><i class="fa fa-chevron-left"></i></button>
            <span class="year-label" id="year-label">2026</span>
            <button onclick="changeYear(1)"><i class="fa fa-chevron-right"></i></button>
        </div>
        <span id="total-badge" style="font-size:.75rem;color:#64748b;"></span>
    </div>

    <div class="grid-2">
        <!-- Add form -->
        <div class="card">
            <div class="card-title"><i class="fa fa-plus"></i> เพิ่มวันหยุด</div>
            <div class="add-form">
                <div class="form-row">
                    <label>วันที่</label>
                    <input type="date" id="inp-date">
                </div>
                <div class="form-row">
                    <label>ชื่อวันหยุด</label>
                    <input type="text" id="inp-name" placeholder="เช่น วันสงกรานต์" maxlength="200">
                </div>
                <button class="ptc-btn ptc-btn-primary" style="margin-top:4px" onclick="addHoliday()">
                    <i class="fa fa-plus"></i> เพิ่มวันหยุด
                </button>

                <div class="preset-section">
                    <div class="preset-title">วันหยุดราชการไทย — คลิกเพื่อเติมอัตโนมัติ</div>
                    <div class="preset-grid" id="preset-grid"></div>
                </div>
            </div>
        </div>

        <!-- Holiday list -->
        <div class="card">
            <div class="card-title"><i class="fa fa-list"></i> วันหยุดทั้งหมด <span id="year-label2"></span></div>
            <div class="month-chips" id="month-chips"></div>
            <div style="height:8px;"></div>
            <div class="hday-list" id="hday-list">
                <div class="empty-state"><i class="fa fa-spinner fa-spin"></i></div>
            </div>
        </div>
    </div>
</div>

<script>
const API = 'api.php';
const thMonths = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDows   = ['อา','จ','อ','พ','พฤ','ศ','ส'];

let currentYear = new Date().getFullYear();
let holidays = [];

// Thai national holidays presets (fixed dates only, not lunar)
const PRESETS = [
    {date:'01-01', name:'วันขึ้นปีใหม่'},
    {date:'04-06', name:'วันจักรี'},
    {date:'04-13', name:'วันสงกรานต์'},
    {date:'04-14', name:'วันสงกรานต์'},
    {date:'04-15', name:'วันสงกรานต์'},
    {date:'05-01', name:'วันแรงงานแห่งชาติ'},
    {date:'05-04', name:'วันฉัตรมงคล'},
    {date:'06-03', name:'วันเฉลิมพระชนมพรรษา ราชินี'},
    {date:'07-28', name:'วันเฉลิมพระชนมพรรษา ร.10'},
    {date:'08-12', name:'วันแม่แห่งชาติ'},
    {date:'10-13', name:'วันคล้ายวันสวรรคต ร.9'},
    {date:'10-23', name:'วันปิยมหาราช'},
    {date:'12-05', name:'วันพ่อแห่งชาติ'},
    {date:'12-10', name:'วันรัฐธรรมนูญ'},
    {date:'12-31', name:'วันสิ้นปี'},
];

function changeYear(d) {
    currentYear += d;
    document.getElementById('year-label').textContent = currentYear;
    document.getElementById('year-label2').textContent = currentYear;
    load();
    buildPresets();
}

async function load() {
    const r = await fetch(`${API}?action=get_holidays&year=${currentYear}`);
    const d = await r.json();
    holidays = d.holidays || [];
    renderList();
    renderMonthChips();
    document.getElementById('total-badge').textContent = `${holidays.length} วันหยุด`;
}

function renderList(filterMonth = 0) {
    const list = document.getElementById('hday-list');
    const filtered = filterMonth ? holidays.filter(h => parseInt(h.holiday_date.split('-')[1]) === filterMonth) : holidays;
    if (!filtered.length) {
        list.innerHTML = `<div class="empty-state"><i class="fa fa-calendar-xmark"></i><br>ไม่มีวันหยุดในปี ${currentYear}</div>`;
        return;
    }
    list.innerHTML = filtered.map(h => {
        const dt   = new Date(h.holiday_date + 'T00:00:00');
        const dow  = dt.getDay();
        const we   = dow === 0 || dow === 6;
        const d    = String(dt.getDate()).padStart(2,'0');
        const m    = thMonths[dt.getMonth()+1];
        const y    = dt.getFullYear() + 543;
        return `<div class="hday-item">
            <span class="hday-date">${d} ${m} ${y}</span>
            <span class="hday-dow ${we?'we':'wd'}">${thDows[dow]}</span>
            <span class="hday-name">${esc(h.name)}</span>
            <button class="hday-del" onclick="delHoliday(${h.id})" title="ลบ"><i class="fa fa-trash"></i></button>
        </div>`;
    }).join('');
}

function renderMonthChips() {
    const hdayMonths = new Set(holidays.map(h => parseInt(h.holiday_date.split('-')[1])));
    let html = '<span style="font-size:.65rem;color:#94a3b8;margin-right:4px;">กรอง:</span>';
    html += `<span class="month-chip" onclick="renderList(0)">ทั้งปี</span>`;
    for (let m = 1; m <= 12; m++) {
        html += `<span class="month-chip${hdayMonths.has(m)?' has-holiday':''}" onclick="renderList(${m})">${thMonths[m]}</span>`;
    }
    document.getElementById('month-chips').innerHTML = html;
}

function buildPresets() {
    const existing = new Set(holidays.map(h => h.holiday_date));
    const grid = document.getElementById('preset-grid');
    grid.innerHTML = PRESETS.map(p => {
        const fullDate = `${currentYear}-${p.date}`;
        const added = existing.has(fullDate);
        return `<button class="preset-btn" onclick="fillPreset('${fullDate}','${p.name.replace(/'/g,"\\'")}')">
            ${added ? '<i class="fa fa-check" style="color:#059669"></i> ' : ''}${p.name.split('วัน')[1] || p.name}
        </button>`;
    }).join('');
}

function fillPreset(date, name) {
    document.getElementById('inp-date').value = date;
    document.getElementById('inp-name').value = name;
    document.getElementById('inp-name').focus();
}

async function addHoliday() {
    const date = document.getElementById('inp-date').value;
    const name = document.getElementById('inp-name').value.trim();
    if (!date || !name) { alert('กรุณากรอกวันที่และชื่อวันหยุด'); return; }

    const fd = new FormData();
    fd.append('action', 'save_holiday');
    fd.append('holiday_date', date);
    fd.append('name', name);
    const r = await fetch(API, {method:'POST', body: fd});
    const d = await r.json();
    if (d.status === 'success') {
        document.getElementById('inp-date').value = '';
        document.getElementById('inp-name').value = '';
        await load();
        buildPresets();
    } else {
        alert('เกิดข้อผิดพลาด: ' + (d.message || ''));
    }
}

async function delHoliday(id) {
    if (!confirm('ลบวันหยุดนี้?')) return;
    const fd = new FormData();
    fd.append('action', 'delete_holiday');
    fd.append('id', id);
    await fetch(API, {method:'POST', body: fd});
    await load();
    buildPresets();
}

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Init
fetch('api.php?action=check_session').then(r=>r.json()).then(s=>{
    if (!s.loggedin) { window.location.href='login.html?returnUrl=holidays.html'; return; }
    const isIT = s.role === 'admin' || s.primary_department === 'IT';
    if (!isIT) {
        document.querySelector('.page-wrap').innerHTML = `
            <div style="text-align:center;padding:80px 20px;color:#64748b;">
                <i class="fa fa-lock" style="font-size:3rem;color:#e2e8f0;margin-bottom:16px;display:block"></i>
                <div style="font-size:1rem;font-weight:700;color:#0f172a;margin-bottom:8px">ไม่มีสิทธิ์เข้าถึง</div>
                <div style="font-size:.85rem;">หน้านี้สำหรับแผนก IT เท่านั้น</div>
                <a href="server_check.html" style="display:inline-block;margin-top:20px;padding:8px 20px;background:#2563eb;color:#fff;border-radius:7px;text-decoration:none;font-size:.85rem;">
                    <i class="fa fa-arrow-left"></i> กลับ
                </a>
            </div>`;
    }
});

document.getElementById('year-label').textContent  = currentYear;
document.getElementById('year-label2').textContent = currentYear;
document.getElementById('inp-date').value = `${currentYear}-01-01`;
load();
buildPresets();

// Enter key on name field
document.getElementById('inp-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') addHoliday();
});
</script>
</body>
</html>
