<html lang="th">
<head>
    <meta charset="UTF-8">

    <script>(function(){const t=localStorage.getItem('theme')||'light';if(t==='dark')document.documentElement.classList.add('dark','dark-theme');})();</script>
<style>
/* ════ จองรถ — ดูรถว่างทั้งวัน + ส่งคำขอ (ทุกใบรออนุมัติ) / การจองของฉัน / ผู้ดูแลรถ · แบบเดียวกับหน้าจองห้องประชุม ════ */
/* enterprise-theme ล็อกการเลื่อนทั้งหน้าบนจอกว้าง (ไว้ใช้กับหน้าที่มีเมนูซ้าย) — หน้านี้เลื่อนทั้งหน้าตามปกติ */
html { overflow:auto !important; height:auto !important; } body { overflow:visible !important; height:auto !important; }
body { background:var(--ptc-bg); color:var(--ptc-text); margin:0; }
.rt { display:flex; border:1px solid var(--ptc-border); border-radius:8px; overflow:hidden; margin-left:auto; }
.rt button { height:34px; padding:0 14px; border:0; background:var(--ptc-surface); color:var(--ptc-text-2); font:inherit; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.rt button.on { background:var(--ptc-text); color:var(--ptc-surface); }
.rt .cnt { min-width:18px; height:18px; border-radius:9px; background:#0284c7; color:#fff; font-size:11px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
.wrap { max-width:1400px; margin:0 auto; padding:18px 16px 40px; }
.card { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; }
.btn { height:34px; padding:0 12px; border-radius:8px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-weight:700; font-size:12.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; text-decoration:none; }
.btn:hover { border-color:var(--ptc-primary); }
.btn.ok { background:#16a34a; border-color:#16a34a; color:#fff; } .btn.lg { height:42px; font-size:14px; }
.btn.sm { height:28px; padding:0 9px; font-size:12px; } .btn.danger { color:#dc2626; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.chip { padding:5px 11px; border-radius:99px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; display:inline-flex; gap:5px; align-items:center; }
.chip.on { border-color:#0284c7; background:color-mix(in srgb, #0284c7 10%, transparent); color:#0369a1; }
html.dark .chip.on { color:#7dd3fc; }
.pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; color:var(--c); background:color-mix(in srgb, var(--c) 13%, transparent); }
.muted { color:var(--ptc-text-muted); }
.empty { padding:34px 14px; text-align:center; color:var(--ptc-text-muted); font-size:13px; }
.g2 { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; align-items:start; }
/* ตารางรถ */
.tb { display:flex; gap:8px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--ptc-border); flex-wrap:wrap; }
.tb .dte { font-size:14px; font-weight:800; min-width:170px; }
.tb select, .tb input[type=date] { height:34px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 8px; font:inherit; font-size:13px; background:var(--ptc-surface); color:var(--ptc-text); }
.tb .flt { display:flex; gap:6px; align-items:center; font-size:12.5px; color:var(--ptc-text-muted); }
.tl { overflow-x:auto; }
.tl-in { min-width:900px; }
.tl-row { display:grid; grid-template-columns:200px minmax(0,1fr); border-bottom:1px solid var(--ptc-border); }
.tl-row:last-child { border-bottom:0; }
.tl-rm { padding:7px 10px; font-size:12.5px; border-right:1px solid var(--ptc-border); cursor:pointer; }
.tl-rm b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tl-rm small { color:var(--ptc-text-muted); font-size:11px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tl-rm.sel { background:color-mix(in srgb, #0284c7 8%, transparent); box-shadow:inset 3px 0 0 #0284c7; }
.lane { position:relative; height:50px; cursor:copy; background-image:repeating-linear-gradient(90deg, var(--ptc-border) 0, var(--ptc-border) 1px, transparent 1px, transparent calc(100% / var(--span, 14))); }
.hd .lane { height:24px; cursor:default; background:none; }
.hd .lane span { position:absolute; top:5px; font-size:11px; color:var(--ptc-text-muted); transform:translateX(-50%); }
.ev { position:absolute; top:6px; bottom:6px; border-radius:7px; padding:3px 7px; font-size:11px; line-height:1.3; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:#0c4a6e; background:#e0f2fe; border:1px solid #7dd3fc; cursor:pointer; }
.ev small { display:block; opacity:.75; overflow:hidden; text-overflow:ellipsis; }
.ev.me { background:#dbeafe; border-color:#93c5fd; color:#1e3a8a; }
.ev.pick { background:#fde68a; border-color:#f59e0b; color:#78350f; cursor:default; }
.ev.wait { border-style:dashed; background:repeating-linear-gradient(135deg, #fef3c7 0 6px, #fffbeb 6px 12px); border-color:#f59e0b; color:#78350f; }
.ev.key { background:var(--ptc-surface-2); border-color:var(--ptc-border); color:var(--ptc-text-2); }
html.dark .ev { background:rgba(2,132,199,.28); border-color:rgba(125,211,252,.5); color:#e0f2fe; }
html.dark .ev.me { background:rgba(37,99,235,.3); border-color:rgba(147,197,253,.5); color:#dbeafe; }
html.dark .ev.pick { background:rgba(245,158,11,.3); border-color:#f59e0b; color:#fde68a; }
html.dark .ev.wait { background:repeating-linear-gradient(135deg, rgba(245,158,11,.25) 0 6px, rgba(245,158,11,.12) 6px 12px); color:#fde68a; }
html.dark .ev.key { background:var(--ptc-surface-2); border-color:var(--ptc-border); color:var(--ptc-text-2); }
.now { position:absolute; top:0; bottom:0; width:2px; background:#dc2626; pointer-events:none; }
.legend { padding:8px 14px; font-size:11.5px; color:var(--ptc-text-muted); display:flex; gap:12px; flex-wrap:wrap; border-top:1px solid var(--ptc-border); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:3px; vertical-align:-1px; margin-right:3px; }
/* ฟอร์ม */
.form { padding:14px 16px; position:sticky; top:74px; }
.f { margin-top:11px; } .f label { display:block; font-size:12px; font-weight:700; color:var(--ptc-text-2); margin-bottom:5px; }
.f input:not([type=checkbox]), .f select, .f textarea { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:8px 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.xs { display:flex; gap:6px; flex-wrap:wrap; }
.note { margin-top:10px; font-size:12.5px; font-weight:600; display:flex; gap:6px; } .note.ok { color:#16a34a; } .note.bad { color:#dc2626; } .note.info { color:var(--ptc-text-muted); font-weight:500; }
/* รายการ */
.row { padding:12px 16px; border-bottom:1px solid var(--ptc-border); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.row:last-child { border-bottom:0; }
.dt { width:60px; text-align:center; border:1px solid var(--ptc-border); border-radius:9px; padding:5px 0; flex-shrink:0; }
.dt b { display:block; font-size:17px; line-height:1.15; } .dt span { font-size:11px; color:var(--ptc-text-muted); }
.row .tx { flex:1; min-width:220px; } .row .tx b { font-size:14px; } .row .tx div { font-size:12.5px; color:var(--ptc-text-muted); overflow-wrap:anywhere; }
.row.off { opacity:.55; }
.acts { display:flex; gap:6px; flex-wrap:wrap; }
.pst { margin-top:6px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
.row .tx .pst.wait { color:#b45309; } .row .tx .pst.ok { color:#15803d; } .row .tx .pst.bad { color:#dc2626; } .row .tx .pst.key { color:#0369a1; } .pst small { font-weight:500; color:var(--ptc-text-muted); }
html.dark .row .tx .pst.wait { color:#fbbf24; } html.dark .row .tx .pst.ok { color:#86efac; } html.dark .row .tx .pst.bad { color:#fca5a5; } html.dark .row .tx .pst.key { color:#7dd3fc; }
.tbl { width:100%; border-collapse:collapse; font-size:13px; }
.tbl th { text-align:left; font-size:11.5px; color:var(--ptc-text-muted); font-weight:700; padding:9px 12px; border-bottom:1px solid var(--ptc-border); white-space:nowrap; }
.tbl td { padding:9px 12px; border-bottom:1px solid var(--ptc-border); } .tbl .r { text-align:right; }
.bar { height:7px; border-radius:4px; background:var(--ptc-border); overflow:hidden; width:120px; } .bar i { display:block; height:100%; background:#0284c7; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:12px; } .kpis div { padding:12px 14px; } .kpis b { display:block; font-size:22px; } .kpis span { font-size:12px; color:var(--ptc-text-muted); }
.fx { text-align:left; display:grid; gap:10px; }
.fx label { font-size:12.5px; font-weight:700; color:var(--ptc-text-2); display:block; margin-bottom:4px; }
.fx input:not([type=checkbox]), .fx select, .fx textarea { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:8px 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; }
.fx .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.qa { display:grid; grid-template-columns:96px 1fr; gap:5px 10px; font-size:13px; text-align:left; } .qa span { color:var(--ptc-text-muted); }
@media (max-width:1000px) { .g2 { grid-template-columns:minmax(0,1fr); } .form { position:static; } }
@media (max-width:640px) {
  .wrap { padding:12px 10px 30px; }
  .rt { position:fixed; top:var(--rt-nav-h, 56px); left:0; right:0; z-index:90; border-radius:0; border-width:0 0 1px; margin:0; }
  .rt button { flex:1; justify-content:center; height:44px; padding:0 6px; }
  .wrap { padding-top:calc(44px + 12px) !important; }
  .ptc-nav-sub { display:none; }
  .tl-row { grid-template-columns:120px minmax(0,1fr); } .tl-in { min-width:760px; }
}
</style>
</head>
<body>
<nav class="ptc-nav">
    <a href="index.html" class="nav-back" title="กลับหน้าแรก"><i class="fa fa-arrow-left"></i></a>
    <div class="ptc-nav-brand"><div class="ptc-nav-icon" style="background:#0284c7"><i class="fa fa-car-side"></i></div>
        <div><div class="ptc-nav-title">จองรถ</div><div class="ptc-nav-sub">ดูรถว่าง · ส่งคำขอ รอผู้ดูแลรถอนุมัติ</div></div></div>
    <div class="rt"><button id="t-day" onclick="tab('day')"><i class="fa fa-table-cells"></i>ดูรถว่าง</button><button id="t-mine" onclick="tab('mine')"><i class="fa fa-user-clock"></i>การจองของฉัน<span class="cnt" id="mine-cnt" style="display:none"></span></button><button id="t-keep" onclick="tab('keep')" style="display:none"><i class="fa fa-key"></i>ผู้ดูแลรถ<span class="cnt" id="keep-cnt" style="display:none;background:#d97706"></span></button></div>
    <a href="help.html#cars" class="nav-back" title="วิธีใช้" aria-label="วิธีใช้" style="margin-left:6px"><i class="fa fa-circle-question"></i></a>
    <div id="nav-user-area"></div>
</nav>
<main class="wrap"><section id="v-day"></section><section id="v-mine" style="display:none"></section><section id="v-keep" style="display:none"></section></main>

<script>
const gid = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const toD = s => new Date(String(s).replace(' ', 'T'));
const hm = s => String(s).slice(11, 16);
const thDay = s => new Date(s + 'T00:00:00').toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
const thD = s => toD(s).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
// ข้อมูลเดิม: ออกรถเกือบทั้งหมด 07–14 น. กลับไม่เกิน 17–18 น. → ตาราง 06–20
const H0 = 6, H1 = 20, SPAN = H1 - H0;

let PEOPLE = [], S = {}, D = null, date = ymd(new Date()), coF = null, typeF = '', mine = [], sending = false;
const CO_C = { PTA: '#059669', PT4: '#dc2626', PTE: '#2563eb' };
const coTag = c => c ? `<span class="pill" style="--c:${CO_C[c] || '#64748b'};font-size:10px;padding:1px 6px">${esc(c)}</span>` : '';
// วันที่ออก = วันที่ดูอยู่ในตาราง (date) · end_date ว่าง = กลับวันเดียวกัน
let BF = { car_id: 0, rider: '', purpose: '', destination: '', start: '08:00', end: '12:00', end_date: '', passengers: '', names: '', need_driver: false, contact: '', note: '' };
// รุ่นที่มียี่ห้ออยู่แล้ว (ข้อมูลเดิม เช่น "BMW XM50e") ไม่ต้องใส่ยี่ห้อซ้ำ
const carName = c => c.brand && c.name && String(c.name).toLowerCase().includes(String(c.brand).toLowerCase()) ? c.name : [c.brand, c.name].filter(Boolean).join(' ');
const carLine = c => [c.car_type, c.seats ? c.seats + ' ที่นั่ง' : ''].filter(Boolean).join(' · ');

async function api(p) { const j = await (await fetch('api.php?' + new URLSearchParams(p), { cache: 'no-store' })).json(); if (j.status !== 'success') throw new Error(j.message || 'โหลดไม่สำเร็จ'); return j; }
async function post(o) { const fd = new FormData(); Object.entries(o).forEach(([k, v]) => fd.append(k, v ?? '')); const j = await (await fetch('api.php', { method: 'POST', body: fd })).json(); if (j.status !== 'success') throw new Error(j.message || 'ไม่สำเร็จ'); return j; }

// ── ดูรถว่าง ──
const pos = (s, e) => {   // ช่วงเวลา → ตำแหน่งในแถบของวันที่ดูอยู่ (ตัดส่วนที่อยู่นอก 06–20 ออก)
    const d0 = toD(date + ' 00:00:00').getTime(), a = (toD(s) - d0) / 36e5, b = (toD(e) - d0) / 36e5;
    const l = Math.max(a, H0), r = Math.min(b, H1);
    return r <= l ? null : { left: (l - H0) / SPAN * 100, width: (r - l) / SPAN * 100 };
};
function formRange() { return [`${date} ${BF.start}:00`, `${BF.end_date && BF.end_date > date ? BF.end_date : date} ${BF.end}:00`]; }
function clashOf() { const [s, e] = formRange(); return D.bookings.find(b => b.car_id === BF.car_id && b.start_at < e && b.end_at > s); }
function cars() { return D.cars.filter(c => (!coF || c.company === coF) && (!typeF || c.car_type === typeF)); }
const evCls = b => b.status === 'pending' ? 'wait' : b.status === 'returning' ? 'key' : b.mine ? 'me' : '';
const evTag = b => b.status === 'pending' ? '🕓 ' : b.status === 'returning' ? '🔑 ' : '';
function renderDay() {
    const now = new Date(), isToday = date === ymd(now), nowX = ((now.getHours() + now.getMinutes() / 60) - H0) / SPAN * 100;
    const cs = cars(), car = D.cars.find(c => c.id === BF.car_id);
    const [fs, fe] = formRange(), c = car ? clashOf() : null, bad = fe <= fs;
    const lanes = cs.map(r => {
        const evs = D.bookings.filter(b => b.car_id === r.id).map(b => { const p = pos(b.start_at, b.end_at); return p ? `<div class="ev ${evCls(b)}" style="left:${p.left}%;width:${p.width}%" onclick="event.stopPropagation();showBk(${b.id})" title="${esc(b.purpose)} · ${hm(b.start_at)}–${hm(b.end_at)}">${evTag(b)}${esc(b.destination || b.purpose)}<small>${hm(b.start_at)}–${hm(b.end_at)} · ${esc(b.rider_name || b.department || b.booker_name)}</small></div>` : ''; }).join('');
        const pk = car && r.id === BF.car_id && !c && !bad ? (p => p ? `<div class="ev pick" style="left:${p.left}%;width:${p.width}%">ที่คุณเลือก ${BF.start}–${BF.end}</div>` : '')(pos(fs, fe)) : '';
        return `<div class="tl-row"><div class="tl-rm ${r.id === BF.car_id ? 'sel' : ''}" onclick="selCar(${r.id})"><b title="${esc(r.plate)}">${esc(r.plate)}</b><small>${coF ? '' : coTag(r.company) + ' '}${esc([carName(r), carLine(r)].filter(Boolean).join(' · '))}</small></div>
            <div class="lane" onclick="laneClick(event,${r.id})">${evs}${pk}${isToday && nowX > 0 && nowX < 100 ? `<div class="now" style="left:${nowX}%"></div>` : ''}</div></div>`;
    }).join('');
    const hours = Array.from({ length: SPAN - 1 }, (_, i) => `<span style="left:${(i + 1) / SPAN * 100}%">${pad(H0 + i + 1)}</span>`).join('');
    const types = [...new Set(D.cars.map(r => r.car_type).filter(Boolean))].sort();
    const cos = [...new Set(D.cars.map(r => r.company).filter(Boolean))].sort();
    gid('v-day').innerHTML = !D.cars.length ? '<div class="card empty"><i class="fa fa-car"></i><br>ยังไม่มีรถในระบบ — ผู้ดูแลรถเพิ่มได้ที่แท็บ "ผู้ดูแลรถ"</div>' : `
    <div class="g2"><div class="card">
        <div class="tb"><button class="btn" onclick="go(-1)" aria-label="วันก่อน">‹</button><span class="dte">${thDay(date)}</span><button class="btn" onclick="go(1)" aria-label="วันถัดไป">›</button>
            <button class="btn" onclick="date='${ymd(new Date())}';loadDay()">วันนี้</button><input type="date" value="${date}" onchange="date=this.value;loadDay()">
            <span style="flex:1"></span>${cos.length ? `<label class="flt">บริษัท<select onchange="coF=this.value;renderDay()">${[['', 'ทุกบริษัท'], ...cos.map(x => [x, 'รถของ ' + x])].map(([v, t]) => `<option value="${esc(v)}" ${(coF || '') === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>` : ''}
            ${types.length > 1 ? `<label class="flt">ประเภท<select onchange="typeF=this.value;renderDay()">${[['', 'ทุกประเภท'], ...types.map(x => [x, x])].map(([v, t]) => `<option value="${esc(v)}" ${typeF === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>` : ''}</div>
        <div class="tl"><div class="tl-in" style="--span:${SPAN}"><div class="tl-row hd"><div class="tl-rm" style="cursor:default"><small>รถ</small></div><div class="lane">${hours}</div></div>${lanes || '<div class="empty">ไม่มีรถตามที่เลือก</div>'}</div></div>
        <div class="legend"><span><i style="background:#e0f2fe;border:1px solid #7dd3fc"></i>อนุมัติแล้ว</span><span><i style="background:#dbeafe;border:1px solid #93c5fd"></i>ของคุณ</span><span><i style="background:#fef3c7;border:1px dashed #f59e0b"></i>รออนุมัติ</span><span><i style="background:var(--ptc-surface-2);border:1px solid var(--ptc-border)"></i>รอคืนกุญแจ</span><span><i style="background:#fde68a;border:1px solid #f59e0b"></i>ที่เลือก</span><span><i style="background:#dc2626;width:2px"></i>ตอนนี้</span><span>กดช่องว่าง = เลือกรถและเวลา · กดแถบ = ดูว่าใครจอง</span></div>
    </div>

function stOf(b) {

            <div class="two"><div><label>ยี่ห้อ</label><input id="c-b" value="${esc(c.brand || '')}" placeholder="เช่น Toyota"></div><div><label>รุ่น</label><input id="c-n" value="${esc(c.name || '')}" placeholder="เช่น Hilux Revo"></div></div>
            <div class="two"><div><label>ประเภท</label><input id="c-t" list="dl-ctype" value="${esc(c.car_type || '')}" placeholder="เช่น กระบะ, เก๋ง, VAN"><datalist id="dl-ctype">${['กระบะ', 'เก๋ง', 'SUV', 'VAN'].map(x => `<option value="${x}">`).join('')}</datalist></div><div><label>ที่นั่ง</label><input id="c-s" type="number" min="0" value="${c.seats || ''}"></div></div>
            <div class="two"><div><label>สี</label><input id="c-co" value="${esc(c.color || '')}"></div><div><label>ลำดับในตาราง</label><input id="c-o" type="number" value="${c.sort_order || 0}"></div></div>
            <div><label>หมายเหตุ (ผู้จองเห็น)</label><input id="c-no" value="${esc(c.note || '')}" placeholder="เช่น กุญแจอยู่ที่ธุรการ, ใช้บัตรเติมน้ำมัน"></div>
            <div><label>รูปรถ (ไม่บังคับ)</label><input id="c-ph" type="file" accept="image/*"></div>
            <label style="display:flex;gap:7px;align-items:center;font-weight:500"><input type="checkbox" id="c-a" ${+c.is_active ? 'checked' : ''}> เปิดให้พนักงานจอง</label></div>`,
        preConfirm: () => {
            if (!gid('c-p').value.trim()) return Swal.showValidationMessage('ใส่ทะเบียนรถ');
            const fd = new FormData();
            Object.entries({ action: 'car_save', id: id || '', plate: gid('c-p').value, company: gid('c-c').value, brand: gid('c-b').value, name: gid('c-n').value, car_type: gid('c-t').value, seats: gid('c-s').value, color: gid('c-co').value, sort_order: gid('c-o').value, note: gid('c-no').value, province: c.province || '', is_active: gid('c-a').checked ? 1 : '' }).forEach(([k, v]) => fd.append(k, v));
            if (gid('c-ph').files[0]) fd.append('photo', gid('c-ph').files[0]);
            return fd;
        } });
    if (!isConfirmed) return;
    try { const res = await (await fetch('api.php', { method: 'POST', body: value })).json(); if (res.status !== 'success') throw new Error(res.message); ptcToast('success', 'บันทึกรถแล้ว'); loadKeep(); loadDay(); } catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}
async function editDriver(id) {
    const d = window._CJ.drivers.find(x => +x.id === id) || { name: '', nickname: '', phone: '', company: '', is_active: 1 };
    const { isConfirmed, value } = await ptcSwal().fire({ title: id ? 'แก้คนขับ' : 'เพิ่มคนขับ', showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ปิด', focusConfirm: false,
        html: `<div class="fx"><div><label>ชื่อ-นามสกุล</label><input id="d-n" value="${esc(d.name)}"></div><div class="two"><div><label>ชื่อเล่น</label><input id="d-k" value="${esc(d.nickname || '')}"></div><div><label>เบอร์</label><input id="d-p" value="${esc(d.phone || '')}"></div></div>
            <div><label>บริษัท</label><select id="d-c"><option value="">— ไม่ระบุ —</option>${['PTA', 'PT4', 'PTE'].map(x => `<option ${x === d.company ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
            <label style="display:flex;gap:7px;align-items:center;font-weight:500"><input type="checkbox" id="d-a" ${+d.is_active ? 'checked' : ''}> ยังทำงานอยู่ (เลือกได้ตอนอนุมัติ)</label></div>`,
        preConfirm: () => gid('d-n').value.trim() ? { name: gid('d-n').value, nickname: gid('d-k').value, phone: gid('d-p').value, company: gid('d-c').value, is_active: gid('d-a').checked ? 1 : '' } : Swal.showValidationMessage('ใส่ชื่อ') });
    if (!isConfirmed) return;
    try { await post({ action: 'car_driver_save', id: id || '', ...value }); ptcToast('success', 'บันทึกคนขับแล้ว'); loadKeep(); } catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}

// ── เริ่มต้น ──
function syncNavH() { const n = document.querySelector('.ptc-nav'); if (n) document.documentElement.style.setProperty('--rt-nav-h', n.getBoundingClientRect().bottom + 'px'); }
window.addEventListener('resize', syncNavH);
function tab(t) {
    syncNavH();
    ['day', 'mine', 'keep'].forEach(k => { gid('v-' + k).style.display = k === t ? '' : 'none'; gid('t-' + k).classList.toggle('on', k === t); });
    if (t === 'keep') loadKeep();
    try { const u = new URL(location.href); u.searchParams.set('tab', t); history.replaceState(null, '', u); } catch (_) {}
    scrollTo(0, 0);
}
(async function init() {
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) {}
    if (!S.loggedin) { location.href = 'login.html?returnUrl=' + encodeURIComponent(location.pathname.split('/').pop() + location.search); return; }
    const qs = new URLSearchParams(location.search);
    if (/^\d{4}-\d{2}-\d{2}$/.test(qs.get('date') || '')) date = qs.get('date');
    api({ action: 'room_people' }).then(j => { PEOPLE = j.people || []; const dl = document.createElement('datalist'); dl.id = 'dl-people';
        dl.innerHTML = PEOPLE.map(p => `<option value="${esc(p.n)}">${esc([p.k && '(' + p.k + ')', p.d, p.c].filter(Boolean).join(' · '))}</option>`).join(''); document.body.appendChild(dl); }).catch(() => {});
    await loadDay(); loadMine();
    if (D?.can_manage) { try { const t = (await api({ action: 'car_board', view: 'pending' })).todo; setKeepCnt(t); if (!t.pending && (t.receive || t.overdue)) kv = 'active'; } catch (_) {} }
    tab(['mine', 'keep'].includes(qs.get('tab')) && (qs.get('tab') !== 'keep' || D?.can_manage) ? qs.get('tab') : 'day');
    // รีเฟรชตารางทุก 1 นาที — ไม่รีเฟรชตอนกำลังพิมพ์ในฟอร์ม
    setInterval(() => { if (document.visibilityState === 'visible' && gid('v-day').style.display !== 'none' && !document.activeElement?.closest?.('.form')) loadDay(); }, 60000);
})();
</script>
