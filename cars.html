html { overflow:auto !important; height:auto !important; } body { overflow:visible !important; height:auto !important; }

.btn:hover { border-color:var(--ptc-primary); }

<script>
const gid = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const toD = s => new Date(String(s).replace(' ', 'T'));
const hm = s => String(s).slice(11, 16);
const thDay = s => new Date(s + 'T00:00:00').toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
const thD = s => toD(s).toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
// ข้อมูลเดิม: ออกรถเกือบทั้งหมด 07–14 น. กลับไม่เกิน 17–18 น. → ตาราง 06–20
const H0 = 6, H1 = 20, SPAN = H1 - H0;

let mode = 'day', WK = null, PEOPLE = [], S = {}, D = null, date = ymd(new Date()), coF = null, typeF = '', mine = [], sending = false;
const CO_C = { PTA: '#059669', PT4: '#dc2626', PTE: '#2563eb' };
const coTag = c => c ? `<span class="pill" style="--c:${CO_C[c] || '#64748b'};font-size:10px;padding:1px 6px">${esc(c)}</span>` : '';
// วันที่ออก = วันที่ดูอยู่ในตาราง (date) · end_date ว่าง = กลับวันเดียวกัน
let BF = { car_id: 0, driver_id: '', plist: [], rider: '', purpose: '', destination: '', start: '08:00', end: '12:00', end_date: '', passengers: '', need_driver: null, contact: '', note: '' };

const AV_C = ['#2563eb', '#0d9488', '#7c3aed', '#ea580c', '#db2777', '#0891b2', '#65a30d'];
const splitP = s => String(s || '').split(/\s*,\s*/).filter(Boolean);
function avatar(n) {
    const p = PEOPLE.find(x => x.n === n), t = ` title="${esc(n)}"`;
    // ไม่อยู่ในรายชื่อพนักงาน (เช่น คนขับ) → วงกลมตัวย่อชื่อ
    if (!p) { const ini = String(n || '?').replace(/^(Mr\.?|Mrs\.?|Ms\.?|Miss|นาย|นางสาว|นาง)\s*/i, '').trim().split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2); return `<span class="pa" style="--c:#64748b"${t}>${esc(ini || '?')}</span>`; }
    const ini = p.n.replace(/^(Mr\.?|Mrs\.?|Ms\.?|Miss|นาย|นางสาว|นาง)\s*/i, '').split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2);
    const col = AV_C[[...p.n].reduce((s, c) => s + c.charCodeAt(0), 0) % AV_C.length];
    return p.p ? `<img class="pa" src="${esc(p.p)}" alt=""${t} onerror="this.outerHTML='<span class=&quot;pa&quot; style=&quot;--c:${col}&quot;>${esc(ini)}</span>'">` : `<span class="pa" style="--c:${col}"${t}>${esc(ini)}</span>`;
}
// กล่องแนะนำชื่อใต้ช่องพิมพ์ — ลูกศรขึ้นลงเลือก · Enter = เลือก (ไม่มีในรายชื่อ = ใช้ข้อความที่พิมพ์)
function suggest(inp, onPick) {
    const box = document.createElement('div'); box.className = 'sug'; box.style.display = 'none'; inp.parentNode.appendChild(box);
    let hits = [], cur = -1;
    const draw = () => { box.innerHTML = hits.map((p, i) => `<div class="${i === cur ? 'on' : ''}" data-i="${i}">${avatar(p.n)}<span>${esc(p.n)}${p.k ? ' (' + esc(p.k) + ')' : ''}<small>${esc([p.d, p.c].filter(Boolean).join(' · '))}</small></span></div>`).join(''); box.style.display = hits.length ? '' : 'none'; };
    inp.addEventListener('input', () => { const q = inp.value.trim().toLowerCase(); hits = q ? PEOPLE.filter(p => (p.n + ' ' + p.k + ' ' + p.d).toLowerCase().includes(q)).slice(0, 8) : []; cur = hits.length ? 0 : -1; draw(); });
    inp.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (!hits.length) return; e.preventDefault(); cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length; draw(); }
        else if (e.key === 'Enter') { e.preventDefault(); const v = cur >= 0 && hits[cur] ? hits[cur].n : inp.value.trim(); hits = []; draw(); if (v) onPick(v); }
        else if (e.key === 'Escape') { hits = []; draw(); }
    });
    box.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (!d) return; e.preventDefault(); const v = hits[+d.dataset.i].n; hits = []; draw(); onPick(v); });
    inp.addEventListener('blur', () => setTimeout(() => { hits = []; draw(); }, 150));
}

    const r = gid('f-rider'), p = gid('f-part');

}

            Object.entries({ action: 'car_save', id: id || '', plate: gid('c-p').value, company: gid('c-c').value, brand: gid('c-b').value, name: gid('c-n').value, car_type: gid('c-t').value, seats: gid('c-s').value, color: gid('c-co').value, sort_order: gid('c-o').value, note: gid('c-no').value, province: c.province || '', is_active: gid('c-a').checked ? 1 : '' }).forEach(([k, v]) => fd.append(k, v));
            if (gid('c-ph').files[0]) fd.append('photo', gid('c-ph').files[0]);
            return fd;
        } });
    if (!isConfirmed) return;
    try { const res = await (await fetch('api.php', { method: 'POST', body: value })).json(); if (res.status !== 'success') throw new Error(res.message); ptcToast('success', 'บันทึกรถแล้ว'); loadKeep(); loadDay(); } catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}
async function editDriver(id) {
    const d = window._CJ.drivers.find(x => +x.id === id) || { name: '', nickname: '', phone: '', company: '', is_active: 1 };
    const { isConfirmed, value } = await ptcSwal().fire({ title: id ? 'แก้คนขับ' : 'เพิ่มคนขับ', showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ปิด', focusConfirm: false,
        html: `<div class="fx"><div><label>ชื่อ-นามสกุล<span class="req">*</span></label><input id="d-n" value="${esc(d.name)}"></div><div class="two"><div><label>ชื่อเล่น</label><input id="d-k" value="${esc(d.nickname || '')}"></div><div><label>เบอร์</label><input id="d-p" value="${esc(d.phone || '')}"></div></div>
            <div><label>บริษัท</label><select id="d-c"><option value="">— ไม่ระบุ —</option>${['PTA', 'PT4', 'PTE'].map(x => `<option ${x === d.company ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
            <label style="display:flex;gap:7px;align-items:center;font-weight:500"><input type="checkbox" id="d-a" ${+d.is_active ? 'checked' : ''}> ยังทำงานอยู่ (เลือกได้ตอนอนุมัติ)</label></div>`,
        preConfirm: () => gid('d-n').value.trim() ? { name: gid('d-n').value, nickname: gid('d-k').value, phone: gid('d-p').value, company: gid('d-c').value, is_active: gid('d-a').checked ? 1 : '' } : Swal.showValidationMessage('ใส่ชื่อ') });
    if (!isConfirmed) return;
    try { await post({ action: 'car_driver_save', id: id || '', ...value }); ptcToast('success', 'บันทึกคนขับแล้ว'); loadKeep(); } catch (e) { ptcAlert('error', 'บันทึกไม่สำเร็จ', e.message); }
}

// ── เริ่มต้น ──
function syncNavH() { const n = document.querySelector('.ptc-nav'); if (n) document.documentElement.style.setProperty('--rt-nav-h', n.getBoundingClientRect().bottom + 'px'); }
window.addEventListener('resize', syncNavH);
function tab(t) {
    syncNavH();
    ['day', 'mine', 'keep'].forEach(k => { gid('v-' + k).style.display = k === t ? '' : 'none'; gid('t-' + k).classList.toggle('on', k === t); });
    if (t === 'keep') loadKeep();
    try { const u = new URL(location.href); u.searchParams.set('tab', t); history.replaceState(null, '', u); } catch (_) {}
    scrollTo(0, 0);
}
(async function init() {
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) {}
    if (!S.loggedin) { location.href = 'login.html?returnUrl=' + encodeURIComponent(location.pathname.split('/').pop() + location.search); return; }
    const qs = new URLSearchParams(location.search);
    if (/^\d{4}-\d{2}-\d{2}$/.test(qs.get('date') || '')) date = qs.get('date');
    api({ action: 'room_people' }).then(j => { PEOPLE = j.people || []; if (D && gid('v-day').style.display !== 'none' && !document.activeElement?.closest?.('.form')) renderDay(); }).catch(() => {});
    try { if (localStorage.getItem('car_view') === 'week') mode = 'week'; } catch (_) {}
    await (mode === 'week' ? loadWeek() : loadDay()); loadMine();
    if ((D || WK)?.can_manage) { try { const t = (await api({ action: 'car_board', view: 'pending' })).todo; setKeepCnt(t); if (!t.pending && (t.receive || t.overdue)) kv = 'active'; } catch (_) {} }
    tab(['mine', 'keep'].includes(qs.get('tab')) && (qs.get('tab') !== 'keep' || D?.can_manage) ? qs.get('tab') : 'day');
    // รีเฟรชตารางทุก 1 นาที — ไม่รีเฟรชตอนกำลังพิมพ์ในฟอร์ม
    setInterval(() => { if (document.visibilityState === 'visible' && gid('v-day').style.display !== 'none' && !document.activeElement?.closest?.('.form')) (mode === 'week' ? loadWeek() : loadDay()); }, 60000);
})();
</script>
