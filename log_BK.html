<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Service Log - Command Center</title>
    <link rel="manifest" href="app-manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="uploads/logos/pta_logo.png">
    <script src="js/pwa.js" defer></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.css" />
    

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                fontFamily: { sans: ['Kanit', 'sans-serif'] },
                extend: {
                    colors: {
                        primary: '#2563eb', // Blue-600
                        secondary: '#475569', // Slate-600
                        success: '#10b981', // Emerald-500
                        warning: '#f59e0b', // Amber-500
                        danger: '#ef4444', // Red-500
                        info: '#6366f1', // Indigo-500
                    }
                }
            }
        };
        // Theme Loader
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>

    <style>
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }

        /* Print Styles */
        @media print {
            @page { size: auto; margin: 1cm; }
            body { background: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .no-print, header, .stats-bar, #filter-bar, .action-cell, button, #add-ticket-btn, #theme-toggle { display: none !important; }
            .main-container { padding: 0; max-width: none; }
            .card { box-shadow: none; border: none; padding: 0; }
            table { width: 100%; border-collapse: collapse; font-size: 10pt; }
            th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
            th { background-color: #f3f4f6; color: #000; }
            
            /* Print Single Ticket Mode */
            body.printing-ticket > *:not(.print-container) { display: none !important; }
            body.printing-ticket .print-container { display: block !important; width: 100%; height: auto; }
        }
        
        /* Stats Pill Active State */
        .stat-pill.active { 
            background-color: white; 
            border-color: #3b82f6; 
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1), 0 2px 4px -1px rgba(59, 130, 246, 0.06);
        }
        .dark .stat-pill.active {
            background-color: #1e293b;
            border-color: #60a5fa;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 flex flex-col min-h-screen transition-colors duration-300 overflow-x-hidden">

    <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm h-16 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center px-6 shadow-sm z-20 no-print flex-shrink-0">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-10 h-10 flex items-center justify-center rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-indigo-600">IT Command Center</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 hidden sm:block">ระบบบันทึกและติดตามงานแจ้งซ่อม</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button id="chart-btn" onclick="toggleChart()" class="hidden sm:flex items-center gap-2 px-4 py-2 text-sm font-medium text-indigo-600 bg-white border border-indigo-200 rounded-lg hover:bg-indigo-50 hover:text-indigo-700 transition shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-indigo-400 dark:hover:bg-slate-600">
                <i class="fas fa-chart-pie"></i> กราฟ
            </button>
            <button id="print-report-btn" class="hidden sm:flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 hover:text-slate-800 transition shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-600">
                <i class="fas fa-print"></i> พิมพ์รายงาน
            </button>
            <button id="export-btn" class="hidden sm:flex items-center gap-2 px-4 py-2 text-sm font-medium text-emerald-600 bg-white border border-emerald-200 rounded-lg hover:bg-emerald-50 hover:text-emerald-700 transition shadow-sm dark:bg-slate-700 dark:border-slate-600 dark:text-emerald-400 dark:hover:bg-slate-600">
                <i class="fas fa-file-excel"></i> Export
            </button>
            <button id="add-ticket-btn" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition shadow-md shadow-blue-500/20">
                <i class="fas fa-plus"></i> <span class="hidden sm:inline">เพิ่มรายการ</span>
            </button>
            <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
            <button id="theme-toggle" class="w-10 h-10 rounded-lg flex items-center justify-center text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                <i class="fas fa-sun block dark:hidden"></i>
                <i class="fas fa-moon hidden dark:block"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full">
        <div class="max-w-7xl mx-auto space-y-6 p-2 sm:p-4 lg:p-6">

            <div id="chart-section" class="hidden bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm relative animate-fade-in">
                <h3 class="font-bold text-slate-700 dark:text-slate-200 mb-4 flex items-center gap-2"><i class="fas fa-chart-pie text-indigo-500"></i> สัดส่วนงานซ่อมตามสถานะ</h3>
                <div class="h-64 w-full flex justify-center">
                    <canvas id="statusPieChart"></canvas>
                </div>
            </div>

            <div class="stats-bar grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 no-print">
                <div class="stat-pill active cursor-pointer bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all group" data-filter-value="">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 text-slate-500 group-hover:text-blue-500 dark:text-slate-400">
                            <i class="fas fa-clipboard-list"></i> <span class="text-sm font-medium">ทั้งหมด</span>
                        </div>
                        <span id="totalTickets" class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs font-bold px-2 py-1 rounded-full">0</span>
                    </div>
                </div>
                <div class="stat-pill cursor-pointer bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all group" data-filter-value="Pending">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 text-slate-500 group-hover:text-blue-500 dark:text-slate-400">
                            <i class="fas fa-hourglass-half"></i> <span class="text-sm font-medium">รอรับเรื่อง</span>
                        </div>
                        <span id="pendingTickets" class="bg-blue-100 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 text-xs font-bold px-2 py-1 rounded-full">0</span>
                    </div>
                </div>
                <div class="stat-pill cursor-pointer bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all group" data-filter-value="In Progress">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 text-slate-500 group-hover:text-amber-500 dark:text-slate-400">
                            <i class="fas fa-person-digging"></i> <span class="text-sm font-medium">กำลังทำ</span>
                        </div>
                        <span id="progressTickets" class="bg-amber-100 text-amber-600 dark:bg-amber-900/30 dark:text-amber-400 text-xs font-bold px-2 py-1 rounded-full">0</span>
                    </div>
                </div>
                <div class="stat-pill cursor-pointer bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all group" data-filter-value="Waiting for Parts">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 text-slate-500 group-hover:text-red-500 dark:text-slate-400">
                            <i class="fas fa-box-open"></i> <span class="text-sm font-medium">รออะไหล่</span>
                        </div>
                        <span id="waitingTickets" class="bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 text-xs font-bold px-2 py-1 rounded-full">0</span>
                    </div>
                </div>
                <div class="stat-pill cursor-pointer bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all group" data-filter-value="Temporary Fix">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 text-slate-500 group-hover:text-indigo-500 dark:text-slate-400">
                            <i class="fas fa-screwdriver-wrench"></i> <span class="text-sm font-medium">แก้ชั่วคราว</span>
                        </div>
                        <span id="tempFixTickets" class="bg-indigo-100 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400 text-xs font-bold px-2 py-1 rounded-full">0</span>
                    </div>
                </div>
                <div class="stat-pill cursor-pointer bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition-all group" data-filter-value="Completed">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2 text-slate-500 group-hover:text-emerald-500 dark:text-slate-400">
                            <i class="fas fa-check-circle"></i> <span class="text-sm font-medium">เสร็จสิ้น</span>
                        </div>
                        <span id="completedTickets" class="bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400 text-xs font-bold px-2 py-1 rounded-full">0</span>
                    </div>
                </div>
            </div>

            <div id="filter-bar" class="flex flex-col lg:flex-row gap-4 items-stretch lg:items-center justify-between bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm no-print">
                <div class="flex gap-2 w-full lg:w-auto overflow-x-auto pb-2 lg:pb-0">
                    <select id="company-filter" class="form-select bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-sm p-2 focus:ring-2 focus:ring-blue-500 dark:text-white">
                        <option value="">ทุกบริษัท</option>
                        <option value="PTA">PTA</option>
                        <option value="PT4">PT4</option>
                        <option value="PTE">PTE</option>
                    </select>
                    <select id="type-filter" class="form-select bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-sm p-2 focus:ring-2 focus:ring-blue-500 dark:text-white">
                        <option value="">ทุกประเภท</option>
                        <option value="Hardware">Hardware</option>
                        <option value="Software">Software</option>
                        <option value="Network">Network</option>
                        <option value="Other">Other</option>
                    </select>
                    <select id="status-filter" class="hidden">
                        <option value="">All</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Waiting for Parts">Waiting for Parts</option>
                        <option value="Temporary Fix">Temporary Fix</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="flex flex-col sm:flex-row gap-2 w-full lg:w-auto">
                    <div class="relative w-full sm:w-72">
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="search-input" placeholder="ค้นหา Case ID, ชื่อ, ปัญหา..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white">
                    </div>
                    <button id="my-queue-toggle" class="w-full sm:w-auto px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-600 transition flex items-center justify-center gap-2">
                        <i class="fas fa-user-check text-slate-400"></i>
                        <span>งานของฉัน</span>
                    </button>
                    <button id="refresh-btn" class="w-full sm:w-auto px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-sm font-medium hover:bg-slate-50 dark:hover:bg-slate-600 transition flex items-center justify-center gap-2">
                        <i class="fas fa-rotate text-slate-400"></i>
                        <span>รีเฟรช</span>
                    </button>
                </div>
            </div>

            <div class="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm">
                <div class="px-4 sm:px-6 py-3 border-b border-slate-100 dark:border-slate-700/60 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 no-print">
                    <div id="result-summary" class="text-sm text-slate-600 dark:text-slate-300"></div>
                    <button id="clear-filters-btn" class="px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-xs font-semibold text-slate-600 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-600 transition">
                        ล้างตัวกรอง
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600 dark:text-slate-300 table">
                        <thead class="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 uppercase font-semibold text-xs sticky top-0 z-10 shadow-sm">
                            <tr>
                                <th class="px-4 py-3 w-12 text-center no-print hidden sm:table-cell"><i class="fas fa-paperclip"></i></th>
                                <th class="px-4 py-3 whitespace-nowrap">Case ID</th>
                                <th class="px-4 py-3 whitespace-nowrap">ผู้แจ้ง</th>
                                <th class="px-4 py-3 min-w-[200px]">ปัญหา</th>
                                <th class="px-4 py-3 whitespace-nowrap hidden md:table-cell">ผู้รับผิดชอบ</th>
                                <th class="px-4 py-3 whitespace-nowrap hidden sm:table-cell">สถานะ</th>
                                <th class="px-4 py-3 whitespace-nowrap hidden lg:table-cell">วันที่ปิด</th>
                                <th class="px-4 py-3 text-center whitespace-nowrap no-print hidden sm:table-cell w-24">จัดการ</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-700/50">
                            </tbody>
                    </table>
                </div>
                <div id="no-results" class="hidden flex-col items-center justify-center py-12 text-slate-400">
                    <div class="w-16 h-16 bg-slate-100 dark:bg-slate-700/50 rounded-full flex items-center justify-center mb-4">
                        <i class="fas fa-search text-2xl opacity-50"></i>
                    </div>
                    <p>ไม่พบรายการที่ค้นหา</p>
                </div>
                <!-- Pagination Controls -->
                <div id="pagination-controls" class="hidden flex-col sm:flex-row justify-between items-center p-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 rounded-b-xl no-print">
                    <span class="text-sm text-slate-500 dark:text-slate-400 mb-2 sm:mb-0">แสดง <span id="page-start" class="font-bold text-slate-700 dark:text-slate-200">0</span> - <span id="page-end" class="font-bold text-slate-700 dark:text-slate-200">0</span> จาก <span id="page-total" class="font-bold text-slate-700 dark:text-slate-200">0</span> รายการ</span>
                    <div class="flex gap-2">
                        <button onclick="changePage(-1)" id="btn-prev" class="px-3 py-1.5 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 text-sm font-medium text-slate-600 dark:text-slate-300 transition disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-left mr-1"></i> ก่อนหน้า
                        </button>
                        <button onclick="changePage(1)" id="btn-next" class="px-3 py-1.5 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-600 text-sm font-medium text-slate-600 dark:text-slate-300 transition disabled:opacity-50 disabled:cursor-not-allowed">
                            ถัดไป <i class="fas fa-chevron-right ml-1"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="log-modal" class="fixed inset-0 z-50 hidden no-print" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <div class="relative transform overflow-hidden rounded-xl bg-white dark:bg-slate-800 text-left shadow-xl transition-all sm:my-8 w-full max-w-4xl flex flex-col max-h-[90vh]">
                <div class="flex justify-between items-center px-6 py-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50">
                    <h3 class="text-lg font-bold text-slate-800 dark:text-white" id="modal-title">บันทึกงาน</h3>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-white transition"><i class="fas fa-times text-xl"></i></button>
                </div>
                
                <form id="log-form" class="flex flex-col flex-grow overflow-hidden">
                    <div class="modal-body-scrollable p-6 overflow-y-auto space-y-6">
                        
                        <div class="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-lg border border-slate-100 dark:border-slate-700">
                            <div class="flex gap-6 mb-4">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="requester-mode" value="auto" checked class="text-blue-600 focus:ring-blue-500">
                                    <span class="text-sm font-medium dark:text-slate-200">แจ้งโดยพนักงาน</span>
                                </label>
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="radio" name="requester-mode" value="manual" class="text-blue-600 focus:ring-blue-500">
                                    <span class="text-sm font-medium dark:text-slate-200">แจ้งสำหรับแผนก/อื่นๆ</span>
                                </label>
                            </div>
                            
                            <div id="requester-auto-container">
                                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">ผู้แจ้ง</label>
                                <select class="w-full p-2.5 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm dark:text-white" id="form-requester-select" required>
                                    <option value="">-- กรุณาเลือกผู้แจ้ง --</option>
                                </select>
                            </div>

                            <div id="requester-manual-container" class="hidden grid-cols-1 md:grid-cols-3 gap-4">
                                <div><label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">บริษัท</label><select id="form-company" class="w-full p-2.5 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm dark:text-white"><option value="">เลือก</option><option value="PTA">PTA</option><option value="PT4">PT4</option><option value="PTE">PTE</option></select></div>
                                <div><label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">แผนก</label><select id="form-department" class="w-full p-2.5 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm dark:text-white" disabled><option value="">-</option></select></div>
                                <div><label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">ชื่องาน (Optional)</label><input type="text" id="form-job-name-manual" class="w-full p-2.5 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm dark:text-white" placeholder="เช่น ตรวจสอบ Server"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">ผู้รับผิดชอบ</label>
                                <select id="form-servicedBy" class="w-full p-2.5 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm dark:text-white"><option value="">เลือก</option></select>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Asset No.</label>
                                <div class="asset-search-wrapper relative">
                                    <input type="text" id="form-asset" placeholder="ค้นหารหัสพัสดุ..." class="w-full p-2.5 rounded-lg border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-sm dark:text-white">
                                    <div id="asset-results" class="hidden absolute z-10 w-full mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg shadow-lg max-h-48 overflow-y-auto"></div>
                                </div>
                            </div>
                        </div>

                        <div>

    <script>
        // --- 1. Init & Global Variables ---
        let allLogs = [], allEmployees = [], allAssets = [], lightbox;
        let currentEditId = null, userRole = 'user';
        let statusChartInstance = null;
        let selectedLogId = null;
        let currentPage = 1; const itemsPerPage = 20; // Pagination Variables
        let currentUserName = '', currentUserId = '';
        let showMyQueueOnly = false;
        const gid = id => document.getElementById(id);

        function applyTheme(theme) { 
            if (theme === 'dark') document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }
        
        function initializeThemeToggle() {
            const savedTheme = localStorage.getItem('theme') || 'light'; applyTheme(savedTheme);
            const toggle = document.getElementById('theme-toggle');
            if(toggle) toggle.addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });
        }

        const getStatusClass = s => {
            const map = { 'Pending':'bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400', 'In Progress':'bg-amber-50 text-amber-600 dark:bg-amber-900/30 dark:text-amber-400', 'Waiting for Parts':'bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400', 'Temporary Fix':'bg-indigo-50 text-indigo-600 dark:bg-indigo-900/30 dark:text-indigo-400', 'Completed':'bg-emerald-50 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400', 'Cancelled': 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400' };
            return map[s] || 'bg-slate-50 text-slate-600';
        };
        const getStatusIcon = s => {
            const map = { 'Pending':'fa-hourglass-half', 'In Progress':'fa-person-digging', 'Waiting for Parts':'fa-box-open', 'Temporary Fix':'fa-screwdriver-wrench', 'Completed':'fa-check-circle', 'Cancelled': 'fa-ban' };
            return `<i class="fas ${map[s]||'fa-circle'} mr-1.5"></i>`;
        };

        function formatDuration(startDate, endDate) {
            if (!startDate || !endDate) return '-';

            let diff = new Date(endDate) - new Date(startDate);
            if (diff < 0) return '-';

            let days = Math.floor(diff / (1000 * 60 * 60 * 24));
            diff -= days * (1000 * 60 * 60 * 24);

            let hours = Math.floor(diff / (1000 * 60 * 60));
            diff -= hours * (1000 * 60 * 60);

            let mins = Math.floor(diff / (1000 * 60));

            let parts = [];
            if (days > 0) parts.push(`${days} วัน`);
            if (hours > 0) parts.push(`${hours} ชม.`);
            if (mins > 0 && days === 0) parts.push(`${mins} นาที`);

            if (parts.length === 0 && diff > 0) return '< 1 นาที';
            if (parts.length === 0) return '-';
            return parts.join(' ');
        }

        function formatSecondsDuration(totalSeconds) {
            if (!totalSeconds || totalSeconds <= 0) return '-';
            let remaining = Math.floor(totalSeconds);
            const days = Math.floor(remaining / 86400);
            remaining -= days * 86400;
            const hours = Math.floor(remaining / 3600);
            remaining -= hours * 3600;
            const mins = Math.floor(remaining / 60);
            const parts = [];
            if (days > 0) parts.push(days + ' วัน');
            if (hours > 0) parts.push(hours + ' ชม.');
            if (mins > 0 && days === 0) parts.push(mins + ' นาที');
            if (!parts.length) return '< 1 นาที';
            return parts.join(' ');
        }

        function getCurrentStatusDuration(log) {
            const now = new Date();
            const status = log.status || '';
            if (['In Progress', 'Waiting for Parts', 'Temporary Fix'].includes(status)) {
                let secs = Number(log.total_work_duration_seconds || 0);
                if (log.last_work_start_time) {
                    const start = new Date(log.last_work_start_time);
                    if (!isNaN(start.getTime())) {
                        secs += Math.max(0, Math.floor((now - start) / 1000));
                    }
                }
                return formatSecondsDuration(secs);
            }
            if (status === 'Completed') {
                const secs = Number(log.total_work_duration_seconds || 0);
                return formatSecondsDuration(secs);
            }
            const created = new Date(log.date);
            if (isNaN(created.getTime())) return '-';
            const diffSecs = Math.max(0, Math.floor((now - created) / 1000));
            return formatSecondsDuration(diffSecs);
        }

        function formatName(fullName) {
            if (!fullName) return '-';
            let name = fullName.replace(/^(Mr\.|Ms\.|Mrs\.|Miss|Dr\.|Khun)\s+/i, '');
            const parts = name.trim().split(/\s+/);
            if (parts.length > 1) {
                return `${parts[0]} ${parts[1].charAt(0)}.`;
            }
            return parts[0];
        }

        function getInitials(fullName) {
            if (!fullName) return '?';
            let name = fullName.replace(/^(Mr\.|Ms\.|Mrs\.|Miss|Dr\.|Khun)\s+/i, '');
            const parts = name.trim().split(/\s+/).filter(Boolean);
            if (parts.length === 0) return '?';
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            return (parts[0].charAt(0) + parts[1].charAt(0)).toUpperCase();
        }

        function getCompanyPrintInfo(code) {
            const c = String(code || '').trim().toUpperCase();
            const map = {
                'PTA': {
                    code: 'PTA',
                    name: 'Powertech Engine Assembly Co., Ltd.',
                    address: '1/8, 1/37-38, 1/40 Moo 5, Tasaarn, Bangpakong, Chachoengsao 24130 Thailand',
                    phone: 'F4: +66(0)38 578520 | F16-17: +66(0)33 022 161-4'
                },
                'PT4': {
                    code: 'PT4',
                    name: 'Powertech 2004 Co., Ltd.',
                    address: '1/11 Moo 5, Tasaarn, Bangpakong, Chachoengsao 24130 Thailand',
                    phone: 'Tel: +66(0)38 577182 | Fax: +66(0)38 578554'
                },
                'PTE': {
                    code: 'PTE',
                    name: 'Powertech Energy Solutions Co., Ltd.',
                    address: '42 Moo 3, Tasaarn, Bangpakong, Chachoengsao 24130 Thailand',
                    phone: 'Tel: -'
                }
            };
            return map[c] || {
                code: c || '-',
                name: 'Powertech Group',
                address: '',
                phone: ''
            };
        }

        // --- 2. Data Loading & API ---
        async function loadInitialData() {
            try {
                const [empRes, logRes, astRes] = await Promise.all([
                    fetch(`api.php?action=get&file=employees&status_filter=active&v=${Date.now()}`),
                    fetch(`api.php?action=get&file=it_logs&v=${Date.now()}`),
                    fetch(`api.php?action=getEquipmentData&v=${Date.now()}`)
                ]);
                
                if (!empRes.ok || !logRes.ok || !astRes.ok) throw new Error("API Error");
                
                const empData = await empRes.json();
                allEmployees = Array.isArray(empData) ? empData : [];

                // FIX: Parse assignments string into an array for each employee
                allEmployees.forEach(emp => {
                    if (typeof emp.assignments === 'string' && emp.assignments) {
                        try {
                            emp.assignments = JSON.parse(emp.assignments);
                        } catch (e) {
                            emp.assignments = []; // Handle invalid JSON
                        }
                    } else if (!Array.isArray(emp.assignments)) {
                        emp.assignments = []; // Handle null or non-array values
                    }
                });

                const logData = await logRes.json();
                allLogs = Array.isArray(logData) ? logData : [];

                const astData = await astRes.json();
                allAssets = Array.isArray(astData) ? astData : [];

                populateServicedByDropdown();
                renderTable();
                updateStatistics();
            } catch (e) {
                console.error(e);
                gid('table-body').innerHTML = `<tr><td colspan="7" class="text-center py-8 text-red-500">Failed to load data.</td></tr>`;
            }
        }

        // --- 3. Render Table ---
        function renderTable() {
            const tbody = gid('table-body');
            const term = gid('search-input').value.toLowerCase();
            const co = gid('company-filter').value, stat = gid('status-filter').value, typ = gid('type-filter').value;

            const filtered = allLogs.filter(l => {
                if(!l) return false;
                const txt = Object.values(l).join(' ').toLowerCase();
                const myOk = !showMyQueueOnly || (String(l.servicedById || '') === String(currentUserId || ''));
                return myOk && (!term || txt.includes(term)) && (!co || l.company===co) && (!stat || l.status===stat) && (!typ || l.type===typ);
            });

            // --- Pagination Logic ---
            const totalItems = filtered.length;
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages || 1;
            if (currentPage < 1) currentPage = 1;

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = filtered.slice(start, end);
            // ------------------------

            const summaryEl = gid('result-summary');
            if (summaryEl) {
                summaryEl.replaceChildren();
                const row = document.createElement('div');
                row.className = 'flex flex-wrap items-center gap-2';
                const main = document.createElement('span');
                main.className = 'font-semibold text-slate-700 dark:text-slate-200';
                main.textContent = `พบ ${totalItems} รายการ`;
                row.appendChild(main);

                const sub = document.createElement('span');
                sub.className = 'text-slate-500 dark:text-slate-400';
                sub.textContent = `(แสดง ${paginatedItems.length} รายการในหน้านี้ จากทั้งหมด ${allLogs.length})`;
                row.appendChild(sub);

                const chips = [];
                if (showMyQueueOnly) chips.push('งานของฉัน');
                if (co) chips.push(`บริษัท: ${co}`);
                if (typ) chips.push(`ประเภท: ${typ}`);
                if (stat) chips.push(`สถานะ: ${stat}`);
                if (term) chips.push(`ค้นหา: ${term}`);
                chips.forEach(t => {
                    const chip = document.createElement('span');
                    chip.className = 'inline-flex items-center px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 text-xs font-semibold';
                    chip.textContent = t;
                    row.appendChild(chip);
                });
                summaryEl.appendChild(row);
            }

            gid('no-results').classList.toggle('flex', filtered.length===0);
            gid('no-results').classList.toggle('hidden', filtered.length>0);
            gid('pagination-controls').classList.toggle('hidden', filtered.length===0);

            tbody.innerHTML = paginatedItems.map(log => {
                const isImg = log.first_attachment && /\.(jpg|jpeg|png|webp)$/i.test(log.first_attachment);
                const attach = log.first_attachment ? `<a href="uploads/attachments/${log.first_attachment}" ${isImg?'class="table-lightbox"':'target="_blank"'} class="text-slate-400 hover:text-blue-500"><i class="fas fa-paperclip"></i></a>` : '';
                
                const urgencyColor = log.urgency==='ด่วนที่สุด'?'text-red-500 font-bold':(log.urgency==='ด่วน'?'text-amber-500 font-semibold':'text-slate-400');
                
                let coColor = 'bg-slate-100 text-slate-700 dark:bg-slate-700 dark:text-slate-300';
                if (log.id.startsWith('PT4')) coColor = 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400';
                else if (log.id.startsWith('PTA')) coColor = 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400';
                else if (log.id.startsWith('PTE')) coColor = 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400';

                // Timeline Logic (Copied and adapted from my_tickets.html)
                let currentIdx = 0;
                let subStatus = '';
                let activeColor = 'blue';
                let isCancelled = log.status === 'Cancelled';
                let step2Label = 'ดำเนินการ'; // Default label

                if (log.status === 'Pending') currentIdx = 0;
                else if (['Received', 'In Progress', 'Waiting for Parts', 'Temporary Fix'].includes(log.status)) {
                    currentIdx = 1;
                    if (log.status === 'Received') { subStatus = 'รับเรื่องแล้ว (รอเริ่มซ่อม)'; activeColor = 'amber'; step2Label = 'รับเรื่องแล้ว'; }
                    else if (log.status === 'Waiting for Parts') { subStatus = 'รออะไหล่'; activeColor = 'orange'; step2Label = 'รออะไหล่'; }
                    else if (log.status === 'Temporary Fix') { subStatus = 'แก้ชั่วคราว'; activeColor = 'indigo'; step2Label = 'แก้ชั่วคราว'; }
                    else { subStatus = 'กำลังซ่อม'; activeColor = 'blue'; step2Label = 'กำลังซ่อม'; }
                }
                else if (log.status === 'Completed') { currentIdx = 2; activeColor = 'emerald'; }

                const steps = [
                    { label: 'รับเรื่อง', icon: 'fa-file-import' },
                    { label: step2Label, icon: 'fa-tools' }, // ใช้ Label แบบ Dynamic
                    { label: 'เสร็จสิ้น', icon: 'fa-check' }
                ];

                let timelineHtml = '';
                if (isCancelled) {
                    const statusDuration = getCurrentStatusDuration(log);
                    timelineHtml = `<div class="w-full min-w-[180px] flex flex-col items-center justify-center text-slate-400 font-bold text-xs">
                        <div class="pb-1"><i class="fas fa-ban mr-2 text-red-400"></i> ยกเลิกงานแล้ว</div>
                        <div class="text-[9px] font-normal">เวลาในสถานะนี้: ${statusDuration}</div>
                    </div>`;
                } else {
                    const statusDuration = getCurrentStatusDuration(log);
                    timelineHtml = `<div class="flex flex-col w-full min-w-[180px] pb-2 pt-1">
                    <div class="flex items-center w-full">
                        ${steps.map((s, i) => {
                            let circle = 'bg-slate-200 text-slate-400 dark:bg-slate-700 dark:text-slate-500';
                            let text = 'text-slate-400 dark:text-slate-500';
                            
                            if (i < currentIdx) {
                                circle = 'bg-emerald-500 text-white';
                                text = 'text-emerald-600 dark:text-emerald-400 font-medium';
                            } else if (i === currentIdx) {
                                if(activeColor === 'blue') { circle = 'bg-blue-500 text-white ring-2 ring-blue-100 dark:ring-blue-900/30'; text = 'text-blue-600 dark:text-blue-400 font-bold'; }
                                else if(activeColor === 'orange') { circle = 'bg-orange-500 text-white ring-2 ring-orange-100 dark:ring-orange-900/30'; text = 'text-orange-500 dark:text-orange-400 font-bold'; }
                                else if(activeColor === 'indigo') { circle = 'bg-indigo-500 text-white ring-2 ring-indigo-100 dark:ring-indigo-900/30'; text = 'text-indigo-600 dark:text-indigo-400 font-bold'; }
                                else if(activeColor === 'amber') { circle = 'bg-amber-500 text-white ring-2 ring-amber-100 dark:ring-amber-900/30'; text = 'text-amber-500 dark:text-amber-400 font-bold'; }
                                else if(activeColor === 'emerald') { circle = 'bg-emerald-500 text-white ring-2 ring-emerald-100 dark:ring-emerald-900/30'; text = 'text-emerald-600 dark:text-emerald-400 font-bold'; }
                            }
                            
                            const lineHtml = i > 0 ? `<div class="flex-1 h-0.5 mx-1 rounded ${i <= currentIdx ? 'bg-emerald-500' : 'bg-slate-200 dark:bg-slate-700'}"></div>` : '';
                            
                            return `${lineHtml}
                                <div class="relative flex flex-col items-center group/step">
                                    <div class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] z-10 transition-all ${circle}">
                                        <i class="fas ${s.icon}"></i>
                                    </div>
                                    <div class="absolute top-7 text-[9px] whitespace-nowrap ${text}">
                                        ${s.label}
                                        ${i === 1 && subStatus && i === currentIdx ? `<div class="text-[8px] opacity-80">${subStatus}</div>` : ''}
                                    </div>
                                </div>`;
                        }).join('')}
                    </div>
                    <div class="text-[9px] text-slate-400 mt-1">เวลาในสถานะนี้: ${statusDuration}</div>
                    </div>`;
                }

                // Highlight Selected Row
                const activeClass = (log.id === selectedLogId) ? 'bg-blue-100 dark:bg-blue-900/40' : '';

                const duration = formatDuration(log.date, log.completed_date);
                const closedDateStr = log.completed_date ? new Date(log.completed_date).toLocaleDateString('th-TH') : '-';

                // Action Buttons
                let actions = `
                    <button onclick="openLogModal('${log.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 transition"><i class="fas fa-edit"></i></button>
                    <button onclick="deleteItem('${log.id}')" class="p-1.5 text-slate-400 hover:text-red-600 transition"><i class="fas fa-trash"></i></button>`;
                
                if(log.status==='Pending') {
                    actions = `<button onclick="acceptTicket('${log.id}')" class="p-1.5 text-blue-500 hover:bg-blue-50 rounded" title="รับเรื่อง (ยังไม่เริ่มซ่อม)"><i class="fas fa-inbox"></i></button>` +
                              `<button onclick="startTicket('${log.id}')" class="p-1.5 text-amber-500 hover:bg-amber-50 rounded" title="เริ่มงาน (Start)"><i class="fas fa-play"></i></button>` + 
                              `<button onclick="cancelTicket('${log.id}')" class="p-1.5 text-slate-400 hover:bg-slate-100 rounded" title="ยกเลิก (Cancel)"><i class="fas fa-ban"></i></button>` + actions;
                } else if(['Received','In Progress','Waiting for Parts', 'Temporary Fix'].includes(log.status)) {
                    if(log.status === 'In Progress') actions = `<button onclick="pauseTicket('${log.id}')" class="p-1.5 text-orange-500 hover:bg-orange-50 rounded" title="พักงาน (Pause)"><i class="fas fa-pause"></i></button>` + actions;
                    else actions = `<button onclick="startTicket('${log.id}')" class="p-1.5 text-blue-500 hover:bg-blue-50 rounded" title="ดำเนินการต่อ (Resume)"><i class="fas fa-play-circle"></i></button>` + actions;
                    actions = `<button onclick="finishTicket('${log.id}')" class="p-1.5 text-emerald-500 hover:bg-emerald-50 rounded" title="ปิดงาน (Finish)"><i class="fas fa-check-circle"></i></button>` + 
                              `<button onclick="cancelTicket('${log.id}')" class="p-1.5 text-slate-400 hover:bg-slate-100 rounded" title="ยกเลิก (Cancel)"><i class="fas fa-ban"></i></button>` + actions;
                } else if (log.status === 'Completed') {
                    // เพิ่มปุ่ม Reopen สำหรับงานที่เสร็จแล้ว

        function changePage(delta) {
            currentPage += delta;
            renderTable();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updatePaginationControls(total, pages) {
            const start = total === 0 ? 0 : (currentPage - 1) * itemsPerPage + 1;
            const end = Math.min(currentPage * itemsPerPage, total);
            gid('page-start').textContent = start;
            gid('page-end').textContent = end;
            gid('page-total').textContent = total;
            gid('btn-prev').disabled = currentPage <= 1;
            gid('btn-next').disabled = currentPage >= pages;
        }

        function updateStatistics() {
            const counts = { 'Pending':0, 'In Progress':0, 'Waiting for Parts':0, 'Temporary Fix':0, 'Completed':0 };
            allLogs.forEach(l => { if(l && counts[l.status] !== undefined) counts[l.status]++; });
            gid('totalTickets').textContent = allLogs.length;
            
            if(gid('pendingTickets')) gid('pendingTickets').textContent = counts['Pending'];
            if(gid('progressTickets')) gid('progressTickets').textContent = counts['In Progress'];
            if(gid('waitingTickets')) gid('waitingTickets').textContent = counts['Waiting for Parts'];
            if(gid('tempFixTickets')) gid('tempFixTickets').textContent = counts['Temporary Fix'];
            if(gid('completedTickets')) gid('completedTickets').textContent = counts['Completed'];
            
            if(!gid('chart-section').classList.contains('hidden')) {
                renderChart(counts);
            }
        }

        function toggleChart() {
            const sec = gid('chart-section');
            sec.classList.toggle('hidden');
            if(!sec.classList.contains('hidden')) {
                updateStatistics();
            }
        }

        function renderChart(counts) {
            const ctx = gid('statusPieChart').getContext('2d');
            
            if(statusChartInstance) statusChartInstance.destroy();

            const labels = ['Pending', 'In Progress', 'Waiting for Parts', 'Temporary Fix', 'Completed'];
            const data = labels.map(l => counts[l] || 0);
            const colors = ['#3b82f6', '#f59e0b', '#ef4444', '#6366f1', '#10b981'];

            statusChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'right', labels: { color: document.documentElement.classList.contains('dark') ? '#cbd5e1' : '#475569' } } }
                }
            });
        }

            document.querySelector('input[name="requester-mode"][value="auto"]').checked = true;
            toggleRequesterMode();
            populateAllRequestersDropdown();
            gid('repair-cost-wrapper').classList.toggle('hidden', !['admin', 'staff'].includes(userRole));

            if (logId) {
                const log = allLogs.find(l => l.id === logId);
                if(log) {
                    gid('form-date').value = log.date;
                    gid('form-problem').value = log.problem;
                    gid('form-solution').value = log.solution;
                    gid('form-status').value = log.status;
                    gid('form-type').value = log.type;
                    gid('form-urgency').value = log.urgency;

                    gid('form-appointment_date').value = log.appointment_date || '';
                    gid('form-repair_cost').value = log.repair_cost || '';
                    
                    // Serviced By ID
                    if(log.servicedById) gid('form-servicedBy').value = log.servicedById;
                    else {
                        const tech = allEmployees.find(e => e.name === log.servicedBy);
                        if(tech) gid('form-servicedBy').value = tech.id;
                    }

                    // Requester Mode Logic
                    let reqFound = false;
                    if(log.requester_id) {
                        const emp = allEmployees.find(e => e.id === log.requester_id);
                        if(emp) { gid('form-requester-select').value = emp.name; reqFound = true; }
                    }
                    if(!reqFound) {
                        document.querySelector('input[name="requester-mode"][value="manual"]').checked = true;
                        toggleRequesterMode();
                        gid('form-company').value = log.company;
                        populateManualDepartmentDropdown();
                        gid('form-department').value = log.department;
                        // extract job name
                        const m = log.requester?.match(/\((.*?)\)/);
                        if(m) gid('form-job-name-manual').value = m[1];

                    const emp = allEmployees.find(e => e.id === uid);
                    if(emp) gid('form-requester-select').value = emp.name;

        // --- 5. Handlers ---
        async function handleLogSubmit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true; btn.innerHTML = 'Saving...';

            const isMan = document.querySelector('input[name="requester-mode"]:checked').value === 'manual';
            let reqName, co, dept, empId = null;

            if(isMan) {
                co = gid('form-company').value;
                dept = gid('form-department').value;
                const job = gid('form-job-name-manual').value.trim();
                reqName = job ? `${dept} (${job})` : dept;
                if(!co || !dept) { alert('Missing Info'); btn.disabled=false; return; }
            } else {
                const opt = gid('form-requester-select').selectedOptions[0];
                if(!opt || !opt.value) { alert('Select Requester'); btn.disabled=false; return; }
                reqName = opt.value;
                co = opt.dataset.company;
                dept = opt.dataset.department;
                empId = opt.dataset.id;
            }

            const data = {
                date: gid('form-date').value,
                company: co, department: dept, requester: reqName,
                servicedBy: gid('form-servicedBy').selectedOptions[0]?.text || '',
                asset_id: gid('form-asset').value,
                problem: gid('form-problem').value,
                solution: gid('form-solution').value,
                status: gid('form-status').value,
                type: gid('form-type').value,
                urgency: gid('form-urgency').value,
                repair_cost: gid('form-repair_cost').value || null,
                appointment_date: gid('form-appointment_date').value || null
            };
            if(currentEditId) data.id = currentEditId;

            const fd = new FormData();
            fd.append('action', currentEditId ? 'update_item' : 'add_item');
            fd.append('key', 'it_logs');
            fd.append('data', JSON.stringify(data));
            fd.append('servicedById', gid('form-servicedBy').value);
            if(empId) fd.append('requester_id', empId);

            try {
                const res = await (await fetch('api.php', { method:'POST', body:fd })).json();
                if(res.status!=='success') throw new Error(res.message);
                
                await uploadFiles(currentEditId || res.new_id, 'form-attachments');
                await loadInitialData();
                closeModal();
                Swal.fire({ icon:'success', title:'Saved', toast:true, position:'top-end', showConfirmButton:false, timer:1500 });
            } catch(err) {
                Swal.fire('Error', err.message, 'error');
            } finally {
                btn.disabled = false; btn.innerHTML = 'บันทึกข้อมูล';
            }
        }

        async function uploadFiles(logId, inputId) {
            const files = gid(inputId).files;
            for(const f of files) {
                const fd = new FormData();
                fd.append('action', 'upload_attachment');
                fd.append('log_id', logId);
                fd.append('attachmentFile', f);
                await fetch('api.php', { method:'POST', body:fd });
            }
        }

        async function deleteItem(id) {
            const {isConfirmed} = await Swal.fire({ title:'Delete?', icon:'warning', showCancelButton:true, confirmButtonColor:'#ef4444' });
            if(isConfirmed) {
                const fd = new FormData(); 
                fd.append('action','delete_item'); 
                fd.append('key','it_logs'); 
                fd.append('id',id);
                try {
                    const res = await fetch('api.php', { method:'POST', body:fd });
                    const json = await res.json();
                    if (!res.ok || json.status !== 'success') throw new Error(json.message || 'Failed to delete.');
                    
                    await loadInitialData();
                    Swal.fire('Deleted!', 'The log has been deleted.', 'success');
                } catch(err) {
                    Swal.fire('Error', err.message, 'error');
                }
            }
        }

        async function startTicket(id) {
            const log = allLogs.find(l => l.id === id);
            if (!log) return;

            let assignedToId = log.servicedById || null;
            let assignedToName = log.servicedBy || null;

            // ถ้ายังไม่มีผู้รับผิดชอบ ให้แสดงหน้าต่างเลือกผู้รับผิดชอบ
            if (!assignedToId) {
                const itEmployees = allEmployees.filter(e => e.assignments?.some(a => a.department === 'IT'));
                const optionsHtml = itEmployees.map(e => `<option value="${e.id}" ${e.id === currentUserId ? 'selected' : ''}>${e.name}</option>`).join('');

                const { value: selectedUserId } = await Swal.fire({
                    title: 'เริ่มงานซ่อม',
                    html: `
                        <div class="text-left space-y-2 p-2">
                            <p class="text-sm text-slate-600 dark:text-slate-300">กรุณาเลือกผู้รับผิดชอบสำหรับ Case <b>${id}</b>:</p>
                            <select id="swal-servicedBy" class="swal2-input">
                                <option value="">-- เลือกผู้รับผิดชอบ --</option>
                                ${optionsHtml}
                            </select>
                        </div>`,
                    icon: 'question',
                    showCancelButton: true,
                    confirmButtonText: '<i class="fas fa-play"></i> เริ่มงานเลย',
                    confirmButtonColor: '#f59e0b',
                    cancelButtonText: 'ยกเลิก',
                    focusConfirm: false,
                    preConfirm: () => {
                        const selectedId = document.getElementById('swal-servicedBy').value;
                        if (!selectedId) {
                            Swal.showValidationMessage('กรุณาเลือกผู้รับผิดชอบ');
                            return false;
                        }
                        return selectedId;
                    }
                });

                if (selectedUserId) {
                    const selectedEmployee = itEmployees.find(e => e.id === selectedUserId);
                    assignedToId = selectedUserId;
                    assignedToName = selectedEmployee ? selectedEmployee.name : '';
                } else {
                    return; // User cancelled
                }
            }

            // ถ้าไม่มีผู้รับผิดชอบ (เช่น user กด cancel) ให้ออกจากฟังก์ชัน
            if (!assignedToId) return;

            const updatePayload = {
                id: id,
                status: 'In Progress',
                servicedBy: assignedToName
            };

            const fd = new FormData();
            fd.append('action', 'update_item');
            fd.append('key', 'it_logs');
            fd.append('data', JSON.stringify(updatePayload));
            fd.append('servicedById', assignedToId);

            try {
                const response = await fetch('api.php', { method: 'POST', body: fd });
                const resData = await response.json();
                if (!response.ok || resData.status !== 'success') throw new Error(resData.message || 'Failed to update ticket status.');
                
                await loadInitialData();
                
                const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });
                Toast.fire({ icon: 'success', title: 'ดำเนินการ', text: 'สถานะเปลี่ยนเป็น In Progress' });

            } catch (error) {
                console.error('Error starting ticket:', error);
                Swal.fire({ icon: 'error', title: 'Error', text: error.message });
            }
        }

                    const cost = document.getElementById('eval-cost').value.trim();
                    const rec = document.getElementById('eval-rec').value;

                        Swal.showValidationMessage('กรุณาระบุเหตุผลประกอบการตัดสินใจ');
                        return false;

                    if (cost && Number(cost) < 0) {
                        Swal.showValidationMessage('ประมาณการค่าใช้จ่ายต้องไม่ติดลบ');

                id: id,
                evaluation_hardware: formValues.hw || null,
                evaluation_software: formValues.sw || null,
                evaluation_repair_cost: formValues.cost || null,
                evaluation_recommendation: formValues.rec || null,
                evaluation_reason: formValues.reason || null
            };

            const fd = new FormData();
            fd.append('action', 'update_item');
            fd.append('key', 'it_logs');
            fd.append('data', JSON.stringify(payload));

            try {
                const res = await fetch('api.php', { method: 'POST', body: fd });
                const json = await res.json();
                if (!res.ok || json.status !== 'success') throw new Error(json.message || 'ไม่สามารถบันทึกผลประเมินได้');

                await loadInitialData();

                const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true });
                Toast.fire({ icon: 'success', title: 'บันทึกผลประเมินเรียบร้อยแล้ว' });
            } catch (e) {
                Swal.fire('Error', e.message, 'error');
            }
        }

                const newNote = `[${dateStr}] พักงาน (${formValues.status}): ${formValues.note || '-'}`;
                const updatedSolution = (log.solution ? log.solution + '\n' : '') + newNote;

                const updatePayload = {
                    id: id,
                    status: formValues.status,
                    solution: updatedSolution
                };

                const fd = new FormData();
                fd.append('action', 'update_item');
                fd.append('key', 'it_logs');
                fd.append('data', JSON.stringify(updatePayload));
                
                try {
                    const response = await fetch('api.php', { method: 'POST', body: fd });
                    const resData = await response.json();
                    if (!response.ok || resData.status !== 'success') {
                        throw new Error(resData.message || 'Failed to pause ticket.');
                    }
                    await loadInitialData();
                    Swal.fire({ icon: 'info', title: 'พักงานแล้ว', text: `สถานะ: ${formValues.status}`, timer: 1500, showConfirmButton: false });
                } catch (error) {
                    console.error('Error pausing ticket:', error);
                    Swal.fire({ icon: 'error', title: 'Error', text: error.message });
                }
            }
        }

        async function finishTicket(id) {
            const log = allLogs.find(l => l.id === id);
            if (!log) return;

            const { value: formValues } = await Swal.fire({
                title: 'ปิดงานซ่อม (Close Ticket)',
                html: `
                    <div class="text-left space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">วิธีแก้ไข (Solution)</label>
                            <textarea id="swal-solution" class="w-full p-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600 dark:text-white" rows="3" placeholder="ระบุรายละเอียดการแก้ไข...">${log.solution || ''}</textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">ค่าใช้จ่าย (บาท)</label>

                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">แนบรูปภาพหลักฐาน (ถ้ามี)</label>
                        <input type="file" id="swal-files" multiple accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: '<i class="fas fa-check"></i> ปิดงาน',
                confirmButtonColor: '#10b981',
                focusConfirm: false,
                preConfirm: () => {
                    const sol = document.getElementById('swal-solution').value;
                    const cost = document.getElementById('swal-cost').value;
                    const files = document.getElementById('swal-files').files;
                    if (!sol) { Swal.showValidationMessage('กรุณาระบุวิธีแก้ไข'); return false; }
                    return { solution: sol, cost: cost, files: files };
                }
            });

            if (formValues) {
                const updatePayload = { 
                    id: id, 
                    status: 'Completed', 
                    solution: formValues.solution,
                    repair_cost: formValues.cost || null
                };

                const fd = new FormData();
                fd.append('action', 'update_item');
                fd.append('key', 'it_logs');
                fd.append('data', JSON.stringify(updatePayload));
                
                try {
                    const response = await fetch('api.php', { method: 'POST', body: fd });
                    const resData = await response.json();
                    if (!response.ok || resData.status !== 'success') {
                        throw new Error(resData.message || 'Failed to close ticket.');
                    }

                    // Upload files if any
                    if (formValues.files && formValues.files.length > 0) {
                        for(const f of formValues.files) {
                            const fileFd = new FormData();
                            fileFd.append('action', 'upload_attachment');
                            fileFd.append('log_id', id);
                            fileFd.append('attachmentFile', f);
                            // Fire and forget, no need to wait for each upload
                            fetch('api.php', { method:'POST', body:fileFd });
                        }
                    }
                    
                    loadInitialData();
                    
                    Swal.fire({ icon: 'success', title: 'ปิดงานเรียบร้อย!', timer: 1500, showConfirmButton: false });
                } catch (error) {
                    console.error('Error finishing ticket:', error);
                    Swal.fire({ icon: 'error', title: 'Error', text: error.message });
                }
            }
        }

        function populateServicedByDropdown() {
            const it = allEmployees.filter(e => e.assignments?.some(a => a.department === 'IT'));
            gid('form-servicedBy').innerHTML = '<option value="">เลือก</option>' + it.map(e => `<option value="${e.id}">${e.name}</option>`).join('');

        function populateAllRequestersDropdown() {
            const grouped = allEmployees.reduce((acc, e) => {
                // Find primary assignment or fallback to the first one
                const assign = e.assignments?.find(a => a.is_primary == 1) || e.assignments?.[0];
                const co = assign?.company || 'Other';
                if(!acc[co]) acc[co] = []; acc[co].push(e); return acc;
            }, {});
            gid('form-requester-select').innerHTML = '<option value="">-- เลือก --</option>';
            Object.keys(grouped).sort().forEach(co => {
                const grp = document.createElement('optgroup'); grp.label = co;
                grouped[co].sort((a,b)=>a.name.localeCompare(b.name)).forEach(e => {
                    const assign = e.assignments?.find(a => a.is_primary == 1) || e.assignments?.[0];
                    const dept = assign?.department || '-';
                    const opt = document.createElement('option');
                    opt.value = e.name; opt.textContent = `${e.name} (${dept})`;
                    opt.dataset.company = co; opt.dataset.department = dept; opt.dataset.id = e.id;
                    grp.appendChild(opt);
                });
                gid('form-requester-select').appendChild(grp);
            });

        function generateAndPrintReport(config) {
            let reportData = [];
            let title = "";
            let subTitle = "";

            if (config.type === 'current') {
                const term = gid('search-input').value.toLowerCase();
                const co = gid('company-filter').value;
                const stat = gid('status-filter').value;
                const typ = gid('type-filter').value;

                reportData = allLogs.filter(l => {
                    if(!l) return false;
                    const txt = Object.values(l).join(' ').toLowerCase();
                    return (!term || txt.includes(term)) && (!co || l.company===co) && (!stat || l.status===stat) && (!typ || l.type===typ);
                });
                title = "รายงานสรุปงานซ่อม (ตามรายการที่เลือก)";
            } else if (config.type === 'monthly') {
                const [year, month] = config.month.split('-');
                reportData = allLogs.filter(l => {
                    const d = new Date(l.date);
                    return d.getFullYear() == year && (d.getMonth() + 1) == month && (!config.company || l.company === config.company);
                });
                const dateObj = new Date(config.month + '-01');
                title = `รายงานสรุปงานซ่อมประจำเดือน ${dateObj.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' })}`;
            } else if (config.type === 'yearly') {
                reportData = allLogs.filter(l => {
                    const d = new Date(l.date);
                    return d.getFullYear() == config.year && (!config.company || l.company === config.company);
                });
                title = `รายงานสรุปงานซ่อมประจำปี ${parseInt(config.year) + 543}`;
            }

            if (config.company) subTitle = `บริษัท: ${config.company}`;

            reportData.sort((a, b) => new Date(a.date) - new Date(b.date));

            const total = reportData.length;
            const completed = reportData.filter(l => l.status === 'Completed').length;
            const pending = reportData.filter(l => l.status !== 'Completed' && l.status !== 'Cancelled').length;
            const cancelled = reportData.filter(l => l.status === 'Cancelled').length;
            
            const typeStats = reportData.reduce((acc, curr) => {
                const t = curr.type || '-';
                acc[t] = (acc[t] || 0) + 1;
