                let statusColor = 'bg-gray';
                if (log.status === 'Completed') statusColor = 'bg-green';
                else if (log.status === 'Pending') statusColor = 'bg-blue';
                else if (log.status === 'In Progress') statusColor = 'bg-orange';
                else if (log.status === 'Cancelled') statusColor = 'bg-red';

                return `
                    <tr>
                        <td style="text-align: center;">${index + 1}</td>
                        <td style="white-space: nowrap;">${new Date(log.date).toLocaleDateString('th-TH', {day: '2-digit', month: '2-digit', year: '2-digit'})}</td>
                        <td>${log.id}</td>
                        <td><div style="font-weight: bold;">${log.requester || '-'}</div><div style="font-size: 9pt; color: #555;">${log.department || '-'}</div></td>
                        <td>${log.type || '-'}</td>
                        <td><div>${log.problem || '-'}</div>${log.solution ? `<div style="margin-top: 4px; font-size: 9pt; color: #065f46; border-top: 1px dashed #ccc; padding-top: 2px;"><strong>Sol:</strong> ${log.solution}</div>` : ''}</td>
                        <td>${log.servicedBy || '-'}</td>
                        <td style="text-align: center;"><span class="status-badge ${statusColor}">${log.status}</span></td>
                    </tr>`;
            }).join('');

            if (reportData.length === 0) rowsHtml = `<tr><td colspan="8" style="text-align: center; padding: 20px;">ไม่พบข้อมูล</td></tr>`;

            const typeStatsHtml = Object.entries(typeStats).map(([key, val]) => `<span style="white-space: nowrap;">${key}: <strong>${val}</strong></span>`).join(' &nbsp;|&nbsp; ');

            pc.innerHTML = `
                <div class="print-report-header">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap: 12px;">
                        <div>
                            <h1 class="report-title">${title}</h1>
                            ${subTitle ? `<p class="report-subtitle">${subTitle}</p>` : ''}
                            <div class="report-meta">Generated: ${new Date().toLocaleString('th-TH')} • Printed by: ${currentUserName || '-'}</div>
                        </div>
                        <div style="text-align:right; font-size: 10pt; color:#334155;">
                            <div style="font-weight:800;">IT Service Log</div>
                            <div style="font-size:9pt; color:#64748b;">A4 ${config.orientation}</div>
                        </div>
                    </div>
                </div>
                <div class="print-report-footer">
                    <div>FM-IT-REPORT-001</div>
                    <div>CONFIDENTIAL: Internal Use Only</div>
                    <div>${config.company ? `Company: ${config.company}` : 'Company: All'}</div>
                </div>
                <div class="print-report-body">
                    <div class="stats-container">
                        <div class="stat-box"><div class="stat-value">${total}</div><div class="stat-label">ทั้งหมด</div></div>
                        <div class="stat-box"><div class="stat-value" style="color: #10b981;">${completed}</div><div class="stat-label">เสร็จสิ้น</div></div>
                        <div class="stat-box"><div class="stat-value" style="color: #f59e0b;">${pending}</div><div class="stat-label">กำลังดำเนินการ</div></div>
                        <div class="stat-box"><div class="stat-value" style="color: #ef4444;">${cancelled}</div><div class="stat-label">ยกเลิก</div></div>
                    </div>
                    <div class="type-stats"><strong>แยกตามประเภท:</strong> ${typeStatsHtml || '-'}</div>
                    <table class="report-table">
                        <thead><tr><th style="width: 4%;">No.</th><th style="width: 8%;">Date</th><th style="width: 14%;">Ticket ID</th><th style="width: 14%;">Requester</th><th style="width: 10%;">Type</th><th style="width: 28%;">Problem / Solution</th><th style="width: 12%;">Tech</th><th style="width: 10%;">Status</th></tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                    <div class="footer-sign">
                        <div class="sign-box"><div class="sign-line"></div><p>ผู้จัดทำรายงาน</p><p style="font-size: 9pt;">( ....................................................... )</p></div>
                        <div class="sign-box"><div class="sign-line"></div><p>ผู้ตรวจสอบ</p><p style="font-size: 9pt;">( ....................................................... )</p></div>
                        <div class="sign-box"><div class="sign-line"></div><p>ผู้อนุมัติ</p><p style="font-size: 9pt;">( ....................................................... )</p></div>
                    </div>
                </div>`;

            document.body.classList.add('printing-ticket');
            setTimeout(() => { window.print(); document.body.classList.remove('printing-ticket'); pc.innerHTML = ''; }, 500);
        }

        function exportLogs() {
            const co = gid('company-filter').value;
            const stat = gid('status-filter').value;
            const typ = gid('type-filter').value;
            const search = gid('search-input').value;
            
            const query = new URLSearchParams({ action: 'export_logs', company: co, status: stat, type: typ, search: search });
            window.location.href = `api.php?${query.toString()}`;
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', async () => {
            initializeThemeToggle();
            const sess = await (await fetch('api.php?action=check_session')).json();
            if(!sess.loggedin) window.location.href = 'login.html';
            userRole = sess.role;
            currentUserName = sess.display_name;
            currentUserId = sess.user_id;
            sessionStorage.setItem('user_id', sess.user_id);

            await loadInitialData();
            
            // ตรวจสอบ URL Parameter เพื่อเปิด Ticket อัตโนมัติ (เช่น จากการสแกน QR Code)
            const urlParams = new URLSearchParams(window.location.search);
            const ticketIdParam = urlParams.get('ticket_id');
            if (ticketIdParam) {
                const logExists = allLogs.some(l => l && l.id === ticketIdParam);
                if (logExists) {
                    // ใช้ showFullDetails เพื่อแสดงข้อมูลสรุป ไม่ใช่หน้าแก้ไข
                    showFullDetails(ticketIdParam);
                }
            }

            // Listeners
            gid('add-ticket-btn').addEventListener('click', () => openLogModal());
            gid('export-btn').addEventListener('click', exportLogs);
            gid('log-form').addEventListener('submit', handleLogSubmit);
            gid('form-company').addEventListener('change', populateManualDepartmentDropdown);
            document.querySelectorAll('input[name="requester-mode"]').forEach(r => r.addEventListener('change', toggleRequesterMode));
            gid('form-asset').addEventListener('input', e => searchAssets(e.target.value));
            document.addEventListener('click', e => { if(!e.target.closest('.asset-search-wrapper')) gid('asset-results').classList.add('hidden'); });
            
            ['search-input','company-filter','status-filter','type-filter'].forEach(id => gid(id).addEventListener('input', () => { currentPage = 1; renderTable(); }));
            const myToggle = gid('my-queue-toggle');
            if (myToggle) {
                myToggle.addEventListener('click', () => {
                    showMyQueueOnly = !showMyQueueOnly;
                    myToggle.classList.toggle('bg-blue-600', showMyQueueOnly);
                    myToggle.classList.toggle('text-white', showMyQueueOnly);
                    myToggle.classList.toggle('border-blue-600', showMyQueueOnly);
                    myToggle.classList.toggle('bg-white', !showMyQueueOnly);
                    myToggle.classList.toggle('dark:bg-slate-700', !showMyQueueOnly);
                    currentPage = 1;
                    renderTable();
                });
            }
            const refreshBtn = gid('refresh-btn');
            if (refreshBtn) {
                refreshBtn.addEventListener('click', async () => {
                    refreshBtn.disabled = true;
                    const oldHtml = refreshBtn.innerHTML;
                    refreshBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin text-slate-400"></i><span>กำลังโหลด</span>';
                    try { await loadInitialData(); } finally { refreshBtn.disabled = false; refreshBtn.innerHTML = oldHtml; }
                });
            }
            const clearBtn = gid('clear-filters-btn');
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    gid('search-input').value = '';
                    gid('company-filter').value = '';
                    gid('type-filter').value = '';
                    gid('status-filter').value = '';
                    showMyQueueOnly = false;
                    const myToggleBtn = gid('my-queue-toggle');
                    if (myToggleBtn) {
                        myToggleBtn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                        myToggleBtn.classList.add('bg-white', 'dark:bg-slate-700');
                    }
                    document.querySelectorAll('.stat-pill').forEach(x => x.classList.remove('active'));
                    const first = document.querySelector('.stat-pill[data-filter-value=""]');
                    if (first) first.classList.add('active');
                    currentPage = 1;
                    renderTable();
                });
            }
            document.querySelectorAll('.stat-pill').forEach(p => p.addEventListener('click', () => {
                document.querySelectorAll('.stat-pill').forEach(x => x.classList.remove('active'));
                p.classList.add('active');
                gid('status-filter').value = p.dataset.filterValue;
                currentPage = 1;
                renderTable();
            }));
            setupPrinting();

            // Back to Top Scroll Listener
            window.addEventListener('scroll', () => {
                const btn = gid('back-to-top');
                if (window.scrollY > 300) btn.classList.remove('translate-y-20', 'opacity-0');
                else btn.classList.add('translate-y-20', 'opacity-0');
            });
        });
    </script>
</body>
</html>
