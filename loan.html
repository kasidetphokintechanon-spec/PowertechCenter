<html lang="th">
<head>
    <meta charset="UTF-8">

    <link rel="manifest" href="app-manifest.json">

    <script>(function(){const t=localStorage.getItem('theme')||'light';if(t==='dark')document.documentElement.classList.add('dark','dark-theme');})();</script>
<style>
/* ════ ยืมอุปกรณ์ IT (พนักงาน) — เลือกเครื่อง + วันที่ (จองล่วงหน้าได้) / ติดตาม คืน ขยายเวลา · สีจาก token design-system ════ */
/* enterprise-theme ล็อกการเลื่อนทั้งหน้าบนจอกว้าง (ไว้ใช้กับหน้าที่มีเมนูซ้าย) — หน้านี้เลื่อนทั้งหน้าตามปกติ */
html { overflow:auto !important; height:auto !important; } body { overflow:visible !important; height:auto !important; }
body { background:var(--ptc-bg); color:var(--ptc-text); margin:0; }
.ln-tabs { display:flex; border:1px solid var(--ptc-border); border-radius:8px; overflow:hidden; margin-left:auto; }
.ln-tabs button { height:34px; padding:0 14px; border:0; background:var(--ptc-surface); color:var(--ptc-text-2); font:inherit; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; }
.ln-tabs button.on { background:var(--ptc-text); color:var(--ptc-surface); }
.ln-tabs .cnt { min-width:18px; height:18px; border-radius:9px; background:#ea580c; color:#fff; font-size:11px; display:inline-flex; align-items:center; justify-content:center; padding:0 5px; }
.wrap { max-width:1200px; margin:0 auto; padding:18px 16px 40px; }
.card { background:var(--ptc-surface); border:1px solid var(--ptc-border); border-radius:10px; }
.h { font-size:18px; font-weight:800; margin:0; } .s { font-size:12.5px; color:var(--ptc-text-muted); margin:3px 0 0; }
.btn { height:36px; padding:0 13px; border-radius:8px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-weight:700; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; white-space:nowrap; text-decoration:none; }
.btn:hover { border-color:var(--ptc-primary); }
.btn.pri { background:var(--ptc-primary); border-color:var(--ptc-primary); color:#fff; }
.btn.ok { background:#16a34a; border-color:#16a34a; color:#fff; }
.btn.lg { height:44px; font-size:14.5px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; white-space:nowrap; color:var(--c); background:color-mix(in srgb, var(--c) 13%, transparent); }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { padding:6px 12px; border-radius:99px; border:1px solid var(--ptc-border); background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
.chip.on { border-color:var(--ptc-primary); background:var(--ptc-primary-light); color:var(--ptc-primary); }
.empty { padding:36px 14px; text-align:center; color:var(--ptc-text-muted); font-size:13px; }
.empty i { font-size:24px; display:block; margin-bottom:8px; opacity:.6; }
/* เลือกเครื่อง */
.g2 { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start; }
.tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0; }
.tools input[type=search] { flex:1; min-width:180px; height:36px; border:1px solid var(--ptc-border); border-radius:8px; padding:0 12px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13px; }
.cat { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.it { padding:12px; display:flex; flex-direction:column; gap:7px; cursor:pointer; text-align:left; font:inherit; color:inherit; }
.it:hover { border-color:var(--ptc-primary); }
.it.sel { border-color:var(--ptc-primary); box-shadow:0 0 0 3px var(--ptc-primary-ring, rgba(37,99,235,.15)); }
.it.off { opacity:.55; }
.it .img { height:96px; border-radius:8px; background:var(--ptc-surface-2); display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--ptc-text-muted); overflow:hidden; }
.it .img img { width:100%; height:100%; object-fit:cover; }
.it .tx { display:flex; flex-direction:column; gap:5px; min-width:0; align-items:flex-start; } .it .tx .tl, .it .tx .tl-l { align-self:stretch; }
.it b { font-size:13.5px; } .it small { font-size:11.5px; color:var(--ptc-text-muted); overflow-wrap:anywhere; }
.tl { display:flex; gap:2px; } .tl i { flex:1; height:6px; border-radius:2px; background:#bbf7d0; }
.tl i.b { background:#fecaca; } .tl i.me { background:#bfdbfe; } .tl i.p { background:#fde68a; } .tl i.p.b { background:#f87171; }
html.dark .tl i { background:rgba(22,163,74,.45); } html.dark .tl i.b { background:rgba(220,38,38,.55); } html.dark .tl i.p { background:rgba(234,179,8,.7); }
.tl-l { display:flex; justify-content:space-between; font-size:10px; color:var(--ptc-text-muted); }
.legend { font-size:11.5px; color:var(--ptc-text-muted); margin-top:10px; display:flex; gap:12px; flex-wrap:wrap; }
.legend i { display:inline-block; width:10px; height:6px; border-radius:2px; margin-right:4px; vertical-align:middle; }
.form { padding:16px; position:sticky; top:74px; }
.f { margin-top:12px; } .f label { display:block; font-size:12px; font-weight:700; color:var(--ptc-text-2); margin-bottom:5px; }
.f input:not([type=checkbox]), .f textarea { width:100%; box-sizing:border-box; border:1px solid var(--ptc-border); border-radius:8px; padding:8px 10px; background:var(--ptc-surface); color:var(--ptc-text); font:inherit; font-size:13.5px; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.who { display:flex; gap:10px; align-items:center; padding:10px; border-radius:9px; background:var(--ptc-surface-2); font-size:12.5px; }
.av { width:30px; height:30px; border-radius:50%; background:var(--ptc-primary); color:#fff; font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.note { margin-top:10px; font-size:12.5px; font-weight:600; display:flex; gap:6px; align-items:flex-start; }
.note.ok { color:#16a34a; } .note.bad { color:#dc2626; }
.spec { margin-top:10px; padding:10px 12px; border-radius:9px; background:var(--ptc-surface-2); border:1px solid var(--ptc-border); font-size:12.5px; }
.spec b { display:block; font-size:12px; color:var(--ptc-text-2); margin-bottom:5px; }
.spec ul { margin:0; padding:0; list-style:none; display:grid; gap:3px; } .spec li { display:flex; gap:7px; align-items:baseline; overflow-wrap:anywhere; } .spec li i { color:var(--ptc-text-muted); font-size:10px; width:12px; text-align:center; flex-shrink:0; }
.acc { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; } .acc span { font-size:11px; padding:2px 8px; border-radius:6px; background:var(--ptc-surface-2); border:1px solid var(--ptc-border); }
.done { text-align:center; padding:30px 10px; } .done .ic { width:68px; height:68px; border-radius:50%; background:#f0fdf4; color:#16a34a; display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 12px; }
html.dark .done .ic { background:rgba(22,163,74,.14); }
/* ของที่ฉันยืม */
.ln { padding:14px 16px; border-bottom:1px solid var(--ptc-border); }
.ln:last-child { border-bottom:0; }
.ln-top { display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ptc-text-muted); flex-wrap:wrap; }
.ln-top .no { font-family:Consolas,monospace; font-weight:700; color:var(--ptc-primary); }
.ln-top .pill { margin-left:auto; }
.ln h3 { font-size:15px; margin:5px 0 0; }
.stp { display:flex; gap:3px; margin:10px 0 5px; } .stp i { flex:1; height:5px; border-radius:3px; background:var(--ptc-border); } .stp i.on { background:var(--ptc-primary); }
.stp.fin i.on { background:#16a34a; } .stp.off i { background:var(--ptc-border); }
.stp-l { display:flex; justify-content:space-between; font-size:10.5px; color:var(--ptc-text-muted); } .stp-l .cur { color:var(--ptc-primary); font-weight:700; }
.cta { margin-top:10px; padding:10px 12px; border-radius:9px; display:flex; gap:10px; align-items:center; font-size:13px; flex-wrap:wrap; }
.cta b { flex:1; min-width:200px; font-weight:600; }
.cta.warn { background:#fffbeb; border:1px solid #fde68a; } .cta.go { background:#eff6ff; border:1px solid #bfdbfe; } .cta.bad { background:#fef2f2; border:1px solid #fecaca; } .cta.mut { background:var(--ptc-surface-2); border:1px solid var(--ptc-border); }
html.dark .cta.warn { background:rgba(217,119,6,.1); border-color:rgba(217,119,6,.35); } html.dark .cta.go { background:rgba(37,99,235,.12); border-color:rgba(37,99,235,.35); } html.dark .cta.bad { background:rgba(220,38,38,.1); border-color:rgba(220,38,38,.35); }
details.old { margin-top:14px; } details.old summary { cursor:pointer; font-size:13px; font-weight:700; color:var(--ptc-text-2); padding:8px 0; }
.old-row { display:grid; grid-template-columns:120px 1fr 150px 90px; gap:10px; padding:8px 14px; border-top:1px solid var(--ptc-border); font-size:12.5px; }
@media (max-width:960px) { .g2 { grid-template-columns:minmax(0,1fr); } .form { position:static; } .cat { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width:640px) {
  .wrap { padding:12px 10px 30px; }
  .ln-tabs { position:fixed; top:var(--ln-nav-h, 56px); left:0; right:0; z-index:90; border-radius:0; border-width:0 0 1px; margin:0; }
  .ln-tabs button { flex:1; height:44px; }
  .wrap { padding-top:calc(44px + 12px) !important; }
  .ptc-nav-sub { display:none; }
  .cat { grid-template-columns:minmax(0,1fr); }
  .it { flex-direction:row; align-items:center; } .it .img { width:76px; height:64px; flex-shrink:0; } .it .tx { flex:1; }
  .old-row { grid-template-columns:1fr; gap:2px; }
}
</style>
</head>
<body>
<nav class="ptc-nav">
    <a href="index.html" class="nav-back" title="กลับหน้าแรก"><i class="fa fa-arrow-left"></i></a>
    <div class="ptc-nav-brand"><div class="ptc-nav-icon" style="background:#ea580c"><i class="fa fa-rotate"></i></div>
        <div><div class="ptc-nav-title">ยืมอุปกรณ์ IT</div><div class="ptc-nav-sub">จองล่วงหน้า · ติดตาม · คืน</div></div></div>
    <div class="ln-tabs"><button id="t-new" onclick="tab('new')"><i class="fa fa-plus"></i>ยืมใหม่</button><button id="t-mine" onclick="tab('mine')"><i class="fa fa-box"></i>ของที่ฉันยืม<span class="cnt" id="mine-cnt" style="display:none">0</span></button></div>
    <div id="nav-user-area"></div>
</nav>
<main class="wrap"><section id="v-new"></section><section id="v-mine" style="display:none"></section></main>

<script>
const gid = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const thD = s => s ? new Date(String(s).slice(0, 10) + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }) : '';
const initials = n => String(n || '').replace(/^(Mr\.?|Mrs\.?|Ms\.?|นาย|นางสาว|นาง)\s*/i, '').split(/\s+/).map(w => w[0] || '').join('').toUpperCase().slice(0, 2) || '?';
const STATUS_C = { requested: '#d97706', approved: '#2563eb', active: '#ea580c', returned: '#16a34a', rejected: '#64748b', cancelled: '#64748b' };
const CAT_IC = { Notebook: 'fa-laptop', Computer: 'fa-desktop', Monitor: 'fa-display', Printer: 'fa-print', Network: 'fa-wifi', UPS: 'fa-car-battery', CCTV: 'fa-video', Server: 'fa-server' };
const DAYS = 14;

let S = {}, items = [], today = ymd(new Date()), cat = '', q = '', sel = null, mine = [], legacy = [], sending = false;
let form = { start: '', end: '', noDue: false, purpose: '', contact: '' };

async function api(p) { return (await fetch('api.php?' + new URLSearchParams(p), { cache: 'no-store' })).json(); }
async function post(o) { const fd = new FormData(); Object.entries(o).forEach(([k, v]) => fd.append(k, v ?? '')); const j = await (await fetch('api.php', { method: 'POST', body: fd })).json(); if (j.status !== 'success') throw new Error(j.message || 'ไม่สำเร็จ'); return j; }

// ── ว่าง/ไม่ว่าง ──
function busyOn(it, day) { return it.bookings.find(b => b.from <= day && (!b.to || b.to >= day)); }
function rangeClash(it, a, b) { const end = b || '9999-12-31'; return it.bookings.find(x => x.from <= end && (!x.to || x.to >= a)); }
function strip(it) {
    const s = form.start, e = form.noDue ? '9999-12-31' : form.end;
    let h = '';
    for (let i = 0; i < DAYS; i++) {
        const d = addDays(today, i), bk = busyOn(it, d), inSel = sel === it.id && s && d >= s && d <= e;
        h += `<i class="${bk ? (bk.mine ? 'me' : 'b') : ''} ${inSel ? 'p' : ''}" title="${thD(d)}${bk ? (bk.mine ? ' · คุณจองไว้' : ' · ไม่ว่าง') : ' · ว่าง'}"></i>`;
    }
    return `<div class="tl">${h}</div><div class="tl-l"><span>วันนี้</span><span>+${DAYS} วัน</span></div>`;
}
function statusPill(it) {
    if (it.blocked) return `<span class="pill" style="--c:#64748b">ซ่อมอยู่</span>`;
    const now = busyOn(it, today);
    if (form.start && rangeClash(it, form.start, form.noDue ? null : form.end)) return `<span class="pill" style="--c:#dc2626">ไม่ว่างช่วงที่เลือก</span>`;
    if (form.start) return `<span class="pill" style="--c:#16a34a">ว่างช่วงที่เลือก</span>`;
    return now ? `<span class="pill" style="--c:#dc2626">${now.mine ? 'คุณยืมอยู่' : 'ไม่ว่างวันนี้'}${now.to ? ' · ถึง ' + thD(now.to) : ''}</span>` : `<span class="pill" style="--c:#16a34a">ว่างวันนี้</span>`;
}

// ── ยืมใหม่ ──
function renderNew() {
    const cats = [...new Set(items.map(i => i.category))];
    const list = items.filter(i => (!cat || i.category === cat) && (!q || (i.name + ' ' + i.equipment_id + ' ' + (i.brand || '') + ' ' + (i.model || '')).toLowerCase().includes(q)));
    const it = items.find(i => i.id === sel);
    const clash = it && form.start ? rangeClash(it, form.start, form.noDue ? null : form.end) : null;
    const badRange = form.start && !form.noDue && (!form.end || form.end < form.start);
    const canSend = it && !it.blocked && form.start && !badRange && !clash && form.purpose.trim().length >= 3 && !sending;
    const ic = i => CAT_IC[i.category] || 'fa-box';
    gid('v-new').innerHTML = items.length === 0 ? '<div class="card empty"><i class="fa fa-box-open"></i>ยังไม่มีอุปกรณ์ที่เปิดให้ยืม — ติดต่อทีม IT</div>' : `
    <div class="g2"><div>
        <h2 class="h">อยากยืมอะไร</h2><p class="s">เลือกเครื่อง แล้วเลือกวันที่ทางขวา · แถบสีบอกว่าว่าง 14 วันข้างหน้าไหม</p>
        <div class="tools"><input type="search" placeholder="ค้นหาชื่อ / รหัส / รุ่น…" value="${esc(q)}" oninput="q=this.value.toLowerCase();renderNew();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
            <div class="chips"><button class="chip ${cat === '' ? 'on' : ''}" onclick="cat='';renderNew()">ทั้งหมด ${items.length}</button>${cats.map(c => `<button class="chip ${cat === c ? 'on' : ''}" onclick="cat=${esc(JSON.stringify(c))};renderNew()"><i class="fa ${CAT_IC[c] || 'fa-box'}"></i> ${esc(c)} ${items.filter(i => i.category === c).length}</button>`).join('')}</div></div>
        <div class="cat">${list.map(i => `<button type="button" class="card it ${sel === i.id ? 'sel' : ''} ${i.blocked ? 'off' : ''}" onclick="pick(${i.id})">
            <div class="img">${i.image_url ? `<img src="${esc(i.image_url)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'fa ${ic(i)}'}))">` : `<i class="fa ${ic(i)}"></i>`}</div>
            <span class="tx">${statusPill(i)}<b>${esc(i.name)}</b><small>${esc(i.equipment_id)}${i.company ? ' · ' + esc(i.company) : ''}${i.accessories.length ? ' · มี ' + esc(i.accessories.join(', ')) : ''}</small>${strip(i)}</span></button>`).join('') || '<div class="empty">ไม่พบอุปกรณ์</div>'}</div>
        <div class="legend"><span><i style="background:#bbf7d0"></i>ว่าง</span><span><i style="background:#fde68a"></i>ช่วงที่คุณเลือก</span><span><i style="background:#fecaca"></i>มีคนยืม/จอง</span><span><i style="background:#bfdbfe"></i>ของคุณ</span></div>
    </div>
    <div class="card form">${it ? `<h3 class="h" style="font-size:15px">ขอยืม ${esc(it.name)}</h3><p class="s">${esc(it.equipment_id)}${it.location ? ' · อยู่ที่ ' + esc(it.location) : ''}</p>${specBox(it)}${it.accessories.length ? `<div class="acc">${it.accessories.map(a => `<span>${esc(a)}</span>`).join('')}</div>` : ''}`
        : '<h3 class="h" style="font-size:15px">เลือกเครื่องทางซ้ายก่อน</h3><p class="s">หรือเลือกวันที่ก่อนก็ได้ — เครื่องที่ว่างจะขึ้นป้ายเขียว</p>'}
        <div class="f"><div class="two"><div><label>วันที่รับของ</label><input type="date" min="${today}" value="${esc(form.start)}" onchange="form.start=this.value;if(form.end&&form.end<form.start)form.end=form.start;renderNew()"></div>
            <div><label>วันที่คืน</label><input type="date" min="${esc(form.start || today)}" value="${esc(form.end)}" ${form.noDue ? 'disabled' : ''} onchange="form.end=this.value;renderNew()"></div></div>
            <label style="display:flex;gap:7px;align-items:center;font-weight:500;margin-top:8px;cursor:pointer"><input type="checkbox" ${form.noDue ? 'checked' : ''} onchange="form.noDue=this.checked;renderNew()"> ยืมระยะยาว ไม่มีกำหนดคืน</label></div>
        <div class="f"><label>ใช้ทำอะไร</label><textarea id="f-purpose" rows="2" placeholder="เช่น อบรมพนักงานใหม่ ห้องประชุม 2" oninput="form.purpose=this.value;syncBtn()">${esc(form.purpose)}</textarea></div>
        <div class="f"><label>เบอร์ติดต่อ (ไม่บังคับ)</label><input type="tel" value="${esc(form.contact)}" placeholder="ว่างไว้ = ใช้เบอร์ในระบบ" oninput="form.contact=this.value"></div>
        <div class="f"><label>ผู้ยืม</label><div class="who"><span class="av">${esc(initials(S.display_name))}</span><div><b>${esc(S.display_name || '')}</b><br><span style="color:var(--ptc-text-muted)">${esc(S.primary_department || '')}${S.company ? ' · ' + esc(S.company) : ''} · จากบัญชีที่ล็อกอิน</span></div></div></div>
        ${it && it.blocked ? '<div class="note bad"><i class="fa fa-wrench"></i>เครื่องนี้อยู่ระหว่างซ่อม ยืมไม่ได้ตอนนี้</div>'
            : clash ? `<div class="note bad"><i class="fa fa-circle-xmark"></i>ไม่ว่างช่วงนี้ (${thD(clash.from)}${clash.to ? '–' + thD(clash.to) : ' เป็นต้นไป'}) — เลือกวันอื่นหรือเครื่องอื่น</div>`
            : badRange ? '<div class="note bad"><i class="fa fa-circle-xmark"></i>เลือกวันที่คืนให้ไม่ก่อนวันที่รับ</div>'
            : it && form.start ? '<div class="note ok"><i class="fa fa-circle-check"></i>ว่างช่วงนี้ · ทีม IT จะอนุมัติภายในวันทำงาน</div>' : ''}
        <button class="btn ok lg" id="send" style="width:100%;margin-top:12px" ${canSend ? '' : 'disabled'} onclick="send()"><i class="fa fa-paper-plane"></i> ส่งคำขอยืม</button></div>
    </div>`;
}
// สเปกพิมพ์เป็นข้อความเดียวคั่น / หรือขึ้นบรรทัดใหม่ — แตกเป็นรายการให้พนักงานอ่านก่อนตัดสินใจยืม
function specIcon(t) { t = t.toLowerCase(); return /ram|ddr|memory/.test(t) ? 'fa-memory' : /ssd|hdd|nvme|storage|\d+\s*(gb|tb)\b/.test(t) ? 'fa-hard-drive' : /\bwin|macos|linux|ubuntu/.test(t) ? 'fa-compact-disc' : /i[3579]-|ryzen|cpu|core|celeron|ghz/.test(t) ? 'fa-microchip' : /จอ|inch|fhd|display/.test(t) ? 'fa-display' : 'fa-circle-check'; }
function specBox(it) {
    const parts = String(it.spec_details || '').split(/\s*[\/\n,]\s*/).map(x => x.trim()).filter(Boolean);
    const head = [it.brand, it.model].filter(Boolean).join(' ');
    if (!parts.length && !head) return '';
    return `<div class="spec"><b>สเปก${head ? ' · ' + esc(head) : ''}</b>${parts.length ? `<ul>${parts.map(x => `<li><i class="fa ${specIcon(x)}"></i>${esc(x)}</li>`).join('')}</ul>` : '<span class="muted" style="color:var(--ptc-text-muted)">ยังไม่ได้บันทึกสเปก</span>'}</div>`;
}
function syncBtn() {
    const it = items.find(i => i.id === sel), b = gid('send'); if (!b) return;
    const clash = it && form.start ? rangeClash(it, form.start, form.noDue ? null : form.end) : null;
    b.disabled = !(it && !it.blocked && form.start && !(form.start && !form.noDue && (!form.end || form.end < form.start)) && !clash && form.purpose.trim().length >= 3 && !sending);
}
function pick(id) {
    sel = id;
    if (!form.start) { form.start = today; form.end = addDays(today, 1); }
    renderNew();
    if (window.innerWidth < 960) document.querySelector('.form')?.scrollIntoView({ behavior: 'smooth' });
}
async function send() {
    const it = items.find(i => i.id === sel); if (!it) return;
    sending = true; syncBtn();
    try {
        const j = await post({ action: 'loan_request', asset_id: it.id, start_date: form.start, end_date: form.noDue ? '' : form.end, no_due: form.noDue ? 1 : '', purpose: form.purpose.trim(), contact: form.contact.trim() });
        gid('v-new').innerHTML = `<div class="card done"><div class="ic"><i class="fa fa-check"></i></div><h2 class="h">ส่งคำขอยืมแล้ว</h2>
            <p class="s" style="font-size:14px;margin-top:6px">เลขที่ <b style="color:var(--ptc-primary);font-family:Consolas">${esc(j.code)}</b> · ${esc(it.name)}</p>
            <p style="font-size:14px;color:var(--ptc-text-2);margin:14px 0">ทีม IT จะอนุมัติภายในวันทำงาน แล้วไปรับของที่ห้อง IT ตามวันที่เลือก (${thD(form.start)})</p>
            <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri lg" onclick="tab('mine')">ดูของที่ฉันยืม</button><button class="btn lg" onclick="reset()">ยืมอย่างอื่น</button></div></div>`;
        form = { start: '', end: '', noDue: false, purpose: '', contact: '' }; sel = null;
        load();
    } catch (e) { ptcAlert('error', 'ส่งไม่สำเร็จ', e.message); }
    finally { sending = false; syncBtn(); }
}
function reset() { renderNew(); window.scrollTo(0, 0); }

// ── ของที่ฉันยืม ──
function stepOf(l) { return { requested: 1, approved: 2, active: 4, returned: 5 }[l.status] || 1; }
function stepper(l) {
    const n = stepOf(l), off = ['rejected', 'cancelled'].includes(l.status), done = l.status === 'returned';
    return `<div class="stp ${done ? 'fin' : off ? 'off' : ''}">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n && !off ? 'on' : ''}"></i>`).join('')}</div>
        <div class="stp-l">${['ขอยืม', 'อนุมัติ', 'รับของ', 'กำลังยืม', 'คืนแล้ว'].map((s, i) => `<span class="${i + 1 === n && !off && !done ? 'cur' : ''}">${s}</span>`).join('')}</div>`;
}
function cta(l) {
    const id = l.id, eq = esc(JSON.stringify(l.equipment_id));
    if (l.status === 'requested') return `<div class="cta mut"><i class="fa fa-hourglass-half" style="color:#d97706"></i><b>รอทีม IT อนุมัติ</b><button class="btn" onclick="cancelLoan(${id})">ยกเลิกคำขอ</button></div>`;
    if (l.status === 'approved') return `<div class="cta go"><i class="fa fa-box" style="color:#2563eb"></i><b>อนุมัติแล้ว — รับของได้ตั้งแต่ ${thD(l.start_date)} ที่ห้อง IT (เซ็นรับตอนรับของ)</b><button class="btn" onclick="cancelLoan(${id})">ยกเลิก</button></div>`;
    if (l.status === 'active') {
        const ext = l.extend_status === 'pending' ? `<span class="pill" style="--c:#2563eb">ขอขยายถึง ${thD(l.extend_to)} — รอ IT</span>` : `<button class="btn" onclick="extend(${id})">ขอขยายเวลา</button>`;
        const fix = `<a class="btn" href="request.html?asset_id=${encodeURIComponent(l.equipment_id)}"><i class="fa fa-wrench"></i> แจ้งปัญหา</a>`;
        if (l.overdue_days) return `<div class="cta bad"><i class="fa fa-triangle-exclamation" style="color:#dc2626"></i><b>เกินกำหนดคืน ${l.overdue_days} วัน — กรุณานำมาคืนที่ห้อง IT</b>${ext}${fix}</div>`;
        if (!l.end_date) return `<div class="cta mut"><i class="fa fa-infinity"></i><b>ยืมระยะยาว ไม่มีกำหนดคืน</b>${fix}</div>`;
        return `<div class="cta ${l.days_left <= 1 ? 'warn' : 'mut'}"><i class="fa fa-clock" style="color:#d97706"></i><b>${l.days_left === 0 ? 'ครบกำหนดคืนวันนี้' : l.days_left === 1 ? 'ครบกำหนดคืนพรุ่งนี้' : 'เหลือ ' + l.days_left + ' วัน'} (${thD(l.end_date)}) — คืนที่ห้อง IT</b>${ext}${fix}</div>`;
    }
    if (l.status === 'rejected') return `<div class="cta mut"><i class="fa fa-circle-xmark" style="color:#64748b"></i><b>ไม่อนุมัติ: ${esc(l.reject_reason || '-')}</b></div>`;
    if (l.status === 'returned') return `<div class="cta mut"><i class="fa fa-circle-check" style="color:#16a34a"></i><b>คืนแล้ว ${thD(l.return_at)} · สภาพ${{ ok: 'ปกติ', minor: 'มีรอยเล็กน้อย', broken: 'เสีย' }[l.return_condition] || ''}</b><button class="btn" onclick="printLoan(${id})"><i class="fa fa-print"></i> ใบยืม-คืน</button></div>`;
    return '';
}
function renderMine() {
    const open = mine.filter(l => ['requested', 'approved', 'active'].includes(l.status));
    gid('mine-cnt').textContent = open.length; gid('mine-cnt').style.display = open.length ? '' : 'none';
    gid('v-mine').innerHTML = `<div class="card">${mine.length ? mine.map(l => `<div class="ln"><div class="ln-top"><span class="no">${esc(l.code)}</span>· ${esc(l.equipment_id)} · ${thD(l.start_date)}${l.end_date ? '–' + thD(l.end_date) : ' (ไม่มีกำหนด)'}<span class="pill" style="--c:${l.overdue_days ? '#dc2626' : STATUS_C[l.status]}">${l.overdue_days ? 'เกินกำหนด' : esc(l.status_th)}</span></div>
        <h3>${esc(l.equipment_name)}</h3>${stepper(l)}${cta(l)}</div>`).join('') : '<div class="empty"><i class="fa fa-box-open"></i>ยังไม่เคยยืม — กด "ยืมใหม่" ด้านบน</div>'}</div>
        ${legacy.length ? `<details class="old card" style="padding:0 14px"><summary>ประวัติจากระบบเดิม (${legacy.length})</summary>${legacy.map(o => `<div class="old-row"><span>${esc(o.equipment_id)}</span><b style="font-weight:600">${esc(o.equipment_name)}</b><span class="s" style="margin:0">${thD(o.lend_date)} – ${o.return_date ? thD(o.return_date) : 'ยังไม่คืน'}</span><span class="s" style="margin:0">${esc(o.return_condition || '')}</span></div>`).join('')}</details>` : ''}`;
}
async function cancelLoan(id) {
    const { isConfirmed } = await ptcSwal().fire({ title: 'ยกเลิกคำขอยืมนี้?', showCancelButton: true, confirmButtonText: 'ยกเลิกคำขอ', cancelButtonText: 'ไม่ยกเลิก' });
    if (!isConfirmed) return;
    try { await post({ action: 'loan_cancel', id }); ptcToast('success', 'ยกเลิกแล้ว'); load(); } catch (e) { ptcAlert('error', 'ไม่สำเร็จ', e.message); }
}
async function extend(id) {
    const l = mine.find(x => x.id === id); if (!l) return;
    const min = addDays(l.end_date && l.end_date > today ? l.end_date : today, 1);
    const { value, isConfirmed } = await ptcSwal().fire({ title: 'ขอขยายเวลาคืน', focusConfirm: false, showCancelButton: true, confirmButtonText: 'ส่งคำขอ', cancelButtonText: 'ยกเลิก',
        html: `<div style="text-align:left;display:grid;gap:10px"><label style="font-size:13px;font-weight:700">ขอคืนวันที่<input id="x-to" type="date" min="${min}" value="${min}" style="width:100%;box-sizing:border-box;margin-top:4px;padding:8px;border:1px solid #e2e8f0;border-radius:8px;font:inherit"></label>
            <label style="font-size:13px;font-weight:700">เหตุผล<textarea id="x-r" rows="2" style="width:100%;box-sizing:border-box;margin-top:4px;padding:8px;border:1px solid #e2e8f0;border-radius:8px;font:inherit" placeholder="เช่น งานยังไม่เสร็จ"></textarea></label></div>`,
        preConfirm: () => { const to = gid('x-to').value, r = gid('x-r').value.trim(); if (!to || !r) return Swal.showValidationMessage('ใส่วันที่และเหตุผล'); return { to, r }; } });
    if (!isConfirmed) return;
    try { await post({ action: 'loan_extend', id, to: value.to, reason: value.r }); ptcToast('success', 'ส่งคำขอขยายเวลาแล้ว', 'รอทีม IT ตอบ'); load(); } catch (e) { ptcAlert('error', 'ไม่สำเร็จ', e.message); }
}
async function printLoan(id) {
    try { const j = await api({ action: 'loan_get', id }); if (j.status !== 'success') throw new Error(j.message); LoanPrint.preview(j.loan); } catch (e) { ptcAlert('error', 'พิมพ์ไม่สำเร็จ', e.message); }
}

// ── เริ่มต้น ──
function syncNavH() { const n = document.querySelector('.ptc-nav'); if (n) document.documentElement.style.setProperty('--ln-nav-h', n.getBoundingClientRect().bottom + 'px'); }
window.addEventListener('resize', syncNavH);
function tab(t) {
    syncNavH();
    gid('v-new').style.display = t === 'new' ? '' : 'none'; gid('v-mine').style.display = t === 'mine' ? '' : 'none';
    gid('t-new').classList.toggle('on', t === 'new'); gid('t-mine').classList.toggle('on', t === 'mine');
    try { const u = new URL(location.href); u.searchParams.set('tab', t); history.replaceState(null, '', u); } catch (_) {}
    if (t === 'new' && !gid('v-new').innerHTML) renderNew();
    window.scrollTo(0, 0);
}
async function load() {
    const [c, m] = await Promise.all([api({ action: 'loan_catalog' }).catch(() => ({})), api({ action: 'loan_my' }).catch(() => ({}))]);
    items = c.items || []; if (c.today) today = c.today;
    mine = m.data || []; legacy = m.legacy || [];
    if (!gid('v-new').querySelector('.done')) renderNew();
    renderMine();
}
(async function init() {
    try { S = await (await fetch('api.php?action=check_session', { cache: 'no-store' })).json(); } catch (_) {}
    if (!S.loggedin) { location.href = 'login.html?returnUrl=' + encodeURIComponent(location.pathname.split('/').pop() + location.search); return; }
    const qs = new URLSearchParams(location.search);
    await load();
    const want = +qs.get('asset'); if (want && items.some(i => i.id === want)) pick(want);
    tab(qs.get('tab') === 'mine' ? 'mine' : 'new');
})();
</script>
