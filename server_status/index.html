<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Status Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    tailwind.config = { theme: { fontFamily: { sans: ['Kanit','sans-serif'] } } };
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <div class="max-w-6xl mx-auto p-6 space-y-6">
    <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-2xl font-bold">Server Status Monitor</h1>
        <div class="text-sm text-slate-500">จัดการ IP และดูประวัติการเชื่อมต่อ</div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-sm text-slate-500">โปรไฟล์บริษัท</span>
        <select id="profileSelect" class="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
          <option value="PTA">PTA</option>
          <option value="PT4">PT4</option>
          <option value="PTE">PTE</option>
        </select>
      </div>
    </div>

    <div class="bg-white rounded-2xl shadow border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Dashboard สรุปสถานะปัจจุบัน</h2>
        <div class="text-xs text-slate-500">ข้อมูลจากการเช็คล่าสุดของแต่ละบริษัท</div>
      </div>
      <div id="dashboardSummary" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
    </div>

    <div class="bg-white rounded-2xl shadow border border-slate-200 p-5">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4">
        <div>
          <h2 class="text-lg font-semibold">จัดการกลุ่มและ IP</h2>
          <div id="lastCheck" class="text-xs text-slate-500 mt-1">สถานะออนไลน์ล่าสุด: ยังไม่ตรวจสอบ</div>
        </div>
        <div class="flex flex-wrap gap-2 items-center">
          <label class="flex items-center gap-2 text-sm text-slate-600">
            <input id="allModeToggle" type="checkbox" class="accent-emerald-600">
            โหมดดูทั้งหมด
          </label>
          <button id="checkAllBtn" class="px-4 py-2 rounded-lg bg-emerald-600 text-white font-semibold hover:bg-emerald-700">ตรวจสอบทั้งหมด</button>
          <button id="saveBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700">บันทึก</button>
        </div>
      </div>
      <div id="allFilters" class="hidden flex flex-wrap gap-2 mb-4">
        <input id="filterText" class="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white" placeholder="ค้นหา (ชื่อ/IP)">
        <select id="filterType" class="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
          <option value="all">ทุกประเภท</option>
          <option value="server">Server</option>
          <option value="hyperv">Hyper-V</option>
          <option value="print">Print</option>
          <option value="cctv">CCTV</option>
          <option value="internet">Internet</option>
        </select>
        <select id="filterStatus" class="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
          <option value="all">ทุกสถานะ</option>
          <option value="online">ONLINE</option>
          <option value="offline">OFFLINE</option>
          <option value="unknown">ยังไม่ตรวจสอบ</option>
        </select>
        <select id="filterTime" class="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
          <option value="all">ทุกช่วงเวลา</option>
          <option value="15m">15 นาทีล่าสุด</option>
          <option value="1h">1 ชั่วโมงล่าสุด</option>
          <option value="24h">24 ชั่วโมงล่าสุด</option>
          <option value="7d">7 วันล่าสุด</option>
        </select>
        <select id="sortBy" class="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
          <option value="name_asc">ชื่อ (A-Z)</option>
          <option value="name_desc">ชื่อ (Z-A)</option>
          <option value="ip_asc">IP (น้อยไปมาก)</option>
          <option value="ip_desc">IP (มากไปน้อย)</option>
          <option value="status">สถานะ</option>
          <option value="time_desc">เวลาล่าสุด</option>
          <option value="time_asc">เวลาเก่าสุด</option>
        </select>
      </div>
      <div id="groupContainer" class="space-y-6"></div>
    </div>

    <div class="bg-white rounded-2xl shadow border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">แจ้งเตือนล่าสุด</h2>
        <button id="refreshAlertsBtn" class="px-4 py-2 rounded-lg bg-slate-700 text-white font-semibold hover:bg-slate-800">รีเฟรช</button>
      </div>
      <div id="alertList" class="space-y-2 text-sm text-slate-600"></div>
    </div>

    <div class="bg-white rounded-2xl shadow border border-slate-200 p-5">
      <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between mb-4">
        <h2 class="text-lg font-semibold">รายงานประจำเดือน</h2>
        <div class="flex items-center gap-2">
          <span class="text-sm text-slate-500">เดือน</span>
          <input id="reportMonth" type="month" class="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
        </div>
      </div>
      <div id="reportSummary" class="text-sm text-slate-600"></div>
    </div>

    <div class="bg-white rounded-2xl shadow border border-slate-200 p-5">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">ประวัติการตรวจสอบ</h2>
        <button id="refreshLogsBtn" class="px-4 py-2 rounded-lg bg-slate-700 text-white font-semibold hover:bg-slate-800">รีเฟรช</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-slate-500 border-b">
              <th class="py-2 pr-4">เวลา</th>
              <th class="py-2 pr-4">โปรไฟล์</th>
              <th class="py-2 pr-4">กลุ่ม</th>
              <th class="py-2 pr-4">ผลลัพธ์</th>
            </tr>
          </thead>
          <tbody id="logTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API = 'api.php';
    let configAll = { profiles: { PTA: { groups: { PTA: [], PT4: [], PTE: [] } }, PT4: { groups: { PTA: [], PT4: [], PTE: [] } }, PTE: { groups: { PTA: [], PT4: [], PTE: [] } } } };
    let config = { groups: { PTA: [], PT4: [], PTE: [] } };
    let statusByKey = {};
    let lastCheckedAt = '';
    let currentProfile = localStorage.getItem('server_status_profile') || 'PTA';
    let allMode = localStorage.getItem('server_status_all_mode') === '1';
    let logsData = [];
    const PAGE_SIZE = 8;
    const pageState = {};
    const TYPE_LABELS = {
      server: 'Server',
      hyperv: 'Hyper-V',
      print: 'Print',
      cctv: 'CCTV',
      internet: 'Internet'
    };
    const TYPE_ICONS = {
      server: '🖥️',
      hyperv: '🧩',
      print: '🖨️',
      cctv: '🎥',
      internet: '🌐'
    };

    const gid = (id) => document.getElementById(id);

    function makeKey(group, item) {
      return `${group}::${item?.name || ''}::${item?.ip || ''}::${item?.type || 'server'}`;
    }

    function getProfileGroups(profile) {
      const profileData = configAll.profiles[profile];
      if (!profileData || !profileData.groups) return { PTA: [], PT4: [], PTE: [] };
      return profileData.groups;
    }

    function normalizeItem(item) {
      let type = (item?.type || 'server').toLowerCase();
      if (type === 'printer') type = 'print';
      const details = item?.details && typeof item.details === 'object' && !Array.isArray(item.details) ? item.details : {};
      return {
        name: item?.name || '',
        ip: item?.ip || '',
        type: ['server', 'hyperv', 'print', 'cctv', 'internet'].includes(type) ? type : 'server',
        details
      };
    }

    function getPageKey(profile, group, section) {
      return `${profile}::${group}::${section}`;
    }

    function getPageState(key) {
      return pageState[key] || 1;
    }

    function setPageState(key, value) {
      pageState[key] = value;
    }

    function formatTime(value) {
      if (!value) return '-';
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return '-';
      return d.toLocaleString('th-TH');
    }

    function applyFilters(items) {
      const text = gid('filterText').value.trim().toLowerCase();
      const type = gid('filterType').value;
      const status = gid('filterStatus').value;
      const timeFilter = gid('filterTime').value;
      let timeCutoff = null;
      if (timeFilter === '15m') timeCutoff = Date.now() - 15 * 60 * 1000;
      if (timeFilter === '1h') timeCutoff = Date.now() - 60 * 60 * 1000;
      if (timeFilter === '24h') timeCutoff = Date.now() - 24 * 60 * 60 * 1000;
      if (timeFilter === '7d') timeCutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
      let result = items.filter(item => {
        const matchText = !text || item.name.toLowerCase().includes(text) || item.ip.toLowerCase().includes(text);
        const matchType = type === 'all' || item.type === type;
        let matchStatus = true;
        if (status !== 'all') {
          if (status === 'online') matchStatus = item.online === true;
          else if (status === 'offline') matchStatus = item.online === false;
          else if (status === 'unknown') matchStatus = item.online === undefined;
        }
        let matchTime = true;
        if (timeCutoff !== null) {
          const t = item.checkedAt ? new Date(item.checkedAt).getTime() : 0;
          matchTime = t >= timeCutoff;
        }
        return matchText && matchType && matchStatus && matchTime;
      });
      const sortBy = gid('sortBy').value;
      result.sort((a, b) => {
        if (sortBy === 'name_asc') return a.name.localeCompare(b.name);
        if (sortBy === 'name_desc') return b.name.localeCompare(a.name);
        if (sortBy === 'ip_asc') return a.ip.localeCompare(b.ip);
        if (sortBy === 'ip_desc') return b.ip.localeCompare(a.ip);
        if (sortBy === 'status') {
          const as = a.online === true ? 0 : a.online === false ? 1 : 2;
          const bs = b.online === true ? 0 : b.online === false ? 1 : 2;
          return as - bs;
        }
        if (sortBy === 'time_desc') {
          const at = a.checkedAt ? new Date(a.checkedAt).getTime() : 0;
          const bt = b.checkedAt ? new Date(b.checkedAt).getTime() : 0;
          return bt - at;
        }
        if (sortBy === 'time_asc') {
          const at = a.checkedAt ? new Date(a.checkedAt).getTime() : 0;
          const bt = b.checkedAt ? new Date(b.checkedAt).getTime() : 0;
          return at - bt;
        }
        return 0;
      });
      return result;
    }

    function updateDetailVisibility(container, type) {
      container.querySelectorAll('.detail-field').forEach(el => {
        const allow = el.getAttribute('data-type') === type;
        el.classList.toggle('hidden', !allow);
      });
    }

    function createRow(group, idx, item) {
      const normalized = normalizeItem(item);
      const key = makeKey(group, normalized);
      const status = statusByKey[key];
      const statusDot = status ? (status.online ? 'bg-emerald-500' : 'bg-red-500') : 'bg-slate-300';
      const statusText = status ? (status.online ? 'ONLINE' : 'OFFLINE') : 'ยังไม่ตรวจสอบ';
      const icon = TYPE_ICONS[normalized.type] || '🖥️';
      const row = document.createElement('div');
      row.className = 'bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-3';
      row.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2 items-center">
          <div class="md:col-span-3 flex items-center gap-2">
            <span class="text-base">${icon}</span>
            <input class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" placeholder="ชื่อเครื่อง" value="${normalized.name}">
          </div>
          <div class="md:col-span-3">
            <input class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" placeholder="IP หรือ Hostname" value="${normalized.ip}">
          </div>
          <div class="md:col-span-2">
            <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
              <option value="server" ${normalized.type === 'server' ? 'selected' : ''}>Server</option>
              <option value="hyperv" ${normalized.type === 'hyperv' ? 'selected' : ''}>Hyper-V</option>
              <option value="print" ${normalized.type === 'print' ? 'selected' : ''}>Print</option>
              <option value="cctv" ${normalized.type === 'cctv' ? 'selected' : ''}>CCTV</option>
              <option value="internet" ${normalized.type === 'internet' ? 'selected' : ''}>Internet</option>
            </select>
          </div>
          <div class="md:col-span-2 flex items-center gap-2 text-sm">
            <span class="inline-block w-2.5 h-2.5 rounded-full ${statusDot}"></span>
            <span class="text-slate-600">${statusText}</span>
          </div>
          <div class="md:col-span-2 flex justify-end">
            <button class="px-3 py-2 rounded-md bg-red-100 text-red-600 text-sm font-semibold hover:bg-red-200">ลบ</button>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2 text-sm">
          <div class="md:col-span-3 detail-field" data-type="server">
            <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white" data-detail-key="serverType">
              <option value="">ประเภทเซิร์ฟเวอร์</option>
              <option value="Physical">Physical</option>
              <option value="Virtual">Virtual</option>
            </select>
          </div>
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="server" data-detail-key="cpu" placeholder="CPU">
          <input class="md:col-span-2 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="server" data-detail-key="ram" placeholder="RAM">
          <input class="md:col-span-2 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="server" data-detail-key="storage" placeholder="Storage">
          <input class="md:col-span-2 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="server" data-detail-key="os" placeholder="OS">
          <input class="md:col-span-12 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="server" data-detail-key="roles" placeholder="บทบาท/บริการหลัก">

          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="hyperv" data-detail-key="hypervVersion" placeholder="Hyper-V Version">
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="hyperv" data-detail-key="vmCount" placeholder="จำนวน VM">
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="hyperv" data-detail-key="resource" placeholder="การจัดสรรทรัพยากร">
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="hyperv" data-detail-key="network" placeholder="เครือข่าย">

          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="print" data-detail-key="brand" placeholder="ยี่ห้อ">
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="print" data-detail-key="model" placeholder="รุ่น">
          <select class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm bg-white detail-field" data-type="print" data-detail-key="printerType">
            <option value="">ประเภทเครื่องพิมพ์</option>
            <option value="Laser">Laser</option>
            <option value="Inkjet">Inkjet</option>
          </select>
          <select class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm bg-white detail-field" data-type="print" data-detail-key="connection">
            <option value="">การเชื่อมต่อ</option>
            <option value="Network">Network</option>
            <option value="USB">USB</option>
          </select>
          <input class="md:col-span-12 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="print" data-detail-key="functions" placeholder="ฟังก์ชัน (พิมพ์/สแกน/แฟกซ์)">

          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="cctv" data-detail-key="cameraCount" placeholder="จำนวนกล้อง">
          <select class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm bg-white detail-field" data-type="cctv" data-detail-key="cameraType">
            <option value="">ประเภทกล้อง</option>
            <option value="Analog">Analog</option>
            <option value="IP">IP</option>
          </select>
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="cctv" data-detail-key="resolution" placeholder="ความละเอียด">
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="cctv" data-detail-key="recorder" placeholder="ระบบบันทึกภาพ">

          <select class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm bg-white detail-field" data-type="internet" data-detail-key="linkType">
            <option value="">ประเภทการเชื่อมต่อ</option>
            <option value="Fiber">Fiber</option>
            <option value="ADSL">ADSL</option>
          </select>
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="internet" data-detail-key="speedDown" placeholder="Download">
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="internet" data-detail-key="speedUp" placeholder="Upload">
          <input class="md:col-span-3 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="internet" data-detail-key="provider" placeholder="ผู้ให้บริการ">
          <input class="md:col-span-12 border border-slate-300 rounded-md px-3 py-2 text-sm detail-field" data-type="internet" data-detail-key="networkConfig" placeholder="การตั้งค่าเครือข่าย">
        </div>
      `;
      const inputs = row.querySelectorAll('input');
      const select = row.querySelector('select');
      const detailInputs = row.querySelectorAll('[data-detail-key]');
      inputs[0].addEventListener('input', (e) => config.groups[group][idx].name = e.target.value);
      inputs[1].addEventListener('input', (e) => config.groups[group][idx].ip = e.target.value);
      select.addEventListener('change', (e) => {
        config.groups[group][idx].type = e.target.value;
        updateDetailVisibility(row, e.target.value);
        renderGroups();
      });
      detailInputs.forEach((el) => {
        const keyName = el.getAttribute('data-detail-key');
        el.value = normalized.details[keyName] || '';
        el.addEventListener('input', (e) => {
          if (!config.groups[group][idx].details) config.groups[group][idx].details = {};
          config.groups[group][idx].details[keyName] = e.target.value;
        });
      });
      updateDetailVisibility(row, normalized.type);
      row.querySelector('button').addEventListener('click', () => {
        config.groups[group].splice(idx, 1);
        renderGroups();
      });
      return row;
    }

    function createAllRow(profile, group, idx, item) {
      const normalized = normalizeItem(item);
      const key = makeKey(group, normalized);
      const status = statusByKey[key];
      const statusDot = status ? (status.online ? 'bg-emerald-500' : 'bg-red-500') : 'bg-slate-300';
      const statusText = status ? (status.online ? 'ONLINE' : 'OFFLINE') : 'ยังไม่ตรวจสอบ';
      const icon = TYPE_ICONS[normalized.type] || '🖥️';
      const row = document.createElement('div');
      row.className = 'bg-slate-50 border border-slate-200 rounded-lg p-3 space-y-3';
      row.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2 items-center">
          <div class="md:col-span-3 flex items-center gap-2">
            <span class="text-base">${icon}</span>
            <input class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" placeholder="ชื่อเครื่อง" value="${normalized.name}">
          </div>
          <div class="md:col-span-3">
            <input class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm" placeholder="IP หรือ Hostname" value="${normalized.ip}">
          </div>
          <div class="md:col-span-2">
            <select class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm bg-white">
              <option value="server" ${normalized.type === 'server' ? 'selected' : ''}>Server</option>
              <option value="hyperv" ${normalized.type === 'hyperv' ? 'selected' : ''}>Hyper-V</option>
              <option value="print" ${normalized.type === 'print' ? 'selected' : ''}>Print</option>
              <option value="cctv" ${normalized.type === 'cctv' ? 'selected' : ''}>CCTV</option>
              <option value="internet" ${normalized.type === 'internet' ? 'selected' : ''}>Internet</option>
            </select>
          </div>
          <div class="md:col-span-2 flex items-center gap-2 text-sm">
            <span class="inline-block w-2.5 h-2.5 rounded-full ${statusDot}"></span>
            <span class="text-slate-600">${statusText}</span>
          </div>
          <div class="md:col-span-2 flex justify-end">
            <button class="px-3 py-2 rounded-md bg-red-100 text-red-600 text-sm font-semibold hover:bg-red-200">ลบ</button>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-12 gap-2 text-sm">
          <div class="md:col-span-3 detail-field" data-type="server">

    function buildItems(listRef, profile, group) {
      return listRef.map((item, idx) => {
        const normalized = normalizeItem(item);
        const key = makeKey(group, normalized);
        const status = statusByKey[key] || {};
        return {
          ...normalized,
          originalIndex: idx,
          online: status.online,
          checkedAt: status.checkedAt,
          profile,
          group
        };
      });
    }

    function paginateItems(items, key) {
      const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
      let page = getPageState(key);
      if (page > totalPages) page = totalPages;
      if (page < 1) page = 1;
      setPageState(key, page);
      const start = (page - 1) * PAGE_SIZE;
      const slice = items.slice(start, start + PAGE_SIZE);
      return { slice, page, totalPages };
    }

    function renderPager(key, page, totalPages) {
      if (totalPages <= 1) return document.createElement('div');
      const wrap = document.createElement('div');
      wrap.className = 'flex items-center justify-between text-xs text-slate-500';
      const info = document.createElement('div');
      info.textContent = `หน้า ${page}/${totalPages}`;
      const actions = document.createElement('div');
      actions.className = 'flex gap-2';
      const prev = document.createElement('button');
      prev.className = 'px-2 py-1 rounded border border-slate-200';
      prev.textContent = 'ก่อนหน้า';
      prev.disabled = page <= 1;
      prev.addEventListener('click', () => {
        setPageState(key, page - 1);
        renderGroups();
      });
      const next = document.createElement('button');
      next.className = 'px-2 py-1 rounded border border-slate-200';
      next.textContent = 'ถัดไป';
      next.disabled = page >= totalPages;
      next.addEventListener('click', () => {
        setPageState(key, page + 1);
        renderGroups();
      });
      actions.appendChild(prev);
      actions.appendChild(next);
      wrap.appendChild(info);
      wrap.appendChild(actions);
      return wrap;
    }

    function renderDashboardSummary() {
      const dashboard = gid('dashboardSummary');
      if (!dashboard) return;
      const profiles = ['PTA','PT4','PTE'];
      dashboard.innerHTML = '';
      profiles.forEach(profile => {
        const items = collectItemsByProfile(profile);
        const types = ['server','hyperv','print','cctv','internet'];
        const statsByType = {};
        types.forEach(t => {
          statsByType[t] = { total: 0, online: 0, offline: 0 };
        });
        let totalOnline = 0;
        let totalOffline = 0;
        items.forEach(item => {
          const type = types.includes(item.type) ? item.type : 'server';
          const s = statsByType[type] || (statsByType[type] = { total: 0, online: 0, offline: 0 });
          s.total += 1;
          if (item.online === true) {
            s.online += 1;
            totalOnline += 1;
          } else if (item.online === false) {
            s.offline += 1;
            totalOffline += 1;
          }
        });
        const hasStatus = totalOnline + totalOffline > 0;
        let cardBorder = 'border-slate-200';
        let cardBg = 'bg-white';
        if (hasStatus) {
          if (totalOffline > 0) {
            cardBorder = 'border-red-200';
            cardBg = 'bg-red-50';
          } else if (totalOnline > 0) {
            cardBorder = 'border-emerald-200';
            cardBg = 'bg-emerald-50';
          }
        }
        let badgeText = 'ยังไม่ตรวจสอบ';
        let badgeClass = 'bg-slate-100 text-slate-600';
        if (hasStatus) {
          if (totalOffline > 0) {
            badgeText = `พบ OFFLINE ${totalOffline} รายการ`;
            badgeClass = 'bg-red-100 text-red-700';
          } else {
            badgeText = 'ออนไลน์ทั้งหมด';
            badgeClass = 'bg-emerald-100 text-emerald-700';
          }
        }
        const card = document.createElement('div');
        card.className = `border ${cardBorder} ${cardBg} rounded-xl p-4 space-y-3`;
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between';
        header.innerHTML = `
          <div class="font-semibold text-base">${profile}</div>
          <div class="flex flex-col items-end text-xs">
            <div class="px-2 py-0.5 rounded-full font-semibold ${badgeClass}">${badgeText}</div>
            <div class="mt-1 text-[11px] text-slate-500">${items.length} รายการทั้งหมด</div>
          </div>
        `;
        card.appendChild(header);
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs';
        types.forEach(type => {
          const stat = statsByType[type];
          if (!stat || stat.total === 0) return;
          const icon = TYPE_ICONS[type] || '🖥️';
          const label = TYPE_LABELS[type] || type;
          const typeRow = document.createElement('div');
          typeRow.className = 'flex items-center justify-between border border-slate-100 rounded-lg px-2 py-1.5';
          typeRow.innerHTML = `
            <div class="flex items-center gap-2">
              <span>${icon}</span>
              <span class="font-medium">${label}</span>
            </div>
            <div class="text-right">
              <div class="text-[11px] text-slate-500">ทั้งหมด ${stat.total}</div>
              <div class="text-[11px]">
                <span class="text-emerald-600">ON ${stat.online}</span>
                <span class="mx-1 text-slate-400">/</span>
                <span class="text-red-600">OFF ${stat.offline}</span>
              </div>
            </div>
          `;
          grid.appendChild(typeRow);
        });
        card.appendChild(grid);
        dashboard.appendChild(card);
      });
    }

    function renderGroups() {
      renderDashboardSummary();
      const container = gid('groupContainer');
      container.innerHTML = '';
      const renderSection = (profile, listRef, group) => {
        const section = document.createElement('div');
        section.className = 'border border-slate-200 rounded-xl p-4 space-y-4';
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between';
        header.innerHTML = `
          <div class="font-bold">${group}</div>
          <div class="flex gap-2">
            <button data-check="${group}" class="px-3 py-1.5 rounded-md bg-slate-100 text-slate-700 text-sm font-semibold hover:bg-slate-200">เช็คสถานะ</button>
            <button data-add="${group}" class="px-3 py-1.5 rounded-md bg-emerald-100 text-emerald-700 text-sm font-semibold hover:bg-emerald-200">เพิ่ม</button>
          </div>
        `;
        header.querySelector('[data-add]').addEventListener('click', () => {
          listRef.push({ name: '', ip: '', type: 'server', details: {} });
          renderGroups();
        });
        header.querySelector('[data-check]').addEventListener('click', () => checkGroup(group));
        section.appendChild(header);

        const items = buildItems(listRef, profile, group);
        const filtered = applyFilters(items);
        const cctvItems = filtered.filter(i => i.type === 'cctv');
        const serverItems = filtered.filter(i => i.type !== 'cctv');

        const buildCctvTable = () => {
          const block = document.createElement('div');
          block.className = 'space-y-2';
          const label = document.createElement('div');
          label.className = 'text-sm font-semibold text-slate-600';
          label.textContent = 'กลุ่ม CCTV';
          block.appendChild(label);
          const table = document.createElement('table');
          table.className = 'w-full text-sm';
          table.innerHTML = `
            <thead>
              <tr class="text-left text-slate-500 border-b">
                <th class="py-2 pr-3">ชื่อ</th>
                <th class="py-2 pr-3">IP</th>
                <th class="py-2 pr-3">รายละเอียด</th>
                <th class="py-2 pr-3">สถานะ</th>
                <th class="py-2 pr-3">ตรวจล่าสุด</th>
                <th class="py-2 text-right">จัดการ</th>
              </tr>
            </thead>
            <tbody></tbody>
          `;
          const tbody = table.querySelector('tbody');
          if (cctvItems.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="py-3 text-slate-400" colspan="6">ยังไม่มีรายการ</td>`;
            tbody.appendChild(tr);
          } else {
            const key = getPageKey(profile, group, 'cctv');
            const paged = paginateItems(cctvItems, key);
            paged.slice.forEach(item => tbody.appendChild(createCctvRow(listRef, item, group)));
            block.appendChild(table);
            block.appendChild(renderPager(key, paged.page, paged.totalPages));
            return block;
          }
          block.appendChild(table);
          return block;
        };

        const buildServerTable = () => {
          const block = document.createElement('div');
          block.className = 'space-y-2';
          const label = document.createElement('div');
          label.className = 'text-sm font-semibold text-slate-600';
          label.textContent = 'กลุ่มเซิร์ฟเวอร์';
          block.appendChild(label);
          const table = document.createElement('table');
          table.className = 'w-full text-sm';
          table.innerHTML = `
            <thead>
              <tr class="text-left text-slate-500 border-b">
                <th class="py-2 pr-3">ชื่อ</th>
                <th class="py-2 pr-3">IP</th>
                <th class="py-2 pr-3">ประเภท</th>
                <th class="py-2 pr-3">รายละเอียด</th>
                <th class="py-2 pr-3">สถานะ</th>
                <th class="py-2 pr-3">ตรวจล่าสุด</th>
                <th class="py-2 text-right">จัดการ</th>
              </tr>
            </thead>
            <tbody></tbody>
          `;
          const tbody = table.querySelector('tbody');
          if (serverItems.length === 0) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td class="py-3 text-slate-400" colspan="7">ยังไม่มีรายการ</td>`;
            tbody.appendChild(tr);
          } else {
            const key = getPageKey(profile, group, 'server');
            const paged = paginateItems(serverItems, key);
            paged.slice.forEach(item => tbody.appendChild(createServerRow(listRef, item, group)));
            block.appendChild(table);
            block.appendChild(renderPager(key, paged.page, paged.totalPages));
            return block;
          }
          block.appendChild(table);
          return block;
        };

        section.appendChild(buildCctvTable());
        section.appendChild(buildServerTable());
        container.appendChild(section);
      };

      if (!allMode) {
        const group = currentProfile;
        const listRef = config.groups[group] || [];
        renderSection(currentProfile, listRef, group);
        return;
      }

      ['PTA','PT4','PTE'].forEach(profile => {
        const listRef = configAll.profiles[profile]?.groups?.[profile] || [];
        renderSection(profile, listRef, profile);
      });
    }

    function collectItemsByProfile(profile) {
      const items = (configAll.profiles[profile]?.groups?.[profile] || []).map(normalizeItem);
      return items.map(item => {
        const key = makeKey(profile, item);
        const status = statusByKey[key];
        return { profile, ...item, online: status?.online };
      });
    }

    function renderAlerts() {
      const alertList = gid('alertList');
      const profiles = allMode ? ['PTA','PT4','PTE'] : [currentProfile];
      const alerts = [];
      profiles.forEach(profile => {
        collectItemsByProfile(profile).forEach(item => {
          if (item.online === false) alerts.push(item);
        });
      });
      alertList.innerHTML = '';
      if (alerts.length === 0) {
        alertList.innerHTML = '<div class="text-slate-400">ไม่มีแจ้งเตือน</div>';
        return;
      }
      alerts.forEach(item => {
        const typeLabel = TYPE_LABELS[item.type] || item.type;
        const icon = TYPE_ICONS[item.type] || '🖥️';
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between border border-red-200 bg-red-50 rounded-lg px-3 py-2';
        row.innerHTML = `<div class="flex items-center gap-2"><span>${icon}</span><span class="font-semibold">${item.profile}</span><span>${item.name || '-'}</span><span class="text-slate-500">${item.ip || '-'}</span><span class="text-red-600">${typeLabel}</span></div><div class="text-red-600 font-semibold">OFFLINE</div>`;
        alertList.appendChild(row);
      });
    }

    function renderReport() {
      const monthValue = gid('reportMonth').value;
      const summary = gid('reportSummary');
      if (!monthValue) {
        summary.innerHTML = '<div class="text-slate-400">กรุณาเลือกเดือน</div>';
        return;
      }
      const [year, month] = monthValue.split('-').map(Number);
      const rows = logsData.filter(item => {
        if (!item.time) return false;
        const d = new Date(item.time);
        return d.getFullYear() === year && (d.getMonth() + 1) === month;
      });
      if (rows.length === 0) {
        summary.innerHTML = '<div class="text-slate-400">ไม่มีข้อมูลในเดือนนี้</div>';
        return;
      }
      const stats = {};
      rows.forEach(log => {
        const profile = log.profile || '-';
        const results = Array.isArray(log.results) ? log.results : [];
        results.forEach(r => {
          const type = r.type || 'server';
          const key = `${profile}::${type}`;
          if (!stats[key]) stats[key] = { profile, type, total: 0, offline: 0 };
          stats[key].total += 1;
          if (r.online === false) stats[key].offline += 1;
        });
      });
      const entries = Object.values(stats);
      entries.sort((a, b) => a.profile.localeCompare(b.profile) || a.type.localeCompare(b.type));
      const table = document.createElement('table');
      table.className = 'w-full text-sm';
      table.innerHTML = `
        <thead>
          <tr class="text-left text-slate-500 border-b">
            <th class="py-2 pr-4">โปรไฟล์</th>
            <th class="py-2 pr-4">ประเภท</th>
            <th class="py-2 pr-4">จำนวนครั้ง</th>
            <th class="py-2 pr-4">ออฟไลน์</th>
          </tr>
        </thead>
        <tbody></tbody>
      `;
      const tbody = table.querySelector('tbody');
      entries.forEach(entry => {
        const tr = document.createElement('tr');
        tr.className = 'border-b';
        tr.innerHTML = `<td class="py-2 pr-4 font-semibold">${entry.profile}</td><td class="py-2 pr-4">${TYPE_LABELS[entry.type] || entry.type}</td><td class="py-2 pr-4">${entry.total}</td><td class="py-2 pr-4 text-red-600">${entry.offline}</td>`;
        tbody.appendChild(tr);
      });
      summary.innerHTML = '';
      summary.appendChild(table);
    }

    async function loadConfig() {
      const res = await fetch(`${API}?action=get_config`);
      const data = await res.json();
      if (data.status === 'success') {
        const incoming = data.data || {};
        if (incoming.profiles) {
          configAll = incoming;
        } else if (incoming.groups) {
          configAll = { profiles: { PTA: { groups: incoming.groups }, PT4: { groups: { PTA: [], PT4: [], PTE: [] } }, PTE: { groups: { PTA: [], PT4: [], PTE: [] } } } };
        }
        ['PTA','PT4','PTE'].forEach(p => {
          if (!configAll.profiles[p]) configAll.profiles[p] = { groups: { PTA: [], PT4: [], PTE: [] } };
          if (!configAll.profiles[p].groups) configAll.profiles[p].groups = { PTA: [], PT4: [], PTE: [] };
          if (!Array.isArray(configAll.profiles[p].groups[p])) configAll.profiles[p].groups[p] = [];
        });
        if (!configAll.profiles[currentProfile]) currentProfile = 'PTA';
        config = configAll.profiles[currentProfile];
      }
      renderGroups();
    }

    async function saveConfig() {
      configAll.profiles[currentProfile] = config;
      const res = await fetch(`${API}?action=save_config`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(configAll)
      });
      const data = await res.json();
      if (data.status === 'success') {
        Swal.fire('สำเร็จ', 'บันทึกเรียบร้อยแล้ว', 'success');
      } else {
        Swal.fire('ผิดพลาด', data.message || 'บันทึกไม่สำเร็จ', 'error');
      }
    }

    function updateLastCheck() {
      if (!lastCheckedAt) return;
      const text = new Date(lastCheckedAt).toLocaleString('th-TH');
      gid('lastCheck').textContent = `สถานะออนไลน์ล่าสุด: ${text}`;
    }

    async function checkGroup(group) {
      if (allMode && group === 'ALL') {
        const profiles = ['PTA','PT4','PTE'];
        for (const profile of profiles) {
          await checkGroup(profile);
        }
        return;
      }
      const profileParam = allMode ? group : currentProfile;
      const res = await fetch(`${API}?action=check_group&group=${encodeURIComponent(group)}&profile=${encodeURIComponent(profileParam)}`);
      const data = await res.json();
      if (data.status !== 'success') {
        Swal.fire('ผิดพลาด', data.message || 'ตรวจสอบไม่สำเร็จ', 'error');
        return;
      }
      const groups = data.data?.groups || {};
      Object.keys(groups).forEach(g => {
        const items = Array.isArray(groups[g]) ? groups[g] : [];
        items.forEach(item => {
          const key = makeKey(g, item);
          statusByKey[key] = { online: !!item.online, checkedAt: item.checkedAt || data.data?.time || null };
        });
      });
      lastCheckedAt = data.data?.time || new Date().toISOString();
      updateLastCheck();
      renderGroups();
      renderAlerts();
      loadLogs();
    }

    function formatResult(results) {
      return results.map(r => {
        const icon = r.online ? '✅' : '❌';
        const state = r.online ? 'ONLINE' : 'OFFLINE';
        const typeLabel = TYPE_LABELS[r.type || 'server'] || (r.type || 'server');
        return `${icon} ${r.name}: ${state} (${typeLabel})`;
      }).join(' ');
    }

    async function loadLogs() {
      const res = await fetch(`${API}?action=get_logs&limit=200`);
      const data = await res.json();
      const table = gid('logTable');
      table.innerHTML = '';
      logsData = Array.isArray(data.data) ? data.data : [];
      if (data.status !== 'success' || !Array.isArray(data.data) || data.data.length === 0) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="py-3 text-slate-400" colspan="4">ยังไม่มีข้อมูล</td>`;
        table.appendChild(tr);
        renderReport();
        return;
      }
      data.data.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'border-b';
        const time = item.time ? new Date(item.time).toLocaleString('th-TH') : '-';
        const group = item.group || '-';
        const results = Array.isArray(item.results) ? formatResult(item.results) : '-';
        const profile = item.profile || '-';
        tr.innerHTML = `<td class="py-2 pr-4 whitespace-nowrap">${time}</td><td class="py-2 pr-4 font-semibold">${profile}</td><td class="py-2 pr-4 font-semibold">${group}</td><td class="py-2">${results}</td>`;
        table.appendChild(tr);
      });
      renderReport();
    }

    function updateAllModeUI() {
      gid('allModeToggle').checked = allMode;
      gid('allFilters').classList.remove('hidden');
      gid('profileSelect').disabled = allMode;
      gid('profileSelect').classList.toggle('opacity-50', allMode);
    }

    gid('saveBtn').addEventListener('click', saveConfig);
    gid('refreshLogsBtn').addEventListener('click', loadLogs);
    gid('refreshAlertsBtn').addEventListener('click', renderAlerts);
    gid('checkAllBtn').addEventListener('click', () => checkGroup('ALL'));
    gid('profileSelect').value = currentProfile;
    gid('profileSelect').addEventListener('change', (e) => {
      currentProfile = e.target.value;
      localStorage.setItem('server_status_profile', currentProfile);
      config = configAll.profiles[currentProfile] || { groups: { PTA: [], PT4: [], PTE: [] } };
      renderGroups();
    });
    gid('allModeToggle').addEventListener('change', (e) => {
      allMode = e.target.checked;
      localStorage.setItem('server_status_all_mode', allMode ? '1' : '0');
      updateAllModeUI();
      renderGroups();
      renderAlerts();
    });
    ['filterText','filterType','filterStatus','filterTime','sortBy'].forEach(id => {
      gid(id).addEventListener('input', () => {
        renderGroups();
      });
      gid(id).addEventListener('change', () => {
        renderGroups();
      });
    });

    let autoChecking = false;
    async function autoRefresh() {
      if (autoChecking) return;
      autoChecking = true;
      try {
        if (allMode) await checkGroup('ALL');
        else await checkGroup(currentProfile);
      } finally {
        autoChecking = false;
      }
    }

    gid('reportMonth').value = new Date().toISOString().slice(0, 7);
    gid('reportMonth').addEventListener('change', renderReport);
    updateAllModeUI();
    loadConfig();
    loadLogs();
    renderAlerts();
    setInterval(autoRefresh, 60 * 1000);
  </script>
</body>
</html>
